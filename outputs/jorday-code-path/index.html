tput:\n\n```text\nAccount owner name: Sam\nWelcome, Sam! You start with $100.00.\n\n1) Check balance\n2) Deposit\n3) Withdraw\n4) History\n5) Quit\nChoose: 2\nAmount: 50\nDeposited $50.00. New balance: $150.00\nChoose: 3\nAmount: 500\nWithdrawal failed: invalid amount or not enough money.\nChoose: 3\nAmount: 30.5\nWithdrew $30.50. New balance: $119.50\nChoose: 2\nAmount: abc\nDeposit failed: amount must be a positive number.\nChoose: 9\nPlease choose a number from 1 to 5.\nChoose: 4\n--- History for Sam ---\n1. Opened with $100.00\n2. Deposited $50.00\n3. Withdrew $30.50\nChoose: 5\nGoodbye, Sam!\n```\n\n(Decimal formatting follows your computer's region settings. In a few regions you may see a comma instead of a decimal point. That is normal.)\n\n**What this project used:** classes, constructors, `this`, `private` fields and getters (Module 10), an `ArrayList` (11), a `while` loop and a `for` loop (7), the arrow `switch` (6), methods with return values (9), `Scanner` input (4), `printf` and `String.format` (2), and `try/catch` (12).\n\n### Common mistakes\n- Putting `Account` above `BankApp` in the file, so `java BankApp.java` complains it cannot find `main`. The main class goes first.\n- Reading a menu choice with `nextInt()` and then `nextLine()`, and falling into the Scanner trap.\n- Declaring `double amount` twice in the same `case` without braces. Each multi-line arrow case needs its own `{ }` block, which is what gives each `amount` its own scope.\n- Forgetting to add to `history` when a transaction succeeds.\n- Making `balance` public, so any code can change it without rules.\n\n### Practice\n1. Add a menu option `6) Transfer interest`: add 2% of the balance as a deposit and record it in the history as `Interest`.\n2. Add a daily withdrawal limit of $200 (track the total withdrawn since the program started) and refuse withdrawals past it with a clear message.\n3. Stretch: change the program to hold an `ArrayList<Account>`. At the start, ask which account to use by name, creating a new one if the name does not exist yet.\n\n<details><summary>Solutions<\/summary>\n\n```java\n// 1. Add to Account (new method), then add a case \"6\" and a menu line in BankApp.\n    boolean addInterest() {\n        double interest = balance * 0.02;\n        if (interest > 0) {\n            balance += interest;\n            history.add(String.format(\"Interest $%.2f\", interest));\n            return true;\n        }\n        return false;\n    }\n// In BankApp's switch:\n//     case \"6\" -> {\n//         if (account.addInterest()) {\n//             System.out.printf(\"Interest added. New balance: $%.2f%n\", account.getBalance());\n//         } else {\n//             System.out.println(\"No interest to add.\");\n//         }\n//     }\n\n// 2. In Account, add a field and change withdraw:\n    private double withdrawnTotal = 0;\n\n    boolean withdraw(double amount) {\n        if (amount > 0 && amount <= balance && withdrawnTotal + amount <= 200) {\n            balance -= amount;\n            withdrawnTotal += amount;\n            history.add(String.format(\"Withdrew $%.2f\", amount));\n            return true;\n        }\n        return false;\n    }\n// To give a clearer message, add a method boolean overLimit(double amount)\n// returning withdrawnTotal + amount > 200, and check it in BankApp\n// before calling withdraw.\n\n// 3. Sketch: a helper in BankApp that searches the list.\n    static Account findOrCreate(ArrayList<Account> accounts, String name) {\n        for (Account a : accounts) {\n            if (a.getOwner().equalsIgnoreCase(name)) {\n                return a;\n            }\n        }\n        Account created = new Account(name, 100.00);\n        accounts.add(created);\n        return created;\n    }\n// In main: ArrayList<Account> accounts = new ArrayList<>();\n//          Account account = findOrCreate(accounts, owner);\n// (BankApp needs `import java.util.ArrayList;`, which it already has.)\n```\n\n<\/details>\n", "java-intermediate": "# Java — Intermediate\n\nYou already know how to write a working Java program: variables, loops, methods, arrays, and a first taste of classes and `ArrayList`. This level is about writing Java the way professionals write it. You will learn to model a problem with well-designed classes and interfaces, handle failure deliberately with exceptions, pick the right collection for the job, write reusable code with generics, process data declaratively with lambdas and streams, use the modern data features (records, enums, sealed types, pattern matching) that make Java 21 and 25 feel very different from Java 8, and read and write files with `java.nio`. The course targets Java 21 or newer (Java 25 is the current long-term-support release); every example compiles on Java 21 unless it says otherwise. To run any example, save it as `Main.java` and run `java Main.java`. When a file has several top-level classes, the class that contains `main` must come first in the file. Each module ends with practice problems and solutions; try them before you open the solutions.\n\n## Module 1: Object-Oriented Programming in Depth\n**Goal:** Use encapsulation, inheritance, polymorphism, abstract classes and interfaces to design classes that are safe to use and easy to extend.\n\nYou already know how to write a class. The real skill is deciding what a class should expose and what it should hide.\n\n**Encapsulation** means a class owns its data and controls every change to it. Fields are `private`; the outside world uses methods. The reason is not ceremony. It is that a class can then guarantee its own rules (an invariant): a bank balance never goes negative, a name is never null. If the field were public, any code anywhere could break the rule and you could never find out who did it.\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        BankAccount acct = new BankAccount(\"Jorday\", 100);\n        acct.deposit(50);\n        acct.withdraw(30);\n        System.out.println(acct.owner() + \" has $\" + acct.balance());\n        try {\n            acct.withdraw(1000);\n        } catch (IllegalStateException e) {\n            System.out.println(\"Rejected: \" + e.getMessage());\n        }\n    }\n}\n\nclass BankAccount {\n    private final String owner;\n    private int balance;\n\n    BankAccount(String owner, int openingBalance) {\n        if (openingBalance < 0) {\n            throw new IllegalArgumentException(\"opening balance must not be negative\");\n        }\n        this.owner = owner;\n        this.balance = openingBalance;\n    }\n\n    String owner() { return owner; }\n    int balance() { return balance; }\n\n    void deposit(int amount) {\n        if (amount <= 0) {\n            throw new IllegalArgumentException(\"deposit must be positive\");\n        }\n        balance += amount;\n    }\n\n    void withdraw(int amount) {\n        if (amount > balance) {\n            throw new IllegalStateException(\n                \"Insufficient funds: balance \" + balance + \", requested \" + amount);\n        }\n        balance -= amount;\n    }\n}\n```\n\nOutput:\n```text\nJorday has $120\nRejected: Insufficient funds: balance 120, requested 1000\n```\n\nNotice there is no `setBalance`. Not every field needs a getter and setter. Expose behavior (`deposit`, `withdraw`), not raw data. Also notice `owner` is `final`: it is set once in the constructor and can never change. Prefer `final` fields whenever you can; immutable objects are far easier to reason about.\n\n**Inheritance** lets a class reuse and specialize another with `extends`. **Polymorphism** means a variable of the parent type can hold any child, and the child's overridden method runs. Java decides which method to run at runtime based on the actual object, not the variable's type.\n\nAn **abstract class** is a partly finished class. It can hold fields and finished methods, but it also declares `abstract` methods that every subclass must fill in. You cannot create an instance of it directly. An **interface** is a pure contract: a set of methods a class promises to provide. A class can extend only one class but implement many interfaces. Interfaces can also have `default` methods, which give implementers a free, overridable behavior.\n\n```java\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Animal> animals = List.of(new Dog(\"Rex\"), new Cat(\"Mia\"));\n        for (Animal a : animals) {\n            System.out.println(a.describe());\n            if (a instanceof Trainable t) {\n                t.train();\n            }\n        }\n    }\n}\n\nabstract class Animal {\n    private final String name;\n\n    protected Animal(String name) { this.name = name; }\n\n    public String name() { return name; }\n\n    public abstract String sound();\n\n    public String describe() { return name + \" says \" + sound(); }\n}\n\ninterface Trainable {\n    default void train() { System.out.println(\"Training with treats\"); }\n}\n\nclass Dog extends Animal implements Trainable {\n    Dog(String name) { super(name); }\n\n    @Override\n    public String sound() { return \"Woof\"; }\n}\n\nclass Cat extends Animal {\n    Cat(String name) { super(name); }\n\n    @Override\n    public String sound() { return \"Meow\"; }\n}\n```\n\nOutput:\n```text\nRex says Woof\nTraining with treats\nMia says Meow\n```\n\nThree things to see here. `describe()` is written once in `Animal` but calls `sound()`, which resolves to `Dog`'s or `Cat`'s version at runtime. That is polymorphism. `@Override` asks the compiler to check you really are overriding something, so a typo becomes a compile error instead of a silent bug. And `a instanceof Trainable t` is a pattern match: it tests the type and gives you a correctly typed variable `t` in one step, with no cast.\n\n**When to use which.** Use an interface to describe a capability that unrelated classes can share (`Comparable`, `Runnable`, `Trainable`). Use an abstract class when subclasses share real state and code. If in doubt, start with an interface.\n\n**Prefer composition over inheritance.** Inheritance is a very tight coupling: a subclass depends on the parent's internals. \"Has-a\" is usually better than \"is-a\". Instead of making `OrderService` extend a logging class, give it a logger it can use.\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        Logger logger = new ConsoleLogger();\n        OrderService service = new OrderService(logger);\n        service.place(\"book\");\n    }\n}\n\ninterface Logger {\n    void log(String message);\n}\n\nclass ConsoleLogger implements Logger {\n    @Override\n    public void log(String message) { System.out.println(\"[LOG] \" + message); }\n}\n\nclass OrderService {\n    private final Logger logger;\n\n    OrderService(Logger logger) { this.logger = logger; }\n\n    void place(String item) { logger.log(\"Placed order for \" + item); }\n}\n```\n\nOutput:\n```text\n[LOG] Placed order for book\n```\n\n`OrderService` depends on the `Logger` interface, not on `ConsoleLogger`. Tomorrow you can pass a file logger or a silent test logger without touching `OrderService`. This idea comes back in the Expert level as dependency injection.\n\n**New in Java 25: statements before `super(...)`.** For years, `super(...)` had to be the first line of a constructor, which made it awkward to validate arguments first. Flexible constructor bodies (JEP 513) are final in Java 25: you may run code before `super(...)`, as long as it does not use `this`. On Java 21 the example below does not compile; the usual workaround is a static helper, like `super(check(value))`.\n\n```java\n// Requires Java 25 or newer\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(new Positive(5).value());\n        try {\n            new Positive(-1);\n        } catch (IllegalArgumentException e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}\n\nclass Base {\n    private final int value;\n\n    Base(int value) { this.value = value; }\n\n    int value() { return value; }\n}\n\nclass Positive extends Base {\n    Positive(int value) {\n        if (value <= 0) {\n            throw new IllegalArgumentException(\"must be positive: \" + value);\n        }\n        super(value);\n    }\n}\n```\n\nOutput:\n```text\n5\nmust be positive: -1\n```\n\n### Common mistakes\n- Making fields `public` \"to save time\". You lose the ability to enforce any rule on them.\n- Adding a getter and setter for every field. That is just a public field with extra typing. Expose behavior instead.\n- Using inheritance only to reuse code. If the relationship is not truly \"is-a\", use composition.\n- Forgetting `@Override`, then writing `describe(int x)` instead of overriding `describe()`. The compiler cannot warn you without the annotation.\n- Forgetting that an abstract class's constructor still runs. Subclass constructors must call `super(...)` with the arguments it needs.\n- Confusing overriding and overloading. Overriding (same signature, in a subclass) is resolved at runtime; overloading (same name, different parameters) is resolved at compile time from the variable's declared type.\n\n### Practice\n1. Create an abstract class `Vehicle` with an abstract method `wheels()` and a concrete `describe()` that prints \"<ClassName> with N wheels\". Add subclasses `Car` (4) and `Bike` (2) and print a `List<Vehicle>`.\n2. Create an interface `Flyable` with a `default` method `fly()` that prints \"Flying!\". Make a class `Drone` implement it and call `fly()` without writing the method in `Drone`.\n3. Write a class `Temperature` that stores Celsius privately. Its constructor and a `setCelsius` method must reject values below -273.15 with an `IllegalArgumentException`. Add `fahrenheit()` that computes from the stored value.\n\n<details><summary>Solutions<\/summary>\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        java.util.List<Vehicle> vehicles = java.util.List.of(new Car(), new Bike());\n        for (Vehicle v : vehicles) {\n            System.out.println(v.describe());\n        }\n\n        new Drone().fly();\n\n        Temperature t = new Temperature(100);\n        System.out.println(t.fahrenheit());\n        try {\n            t.setCelsius(-300);\n        } catch (IllegalArgumentException e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}\n\n// Exercise 1\nabstract class Vehicle {\n    abstract int wheels();\n\n    String describe() {\n        return getClass().getSimpleName() + \" with \" + wheels() + \" wheels\";\n    }\n}\n\nclass Car extends Vehicle {\n    @Override int wheels() { return 4; }\n}\n\nclass Bike extends Vehicle {\n    @Override int wheels() { return 2; }\n}\n\n// Exercise 2\ninterface Flyable {\n    default void fly() { System.out.println(\"Flying!\"); }\n}\n\nclass Drone implements Flyable {}\n\n// Exercise 3\nclass Temperature {\n    private double celsius;\n\n    Temperature(double celsius) { setCelsius(celsius); }\n\n    void setCelsius(double celsius) {\n        if (celsius < -273.15) {\n            throw new IllegalArgumentException(\"below absolute zero: \" + celsius);\n        }\n        this.celsius = celsius;\n    }\n\n    double fahrenheit() { return celsius * 9 / 5 + 32; }\n}\n// Output:\n// Car with 4 wheels\n// Bike with 2 wheels\n// Flying!\n// 212.0\n// below absolute zero: -300.0\n```\n\n<\/details>\n\n## Module 2: Exceptions\n**Goal:** Handle errors deliberately by choosing between checked and unchecked exceptions, cleaning up with try-with-resources, and writing your own exception types.\n\nAn exception is an object that represents \"something went wrong\" and unwinds the call stack until some `catch` handles it. Java splits exceptions into two families, and the difference matters for design.\n\n- **Checked exceptions** extend `Exception` (but not `RuntimeException`). The compiler forces you to either catch them or declare them with `throws`. `IOException` is the classic one. Use checked exceptions for failures the caller can reasonably recover from and should be made to think about.\n- **Unchecked exceptions** extend `RuntimeException`. The compiler does not force anything. `NullPointerException`, `IllegalArgumentException` and `NumberFormatException` are unchecked. They usually signal a programming error, such as a bad argument or a broken assumption, that the caller could not meaningfully recover from.\n- `Error` (such as `OutOfMemoryError`) means the JVM itself is in trouble. Do not catch these in normal code.\n\n```java\nimport java.io.IOException;\n\npublic class Main {\n    static int parse(String s) {\n        return Integer.parseInt(s);\n    }\n\n    static void load(String name) throws IOException {\n        if (name.isBlank()) {\n            throw new IOException(\"name is blank\");\n        }\n        System.out.println(\"Loaded \" + name);\n    }\n\n    public static void main(String[] args) {\n        try {\n            System.out.println(parse(\"42\"));\n            System.out.println(parse(\"abc\"));\n        } catch (NumberFormatException e) {\n            System.out.println(\"Bad number: \" + e.getMessage());\n        } finally {\n            System.out.println(\"parse demo done\");\n        }\n\n        try {\n            load(\"config\");\n            load(\" \");\n        } catch (IOException e) {\n            System.out.println(\"IO problem: \" + e.getMessage());\n        }\n    }\n}\n```\n\nOutput:\n```text\n42\nBad number: For input string: \"abc\"\nparse demo done\nLoaded config\nIO problem: name is blank\n```\n\n`finally` always runs, whether the `try` succeeded or threw. It is for cleanup. But there is a better tool for cleanup.\n\n**try-with-resources.** Anything that must be closed (files, database connections, network sockets) implements `AutoCloseable`. Put it in the parentheses after `try` and Java closes it for you, in reverse order, even if an exception is thrown. This replaces the error-prone `finally { x.close(); }` pattern, where a second exception in `close()` could hide the first.\n\n```java\npublic class Main {\n    static class Resource implements AutoCloseable {\n        private final String name;\n\n        Resource(String name) {\n            this.name = name;\n            System.out.println(\"open \" + name);\n        }\n\n        void use() { System.out.println(\"use \" + name); }\n\n        @Override\n        public void close() { System.out.println(\"close \" + name); }\n    }\n\n    public static void main(String[] args) {\n        try (Resource a = new Resource(\"A\"); Resource b = new Resource(\"B\")) {\n            a.use();\n            b.use();\n            throw new IllegalStateException(\"boom\");\n        } catch (IllegalStateException e) {\n            System.out.println(\"caught \" + e.getMessage());\n        }\n    }\n}\n```\n\nOutput:\n```text\nopen A\nopen B\nuse A\nuse B\nclose B\nclose A\ncaught boom\n```\n\nThe resources are closed before the `catch` block runs, in the reverse order they were opened.\n\n**Custom exceptions.** Create your own when callers need to tell your failure apart from others, or to carry extra data. Extend `Exception` for checked, `RuntimeException` for unchecked. Always accept a `cause` so you can **chain** exceptions: when you catch a low-level exception and throw a higher-level one, pass the original along so the full story survives in the stack trace.\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        try {\n            withdraw(20, 50);\n        } catch (InsufficientFundsException e) {\n            System.out.println(e.getMessage() + \" (short by \" + e.shortfall() + \")\");\n        }\n\n        try {\n            readConfig();\n        } catch (ConfigException e) {\n            System.out.println(e.getMessage() + \" <- \" + e.getCause().getClass().getSimpleName());\n        }\n    }\n\n    static void withdraw(int balance, int amount) throws InsufficientFundsException {\n        if (amount > balance) {\n            throw new InsufficientFundsException(amount - balance);\n        }\n    }\n\n    static void readConfig() {\n        try {\n            Integer.parseInt(\"x8080\");\n        } catch (NumberFormatException e) {\n            throw new ConfigException(\"Invalid port in config\", e);\n        }\n    }\n}\n\nclass InsufficientFundsException extends Exception {\n    private final int shortfall;\n\n    InsufficientFundsException(int shortfall) {\n        super(\"Insufficient funds\");\n        this.shortfall = shortfall;\n    }\n\n    int shortfall() { return shortfall; }\n}\n\nclass ConfigException extends RuntimeException {\n    ConfigException(String message, Throwable cause) { super(message, cause); }\n}\n```\n\nOutput:\n```text\nInsufficient funds (short by 30)\nInvalid port in config <- NumberFormatException\n```\n\n**Rules of thumb.**\n- Throw the most specific exception that fits (`IllegalArgumentException` for a bad argument, `IllegalStateException` when the object is in the wrong state).\n- Catch only what you can actually handle. If you cannot do anything useful, let it propagate.\n- Never swallow an exception with an empty `catch`. At minimum, log it.\n- Use multi-catch to share a handler: `catch (IOException | SQLException e)`.\n- Do not use exceptions for normal control flow. Check a condition instead of catching the failure when you can.\n\n### Common mistakes\n- Empty catch blocks: `catch (Exception e) {}`. The program fails silently and you lose hours debugging.\n- Catching `Exception` or `Throwable` everywhere. You will catch bugs you did not mean to hide, including `InterruptedException`.\n- Throwing a new exception without the cause: `throw new ConfigException(\"bad\")` throws away the original stack trace. Pass `e` as the cause.\n- Closing resources by hand in `finally` instead of try-with-resources.\n- Making every custom exception checked. This forces `throws` clauses up through every layer of code; checked exceptions are for recoverable failures only.\n- Putting a `return` inside `finally`. It overrides any exception that was in flight.\n\n### Practice\n1. Write `static int parseAge(String s)`. It should throw a custom unchecked `InvalidAgeException` when the text is not a number or when the age is outside 0 to 150. When the cause is a `NumberFormatException`, keep it as the cause.\n2. Write a class `Timer implements AutoCloseable` that prints \"start\" in the constructor and \"stop\" in `close()`. Use it in a try-with-resources block whose body throws an exception, and show that \"stop\" still prints.\n3. You have `static String read(String name) throws IOException`. Use it inside `names.stream().map(...)`. Streams cannot throw checked exceptions, so wrap the `IOException` in an `UncheckedIOException`.\n\n<details><summary>Solutions<\/summary>\n\n```java\nimport java.io.IOException;\nimport java.io.UncheckedIOException;\nimport java.util.List;\n\npublic class Main {\n    // Exercise 1\n    static int parseAge(String s) {\n        int age;\n        try {\n            age = Integer.parseInt(s);\n        } catch (NumberFormatException e) {\n            throw new InvalidAgeException(\"not a number: \" + s, e);\n        }\n        if (age < 0 || age > 150) {\n            throw new InvalidAgeException(\"out of range: \" + age, null);\n        }\n        return age;\n    }\n\n    // Exercise 3\n    static String read(String name) throws IOException {\n        if (name.equals(\"bad\")) {\n            throw new IOException(\"cannot read bad\");\n        }\n        return name.toUpperCase();\n    }\n\n    public static void main(String[] args) {\n        System.out.println(parseAge(\"30\"));\n        try {\n            parseAge(\"abc\");\n        } catch (InvalidAgeException e) {\n            System.out.println(e.getMessage() + \" / cause: \" + e.getCause().getClass().getSimpleName());\n        }\n\n        // Exercise 2\n        try (Timer t = new Timer()) {\n            throw new IllegalStateException(\"oops\");\n        } catch (IllegalStateException e) {\n            System.out.println(\"caught \" + e.getMessage());\n        }\n\n        // Exercise 3\n        try {\n            List<String> out = List.of(\"a\", \"bad\", \"c\").stream()\n                .map(n -> {\n                    try {\n                        return read(n);\n                    } catch (IOException e) {\n                        throw new UncheckedIOException(e);\n                    }\n                })\n                .toList();\n            System.out.println(out);\n        } catch (UncheckedIOException e) {\n            System.out.println(\"failed: \" + e.getCause().getMessage());\n        }\n    }\n}\n\nclass InvalidAgeException extends RuntimeException {\n    InvalidAgeException(String message, Throwable cause) { super(message, cause); }\n}\n\nclass Timer implements AutoCloseable {\n    Timer() { System.out.println(\"start\"); }\n\n    @Override\n    public void close() { System.out.println(\"stop\"); }\n}\n// Output:\n// 30\n// not a number: abc / cause: NumberFormatException\n// start\n// stop\n// caught oops\n// failed: cannot read bad\n```\n\n<\/details>\n\n## Module 3: The Collections Framework\n**Goal:** Choose the right List, Set, Map or Queue for a task, and make your own classes work correctly inside them with `equals` and `hashCode`.\n\nYou know `ArrayList` and arrays. The Collections framework gives you a whole family of ready-made data structures, all programmed against interfaces. Always declare variables by the interface (`List<String> names = new ArrayList<>()`), not the implementation. Then you can swap implementations later without touching the rest of your code.\n\n| Interface | Meaning | Common implementations |\n|---|---|---|\n| `List` | Ordered, allows duplicates, access by index | `ArrayList` (default choice), `LinkedList` (rarely better) |\n| `Set` | No duplicates | `HashSet` (fastest, no order), `LinkedHashSet` (insertion order), `TreeSet` (sorted) |\n| `Map` | Key to value, unique keys | `HashMap` (default), `LinkedHashMap` (insertion order), `TreeMap` (sorted by key) |\n| `Queue` / `Deque` | Process in order (queue) or from both ends (stack) | `ArrayDeque` (use this for both stacks and queues) |\n\n**How to choose.** Need an ordered sequence you read by position? `ArrayList`. Need to ask \"have I seen this?\" fast, or remove duplicates? `HashSet`. Need to look something up by a key? `HashMap`. Need the keys sorted? `TreeMap`/`TreeSet`. Need a stack or a queue? `ArrayDeque`. Need to keep the insertion order but also get Set/Map speed? The `Linked...` versions.\n\nSince Java 21, `List`, `Deque`, `LinkedHashSet` and friends are **sequenced collections** with `getFirst()`, `getLast()` and `reversed()` built in.\n\n```java\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<String> names = new ArrayList<>(List.of(\"Mia\", \"Rex\", \"Mia\", \"Zed\"));\n        Set<String> unique = new TreeSet<>(names);\n        Map<String, Integer> counts = new TreeMap<>();\n        for (String n : names) {\n            counts.merge(n, 1, Integer::sum);\n        }\n        System.out.println(names);\n        System.out.println(unique);\n        System.out.println(counts);\n        System.out.println(counts.getOrDefault(\"Nobody\", 0));\n        System.out.println(names.getFirst() + \" \" + names.getLast() + \" \" + names.reversed());\n    }\n}\n```\n\nOutput:\n```text\n[Mia, Rex, Mia, Zed]\n[Mia, Rex, Zed]\n{Mia=2, Rex=1, Zed=1}\n0\nMia Zed [Zed, Mia, Rex, Mia]\n```\n\n`merge(key, 1, Integer::sum)` means: if the key is absent, store 1; otherwise combine the old value and 1 with `Integer::sum`. It is the cleanest way to count.\n\n**Immutable collections.** `List.of(...)`, `Set.of(...)` and `Map.of(...)` create collections that cannot be changed (and reject `null`). Calling `add` on them throws `UnsupportedOperationException`. Use them for constants and for returning data you do not want callers to modify. Wrap in `new ArrayList<>(...)` if you need a modifiable copy, as above.\n\n**equals and hashCode.** `HashSet` and `HashMap` find items using `hashCode()` first (to pick a bucket) and `equals()` second (to confirm a match). By default both are based on object identity, so two objects with identical contents are \"different\". If you want value-based equality, override both, and keep this contract: *if two objects are equal, they must have the same hash code*.\n\n```java\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Set<BadPoint> bad = new HashSet<>();\n        bad.add(new BadPoint(1, 2));\n        System.out.println(bad.contains(new BadPoint(1, 2)));\n\n        Set<GoodPoint> good = new HashSet<>();\n        good.add(new GoodPoint(1, 2));\n        System.out.println(good.contains(new GoodPoint(1, 2)));\n    }\n}\n\nclass BadPoint {\n    final int x, y;\n\n    BadPoint(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}\n\nclass GoodPoint {\n    final int x, y;\n\n    GoodPoint(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    @Override\n    public boolean equals(Object o) {\n        if (this == o) return true;\n        if (!(o instanceof GoodPoint p)) return false;\n        return x == p.x && y == p.y;\n    }\n\n    @Override\n    public int hashCode() {\n        return Objects.hash(x, y);\n    }\n}\n```\n\nOutput:\n```text\nfalse\ntrue\n```\n\nWriting these by hand is boilerplate, which is why Module 7 introduces records: a record generates correct `equals`, `hashCode` and `toString` for you. Also, never use a mutable field in `hashCode` for an object you store in a hash collection; if the field changes after insertion, the object is lost in the wrong bucket.\n\n**Iterating maps, and queues/stacks.**\n\n```java\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Map<String, List<String>> byInitial = new TreeMap<>();\n        for (String w : List.of(\"apple\", \"avocado\", \"banana\", \"blueberry\", \"cherry\")) {\n            byInitial.computeIfAbsent(w.substring(0, 1), k -> new ArrayList<>()).add(w);\n        }\n        for (Map.Entry<String, List<String>> e : byInitial.entrySet()) {\n            System.out.println(e.getKey() + \" -> \" + e.getValue());\n        }\n\n        Deque<Integer> stack = new ArrayDeque<>();\n        stack.push(1);\n        stack.push(2);\n        stack.push(3);\n        System.out.println(stack.pop() + \" \" + stack.peek());\n\n        Queue<String> queue = new ArrayDeque<>();\n        queue.offer(\"first\");\n        queue.offer(\"second\");\n        System.out.println(queue.poll() + \" \" + queue.size());\n    }\n}\n```\n\nOutput:\n```text\na -> [apple, avocado]\nb -> [banana, blueberry]\nc -> [cherry]\n3 2\nfirst 1\n```\n\n`computeIfAbsent` creates the list the first time a key shows up, then returns it so you can add to it. A stack is last-in-first-out (`push`/`pop`); a queue is first-in-first-out (`offer`/`poll`).\n\n### Common mistakes\n- Removing from a list while looping over it with a for-each. That throws `ConcurrentModificationException`. Use `list.removeIf(...)` or an `Iterator`.\n- Calling `add` on `List.of(...)` or on `Arrays.asList(...)`. The first is immutable; the second has a fixed size.\n- Overriding `equals` but not `hashCode` (or the reverse). Hash collections then behave randomly.\n- Using `==` to compare strings or boxed `Integer`s. Use `.equals()`.\n- Using a mutable object as a `HashMap` key and then changing it.\n- Reaching for `LinkedList` \"because insertion is O(1)\". In practice `ArrayList` and `ArrayDeque` win almost every time because of memory locality.\n- Declaring `ArrayList<String> x` instead of `List<String> x`, which locks you to one implementation.\n\n### Practice\n1. Count how many times each word appears in `\"the cat and the hat and the bat\"` using a `Map`. Print the result sorted alphabetically by word.\n2. Write a `Student` class with `name` and `id`. Make two students equal when their `id`s match. Add three students (two with the same id) to a `HashSet` and print its size.\n3. Write `static boolean balanced(String s)` that uses a `Deque<Character>` to check whether `()`, `[]` and `{}` are properly balanced.\n\n<details><summary>Solutions<\/summary>\n\n```java\nimport java.util.*;\n\npublic class Main {\n    // Exercise 3\n    static boolean balanced(String s) {\n        Deque<Character> stack = new ArrayDeque<>();\n        for (char c : s.toCharArray()) {\n            switch (c) {\n                case '(', '[', '{' -> stack.push(c);\n                case ')' -> {\n                    if (stack.isEmpty() || stack.pop() != '(') return false;\n                }\n                case ']' -> {\n                    if (stack.isEmpty() || stack.pop() != '[') return false;\n                }\n                case '}' -> {\n                    if (stack.isEmpty() || stack.pop() != '{') return false;\n                }\n                default -> { }\n            }\n        }\n        return stack.isEmpty();\n    }\n\n    public static void main(String[] args) {\n        // Exercise 1\n        Map<String, Integer> freq = new TreeMap<>();\n        for (String w : \"the cat and the hat and the bat\".split(\" \")) {\n            freq.merge(w, 1, Integer::sum);\n        }\n        System.out.println(freq);\n\n        // Exercise 2\n        Set<Student> students = new HashSet<>();\n        students.add(new Student(\"Ana\", 1));\n        students.add(new Student(\"Ben\", 2));\n        students.add(new Student(\"Ana again\", 1));\n        System.out.println(students.size());\n\n        // Exercise 3\n        System.out.println(balanced(\"{[()]}\"));\n        System.out.println(balanced(\"(]\"));\n    }\n}\n\nclass Student {\n    private final String name;\n    private final int id;\n\n    Student(String name, int id) {\n        this.name = name;\n        this.id = id;\n    }\n\n    @Override\n    public boolean equals(Object o) {\n        return o instanceof Student s && s.id == id;\n    }\n\n    @Override\n    public int hashCode() { return Integer.hashCode(id); }\n}\n// Output:\n// {and=2, bat=1, cat=1, hat=1, the=3}\n// 2\n// true\n// false\n```\n\n<\/details>\n\n## Module 4: Generics\n**Goal:** Write classes and methods that work with many types while keeping full compile-time type safety.\n\nBefore generics, a collection held `Object`, and you had to cast what came out and hope it was the right type. Generics let you say \"a list *of strings*\" and have the compiler enforce it. The `<T>` is a type parameter: a placeholder filled in by whoever uses your class.\n\n**Generic classes** declare the parameter after the name. **Generic methods** declare it before the return type. A **bound** like `T extends Comparable<T>` restricts which types are allowed, and lets you call the bound's methods (`compareTo`) inside.\n\n```java\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        Box<String> box = new Box<>(\"hello\");\n        System.out.println(box.get().toUpperCase());\n        System.out.println(max(List.of(3, 9, 4)));\n        System.out.println(max(List.of(\"pear\", \"apple\", \"zebra\")));\n    }\n\n    static <T extends Comparable<T>> T max(List<T> items) {\n        T best = items.get(0);\n        for (T item : items) {\n            if (item.compareTo(best) > 0) {\n                best = item;\n            }\n        }\n        return best;\n    }\n}\n\nclass Box<T> {\n    private final T value;\n\n    Box(T value) { this.value = value; }\n\n    T get() { return value; }\n}\n```\n\nOutput:\n```text\nHELLO\n9\nzebra\n```\n\n`box.get()` returns a `String`, so `.toUpperCase()` works with no cast. One `max` method works for `Integer` and `String`, because both implement `Comparable`. Type arguments must be reference types: write `List<Integer>`, never `List<int>` (autoboxing converts between `int` and `Integer` for you).\n\n**Wildcards.** `List<Integer>` is *not* a `List<Number>`, even though `Integer` is a `Number`. If it were, you could add a `Double` to a list of integers. When a method only needs to *read* or only needs to *write*, use a wildcard:\n\n- `? extends Number` (\"producer\"): you can read `Number`s out of it, but cannot add to it.\n- `? super Integer` (\"consumer\"): you can add `Integer`s into it, but only read `Object`s out.\n\nThe memory aid is **PECS: Producer Extends, Consumer Super.**\n\n```java\nimport java.util.*;\n\npublic class Main {\n    static double sum(Collection<? extends Number> numbers) {\n        double total = 0;\n        for (Number n : numbers) {\n            total += n.doubleValue();\n        }\n        return total;\n    }\n\n    static void fill(List<? super Integer> sink) {\n        for (int i = 1; i <= 3; i++) {\n            sink.add(i);\n        }\n    }\n\n    public static void main(String[] args) {\n        System.out.println(sum(List.of(1, 2, 3)));\n        System.out.println(sum(List.of(1.5, 2.5)));\n\n        List<Number> numbers = new ArrayList<>();\n        fill(numbers);\n        System.out.println(numbers);\n\n        List<Object> objects = new ArrayList<>();\n        fill(objects);\n        System.out.println(objects);\n    }\n}\n```\n\nOutput:\n```text\n6.0\n4.0\n[1, 2, 3]\n[1, 2, 3]\n```\n\n`sum` accepts a list of any number type because it only reads. `fill` accepts a list of `Integer`, `Number` or `Object` because it only writes integers.\n\n**Generic interfaces** are how most real code is shaped. Here is a tiny repository with two type parameters:\n\n```java\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Repository<String, Integer> repo = new InMemoryRepository<>();\n        repo.save(1, \"one\");\n        repo.save(2, \"two\");\n        System.out.println(repo.findById(2).orElse(\"none\"));\n        System.out.println(repo.findById(9).orElse(\"none\"));\n        System.out.println(repo.count());\n    }\n}\n\ninterface Repository<T, ID> {\n    void save(ID id, T item);\n    Optional<T> findById(ID id);\n    int count();\n}\n\nclass InMemoryRepository<T, ID> implements Repository<T, ID> {\n    private final Map<ID, T> store = new HashMap<>();\n\n    @Override\n    public void save(ID id, T item) { store.put(id, item); }\n\n    @Override\n    public Optional<T> findById(ID id) { return Optional.ofNullable(store.get(id)); }\n\n    @Override\n    public int count() { return store.size(); }\n}\n```\n\nOutput:\n```text\ntwo\nnone\n2\n```\n\n**Type erasure.** Generics exist only at compile time. The compiler checks your types, then erases them, so at runtime a `List<String>` is just a `List`. That is why you cannot write `new T()`, `new T[10]`, or `obj instanceof List<String>`. You rarely need those; when you do, pass a `Class<T>` or a factory (`Supplier<T>`) into the method.\n\n### Common mistakes\n- Using raw types (`List list = new ArrayList();`). You lose all type checking and get `ClassCastException` at runtime.\n- Assuming `List<Dog>` can be passed where `List<Animal>` is expected. It cannot. Use `List<? extends Animal>` for read-only access.\n- Trying to create a generic array (`new T[10]`). Use a `List<T>` instead.\n- Forgetting the bound and then wondering why `item.compareTo(...)` does not compile on a plain `T`.\n- Using generics where plain polymorphism is enough. If `Shape` as a parameter type does the job, you do not need `<T extends Shape>`.\n\n### Practice\n1. Write a generic class `Pair<A, B>` with `first()`, `second()` and a `swap()` method that returns a `Pair<B, A>`.\n2. Write `static <T> int countMatching(List<T> items, Predicate<T> test)` that counts the items that pass the test.\n3. Write `static double average(List<? extends Number> numbers)` and call it with a list of integers and a list of doubles.\n\n<details><summary>Solutions<\/summary>\n\n```java\nimport java.util.List;\nimport java.util.function.Predicate;\n\npublic class Main {\n    // Exercise 2\n    static <T> int countMatching(List<T> items, Predicate<T> test) {\n        int count = 0;\n        for (T item : items) {\n            if (test.test(item)) count++;\n        }\n        return count;\n    }\n\n    // Exercise 3\n    static double average(List<? extends Number> numbers) {\n        double total = 0;\n        for (Number n : numbers) total += n.doubleValue();\n        return numbers.isEmpty() ? 0 : total / numbers.size();\n    }\n\n    public static void main(String[] args) {\n        Pair<String, Integer> p = new Pair<>(\"age\", 30);\n        Pair<Integer, String> swapped = p.swap();\n        System.out.println(swapped.first() + \" \" + swapped.second());\n\n        System.out.println(countMatching(List.of(\"a\", \"bb\", \"cc\", \"d\"), s -> s.length() == 2));\n\n        System.out.println(average(List.of(1, 2, 3, 4)));\n        System.out.println(average(List.of(1.5, 2.5)));\n    }\n}\n\n// Exercise 1\nclass Pair<A, B> {\n    private final A first;\n    private final B second;\n\n    Pair(A first, B second) {\n        this.first = first;\n        this.second = second;\n    }\n\n    A first() { return first; }\n    B second() { return second; }\n\n    Pair<B, A> swap() { return new Pair<>(second, first); }\n}\n// Output:\n// 30 age\n// 2\n// 2.5\n// 2.0\n```\n\n<\/details>\n\n## Module 5: Lambdas and Functional Interfaces\n**Goal:** Pass behavior around as data using lambdas, method references and the standard functional interfaces.\n\nA **functional interface** is an interface with exactly one abstract method. A **lambda** is a short way to write an object that implements it: `(parameters) -> result`. Instead of writing an anonymous class with five lines of ceremony, you write the one thing that matters. This is the foundation for streams (next module) and for most modern Java libraries.\n\nThe `java.util.function` package has the standard shapes, so you rarely need to invent your own:\n\n| Interface | Method | Meaning |\n|---|---|---|\n| `Function<T,R>` | `R apply(T)` | transform a value |\n| `Predicate<T>` | `boolean test(T)` | yes/no question |\n| `Consumer<T>` | `void accept(T)` | do something with a value |\n| `Supplier<T>` | `T get()` | produce a value |\n| `BiFunction<T,U,R>` | `R apply(T,U)` | transform two values |\n| `UnaryOperator<T>` | `T apply(T)` | transform a value to the same type |\n\nA **method reference** (`String::isEmpty`, `System.out::println`, `Integer::sum`) is a shortcut for a lambda that just calls an existing method.\n\n```java\nimport java.util.function.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Function<Integer, Integer> square = x -> x * x;\n        Predicate<String> isEmpty = String::isEmpty;\n        Supplier<String> greeting = () -> \"hi\";\n        Consumer<String> printer = System.out::println;\n        BiFunction<Integer, Integer, Integer> add = Integer::sum;\n        UnaryOperator<String> shout = s -> s.toUpperCase() + \"!\";\n\n        System.out.println(square.apply(7));\n        System.out.println(isEmpty.test(\"\"));\n        printer.accept(greeting.get());\n        System.out.println(add.apply(2, 3));\n        System.out.println(shout.apply(\"hey\"));\n\n        Function<Integer, Integer> plusOneThenSquare = square.compose(x -> x + 1);\n        System.out.println(plusOneThenSquare.apply(4));\n        System.out.println(square.andThen(x -> x + 1).apply(4));\n    }\n}\n```\n\nOutput:\n```text\n49\ntrue\nhi\n5\nHEY!\n25\n17\n```\n\n`square.compose(f)` runs `f` first, then `square`: (4+1) squared is 25. `square.andThen(f)` runs `square` first, then `f`: 4 squared plus 1 is 17.\n\n**Writing your own.** You can make your own functional interface when the standard ones do not describe your idea well. Mark it `@FunctionalInterface` so the compiler guards the \"one abstract method\" rule. Lambdas can also read local variables from the surrounding method, but only if those variables are **effectively final** (never reassigned). This keeps lambdas safe when they run later or on another thread.\n\nThe example below uses a `record` (a compact class for plain data; Module 7 covers them in full) and the `Comparator` helpers, which are the most common lambda use in everyday code.\n\n```java\nimport java.util.*;\n\npublic class Main {\n    @FunctionalInterface\n    interface Discount {\n        int apply(int price);\n    }\n\n    static int checkout(int price, Discount discount) {\n        return discount.apply(price);\n    }\n\n    record Person(String name, int age) {}\n\n    public static void main(String[] args) {\n        int percentOff = 20;\n        System.out.println(checkout(200, p -> p - p * percentOff / 100));\n        System.out.println(checkout(200, p -> Math.max(0, p - 500)));\n\n        List<Person> people = new ArrayList<>(List.of(\n            new Person(\"Zed\", 30), new Person(\"Amy\", 25), new Person(\"Bob\", 30)));\n        people.sort(Comparator.comparingInt(Person::age).reversed().thenComparing(Person::name));\n        System.out.println(people);\n    }\n}\n```\n\nOutput:\n```text\n160\n0\n[Person[name=Bob, age=30], Person[name=Zed, age=30], Person[name=Amy, age=25]]\n```\n\nThe sort reads as English: by age, highest first, then by name. If you tried to reassign `percentOff` anywhere in `main`, the first lambda would stop compiling.\n\n**Optional.** `Optional<T>` is a box that holds a value or nothing. Return it from methods that might not find an answer, instead of returning `null`. It forces the caller to decide what happens when there is no value, and it chains with lambdas.\n\n```java\nimport java.util.Optional;\n\npublic class Main {\n    static Optional<String> findUser(int id) {\n        return id == 1 ? Optional.of(\"henry\") : Optional.empty();\n    }\n\n    public static void main(String[] args) {\n        System.out.println(findUser(1).map(String::toUpperCase).orElse(\"unknown\"));\n        System.out.println(findUser(2).map(String::toUpperCase).orElse(\"unknown\"));\n        findUser(1).ifPresent(u -> System.out.println(\"found \" + u));\n        System.out.println(findUser(2).isPresent());\n    }\n}\n```\n\nOutput:\n```text\nHENRY\nunknown\nfound henry\nfalse\n```\n\nUse `Optional` for return values. Do not use it for fields or method parameters, and do not call `.get()` without checking first; prefer `orElse`, `orElseThrow`, `map` and `ifPresent`.\n\n### Common mistakes\n- Trying to modify a local variable inside a lambda. The variable must be effectively final; use an `AtomicInteger` or restructure with a stream.\n- Writing a long, multi-line lambda. If it needs more than two or three lines, move it into a named method and use a method reference.\n- Inventing a custom functional interface when `Function`, `Predicate` or `Supplier` already fit.\n- Calling `Optional.get()` on an empty `Optional`, which throws `NoSuchElementException`. You have just rebuilt the null pointer problem.\n- Returning `null` from a method that returns `Optional`. Always return `Optional.empty()`.\n- Confusing `compose` and `andThen`. Remember: `andThen` reads left to right.\n\n### Practice\n1. Build a `Function<String, String>` pipeline that trims a string, converts it to upper case, then appends \"!\". Use `andThen`. Apply it to `\"  hello  \"`.\n2. Sort a list of words by length, then alphabetically, using `Comparator`.\n3. Write `static void repeat(int times, Runnable action)` and use it to print \"hi\" three times with a lambda.\n\n<details><summary>Solutions<\/summary>\n\n```java\nimport java.util.*;\nimport java.util.function.Function;\n\npublic class Main {\n    // Exercise 3\n    static void repeat(int times, Runnable action) {\n        for (int i = 0; i < times; i++) {\n            action.run();\n        }\n    }\n\n    public static void main(String[] args) {\n        // Exercise 1\n        Function<String, String> trim = String::trim;\n        Function<String, String> pipeline = trim\n            .andThen(String::toUpperCase)\n            .andThen(s -> s + \"!\");\n        System.out.println(pipeline.apply(\"  hello  \"));\n\n        // Exercise 2\n        List<String> words = new ArrayList<>(List.of(\"pear\", \"fig\", \"apple\", \"kiwi\", \"date\"));\n        words.sort(Comparator.comparingInt(String::length).thenComparing(Comparator.naturalOrder()));\n        System.out.println(words);\n\n        // Exercise 3\n        repeat(3, () -> System.out.println(\"hi\"));\n    }\n}\n// Output:\n// HELLO!\n// [fig, date, kiwi, pear, apple]\n// hi\n// hi\n// hi\n```\n\n<\/details>\n\n## Module 6: The Streams API\n**Goal:** Process collections with readable pipelines of filter, map and collect instead of manual loops.\n\nA **stream** is a pipeline: a source of data, zero or more **intermediate operations** that transform it (`filter`, `map`, `sorted`, `distinct`, `limit`), and one **terminal operation** that produces a result (`toList`, `collect`, `count`, `sum`, `forEach`, `anyMatch`, `reduce`). You describe *what* you want, and the library handles the looping.\n\nTwo facts to remember. Streams are **lazy**: nothing runs until the terminal operation is called. And a stream is **single-use**: after a terminal operation, it is finished, and reusing it throws `IllegalStateException`. A stream never changes its source collection.\n\n```java\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<String> words = List.of(\"stream\", \"lambda\", \"java\", \"record\", \"enum\", \"sealed\");\n\n        List<String> result = words.stream()\n            .filter(w -> w.length() > 4)\n            .map(String::toUpperCase)\n            .sorted()\n            .toList();\n        System.out.println(result);\n\n        int totalLength = words.stream().mapToInt(String::length).sum();\n        System.out.println(totalLength);\n        System.out.println(words.stream().anyMatch(w -> w.startsWith(\"j\")));\n        System.out.println(words.stream().map(String::length).reduce(0, Integer::sum));\n    }\n}\n```\n\nOutput:\n```text\n[LAMBDA, RECORD, SEALED, STREAM]\n32\ntrue\n32\n```\n\nUse `mapToInt` (and friends `mapToDouble`, `mapToLong`) when you want numbers: it produces a primitive stream with `sum()`, `average()`, `max()` and no boxing cost. `.toList()` returns an unmodifiable list.\n\n**Collectors** turn a stream into a map, a grouped result, a joined string, and more. `groupingBy` is the one you will use most.\n\n```java\nimport java.util.*;\nimport java.util.stream.Collectors;\n\npublic class Main {\n    record Employee(String name, String dept, int salary) {}\n\n    public static void main(String[] args) {\n        List<Employee> staff = List.of(\n            new Employee(\"Ana\", \"eng\", 120),\n            new Employee(\"Ben\", \"eng\", 100),\n            new Employee(\"Cy\", \"ops\", 80),\n            new Employee(\"Di\", \"ops\", 90),\n            new Employee(\"Eli\", \"design\", 95));\n\n        Map<String, Long> countByDept = staff.stream()\n            .collect(Collectors.groupingBy(Employee::dept, TreeMap::new, Collectors.counting()));\n        System.out.println(countByDept);\n\n        Map<String, Double> avgByDept = staff.stream()\n            .collect(Collectors.groupingBy(Employee::dept, TreeMap::new,\n                Collectors.averagingInt(Employee::salary)));\n        System.out.println(avgByDept);\n\n        Map<Boolean, List<String>> split = staff.stream()\n            .collect(Collectors.partitioningBy(e -> e.salary() >= 95,\n                Collectors.mapping(Employee::name, Collectors.toList())));\n        System.out.println(split);\n\n        String names = staff.stream()\n            .map(Employee::name)\n            .collect(Collectors.joining(\", \", \"[\", \"]\"));\n        System.out.println(names);\n    }\n}\n```\n\nOutput:\n```text\n{design=1, eng=2, ops=2}\n{design=95.0, eng=110.0, ops=85.0}\n{false=[Cy, Di], true=[Ana, Ben, Eli]}\n[Ana, Ben, Cy, Di, Eli]\n```\n\n`groupingBy(classifier, mapFactory, downstream)` groups by the classifier, builds the result in the map type you choose (`TreeMap` for sorted keys), and uses the downstream collector to summarize each group. `partitioningBy` is a special grouping into exactly two buckets, `true` and `false`.\n\n**flatMap, ranges and laziness.** `flatMap` turns each element into a stream and flattens them into one. `IntStream.range` replaces most counting loops. The last part of the example proves that streams are lazy.\n\n```java\nimport java.util.*;\nimport java.util.stream.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<List<Integer>> nested = List.of(List.of(1, 2), List.of(3), List.of(4, 5, 6));\n        System.out.println(nested.stream().flatMap(List::stream).map(n -> n * 10).toList());\n\n        System.out.println(IntStream.rangeClosed(1, 5).sum());\n        System.out.println(IntStream.rangeClosed(1, 5).boxed().collect(Collectors.toList()));\n\n        Stream<String> lazy = Stream.of(\"a\", \"b\", \"c\")\n            .peek(s -> System.out.println(\"visiting \" + s));\n        System.out.println(\"pipeline built\");\n        System.out.println(lazy.filter(s -> !s.equals(\"b\")).count());\n    }\n}\n```\n\nOutput:\n```text\n[10, 20, 30, 40, 50, 60]\n15\n[1, 2, 3, 4, 5]\npipeline built\nvisiting a\nvisiting b\nvisiting c\n2\n```\n\n\"pipeline built\" prints before any \"visiting\" line because nothing runs until `count()`. (`peek` is for debugging only; do not put real work in it.)\n\n**Newer additions.** Since Java 24, stream **gatherers** (JEP 485) are final, so custom intermediate operations exist. The built-in `Gatherers` class has useful ones such as `windowFixed`. This needs Java 24 or newer:\n\n```java\n// Requires Java 24 or newer\nimport java.util.List;\nimport java.util.stream.Gatherers;\nimport java.util.stream.Stream;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<List<Integer>> chunks = Stream.of(1, 2, 3, 4, 5)\n            .gather(Gatherers.windowFixed(2))\n            .toList();\n        System.out.println(chunks);\n    }\n}\n```\n\nOutput:\n```text\n[[1, 2], [3, 4], [5]]\n```\n\n**Parallel streams.** `.parallel()` splits work across CPU cores, but it only helps for large, CPU-heavy, side-effect-free pipelines. For small lists or I/O it is slower. Measure before using it.\n\n### Common mistakes\n- Reusing a stream after a terminal operation (`IllegalStateException: stream has already been operated upon or closed`).\n- Changing external state inside `map` or `forEach` (for example adding to an outside list). Use `collect` or `toList` instead.\n- Forgetting the terminal operation. A pipeline with no terminal operation does nothing at all.\n- Using a stream for a simple loop that is clearer as a `for`. Streams are a tool, not a rule.\n- Calling `.get()` on the `Optional` returned by `max`, `min` or `findFirst` without checking for empty.\n- Assuming `.toList()` is modifiable. It throws `UnsupportedOperationException` on `add`. Use `Collectors.toList()` or `new ArrayList<>(...)` for a modifiable list.\n- Using `parallel()` everywhere \"for speed\".\n\n### Practice\n1. Given `List.of(1, 2, 3, 4, 5, 6)`, compute the sum of the squares of the even numbers.\n2. Group the words `List.of(\"one\", \"two\", \"three\", \"four\", \"five\", \"six\")` by length into a sorted `Map<Integer, List<String>>`.\n3. Write `static String longest(List<String> words)` that uses a stream and returns the longest word, or `\"none\"` if the list is empty.\n\n<details><summary>Solutions<\/summary>\n\n```java\nimport java.util.*;\nimport java.util.stream.Collectors;\n\npublic class Main {\n    // Exercise 3\n    static String longest(List<String> words) {\n        return words.stream()\n            .max(Comparator.comparingInt(String::length))\n            .orElse(\"none\");\n    }\n\n    public static void main(String[] args) {\n        // Exercise 1\n        int sum = List.of(1, 2, 3, 4, 5, 6).stream()\n            .filter(n -> n % 2 == 0)\n            .mapToInt(n -> n * n)\n            .sum();\n        System.out.println(sum);\n\n        // Exercise 2\n        Map<Integer, List<String>> byLength = List.of(\"one\", \"two\", \"three\", \"four\", \"five\", \"six\")\n            .stream()\n            .collect(Collectors.groupingBy(String::length, TreeMap::new, Collectors.toList()));\n        System.out.println(byLength);\n\n        // Exercise 3\n        System.out.println(longest(List.of(\"hi\", \"hello\", \"hey\")));\n        System.out.println(longest(List.of()));\n    }\n}\n// Output:\n// 56\n// {3=[one, two, six], 4=[four, five], 5=[three]}\n// hello\n// none\n```\n\n<\/details>\n\n## Module 7: Records, Enums, Sealed Types and Pattern Matching\n**Goal:** Model data precisely with records, enums and sealed interfaces, and process it safely with pattern matching for `switch`.\n\nThese four features work together and are the biggest change to how modern Java is written. The idea is \"data-oriented programming\": model your data as simple immutable types, then write functions that take them apart with `switch`.\n\n**Records.** A record is a class whose only job is to carry data. You list the components once, and Java generates the private final fields, constructor, accessors (`x()`, not `getX()`), `equals`, `hashCode` and `toString`. A **compact constructor** lets you validate without repeating the assignments. Records are implicitly `final` and cannot extend another class, but they can implement interfaces and have methods.\n\n```java\npublic class Main {\n    record Point(int x, int y) {\n        Point {\n            if (x < 0 || y < 0) {\n                throw new IllegalArgumentException(\"negative coordinate\");\n            }\n        }\n\n        double distanceToOrigin() {\n            return Math.sqrt(x * x + y * y);\n        }\n\n        static Point origin() {\n            return new Point(0, 0);\n        }\n    }\n\n    public static void main(String[] args) {\n        Point p = new Point(3, 4);\n        System.out.println(p);\n        System.out.println(p.x() + \" \" + p.distanceToOrigin());\n        System.out.println(p.equals(new Point(3, 4)));\n        System.out.println(Point.origin());\n        try {\n            new Point(-1, 0);\n        } catch (IllegalArgumentException e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\nOutput:\n```text\nPoint[x=3, y=4]\n3 5.0\ntrue\nPoint[x=0, y=0]\nnegative coordinate\n```\n\nRemember the `equals`/`hashCode` pain from Module 3? One line replaced it. Use records for DTOs, map keys, return values with multiple parts, and anything that is \"just data\".\n\n**Enums.** An enum is a fixed set of constants. It is far safer than strings or ints (\"MEDIUM\" can never be misspelled as \"MEDUIM\"). Enums can have fields, constructors and methods. `EnumMap` and `EnumSet` are fast, compact collections keyed by enums. A `switch` expression over an enum must cover every constant, so adding a constant later makes the compiler point at every place you forgot.\n\n```java\nimport java.util.EnumMap;\nimport java.util.Map;\n\npublic class Main {\n    enum Size {\n        SMALL(1.0), MEDIUM(1.5), LARGE(2.0);\n\n        private final double multiplier;\n\n        Size(double multiplier) { this.multiplier = multiplier; }\n\n        double price(double base) { return base * multiplier; }\n    }\n\n    enum Day { MON, TUE, SAT, SUN }\n\n    static String kind(Day d) {\n        return switch (d) {\n            case SAT, SUN -> \"weekend\";\n            case MON, TUE -> \"weekday\";\n        };\n    }\n\n    public static void main(String[] args) {\n        for (Size s : Size.values()) {\n            System.out.println(s + \" \" + s.price(4.0));\n        }\n        System.out.println(Size.valueOf(\"LARGE\").ordinal());\n        System.out.println(kind(Day.SAT) + \" \" + kind(Day.MON));\n\n        Map<Day, Integer> hours = new EnumMap<>(Day.class);\n        hours.put(Day.TUE, 8);\n        hours.put(Day.MON, 6);\n        System.out.println(hours);\n    }\n}\n```\n\nOutput:\n```text\nSMALL 4.0\nMEDIUM 6.0\nLARGE 8.0\n2\nweekend weekday\n{MON=6, TUE=8}\n```\n\n**Sealed interfaces.** An enum is a closed set of *constants*. A **sealed** type is a closed set of *types*: you list exactly which classes or records may implement it. Combined with records, this models \"a value that is exactly one of these shapes\", also called a sum type or algebraic data type.\n\n**Pattern matching for switch.** The reward: when you `switch` over a sealed type, the compiler knows every possible case. If you cover them all, you need no `default`, and if someone adds a new shape later, every `switch` that misses it fails to compile. That is a bug caught before the program ever runs. Patterns can also **deconstruct** records (`Rectangle(double w, double h)`) and carry a `when` guard for extra conditions. Pattern matching for `switch` and record patterns are final since Java 21.\n\n```java\npublic class Main {\n    sealed interface Shape permits Circle, Rectangle, Triangle {}\n\n    record Circle(double radius) implements Shape {}\n\n    record Rectangle(double width, double height) implements Shape {}\n\n    record Triangle(double base, double height) implements Shape {}\n\n    static double area(Shape shape) {\n        return switch (shape) {\n            case Circle c -> Math.PI * c.radius() * c.radius();\n            case Rectangle(double w, double h) -> w * h;\n            case Triangle(double b, double h) -> 0.5 * b * h;\n        };\n    }\n\n    static String classify(Object o) {\n        return switch (o) {\n            case null -> \"null!\";\n            case Integer i when i > 100 -> \"big int \" + i;\n            case Integer i -> \"int \" + i;\n            case String s when s.isBlank() -> \"blank string\";\n            case String s -> \"string of length \" + s.length();\n            default -> \"something else\";\n        };\n    }\n\n    public static void main(String[] args) {\n        System.out.printf(\"%.2f%n\", area(new Circle(1)));\n        System.out.printf(\"%.1f%n\", area(new Rectangle(2, 3)));\n        System.out.printf(\"%.1f%n\", area(new Triangle(4, 5)));\n        System.out.println(classify(500));\n        System.out.println(classify(7));\n        System.out.println(classify(\"  \"));\n        System.out.println(classify(\"hello\"));\n        System.out.println(classify(3.14));\n        System.out.println(classify(null));\n    }\n}\n```\n\nOutput:\n```text\n3.14\n6.0\n10.0\nbig int 500\nint 7\nblank string\nstring of length 5\nsomething else\nnull!\n```\n\nOrder matters in pattern switches: the guarded `Integer i when i > 100` must come before the plain `Integer i`, otherwise the compiler reports the later case as unreachable. A plain `switch` over `Object` needs a `default`; a switch over a sealed type that covers every permitted type does not. Notice `case null` handles null explicitly; without it, a `null` selector throws `NullPointerException`.\n\nIn Java 22 and later you may write `_` for a pattern variable or component you do not use (for example `case Circle _ -> ...`, or `Rectangle(double w, _)`). That feature is final in 22, so it is not available on Java 21. In Java 25, primitive types in patterns is still a preview feature, so do not rely on it yet.\n\n### Common mistakes\n- Using a record for something that needs to change. Records are immutable; if the data changes over time, use a normal class.\n- Expecting `getX()` on a record. The accessor is `x()`.\n- Storing a mutable list in a record and assuming it is safe. The record is immutable but the list inside is not. Copy it with `List.copyOf(...)` in the compact constructor.\n- Adding a `default` branch to a switch over a sealed type \"to be safe\". It silences the compiler warning that would otherwise tell you about a missing case.\n- Putting a general pattern before a specific one in a switch. The compiler will reject the dominated case.\n- Passing enum names around as strings (\"MEDIUM\") and comparing them. Keep the enum type and compare with `==` or `switch`; convert from text once, at the edge, with `valueOf`.\n- Using `ordinal()` for persistent data. Reordering the constants silently changes it. Store the name or an explicit code field.\n\n### Practice\n1. Create a record `Temperature(double celsius)` with a method `fahrenheit()`. Reject values below -273.15 in a compact constructor.\n2. Create an enum `TrafficLight` (RED, GREEN, YELLOW) with a method `next()` that uses a switch expression: RED to GREEN to YELLOW to RED.\n3. Model a tiny calculator: a sealed interface `Expr` with records `Num(int value)`, `Add(Expr left, Expr right)` and `Mul(Expr left, Expr right)`. Write `static int eval(Expr e)` using a pattern switch. Evaluate `2 + 3 * 4`.\n\n<details><summary>Solutions<\/summary>\n\n```java\npublic class Main {\n    // Exercise 3\n    static int eval(Expr e) {\n        return switch (e) {\n            case Num n -> n.value();\n            case Add(Expr l, Expr r) -> eval(l) + eval(r);\n            case Mul(Expr l, Expr r) -> eval(l) * eval(r);\n        };\n    }\n\n    public static void main(String[] args) {\n        System.out.println(new Temperature(100).fahrenheit());\n        System.out.println(TrafficLight.YELLOW.next());\n        Expr expr = new Add(new Num(2), new Mul(new Num(3), new Num(4)));\n        System.out.println(eval(expr));\n    }\n}\n\n// Exercise 1\nrecord Temperature(double celsius) {\n    Temperature {\n        if (celsius < -273.15) {\n            throw new IllegalArgumentException(\"below absolute zero\");\n        }\n    }\n\n    double fahrenheit() { return celsius * 9 / 5 + 32; }\n}\n\n// Exercise 2\nenum TrafficLight {\n    RED, GREEN, YELLOW;\n\n    TrafficLight next() {\n        return switch (this) {\n            case RED -> GREEN;\n            case GREEN -> YELLOW;\n            case YELLOW -> RED;\n        };\n    }\n}\n\n// Exercise 3\nsealed interface Expr permits Num, Add, Mul {}\n\nrecord Num(int value) implements Expr {}\n\nrecord Add(Expr left, Expr right) implements Expr {}\n\nrecord Mul(Expr left, Expr right) implements Expr {}\n// Output:\n// 212.0\n// RED\n// 14\n```\n\n<\/details>\n\n## Module 8: File I/O with java.nio\n**Goal:** Read, write and walk files and directories using `Path` and `Files`, with correct error handling and cleanup.\n\nModern Java file code uses the `java.nio.file` package. Two types do most of the work: **`Path`** (a location, such as `Path.of(\"data\", \"notes.txt\")`) and **`Files`** (static methods that act on paths). This replaces the older `java.io.File` class, which has weak error reporting.\n\nFor small files, read and write them in one call. These methods use UTF-8 by default. Every operation can fail (missing file, no permission, disk full), so they throw the checked `IOException`; its subclass `NoSuchFileException` tells you specifically that the file does not exist. The examples use temp directories so they run anywhere and clean up after themselves.\n\n```java\nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.NoSuchFileException;\nimport java.nio.file.Path;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        Path dir = Files.createTempDirectory(\"jorday\");\n        Path file = dir.resolve(\"notes.txt\");\n\n        Files.writeString(file, \"first line\\nsecond line\\n\");\n        System.out.println(Files.exists(file));\n        System.out.println(Files.readString(file).length());\n\n        List<String> lines = Files.readAllLines(file);\n        System.out.println(lines);\n        System.out.println(file.getFileName());\n\n        try {\n            Files.readString(dir.resolve(\"missing.txt\"));\n        } catch (NoSuchFileException e) {\n            System.out.println(\"missing: \" + e.getFile().endsWith(\"missing.txt\"));\n        }\n\n        Files.delete(file);\n        Files.delete(dir);\n    }\n}\n```\n\nOutput:\n```text\ntrue\n23\n[first line, second line]\nnotes.txt\nmissing: true\n```\n\n`dir.resolve(\"notes.txt\")` builds a child path without you worrying about `/` versus `\\`. `readAllLines` loads everything into memory, which is fine for small files but wrong for gigabytes.\n\n**Large files and directories.** For big files, process line by line with `Files.lines(path)`, which returns a lazy `Stream<String>`. `Files.walk(dir)` returns a stream of every path under a directory. Both hold an open file handle, so you **must** wrap them in try-with-resources, or the handle leaks. Use `StandardOpenOption.APPEND` to add to a file instead of replacing it.\n\n```java\nimport java.io.IOException;\nimport java.io.UncheckedIOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.StandardOpenOption;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.stream.Stream;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        Path dir = Files.createTempDirectory(\"jorday\");\n        Path log = dir.resolve(\"app.log\");\n        Files.write(log, List.of(\"INFO start\", \"ERROR disk full\", \"INFO retry\"));\n        Files.writeString(log, \"ERROR gave up\\n\", StandardOpenOption.APPEND);\n\n        try (Stream<String> lines = Files.lines(log)) {\n            long errors = lines.filter(l -> l.startsWith(\"ERROR\")).count();\n            System.out.println(\"errors: \" + errors);\n        }\n\n        Files.writeString(dir.resolve(\"b.txt\"), \"b\");\n        Files.createDirectory(dir.resolve(\"sub\"));\n        Files.writeString(dir.resolve(\"sub\").resolve(\"c.txt\"), \"c\");\n\n        try (Stream<Path> paths = Files.walk(dir)) {\n            paths.filter(Files::isRegularFile)\n                .map(p -> dir.relativize(p).toString().replace('\\\\', '/'))\n                .sorted()\n                .forEach(System.out::println);\n        }\n\n        try (Stream<Path> paths = Files.walk(dir)) {\n            paths.sorted(Comparator.reverseOrder()).forEach(p -> {\n                try {\n                    Files.delete(p);\n                } catch (IOException e) {\n                    throw new UncheckedIOException(e);\n                }\n            });\n        }\n    }\n}\n```\n\nOutput:\n```text\nerrors: 2\napp.log\nb.txt\nsub/c.txt\n```\n\nThe cleanup at the end deletes in reverse order so files are removed before the folders that contain them. `Files.delete` cannot remove a non-empty directory.\n\n**Buffered reading and writing.** When you need control (write piece by piece, or read until the end), use `Files.newBufferedWriter` and `Files.newBufferedReader`. They are `AutoCloseable`, so try-with-resources flushes and closes them for you.\n\n```java\nimport java.io.BufferedReader;\nimport java.io.BufferedWriter;\nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        Path csv = Files.createTempFile(\"scores\", \".csv\");\n\n        try (BufferedWriter out = Files.newBufferedWriter(csv)) {\n            out.write(\"name,score\");\n            out.newLine();\n            out.write(\"Ana,90\");\n            out.newLine();\n            out.write(\"Ben,75\");\n            out.newLine();\n        }\n\n        int total = 0;\n        try (BufferedReader in = Files.newBufferedReader(csv)) {\n            String header = in.readLine();\n            System.out.println(\"columns: \" + header);\n            String line;\n            while ((line = in.readLine()) != null) {\n                String[] parts = line.split(\",\");\n                System.out.println(parts[0] + \" scored \" + parts[1]);\n                total += Integer.parseInt(parts[1]);\n            }\n        }\n        System.out.println(\"total: \" + total);\n\n        Files.delete(csv);\n    }\n}\n```\n\nOutput:\n```text\ncolumns: name,score\nAna scored 90\nBen scored 75\ntotal: 165\n```\n\n`readLine()` returns `null` at the end of the file, which is the loop's stop signal. Also useful: `Files.copy(src, dst, StandardCopyOption.REPLACE_EXISTING)`, `Files.move`, `Files.size`, `Files.createDirectories` (creates the whole chain), and `Files.isDirectory`.\n\n### Common mistakes\n- Forgetting to close the streams returned by `Files.lines` and `Files.walk`. Always use try-with-resources.\n- Using `readAllLines` or `readString` on huge files and running out of memory.\n- Hard-coding path separators (`\"data\\\\notes.txt\"`). Use `Path.of(\"data\", \"notes.txt\")` or `resolve`.\n- Assuming relative paths point where you think. They are relative to the working directory the program was launched from, not the source file.\n- Overwriting data by accident: `writeString` replaces the file unless you pass `APPEND`.\n- Ignoring the character set when it matters. UTF-8 is the default in these methods; be explicit with a `Charset` argument if the file came from somewhere else.\n- Catching `IOException` and doing nothing. A failed write that you hide is data loss.\n\n### Practice\n1. Write the lines \"alpha\", \"beta\", \"gamma\" to a temp file with `Files.write`, then read them back and print how many lines there are.\n2. Copy a temp file to a second path with `Files.copy` using `REPLACE_EXISTING`, then print whether both exist.\n3. Write a method `static long countWords(Path file)` that streams the lines of a file, splits each on whitespace and counts the words. Close the stream properly.\n\n<details><summary>Solutions<\/summary>\n\n```java\nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.StandardCopyOption;\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.stream.Stream;\n\npublic class Main {\n    // Exercise 3\n    static long countWords(Path file) throws IOException {\n        try (Stream<String> lines = Files.lines(file)) {\n            return lines\n                .flatMap(l -> Arrays.stream(l.split(\"\\\\s+\")))\n                .filter(w -> !w.isBlank())\n                .count();\n        }\n    }\n\n    public static void main(String[] args) throws IOException {\n        // Exercise 1\n        Path file = Files.createTempFile(\"greek\", \".txt\");\n        Files.write(file, List.of(\"alpha\", \"beta\", \"gamma\"));\n        System.out.println(Files.readAllLines(file).size());\n\n        // Exercise 2\n        Path copy = Files.createTempFile(\"greek-copy\", \".txt\");\n        Files.copy(file, copy, StandardCopyOption.REPLACE_EXISTING);\n        System.out.println(Files.exists(file) + \" \" + Files.exists(copy));\n\n        // Exercise 3\n        Files.writeString(file, \"one two  three\\nfour five\\n\");\n        System.out.println(countWords(file));\n\n        Files.delete(file);\n        Files.delete(copy);\n    }\n}\n// Output:\n// 3\n// true true\n// 5\n```\n\n<\/details>\n\n## Module 9: Capstone Project — Expense Tracker\n**Goal:** Combine records, enums, interfaces, exceptions, collections, streams and `java.nio` into one small, well-structured program that saves and loads data and prints a report.\n\nYou will build an expense tracker that stores expenses in a CSV file, loads them back, and reports totals per category plus the three biggest expenses. The design uses the ideas from this level: a record models an expense, an enum models categories, an interface hides how data is stored, a custom exception reports storage problems, and streams produce the report. Money is stored as whole cents in an `int`, because floating-point numbers cannot represent most prices exactly.\n\n**Step 1: Model the data.** `Category` is an enum. `Expense` is a record whose compact constructor refuses invalid data, so an invalid expense can never exist. Commas are banned in descriptions because our CSV format would break on them.\n\n```java\nenum Category { FOOD, TRANSPORT, FUN, OTHER }\n\nrecord Expense(String description, Category category, int cents) {\n    Expense {\n        if (description == null || description.isBlank()) {\n            throw new IllegalArgumentException(\"description required\");\n        }\n        if (description.contains(\",\")) {\n            throw new IllegalArgumentException(\"description must not contain a comma\");\n        }\n        if (cents <= 0) {\n            throw new IllegalArgumentException(\"amount must be positive\");\n        }\n    }\n}\n```\n\n**Step 2: Define the storage contract.** The program depends on an `ExpenseStore` interface, so you could swap the CSV file for a database later without changing the report code. `StorageException` is a checked exception because a caller can reasonably handle a failed save or load.\n\n```java\ninterface ExpenseStore {\n    void saveAll(List<Expense> expenses) throws StorageException;\n    List<Expense> loadAll() throws StorageException;\n}\n\nclass StorageException extends Exception {\n    StorageException(String message, Throwable cause) { super(message, cause); }\n}\n```\n\n**Step 3: Implement the CSV store with `java.nio`.** Each expense becomes one line like `Groceries,FOOD,4250`. I/O errors are caught and rethrown as `StorageException` with the original as the cause. Parsing problems (a malformed line) throw an unchecked `IllegalArgumentException`, because that means the file is corrupt, not that I/O failed.\n\n```java\nclass CsvExpenseStore implements ExpenseStore {\n    private final Path file;\n\n    CsvExpenseStore(Path file) { this.file = file; }\n\n    @Override\n    public void saveAll(List<Expense> expenses) throws StorageException {\n        List<String> lines = expenses.stream()\n            .map(e -> e.description() + \",\" + e.category() + \",\" + e.cents())\n            .toList();\n        try {\n            Files.write(file, lines);\n        } catch (IOException e) {\n            throw new StorageException(\"Could not write \" + file, e);\n        }\n    }\n\n    @Override\n    public List<Expense> loadAll() throws StorageException {\n        try {\n            return Files.readAllLines(file).stream()\n                .filter(line -> !line.isBlank())\n                .map(CsvExpenseStore::parse)\n                .toList();\n        } catch (IOException e) {\n            throw new StorageException(\"Could not read \" + file, e);\n        }\n    }\n\n    private static Expense parse(String line) {\n        String[] parts = line.split(\",\");\n        if (parts.length != 3) {\n            throw new IllegalArgumentException(\"Bad line: \" + line);\n        }\n        return new Expense(parts[0], Category.valueOf(parts[1]), Integer.parseInt(parts[2]));\n    }\n}\n```\n\n**Step 4: Build the report with streams.** `ExpenseReport` keeps an unmodifiable copy of the expenses and answers questions about them. `totalsByCategory` uses `groupingBy` into an `EnumMap`, so categories print in declaration order.\n\n```java\nclass ExpenseReport {\n    private final List<Expense> expenses;\n\n    ExpenseReport(List<Expense> expenses) { this.expenses = List.copyOf(expenses); }\n\n    int total() {\n        return expenses.stream().mapToInt(Expense::cents).sum();\n    }\n\n    Map<Category, Integer> totalsByCategory() {\n        return expenses.stream().collect(Collectors.groupingBy(\n            Expense::category,\n            () -> new EnumMap<Category, Integer>(Category.class),\n            Collectors.summingInt(Expense::cents)));\n    }\n\n    List<Expense> top(int n) {\n        return expenses.stream()\n            .sorted(Comparator.comparingInt(Expense::cents).reversed())\n            .limit(n)\n            .toList();\n    }\n}\n```\n\n**Step 5: A small helper to format money, and the `main` method that wires it together.** `Main` must
