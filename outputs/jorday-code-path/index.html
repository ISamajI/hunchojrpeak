<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jorday's Code Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
/* Layout: exercise-book page on a faint grid — sticky HUD bar, quest map rail on the left, one quest at a time */
:root {
  --bg: #f5f7fa;
  --paper: #ffffff;
  --grid: rgba(40, 80, 140, 0.06);
  --ink: #17202c;
  --muted: #5a6778;
  --line: #dde3ea;
  --py: #2f6fa8;
  --py-soft: #e3eef8;
  --java: #c4510f;
  --java-soft: #fbeadf;
  --xp: #d99a00;
  --xp-soft: #fff4d6;
  --boss: #b4235a;
  --boss-soft: #fbe4ec;
  --accent: var(--py);
  --accent-soft: var(--py-soft);
  --code-bg: #f0f3f7;
  --code-ink: #1d2733;
  --hl-key: #8a3ffc;
  --hl-str: #1a7f37;
  --hl-num: #b35900;
  --hl-com: #6e7781;
  --hl-fn: #0b5cad;
  --done: #1a7f37;
  --shade: rgba(16, 22, 30, 0.55);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --paper: #161d26; --grid: rgba(140, 180, 230, 0.05); --ink: #e6ebf1; --muted: #9aa7b6; --line: #273240;
    --py: #6aaee8; --py-soft: #1b2b3c; --java: #f08a4b; --java-soft: #33221a; --xp: #f5c542; --xp-soft: #332a10; --boss: #f0709c; --boss-soft: #3a1a26;
    --code-bg: #0d1218; --code-ink: #d9e1ea; --hl-key: #c4a1ff; --hl-str: #7ee08f; --hl-num: #f5a35c; --hl-com: #7d8a99; --hl-fn: #79b8ff; --done: #5fd07a; --shade: rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --paper: #161d26; --grid: rgba(140, 180, 230, 0.05); --ink: #e6ebf1; --muted: #9aa7b6; --line: #273240;
  --py: #6aaee8; --py-soft: #1b2b3c; --java: #f08a4b; --java-soft: #33221a; --xp: #f5c542; --xp-soft: #332a10; --boss: #f0709c; --boss-soft: #3a1a26;
  --code-bg: #0d1218; --code-ink: #d9e1ea; --hl-key: #c4a1ff; --hl-str: #7ee08f; --hl-num: #f5a35c; --hl-com: #7d8a99; --hl-fn: #79b8ff; --done: #5fd07a; --shade: rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}
body[data-track="java"] { --accent: var(--java); --accent-soft: var(--java-soft); }
body[data-track="guide"] { --accent: var(--ink); --accent-soft: var(--line); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 17px/1.65 var(--f-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { font-family: inherit; }

/* ---------- top bar + HUD ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; }
.brand { font: 800 1.2rem/1 var(--f-display); letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand .prompt { font-family: var(--f-mono); font-weight: 600; color: var(--accent); font-size: 1rem; }
.tracks, .levels { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  font: 600 0.9rem/1 var(--f-body); border: 1px solid transparent; background: none; color: var(--muted);
  padding: 9px 13px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--ink); background: var(--bg); }
.tab[aria-selected="true"] { color: var(--paper); background: var(--ink); }
.tab.py[aria-selected="true"] { background: var(--py); }
.tab.java[aria-selected="true"] { background: var(--java); }
.levels .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.tab .lock { font-size: 0.8em; opacity: 0.7; }
.tab .star { color: var(--xp); }

.hud {
  margin-left: auto; display: flex; align-items: center; gap: 10px; cursor: pointer;
  background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px 5px 5px; color: var(--ink);
}
.hud:hover { border-color: var(--xp); }
.lvl-badge {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--xp); color: #1b1300; font: 800 0.95rem/1 var(--f-mono);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18);
}
.hud-text { display: grid; gap: 3px; min-width: 120px; text-align: left; }
.hud-rank { font: 700 0.8rem/1 var(--f-body); display: flex; justify-content: space-between; gap: 10px; }
.hud-rank .streak { color: var(--boss); font-variant-numeric: tabular-nums; }
.xpbar { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; }
.xpbar span { display: block; height: 100%; width: 0; background: var(--xp); transition: width .5s; }
.hud-xp { font: 600 0.7rem/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.shell {
  max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px;
}
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; max-height: calc(100vh - 110px); overflow-y: auto; padding-right: 4px; }
.world-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
.world-card .w-eyebrow { font: 700 0.7rem/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin: 0 0 6px; }
.world-card .w-name { font: 800 1.1rem/1.2 var(--f-display); margin: 0 0 10px; }
.progress-label { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

/* quest map */
.map { list-style: none; margin: 0; padding: 0; position: relative; }
.map::before { content: ""; position: absolute; left: 21px; top: 18px; bottom: 18px; width: 2px; background: var(--line); }
.map li { position: relative; }
.map button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center;
  font: 400 0.92rem/1.3 var(--f-body); color: var(--ink); background: none; border: 0; border-radius: 10px; padding: 6px 8px 6px 0; cursor: pointer;
}
.map button:hover:not([disabled]) { background: var(--paper); }
.map button[disabled] { cursor: not-allowed; color: var(--muted); }
.map button[aria-current="true"] { background: var(--paper); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }
.node {
  position: relative; z-index: 1; justify-self: center; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font: 700 0.75rem/1 var(--f-mono);
  background: var(--paper); border: 2px solid var(--line); color: var(--muted);
}
.is-open .node { border-color: var(--accent); color: var(--accent); }
.is-current .node { background: var(--accent); border-color: var(--accent); color: var(--paper); box-shadow: 0 0 0 4px var(--accent-soft); }
.is-done .node { background: var(--done); border-color: var(--done); color: var(--paper); }
.is-boss .node { width: 36px; height: 36px; border-radius: 9px; transform: rotate(45deg); }
.is-boss .node > span { transform: rotate(-45deg); }
.is-boss.is-open .node, .is-boss.is-current .node { border-color: var(--boss); color: var(--boss); background: var(--boss-soft); box-shadow: none; }
.is-boss.is-done .node { background: var(--done); border-color: var(--done); color: var(--paper); }
.q-meta { display: block; font: 600 0.68rem/1.4 var(--f-mono); color: var(--muted); letter-spacing: 0.04em; }
.is-boss .q-meta { color: var(--boss); }
.mobile-picker { display: none; }

/* ---------- lesson ---------- */
.lesson { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: clamp(20px, 4vw, 48px); min-width: 0; }
.quest-tag { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
.chip { font: 700 0.72rem/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.1em; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip.xp { background: var(--xp-soft); color: var(--ink); }
.chip.xp b { color: var(--xp); }
.chip.boss { background: var(--boss-soft); color: var(--boss); }
.chip.done { background: none; color: var(--done); border: 1px solid var(--done); }
.lesson h1, .lesson h2 { font-family: var(--f-display); letter-spacing: -0.02em; text-wrap: balance; line-height: 1.15; }
.lesson h1 { font-size: clamp(1.9rem, 4.5vw, 2.7rem); font-weight: 800; margin: 0 0 16px; }
.lesson h2 { font-size: 1.5rem; font-weight: 700; margin: 2em 0 0.5em; }
.lesson h3 { font: 700 1.12rem/1.3 var(--f-body); margin: 2em 0 0.5em; padding-top: 1em; border-top: 1px dashed var(--line); }
.lesson h4 { font: 700 1rem/1.3 var(--f-body); margin: 1.5em 0 0.4em; }
.body > * { max-width: 70ch; }
.body > pre, .body > table, .body > .table-wrap, .body > details { max-width: 100%; }
.body p:first-of-type strong:first-child { color: var(--accent); }
.body blockquote { margin: 1em 0; padding: 12px 16px; background: var(--accent-soft); border-radius: 8px; }
.body blockquote p { margin: 0; }
.body code, .body pre { font-variant-ligatures: none; }
.body code { font: 0.88em var(--f-mono); background: var(--code-bg); padding: 2px 5px; border-radius: 4px; }
.body pre { position: relative; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; overflow-x: auto; font: 0.86rem/1.6 var(--f-mono); }
.body pre code { background: none; padding: 0; font-size: inherit; }
.copy { position: absolute; top: 8px; right: 8px; font: 600 0.72rem/1 var(--f-body); background: var(--paper); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; cursor: pointer; opacity: 0.85; }
.copy:hover { color: var(--ink); opacity: 1; }
.table-wrap { overflow-x: auto; margin: 1em 0; }
.body table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
.body th, .body td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.body th { font-weight: 700; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; }
.body details { border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; margin: 1em 0; }
.body details[open] { padding-bottom: 8px; }
.body summary { cursor: pointer; font-weight: 700; padding: 12px 0; color: var(--accent); }
.body li { margin: 0.25em 0; }

/* practice checklist = quest objectives */
.objectives { list-style: none; padding: 0; display: grid; gap: 8px; }
.objectives li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin: 0; }
.objectives li.checked { border-color: var(--done); background: color-mix(in srgb, var(--done) 8%, transparent); }
.objectives input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--done); cursor: pointer; }
.objectives label { cursor: pointer; min-width: 0; }
.obj-hint { font-size: 0.85rem; color: var(--muted); margin: -4px 0 8px; }

.hljs-keyword, .hljs-built_in, .hljs-type, .hljs-meta .hljs-keyword { color: var(--hl-key); }
.hljs-string, .hljs-subst { color: var(--hl-str); }
.hljs-number, .hljs-literal { color: var(--hl-num); }
.hljs-comment, .hljs-meta { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--hl-fn); }
.hljs-params, .hljs-variable { color: var(--code-ink); }

.lesson-foot { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
.claim-wrap { display: grid; gap: 6px; }
.claim-note { font-size: 0.82rem; color: var(--muted); }
.btn { font: 700 0.95rem/1 var(--f-body); border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.btn:hover:not([disabled]) { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.btn.claim { background: var(--xp); color: #1b1300; border-color: var(--xp); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15); }
.btn.claim.boss { background: var(--boss); color: #fff; border-color: var(--boss); }
.btn.done { background: none; color: var(--done); border-color: var(--done); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.nav-pair { display: flex; gap: 8px; }

/* locked world screen */
.locked { text-align: center; padding-block: 40px; display: grid; gap: 14px; justify-items: center; }
.locked .big-lock { font-size: 3rem; line-height: 1; }
.locked h1 { margin: 0; }
.locked p { color: var(--muted); max-width: 46ch; margin: 0; }
.link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 0.85rem; }
.confirm-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* ---------- toast, modal, confetti ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 30;
  background: var(--ink); color: var(--paper); font: 800 1rem/1 var(--f-mono); padding: 14px 20px; border-radius: 999px;
  transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast b { color: var(--xp); }
.modal-back { position: fixed; inset: 0; z-index: 40; background: var(--shade); display: grid; place-items: center; padding: 16px; }
.modal {
  background: var(--paper); border: 1px solid var(--line); border-radius: 18px; width: min(460px, 100%); max-height: 88vh; overflow-y: auto;
  padding: 28px; text-align: center; display: grid; gap: 12px; animation: pop .35s cubic-bezier(.2,1.4,.4,1);
}
.modal .m-icon { font-size: 3rem; line-height: 1; }
.modal h2 { font: 800 1.8rem/1.1 var(--f-display); margin: 0; letter-spacing: -0.02em; }
.modal p { margin: 0; color: var(--muted); }
.modal .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.modal .new-badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; width: 100%; height: 100%; }

/* player card */
.player { text-align: left; }
.player-head { display: flex; gap: 14px; align-items: center; }
.player-head .lvl-badge { width: 60px; height: 60px; font-size: 1.4rem; }
.player-head h2 { font-size: 1.5rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.stat b { display: block; font: 800 1.3rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.75rem; color: var(--muted); }
.sect-title { font: 700 0.72rem/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 8px 0 0; }
.worlds { display: grid; gap: 8px; }
.world-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 0.88rem; align-items: center; }
.world-row .bar { grid-column: 1 / -1; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 4px; justify-items: center; text-align: center; }
.badge .b-icon { font-size: 1.6rem; line-height: 1; }
.badge b { font-size: 0.8rem; line-height: 1.2; }
.badge span { font-size: 0.7rem; color: var(--muted); line-height: 1.3; }
.badge.off { opacity: 0.45; filter: grayscale(1); }
.badge.mini { padding: 8px 12px; grid-auto-flow: column; align-items: center; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 48px; }
  .rail { position: static; max-height: none; overflow: visible; padding-right: 0; }
  .map { display: none; }
  .mobile-picker { display: block; width: 100%; font: 600 1rem var(--f-body); padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
  .world-card { margin-bottom: 10px; }
  .brand { flex: 1; }
  .hud { margin-left: 0; }
  .hud-text { min-width: 96px; }
}
@media (prefers-reduced-motion: reduce) {
  .bar span, .xpbar span, .toast { transition: none; }
  .modal { animation: none; }
}
</style>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="prompt">&gt;_</span>Jorday's Code Path</div>
    <button class="hud" id="hud" aria-label="Open player card">
      <span class="lvl-badge" id="hud-level">1</span>
      <span class="hud-text">
        <span class="hud-rank"><span id="hud-rank">Hello World</span><span class="streak" id="hud-streak"></span></span>
        <span class="xpbar"><span id="hud-bar"></span></span>
        <span class="hud-xp" id="hud-xp">0 XP</span>
      </span>
    </button>
    <nav class="tracks" role="tablist" aria-label="Track">
      <button class="tab" data-track="guide" role="tab">Start Here</button>
      <button class="tab py" data-track="python" role="tab">Python</button>
      <button class="tab java" data-track="java" role="tab">Java</button>
    </nav>
    <nav class="levels" role="tablist" aria-label="World" id="levels">
      <button class="tab" data-level="beginner" role="tab">Beginner</button>
      <button class="tab" data-level="intermediate" role="tab">Intermediate</button>
      <button class="tab" data-level="expert" role="tab">Expert</button>
    </nav>
  </div>
</header>

<div class="shell">
  <aside class="rail">
    <div class="world-card">
      <p class="w-eyebrow" id="w-eyebrow">World</p>
      <p class="w-name" id="w-name"></p>
      <div class="progress-label"><span id="progress-name">Quests cleared</span><span id="progress-count">0 / 0</span></div>
      <div class="bar"><span id="progress-bar"></span></div>
    </div>
    <label for="picker" hidden>Jump to quest</label>
    <select id="picker" class="mobile-picker"></select>
    <ol class="map" id="map"></ol>
  </aside>
  <main class="lesson" id="lesson">
    <div class="quest-tag" id="quest-tag"></div>
    <div class="body" id="body"></div>
    <div class="lesson-foot" id="foot">
      <div class="claim-wrap">
        <button class="btn claim" id="claim">Claim XP</button>
        <span class="claim-note" id="claim-note"></span>
      </div>
      <div class="nav-pair">
        <button class="btn" id="prev">← Back</button>
        <button class="btn primary" id="next">Next →</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="course-data" type="application/json">{"guide": "# Start Here\n\nWelcome, Jorday. This course takes you from \"I have never written code\" to \"I can build real things\" in Python and Java. Everything here is free. Facts in this guide were checked on 2026-10-31. Anything we could not check is marked \"(unverified)\".\n\n## Python or Java first?\n\n**Start with Python.** It is the friendliest first language. You write less code to do the same thing, the error messages are easier to read, and you see results fast, which keeps you motivated. Java is not bad to start with, but it makes you learn extra \"ceremony\" (classes, types, a `main` method) before your first real program works. Learn Python first, then Java will feel much more logical.\n\nDo both in the end. They teach different ideas, and knowing both makes you a stronger programmer.\n\n| | Python | Java |\n|---|---|---|\n| Typing | Dynamic: you don't say what type a variable is, Python figures it out while running | Static: you declare types (`int`, `String`) and the compiler catches mistakes before you run |\n| Speed | Slower to run, much faster to write | Faster to run (compiled to bytecode, then optimized by the JVM) |\n| Code length | Short and readable | Longer and more formal |\n| Where it's used | Data science, AI/machine learning, automation, scripting, web backends | Big company backends, Android apps (along with Kotlin), banking and enterprise systems, games like Minecraft (Java Edition) |\n| Jobs | Lots of jobs, especially data, AI and backend | Lots of jobs, especially at large companies and in finance |\n\nPlain version: Python is for getting ideas working quickly. Java is for building big, long-lived systems where the compiler's strictness helps. The \"jobs\" row is general industry knowledge, not a measured stat (unverified).\n\n## Set up your computer\n\n### Python\n\n- **Current stable version:** Python **3.15.2** (python.org download page, checked 2026-10-31). Python 3.15.0 came out on 2026-10-09, so it is brand new. Python 3.14 is still fully supported if a tutorial or library tells you 3.15 isn't ready yet. Any version from 3.12 up is fine for this course.\n- **Windows:** go to <https://www.python.org/downloads/>, download the installer, and **tick \"Add python.exe to PATH\"** on the first screen before clicking Install.\n- **Mac:** download the macOS installer from the same page and open it. (If you already use Homebrew, `brew install python` also works.)\n- **Editor:**\n  - Total beginner: **Thonny** (<https://thonny.org/>), a simple free editor made for learning. It includes Python, so you can skip the separate install at first.\n  - When you're ready for a \"real\" editor: **VS Code** (<https://code.visualstudio.com/>) plus the Microsoft **Python** extension (<https://marketplace.visualstudio.com/items?itemName=ms-python.python>).\n- **Check it works:** open a terminal (Command Prompt/PowerShell on Windows, Terminal on Mac) and run `python --version`. On Mac you may need `python3 --version`. You should see 3.15.x (or whichever version you installed).\n- **Virtual environment (one line):** `python -m venv .venv` (on Windows activate with `.venv\\Scripts\\activate`; on Mac with `source .venv/bin/activate`). A venv keeps each project's add-on packages separate. Docs: <https://docs.python.org/3/library/venv.html>\n\n### Java\n\n- **Current LTS JDK:** confirmed, **Java 25 is the current LTS** (Long-Term Support). It was released September 2025, and Adoptium's API lists 25 as the most recent LTS (earlier LTS versions are 21, 17, 11 and 8). Newer non-LTS versions exist, but beginners should stick with LTS.\n- **Where to get it:** Eclipse **Temurin** 25 from Adoptium: <https://adoptium.net/temurin/releases/> (install guide: <https://adoptium.net/installation/>). Pick your OS, choose version 25, JDK, and download the installer (`.msi` for Windows, `.pkg` for Mac). Make sure to pick the one matching your chip (Apple Silicon = aarch64, older Macs = x64).\n- **Windows tip:** in the installer, turn on the options to set `JAVA_HOME` and add Java to PATH.\n- **Editor:**\n  - **IntelliJ IDEA** (<https://www.jetbrains.com/idea/download/>). Note: JetBrains stopped making a separate \"Community Edition\" download from version 2025.3. There is now one IntelliJ IDEA installer, and it stays free to use with the core features, with paid extras (per JetBrains' announcements and news coverage, so check the download page for the current wording). Older tutorials saying \"download Community\" mean this free version.\n  - Or **VS Code** with Microsoft's Java extension pack: <https://code.visualstudio.com/docs/languages/java>.\n- **Check it works:** open a terminal and run `java -version`. You should see a version starting with 25. Also try `javac -version` (the compiler).\n\n### Zero-install option\n\nNo installing needed. These all loaded and offer a free tier on 2026-10-31:\n\n- **Online-Python** (<https://www.online-python.org/>): quick Python in the browser.\n- **JDoodle** (<https://www.jdoodle.com/online-java-compiler>): Java (and many other languages). Free to use, but the free plan has limits on how long a session runs (its FAQ says three minutes on free vs ten on paid), so it's for short experiments.\n- **OnlineGDB** (<https://www.onlinegdb.com/>): Python, Java and more, in the browser.\n- **Programiz Python compiler** (<https://www.programiz.com/python-programming/online-compiler/>): simple and clean.\n- **Python Tutor** (<https://pythontutor.com/>): runs your code step by step and draws what's happening in memory. Great for understanding, for both Python and Java.\n- **Replit** (<https://replit.com/>): the site loads and has a free plan, but its pricing page shows the free plan is limited (usage caps, and it is now built around an AI app builder). Treat it as optional and check the pricing page yourself before relying on it. Exact limits for coding-only use: (unverified).\n\nUse these to try things out. Install a real setup once you're past week 2, because bigger projects need it.\n\n## Study plan\n\n**Assumption:** about 6 hours per week (for example 1 hour on 5 days, plus a longer 1-hour project block on the weekend). If you can do more, you'll move faster. If you can do less, just stretch the weeks. Finishing matters more than speed.\n\n| Weeks | Focus |\n|---|---|\n| 1 to 8 | **Python Beginner**: variables, input/output, if/else, loops, functions, lists, dictionaries, simple files. Finish with one small project |\n| 9 to 14 | **Python Intermediate**: classes and objects, errors and testing, modules, working with files and APIs, a bigger project |\n| 15 to 18 | **Java Beginner**: same ideas you already know, now with types and classes. It will go faster than Python did. Do not skip this because it feels like a repeat |\n| 19 to 26 | **Java Intermediate**: object-oriented design, collections, exceptions, Maven/Gradle basics, tests |\n| 27 to 34 | **Python Expert**: advanced features, performance, packaging, a serious project |\n| 35 to 42 | **Java Expert**: concurrency, streams, JVM basics, a serious project |\n| 43 and on | Pick a path (web, data, Android, backend) and build a portfolio. See the last section |\n\nYou can also go Python all the way to Expert first, then Java. Both orders work. Keep a \"mix\" rule: never go more than two weeks without building something of your own.\n\n### How to study\n\n- **Type the code, don't copy-paste.** Your fingers learn what your eyes skim past.\n- **The 20-minute rule.** Stuck? Try on your own for 20 minutes (read the error, print values, simplify). Then ask for help or look it up. Don't suffer for hours, and don't give up after 2 minutes.\n- **Build projects.** After each unit, make something small that isn't in the lesson. Tutorials teach you to follow, projects teach you to think.\n- **Use AI as a tutor, not a crutch.** Ask it to explain an error or give a hint, not to write the answer. Good prompt: \"Don't give me the code, just tell me what to look at.\" Always type out and understand what you use.\n- **Read error messages.** The last line usually tells you exactly what's wrong.\n- **Little and often beats a big cram.** 1 hour a day is better than 7 hours on Sunday.\n- **Review.** At the start of each week, redo one exercise from last week without looking.\n- **Save your work on GitHub** from week 1 (see the last section).\n\n## Practice sites\n\nAll of these loaded on 2026-10-31. \"Free\" is based on what each site showed us. LeetCode blocked our automated checker, so its details are from general knowledge (unverified).\n\n| Name | Link | Free? | Best for | Level |\n|---|---|---|---|---|\n| Exercism | <https://exercism.org/> | Yes (non-profit) | Practice with real mentoring-style feedback; has Python and Java tracks | Beginner to expert |\n| Codewars | <https://www.codewars.com/> | Free to use (some paid extras may exist, unverified) | Short \"kata\" puzzles, ranked like martial arts belts | Beginner to expert |\n| CodingBat | <https://codingbat.com/> | Yes | Tiny warm-up problems in Python and Java, instant feedback | Beginner |\n| HackerRank | <https://www.hackerrank.com/domains/python> | Yes for practice | Structured tracks, plus the way many companies test applicants | Beginner to intermediate |\n| LeetCode | <https://leetcode.com/> | Free tier, with a paid Premium (unverified) | Interview-style algorithm problems | Intermediate to expert |\n| Advent of Code | <https://adventofcode.com/> | Yes | Fun daily puzzles every December 1 to 12 (fun, not for beginners at first) | Intermediate to expert |\n| Python Tutor | <https://pythontutor.com/> | Yes | Seeing your code run step by step | Beginner |\n\nTip: start with CodingBat and Exercism. Save LeetCode for later, when you're getting ready for job interviews.\n\n## Best free resources\n\n### Python\n\n1. **The official Python Tutorial**: <https://docs.python.org/3/tutorial/>. Free, accurate and always up to date. A bit dry, so use it as a reference.\n2. **CS50's Introduction to Programming with Python (CS50P)**: <https://cs50.harvard.edu/python/>. Harvard's free course with videos, notes and problem sets. Best structured \"real course\" for a beginner.\n3. **MOOC.fi Python Programming 2025**: <https://programming-25.mooc.fi/>. University of Helsinki's free, hands-on course with exercises as you go.\n4. **Automate the Boring Stuff with Python**: <https://automatetheboringstuff.com/>. Free to read online. Teaches Python by making it do useful chores.\n5. **freeCodeCamp Scientific Computing with Python**: <https://www.freecodecamp.org/learn/scientific-computing-with-python/>. Free, in-browser lessons and projects.\n6. **Learn Python (learnpython.org)**: <https://www.learnpython.org/>. Short interactive lessons you can run in the page.\n7. **Python Tutor**: <https://pythontutor.com/>. Visualize how code runs.\n8. **Real Python (free articles)**: <https://realpython.com/>. High-quality tutorials. Many articles are free and some content needs a paid account. The site blocked our automated checker, so the link works for people but we couldn't confirm the current free/paid split (unverified).\n\n### Java\n\n1. **dev.java Learn**: <https://dev.java/learn/>. The official learning site from Oracle's Java team. Free, current.\n2. **MOOC.fi Java Programming**: <https://java-programming.mooc.fi/>. University of Helsinki's free course, very good for beginners, with exercises throughout.\n3. **The Java Tutorials (Oracle)**: <https://docs.oracle.com/javase/tutorial/>. The classic free reference. Some pages are for older Java versions, so check the language features against Java 25.\n4. **Java SE 25 documentation**: <https://docs.oracle.com/en/java/javase/25/>. Official docs for the version you're installing.\n5. **CS50 (the main course)**: <https://cs50.harvard.edu/x/>. Harvard's free intro to computer science. It isn't Java-specific, but it teaches the thinking behind code, which makes Java easier.\n6. **Exercism Java track**: <https://exercism.org/tracks/java>. Free practice exercises with feedback.\n7. **W3Schools Java**: <https://www.w3schools.com/java/>. Quick, simple examples. Good for looking things up, not as your only source.\n8. **Baeldung**: <https://www.baeldung.com/>. Excellent tutorials for intermediate and expert Java topics (Spring, testing). It blocked our automated checker, so we couldn't confirm what's free versus paid (unverified).\n\n## Project ideas by level\n\n### Python\n\n**Beginner**\n1. Number guessing game\n2. Tip and bill splitter calculator\n3. Rock-paper-scissors against the computer\n4. To-do list that saves to a text file\n5. Quiz game with scores\n\n**Intermediate**\n1. Text-based adventure game with classes\n2. Weather app using a free public API\n3. Expense tracker saving to a CSV or SQLite database\n4. Web scraper that collects data (respect each site's rules)\n5. Discord or Telegram bot\n\n**Expert**\n1. Web app with Flask or Django and a real database\n2. Machine learning project (predict something from a public dataset)\n3. Your own command-line tool published as a package\n4. Multiplayer game server with sockets\n5. Data dashboard with live charts\n\n### Java\n\n**Beginner**\n1. Console calculator\n2. Hangman\n3. Temperature converter\n4. Student grade tracker using arrays\n5. Tic-tac-toe in the terminal\n\n**Intermediate**\n1. Bank account simulator with classes and exceptions\n2. Library or inventory management system with collections\n3. Desktop to-do app with JavaFX\n4. Minecraft (Java Edition) plugin or mod\n5. Text-file or JSON-based contact book\n\n**Expert**\n1. REST API with Spring Boot and a database\n2. Android app (Kotlin is the main language there now, but Java still works)\n3. Multithreaded chat server\n4. Your own small programming language or expression parser\n5. Game engine basics: a 2D game with its own game loop\n\n## Getting hired / what's next\n\n**GitHub portfolio.** Make a free account at <https://github.com/> in week 1 and put every project on it. Write a short README for each (what it does, a screenshot, how to run it). Aim for 3 to 5 projects you're proud of rather than 30 half-done ones. Employers care more about what you've built than about certificates.\n\n**Certifications: worth it or not?**\n- **Python Institute PCEP/PCAP** (<https://pythoninstitute.org/pcep>, <https://pythoninstitute.org/pcap>): PCEP is entry level, PCAP is associate. They are nice to have as proof you know the basics, but they are paid exams (current prices: check the site, unverified) and most employers care more about projects. Optional.\n- **Oracle Certified Professional, Java SE** (<https://education.oracle.com/>): respected for Java, especially in big companies. It is a paid exam, and it's a later goal (after Java Intermediate), not a starter step. We couldn't check the current exam names and prices (unverified), so look on Oracle's site when you get there.\n- **Rule of thumb:** skip certificates until you have a few projects. A certificate without projects doesn't impress anyone.\n\n**What the jobs look like.**\n- **Python:** data analyst and data scientist, machine learning, backend developer, automation and scripting, QA/test automation.\n- **Java:** backend developer (Spring Boot), enterprise and banking software, Android developer, big-company platform and cloud teams.\n- Both often start as junior or intern roles. Learning Git, SQL, and how to read other people's code helps a lot in either.\n- Salary numbers vary by country and year, so we have not quoted any.\n\n**Next steps, pick one path:**\n- **Web:** HTML/CSS/JavaScript first, then Flask/Django (Python) or Spring Boot (Java).\n- **Data and AI:** Python with pandas, NumPy, then machine learning.\n- **Android:** Kotlin (it builds on what you learn in Java).\n- **Backend:** databases (SQL), APIs, Docker, and cloud basics.\n\nWhatever you pick, keep building. Good luck.\n", "python-beginner": "# Python — Beginner\nWelcome! This level takes you from \"I have never written code\" to \"I can build small programs that actually do something.\" Python is a great first language because it reads almost like English. You will learn it the way most good courses teach it (the official Python tutorial, Harvard's CS50P, and *Automate the Boring Stuff* all follow roughly this order): run code, store information, make decisions, repeat things, organize data, and package your code into reusable pieces. Everything here targets modern Python (3.12 or newer, but nearly all of it works on older 3.x too). The golden rule: type the examples yourself instead of copy-pasting, break them on purpose, and do every practice exercise. You learn to code by coding.\n\n## Module 1: What Is Programming? Running Python\n\n**Goal:** Explain what a program is and run Python code two ways: in the interactive prompt and from a file.\n\nA **program** is a list of instructions for a computer. Think of a recipe: \"crack two eggs, whisk, pour into pan.\" A computer follows instructions exactly, in order, and it does not guess what you meant. That is the hard part and the fun part of programming: be precise and the computer does amazing things.\n\n**Python** is a language we use to write those instructions. A program that reads Python and carries it out is called the **interpreter**.\n\nFirst, install Python from python.org (get the newest 3.x) and check it worked. Open a terminal (Terminal on Mac, PowerShell on Windows) and type:\n\n```\npython3 --version\n```\n\nOutput (yours may differ):\n\n```\nPython 3.12.4\n```\n\nOn Windows the command is often `python` instead of `python3`. Use whichever works.\n\nThere are two ways to run Python.\n\n**Way 1: the REPL (the interactive prompt).** Type `python3` and press Enter. You see `>>>`. REPL stands for Read-Evaluate-Print-Loop: you type one line, Python answers immediately. It's like texting Python. It is perfect for experiments.\n\n```python\n>>> 2 + 3\n5\n>>> \"hi\" * 3\n'hihihi'\n```\n\nType `exit()` to leave.\n\n**Way 2: a file.** Create a file named `hello.py`, put code in it, and run it with `python3 hello.py`. This is like writing a whole letter instead of texting. Programs you want to keep live in files.\n\n```python\n# hello.py\nprint(\"Hello, world!\")\n```\n\nRun it in the terminal:\n\n```\npython3 hello.py\n```\n\nOutput:\n\n```\nHello, world!\n```\n\nRule of thumb: REPL to try ideas, files to build real programs. Use any text editor; VS Code is a popular free choice.\n\n### Common mistakes\n- Typing `python3 hello.py` inside the REPL (the `>>>`). That command goes in the normal terminal.\n- Running the command in the wrong folder. Use `cd folder_name` to move to where your file is.\n- Saving the file as `hello.py.txt`. Make sure the name really ends in `.py`.\n- Naming your file `random.py` or `math.py`. This breaks Python's own tools later. Pick other names.\n\n### Practice\n1. Check your Python version in the terminal and write it down.\n2. In the REPL, work out how many seconds are in a day (`60 * 60 * 24`).\n3. Create `hello.py` that prints a greeting, and run it.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1. In the terminal: python3 --version\n\n# 2. In the REPL:\n# >>> 60 * 60 * 24\n# 86400\n\n# 3. hello.py\nprint(\"Hi, I'm learning Python!\")\n# Output: Hi, I'm learning Python!\n```\n\n<\/details>\n\n## Module 2: print() and Comments\n\n**Goal:** Display text and numbers on screen and leave notes in your code for humans.\n\n`print()` shows things on the screen. It's how your program talks to you. Whatever goes inside the parentheses gets displayed. Text must be wrapped in quotes (single or double, your choice, but match them).\n\n```python\nprint(\"Hello!\")\nprint('Single quotes work too')\nprint(42)\n```\n\nOutput:\n\n```\nHello!\nSingle quotes work too\n42\n```\n\nYou can print several things at once, separated by commas. Python puts a space between them.\n\n```python\nprint(\"I am\", 15, \"years old\")\n```\n\nOutput:\n\n```\nI am 15 years old\n```\n\nEach `print` starts a new line. A special character `\\n` means \"new line\" and `\\t` means \"tab.\" If you want a quote inside your text, use the other kind of quote around it, or put a backslash before it.\n\n```python\nprint(\"Line one\\nLine two\")\nprint(\"She said \\\"hi\\\"\")\nprint('It\\'s fine')\nprint(\"It's also fine\")\n```\n\nOutput:\n\n```\nLine one\nLine two\nShe said \"hi\"\nIt's fine\nIt's also fine\n```\n\nYou can change the ending of a print with `end=`:\n\n```python\nprint(\"Loading\", end=\"...\")\nprint(\"done\")\n```\n\nOutput:\n\n```\nLoading...done\n```\n\n**Comments** are notes for humans. Python ignores everything after a `#`. Use them to explain *why*, not to repeat what the code obviously does. Think of them as sticky notes on the recipe.\n\n```python\n# This whole line is a comment\nprint(\"Visible\")  # a comment after code is fine too\n# print(\"Hidden\")  <- commented out, so Python skips it\n```\n\nOutput:\n\n```\nVisible\n```\n\nCommenting out a line is a handy trick to turn code off temporarily.\n\n### Common mistakes\n- Forgetting quotes: `print(Hello)` makes Python look for something called Hello and fail.\n- Mismatched quotes: `print(\"Hi')`.\n- Forgetting the closing parenthesis.\n- Capital P: `Print(\"Hi\")` fails. Python cares about uppercase vs lowercase.\n\n### Practice\n1. Print your name on one line and your favorite food on the next, using two `print` calls.\n2. Print the sentence `He said \"wow\"` with the quotes showing.\n3. Use one `print` call with `\\n` to show three lines. Then add a comment explaining it.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nprint(\"Jorday\")\nprint(\"Pizza\")\n\n# 2\nprint('He said \"wow\"')\n\n# 3\n# \\n starts a new line, so one print can show three lines\nprint(\"one\\ntwo\\nthree\")\n```\n\n<\/details>\n\n## Module 3: Variables and Data Types\n\n**Goal:** Store information in variables and know the four basic types: int, float, str, and bool.\n\nA **variable** is a labeled box. You put a value in, stick a name on it, and later grab the value by name. The `=` sign here does not mean \"equals\" like in math. It means \"put this value in that box.\"\n\n```python\nage = 15\nname = \"Jorday\"\nprint(name)\nprint(age)\n```\n\nOutput:\n\n```\nJorday\n15\n```\n\nYou can change what's in the box any time:\n\n```python\nscore = 10\nscore = score + 5   # take the old value, add 5, store it back\nprint(score)\n```\n\nOutput:\n\n```\n15\n```\n\nShortcut: `score += 5` does the same thing. There's also `-=`, `*=`, and `/=`.\n\n**Naming rules:** letters, numbers, and underscores only; can't start with a number; no spaces. Python style is `snake_case` (lowercase with underscores), like `high_score`. Choose names that say what's inside.\n\n**The four basic types.** Every value has a type, which is the kind of thing it is:\n\n| Type | What it is | Example |\n|------|-----------|---------|\n| `int` | whole number | `7`, `-3`, `0` |\n| `float` | number with a decimal point | `3.14`, `-0.5` |\n| `str` | text (a \"string\" of characters) | `\"hello\"` |\n| `bool` | True or False | `True`, `False` |\n\nUse `type()` to ask Python what something is:\n\n```python\nprint(type(7))\nprint(type(3.14))\nprint(type(\"hello\"))\nprint(type(True))\n```\n\nOutput:\n\n```\n<class 'int'>\n<class 'float'>\n<class 'str'>\n<class 'bool'>\n```\n\nImportant: `\"7\"` (with quotes) is text, not a number. You can't do math with it. And `True`/`False` must start with a capital letter.\n\nPython also has a special \"nothing\" value, `None`. You'll meet it again with functions.\n\n### Common mistakes\n- Using a variable before giving it a value: `print(x)` when `x` was never set gives a `NameError`.\n- Spaces in names: `my score = 5` is an error. Use `my_score`.\n- Thinking `\"5\"` and `5` are the same. They are different types.\n- Writing `true` instead of `True`.\n\n### Practice\n1. Make variables `name`, `age`, and `height` (a float, like 1.7) and print each one.\n2. Create `lives = 3`, then reduce it by 1 using `-=`, and print it.\n3. Print the type of each of these: `100`, `\"100\"`, `100.0`, `False`.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nname = \"Jorday\"\nage = 15\nheight = 1.7\nprint(name)\nprint(age)\nprint(height)\n\n# 2\nlives = 3\nlives -= 1\nprint(lives)  # 2\n\n# 3\nprint(type(100))     # <class 'int'>\nprint(type(\"100\"))   # <class 'str'>\nprint(type(100.0))   # <class 'float'>\nprint(type(False))   # <class 'bool'>\n```\n\n<\/details>\n\n## Module 4: Input and Type Conversion\n\n**Goal:** Ask the user questions and turn their answers into the right type.\n\n`input()` pauses your program, shows a message, and waits for the user to type something and press Enter. Whatever they type is handed back to you.\n\n```python\nname = input(\"What is your name? \")\nprint(\"Nice to meet you,\", name)\n```\n\nExample run (the user types `Sam`):\n\n```\nWhat is your name? Sam\nNice to meet you, Sam\n```\n\n**Big gotcha:** `input()` always gives you a `str`, even if the user types digits. If you try to do math on it, you'll get surprises:\n\n```python\nage = input(\"Age? \")\nprint(type(age))\n```\n\nExample run (user types `15`):\n\n```\nAge? 15\n<class 'str'>\n```\n\nTo fix this, **convert** the type with `int()`, `float()`, or `str()`. Think of it like pouring juice from one cup into a different shaped cup.\n\n```python\nage_text = \"15\"\nage_number = int(age_text)\nprint(age_number + 1)\n\nprint(float(\"2.5\") * 2)\nprint(\"I am \" + str(15) + \" years old\")\n```\n\nOutput:\n\n```\n16\n5.0\nI am 15 years old\n```\n\nThe usual pattern is to wrap `input` right away:\n\n```python\nage = int(input(\"How old are you? \"))\nprint(\"Next year you will be\", age + 1)\n```\n\nExample run (user types `15`):\n\n```\nHow old are you? 15\nNext year you will be 16\n```\n\n`int(\"hello\")` or `int(\"2.5\")` crashes with a `ValueError`. In Module 11 you'll learn to handle that gracefully.\n\nConverting to bool is useful to know too: `bool(0)`, `bool(\"\")` are `False`; almost everything else is `True`.\n\n```python\nprint(bool(0))\nprint(bool(\"\"))\nprint(bool(\"hi\"))\nprint(int(3.9))   # int() chops off the decimal, it does not round\n```\n\nOutput:\n\n```\nFalse\nFalse\nTrue\n3\n```\n\n### Common mistakes\n- Forgetting `int()` and then trying `age + 1`. You get a `TypeError`.\n- Using `int()` on a decimal string like `\"2.5\"`. Use `float()` for that.\n- Forgetting the space at the end of the prompt text (`\"Name?\"` vs `\"Name? \"`), which makes the answer jammed against the question.\n- Adding a string and a number: `\"Age: \" + 15` fails. Use `str(15)` or an f-string (next module).\n\n### Practice\n1. Ask for the user's name and greet them.\n2. Ask for two whole numbers and print their sum.\n3. Ask for a number and print double its value. Make it work with decimals, like `2.5`.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nname = input(\"Name? \")\nprint(\"Hello,\", name)\n\n# 2\na = int(input(\"First number: \"))\nb = int(input(\"Second number: \"))\nprint(a + b)\n\n# 3 (float handles decimals)\nx = float(input(\"Number: \"))\nprint(x * 2)\n```\n\n<\/details>\n\n## Module 5: Math, Strings, and f-strings\n\n**Goal:** Do calculations, work with text, and build nice messages using f-strings.\n\n**Math operators:**\n\n| Operator | Meaning | Example | Result |\n|---|---|---|---|\n| `+` | add | `7 + 2` | `9` |\n| `-` | subtract | `7 - 2` | `5` |\n| `*` | multiply | `7 * 2` | `14` |\n| `/` | divide (always a float) | `7 / 2` | `3.5` |\n| `//` | floor divide (drop the remainder) | `7 // 2` | `3` |\n| `%` | remainder (\"modulo\") | `7 % 2` | `1` |\n| `**` | power | `7 ** 2` | `49` |\n\n```python\nprint(7 / 2)\nprint(7 // 2)\nprint(7 % 2)\nprint(2 ** 10)\nprint(10 / 5)\n```\n\nOutput:\n\n```\n3.5\n3\n1\n1024\n2.0\n```\n\n`%` is great for checking even/odd: `n % 2` is `0` for even numbers. Python follows normal math order (brackets first, then `**`, then `* /`, then `+ -`).\n\n```python\nprint(2 + 3 * 4)\nprint((2 + 3) * 4)\n```\n\nOutput:\n\n```\n14\n20\n```\n\nDecimals can be slightly off because of how computers store them. `round()` tidies up:\n\n```python\nprint(0.1 + 0.2)\nprint(round(0.1 + 0.2, 2))\n```\n\nOutput:\n\n```\n0.30000000000000004\n0.3\n```\n\n**Strings.** Join with `+`, repeat with `*`:\n\n```python\nfirst = \"Ice\"\nsecond = \"cream\"\nprint(first + \" \" + second)\nprint(\"ha\" * 3)\n```\n\nOutput:\n\n```\nIce cream\nhahaha\n```\n\nUseful string tools (called **methods**, which are actions that belong to a value, written with a dot):\n\n```python\nword = \"Python Rocks\"\nprint(len(word))\nprint(word.upper())\nprint(word.lower())\nprint(word.replace(\"Rocks\", \"Rules\"))\nprint(\"  spaced  \".strip())\n```\n\nOutput:\n\n```\n12\nPYTHON ROCKS\npython rocks\nPython Rules\nspaced\n```\n\n**Indexing and slicing.** Each character has a position, starting at **0** (not 1!). Negative numbers count from the end.\n\n```python\nword = \"Python\"\nprint(word[0])\nprint(word[-1])\nprint(word[0:3])   # from 0 up to (not including) 3\nprint(word[2:])    # from 2 to the end\n```\n\nOutput:\n\n```\nP\nn\nPyt\nthon\n```\n\nStrings can't be changed in place; methods give you a new string.\n\n**f-strings** are the best way to mix variables into text. Put an `f` before the quote and wrap variables in `{}`:\n\n```python\nname = \"Jorday\"\nage = 15\nprint(f\"{name} is {age} years old\")\nprint(f\"Next year: {age + 1}\")\n\nprice = 4.5\nprint(f\"Price: ${price:.2f}\")\n```\n\nOutput:\n\n```\nJorday is 15 years old\nNext year: 16\nPrice: $4.50\n```\n\n`:.2f` means \"show 2 digits after the decimal point.\" You can put real expressions inside `{}`.\n\n### Common mistakes\n- Forgetting the `f` in front of an f-string. You'd see the curly braces printed literally.\n- Expecting `7 / 2` to be `3`. Use `//` for that.\n- Counting positions from 1. The first character is index `0`.\n- Trying `word[0] = \"J\"` to change a string. Strings are immutable; build a new one instead.\n\n### Practice\n1. Ask for a number of minutes and print how many whole hours and leftover minutes that is (use `//` and `%`).\n2. Ask for the user's name and print it in uppercase plus how many letters it has, using an f-string.\n3. Given `item = \"hoodie\"` and `cost = 29.5`, print `The hoodie costs $29.50`.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nminutes = int(input(\"Minutes: \"))\nprint(f\"{minutes // 60} hours and {minutes % 60} minutes\")\n# 130 -> 2 hours and 10 minutes\n\n# 2\nname = input(\"Name: \")\nprint(f\"{name.upper()} has {len(name)} letters\")\n\n# 3\nitem = \"hoodie\"\ncost = 29.5\nprint(f\"The {item} costs ${cost:.2f}\")\n# The hoodie costs $29.50\n```\n\n<\/details>\n\n## Module 6: Decisions with if / elif / else\n\n**Goal:** Make your program choose different paths using booleans and comparisons.\n\nSo far code runs top to bottom, no choices. Now your program can decide, like \"if it's raining, take an umbrella.\"\n\n**Comparisons** produce a bool (`True` or `False`):\n\n| Operator | Meaning |\n|---|---|\n| `==` | equal to |\n| `!=` | not equal to |\n| `<` `>` | less than, greater than |\n| `<=` `>=` | less/greater than or equal to |\n\nNote `==` (compare) is different from `=` (store in a variable).\n\n```python\nprint(5 == 5)\nprint(5 != 5)\nprint(3 < 10)\nprint(\"a\" == \"A\")\n```\n\nOutput:\n\n```\nTrue\nFalse\nTrue\nFalse\n```\n\n**The `if` statement:**\n\n```python\nage = 16\n\nif age >= 16:\n    print(\"You can drive in many places!\")\n    print(\"(with a license)\")\nprint(\"This always prints\")\n```\n\nOutput:\n\n```\nYou can drive in many places!\n(with a license)\nThis always prints\n```\n\nLook closely at two things. The line ends with a **colon `:`**, and the lines inside are **indented** (4 spaces). Indentation is how Python knows which lines belong to the `if`. It's not decoration, it's grammar.\n\nAdd `else` for the \"otherwise\" path and `elif` (\"else if\") for more choices. Python checks from the top and runs the **first** one that's true:\n\n```python\nscore = 85\n\nif score >= 90:\n    grade = \"A\"\nelif score >= 80:\n    grade = \"B\"\nelif score >= 70:\n    grade = \"C\"\nelse:\n    grade = \"Try again\"\n\nprint(f\"Grade: {grade}\")\n```\n\nOutput:\n\n```\nGrade: B\n```\n\n**Combining conditions** with `and`, `or`, `not`:\n\n```python\nage = 14\nhas_ticket = True\n\nif age >= 12 and has_ticket:\n    print(\"Come on in\")\n\nif age < 5 or age > 65:\n    print(\"Discount!\")\nelse:\n    print(\"Full price\")\n\nprint(not has_ticket)\n```\n\nOutput:\n\n```\nCome on in\nFull price\nFalse\n```\n\n`and` needs both sides true, `or` needs at least one, `not` flips it.\n\nThe `in` keyword checks if something is inside something else:\n\n```python\nprint(\"a\" in \"banana\")\nprint(\"z\" in \"banana\")\n```\n\nOutput:\n\n```\nTrue\nFalse\n```\n\nRemember from Module 4: empty things (`0`, `\"\"`) count as `False`, so `if name:` means \"if name isn't empty.\"\n\n(Python 3.10+ also has a `match` statement for many-way choices. You don't need it yet; `elif` is plenty.)\n\n### Common mistakes\n- Using `=` instead of `==` inside an `if`.\n- Forgetting the colon at the end of the `if`/`elif`/`else` line.\n- Inconsistent indentation. Pick 4 spaces and stick with it, and don't mix tabs and spaces.\n- Comparing text to a number after `input()`: `input(\"Age \") >= 16` fails because the input is a string. Convert with `int()` first.\n- Writing `if x == 1 or 2:`. That doesn't mean what you think. Write `if x == 1 or x == 2:`.\n\n### Practice\n1. Ask for a number. Print whether it is even or odd.\n2. Ask for a password. If it equals `\"open sesame\"`, print `Welcome`, otherwise `Access denied`.\n3. Ask for an age and print `child` (under 13), `teen` (13 to 19), or `adult` (20 and up).\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nn = int(input(\"Number: \"))\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"odd\")\n\n# 2\npassword = input(\"Password: \")\nif password == \"open sesame\":\n    print(\"Welcome\")\nelse:\n    print(\"Access denied\")\n\n# 3\nage = int(input(\"Age: \"))\nif age < 13:\n    print(\"child\")\nelif age <= 19:\n    print(\"teen\")\nelse:\n    print(\"adult\")\n```\n\n<\/details>\n\n## Module 7: Loops (while, for, range)\n\n**Goal:** Repeat actions without copy-pasting code.\n\nImagine being told \"do 50 push-ups.\" You don't want 50 lines of \"do a push-up.\" A **loop** repeats code for you.\n\n**`while` loop:** repeats as long as a condition is true.\n\n```python\ncount = 1\nwhile count <= 3:\n    print(f\"Count is {count}\")\n    count += 1\nprint(\"Done\")\n```\n\nOutput:\n\n```\nCount is 1\nCount is 2\nCount is 3\nDone\n```\n\nYou must change something inside the loop so the condition eventually becomes false. If not, you get an **infinite loop** (press `Ctrl+C` to stop it).\n\nA very common use is repeating until the user gives a good answer:\n\n```python\nanswer = \"\"\nwhile answer != \"yes\":\n    answer = input(\"Say yes to continue: \")\nprint(\"Thanks!\")\n```\n\nExample run:\n\n```\nSay yes to continue: no\nSay yes to continue: yes\nThanks!\n```\n\n**`for` loop:** do something for each item in a group. `range()` makes a group of numbers.\n\n```python\nfor i in range(3):\n    print(i)\n```\n\nOutput:\n\n```\n0\n1\n2\n```\n\n`range(3)` gives `0, 1, 2` (starts at 0, stops *before* 3). More forms:\n\n```python\nfor i in range(1, 4):       # start, stop\n    print(i, end=\" \")\nprint()\nfor i in range(0, 10, 3):   # start, stop, step\n    print(i, end=\" \")\nprint()\nfor i in range(3, 0, -1):   # count down\n    print(i, end=\" \")\nprint(\"Liftoff!\")\n```\n\nOutput:\n\n```\n1 2 3 \n0 3 6 9 \n3 2 1 Liftoff!\n```\n\nYou can loop over a string too, one character at a time:\n\n```python\nfor letter in \"hey\":\n    print(letter)\n```\n\nOutput:\n\n```\nh\ne\ny\n```\n\n**`break` and `continue`.** `break` exits the loop immediately. `continue` skips to the next round.\n\n```python\nfor n in range(1, 10):\n    if n == 3:\n        continue     # skip 3\n    if n == 6:\n        break        # stop completely\n    print(n)\n```\n\nOutput:\n\n```\n1\n2\n4\n5\n```\n\nA running total is a classic pattern:\n\n```python\ntotal = 0\nfor n in range(1, 6):\n    total += n\nprint(total)\n```\n\nOutput:\n\n```\n15\n```\n\n**When to use which?** Know how many times? Use `for`. Don't know (waiting for something)? Use `while`.\n\n### Common mistakes\n- Infinite `while` loops because you forgot to update the variable.\n- Expecting `range(5)` to include 5. It stops at 4.\n- Forgetting the colon or the indentation on the loop body.\n- Resetting a variable (like `total = 0`) *inside* the loop, which wipes your progress every round.\n\n### Practice\n1. Print the numbers 1 to 10 with a `for` loop.\n2. Print the 5 times table (`5 x 1 = 5` up to `5 x 10 = 50`).\n3. Keep asking for a password until the user types `\"python\"`.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nfor i in range(1, 11):\n    print(i)\n\n# 2\nfor i in range(1, 11):\n    print(f\"5 x {i} = {5 * i}\")\n\n# 3\npassword = \"\"\nwhile password != \"python\":\n    password = input(\"Password: \")\nprint(\"Access granted\")\n```\n\n<\/details>\n\n## Module 8: Lists\n\n**Goal:** Store many values in one variable and loop over them.\n\nA **list** is an ordered collection, like a shopping list or a playlist. Write it with square brackets and commas.\n\n```python\nfruits = [\"apple\", \"banana\", \"cherry\"]\nprint(fruits)\nprint(len(fruits))\n```\n\nOutput:\n\n```\n['apple', 'banana', 'cherry']\n3\n```\n\nIndexing works just like strings (start at 0, negatives count from the end):\n\n```python\nprint(fruits[0])\nprint(fruits[-1])\nprint(fruits[1:])\n```\n\nOutput:\n\n```\napple\ncherry\n['banana', 'cherry']\n```\n\nUnlike strings, lists **can be changed**:\n\n```python\nfruits[1] = \"blueberry\"\nfruits.append(\"mango\")        # add to the end\nfruits.insert(0, \"kiwi\")      # add at a position\nprint(fruits)\n\nfruits.remove(\"apple\")        # remove by value\nlast = fruits.pop()           # remove and return the last item\nprint(last)\nprint(fruits)\n```\n\nOutput:\n\n```\n['kiwi', 'apple', 'blueberry', 'cherry', 'mango']\nmango\n['kiwi', 'blueberry', 'cherry']\n```\n\nLooping through a list is the most common thing you'll do:\n\n```python\nfor fruit in fruits:\n    print(f\"I like {fruit}\")\n```\n\nOutput:\n\n```\nI like kiwi\nI like blueberry\nI like cherry\n```\n\nIf you need the position too, use `enumerate`:\n\n```python\nfor i, fruit in enumerate(fruits, start=1):\n    print(f\"{i}. {fruit}\")\n```\n\nOutput:\n\n```\n1. kiwi\n2. blueberry\n3. cherry\n```\n\nMore handy tools:\n\n```python\nnums = [5, 2, 9, 1]\nprint(sum(nums))\nprint(max(nums))\nprint(min(nums))\nprint(sorted(nums))     # a new sorted list; nums is unchanged\nnums.sort()             # sorts nums itself\nprint(nums)\nprint(9 in nums)\n```\n\nOutput:\n\n```\n17\n9\n1\n[1, 2, 5, 9]\n[1, 2, 5, 9]\nTrue\n```\n\n### Tuples and sets (a quick look)\n\nA **tuple** is a list that can't be changed, written with parentheses. Good for things that shouldn't change, like coordinates.\n\n```python\npoint = (3, 4)\nx, y = point        # unpacking\nprint(x, y)\n```\n\nOutput:\n\n```\n3 4\n```\n\nA **set** holds unique items with no duplicates and no order. Great for removing repeats.\n\n```python\ncolors = {\"red\", \"blue\", \"red\", \"green\", \"blue\"}\nprint(len(colors))\nprint(sorted(set([1, 2, 2, 3, 3, 3])))\n```\n\nOutput:\n\n```\n3\n[1, 2, 3]\n```\n\n(Printing a set directly can show items in any order, which is why we used `sorted` above.)\n\n### Common mistakes\n- `IndexError: list index out of range`: asking for a position that doesn't exist. A list of 3 items has indexes 0, 1, 2.\n- Writing `my_list = my_list.append(4)`. `append` changes the list and returns `None`, so you just erased your list.\n- `remove` on something that isn't there causes a `ValueError`. Check with `in` first.\n- Using `{}` for an empty set. That makes an empty dictionary. Use `set()`.\n\n### Practice\n1. Make a list of 4 of your favorite foods, add one more, and print each on its own line.\n2. Given `scores = [70, 85, 90, 65]`, print the total, the average, the highest, and the lowest.\n3. Given `names = [\"Sam\", \"Al\", \"Sam\", \"Bo\", \"Al\"]`, print how many unique names there are.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nfoods = [\"pizza\", \"tacos\", \"sushi\", \"pasta\"]\nfoods.append(\"ramen\")\nfor food in foods:\n    print(food)\n\n# 2\nscores = [70, 85, 90, 65]\nprint(sum(scores))                 # 310\nprint(sum(scores) / len(scores))   # 77.5\nprint(max(scores))                 # 90\nprint(min(scores))                 # 65\n\n# 3\nnames = [\"Sam\", \"Al\", \"Sam\", \"Bo\", \"Al\"]\nprint(len(set(names)))  # 3\n```\n\n<\/details>\n\n## Module 9: Dictionaries\n\n**Goal:** Store information as labeled pairs and look things up by name.\n\nA list finds things by position number. A **dictionary** finds things by a **key**, like a real dictionary finds a definition by its word, or a phone's contacts find a number by name. Each entry is a `key: value` pair, inside curly braces.\n\n```python\nplayer = {\n    \"name\": \"Sam\",\n    \"level\": 5,\n    \"alive\": True,\n}\nprint(player[\"name\"])\nprint(player[\"level\"])\n```\n\nOutput:\n\n```\nSam\n5\n```\n\nChange, add, and delete entries:\n\n```python\nplayer[\"level\"] = 6          # change\nplayer[\"score\"] = 1200       # add a new key\ndel player[\"alive\"]          # delete\nprint(player)\n```\n\nOutput:\n\n```\n{'name': 'Sam', 'level': 6, 'score': 1200}\n```\n\nAsking for a key that isn't there crashes with a `KeyError`. Two safe options:\n\n```python\nprint(\"score\" in player)\nprint(player.get(\"lives\"))          # None if missing\nprint(player.get(\"lives\", 3))       # or choose a default\n```\n\nOutput:\n\n```\nTrue\nNone\n3\n```\n\nLooping through a dictionary:\n\n```python\nprices = {\"apple\": 0.5, \"bread\": 2.25, \"milk\": 1.75}\n\nfor item in prices:\n    print(item)\n\nfor item, price in prices.items():\n    print(f\"{item} costs ${price:.2f}\")\n\nprint(list(prices.keys()))\nprint(list(prices.values()))\n```\n\nOutput:\n\n```\napple\nbread\nmilk\napple costs $0.50\nbread costs $2.25\nmilk costs $1.75\n['apple', 'bread', 'milk']\n[0.5, 2.25, 1.75]\n```\n\nA very common pattern is counting things:\n\n```python\nword_counts = {}\nfor word in [\"hi\", \"yo\", \"hi\", \"hi\", \"yo\"]:\n    word_counts[word] = word_counts.get(word, 0) + 1\nprint(word_counts)\n```\n\nOutput:\n\n```\n{'hi': 3, 'yo': 2}\n```\n\nYou can nest things: a list of dictionaries is a nice way to store many \"records.\"\n\n```python\nfriends = [\n    {\"name\": \"Al\", \"age\": 14},\n    {\"name\": \"Bo\", \"age\": 16},\n]\nfor friend in friends:\n    print(f\"{friend['name']} is {friend['age']}\")\n```\n\nOutput:\n\n```\nAl is 14\nBo is 16\n```\n\nNotice the single quotes inside the f-string. Mixing quote types avoids clashes (Python 3.12 relaxed this, but this style works everywhere).\n\nKeys must be unique, so each key can appear only once. Strings and numbers make good keys.\n\n### Common mistakes\n- `KeyError` from reading a missing key. Use `.get()` or check `in` first.\n- Using square brackets to create one: `[ \"a\": 1 ]`. Dictionaries use curly braces `{}`.\n- Expecting duplicate keys to both exist. The second silently replaces the first.\n- Confusing the lookup by key `player[\"name\"]` with list indexing by number.\n\n### Practice\n1. Make a dictionary for yourself with `name`, `age`, and `hobby`, and print a sentence using f-strings.\n2. Make a dictionary of 3 countries and their capitals. Ask the user for a country and print its capital, or `Unknown` if it isn't there.\n3. Count how many times each letter appears in `\"banana\"` and print the dictionary.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nme = {\"name\": \"Jorday\", \"age\": 15, \"hobby\": \"gaming\"}\nprint(f\"{me['name']} is {me['age']} and likes {me['hobby']}\")\n\n# 2\ncapitals = {\"France\": \"Paris\", \"Japan\": \"Tokyo\", \"Italy\": \"Rome\"}\ncountry = input(\"Country: \")\nprint(capitals.get(country, \"Unknown\"))\n\n# 3\ncounts = {}\nfor letter in \"banana\":\n    counts[letter] = counts.get(letter, 0) + 1\nprint(counts)  # {'b': 1, 'a': 3, 'n': 2}\n```\n\n<\/details>\n\n## Module 10: Functions\n\n**Goal:** Package code into reusable named pieces that take inputs and give back results.\n\nA **function** is a mini-program with a name, like a recipe card you can follow whenever you want. You've already used some: `print()`, `len()`, `input()`. Now you'll make your own with `def` (short for \"define\").\n\n```python\ndef say_hello():\n    print(\"Hello!\")\n\nsay_hello()\nsay_hello()\n```\n\nOutput:\n\n```\nHello!\nHello!\n```\n\nDefining a function doesn't run it. Calling it (`say_hello()`) does.\n\n**Parameters** are inputs. They're the blanks in the recipe. The actual values you pass in are called **arguments**.\n\n```python\ndef greet(name):\n    print(f\"Hi, {name}!\")\n\ngreet(\"Sam\")\ngreet(\"Al\")\n```\n\nOutput:\n\n```\nHi, Sam!\nHi, Al!\n```\n\n**Return** hands a value back to whoever called the function, like a vending machine giving you a snack. Once `return` runs, the function ends.\n\n```python\ndef add(a, b):\n    return a + b\n\nresult = add(3, 4)\nprint(result)\nprint(add(10, 5) * 2)\n```\n\nOutput:\n\n```\n7\n30\n```\n\n`print` shows something on screen; `return` gives a value back to your code. They are different. A function with no `return` gives back `None`.\n\n**Default values and keyword arguments:**\n\n```python\ndef power(base, exponent=2):\n    return base ** exponent\n\nprint(power(5))\nprint(power(2, 3))\nprint(power(exponent=4, base=2))\n```\n\nOutput:\n\n```\n25\n8\n16\n```\n\n**Returning True/False** is great for questions:\n\n```python\ndef is_even(n):\n    return n % 2 == 0\n\nprint(is_even(4))\nprint(is_even(7))\n```\n\nOutput:\n\n```\nTrue\nFalse\n```\n\n**Scope** means where a variable can be seen. A variable made inside a function is **local**: it lives only while the function runs, like a note you scribble on scrap paper and then throw away.\n\n```python\ndef make_number():\n    secret = 42\n    return secret\n\nprint(make_number())\n# print(secret)   # NameError: secret only exists inside the function\n```\n\nOutput:\n\n```\n42\n```\n\nA function can *read* variables from outside, but changing them by accident causes confusion. The clean approach: pass things in as parameters and get results back with `return`.\n\n```python\ntax_rate = 0.1\n\ndef total_price(price):\n    return price + price * tax_rate\n\nprint(total_price(20))\n```\n\nOutput:\n\n```\n22.0\n```\n\nAdd a short description under the `def` line (a **docstring**) to explain what a function does:\n\n```python\ndef area_of_rectangle(width, height):\n    \"\"\"Return the area of a rectangle.\"\"\"\n    return width * height\n\nprint(area_of_rectangle(3, 4))\n```\n\nOutput:\n\n```\n12\n```\n\nGood functions do one job and have a clear name. If you copy-paste code twice, it probably wants to be a function.\n\n### Common mistakes\n- Defining a function but never calling it.\n- Printing inside a function when you meant to `return`, then wondering why `result = f(3)` is `None`.\n- Putting code after `return` and expecting it to run. It never will.\n- Using a variable outside the function that was created inside it (`NameError`).\n- Forgetting the parentheses when calling: `say_hello` alone does nothing.\n\n### Practice\n1. Write `square(n)` that returns `n` times itself. Print `square(7)`.\n2. Write `describe_age(age)` that returns `\"child\"`, `\"teen\"`, or `\"adult\"` using the rules from Module 6.\n3. Write `average(numbers)` that returns the average of a list. Test it with `[2, 4, 6]`.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\ndef square(n):\n    return n * n\n\nprint(square(7))  # 49\n\n# 2\ndef describe_age(age):\n    if age < 13:\n        return \"child\"\n    elif age <= 19:\n        return \"teen\"\n    else:\n        return \"adult\"\n\nprint(describe_age(15))  # teen\n\n# 3\ndef average(numbers):\n    return sum(numbers) / len(numbers)\n\nprint(average([2, 4, 6]))  # 4.0\n```\n\n<\/details>\n\n## Module 11: Reading Error Messages\n\n**Goal:** Read a Python error calmly, find the problem line, and fix the most common errors.\n\nErrors are not failures. They're Python telling you exactly what it got stuck on. Every programmer, including pros, sees them all day. Learn to read them and they become your best helper.\n\nHere's a program with a bug:\n\n```python\nnumbers = [1, 2, 3]\nprint(numbers[5])\n```\n\nPython prints something like:\n\n```\nTraceback (most recent call last):\n  File \"demo.py\", line 2, in <module>\n    print(numbers[5])\nIndexError: list index out of range\n```\n\n**How to read it: start at the bottom.**\n1. The **last line** says the error type and a short reason: `IndexError: list index out of range`.\n2. The line above shows the **code** that failed.\n3. The `File ... line 2` part tells you **where**.\n\n(Newer Python versions add helpful hints and little arrows pointing at the problem. Read those too.)\n\n**The usual suspects:**\n\n| Error | What it means | Typical cause |\n|---|---|---|\n| `SyntaxError` | Python can't understand the code's grammar | missing colon, quote, or bracket |\n| `IndentationError` | wrong spacing | inconsistent indents |\n| `NameError` | name doesn't exist | typo, or used before it was created |\n| `TypeError` | wrong kind of value | `\"5\" + 5` |\n| `ValueError` | right type, bad value | `int(\"hello\")` |\n| `IndexError` | list position doesn't exist | `numbers[5]` in a 3-item list |\n| `KeyError` | dictionary key missing | `player[\"lives\"]` |\n| `ZeroDivisionError` | divided by zero | `10 / 0` |\n\nQuick demos (each one crashes, so run them one at a time):\n\n```python\nprint(10 / 0)\n```\n\nOutput:\n\n```\nZeroDivisionError: division by zero\n```\n\n```python\nage = \"15\"\nprint(age + 1)\n```\n\nOutput:\n\n```\nTypeError: can only concatenate str (not \"int\") to str\n```\n\n```python\nprint(total)\n```\n\nOutput:\n\n```\nNameError: name 'total' is not defined\n```\n\n**Handling errors with `try` / `except`.** Sometimes errors are expected, like a user typing letters when you asked for a number. Instead of crashing, you can catch it. Think of a safety net.\n\n```python\ntry:\n    number = int(\"hello\")\n    print(\"Got it:\", number)\nexcept ValueError:\n    print(\"That's not a number!\")\nprint(\"The program keeps going\")\n```\n\nOutput:\n\n```\nThat's not a number!\nThe program keeps going\n```\n\nPython tries the `try` block. If that error happens, it jumps to `except`. Always name the error type you expect (`ValueError`), not a bare `except:`, otherwise you'll hide real bugs.\n\nHere is a reusable \"keep asking until valid\" helper that you'll use in the capstone:\n\n```python\ndef ask_for_number(prompt):\n    while True:\n        text = input(prompt)\n        try:\n            return int(text)\n        except ValueError:\n            print(\"Please type a whole number.\")\n\nage = ask_for_number(\"Age: \")\nprint(f\"You typed {age}\")\n```\n\nExample run:\n\n```\nAge: abc\nPlease type a whole number.\nAge: 15\nYou typed 15\n```\n\n**Debugging tips:**\n- Read the last line of the error first, then the line number.\n- Use `print()` to check what your variables hold at that point.\n- Test small pieces in the REPL.\n- Change one thing at a time.\n- Still stuck? Explain the problem out loud, to a friend or even a rubber duck. This works shockingly often. Searching the exact error message online also works.\n\n### Common mistakes\n- Panicking and not reading the message. It nearly always tells you what's wrong.\n- Fixing the line Python points to when the real mistake is a line or two *earlier* (like a missing closing bracket).\n- Using a bare `except:` that swallows every error.\n- Changing lots of things at once, so you can't tell what fixed it.\n\n### Practice\n1. For each of these, name the error without running it: `int(\"abc\")`, `[1, 2][2]`, `print(hello)`, `{\"a\": 1}[\"b\"]`.\n2. Write a program that asks for a number and prints 100 divided by it, but prints `Can't divide by zero` if the user types `0`.\n3. Fix this broken program so it prints the numbers 1 to 3:\n   ```\n   for i in range(1, 4)\n   print(i)\n   ```\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\n# int(\"abc\")        -> ValueError\n# [1, 2][2]         -> IndexError\n# print(hello)      -> NameError\n# {\"a\": 1}[\"b\"]     -> KeyError\n\n# 2\ntry:\n    n = int(input(\"Number: \"))\n    print(100 / n)\nexcept ZeroDivisionError:\n    print(\"Can't divide by zero\")\nexcept ValueError:\n    print(\"Please type a whole number\")\n\n# 3  (missing colon and missing indentation)\nfor i in range(1, 4):\n    print(i)\n```\n\n<\/details>\n\n## Module 12: Capstone Project — Number Guessing Game\n\n**Goal:** Combine everything you've learned to build a complete game from scratch.\n\nTime to build something real. The computer picks a secret number from 1 to 100, and you try to guess it. After each guess it says \"too high\" or \"too low.\" It counts your guesses, handles bad input without crashing, and lets you play again.\n\nBuild it in small steps, running after each one. That's how real programmers work.\n\n**Step 1: Pick a secret number.** We need the `random` module, which is a toolbox that comes with Python. `import` brings a toolbox into your program.\n\n```python\nimport random\n\nsecret = random.randint(1, 100)   # randint includes both ends\nprint(\"(Peek for testing:\", secret, \")\")\n```\n\nOutput (varies each run):\n\n```\n(Peek for testing: 57 )\n```\n\n**Step 2: One guess and a comparison.**\n\n```python\nimport random\n\nsecret = random.randint(1, 100)\nguess = int(input(\"Guess a number from 1 to 100: \"))\n\nif guess == secret:\n    print(\"You got it!\")\nelif guess < secret:\n    print(\"Too low!\")\nelse:\n    print(\"Too high!\")\n```\n\n**Step 3: Loop until correct, and count guesses.** We don't know how many tries it will take, so we use `while`.\n\n```python\nimport random\n\nsecret = random.randint(1, 100)\nguesses = 0\nguess = 0\n\nwhile guess != secret:\n    guess = int(input(\"Guess a number from 1 to 100: \"))\n    guesses += 1\n    if guess < secret:\n        print(\"Too low!\")\n    elif guess > secret:\n        print(\"Too high!\")\n\nprint(f\"You got it in {guesses} guesses!\")\n```\n\n**Step 4: Handle bad input.** Reuse the helper from Module 11 so typing `banana` doesn't crash the game. Also reject numbers outside the range.\n\n```python\ndef ask_for_guess(low, high):\n    while True:\n        text = input(f\"Guess a number from {low} to {high}: \")\n        try:\n            guess = int(text)\n        except ValueError:\n            print(\"Please type a whole number.\")\n            continue\n        if low <= guess <= high:\n            return guess\n        print(f\"Stay between {low} and {high}.\")\n```\n\n(`low <= guess <= high` is a Python shortcut meaning \"guess is between low and high.\")\n\n**Step 5: Put the game into a function, give limited tries, and offer a replay.** Here is the full final program. Save it as `guessing_game.py` and run `python3 guessing_game.py`.\n\n```python\nimport random\n\nLOW = 1\nHIGH = 100\nMAX_TRIES = 7\n\n\ndef ask_for_guess(low, high):\n    \"\"\"Keep asking until the player types a whole number in range.\"\"\"\n    while True:\n        text = input(f\"Guess a number from {low} to {high}: \")\n        try:\n            guess = int(text)\n        except ValueError:\n            print(\"Please type a whole number.\")\n            continue\n        if low <= guess <= high:\n            return guess\n        print(f\"Stay between {low} and {high}.\")\n\n\ndef play_round():\n    \"\"\"Play one game. Return True if the player won.\"\"\"\n    secret = random.randint(LOW, HIGH)\n    print(f\"I'm thinking of a number from {LOW} to {HIGH}.\")\n    print(f\"You have {MAX_TRIES} tries.\")\n\n    for attempt in range(1, MAX_TRIES + 1):\n        guess = ask_for_guess(LOW, HIGH)\n\n        if guess == secret:\n            print(f\"You got it in {attempt} guesses!\")\n            return True\n        elif guess < secret:\n            print(\"Too low!\")\n        else:\n            print(\"Too high!\")\n\n        print(f\"Tries left: {MAX_TRIES - attempt}\")\n\n    print(f\"Out of tries! The number was {secret}.\")\n    return False\n\n\ndef main():\n    wins = 0\n    rounds = 0\n\n    print(\"=== Number Guessing Game ===\")\n    while True:\n        rounds += 1\n        if play_round():\n            wins += 1\n\n        print(f\"Score: {wins} won out of {rounds} rounds\")\n        again = input(\"Play again? (y/n): \").strip().lower()\n        if again != \"y\":\n            break\n\n    print(\"Thanks for playing!\")\n\n\nmain()\n```\n\nExample run:\n\n```\n=== Number Guessing Game ===\nI'm thinking of a number from 1 to 100.\nYou have 7 tries.\nGuess a number from 1 to 100: 50\nToo high!\nTries left: 6\nGuess a number from 1 to 100: abc\nPlease type a whole number.\nGuess a number from 1 to 100: 25\nToo low!\nTries left: 5\nGuess a number from 1 to 100: 37\nYou got it in 3 guesses!\nScore: 1 won out of 1 rounds\nPlay again? (y/n): n\nThanks for playing!\n```\n\n**What you used:** variables, `input` and type conversion, f-strings, `if/elif/else`, `while` and `for` loops with `range`, functions with parameters and return, `try/except`, and a module import. That is basically this whole level in one program.\n\nWhy 7 tries? Each smart guess (halving the possibilities) cuts 100 down to 50, 25, 12, 6, 3, 1... so 7 guesses is always enough if you play cleverly. That strategy is called binary search, and real progr
