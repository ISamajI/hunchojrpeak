e. Check the version first.\n- Putting business logic in the controller. Controllers translate HTTP; services hold the rules.\n- Storing mutable state in a singleton bean without thread safety. Every request runs on a different thread.\n- Using field injection (`@Autowired` on a private field). Constructor injection is testable and makes the dependency visible.\n- Returning raw entities or maps directly to clients. Use small request and response records so you control the JSON shape and can change internals safely.\n- Putting the application class in a package that does not contain the other classes. Component scanning only covers the main class's package and its sub-packages.\n- Trusting client input. Validate requests, and never put secrets (database passwords, API keys) in source control; use environment variables.\n- Using `@SpringBootTest` for every test. It starts the whole application and is slow; use `@WebMvcTest` and plain unit tests where you can.\n\n### Practice\n1. Add a `DELETE /api/todos/{id}` endpoint that returns `204 No Content`, or `404` if the todo does not exist.\n2. Add a `@RestControllerAdvice` that turns any `IllegalArgumentException` into a `400` response with a `ProblemDetail` body.\n3. Write a test for the delete endpoint: deleting an unknown id returns `404`.\n\n<details><summary>Solutions<\/summary>\n\n```java\n// Exercise 1: add to TodoService\npublic boolean delete(long id) {\n    return todos.remove(id) != null;\n}\n\n// Exercise 1: add to TodoController\n// (needs: import org.springframework.web.bind.annotation.DeleteMapping;)\n@DeleteMapping(\"/{id}\")\n@ResponseStatus(HttpStatus.NO_CONTENT)\npublic void delete(@PathVariable long id) {\n    if (!service.delete(id)) {\n        throw notFound(id);\n    }\n}\n\n// Exercise 2: new file ApiExceptionHandler.java in the same package\npackage dev.jorday.todo;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ProblemDetail;\nimport org.springframework.web.bind.annotation.ExceptionHandler;\nimport org.springframework.web.bind.annotation.RestControllerAdvice;\n\n@RestControllerAdvice\npublic class ApiExceptionHandler {\n\n    @ExceptionHandler(IllegalArgumentException.class)\n    public ProblemDetail badRequest(IllegalArgumentException e) {\n        return ProblemDetail.forStatusAndDetail(HttpStatus.BAD_REQUEST, e.getMessage());\n    }\n}\n\n// Exercise 3: add to TodoControllerTest\n@Test\nvoid deletingUnknownIdReturns404() {\n    assertThat(mvc.delete().uri(\"/api/todos/12345\"))\n        .hasStatus(HttpStatus.NOT_FOUND);\n}\n```\n\n<\/details>\n\n## Module 7: Capstone Project — Concurrent Task Processor\n**Goal:** Build and test a small, reusable library that runs many tasks concurrently with retries and reports every result, using the build tooling, testing, concurrency and design ideas from this level.\n\nYou will build a **task processor**: you give it a list of named tasks (anything that returns a value or throws), and it runs them all at the same time on virtual threads, retries each failing task up to a limit, and hands back a result for every task, in the original order, whether it succeeded or failed. Think of fetching ten web pages, resizing images or calling several services where one can be flaky.\n\nDesign decisions, and why:\n- **A task is a record** holding an id and a `Callable`. Records are immutable data.\n- **A result is a sealed interface** with two records, `Success` and `Failure`. The caller must handle both, and the compiler checks it (Module 7 of Intermediate). Failures are *values*, so one bad task never loses the other results.\n- **The processor takes its `ExecutorService` in the constructor** (dependency injection), so tests can supply any executor; a factory method provides the default virtual-thread version.\n- **`CompletableFuture` composes the work.** `runAll` submits every task first and only then waits, so tasks truly run in parallel.\n- **Tests prove the hard parts:** order preserved, retries, failure reporting, and genuine concurrency (using a latch rather than fragile timing).\n\n**Step 1: Create the project.** Same layout as Module 1:\n\n```text\ntask-processor/\n  pom.xml\n  src/main/java/dev/jorday/tasks/Task.java\n  src/main/java/dev/jorday/tasks/TaskResult.java\n  src/main/java/dev/jorday/tasks/TaskProcessor.java\n  src/main/java/dev/jorday/tasks/App.java\n  src/test/java/dev/jorday/tasks/TaskProcessorTest.java\n```\n\n`pom.xml`:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\n         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\">\n  <modelVersion>4.0.0<\/modelVersion>\n\n  <groupId>dev.jorday<\/groupId>\n  <artifactId>task-processor<\/artifactId>\n  <version>1.0.0<\/version>\n  <packaging>jar<\/packaging>\n\n  <properties>\n    <maven.compiler.release>21<\/maven.compiler.release>\n    <project.build.sourceEncoding>UTF-8<\/project.build.sourceEncoding>\n  <\/properties>\n\n  <dependencyManagement>\n    <dependencies>\n      <dependency>\n        <groupId>org.junit<\/groupId>\n        <artifactId>junit-bom<\/artifactId>\n        <version>6.1.3<\/version>\n        <type>pom<\/type>\n        <scope>import<\/scope>\n      <\/dependency>\n    <\/dependencies>\n  <\/dependencyManagement>\n\n  <dependencies>\n    <dependency>\n      <groupId>org.junit.jupiter<\/groupId>\n      <artifactId>junit-jupiter<\/artifactId>\n      <scope>test<\/scope>\n    <\/dependency>\n  <\/dependencies>\n\n  <build>\n    <plugins>\n      <plugin>\n        <artifactId>maven-surefire-plugin<\/artifactId>\n        <version>3.6.1<\/version>\n      <\/plugin>\n    <\/plugins>\n  <\/build>\n<\/project>\n```\n\n**Step 2: The task.** The compact constructor rejects nulls, so every `Task` in the system is valid.\n\n`Task.java`:\n\n```java\npackage dev.jorday.tasks;\n\nimport java.util.Objects;\nimport java.util.concurrent.Callable;\n\npublic record Task<T>(String id, Callable<T> work) {\n    public Task {\n        Objects.requireNonNull(id, \"id\");\n        Objects.requireNonNull(work, \"work\");\n    }\n}\n```\n\n**Step 3: The result.** A sealed interface with exactly two outcomes. Both records report how many attempts were used. `Failure` keeps the last exception.\n\n`TaskResult.java`:\n\n```java\npackage dev.jorday.tasks;\n\npublic sealed interface TaskResult<T> {\n    String id();\n\n    int attempts();\n\n    record Success<T>(String id, T value, int attempts) implements TaskResult<T> {}\n\n    record Failure<T>(String id, Exception error, int attempts) implements TaskResult<T> {}\n}\n```\n\n**Step 4: The processor.** `execute` is the retry loop. If the thread is interrupted we stop retrying immediately and restore the interrupt flag, instead of swallowing it. `runAll` first collects all the futures into a list (that forces every task to be submitted), and only then joins them in order. Do not merge those two steps into one stream; a lazy stream would submit and wait one task at a time.\n\n`TaskProcessor.java`:\n\n```java\npackage dev.jorday.tasks;\n\nimport java.util.List;\nimport java.util.concurrent.CompletableFuture;\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\npublic final class TaskProcessor implements AutoCloseable {\n    private final ExecutorService executor;\n    private final int maxAttempts;\n\n    public TaskProcessor(ExecutorService executor, int maxAttempts) {\n        if (maxAttempts < 1) {\n            throw new IllegalArgumentException(\"maxAttempts must be >= 1\");\n        }\n        this.executor = executor;\n        this.maxAttempts = maxAttempts;\n    }\n\n    public static TaskProcessor withVirtualThreads(int maxAttempts) {\n        return new TaskProcessor(Executors.newVirtualThreadPerTaskExecutor(), maxAttempts);\n    }\n\n    public <T> CompletableFuture<TaskResult<T>> submit(Task<T> task) {\n        return CompletableFuture.supplyAsync(() -> execute(task), executor);\n    }\n\n    public <T> List<TaskResult<T>> runAll(List<Task<T>> tasks) {\n        List<CompletableFuture<TaskResult<T>>> futures = tasks.stream()\n            .map(this::submit)\n            .toList();\n        return futures.stream()\n            .map(CompletableFuture::join)\n            .toList();\n    }\n\n    private <T> TaskResult<T> execute(Task<T> task) {\n        Exception last = null;\n        for (int attempt = 1; attempt <= maxAttempts; attempt++) {\n            try {\n                return new TaskResult.Success<>(task.id(), task.work().call(), attempt);\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n                return new TaskResult.Failure<>(task.id(), e, attempt);\n            } catch (Exception e) {\n                last = e;\n            }\n        }\n        return new TaskResult.Failure<>(task.id(), last, maxAttempts);\n    }\n\n    @Override\n    public void close() {\n        executor.close();\n    }\n}\n```\n\n**Step 5: A demo `App`.** Four tasks: one that works, one that fails twice and then succeeds (\"flaky\"), one that always fails (\"broken\"), and one that is slow. The `switch` over the sealed result needs no `default`.\n\n`App.java`:\n\n```java\npackage dev.jorday.tasks;\n\nimport java.io.IOException;\nimport java.util.List;\nimport java.util.concurrent.atomic.AtomicInteger;\n\npublic final class App {\n    public static void main(String[] args) {\n        AtomicInteger flakyCalls = new AtomicInteger();\n\n        List<Task<Object>> tasks = List.of(\n            new Task<Object>(\"square\", () -> 5 * 5),\n            new Task<Object>(\"flaky\", () -> {\n                if (flakyCalls.incrementAndGet() < 3) {\n                    throw new IllegalStateException(\"not yet\");\n                }\n                return \"ok after \" + flakyCalls.get();\n            }),\n            new Task<Object>(\"broken\", () -> {\n                throw new IOException(\"disk gone\");\n            }),\n            new Task<Object>(\"slow\", () -> {\n                Thread.sleep(200);\n                return \"finished\";\n            }));\n\n        try (TaskProcessor processor = TaskProcessor.withVirtualThreads(3)) {\n            List<TaskResult<Object>> results = processor.runAll(tasks);\n\n            for (TaskResult<Object> result : results) {\n                String line = switch (result) {\n                    case TaskResult.Success<Object> s ->\n                        \"OK   \" + s.id() + \" -> \" + s.value() + \" (attempts: \" + s.attempts() + \")\";\n                    case TaskResult.Failure<Object> f ->\n                        \"FAIL \" + f.id() + \" -> \" + f.error().getMessage() + \" (attempts: \" + f.attempts() + \")\";\n                };\n                System.out.println(line);\n            }\n\n            long ok = results.stream().filter(r -> r instanceof TaskResult.Success).count();\n            System.out.println(\"succeeded: \" + ok + \", failed: \" + (results.size() - ok));\n        }\n    }\n}\n```\n\nBuild and run it:\n\n```bash\nmvn -q compile\njava -cp target/classes dev.jorday.tasks.App\n```\n\nOutput:\n```text\nOK   square -> 25 (attempts: 1)\nOK   flaky -> ok after 3 (attempts: 3)\nFAIL broken -> disk gone (attempts: 3)\nOK   slow -> finished (attempts: 1)\nsucceeded: 3, failed: 1\n```\n\nThe results are in the same order as the tasks, even though \"slow\" finished last and \"square\" first, because `runAll` joins the futures in list order.\n\n**Step 6: The tests.** Five tests, each one aimed at a specific promise. The concurrency test uses a `CountDownLatch`: every task counts down and then waits for all the others. If the processor ran tasks one after another, the first task would wait forever for the latch and time out, so the test passes only when the tasks genuinely run at the same time, and it never depends on stopwatch timing.\n\n`TaskProcessorTest.java`:\n\n```java\npackage dev.jorday.tasks;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\nimport static org.junit.jupiter.api.Assertions.assertInstanceOf;\nimport static org.junit.jupiter.api.Assertions.assertThrows;\nimport static org.junit.jupiter.api.Assertions.assertTrue;\n\nimport java.io.IOException;\nimport java.util.List;\nimport java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.TimeUnit;\nimport java.util.concurrent.atomic.AtomicInteger;\nimport java.util.stream.IntStream;\nimport org.junit.jupiter.api.Test;\n\nclass TaskProcessorTest {\n\n    @Test\n    void returnsResultsInInputOrder() {\n        List<Task<String>> tasks = List.of(\n            new Task<String>(\"a\", () -> {\n                Thread.sleep(100);\n                return \"A\";\n            }),\n            new Task<String>(\"b\", () -> \"B\"),\n            new Task<String>(\"c\", () -> {\n                Thread.sleep(50);\n                return \"C\";\n            }));\n\n        try (TaskProcessor processor = TaskProcessor.withVirtualThreads(1)) {\n            List<TaskResult<String>> results = processor.runAll(tasks);\n            assertEquals(List.of(\"a\", \"b\", \"c\"), results.stream().map(TaskResult::id).toList());\n        }\n    }\n\n    @Test\n    void retriesUntilSuccess() {\n        AtomicInteger calls = new AtomicInteger();\n        Task<String> flaky = new Task<String>(\"flaky\", () -> {\n            if (calls.incrementAndGet() < 3) {\n                throw new IllegalStateException(\"nope\");\n            }\n            return \"ok\";\n        });\n\n        try (TaskProcessor processor = TaskProcessor.withVirtualThreads(3)) {\n            TaskResult<String> result = processor.submit(flaky).join();\n            assertInstanceOf(TaskResult.Success.class, result);\n            assertEquals(3, result.attempts());\n            assertEquals(\"ok\", ((TaskResult.Success<String>) result).value());\n        }\n    }\n\n    @Test\n    void reportsFailureAfterMaxAttempts() {\n        Task<String> bad = new Task<String>(\"bad\", () -> {\n            throw new IOException(\"boom\");\n        });\n\n        try (TaskProcessor processor = TaskProcessor.withVirtualThreads(2)) {\n            TaskResult<String> result = processor.submit(bad).join();\n            assertInstanceOf(TaskResult.Failure.class, result);\n            assertEquals(2, result.attempts());\n            assertEquals(\"boom\", ((TaskResult.Failure<String>) result).error().getMessage());\n        }\n    }\n\n    @Test\n    void runsTasksConcurrently() {\n        int count = 5;\n        CountDownLatch allStarted = new CountDownLatch(count);\n        List<Task<Boolean>> tasks = IntStream.range(0, count)\n            .mapToObj(i -> new Task<Boolean>(\"t\" + i, () -> {\n                allStarted.countDown();\n                return allStarted.await(2, TimeUnit.SECONDS);\n            }))\n            .toList();\n\n        try (TaskProcessor processor = TaskProcessor.withVirtualThreads(1)) {\n            List<TaskResult<Boolean>> results = processor.runAll(tasks);\n            assertTrue(results.stream().allMatch(\n                r -> r instanceof TaskResult.Success<Boolean> s && s.value()));\n        }\n    }\n\n    @Test\n    void rejectsInvalidMaxAttempts() {\n        assertThrows(IllegalArgumentException.class, () -> TaskProcessor.withVirtualThreads(0));\n    }\n}\n```\n\nRun all tests:\n\n```bash\nmvn test\n```\n\nOutput:\n```text\n[INFO] Tests run: 5, Failures: 0, Errors: 0, Skipped: 0\n[INFO] BUILD SUCCESS\n```\n\nOne detail in `rejectsInvalidMaxAttempts`: the factory creates the executor first and the constructor then rejects the `0`, so that executor is never closed. It is harmless here because a virtual-thread executor has not started any thread yet, but in your own code validate before you allocate when you can.\n\n**Step 7: Try to break it.** Change `runAll` so it joins inside the same stream that submits (`tasks.stream().map(this::submit).map(CompletableFuture::join).toList()`) and run the tests. `runsTasksConcurrently` now fails after its 2-second timeout, because the first task waits alone for a latch that no other task can reach. That one failing test is the proof that the test suite guards the property you care about.\n\n**What you practiced.** A Maven project with the standard layout (Module 1), JUnit tests with a deterministic concurrency test (2), virtual threads, `CompletableFuture`, `ExecutorService` and its lifecycle (3), a design based on dependency injection, a factory method and immutable data (5), and sealed types with pattern matching from the Intermediate level. The processor itself is a small version of what real job-processing libraries do.\n\n### Common mistakes\n- Joining each future inside the same stream that submits it, which runs the tasks sequentially.\n- Letting one failed task throw out of `runAll` and lose all the other results. Representing failure as a value avoids this.\n- Retrying forever or with no delay. Always cap attempts, and in real systems add a delay that grows between attempts (exponential backoff) so you do not hammer a service that is already struggling.\n- Swallowing `InterruptedException`. Restore the interrupt flag and stop.\n- Retrying operations that are not safe to repeat (charging a card, sending an email). Only retry idempotent work.\n- Writing concurrency tests with `Thread.sleep` and hoping the timing works. Use latches and other synchronizers so the test is deterministic.\n- Forgetting to close the processor, which leaves the executor running.\n\n### Practice\n1. Add a per-task timeout: `submit(task, Duration timeout)` should return a `Failure` if the task runs longer than the timeout. Hint: `CompletableFuture.orTimeout` or `completeOnTimeout`.\n2. Add a delay between retry attempts that doubles each time (50 ms, 100 ms, 200 ms, and so on). Be careful: sleeping throws `InterruptedException`.\n3. Add a `summary(List<TaskResult<?>> results)` method that returns a record `Summary(int succeeded, int failed, int totalAttempts)`, and a test for it.\n\n<details><summary>Solutions<\/summary>\n\n```java\n// Exercise 1: add to TaskProcessor\n// (needs: import java.time.Duration; import java.util.concurrent.TimeUnit;)\npublic <T> CompletableFuture<TaskResult<T>> submit(Task<T> task, Duration timeout) {\n    return submit(task)\n        .completeOnTimeout(\n            new TaskResult.Failure<T>(task.id(), new java.util.concurrent.TimeoutException(\"timed out\"), 0),\n            timeout.toMillis(), TimeUnit.MILLISECONDS);\n}\n// Note: the slow task keeps running in the background after the timeout; the\n// future just stops waiting for it. Stopping the work itself needs cancellation.\n\n// Exercise 2: in TaskProcessor.execute, replace the catch (Exception e) branch with:\n//     } catch (Exception e) {\n//         last = e;\n//         if (attempt < maxAttempts) {\n//             try {\n//                 Thread.sleep(50L << (attempt - 1));   // 50, 100, 200 ...\n//             } catch (InterruptedException ie) {\n//                 Thread.currentThread().interrupt();\n//                 return new TaskResult.Failure<>(task.id(), ie, attempt);\n//             }\n//         }\n//     }\n\n// Exercise 3: new file Summary.java and a static method in TaskProcessor\npackage dev.jorday.tasks;\n\nimport java.util.List;\n\npublic record Summary(int succeeded, int failed, int totalAttempts) {\n    public static Summary of(List<? extends TaskResult<?>> results) {\n        int ok = 0;\n        int bad = 0;\n        int attempts = 0;\n        for (TaskResult<?> r : results) {\n            if (r instanceof TaskResult.Success<?>) {\n                ok++;\n            } else {\n                bad++;\n            }\n            attempts += r.attempts();\n        }\n        return new Summary(ok, bad, attempts);\n    }\n}\n\n// Test for exercise 3 (add to TaskProcessorTest):\n@Test\nvoid summarizesResults() {\n    List<TaskResult<String>> results = List.of(\n        new TaskResult.Success<String>(\"a\", \"x\", 1),\n        new TaskResult.Failure<String>(\"b\", new IllegalStateException(\"e\"), 3));\n    assertEquals(new Summary(1, 1, 4), Summary.of(results));\n}\n```\n\n<\/details>\n"}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(() => {
  const raw = JSON.parse(document.getElementById("course-data").textContent);
  const LEVELS = ["beginner", "intermediate", "expert"];
  const TRACKS = ["python", "java"];
  const TRACK_NAME = { python: "Python", java: "Java", guide: "Start Here" };
  const WORLD_NUM = { beginner: 1, intermediate: 2, expert: 3 };
  const WORLD_NAME = { beginner: "Beginner", intermediate: "Intermediate", expert: "Expert" };
  const QUEST_XP = { guide: 50, beginner: 100, intermediate: 150, expert: 200 };
  const RANKS = [
    [1, "Hello World"], [3, "Bug Squasher"], [5, "Loop Rider"], [7, "Function Fighter"],
    [9, "Class Act"], [11, "Stack Master"], [13, "Code Legend"]
  ];
  const cap = s => s[0].toUpperCase() + s.slice(1);

  // Split a level file into an intro chunk plus one chunk per "## " heading.
  function split(md) {
    const parts = md.split(/\n(?=## )/);
    const head = parts.shift() || "";
    const title = (head.match(/^#\s+(.+)$/m) || [, ""])[1].trim();
    const intro = head.replace(/^#\s+.+$/m, "").trim();
    const sections = parts.map(p => {
      const t = p.match(/^##\s+(.+)$/m)[1].trim();
      return { title: t, short: t.replace(/^Module\s+\d+:\s*/i, "").replace(/^Capstone Project\s*[—-]\s*/i, ""), md: p, boss: /capstone/i.test(t) };
    });
    if (intro) sections.unshift({ title: "Welcome", short: "Welcome", md: `# ${title}\n\n${intro}`, intro: true });
    return { title, sections };
  }
  const course = {};
  for (const [key, md] of Object.entries(raw)) course[key] = split(md);

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let done = store.get("jcp-done", {});          // "python-beginner:3" -> true
  let ticks = store.get("jcp-ticks", {});        // "python-beginner:3" -> [true,false,true]
  let unlocked = store.get("jcp-unlocked", {});  // manual world unlocks
  let days = store.get("jcp-days", []);          // ISO dates with a cleared quest
  let earned = store.get("jcp-badges", {});
  let state = { track: "guide", level: "beginner", idx: 0 };

  const keyOf = (t = state.track, l = state.level) => t === "guide" ? "guide" : `${t}-${l}`;
  const secsOf = k => (course[k] ? course[k].sections : []);

  // ---------- XP / level math ----------
  function questXP(k, i) {
    const s = secsOf(k)[i];
    if (!s) return 0;
    const tier = k === "guide" ? "guide" : k.split("-")[1];
    if (s.intro) return 25;
    return s.boss ? QUEST_XP[tier] * 3 : QUEST_XP[tier];
  }
  function totalXP() {
    return Object.keys(done).reduce((sum, id) => {
      const [k, i] = id.split(":");
      return sum + questXP(k, +i);
    }, 0);
  }
  const xpAt = n => 75 * n * (n - 1);           // XP needed to reach level n
  function levelOf(xp) { let n = 1; while (xp >= xpAt(n + 1)) n++; return n; }
  function rankOf(lvl) { let r = RANKS[0][1]; for (const [min, name] of RANKS) if (lvl >= min) r = name; return r; }

  const worldDone = k => { const s = secsOf(k); return s.length > 0 && s.every((_, i) => done[`${k}:${i}`]); };
  const worldCount = k => secsOf(k).filter((_, i) => done[`${k}:${i}`]).length;
  function worldOpen(t, l) {
    if (t === "guide" || l === "beginner") return true;
    if (unlocked[`${t}-${l}`]) return true;
    return worldDone(`${t}-${LEVELS[LEVELS.indexOf(l) - 1]}`);
  }
  // Quests open in order: a quest unlocks once the one before it is cleared. Start Here is free-roam.
  const questOpen = (k, i) => k === "guide" || i === 0 || !!done[`${k}:${i}`] || !!done[`${k}:${i - 1}`];

  // ---------- streak ----------
  const today = () => new Date().toLocaleDateString("en-CA");
  function streak() {
    const set = new Set(days);
    const d = new Date();
    if (!set.has(d.toLocaleDateString("en-CA"))) d.setDate(d.getDate() - 1);
    let n = 0;
    while (set.has(d.toLocaleDateString("en-CA"))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  // ---------- badges ----------
  const BADGES = [
    { id: "first", icon: "🥾", name: "First Steps", desc: "Clear your first quest", test: () => Object.keys(done).length >= 1 },
    { id: "map", icon: "🗺️", name: "Read the Map", desc: "Finish Start Here", test: () => worldDone("guide") },
    ...TRACKS.flatMap(t => LEVELS.map(l => ({
      id: `${t}-${l}`, icon: t === "python" ? "🐍" : "☕", name: `${TRACK_NAME[t]} ${WORLD_NAME[l]}`,
      desc: `Beat the World ${WORLD_NUM[l]} boss`, test: () => worldDone(`${t}-${l}`)
    }))),
    { id: "boss1", icon: "⚔️", name: "Boss Slayer", desc: "Beat any boss battle", test: () => Object.keys(done).some(id => { const [k, i] = id.split(":"); return secsOf(k)[+i]?.boss; }) },
    { id: "streak3", icon: "🔥", name: "On Fire", desc: "3-day streak", test: () => streak() >= 3 },
    { id: "streak7", icon: "🌋", name: "Unstoppable", desc: "7-day streak", test: () => streak() >= 7 },
    { id: "bilingual", icon: "🌐", name: "Bilingual", desc: "Clear Beginner in both languages", test: () => worldDone("python-beginner") && worldDone("java-beginner") },
    { id: "lvl5", icon: "⭐", name: "Level 5", desc: "Reach player level 5", test: () => levelOf(totalXP()) >= 5 },
    { id: "lvl10", icon: "🌟", name: "Level 10", desc: "Reach player level 10", test: () => levelOf(totalXP()) >= 10 },
    { id: "legend", icon: "👑", name: "Code Legend", desc: "Clear all six worlds", test: () => TRACKS.every(t => LEVELS.every(l => worldDone(`${t}-${l}`))) }
  ];
  function checkBadges() {
    const fresh = [];
    for (const b of BADGES) if (!earned[b.id] && b.test()) { earned[b.id] = today(); fresh.push(b); }
    if (fresh.length) store.set("jcp-badges", earned);
    return fresh;
  }

  marked.setOptions({ gfm: true });

  // ---------- render ----------
  function renderHUD() {
    const xp = totalXP(), lvl = levelOf(xp);
    const lo = xpAt(lvl), hi = xpAt(lvl + 1);
    document.getElementById("hud-level").textContent = lvl;
    document.getElementById("hud-rank").textContent = rankOf(lvl);
    const s = streak();
    document.getElementById("hud-streak").textContent = s ? `🔥 ${s}` : "";
    document.getElementById("hud-bar").style.width = `${((xp - lo) / (hi - lo)) * 100}%`;
    document.getElementById("hud-xp").textContent = `${xp.toLocaleString()} XP · ${(hi - xp).toLocaleString()} to Lv ${lvl + 1}`;
  }

  function render() {
    document.body.dataset.track = state.track;
    document.querySelectorAll(".tracks .tab").forEach(b => b.setAttribute("aria-selected", b.dataset.track === state.track));
    const lv = document.getElementById("levels");
    lv.hidden = state.track === "guide";
    lv.querySelectorAll(".tab").forEach(b => {
      const l = b.dataset.level, open = worldOpen(state.track, l), clear = worldDone(`${state.track}-${l}`);
      b.setAttribute("aria-selected", l === state.level);
      b.innerHTML = `${clear ? '<span class="star">★</span>' : open ? "" : '<span class="lock">🔒</span>'}${WORLD_NAME[l]}`;
    });
    renderHUD();

    const k = keyOf();
    const lvl = course[k];
    const secs = lvl ? lvl.sections : [];
    const open = worldOpen(state.track, state.level);
    state.idx = Math.max(0, Math.min(state.idx, secs.length - 1));
    if (!questOpen(k, state.idx)) state.idx = firstOpenIdx(k);

    // world card
    document.getElementById("w-eyebrow").textContent = state.track === "guide" ? "Tutorial" : `${TRACK_NAME[state.track]} · World ${WORLD_NUM[state.level]}`;
    document.getElementById("w-name").textContent = state.track === "guide" ? "Start Here" : WORLD_NAME[state.level];
    const count = worldCount(k);
    document.getElementById("progress-count").textContent = `${count} / ${secs.length}`;
    document.getElementById("progress-bar").style.width = secs.length ? `${(count / secs.length) * 100}%` : "0";

    // quest map
    const map = document.getElementById("map"), picker = document.getElementById("picker");
    map.innerHTML = ""; picker.innerHTML = "";
    secs.forEach((s, i) => {
      const id = `${k}:${i}`, isDone = !!done[id], qOpen = open && questOpen(k, i);
      const li = document.createElement("li");
      li.className = [isDone ? "is-done" : qOpen ? "is-open" : "", s.boss ? "is-boss" : "", i === state.idx && open ? "is-current" : ""].join(" ");
      const b = document.createElement("button");
      const mark = isDone ? "✓" : !qOpen ? "🔒" : s.boss ? "!" : (s.intro ? "★" : i);
      b.innerHTML = `<span class="node"><span>${mark}</span></span><span><span class="q-title"></span><span class="q-meta"></span></span>`;
      b.querySelector(".q-title").textContent = s.short;
      b.querySelector(".q-meta").textContent = `${s.boss ? "BOSS BATTLE · " : ""}+${questXP(k, i)} XP`;
      if (i === state.idx && open) b.setAttribute("aria-current", "true");
      b.disabled = !qOpen;
      b.onclick = () => go(i);
      li.appendChild(b); map.appendChild(li);
      const o = document.createElement("option");
      o.value = i; o.disabled = !qOpen;
      o.textContent = `${isDone ? "✓ " : !qOpen ? "🔒 " : s.boss ? "⚔ " : ""}${s.short}`;
      picker.appendChild(o);
    });
    picker.value = state.idx;

    if (!open) return renderLocked();
    renderQuest(k, secs);
  }

  function firstOpenIdx(k) {
    const s = secsOf(k);
    for (let i = 0; i < s.length; i++) if (!done[`${k}:${i}`]) return i;
    return Math.max(0, s.length - 1);
  }

  function renderLocked() {
    const prev = LEVELS[LEVELS.indexOf(state.level) - 1];
    const pk = `${state.track}-${prev}`;
    document.getElementById("quest-tag").innerHTML = "";
    document.getElementById("foot").hidden = true;
    const body = document.getElementById("body");
    body.innerHTML = `<div class="locked">
      <div class="big-lock">🔒</div>
      <h1>World ${WORLD_NUM[state.level]} is locked</h1>
      <p>Beat the ${TRACK_NAME[state.track]} ${WORLD_NAME[prev]} boss to unlock ${WORLD_NAME[state.level]}. You've cleared ${worldCount(pk)} of ${secsOf(pk).length} quests there.</p>
      <button class="btn primary" id="goprev">Back to ${WORLD_NAME[prev]} →</button>
      <div id="skipzone"><button class="link-btn" id="skip">Already know this stuff? Unlock it anyway</button></div>
    </div>`;
    body.querySelector("#goprev").onclick = () => { state.level = prev; state.idx = firstOpenIdx(pk); render(); };
    body.querySelector("#skip").onclick = () => {
      const z = body.querySelector("#skipzone");
      z.innerHTML = `<p style="margin-bottom:8px">Skipping means no XP for the quests you skip. Sure?</p>
        <div class="confirm-row"><button class="btn" id="skipno">Keep it locked</button><button class="btn primary" id="skipyes">Unlock World ${WORLD_NUM[state.level]}</button></div>`;
      z.querySelector("#skipno").onclick = render;
      z.querySelector("#skipyes").onclick = () => { unlocked[keyOf()] = true; store.set("jcp-unlocked", unlocked); state.idx = 0; render(); };
    };
    saveState();
  }

  function renderQuest(k, secs) {
    const sec = secs[state.idx];
    const id = `${k}:${state.idx}`;
    const isDone = !!done[id];
    document.getElementById("foot").hidden = false;

    const tag = document.getElementById("quest-tag");
    const label = state.track === "guide" ? "Tutorial" : sec.intro ? "Briefing" : sec.boss ? "Boss battle" : `Quest ${state.idx}`;
    tag.innerHTML = `<span class="chip${sec.boss ? " boss" : ""}">${label}</span><span class="chip xp"><b>+${questXP(k, state.idx)}</b> XP</span>${isDone ? '<span class="chip done">✓ Cleared</span>' : ""}`;

    let md = sec.md;
    if (!sec.intro) md = md.replace(/^##\s+(.+)$/m, "# $1");
    const body = document.getElementById("body");
    body.innerHTML = marked.parse(md);
    body.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.appendChild(t); });
    body.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    body.querySelectorAll("pre code").forEach(c => {
      try { hljs.highlightElement(c); } catch {}
      const btn = document.createElement("button");
      btn.className = "copy"; btn.textContent = "Copy";
      btn.onclick = () => {
        const ok = () => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1400); };
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; };
        try { navigator.clipboard.writeText(c.innerText).then(ok, fallback); } catch { fallback(); }
      };
      c.parentElement.appendChild(btn);
    });

    // Turn the Practice list into checkable objectives.
    const practiceH = [...body.querySelectorAll("h3")].find(h => /^practice/i.test(h.textContent.trim()));
    let objectives = [];
    if (practiceH) {
      let ol = practiceH.nextElementSibling;
      while (ol && ol.tagName !== "OL" && ol.tagName !== "H3") ol = ol.nextElementSibling;
      if (ol && ol.tagName === "OL") {
        practiceH.textContent = "Quest objectives";
        const hint = document.createElement("p");
        hint.className = "obj-hint"; hint.textContent = "Do each exercise yourself, then tick it off. Try before you open the solutions.";
        practiceH.after(hint);
        ol.classList.add("objectives");
        const saved = ticks[id] || [];
        [...ol.children].forEach((li, j) => {
          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.id = `obj-${j}`; cb.checked = isDone || !!saved[j];
          const lab = document.createElement("label");
          lab.htmlFor = cb.id;
          while (li.firstChild) lab.appendChild(li.firstChild);
          li.append(cb, lab);
          li.classList.toggle("checked", cb.checked);
          cb.onchange = () => {
            const arr = ticks[id] || []; arr[j] = cb.checked; ticks[id] = arr; store.set("jcp-ticks", ticks);
            li.classList.toggle("checked", cb.checked);
            updateClaim();
          };
          objectives.push(cb);
        });
      }
    }

    const claim = document.getElementById("claim");
    const note = document.getElementById("claim-note");
    claim.classList.toggle("boss", !!sec.boss);
    function updateClaim() {
      if (done[id]) { claim.textContent = "✓ Cleared"; claim.className = "btn done"; claim.disabled = false; note.textContent = "Click to un-clear"; return; }
      const left = objectives.filter(c => !c.checked).length;
      claim.className = "btn claim" + (sec.boss ? " boss" : "");
      claim.textContent = sec.boss ? `Defeat the boss · +${questXP(k, state.idx)} XP` : `Claim +${questXP(k, state.idx)} XP`;
      claim.disabled = left > 0;
      note.textContent = left ? `${left} objective${left > 1 ? "s" : ""} left` : "";
    }
    updateClaim();

    document.getElementById("prev").disabled = state.idx === 0;
    const next = document.getElementById("next");
    const last = state.idx === secs.length - 1;
    next.textContent = last ? nextWorldLabel() || "Done" : "Next →";
    next.disabled = (last && !nextWorldLabel()) || (!last && !questOpen(k, state.idx + 1));
    saveState();
  }

  function nextWorldLabel() {
    if (state.track === "guide") return "Start Python →";
    const i = LEVELS.indexOf(state.level);
    return i < 2 ? `World ${i + 2}: ${WORLD_NAME[LEVELS[i + 1]]} →` : "";
  }

  function saveState() {
    store.set("jcp-state", state);
    const hash = state.track === "guide" ? "guide" : `${state.track}-${state.level}`;
    try { history.replaceState(null, "", "#" + hash); } catch {}
  }

  function go(i) {
    state.idx = i; render();
    const top = document.getElementById("lesson").getBoundingClientRect().top + scrollY - 90;
    if (scrollY > top) scrollTo({ top });
  }

  // ---------- rewards ----------
  function toast(html) {
    const t = document.getElementById("toast");
    t.innerHTML = html; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function modal(html, wire) {
    const back = document.getElementById("modal-back"), m = document.getElementById("modal");
    m.innerHTML = html; back.hidden = false;
    const close = () => { back.hidden = true; };
    back.onclick = e => { if (e.target === back) close(); };
    m.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
    if (wire) wire(m, close);
    (m.querySelector(".btn.primary") || m.querySelector("button"))?.focus();
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("modal-back").hidden = true; });

  function confetti(big) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.getElementById("confetti"), ctx = c.getContext("2d");
    c.hidden = false; c.width = innerWidth; c.height = innerHeight;
    const colors = ["#f5c542", "#2f6fa8", "#c4510f", "#1a7f37", "#b4235a", "#6aaee8"];
    const ps = Array.from({ length: big ? 220 : 90 }, () => ({
      x: innerWidth / 2 + (Math.random() - 0.5) * 200, y: innerHeight * 0.55,
      vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 16 - 6, r: Math.random() * 6 + 4,
      a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4, col: colors[(Math.random() * colors.length) | 0]
    }));
    let f = 0;
    (function tick() {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const p of ps) {
        p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.a += p.va; p.vx *= 0.99;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
      }
      if (++f < 150) requestAnimationFrame(tick); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
    })();
  }

  function badgeChips(list) {
    return list.map(b => `<div class="badge mini"><span class="b-icon">${b.icon}</span><b>${b.name}</b></div>`).join("");
  }

  function clearQuest() {
    const k = keyOf(), id = `${k}:${state.idx}`;
    if (done[id]) { delete done[id]; store.set("jcp-done", done); render(); return; }
    const before = levelOf(totalXP());
    const wasWorldDone = worldDone(k);
    done[id] = true; store.set("jcp-done", done);
    if (!days.includes(today())) { days.push(today()); store.set("jcp-days", days); }
    const gained = questXP(k, state.idx);
    const after = levelOf(totalXP());
    const fresh = checkBadges();
    const sec = secsOf(k)[state.idx];
    render();

    if (!wasWorldDone && worldDone(k)) return worldCleared(k, fresh, after > before ? after : 0);
    if (after > before) {
      confetti(true);
      return modal(`<div class="m-icon">⬆️</div><h2>Level ${after}!</h2>
        <p>${rankOf(after) !== rankOf(before) ? `New rank unlocked: <b>${rankOf(after)}</b>.` : `${xpAt(after + 1) - totalXP()} XP to Level ${after + 1}. Keep going.`}</p>
        ${fresh.length ? `<div class="new-badges">${badgeChips(fresh)}</div>` : ""}
        <div class="actions"><button class="btn primary" data-next>Next quest →</button></div>`,
        m => m.querySelector("[data-next]").onclick = () => { document.getElementById("modal-back").hidden = true; advance(); });
    }
    if (sec.boss || fresh.length) {
      confetti(false);
      if (fresh.length) return modal(`<div class="m-icon">${fresh[0].icon}</div><h2>Badge unlocked</h2>
        <div class="new-badges">${badgeChips(fresh)}</div>
        <div class="actions"><button class="btn primary" data-next>Nice, next quest →</button></div>`,
        m => m.querySelector("[data-next]").onclick = () => { document.getElementById("modal-back").hidden = true; advance(); });
    }
    toast(`<b>+${gained} XP</b> · quest cleared`);
    setTimeout(advance, 650);
  }

  function worldCleared(k, fresh, newLevel) {
    confetti(true);
    if (k === "guide") {
      return modal(`<div class="m-icon">🗺️</div><h2>Tutorial complete</h2>
        <p>You know the map. Time to write real code. Pick your first language.</p>
        <div class="new-badges">${badgeChips(fresh)}</div>
        <div class="actions"><button class="btn primary" data-py>Start Python</button><button class="btn" data-java>Start Java</button></div>`,
        (m, close) => {
          m.querySelector("[data-py]").onclick = () => { close(); state = { track: "python", level: "beginner", idx: 0 }; render(); };
          m.querySelector("[data-java]").onclick = () => { close(); state = { track: "java", level: "beginner", idx: 0 }; render(); };
        });
    }
    const [t, l] = k.split("-");
    const i = LEVELS.indexOf(l);
    const nextL = LEVELS[i + 1];
    const other = t === "python" ? "java" : "python";
    const body = nextL
      ? `<p>World ${WORLD_NUM[nextL]}: <b>${TRACK_NAME[t]} ${WORLD_NAME[nextL]}</b> is now unlocked.</p>`
      : `<p>You beat the final ${TRACK_NAME[t]} world. That's expert level.</p>`;
    modal(`<div class="m-icon">🏆</div><h2>World ${WORLD_NUM[l]} cleared!</h2>
      <p>${TRACK_NAME[t]} ${WORLD_NAME[l]} is done.${newLevel ? ` You reached <b>Level ${newLevel}</b>.` : ""}</p>
      ${body}
      ${fresh.length ? `<div class="new-badges">${badgeChips(fresh)}</div>` : ""}
      <div class="actions">${nextL ? `<button class="btn primary" data-go>Enter World ${WORLD_NUM[nextL]} →</button>` : `<button class="btn primary" data-other>Try ${TRACK_NAME[other]}</button>`}<button class="btn" data-close>Stay here</button></div>`,
      (m, close) => {
        m.querySelector("[data-go]")?.addEventListener("click", () => { close(); state.level = nextL; state.idx = 0; render(); scrollTo({ top: 0 }); });
        m.querySelector("[data-other]")?.addEventListener("click", () => { close(); state = { track: other, level: "beginner", idx: firstOpenIdx(`${other}-beginner`) }; render(); scrollTo({ top: 0 }); });
      });
  }

  function advance() {
    const total = secsOf(keyOf()).length;
    if (state.idx < total - 1) return go(state.idx + 1);
  }

  function playerCard() {
    const xp = totalXP(), lvl = levelOf(xp);
    const cleared = Object.keys(done).length;
    const worlds = TRACKS.flatMap(t => LEVELS.map(l => {
      const k = `${t}-${l}`, n = worldCount(k), tot = secsOf(k).length;
      const lockedTxt = worldOpen(t, l) ? `${n} / ${tot}` : "🔒";
      return `<div class="world-row"><span>${TRACK_NAME[t]} · ${WORLD_NAME[l]}</span><span style="font-variant-numeric:tabular-nums">${worldDone(k) ? "★ " : ""}${lockedTxt}</span><div class="bar"><span style="width:${tot ? (n / tot) * 100 : 0}%;background:var(--${t === "python" ? "py" : "java"})"></span></div></div>`;
    })).join("");
    const badges = BADGES.map(b => `<div class="badge${earned[b.id] ? "" : " off"}"><span class="b-icon">${b.icon}</span><b>${b.name}</b><span>${b.desc}</span></div>`).join("");
    modal(`<div class="player">
      <div class="player-head"><span class="lvl-badge">${lvl}</span><div><h2>Jorday</h2><p>${rankOf(lvl)} · Level ${lvl}</p></div></div>
      <div class="stats" style="margin-top:16px">
        <div class="stat"><b>${xp.toLocaleString()}</b><span>Total XP</span></div>
        <div class="stat"><b>${cleared}</b><span>Quests cleared</span></div>
        <div class="stat"><b>${streak()}</b><span>Day streak</span></div>
      </div>
      <p class="sect-title" style="margin-top:16px">Worlds</p>
      <div class="worlds">${worlds}</div>
      <p class="sect-title" style="margin-top:16px">Badges · ${Object.keys(earned).length} / ${BADGES.length}</p>
      <div class="badges" style="margin-top:8px">${badges}</div>
      <p class="claim-note" style="margin-top:14px">Progress is saved in this browser on this device.</p>
      <div class="actions" style="justify-content:space-between" id="card-actions"><button class="link-btn" data-reset>Reset progress</button><button class="btn primary" data-close>Back to the game</button></div>
    </div>`, (m, close) => {
      m.querySelector("[data-reset]").onclick = () => {
        const a = m.querySelector("#card-actions");
        a.innerHTML = `<span class="claim-note">Wipe all XP, quests and badges?</span><span class="confirm-row"><button class="btn" data-keep>Keep</button><button class="btn primary" data-wipe>Reset</button></span>`;
        a.querySelector("[data-keep]").onclick = playerCard;
        a.querySelector("[data-wipe]").onclick = () => {
          done = {}; ticks = {}; unlocked = {}; days = []; earned = {};
          ["jcp-done", "jcp-ticks", "jcp-unlocked", "jcp-days", "jcp-badges"].forEach(k2 => store.set(k2, k2 === "jcp-days" ? [] : {}));
          close(); state = { track: "guide", level: "beginner", idx: 0 }; render();
        };
      };
    });
  }

  // ---------- wiring ----------
  document.querySelectorAll(".tracks .tab").forEach(b => b.onclick = () => {
    state.track = b.dataset.track;
    if (state.track !== "guide" && !worldOpen(state.track, state.level)) state.level = "beginner";
    state.idx = firstOpenIdx(keyOf()); render();
  });
  document.querySelectorAll(".levels .tab").forEach(b => b.onclick = () => { state.level = b.dataset.level; state.idx = firstOpenIdx(keyOf()); render(); });
  document.getElementById("picker").onchange = e => go(+e.target.value);
  document.getElementById("prev").onclick = () => go(state.idx - 1);
  document.getElementById("next").onclick = () => {
    const total = secsOf(keyOf()).length;
    if (state.idx < total - 1) return go(state.idx + 1);
    if (state.track === "guide") { state = { track: "python", level: "beginner", idx: firstOpenIdx("python-beginner") }; return render(); }
    const i = LEVELS.indexOf(state.level);
    if (i < 2) { state.level = LEVELS[i + 1]; state.idx = 0; render(); scrollTo({ top: 0 }); }
  };
  document.getElementById("claim").onclick = clearQuest;
  document.getElementById("hud").onclick = playerCard;

  const h = location.hash.slice(1);
  const m = h.match(/^(python|java)-(beginner|intermediate|expert)$/);
  const saved = store.get("jcp-state", null);
  if (m) state = { track: m[1], level: m[2], idx: saved && saved.track === m[1] && saved.level === m[2] ? saved.idx : firstOpenIdx(`${m[1]}-${m[2]}`) };
  else if (h === "guide") state = { track: "guide", level: "beginner", idx: 0 };
  else if (saved) state = Object.assign(state, saved);
  checkBadges();
  render();
})();
</script>

</body></html>
