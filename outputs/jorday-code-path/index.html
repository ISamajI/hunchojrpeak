 be the first class in the file so `java Main.java` runs it. It saves five expenses, loads them back, prints the report, then deliberately corrupts the file to show that bad data is detected.\n\n**Full final code (`Main.java`):**\n\n```java\nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.util.Comparator;\nimport java.util.EnumMap;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.stream.Collectors;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Path file = Files.createTempFile(\"expenses\", \".csv\");\n        ExpenseStore store = new CsvExpenseStore(file);\n\n        List<Expense> expenses = List.of(\n            new Expense(\"Groceries\", Category.FOOD, 4250),\n            new Expense(\"Bus pass\", Category.TRANSPORT, 3000),\n            new Expense(\"Pizza night\", Category.FOOD, 2399),\n            new Expense(\"Movie\", Category.FUN, 1500),\n            new Expense(\"Taxi\", Category.TRANSPORT, 1875));\n        store.saveAll(expenses);\n\n        List<Expense> loaded = store.loadAll();\n        System.out.println(\"Loaded \" + loaded.size() + \" expenses\");\n\n        ExpenseReport report = new ExpenseReport(loaded);\n        System.out.println(\"Total: \" + Money.format(report.total()));\n        System.out.println(\"By category:\");\n        for (Map.Entry<Category, Integer> e : report.totalsByCategory().entrySet()) {\n            System.out.printf(\"  %-10s %s%n\", e.getKey(), Money.format(e.getValue()));\n        }\n        System.out.println(\"Top 3:\");\n        int rank = 1;\n        for (Expense e : report.top(3)) {\n            System.out.println(rank++ + \". \" + e.description() + \" \" + Money.format(e.cents()));\n        }\n\n        Files.writeString(file, \"oops\\n\");\n        try {\n            store.loadAll();\n        } catch (IllegalArgumentException e) {\n            System.out.println(\"Bad data: \" + e.getMessage());\n        }\n        Files.delete(file);\n    }\n}\n\nenum Category { FOOD, TRANSPORT, FUN, OTHER }\n\nrecord Expense(String description, Category category, int cents) {\n    Expense {\n        if (description == null || description.isBlank()) {\n            throw new IllegalArgumentException(\"description required\");\n        }\n        if (description.contains(\",\")) {\n            throw new IllegalArgumentException(\"description must not contain a comma\");\n        }\n        if (cents <= 0) {\n            throw new IllegalArgumentException(\"amount must be positive\");\n        }\n    }\n}\n\nfinal class Money {\n    private Money() {}\n\n    static String format(int cents) {\n        return String.format(\"$%d.%02d\", cents / 100, cents % 100);\n    }\n}\n\ninterface ExpenseStore {\n    void saveAll(List<Expense> expenses) throws StorageException;\n    List<Expense> loadAll() throws StorageException;\n}\n\nclass StorageException extends Exception {\n    StorageException(String message, Throwable cause) { super(message, cause); }\n}\n\nclass CsvExpenseStore implements ExpenseStore {\n    private final Path file;\n\n    CsvExpenseStore(Path file) { this.file = file; }\n\n    @Override\n    public void saveAll(List<Expense> expenses) throws StorageException {\n        List<String> lines = expenses.stream()\n            .map(e -> e.description() + \",\" + e.category() + \",\" + e.cents())\n            .toList();\n        try {\n            Files.write(file, lines);\n        } catch (IOException e) {\n            throw new StorageException(\"Could not write \" + file, e);\n        }\n    }\n\n    @Override\n    public List<Expense> loadAll() throws StorageException {\n        try {\n            return Files.readAllLines(file).stream()\n                .filter(line -> !line.isBlank())\n                .map(CsvExpenseStore::parse)\n                .toList();\n        } catch (IOException e) {\n            throw new StorageException(\"Could not read \" + file, e);\n        }\n    }\n\n    private static Expense parse(String line) {\n        String[] parts = line.split(\",\");\n        if (parts.length != 3) {\n            throw new IllegalArgumentException(\"Bad line: \" + line);\n        }\n        return new Expense(parts[0], Category.valueOf(parts[1]), Integer.parseInt(parts[2]));\n    }\n}\n\nclass ExpenseReport {\n    private final List<Expense> expenses;\n\n    ExpenseReport(List<Expense> expenses) { this.expenses = List.copyOf(expenses); }\n\n    int total() {\n        return expenses.stream().mapToInt(Expense::cents).sum();\n    }\n\n    Map<Category, Integer> totalsByCategory() {\n        return expenses.stream().collect(Collectors.groupingBy(\n            Expense::category,\n            () -> new EnumMap<Category, Integer>(Category.class),\n            Collectors.summingInt(Expense::cents)));\n    }\n\n    List<Expense> top(int n) {\n        return expenses.stream()\n            .sorted(Comparator.comparingInt(Expense::cents).reversed())\n            .limit(n)\n            .toList();\n    }\n}\n```\n\nOutput:\n```text\nLoaded 5 expenses\nTotal: $130.24\nBy category:\n  FOOD       $66.49\n  TRANSPORT  $48.75\n  FUN        $15.00\nTop 3:\n1. Groceries $42.50\n2. Bus pass $30.00\n3. Pizza night $23.99\nBad data: Bad line: oops\n```\n\n**Step 6: Run it and read it.** Save the file as `Main.java` and run `java Main.java`. Then try breaking things on purpose: add a comma to a description, set `cents` to 0, or change a category name in the CSV. Each failure should produce a clear message from the layer that owns the rule.\n\n**What you practiced.** Encapsulation and validation in records (Modules 1, 7), an interface to decouple storage from reporting (1), checked versus unchecked exceptions with cause chaining (2), `EnumMap` and `List.copyOf` (3, 7), a stream pipeline with `groupingBy` and `Comparator` (5, 6), and `java.nio` file I/O (8).\n\n### Common mistakes\n- Using `double` for money. `0.1 + 0.2` is not `0.3` in floating point. Use whole cents (an `int` or `long`) or `BigDecimal`.\n- Splitting on commas when the data itself can contain commas. Real CSV needs quoting rules; for anything serious, use a library. Here we banned commas to keep the format simple.\n- Letting the file format leak into the rest of the program. Only `CsvExpenseStore` should know about CSV.\n- Catching `IllegalArgumentException` from `parse` and silently skipping bad lines. Corrupt data should be loud.\n- Forgetting that `Main` must be the first class in the file when running with `java Main.java`.\n\n### Practice\n1. Add a `filterByCategory(Category c)` method to `ExpenseReport` that returns the matching expenses, and print only the `FOOD` expenses.\n2. Add an `average()` method that returns the average expense in cents, and handle the empty-list case.\n3. Add a `JsonExpenseStore` stub, or any second `ExpenseStore` implementation that keeps expenses in memory, and swap it in `main` without touching `ExpenseReport`.\n\n<details><summary>Solutions<\/summary>\n\n```java\n// Add to ExpenseReport (needs: import java.util.OptionalDouble;)\n\n// Exercise 1\nList<Expense> filterByCategory(Category c) {\n    return expenses.stream()\n        .filter(e -> e.category() == c)\n        .toList();\n}\n\n// Exercise 2\nOptionalDouble average() {\n    return expenses.stream().mapToInt(Expense::cents).average();\n}\n// usage: report.average().ifPresentOrElse(\n//     a -> System.out.println(\"Average: \" + Money.format((int) Math.round(a))),\n//     () -> System.out.println(\"No expenses\"));\n\n// Exercise 3 (add as a new top-level class; needs java.util.ArrayList)\nclass MemoryExpenseStore implements ExpenseStore {\n    private List<Expense> saved = new ArrayList<>();\n\n    @Override\n    public void saveAll(List<Expense> expenses) {\n        saved = new ArrayList<>(expenses);\n    }\n\n    @Override\n    public List<Expense> loadAll() {\n        return List.copyOf(saved);\n    }\n}\n// usage in main: ExpenseStore store = new MemoryExpenseStore();\n```\n\n<\/details>\n", "java-expert": "# Java — Expert\n\nAt this level you stop writing programs and start building software: projects with a real build tool, a test suite that proves they work, code that does many things at once without corrupting itself, an understanding of what the JVM is doing underneath you, and a design vocabulary (builder, strategy, dependency injection, SOLID) that lets other developers read your code quickly. You will finish by building a small REST service with Spring Boot and a concurrent task processor with tests. This level assumes you are comfortable with everything in Java Intermediate: collections, generics, lambdas, streams, records, sealed types and `java.nio`. We target Java 21 or newer, with Java 25 (the current long-term-support release) as the reference. Examples in the concurrency and JVM modules are single files you can run with `java Main.java`, with `Main` as the first class in the file; the build, testing, Spring and capstone modules use real Maven projects, so you need Maven 3.9 or newer (or Gradle 8.14 or newer) installed.\n\n## Module 1: Build Tools and Project Layout\n**Goal:** Create a Java project with Maven or Gradle, understand the standard directory layout, and build, test and run it from the command line.\n\nTyping `javac` on a growing project stops working fast: you have dozens of files, third-party libraries, tests, and a need to build the same way on every machine. A **build tool** does four jobs: it compiles your code, **downloads dependencies** (and their dependencies) from a repository such as Maven Central, runs tests, and packages the result into a JAR. The two dominant tools are Maven and Gradle.\n\n| | Maven | Gradle |\n|---|---|---|\n| Config file | `pom.xml` (XML, declarative) | `build.gradle.kts` (Kotlin code) or `build.gradle` (Groovy) |\n| Style | Fixed lifecycle: `compile`, `test`, `package`, `verify` | Flexible task graph you can script |\n| Strength | Predictable; every Maven project looks alike; huge ecosystem | Faster incremental builds and caching; very customizable |\n| Weakness | Verbose XML; hard to bend off the standard path | More ways to do the same thing; steeper learning curve |\n| Common in | Enterprise Java, Spring tutorials | Android, large multi-module builds |\n\nNeither is \"better\". Learn Maven first because its rigid conventions teach you what a build does, then read Gradle files when you meet them. Both use the same **standard project layout**, which is why any Java developer can find their way around a new project:\n\n```text\nmy-app/\n  pom.xml                      (or build.gradle.kts + settings.gradle.kts)\n  src/\n    main/\n      java/dev/jorday/app/App.java\n      resources/               (config files, templates)\n    test/\n      java/dev/jorday/app/AppTest.java\n      resources/\n  target/                      (Maven output; build/ for Gradle. Never commit this)\n```\n\nSource folders mirror package names: the class `dev.jorday.app.App` lives in `src/main/java/dev/jorday/app/App.java`. Production code goes in `src/main`, test code in `src/test`, and tests can see main code but not the other way around.\n\nHere is a minimal Maven `pom.xml`. Every Maven project is identified by **coordinates**: `groupId` (your organization, usually a reversed domain), `artifactId` (the project name) and `version`. The `junit-bom` import pins one consistent version for all JUnit modules.\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\n         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\">\n  <modelVersion>4.0.0<\/modelVersion>\n\n  <groupId>dev.jorday<\/groupId>\n  <artifactId>my-app<\/artifactId>\n  <version>1.0.0<\/version>\n  <packaging>jar<\/packaging>\n\n  <properties>\n    <maven.compiler.release>21<\/maven.compiler.release>\n    <project.build.sourceEncoding>UTF-8<\/project.build.sourceEncoding>\n  <\/properties>\n\n  <dependencyManagement>\n    <dependencies>\n      <dependency>\n        <groupId>org.junit<\/groupId>\n        <artifactId>junit-bom<\/artifactId>\n        <version>6.1.3<\/version>\n        <type>pom<\/type>\n        <scope>import<\/scope>\n      <\/dependency>\n    <\/dependencies>\n  <\/dependencyManagement>\n\n  <dependencies>\n    <dependency>\n      <groupId>org.junit.jupiter<\/groupId>\n      <artifactId>junit-jupiter<\/artifactId>\n      <scope>test<\/scope>\n    <\/dependency>\n  <\/dependencies>\n\n  <build>\n    <plugins>\n      <plugin>\n        <artifactId>maven-surefire-plugin<\/artifactId>\n        <version>3.6.1<\/version>\n      <\/plugin>\n    <\/plugins>\n  <\/build>\n<\/project>\n```\n\n`maven.compiler.release` tells the compiler which Java version to target (it compiles against that version's real API, which is safer than the older `source`/`target` settings). You must run Maven on a JDK at least that new. Pinning the Surefire plugin version matters because older default versions do not run modern JUnit tests.\n\nThe class:\n\n```java\npackage dev.jorday.app;\n\npublic class App {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, build tools!\");\n    }\n}\n```\n\nBuild and run it:\n\n```bash\nmvn package\njava -cp target/classes dev.jorday.app.App\n```\n\nOutput:\n```text\n(Maven prints many [INFO] lines, ending with the next two)\n[INFO] BUILD SUCCESS\n[INFO] Total time: ... s\n\nHello, build tools!\n```\n\n(The `mvn` log is abridged and the timings differ per machine; the program's own line is exactly `Hello, build tools!`.)\n\n**Dependency scopes** control where a library is available. `compile` (the default) means it is needed to build and run; `test` means it is only on the classpath for tests (JUnit, mocking libraries); `runtime` means it is needed to run but not to compile (a database driver); `provided` means the runtime environment supplies it. Putting a test library in the compile scope ships it to production for no reason.\n\n**The Maven lifecycle** is a fixed sequence, and each command runs everything before it: `mvn compile`, `mvn test` (compiles and runs tests), `mvn package` (makes the JAR), `mvn verify` (runs integration checks), `mvn clean` (deletes `target/`). The usual daily command is `mvn clean verify`. Use the **wrapper** (`./mvnw` or `./gradlew`), a tiny script checked into the project that downloads the exact build-tool version the project expects, so nobody's result depends on the version installed on their machine.\n\nThe Gradle equivalent uses two files. `settings.gradle.kts`:\n\n```kotlin\nrootProject.name = \"my-app\"\n```\n\n`build.gradle.kts`:\n\n```kotlin\nplugins {\n    java\n    application\n}\n\ngroup = \"dev.jorday\"\nversion = \"1.0.0\"\n\njava {\n    toolchain {\n        languageVersion.set(JavaLanguageVersion.of(21))\n    }\n}\n\nrepositories {\n    mavenCentral()\n}\n\ndependencies {\n    testImplementation(platform(\"org.junit:junit-bom:6.1.3\"))\n    testImplementation(\"org.junit.jupiter:junit-jupiter\")\n    testRuntimeOnly(\"org.junit.platform:junit-platform-launcher\")\n}\n\napplication {\n    mainClass.set(\"dev.jorday.app.App\")\n}\n\ntasks.test {\n    useJUnitPlatform()\n}\n```\n\nRun it with `gradle run` (or `./gradlew run`). The Gradle `toolchain` setting is a nice feature: it finds or downloads the right JDK for you. To use Java 25 instead, change both builds to `25`.\n\n**Packages and modules.** Packages group classes and prevent name clashes; use your reversed domain (`dev.jorday...`). Java also has a *module system* (`module-info.java`) for strong encapsulation. Most application projects do not need it. Know it exists, because you will see it in the JDK itself.\n\n### Common mistakes\n- Committing `target/` or `build/` to git. They are generated output; add them to `.gitignore`.\n- Running Maven on an older JDK than `maven.compiler.release`. You will see an error like `release version 21 not supported`.\n- Putting test dependencies in the default (compile) scope.\n- Package names that do not match the folders. The compiler and the runtime will not find the class.\n- Hand-copying JAR files into the project instead of declaring the dependency. Nobody else can reproduce your build.\n- Not pinning versions, so \"it worked yesterday\" builds break when a dependency silently updates. Use a BOM or explicit versions.\n- Memorizing commands without understanding the lifecycle. Know that `mvn test` already compiled your code.\n\n### Practice\n1. Create the `my-app` Maven project above by hand (folders, `pom.xml`, `App.java`). Run `mvn package` and run the program.\n2. Create the Gradle equivalent in a second folder and run it with `gradle run`.\n3. Add the AssertJ library (`org.assertj:assertj-core`, version 3.27.7) to the Maven project as a test-scope dependency, and explain why `test` scope is correct.\n\n<details><summary>Solutions<\/summary>\n\n```java\n// Solutions 1 and 2 are the files shown in the lesson. Directory creation:\n//   mkdir -p my-app/src/main/java/dev/jorday/app my-app/src/test/java/dev/jorday/app\n// Put pom.xml in my-app/, App.java in src/main/java/dev/jorday/app/, then run:\n//   mvn package\n//   java -cp target/classes dev.jorday.app.App\n// Gradle: create settings.gradle.kts and build.gradle.kts as above, then: gradle run\n//\n// Solution 3: add inside the <dependencies> block of pom.xml:\n//   <dependency>\n//     <groupId>org.assertj<\/groupId>\n//     <artifactId>assertj-core<\/artifactId>\n//     <version>3.27.7<\/version>\n//     <scope>test<\/scope>\n//   <\/dependency>\n//\n// Why test scope: assertion libraries are only used by test code. Production code\n// never imports them, so they must not be part of what you ship or run.\n```\n\n<\/details>\n\n## Module 2: Unit Testing with JUnit\n**Goal:** Write fast, readable automated tests with JUnit, including exceptions, parameterized cases and fake dependencies.\n\nA unit test calls a small piece of code and checks the result automatically. The benefit is not \"finding bugs today\". It is that six months from now, when you change something, 200 tests tell you in three seconds whether you broke anything. Tests are what make change safe.\n\nA note on versions: the course brief says \"JUnit 5\", and the programming model you use (`org.junit.jupiter.api`, the annotations below) is called JUnit Jupiter. JUnit 6 is the current release line (requires Java 17+) and keeps the same Jupiter API for everything in this module, so what you learn applies to both. The project from Module 1 already uses it.\n\n**Structure of a good test: Arrange, Act, Assert.** Set up the inputs, call the code under test, check the outcome. Each test checks one behavior and has a name that describes it. Tests go in `src/test/java`, in the same package as the class they test.\n\nFirst, the code to test:\n\n```java\npackage dev.jorday.app;\n\npublic final class PriceCalculator {\n    private PriceCalculator() {}\n\n    public static int applyDiscount(int priceCents, int percent) {\n        if (priceCents < 0) {\n            throw new IllegalArgumentException(\"price must not be negative\");\n        }\n        if (percent < 0 || percent > 100) {\n            throw new IllegalArgumentException(\"percent must be 0-100\");\n        }\n        return priceCents - priceCents * percent / 100;\n    }\n}\n```\n\nNow its tests, in `src/test/java/dev/jorday/app/PriceCalculatorTest.java`:\n\n```java\npackage dev.jorday.app;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\nimport static org.junit.jupiter.api.Assertions.assertThrows;\n\nimport org.junit.jupiter.api.DisplayName;\nimport org.junit.jupiter.api.Test;\nimport org.junit.jupiter.params.ParameterizedTest;\nimport org.junit.jupiter.params.provider.CsvSource;\n\nclass PriceCalculatorTest {\n\n    @Test\n    @DisplayName(\"0 percent leaves the price unchanged\")\n    void noDiscount() {\n        assertEquals(10_000, PriceCalculator.applyDiscount(10_000, 0));\n    }\n\n    @Test\n    void freeAtHundredPercent() {\n        assertEquals(0, PriceCalculator.applyDiscount(10_000, 100));\n    }\n\n    @Test\n    void rejectsPercentAbove100() {\n        IllegalArgumentException ex = assertThrows(\n            IllegalArgumentException.class,\n            () -> PriceCalculator.applyDiscount(1_000, 101));\n        assertEquals(\"percent must be 0-100\", ex.getMessage());\n    }\n\n    @Test\n    void rejectsNegativePrice() {\n        assertThrows(IllegalArgumentException.class,\n            () -> PriceCalculator.applyDiscount(-1, 10));\n    }\n\n    @ParameterizedTest(name = \"{0} cents at {1}% -> {2}\")\n    @CsvSource({\n        \"10000, 25, 7500\",\n        \"10000, 0, 10000\",\n        \"999, 10, 900\"\n    })\n    void appliesPercentage(int price, int percent, int expected) {\n        assertEquals(expected, PriceCalculator.applyDiscount(price, percent));\n    }\n}\n```\n\nRun with `mvn test` (or `./gradlew test`). The summary for this class looks like:\n\nOutput:\n```text\n[INFO] Tests run: 7, Failures: 0, Errors: 0, Skipped: 0\n[INFO] BUILD SUCCESS\n```\n\nThat is 4 normal tests plus 3 invocations of the parameterized test. Note the argument order of `assertEquals`: **expected first, actual second**. Reversing them still passes or fails correctly but makes the failure message misleading. `assertThrows` runs a lambda and fails the test unless that exception type is thrown, and returns the exception so you can check its message.\n\n**Lifecycle annotations.** JUnit creates a *new instance of the test class for every test*, so tests cannot leak state into each other through fields. `@BeforeEach` runs before every test (fresh setup), `@AfterEach` after every test (cleanup), and `@BeforeAll`/`@AfterAll` run once per class (they must be `static`). `@Disabled` skips a test, and `@Nested` groups related tests in an inner class.\n\n**Test the behavior, not the implementation.** A test that asserts which private method got called breaks every time you refactor. A test that asserts \"given this input, you get this output\" survives refactoring. Aim tests at the public surface.\n\n**Make code testable by injecting dependencies.** If a method calls `LocalTime.now()` directly, the test result depends on when you run it. Instead, take a `java.time.Clock` in the constructor. In production pass `Clock.systemDefaultZone()`; in tests pass a fixed clock. This is dependency injection (Module 5), and it is the single most useful testing technique.\n\n```java\npackage dev.jorday.app;\n\nimport java.time.Clock;\nimport java.time.LocalTime;\n\npublic class GreetingService {\n    private final Clock clock;\n\n    public GreetingService(Clock clock) {\n        this.clock = clock;\n    }\n\n    public String greet(String name) {\n        int hour = LocalTime.now(clock).getHour();\n        String part = hour < 12 ? \"morning\" : hour < 18 ? \"afternoon\" : \"evening\";\n        return \"Good \" + part + \", \" + name;\n    }\n}\n```\n\n```java\npackage dev.jorday.app;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\nimport java.time.Clock;\nimport java.time.Instant;\nimport java.time.ZoneOffset;\nimport org.junit.jupiter.api.Test;\n\nclass GreetingServiceTest {\n\n    private static GreetingService at(String isoInstant) {\n        Clock fixed = Clock.fixed(Instant.parse(isoInstant), ZoneOffset.UTC);\n        return new GreetingService(fixed);\n    }\n\n    @Test\n    void greetsInTheMorning() {\n        assertEquals(\"Good morning, Ana\", at(\"2026-01-01T09:00:00Z\").greet(\"Ana\"));\n    }\n\n    @Test\n    void greetsInTheEvening() {\n        assertEquals(\"Good evening, Ana\", at(\"2026-01-01T20:00:00Z\").greet(\"Ana\"));\n    }\n}\n```\n\nOutput:\n```text\n[INFO] Tests run: 9, Failures: 0, Errors: 0, Skipped: 0\n[INFO] BUILD SUCCESS\n```\n\n(7 + 2 tests across both classes.) The tests are deterministic: they pass at 3 a.m. and at 3 p.m., because the \"current time\" is under the test's control.\n\n**Fakes and mocks.** To test a class that depends on something slow or external (a database, an email service), pass in a hand-written *fake* (a simple in-memory implementation of the same interface, like `FakeSender` in Module 5). Mocking libraries such as Mockito automate this by generating fakes and letting you verify calls. Start with hand-written fakes; reach for a mocking library when the hand-written ones become tedious.\n\n**Test-driven development (TDD)** is a habit worth trying: write a failing test first, make it pass with the simplest code, then clean up. Even if you do not use it all the time, it teaches you to think about the interface before the implementation.\n\n**Other useful tools.** `assertAll(...)` runs several assertions and reports every failure instead of stopping at the first. AssertJ gives fluent assertions (`assertThat(list).containsExactly(\"a\", \"b\")`) with excellent failure messages. JaCoCo measures test coverage; treat coverage as a smoke alarm for untested code, not as a goal in itself.\n\n### Common mistakes\n- Tests that depend on each other or on execution order. Each test must pass alone.\n- Tests that depend on the real clock, random numbers, the network or the file system's current state. Inject those.\n- Testing getters and setters, or asserting on implementation details, so every refactor breaks tests.\n- One giant test with ten assertions on different behaviors. When it fails you do not know why.\n- Swapping `expected` and `actual` in `assertEquals`.\n- Catching an exception inside the test and forgetting to fail if it does *not* happen. Use `assertThrows` instead.\n- Putting `public static void main` in tests or printing to check output. Assert instead; the machine should decide pass or fail.\n- Chasing 100% coverage with tests that assert nothing.\n\n### Practice\n1. Write `static boolean isPalindrome(String s)` (ignore case) and test it with at least four cases, including the empty string.\n2. Rewrite your palindrome tests as one `@ParameterizedTest` using `@ValueSource`.\n3. Write a small `IntStack` class (push, pop, isEmpty). Test it with a `@BeforeEach` that creates a fresh stack, and use `assertThrows` for `pop()` on an empty stack.\n\n<details><summary>Solutions<\/summary>\n\n```java\n// src/main/java/dev/jorday/app/Palindromes.java\npackage dev.jorday.app;\n\npublic final class Palindromes {\n    private Palindromes() {}\n\n    public static boolean isPalindrome(String s) {\n        String t = s.toLowerCase();\n        int i = 0;\n        int j = t.length() - 1;\n        while (i < j) {\n            if (t.charAt(i++) != t.charAt(j--)) {\n                return false;\n            }\n        }\n        return true;\n    }\n}\n\n// src/test/java/dev/jorday/app/PalindromesTest.java\npackage dev.jorday.app;\n\nimport static org.junit.jupiter.api.Assertions.assertFalse;\nimport static org.junit.jupiter.api.Assertions.assertTrue;\n\nimport org.junit.jupiter.api.Test;\nimport org.junit.jupiter.params.ParameterizedTest;\nimport org.junit.jupiter.params.provider.ValueSource;\n\nclass PalindromesTest {\n\n    @Test\n    void emptyStringIsPalindrome() {\n        assertTrue(Palindromes.isPalindrome(\"\"));\n    }\n\n    @Test\n    void nonPalindromeIsRejected() {\n        assertFalse(Palindromes.isPalindrome(\"java\"));\n    }\n\n    @ParameterizedTest\n    @ValueSource(strings = {\"a\", \"level\", \"Racecar\", \"noon\"})\n    void detectsPalindromes(String input) {\n        assertTrue(Palindromes.isPalindrome(input));\n    }\n}\n\n// src/main/java/dev/jorday/app/IntStack.java\npackage dev.jorday.app;\n\nimport java.util.ArrayDeque;\nimport java.util.Deque;\nimport java.util.NoSuchElementException;\n\npublic class IntStack {\n    private final Deque<Integer> items = new ArrayDeque<>();\n\n    public void push(int value) { items.push(value); }\n\n    public int pop() {\n        if (items.isEmpty()) {\n            throw new NoSuchElementException(\"stack is empty\");\n        }\n        return items.pop();\n    }\n\n    public boolean isEmpty() { return items.isEmpty(); }\n}\n\n// src/test/java/dev/jorday/app/IntStackTest.java\npackage dev.jorday.app;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\nimport static org.junit.jupiter.api.Assertions.assertThrows;\nimport static org.junit.jupiter.api.Assertions.assertTrue;\n\nimport java.util.NoSuchElementException;\nimport org.junit.jupiter.api.BeforeEach;\nimport org.junit.jupiter.api.Test;\n\nclass IntStackTest {\n    private IntStack stack;\n\n    @BeforeEach\n    void setUp() {\n        stack = new IntStack();\n    }\n\n    @Test\n    void popReturnsLastPushed() {\n        stack.push(1);\n        stack.push(2);\n        assertEquals(2, stack.pop());\n        assertEquals(1, stack.pop());\n        assertTrue(stack.isEmpty());\n    }\n\n    @Test\n    void popOnEmptyStackThrows() {\n        assertThrows(NoSuchElementException.class, () -> stack.pop());\n    }\n}\n```\n\n<\/details>\n\n## Module 3: Concurrency\n**Goal:** Run work in parallel safely using threads, executors, `CompletableFuture` and virtual threads, and avoid the classic data-race bugs.\n\nModern programs wait a lot (for networks and disks) and have multiple CPU cores to use. **Concurrency** is structuring a program so many things make progress at once. It is also where the hardest bugs live, because they depend on timing and may appear once in a thousand runs. The goal of this module is to use a small set of safe tools instead of inventing your own.\n\n**Threads and the problem of shared state.** A `Thread` runs code independently. `start()` begins it, `join()` waits for it to finish. The danger is **shared mutable state**. Consider two threads each doing `count++` 100,000 times:\n\n```java\npublic class Main {\n    private static int count = 0;\n\n    public static void main(String[] args) throws InterruptedException {\n        Runnable work = () -> {\n            for (int i = 0; i < 100_000; i++) {\n                count++;\n            }\n        };\n        Thread t1 = new Thread(work);\n        Thread t2 = new Thread(work);\n        t1.start();\n        t2.start();\n        t1.join();\n        t2.join();\n        System.out.println(count);\n    }\n}\n```\n\nOutput:\n```text\n(varies on every run, usually less than 200000, for example 143822)\n```\n\n`count++` is really three steps (read, add, write). Two threads can read the same old value and both write back the same new one, losing an update. This is a **race condition**. There are three standard fixes: make the operation atomic (`AtomicInteger`), make the code block mutually exclusive (`synchronized` or a `ReentrantLock`), or avoid sharing mutable data altogether (best, when you can). Also remember the **visibility** problem: without synchronization, one thread may never see another's writes. `synchronized`, `volatile`, atomics and `join()` all establish the ordering guarantees that make writes visible.\n\n```java\nimport java.util.concurrent.atomic.AtomicInteger;\n\npublic class Main {\n    private static int syncCount = 0;\n    private static final Object LOCK = new Object();\n\n    public static void main(String[] args) throws InterruptedException {\n        AtomicInteger atomic = new AtomicInteger();\n        Runnable work = () -> {\n            for (int i = 0; i < 100_000; i++) {\n                atomic.incrementAndGet();\n                synchronized (LOCK) {\n                    syncCount++;\n                }\n            }\n        };\n        Thread t1 = new Thread(work, \"worker-1\");\n        Thread t2 = new Thread(work, \"worker-2\");\n        t1.start();\n        t2.start();\n        t1.join();\n        t2.join();\n        System.out.println(\"atomic = \" + atomic.get());\n        System.out.println(\"synchronized = \" + syncCount);\n    }\n}\n```\n\nOutput:\n```text\natomic = 200000\nsynchronized = 200000\n```\n\nBoth are correct. For shared collections, use the concurrent versions (`ConcurrentHashMap`, `CopyOnWriteArrayList`, `LinkedBlockingQueue`) instead of wrapping normal ones in your own locks.\n\n**ExecutorService: stop managing threads by hand.** Creating a thread per task is wasteful and hard to control. An `ExecutorService` owns a pool of worker threads; you submit tasks and get back a `Future`, a handle to a result that may not exist yet. `future.get()` blocks until the result is ready (and rethrows task failures wrapped in `ExecutionException`). Since Java 19, `ExecutorService` is `AutoCloseable`, so try-with-resources waits for submitted tasks to finish and shuts the pool down; before that you had to call `shutdown()` and `awaitTermination()` by hand.\n\n```java\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.Future;\n\npublic class Main {\n    static long slowSquare(int n) throws InterruptedException {\n        Thread.sleep(100);\n        return (long) n * n;\n    }\n\n    public static void main(String[] args) throws Exception {\n        try (ExecutorService pool = Executors.newFixedThreadPool(4)) {\n            List<Future<Long>> futures = new ArrayList<>();\n            for (int i = 1; i <= 5; i++) {\n                final int n = i;\n                futures.add(pool.submit(() -> slowSquare(n)));\n            }\n            long sum = 0;\n            for (Future<Long> f : futures) {\n                sum += f.get();\n            }\n            System.out.println(\"sum of squares = \" + sum);\n        }\n    }\n}\n```\n\nOutput:\n```text\nsum of squares = 55\n```\n\nAll five tasks are submitted before the first `get()`, so they run in parallel across the 4 threads. If you submitted and immediately called `get()` in the same loop, you would run them one at a time. **Sizing pools:** for CPU-bound work, about one thread per core (`Runtime.getRuntime().availableProcessors()`); for work that mostly waits (network, disk), use virtual threads (below) rather than a huge pool.\n\n**CompletableFuture: compose async steps.** A `CompletableFuture` is a future you can chain, like a stream for asynchronous results: `thenApply` transforms the result, `thenCompose` chains another async step, `thenCombine` joins two independent results, and `exceptionally` or `handle` recovers from failure. `join()` waits for the result (like `get()` but with an unchecked exception). By default `supplyAsync` runs on the shared `ForkJoinPool.commonPool()`; for blocking work, pass your own executor as the second argument.\n\n```java\nimport java.util.concurrent.CompletableFuture;\n\npublic class Main {\n    static String fetchUser(int id) {\n        sleep(100);\n        return \"user\" + id;\n    }\n\n    static int fetchScore(String user) {\n        sleep(100);\n        return user.length() * 10;\n    }\n\n    static String unreliable() {\n        throw new IllegalStateException(\"service down\");\n    }\n\n    static void sleep(long ms) {\n        try {\n            Thread.sleep(ms);\n        } catch (InterruptedException e) {\n            Thread.currentThread().interrupt();\n            throw new RuntimeException(e);\n        }\n    }\n\n    public static void main(String[] args) {\n        CompletableFuture<String> summary = CompletableFuture\n            .supplyAsync(() -> fetchUser(7))\n            .thenApply(user -> user + \" has score \" + fetchScore(user));\n        System.out.println(summary.join());\n\n        CompletableFuture<Integer> a = CompletableFuture.supplyAsync(() -> 20);\n        CompletableFuture<Integer> b = CompletableFuture.supplyAsync(() -> 22);\n        System.out.println(a.thenCombine(b, Integer::sum).join());\n\n        CompletableFuture<String> safe = CompletableFuture\n            .supplyAsync(Main::unreliable)\n            .exceptionally(ex -> {\n                Throwable root = ex.getCause() != null ? ex.getCause() : ex;\n                return \"fallback (\" + root.getMessage() + \")\";\n            });\n        System.out.println(safe.join());\n    }\n}\n```\n\nOutput:\n```text\nuser7 has score 50\n42\nfallback (service down)\n```\n\nAn exception thrown inside an async step arrives wrapped in a `CompletionException`, so we unwrap it with `getCause()`. Without `exceptionally` or `handle`, a failed future fails silently until someone calls `join()`.\n\n**Virtual threads (final since Java 21).** A traditional (\"platform\") thread is an expensive operating-system thread, so you can have maybe thousands. A **virtual thread** is a lightweight thread managed by the JVM; you can have millions. When a virtual thread blocks (sleeping, reading a socket), the JVM parks it and reuses the underlying OS thread for other work. The payoff: you can write plain, simple, blocking code, one thread per task, and still scale to huge numbers of concurrent waits. This is ideal for servers handling many I/O-bound requests.\n\n```java\nimport java.time.Duration;\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.atomic.AtomicInteger;\nimport java.util.stream.IntStream;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        AtomicInteger done = new AtomicInteger();\n\n        try (ExecutorService exec = Executors.newVirtualThreadPerTaskExecutor()) {\n            IntStream.range(0, 10_000).forEach(i -> exec.submit(() -> {\n                Thread.sleep(Duration.ofMillis(100));\n                done.incrementAndGet();\n                return i;\n            }));\n        }\n        System.out.println(\"completed: \" + done.get());\n\n        Thread vt = Thread.ofVirtual().name(\"my-virtual\").start(() ->\n            System.out.println(\"virtual? \" + Thread.currentThread().isVirtual()));\n        vt.join();\n    }\n}\n```\n\nOutput:\n```text\ncompleted: 10000\nvirtual? true\n```\n\nTen thousand tasks each sleeping 100 ms finish in roughly a second, not in 1,000 seconds, because they all wait at once. With 10,000 platform threads this would be slow and memory-hungry.\n\nRules for virtual threads: **never pool them** (create one per task; they are cheap by design); they help I/O-bound work and do nothing for CPU-bound work (you still only have as many cores as you have); and be careful with `ThreadLocal` and long `synchronized` blocks around blocking calls. In Java 21 a virtual thread blocking inside `synchronized` pinned its carrier thread; that limitation was removed in Java 24 (JEP 491), so on Java 25 `synchronized` is no longer a scalability trap, though a `ReentrantLock` is still a fine choice.\n\n**What is newer.** `ScopedValue` (JEP 506) is final in Java 25: an immutable way to share data with the code a method calls, designed to replace `ThreadLocal` with virtual threads. *Structured concurrency* (treating a group of subtasks as one unit that succeeds or fails together) is still a preview API in Java 25 (JEP 505, fifth preview), so it needs `--enable-preview` and its API may still change; know the idea, but do not build production code on it yet.\n\n**Choosing the tool.** Independent blocking I/O tasks: virtual threads with `newVirtualThreadPerTaskExecutor`. CPU-bound parallel work: a fixed pool sized to the cores. A chain of async steps with combination and error handling: `CompletableFuture`. A counter or flag: an atomic. A shared map: `ConcurrentHashMap`. And whenever possible, share nothing.\n\n### Common mistakes\n- Sharing a plain `HashMap`, `ArrayList` or counter between threads. Use a concurrent collection, an atomic, or a lock.\n- Calling `future.get()` right after each `submit` in the same loop, which makes the work sequential. Submit everything first, then collect.\n- Running a stream like `tasks.stream().map(this::submit).map(CompletableFuture::join)`. Streams are lazy and process element by element, so each task is submitted and joined before the next starts. Collect the futures into a list first.\n- Forgetting to shut down an `ExecutorService`, so the program never exits. Use try-with-resources.\n- Swallowing `InterruptedException`. Either rethrow it or call `Thread.currentThread().interrupt()` to restore the flag.\n- Pooling virtual threads, or using a huge platform-thread pool where virtual threads fit.\n- Holding a lock while doing slow I/O, and locking in inconsistent orders (deadlock).\n- Using `parallelStream()` for blocking or tiny tasks. It uses the shared common pool and can starve other work.\n- Assuming a test that passed once is thread-safe. Concurrency bugs are statistical; review the design, do not just run it.\n\n### Practice\n1. Create a fixed pool of 3 threads and a `List<Callable<String>>` of three tasks. Use `invokeAll` to run them and print each result.\n2. Start three `CompletableFuture<Integer>` values (1, 2, 3), wait for all of them with `CompletableFuture.allOf`, and print their sum.\n3. Use four virtual threads to count word occurrences in four separate strings into one shared `ConcurrentHashMap<String, Integer>` using `merge`. Print the sorted result.\n\n<details><summary>Solutions<\/summary>\n\n```java\nimport java.util.List;\nimport java.util.Map;\nimport java.util.TreeMap;\nimport java.util.concurrent.Callable;\nimport java.util.concurrent.CompletableFuture;\nimport java.util.concurrent.ConcurrentHashMap;\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.Future;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        // Exercise 1\n        try (ExecutorService pool = Executors.newFixedThreadPool(3)) {\n            List<Callable<String>> jobs = List.of(() -> \"a\", () -> \"b\", () -> \"c\");\n            for (Future<String> f : pool.invokeAll(jobs)) {\n                System.out.println(f.get());\n            }\n        }\n\n        // Exercise 2\n        CompletableFuture<Integer> one = CompletableFuture.supplyAsync(() -> 1);\n        CompletableFuture<Integer> two = CompletableFuture.supplyAsync(() -> 2);\n        CompletableFuture<Integer> three = CompletableFuture.supplyAsync(() -> 3);\n        CompletableFuture.allOf(one, two, three).join();\n        System.out.println(one.join() + two.join() + three.join());\n\n        // Exercise 3\n        Map<String, Integer> counts = new ConcurrentHashMap<>();\n        List<String> texts = List.of(\"a b a\", \"b c\", \"a c c\", \"b b\");\n        try (ExecutorService exec = Executors.newVirtualThreadPerTaskExecutor()) {\n            for (String text : texts) {\n                exec.submit(() -> {\n                    for (String w : text.split(\" \")) {\n                        counts.merge(w, 1, Integer::sum);\n                    }\n                });\n            }\n        }\n        System.out.println(new TreeMap<>(counts));\n    }\n}\n// Output:\n// a\n// b\n// c\n// 6\n// {a=3, b=4, c=3}\n```\n\n<\/details>\n\n## Module 4: JVM Internals and Performance\n**Goal:** Understand how the JVM uses memory, collects garbage and optimizes code, and learn the basic tools for measuring a Java program before you try to speed it up.\n\nYou write Java; the JVM runs it. Knowing what the JVM does for you explains most \"why is my program slow or running out of memory?\" questions. The golden rule of performance work comes first: **measure, do not guess.** Most code is fast enough, and programmers are famously bad at predicting where the time goes.\n\n**Memory areas.**\n- **Heap:** where all objects live. Shared by all threads and managed by the garbage collector. Sized with `-Xms` (initial) and `-Xmx` (maximum). When it fills with live objects you get `OutOfMemoryError: Java heap space`.\n- **Stack:** one per thread. Holds method calls: each call adds a *frame* with its local variables and parameters (primitives, and references to objects on the heap). Frames disappear when the method returns. Infinite recursion fills it and throws `StackOverflowError`.\n- **Metaspace:** class definitions and method metadata, in native (non-heap) memory.\n\nAn object is *garbage* when no live reference can reach it. This is why a \"memory leak\" in Java does not mean forgotten `free()` calls; it means you are still holding a reference you no longer need (a static map that only grows, a listener never removed).\n\n```java\npublic class Main {\n    static int depth = 0;\n\n    static void recurse() {\n        depth++;\n        recurse();\n    }\n\n    public static void main(String[] args) {\n        try {\n            recurse();\n        } catch (StackOverflowError e) {\n            System.out.println(\"caught \" + e.getClass().getSimpleName() + \", depth > 1000: \" + (depth > 1000));\n        }\n\n        try {\n            long[] tooBig = new long[Integer.MAX_VALUE];\n            System.out.println(tooBig.length);\n        } catch (OutOfMemoryError e) {\n            System.out.println(\"caught \" + e.getClass().getSimpleName());\n        }\n    }\n}\n```\n\nOutput:\n```text\ncaught StackOverflowError, depth > 1000: true\ncaught OutOfMemoryError\n```\n\n(The exact depth depends on the machine and stack size, so we only print whether it passed 1000. In real programs you do not catch these `Error`s; this is only to show what they are.)\n\n**Garbage collection.** The collector finds unreachable objects and reclaims their memory. Most collectors use the **generational hypothesis**: most objects die young. New objects go in a *young generation* that is cleaned often and cheaply; survivors are promoted to the *old generation*, cleaned less often. The collectors you should know:\n\n| Collector | Flag | Use it for |\n|---|---|---|\n| **G1** | default (`-XX:+UseG1GC`) | Good general-purpose balance of throughput and pause time |\n| **Parallel** | `-XX:+UseParallelGC` | Batch jobs where total throughput matters more than pauses |\n| **ZGC** | `-XX:+UseZGC` | Very low pauses on large heaps; generational by default since Java 23 |\n| **Shenandoah** | `-XX:+UseShenandoahGC` | Low pauses; generational mode is a product feature in Java 25 (JEP 521) |\n| **Serial** | `-XX:+UseSerialGC` | Tiny containers and single-core machines |\n\nYou rarely need to tune. Start with the default, set a sensible `-Xmx`, and only change collectors when measurements show a problem (for example pause times that hurt latency). Turning on GC logging costs almost nothing and tells you what is happening:\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        byte[][] keep = new byte[1000][];\n        long checksum = 0;\n        for (int i = 0; i < 5_000_000; i++) {\n            int slot = i % keep.length;\n            keep[slot] = new byte[1024];\n            keep[slot][0] = (byte) i;\n            checksum += keep[slot][0];\n        }\n        System.out.println(\"checksum = \" + checksum);\n    }\n}\n```\n\nRun it with GC logging and a small heap:\n\n```bash\njava -Xmx64m -Xlog:gc Main.java\n```\n\nOutput:\n```text\n(a stream of GC log lines first, shaped like the following; times and sizes differ per machine)\n[<time>s][info][gc] Using G1\n[<time>s][info][gc] GC(<n>) Pause Young (Normal) (G1 Evacuation Pause) <before>M-><after>M(<heap>M) <ms>ms\n...\nchecksum = -2497952\n```\n\nAbout 5 GB of short-lived arrays pass through a 64 MB heap. The young collections are frequent and cheap, because almost everything dies immediately. The program's own output is deterministic: `checksum = -2497952`. We store each array in `keep` on purpose. If the array never escaped the loop, the JIT compiler could remove the allocation entirely (*escape analysis*) and you would see far fewer collections. Try the same command with `-XX:+UseSerialGC` and `-XX:+UseParallelGC` and compare the logs.\n\n**The JIT compiler.** The JVM starts by *interpreting* bytecode, which is slow to run but fast to start. It counts how often each method runs. Hot methods are compiled to machine code, first by the quick C1 compiler and then, if they stay hot, by the aggressive C2 compiler, which uses what it observed at runtime to inline methods, remove unneeded checks and keep objects off the heap when they do not escape. This is called *tiered compilation*. Two consequences matter for you:\n\n1. **Warm-up is real.** A Java program is slowest in its first moments and speeds up as the JIT learns. Short scripts never reach full speed; servers run for days and do.\n2. **Naive benchmarks lie.** A loop timed once with `System.nanoTime()` measures interpreter and compiler time as much as your code, and the JIT may delete code whose result is never used. For real microbenchmarks use **JMH** (the Java Microbenchmark Harness), which handles warm-up and prevents dead-code elimination.\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        int n = 20_000;\n\n        long t0 = System.nanoTime();\n        String s = \"\";\n        for (int i = 0; i < n; i++) {\n            s += \"x\";\n        }\n        long t1 = System.nanoTime();\n\n        StringBuilder sb = new StringBuilder();\n        for (int i = 0; i < n; i++) {\n            sb.append(\"x\");\n        }\n        long t2 = System.nanoTime();\n\n        System.out.println(\"same result: \" + s.equals(sb.toString()));\n        System.out.println(\"length: \" + s.length());\n        System.out.println(\"concat ms: \" + (t1 - t0) / 1_000_000);\n        System.out.println(\"builder ms: \" + (t2 - t1) / 1_000_000);\n    }\n}\n```\n\nOutput:\n```text\nsame result: true\nlength: 20000\nconcat ms: (varies by machine; the larger of the two)\nbuilder ms: (varies by machine; very small)\n```\n\nStrings are immutable, so each `s += \"x\"` copies the whole string: the loop does work proportional to n squared. `StringBuilder` grows one buffer and does work proportional to n. The two lines marked \"varies\" will differ on every machine, but the pattern holds, and it is an *algorithmic* difference, which the JIT cannot fix. That is the best kind of performance fix: choose the right data structure and algorithm before worrying about the JVM.\n\n**Profiling tools (all ship with the JDK).**\n- `jcmd <pid> GC.heap_info` and `jcmd <pid> Thread.print`: ask a running JVM about its heap and threads. `jps` lists Java processes.\n- **Java Flight Recorder (JFR):** a low-overhead profiler built into the JVM. Start with `java -XX:StartFlightRecording=filename=rec.jfr -jar app.jar` and open the file in JDK Mission Control or IntelliJ. It shows hot methods, allocations, GC pauses and lock contention. Java 25 adds CPU-time profiling (experimental, Linux only) and method timing and tracing (JEP 509 and JEP 520).\n- **Heap dumps:** `jcmd <pid> GC.heap_dump file.hprof`, then open in Eclipse MAT or VisualVM to find which objects fill the heap and what holds them.\n- `jstack <pid>`: shows what every thread is doing, which is the first thing to run on a hung program.\n\n**A sensible performance workflow.** (1) Decide what \"fast enough\" means in numbers. (2) Measure the real program with a profiler. (3) Fix the biggest cost, usually an algorithm, an N+1 query or unnecessary allocation, not a JVM flag. (4) Measure again. Two newer JVM features are worth knowing by name: *compact object headers* (JEP 519, a product feature in Java 25, enabled with `-XX:+UseCompactObjectHeaders`, shrinks every object and can cut heap use) and the ahead-of-time cache work (JEP 483 in Java 24, with further ergonomics in 25) that speeds up JVM startup.\n\n### Common mistakes\n- Tuning GC flags before measuring. A bad algorithm will not be fixed by `-XX:+UseZGC`.\n- Setting `-Xmx` larger than the machine's or container's real memory. The OS kills the process instead of the JVM throwing a clean error.\n- Timing code once with `System.nanoTime()` and trusting it. Use JMH, which handles warm-up and dead-code elimination.\n- Building strings with `+=` in a loop.\n- \"Memory leaks\" from static collections, caches without a size limit, or listeners that are never removed. The garbage collector cannot free what you still reference.\n- Calling `System.gc()` \"to free memory\". It is only a hint and usually hurts.\n- Creating huge numbers of tiny temporary objects in a hot loop without measuring; sometimes the JIT removes them, sometimes it cannot.\n- Blaming Java for slow startup in a tiny script. The JVM is optimized for long-running programs.\n\n### Practice\n1. Run the GC demo with `-Xmx64m -Xlog:gc` under `-XX:+UseSerialGC`, `-XX:+UseParallelGC` and the default. Write down how the log lines differ.\n2. Start a Java program that sleeps for a minute (`Thread.sleep(60_000)`), find its process id with `jps`, and run `jcmd <pid> GC.heap_info` and `jstack <pid>`.\n3. This cache grows forever. Fix it so it keeps at most 100 entries and discards the least recently used one: `static final Map<String, String> CACHE = new HashMap<>();`\n\n<details><summary>Solutions<\/summary>\n\n```java\n// Solutions 1 and 2 are commands:\n//   java -Xmx64m -Xlog:gc -XX:+UseSerialGC Main.java\n//   java -Xmx64m -Xlog:gc -XX:+UseParallelGC Main.java\n//   java -Xmx64m -Xlog:gc Main.java\n// Look at the first log line (which collector is used) and the \"Pause Young\" lines\n// (the collector's name appears in parentheses and the pause times differ).\n//\n//   jps                          (prints \"<pid> Main\")\n//   jcmd <pid> GC.heap_info\n//   jstack <pid>\n\n// Solution 3: a bounded, least-recently-used cache\nimport java.util.LinkedHashMap;\nimport java.util.Map;\n\npublic class Main {\n    static class LruCache<K, V> extends LinkedHashMap<K, V> {\n        private final int maxEntries;\n\n        LruCache(int maxEntries) {\n            super(16, 0.75f, true);\n            this.maxEntries = maxEntries;\n        }\n\n        @Override\n        protected boolean removeEldestEntry(Map.Entry<K, V> eldest) {\n            return size() > maxEntries;\n        }\n    }\n\n    public static void main(String[] args) {\n        LruCache<String, String> cache = new LruCache<>(2);\n        cache.put(\"a\", \"1\");\n        cache.put(\"b\", \"2\");\n        cache.get(\"a\");\n        cache.put(\"c\", \"3\");\n        System.out.println(cache.keySet());\n    }\n}\n// Output:\n// [a, c]\n// (The third constructor argument 'true' means access order, so reading \"a\"\n//  makes \"b\" the least recently used entry, and it is removed when \"c\" arrives.)\n```\n\n<\/details>\n\n## Module 5: Design Patterns and SOLID\n**Goal:** Recognize and use the handful of design patterns that matter in everyday Java (builder, factory, strategy, dependency injection) and apply the SOLID principles to keep code easy to change.\n\nA design pattern is a named solution to a problem that keeps coming up. The value is mostly *vocabulary*: saying \"use a strategy here\" tells a teammate the whole shape of the code in three words. The warning is equally important: patterns are answers to specific problems, not goals. Adding a pattern where there is no problem just makes code harder to read. Modern Java (lambdas, records, sealed types) also makes several classic patterns much smaller than the old textbook versions.\n\n**Builder: build complex objects step by step.** When a class has many optional settings, a constructor with eight parameters is unreadable and easy to get wrong (which `int` is the timeout?). A builder gives each setting a name, validates once at the end, and produces an immutable object.\n\n```java\nimport java.util.Collections;\nimport java.util.Map;\nimport java.util.TreeMap;\n\npublic class Main {\n    public static void main(String[] args) {\n        Request request = new Request.Builder(\"https://example.com/api\")\n            .method(\"POST\")\n            .header(\"Accept\", \"json\")\n            .timeoutSeconds(5)\n            .build();\n        System.out.println(request);\n\n        try {\n            new Request.Builder(\" \").build();\n        } catch (IllegalStateException e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}\n\nfinal class Request {\n    private final String url;\n    private final String method;\n    private final Map<String, String> headers;\n    private final int timeoutSeconds;\n\n    private Request(Builder b) {\n        this.url = b.url;\n        this.method = b.method;\n        this.headers = Collections.unmodifiableMap(new TreeMap<>(b.headers));\n        this.timeoutSeconds = b.timeoutSeconds;\n    }\n\n    @Override\n    public String toString() {\n        return method + \" \" + url + \" headers=\" + headers + \" timeout=\" + timeoutSeconds + \"s\";\n    }\n\n    static final class Builder {\n        private final String url;\n        private String method = \"GET\";\n        private final Map<String, String> headers = new TreeMap<>();\n        private int timeoutSeconds = 30;\n\n        Builder(String url) { this.url = url; }\n\n        Builder method(String method) {\n            this.method = method;\n            return this;\n        }\n\n        Builder header(String name, String value) {\n            headers.put(name, value);\n            return this;\n        }\n\n        Builder timeoutSeconds(int seconds) {\n            this.timeoutSeconds = seconds;\n            return this;\n        }\n\n        Request build() {\n            if (url == null || url.isBlank()) {\n                throw new IllegalStateException(\"url is required\");\n            }\n            return new Request(this);\n        }\n    }\n}\n```\n\nOutput:\n```text\nPOST https://example.com/api headers={Accept=json} timeout=5s\nurl is required\n```\n\nRequired values go in the builder's constructor; optional ones have defaults and chainable setters. The `Request` constructor is private, so the only way to get one is through `build()`, and it is always valid. (For a small number of fields, a record is simpler, and you can add a static factory with defaults. Reach for a builder when there are many optional fields.)\n\n**Factory and Strategy.** A **factory** is a method that creates objects so callers do not need to know which concrete class they get. A **strategy** is an interface (or just a lambda) that represents a swappable algorithm, so the calling code does not change when the algorithm does. They fit together naturally: the factory chooses a strategy. Strategy is also the cure for long `if / else if` chains that keep growing every time there is a new case; that is the **Open/Closed principle** below.\n\n```java\npublic class Main {\n    interface ShippingStrategy {\n        int cost(int weightKg);\n    }\n\n    static ShippingStrategy forSpeed(String speed) {\n        return switch (speed) {\n            case \"standard\" -> weight -> 500 + 100 * weight;\n            case \"express\" -> weight -> 1500 + 250 * weight;\n            default -> throw new IllegalArgumentException(\"Unknown speed: \" + speed);\n        };\n    }\n\n    static class Checkout {\n        private final ShippingStrategy shipping;\n\n        Checkout(ShippingStrategy shipping) { this.shipping = shipping; }\n\n        int total(int itemsCents, int weightKg) {\n            return itemsCents + shipping.cost(weightKg);\n        }\n    }\n\n    public static void main(String[] args) {\n        System.out.println(new Checkout(forSpeed(\"standard\")).total(2000, 2));\n        System.out.println(new Checkout(forSpeed(\"express\")).total(2000, 2));\n        try {\n            forSpeed(\"teleport\");\n        } catch (IllegalArgumentException e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\nOutput:\n```text\n2700\n4000\nUnknown speed: teleport\n```\n\n`Checkout` knows nothing about how shipping is priced. Adding \"overnight\" means adding one case to the factory; `Checkout` never changes. Because `ShippingStrategy` has one method, a lambda is the whole strategy.\n\n**Dependency injection: pass collaborators in, do not create them inside.** A class that does `new EmailSender()` inside itself is welded to that class and cannot be tested without sending real email. Instead, declare what you need in the constructor (as an interface) and let the caller supply it. The place where everything is wired together, usually `main`, is called the *composition root*. Frameworks such as Spring (Module 6) do this wiring for you, but the idea is just constructor parameters.\n\n```java\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    interface MessageSender {\n        void send(String to, String body);\n    }\n\n    static class EmailSender implements MessageSender {\n        @Override\n        public void send(String to, String body) {\n            System.out.println(\"EMAIL to \" + to + \": \" + body);\n        }\n    }\n\n    static class FakeSender implements MessageSender {\n        final List<String> sent = new ArrayList<>();\n\n        @Override\n        public void send(String to, String body) {\n            sent.add(to + \"|\" + body);\n        }\n    }\n\n    static class WelcomeService {\n        private final MessageSender sender;\n\n        WelcomeService(MessageSender sender) { this.sender = sender; }\n\n        void welcome(String user) {\n            sender.send(user, \"Welcome, \" + user + \"!\");\n        }\n    }\n\n    public static void main(String[] args) {\n        new WelcomeService(new EmailSender()).welcome(\"ana\");\n\n        FakeSender fake = new FakeSender();\n        new WelcomeService(fake).welcome(\"ben\");\n        System.out.println(fake.sent);\n    }\n}\n```\n\nOutput:\n```text\nEMAIL to ana: Welcome, ana!\n[ben|Welcome, ben!]\n```\n\nThe same `WelcomeService` runs against the real sender in production and against a recording fake in a test. Prefer **constructor injection** with `final` fields: the object is fully built and immutable the moment it exists.\n\n**SOLID: five guidelines for code that survives change.**\n- **S, Single Responsibility:** a class should have one reason to change. If `Invoice` calculates totals, prints PDFs and writes to the database, three different changes all edit the same file. Split it.\n- **O, Open/Closed:** you should be able to add behavior without editing working code. The strategy example above is this: new shipping options are new code, not edits to `Checkout`. A `switch` over a sealed type is a modern variation: the compiler tells you every place to update.\n- **L, Liskov Substitution:** anywhere a parent type is used, any subtype must work without surprising the caller. A `ReadOnlyList` that extends `List` but throws on `add` breaks callers. If a subclass has to weaken the parent's promises, it should not be a subclass.\n- **I, Interface Segregation:** many small, focused interfaces beat one giant one. A class should not be forced to implement methods it has no use for. `Comparable`, `Runnable` and `Closeable` are small by design.\n- **D, Dependency Inversion:** depend on abstractions, not concrete classes. High-level code (`WelcomeService`) owns the interface it needs (`MessageSender`); low-level details (`EmailSender`) plug into it. This is what dependency injection achieves.\n\nSOLID is a set of heuristics for judgment, not laws. Do not split a 20-line class into six interfaces \"for SRP\". Apply a principle when you feel the pain it prevents: a class that is hard to test (D), a growing `if` chain (O), a class that changes for unrelated reasons (S).\n\n**Patterns to treat with suspicion.** *Singleton* (one global instance) is mostly global mutable state in disguise: hard to test and hidden from the constructor. Prefer creating one instance in `main` and injecting it. *Visitor* is largely replaced by sealed interfaces and pattern-matching `switch`. *Inheritance-heavy* template methods can usually be replaced by passing a function.\n\n### Common mistakes\n- Applying a pattern because it is \"best practice\" when no problem exists. Three lines of plain code beat a three-class abstraction.\n- Writing a builder for a class with two fields.\n- Interfaces with exactly one implementation that will never have a second one, created \"just in case\". Add the interface when the second need appears (tests count as a real need).\n- Calling `new` on a collaborator inside a class that you want to test.\n- Using a Singleton with mutable state, which makes tests influence each other.\n- Treating SOLID as rules to enforce, instead of signals that code is getting hard to change.\n- Deep inheritance trees. If you cannot explain \"is-a\" in one sentence, use composition.\n\n### Practice\n1. Write a builder for a `Pizza` with a required `size` and optional `cheese` (default true), `toppings` (a list) and `crust` (default \"thin\"). Print one built pizza.\n2. Replace this chain with a strategy lookup using a `Map<String, IntUnaryOperator>`: `if (c.equals(\"US\")) return amount * 7 / 100; else if (c.equals(\"UK\")) return amount * 20 / 100; else if (c.equals(\"DE\")) return amount * 19 / 100;`\n3. This class is untestable: `class Report { String title() { return \"Report \" + java.time.LocalDate.now(); } }`. Refactor it to take a `java.time.Clock` through the constructor and call it with a fixed date.\n\n<details><summary>Solutions<\/summary>\n\n```java\nimport java.time.Clock;\nimport java.time.Instant;\nimport java.time.LocalDate;\nimport java.time.ZoneOffset;\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.function.IntUnaryOperator;\n\npublic class Main {\n    // Exercise 2\n    static final Map<String, IntUnaryOperator> TAX = Map.of(\n        \"US\", amount -> amount * 7 / 100,\n        \"UK\", amount -> amount * 20 / 100,\n        \"DE\", amount -> amount * 19 / 100);\n\n    static int tax(String country, int amount) {\n        IntUnaryOperator rule = TAX.get(country);\n        if (rule == null) {\n            throw new IllegalArgumentException(\"Unknown country: \" + country);\n        }\n        return rule.applyAsInt(amount);\n    }\n\n    public static void main(String[] args) {\n        // Exercise 1\n        Pizza pizza = new Pizza.Builder(\"large\").topping(\"olives\").topping(\"basil\").crust(\"thick\").build();\n        System.out.println(pizza);\n\n        // Exercise 2\n        System.out.println(tax(\"UK\", 1000));\n\n        // Exercise 3\n        Clock fixed = Clock.fixed(Instant.parse(\"2026-03-01T12:00:00Z\"), ZoneOffset.UTC);\n        System.out.println(new Report(fixed).title());\n    }\n}\n\n// Exercise 1\nfinal class Pizza {\n    private final String size;\n    private final boolean cheese;\n    private final List<String> toppings;\n    private final String crust;\n\n    private Pizza(Builder b) {\n        this.size = b.size;\n        this.cheese = b.cheese;\n        this.toppings = List.copyOf(b.toppings);\n        this.crust = b.crust;\n    }\n\n    @Override\n    public String toString() {\n        return size + \" pizza, \" + crust + \" crust, cheese=\" + cheese + \", toppings=\" + toppings;\n    }\n\n    static final class Builder {\n        private final String size;\n        private boolean cheese = true;\n        private final List<String> toppings = new ArrayList<>();\n        private String crust = \"thin\";\n\n        Builder(String size) { this.size = size; }\n\n        Builder cheese(boolean cheese) {\n            this.cheese = cheese;\n            return this;\n        }\n\n        Builder topping(String topping) {\n            toppings.add(topping);\n            return this;\n        }\n\n        Builder crust(String crust) {\n            this.crust = crust;\n            return this;\n        }\n\n        Pizza build() { return new Pizza(this); }\n    }\n}\n\n// Exercise 3\nclass Report {\n    private final Clock clock;\n\n    Report(Clock clock) { this.clock = clock; }\n\n    String title() { return \"Report \" + LocalDate.now(clock); }\n}\n// Output:\n// large pizza, thick crust, cheese=true, toppings=[olives, basil]\n// 200\n// Report 2026-03-01\n```\n\n<\/details>\n\n## Module 6: Building a REST API with Spring Boot\n**Goal:** Understand what Spring Boot does for you and build a small, tested REST service with a few endpoints.\n\n**Honest caveat first.** Unlike the earlier modules, this one needs a framework with a large dependency tree and a network connection to download it. The code here follows the current Spring Boot reference documentation (Spring Boot 4.1.x, which needs Java 17 or newer and supports up to Java 27, with Maven 3.6.3+ or Gradle 8.14+/9.x), but Spring changes between major versions, so treat the official docs and `start.spring.io` as the authority if something does not compile. Spring Boot 4 renamed several starters and test packages compared to the many Spring Boot 3 tutorials on the web; this module uses the Boot 4 names.\n\n**What Spring Boot is.** *Spring Framework* is a large library built around **inversion of control** (IoC): you write plain classes (\"beans\") that declare their dependencies in constructors, and Spring creates them, wires them together and manages their lifecycle. That is exactly the dependency injection from Module 5, automated. *Spring Boot* adds opinionated defaults on top: **starters** (one dependency that pulls in a consistent set of libraries), **auto-configuration** (it notices Tomcat is on the classpath and sets up a web server for you) and an embedded server so your app is just a `main` method that runs. A REST API is a set of HTTP endpoints that exchange JSON.\n\n**The key annotations.**\n- `@SpringBootApplication`: marks the entry point; turns on component scanning and auto-configuration for its package and below.\n- `@RestController`: a class whose methods handle HTTP requests and return data (converted to JSON) instead of web pages.\n- `@RequestMapping`, `@GetMapping`, `@PostMapping`, `@PutMapping`, `@DeleteMapping`: map URLs and HTTP methods to Java methods.\n- `@PathVariable`, `@RequestBody`: take part of the URL, or the JSON body, as a Java parameter.\n- `@Service`: marks a business-logic bean. `@Component` is the generic version.\n- `@ResponseStatus` and `ResponseStatusException`: control the HTTP status code (201 Created, 404 Not Found, and so on).\n\n**Project setup.** The easiest start is `start.spring.io`: choose Maven, Java 21, the current Spring Boot version and the \"Spring Web\" dependency, then download and unzip. The resulting `pom.xml` looks like this (use the version the site gives you; `4.1.2` was current when this was written):\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\n         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\">\n  <modelVersion>4.0.0<\/modelVersion>\n\n  <parent>\n    <groupId>org.springframework.boot<\/groupId>\n    <artifactId>spring-boot-starter-parent<\/artifactId>\n    <version>4.1.2<\/version>\n    <relativePath/>\n  <\/parent>\n\n  <groupId>dev.jorday<\/groupId>\n  <artifactId>todo<\/artifactId>\n  <version>0.0.1-SNAPSHOT<\/version>\n\n  <properties>\n    <java.version>21<\/java.version>\n  <\/properties>\n\n  <dependencies>\n    <dependency>\n      <groupId>org.springframework.boot<\/groupId>\n      <artifactId>spring-boot-starter-webmvc<\/artifactId>\n    <\/dependency>\n    <dependency>\n      <groupId>org.springframework.boot<\/groupId>\n      <artifactId>spring-boot-starter-webmvc-test<\/artifactId>\n      <scope>test<\/scope>\n    <\/dependency>\n  <\/dependencies>\n\n  <build>\n    <plugins>\n      <plugin>\n        <groupId>org.springframework.boot<\/groupId>\n        <artifactId>spring-boot-maven-plugin<\/artifactId>\n      <\/plugin>\n    <\/plugins>\n  <\/build>\n<\/project>\n```\n\nThe `parent` manages the versions of hundreds of libraries, so most dependencies need no version. The web starter was named `spring-boot-starter-web` before Boot 4; the old name still works but is deprecated.\n\n**The code.** A tiny to-do API with an in-memory store. All files go in `src/main/java/dev/jorday/todo/`. First the entry point and the two data types (records work well as JSON bodies):\n\n```java\npackage dev.jorday.todo;\n\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\npublic class TodoApplication {\n    public static void main(String[] args) {\n        SpringApplication.run(TodoApplication.class, args);\n    }\n}\n```\n\n```java\npackage dev.jorday.todo;\n\npublic record Todo(long id, String title, boolean done) {}\n```\n\n```java\npackage dev.jorday.todo;\n\npublic record CreateTodo(String title) {}\n```\n\nThe service holds the logic and the data. A `ConcurrentHashMap` and an `AtomicLong` are used because the server handles requests on many threads at once (Module 3):\n\n```java\npackage dev.jorday.todo;\n\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.Optional;\nimport java.util.concurrent.ConcurrentHashMap;\nimport java.util.concurrent.atomic.AtomicLong;\nimport org.springframework.stereotype.Service;\n\n@Service\npublic class TodoService {\n    private final Map<Long, Todo> todos = new ConcurrentHashMap<>();\n    private final AtomicLong ids = new AtomicLong();\n\n    public List<Todo> findAll() {\n        return todos.values().stream()\n            .sorted(Comparator.comparingLong(Todo::id))\n            .toList();\n    }\n\n    public Optional<Todo> findById(long id) {\n        return Optional.ofNullable(todos.get(id));\n    }\n\n    public Todo create(String title) {\n        long id = ids.incrementAndGet();\n        Todo todo = new Todo(id, title, false);\n        todos.put(id, todo);\n        return todo;\n    }\n\n    public Optional<Todo> complete(long id) {\n        return Optional.ofNullable(\n            todos.computeIfPresent(id, (key, t) -> new Todo(t.id(), t.title(), true)));\n    }\n}\n```\n\nThe controller maps URLs to methods. Spring sees the constructor parameter of type `TodoService` and injects the bean; there is no `new` anywhere:\n\n```java\npackage dev.jorday.todo;\n\nimport java.util.List;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.PutMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.ResponseStatus;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.server.ResponseStatusException;\n\n@RestController\n@RequestMapping(\"/api/todos\")\npublic class TodoController {\n    private final TodoService service;\n\n    public TodoController(TodoService service) {\n        this.service = service;\n    }\n\n    @GetMapping\n    public List<Todo> all() {\n        return service.findAll();\n    }\n\n    @GetMapping(\"/{id}\")\n    public Todo one(@PathVariable long id) {\n        return service.findById(id).orElseThrow(() -> notFound(id));\n    }\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public Todo create(@RequestBody CreateTodo body) {\n        if (body.title() == null || body.title().isBlank()) {\n            throw new ResponseStatusException(HttpStatus.BAD_REQUEST, \"title is required\");\n        }\n        return service.create(body.title().trim());\n    }\n\n    @PutMapping(\"/{id}/done\")\n    public Todo complete(@PathVariable long id) {\n        return service.complete(id).orElseThrow(() -> notFound(id));\n    }\n\n    private static ResponseStatusException notFound(long id) {\n        return new ResponseStatusException(HttpStatus.NOT_FOUND, \"todo \" + id + \" not found\");\n    }\n}\n```\n\nRun the app and try it from a second terminal:\n\n```bash\n./mvnw spring-boot:run\ncurl -s -X POST localhost:8080/api/todos -H \"Content-Type: application/json\" -d '{\"title\":\"Learn Spring\"}'\ncurl -s -X PUT localhost:8080/api/todos/1/done\ncurl -s localhost:8080/api/todos\ncurl -s -o /dev/null -w \"%{http_code}\\n\" localhost:8080/api/todos/99\ncurl -s -o /dev/null -w \"%{http_code}\\n\" -X POST localhost:8080/api/todos -H \"Content-Type: application/json\" -d '{\"title\":\"  \"}'\n```\n\nOutput:\n```text\n{\"id\":1,\"title\":\"Learn Spring\",\"done\":false}\n{\"id\":1,\"title\":\"Learn Spring\",\"done\":true}\n[{\"id\":1,\"title\":\"Learn Spring\",\"done\":true}]\n404\n400\n```\n\n(If you generated the project from start.spring.io, it includes the Maven wrapper `mvnw`; otherwise use `mvn spring-boot:run`. The app listens on port 8080 by default; change it with `server.port=9090` in `src/main/resources/application.properties`.)\n\n**Testing the web layer.** `@WebMvcTest` starts only the web part of Spring (controllers and JSON conversion), not the whole application, so it is fast. It does not create `@Service` beans, so we import the one we need. `MockMvcTester` sends requests to the controller without opening a real network port and gives you AssertJ-style assertions. Put this in `src/test/java/dev/jorday/todo/TodoControllerTest.java`:\n\n```java\npackage dev.jorday.todo;\n\nimport static org.assertj.core.api.Assertions.assertThat;\n\nimport org.junit.jupiter.api.Test;\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.webmvc.test.autoconfigure.WebMvcTest;\nimport org.springframework.context.annotation.Import;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.MediaType;\nimport org.springframework.test.web.servlet.assertj.MockMvcTester;\n\n@WebMvcTest(TodoController.class)\n@Import(TodoService.class)\nclass TodoControllerTest {\n\n    @Autowired\n    private MockMvcTester mvc;\n\n    @Test\n    void createReturns201AndTheTodo() {\n        assertThat(mvc.post().uri(\"/api/todos\")\n                .contentType(MediaType.APPLICATION_JSON)\n                .content(\"{\\\"title\\\":\\\"Write tests\\\"}\"))\n            .hasStatus(HttpStatus.CREATED)\n            .bodyJson()\n            .extractingPath(\"$.title\")\n            .asString()\n            .isEqualTo(\"Write tests\");\n    }\n\n    @Test\n    void blankTitleIsRejected() {\n        assertThat(mvc.post().uri(\"/api/todos\")\n                .contentType(MediaType.APPLICATION_JSON)\n                .content(\"{\\\"title\\\":\\\"  \\\"}\"))\n            .hasStatus(HttpStatus.BAD_REQUEST);\n    }\n\n    @Test\n    void unknownIdReturns404() {\n        assertThat(mvc.get().uri(\"/api/todos/999\"))\n            .hasStatus(HttpStatus.NOT_FOUND);\n    }\n}\n```\n\nOutput:\n```text\n[INFO] Tests run: 3, Failures: 0, Errors: 0, Skipped: 0\n[INFO] BUILD SUCCESS\n```\n\nEach test avoids depending on state left by another test, because the service bean is shared across the tests in the class.\n\n**What a real service adds.** Persistence (Spring Data JPA with a database such as PostgreSQL, instead of a map), input validation (`spring-boot-starter-validation` with `@Valid` and constraint annotations on the request record), consistent error responses (a `@RestControllerAdvice` that returns `ProblemDetail`), security (Spring Security), configuration per environment (`application.properties` plus profiles), and operations endpoints (`spring-boot-starter-actuator` for health checks and metrics). Spring Boot 4 also makes a common move to **Jackson 3** (packages under `tools.jackson`), which only matters when you write custom JSON code. You can also turn on virtual threads for request handling with `spring.threads.virtual.enabled=true`, which connects this module to Module 3.\n\n### Common mistakes\n- Following a Spring Boot 3 tutorial on a Boot 4 project (or the reverse). Old starter and test-package names will not resolv
