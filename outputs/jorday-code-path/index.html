ams use it too.\n\n### Common mistakes\n- Using `random.randint` without `import random` at the top.\n- Picking the secret number *inside* the loop, so it changes every guess. Pick it once, before the loop.\n- Forgetting to convert `input()` to `int`, so you compare text with a number.\n- Forgetting `main()` at the bottom. Nothing runs without that call.\n\n### Practice\n1. Add a hint: after the player loses, say whether the secret was even or odd *before* the last try (hint: use `%`).\n2. Add a difficulty choice at the start: easy (1 to 50, 10 tries), hard (1 to 200, 8 tries). Hint: make `play_round` take parameters.\n3. Brand-new project: build a to-do list. Keep a list of tasks; show a menu to add a task, show all tasks, remove a task by number, or quit.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1 and 2: parameterized round with a parity hint on the final try\nimport random\n\n\ndef ask_for_guess(low, high):\n    while True:\n        text = input(f\"Guess a number from {low} to {high}: \")\n        try:\n            guess = int(text)\n        except ValueError:\n            print(\"Please type a whole number.\")\n            continue\n        if low <= guess <= high:\n            return guess\n        print(f\"Stay between {low} and {high}.\")\n\n\ndef play_round(low, high, max_tries):\n    secret = random.randint(low, high)\n    for attempt in range(1, max_tries + 1):\n        if attempt == max_tries:\n            kind = \"even\" if secret % 2 == 0 else \"odd\"\n            print(f\"Last try! Hint: the number is {kind}.\")\n        guess = ask_for_guess(low, high)\n        if guess == secret:\n            print(f\"You got it in {attempt} guesses!\")\n            return True\n        print(\"Too low!\" if guess < secret else \"Too high!\")\n    print(f\"Out of tries! The number was {secret}.\")\n    return False\n\n\nlevel = input(\"Difficulty (easy/hard): \").strip().lower()\nif level == \"hard\":\n    play_round(1, 200, 8)\nelse:\n    play_round(1, 50, 10)\n\n\n# 3: to-do list\ntasks = []\n\nwhile True:\n    print(\"\\n1) Add  2) Show  3) Remove  4) Quit\")\n    choice = input(\"Choose: \").strip()\n\n    if choice == \"1\":\n        tasks.append(input(\"New task: \"))\n    elif choice == \"2\":\n        if not tasks:\n            print(\"Nothing to do!\")\n        for number, task in enumerate(tasks, start=1):\n            print(f\"{number}. {task}\")\n    elif choice == \"3\":\n        try:\n            number = int(input(\"Remove which number? \"))\n            removed = tasks.pop(number - 1)\n            print(f\"Removed: {removed}\")\n        except (ValueError, IndexError):\n            print(\"That isn't a valid task number.\")\n    elif choice == \"4\":\n        print(\"Bye!\")\n        break\n    else:\n        print(\"Please choose 1, 2, 3, or 4.\")\n```\n\n<\/details>\n\n**Where to go next**\n\nYou now know the core of Python. To keep growing: build the to-do list for real, then try small projects like a quiz game, a tip calculator, or a password generator. The next level of this course covers reading and writing files, classes, modules, and working with real data. Keep every project small, finish it, and enjoy it.\n", "python-intermediate": "# Python — Intermediate\n\nYou already know how to write small programs: variables, loops, lists, dicts, and functions. This level is where your programs start to look like *real software*. You will save data to disk, handle things going wrong without crashing, split code across files, install other people's code, model the world with classes, talk to web APIs, and prove your code works with automated tests. Everything here targets **Python 3.12 or newer** (a few lines will say so when it matters). Type each example yourself instead of pasting it. Your fingers learn things your eyes skip. By the end you will have built a complete, tested command-line app.\n\n## Module 1: Files and the `with` Statement\n**Goal:** Read and write text, CSV, and JSON-ready files safely using `with` and `pathlib`.\n\nUntil now your programs forgot everything the moment they ended. Files fix that.\n\n### Opening a file\n\n`open()` gives you a file object. The safest way to use it is a `with` block, which **closes the file for you even if your code crashes halfway**. A file you forget to close can lose data or lock the file on some systems, so `with` is the default habit.\n\n```python\nwith open(\"todo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"buy milk\\n\")\n    f.write(\"write code\\n\")\n\nwith open(\"todo.txt\", encoding=\"utf-8\") as f:\n    for line in f:\n        print(line.rstrip(\"\\n\"))\n# Output:\n# buy milk\n# write code\n```\n\nThree things to notice:\n\n- `\"w\"` is the **mode**. Write mode *erases the file first*. Use `\"a\"` to append and `\"r\"` (the default) to read.\n- Always pass `encoding=\"utf-8\"`. Without it, Python uses your operating system's default, and your file may look broken on someone else's computer. (Python 3.15 will make UTF-8 the default everywhere, but being explicit costs nothing.)\n- Looping over `f` hands you one line at a time, so even a 10 GB file does not fill your memory. Each line still ends in `\\n`, which is why we call `.rstrip(\"\\n\")`.\n\n| Mode | Meaning |\n|------|---------|\n| `\"r\"` | read (default); error if the file does not exist |\n| `\"w\"` | write; creates the file or **erases** an existing one |\n| `\"a\"` | append to the end; creates if missing |\n| `\"x\"` | create new; error if it already exists (safe against overwriting) |\n| `\"rb\"` / `\"wb\"` | read/write raw bytes (images, PDFs, anything not text) |\n\n### Reading all at once\n\n```python\nwith open(\"todo.txt\", encoding=\"utf-8\") as f:\n    text = f.read()          # one big string\nprint(repr(text))\n# Output: 'buy milk\\nwrite code\\n'\n\nwith open(\"todo.txt\", encoding=\"utf-8\") as f:\n    lines = f.read().splitlines()   # list of lines, no \\n\nprint(lines)\n# Output: ['buy milk', 'write code']\n```\n\n### `pathlib`: paths as objects\n\nBuilding paths with string concatenation breaks across Windows (`\\`) and Mac/Linux (`/`). `pathlib.Path` handles that, and it has handy shortcuts.\n\n```python\nfrom pathlib import Path\n\nfolder = Path(\"data\") / \"reports\"      # the / operator joins paths\nfolder.mkdir(parents=True, exist_ok=True)\n\nreport = folder / \"jan.txt\"\nreport.write_text(\"sales: 42\\n\", encoding=\"utf-8\")\n\nprint(report)                  # data/reports/jan.txt\nprint(report.name)             # jan.txt\nprint(report.stem)             # jan\nprint(report.suffix)           # .txt\nprint(report.exists())         # True\nprint(report.read_text(encoding=\"utf-8\").strip())\n# Output:\n# data/reports/jan.txt\n# jan.txt\n# jan\n# .txt\n# True\n# sales: 42\n```\n\n`mkdir(parents=True, exist_ok=True)` means \"create every missing folder along the way, and don't complain if it's already there.\"\n\nFinding files:\n\n```python\nfrom pathlib import Path\n\nfor path in sorted(Path(\"data\").rglob(\"*.txt\")):   # rglob = search subfolders too\n    print(path, path.stat().st_size, \"bytes\")\n# Output:\n# data/reports/jan.txt 10 bytes\n```\n\n### CSV files\n\nCSV (comma-separated values) is what spreadsheets export. Use the `csv` module, not `.split(\",\")`, because real data contains commas inside quotes.\n\n```python\nimport csv\n\nrows = [\n    {\"name\": \"Ada\", \"score\": 95},\n    {\"name\": \"Linus\", \"score\": 88},\n]\n\nwith open(\"scores.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n    writer = csv.DictWriter(f, fieldnames=[\"name\", \"score\"])\n    writer.writeheader()\n    writer.writerows(rows)\n\nwith open(\"scores.csv\", newline=\"\", encoding=\"utf-8\") as f:\n    for row in csv.DictReader(f):\n        print(row[\"name\"], int(row[\"score\"]) + 1)\n# Output:\n# Ada 96\n# Linus 89\n```\n\n`newline=\"\"` is required by the csv module so it can manage line endings itself. Everything read from a CSV is a **string**, so convert with `int()` or `float()`.\n\n### Common mistakes\n- Opening with `\"w\"` when you meant `\"a\"` and wiping out your data.\n- Forgetting `encoding=\"utf-8\"` and getting garbled characters on another machine.\n- Calling `f.read()` on a huge file instead of looping line by line.\n- Forgetting that lines keep their trailing `\\n`.\n- Using `open()` without `with`, so an exception skips `f.close()`.\n- Treating CSV values as numbers; they are always strings until you convert them.\n\n### Practice\n1. Write a program that asks the user for three things to do, saves them to `tasks.txt` one per line, then reads the file back and prints them numbered (`1. ...`).\n2. Write `count_words(path)` that returns how many words are in a text file. Use `pathlib`. Test it on a file you create yourself.\n3. Create a CSV with columns `item,price,qty`. Read it with `csv.DictReader` and print the total cost (`price * qty` summed over all rows).\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\ntasks = [input(f\"Task {i}: \") for i in range(1, 4)]\nwith open(\"tasks.txt\", \"w\", encoding=\"utf-8\") as f:\n    for task in tasks:\n        f.write(task + \"\\n\")\n\nwith open(\"tasks.txt\", encoding=\"utf-8\") as f:\n    for number, line in enumerate(f, start=1):\n        print(f\"{number}. {line.rstrip()}\")\n\n# 2\nfrom pathlib import Path\n\ndef count_words(path):\n    text = Path(path).read_text(encoding=\"utf-8\")\n    return len(text.split())\n\nPath(\"sample.txt\").write_text(\"one two three\\nfour five\\n\", encoding=\"utf-8\")\nprint(count_words(\"sample.txt\"))  # 5\n\n# 3\nimport csv\n\nwith open(\"shop.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n    f.write(\"item,price,qty\\napple,0.5,10\\nbread,2.25,2\\n\")\n\ntotal = 0.0\nwith open(\"shop.csv\", newline=\"\", encoding=\"utf-8\") as f:\n    for row in csv.DictReader(f):\n        total += float(row[\"price\"]) * int(row[\"qty\"])\nprint(total)  # 9.5\n```\n\n<\/details>\n\n## Module 2: Exceptions\n**Goal:** Handle errors on purpose, raise your own, and define custom exception types.\n\nYou learned to *read* errors. Now you learn to *handle* them. An **exception** is Python's way of saying \"something went wrong here, and I can't continue unless someone deals with it.\" If nobody does, the program stops with a traceback.\n\n### try / except / else / finally\n\n```python\ndef parse_age(text):\n    try:\n        age = int(text)\n    except ValueError:\n        print(f\"{text!r} is not a whole number\")\n        return None\n    else:\n        # runs only if the try block raised nothing\n        print(\"parsed fine\")\n        return age\n    finally:\n        # runs no matter what: success, error, or return\n        print(\"done parsing\")\n\nprint(parse_age(\"42\"))\nprint(parse_age(\"forty\"))\n# Output:\n# parsed fine\n# done parsing\n# 42\n# 'forty' is not a whole number\n# done parsing\n# None\n```\n\n- `try`: the risky code. Keep it **small**, only the lines that can actually fail.\n- `except SomeError`: runs if that error type happens.\n- `else`: runs only when there was no error. It keeps \"the risky line\" separate from \"what to do next.\"\n- `finally`: cleanup that must always happen (closing a connection, deleting a temp file).\n\n### Catch specific exceptions\n\n```python\ndata = {\"name\": \"Ada\"}\n\ntry:\n    print(data[\"age\"])\nexcept KeyError as exc:\n    print(\"missing key:\", exc)\n# Output: missing key: 'age'\n\ntry:\n    result = 10 / 0\nexcept (ZeroDivisionError, OverflowError):   # several types in one clause\n    result = 0\nprint(result)\n# Output: 0\n```\n\n**Never write a bare `except:`** and be careful with `except Exception:`. They swallow bugs you *want* to see (typos, wrong types) and make your program fail silently, which is far worse than failing loudly. Catch the exact thing you know how to fix.\n\n### Raising your own exceptions\n\nUse `raise` when *your* code detects a problem it cannot fix.\n\n```python\ndef withdraw(balance, amount):\n    if amount <= 0:\n        raise ValueError(\"amount must be positive\")\n    if amount > balance:\n        raise ValueError(f\"cannot withdraw {amount}; balance is only {balance}\")\n    return balance - amount\n\ntry:\n    withdraw(50, 80)\nexcept ValueError as exc:\n    print(\"Error:\", exc)\n# Output: Error: cannot withdraw 80; balance is only 50\n```\n\nPick the built-in type that matches: `ValueError` (right type, bad value), `TypeError` (wrong type), `KeyError`, `FileNotFoundError`, `RuntimeError`, and so on.\n\n### Custom exceptions\n\nFor your own app, define your own types. A class that inherits from `Exception` is all you need (classes get a full lesson in Module 5; for now, copy the pattern).\n\n```python\nclass AppError(Exception):\n    \"\"\"Base class for all errors our app raises on purpose.\"\"\"\n\nclass InsufficientFundsError(AppError):\n    def __init__(self, balance, amount):\n        self.balance = balance\n        self.amount = amount\n        super().__init__(f\"need {amount}, but balance is {balance}\")\n\ndef withdraw(balance, amount):\n    if amount > balance:\n        raise InsufficientFundsError(balance, amount)\n    return balance - amount\n\ntry:\n    withdraw(50, 80)\nexcept InsufficientFundsError as exc:\n    print(exc)\n    print(\"short by\", exc.amount - exc.balance)\n# Output:\n# need 80, but balance is 50\n# short by 30\n```\n\nWhy a base class (`AppError`)? Callers can catch *just* your errors with `except AppError`, or one specific kind. That is exactly how libraries like `requests` work.\n\n### Chaining and re-raising\n\nWhen you catch a low-level error and raise a friendlier one, use `from` so the original cause is kept in the traceback.\n\n```python\nimport json\n\ndef load_settings(text):\n    try:\n        return json.loads(text)\n    except json.JSONDecodeError as exc:\n        raise AppError(\"settings are not valid JSON\") from exc\n\ntry:\n    load_settings(\"{oops\")\nexcept AppError as exc:\n    print(exc)\n    print(type(exc.__cause__).__name__)\n# Output:\n# settings are not valid JSON\n# JSONDecodeError\n```\n\nA bare `raise` inside an `except` block re-raises the *same* error, useful when you want to log something and then let it keep going.\n\n### Ask forgiveness, not permission (EAFP)\n\nPython style prefers *trying* and handling failure over checking first.\n\n```python\nfrom pathlib import Path\n\n# Looks safe, but the file could vanish between the check and the open:\nif Path(\"config.txt\").exists():\n    text = Path(\"config.txt\").read_text(encoding=\"utf-8\")\n\n# Better: just try it.\ntry:\n    text = Path(\"config.txt\").read_text(encoding=\"utf-8\")\nexcept FileNotFoundError:\n    text = \"\"\n```\n\n### New in 3.11+: notes and exception groups\n\n`exc.add_note(\"extra context\")` attaches a string that appears in the traceback. `ExceptionGroup` and `except*` handle several errors at once; you will meet them again in the Expert concurrency module. You do not need them yet.\n\n### Common mistakes\n- A bare `except:` (or `except Exception: pass`) that hides real bugs.\n- Putting 30 lines inside `try`, so you don't know which line failed.\n- Raising or catching `Exception` instead of a specific type.\n- Forgetting `from exc` when translating errors, losing the original cause.\n- Using exceptions for normal flow when a simple `if` is clearer (for example, checking `if x is None`).\n- Printing an error and then continuing as if nothing happened, leaving a variable undefined.\n\n### Practice\n1. Write `safe_divide(a, b)` that returns `None` instead of crashing when `b` is 0.\n2. Write `read_number(prompt)` that keeps asking until the user types a valid integer, using `try/except` in a loop.\n3. Create `class NegativePriceError(Exception)` and a `make_item(name, price)` function that raises it for negative prices. Catch it and print a friendly message.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\ndef safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\nprint(safe_divide(10, 2))  # 5.0\nprint(safe_divide(1, 0))   # None\n\n# 2\ndef read_number(prompt):\n    while True:\n        text = input(prompt)\n        try:\n            return int(text)\n        except ValueError:\n            print(\"Please type a whole number.\")\n\n# 3\nclass NegativePriceError(Exception):\n    pass\n\ndef make_item(name, price):\n    if price < 0:\n        raise NegativePriceError(f\"{name} cannot cost {price}\")\n    return {\"name\": name, \"price\": price}\n\ntry:\n    make_item(\"hat\", -5)\nexcept NegativePriceError as exc:\n    print(\"Oops:\", exc)  # Oops: hat cannot cost -5\n```\n\n<\/details>\n\n## Module 3: Modules, Packages, `pip`, and Virtual Environments\n**Goal:** Split code across files, import what you need, and install third-party packages without making a mess.\n\n### Modules: one file = one module\n\nAny `.py` file is a **module**. Suppose you have two files in the same folder:\n\n```python\n# mathutils.py\nPI = 3.14159\n\ndef circle_area(radius):\n    return PI * radius ** 2\n\nif __name__ == \"__main__\":\n    # runs only when you do `python mathutils.py`, NOT when imported\n    print(circle_area(2))\n```\n\n```python\n# main.py\nimport mathutils\nfrom mathutils import circle_area, PI\n\nprint(mathutils.circle_area(1))\nprint(circle_area(3), PI)\n# Output:\n# 3.14159\n# 28.27431 3.14159\n```\n\nThe `if __name__ == \"__main__\":` guard matters: when a file is run directly its `__name__` is `\"__main__\"`; when it is imported, `__name__` is the module's name. The guard lets one file be both a reusable library and a runnable script.\n\nImport styles:\n\n| Style | When |\n|-------|------|\n| `import math` then `math.sqrt(9)` | default; the origin of each name stays obvious |\n| `from math import sqrt` | a few names used a lot |\n| `import numpy as np` | community-standard abbreviations only |\n| `from x import *` | **avoid**; hides where names come from |\n\n### The standard library: batteries included\n\nPython ships hundreds of modules. A tasting menu:\n\n```python\nimport math, random, statistics\nfrom collections import Counter, defaultdict\nfrom datetime import date, timedelta\n\nprint(math.sqrt(144))                          # 12.0\nprint(statistics.mean([2, 4, 9]))              # 5\nprint(Counter(\"banana\").most_common(2))        # [('a', 3), ('n', 2)]\nprint(date(2026, 1, 31) + timedelta(days=1))   # 2026-02-01\n\ngroups = defaultdict(list)                     # dict that creates missing values\nfor word in [\"apple\", \"avocado\", \"bean\"]:\n    groups[word[0]].append(word)\nprint(dict(groups))                            # {'a': ['apple', 'avocado'], 'b': ['bean']}\n```\n\n`random.choice`, `random.randint`, `os`, `sys`, `argparse`, `json`, `csv`, `re`, `itertools`, and `pathlib` are others you will use constantly. Before you install a package, check whether the standard library already does it.\n\n### Packages: a folder of modules\n\nA **package** is a folder containing modules (and usually an `__init__.py`, which may be empty).\n\n```text\nmyproject/\n    main.py\n    shop/\n        __init__.py\n        cart.py\n        prices.py\n```\n\n```python\n# shop/prices.py\ndef with_tax(amount, rate=0.08):\n    return round(amount * (1 + rate), 2)\n```\n\n```python\n# shop/cart.py\nfrom .prices import with_tax      # the dot means \"from this same package\"\n\ndef total(items):\n    return with_tax(sum(items))\n```\n\n```python\n# main.py\nfrom shop.cart import total\n\nprint(total([10, 20]))\n# Output: 32.4\n```\n\nRun it from inside `myproject/` with `python main.py`. Python searches for imports in the script's folder first, which is why `shop` is found. **Name your files carefully:** a file called `random.py` or `json.py` will *shadow* the real standard-library module and cause baffling errors.\n\n### Third-party packages with pip\n\nPyPI (pypi.org) hosts hundreds of thousands of packages. `pip` installs them:\n\n```bash\npython -m pip install requests\npython -m pip show requests\npython -m pip uninstall requests\n```\n\n(Using `python -m pip` guarantees you install into the *same* Python you will run.)\n\n### Virtual environments (venv)\n\nIf you install everything globally, project A needs `requests 2.28`, project B needs `2.32`, and they collide. A **virtual environment** is a private folder holding its own Python and its own packages, one per project.\n\n```bash\n# 1. create it once, inside your project folder\npython -m venv .venv\n\n# 2. activate it (every new terminal)\nsource .venv/bin/activate          # macOS / Linux\n.venv\\Scripts\\activate             # Windows (PowerShell or cmd)\n\n# 3. install things (they go into .venv only)\npython -m pip install requests pytest\n\n# 4. record exactly what you installed\npython -m pip freeze > requirements.txt\n\n# 5. someone else (or future you) recreates it\npython -m pip install -r requirements.txt\n\n# 6. leave it\ndeactivate\n```\n\nYour prompt shows `(.venv)` while active. Rules of thumb:\n\n- One `.venv` per project, named `.venv`.\n- **Never commit `.venv` to git.** Add it to `.gitignore`; commit `requirements.txt` instead.\n- Never `pip install` into the global Python; modern macOS and Linux systems will even refuse (\"externally managed environment\").\n- In the Expert level you will meet `uv`, a much faster tool that does all of this for you.\n\nCheck which Python is active:\n\n```python\nimport sys\nprint(sys.prefix)\n# With a venv active this prints something like .../myproject/.venv\n```\n\n### Common mistakes\n- Naming your file after a module you import (`requests.py`, `random.py`, `test.py` can all cause trouble).\n- Installing packages globally, or forgetting to activate the venv and wondering why `import requests` fails.\n- Committing `.venv` to git.\n- Circular imports (`a.py` imports `b.py` which imports `a.py`). Fix by moving shared code to a third module.\n- Running a package file directly (`python shop/cart.py`) and getting \"attempted relative import\" errors. Run from the project root instead, or use `python -m shop.cart`.\n- Forgetting the `__name__ == \"__main__\"` guard, so importing a script also runs it.\n\n### Practice\n1. Create `greetings.py` with a function `hello(name)` and a `__main__` guard that prints `hello(\"world\")`. Import it from a second file and call it.\n2. Use `collections.Counter` to find the three most common letters in a sentence you type.\n3. Make a venv in a new folder, activate it, install `requests`, and run `python -c \"import requests; print(requests.__version__)\"`. Then run `pip freeze` and read the output.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1 -- greetings.py\ndef hello(name):\n    return f\"Hello, {name}!\"\n\nif __name__ == \"__main__\":\n    print(hello(\"world\"))\n\n# second file -- app.py\nfrom greetings import hello\nprint(hello(\"Jorday\"))   # Hello, Jorday!\n\n# 2\nfrom collections import Counter\nsentence = input(\"Sentence: \").lower().replace(\" \", \"\")\nprint(Counter(sentence).most_common(3))\n\n# 3 (terminal commands, not Python)\n# python -m venv .venv\n# source .venv/bin/activate      (Windows: .venv\\Scripts\\activate)\n# python -m pip install requests\n# python -c \"import requests; print(requests.__version__)\"\n# python -m pip freeze\n```\n\n<\/details>\n\n## Module 4: Comprehensions and Generator Basics\n**Goal:** Build collections in one readable line and process large data lazily with generators.\n\n### List comprehensions\n\nA comprehension is a compact way to build a new list from a loop.\n\n```python\nsquares = []\nfor n in range(5):\n    squares.append(n ** 2)\n\nsquares = [n ** 2 for n in range(5)]   # same thing, one line\nprint(squares)\n# Output: [0, 1, 4, 9, 16]\n```\n\nRead it as: \"give me `n ** 2` *for* each `n` *in* `range(5)`.\" Add `if` to filter:\n\n```python\nwords = [\"apple\", \"Bob\", \"cat\", \"Dog\"]\nlower = [w for w in words if w.islower()]\nshouts = [w.upper() for w in words if len(w) == 3]\nprint(lower)\nprint(shouts)\n# Output:\n# ['apple', 'cat']\n# ['BOB', 'CAT', 'DOG']\n```\n\nTo *transform* with a condition, put the `if/else` at the **front** (it's an expression, not a filter):\n\n```python\nnums = [1, 2, 3, 4]\nlabels = [\"even\" if n % 2 == 0 else \"odd\" for n in nums]\nprint(labels)\n# Output: ['odd', 'even', 'odd', 'even']\n```\n\n### Dict and set comprehensions\n\n```python\nnames = [\"ada\", \"linus\", \"grace\"]\n\nlengths = {name: len(name) for name in names}\nprint(lengths)\n# Output: {'ada': 3, 'linus': 5, 'grace': 5}\n\nunique_lengths = {len(name) for name in names}   # a set: no duplicates\nprint(unique_lengths)\n# Output: {3, 5}\n\nflipped = {v: k for k, v in {\"a\": 1, \"b\": 2}.items()}\nprint(flipped)\n# Output: {1: 'a', 2: 'b'}\n```\n\n### Helpers: `enumerate`, `zip`, `sorted`, `lambda`\n\n```python\nfruits = [\"apple\", \"pear\", \"fig\"]\nprices = [1.2, 0.8, 3.0]\n\nfor i, fruit in enumerate(fruits, start=1):\n    print(i, fruit)\n# Output:\n# 1 apple\n# 2 pear\n# 3 fig\n\nmenu = dict(zip(fruits, prices))               # pair items up\nprint(menu)\n# Output: {'apple': 1.2, 'pear': 0.8, 'fig': 3.0}\n\nby_price = sorted(menu, key=lambda name: menu[name])   # lambda = tiny unnamed function\nprint(by_price)\n# Output: ['pear', 'apple', 'fig']\n```\n\n### Nested comprehensions, and knowing when to stop\n\n```python\ngrid = [[1, 2, 3], [4, 5, 6]]\nflat = [x for row in grid for x in row]    # outer loop first, like normal nested loops\nprint(flat)\n# Output: [1, 2, 3, 4, 5, 6]\n```\n\nIf a comprehension needs more than one `for` plus a condition, or you have to re-read it twice, **write a normal loop**. Readability beats cleverness. And never use a comprehension just for side effects like `[print(x) for x in xs]`; that builds a pointless list.\n\n### Generators: lazy values\n\nA list comprehension builds the *entire* list in memory at once. A **generator expression** (round brackets) produces values one at a time, only when asked.\n\n```python\nimport sys\n\nas_list = [n * n for n in range(1_000_000)]\nas_gen = (n * n for n in range(1_000_000))\n\nprint(sys.getsizeof(as_list) > 1_000_000)   # True: megabytes of memory\nprint(sys.getsizeof(as_gen) < 500)          # True: a few hundred bytes at most\nprint(sum(as_gen))                          # values are made on demand\n# Output:\n# True\n# True\n# 333332833333500000\n```\n\nRule of thumb: if you are only going to loop over the result once, or feed it to `sum`, `max`, `any`, `all`, `sorted`, or `join`, use a generator expression.\n\n### Generator functions with `yield`\n\nA function with `yield` becomes a generator. It **pauses** at each `yield` and resumes where it left off.\n\n```python\ndef countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n    print(\"liftoff!\")\n\ngen = countdown(3)\nprint(next(gen))\nprint(next(gen))\nprint(list(gen))        # exhausts the rest\n# Output:\n# 3\n# 2\n# liftoff!\n# [1]\n```\n\nA real use: process a huge file without loading it.\n\n```python\ndef long_lines(path, min_length=80):\n    with open(path, encoding=\"utf-8\") as f:\n        for line in f:\n            if len(line) >= min_length:\n                yield line.rstrip(\"\\n\")\n\n# for line in long_lines(\"big_log.txt\"):\n#     print(line)\n```\n\nGotcha: a generator can be used **only once**. After it is exhausted, looping over it again gives nothing. The Expert level goes much deeper (`send`, `yield from`, `itertools`).\n\n### Common mistakes\n- Using a list comprehension when a generator would save memory (or the reverse: trying to reuse a spent generator).\n- Cramming too much logic into one comprehension.\n- Confusing the filter `if` (at the end) with the conditional expression `if/else` (at the front).\n- Using `[]` instead of `{}` for dict comprehension and not noticing they differ by the `key: value` part.\n- Writing `{}` for an empty set. `{}` is an empty **dict**; use `set()`.\n- Iterating a generator twice and getting nothing the second time.\n\n### Practice\n1. Use a list comprehension to get the squares of only the odd numbers from 1 to 15.\n2. Given `words = [\"tea\", \"coffee\", \"milk\"]`, build a dict mapping each word to its length with a dict comprehension.\n3. Write a generator `evens(limit)` that yields even numbers below `limit`. Print its values using a `for` loop.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nprint([n ** 2 for n in range(1, 16) if n % 2 == 1])\n# [1, 9, 25, 49, 81, 121, 169, 225]\n\n# 2\nwords = [\"tea\", \"coffee\", \"milk\"]\nprint({w: len(w) for w in words})\n# {'tea': 3, 'coffee': 6, 'milk': 4}\n\n# 3\ndef evens(limit):\n    for n in range(0, limit, 2):\n        yield n\n\nfor value in evens(10):\n    print(value)   # 0 2 4 6 8, one per line\n```\n\n<\/details>\n\n## Module 5: Classes and Object-Oriented Programming\n**Goal:** Bundle data and behavior into your own types, share code with inheritance, and use dataclasses.\n\nA **class** is a blueprint; an **object** (instance) is one thing built from it. Use a class when you have data and the functions that work on that data and they belong together.\n\n### Your first class\n\n```python\nclass Dog:\n    species = \"Canis familiaris\"        # class attribute: shared by all dogs\n\n    def __init__(self, name, age):      # runs when you create a Dog\n        self.name = name                # instance attributes: one set per dog\n        self.age = age\n\n    def bark(self):\n        return f\"{self.name} says woof\"\n\n    def birthday(self):\n        self.age += 1\n\nrex = Dog(\"Rex\", 3)\nrex.birthday()\nprint(rex.bark(), rex.age)\n# Output: Rex says woof 4\n```\n\n`self` is simply the object the method was called on. `rex.bark()` is shorthand for `Dog.bark(rex)`. Python passes it for you.\n\n### Dunder (special) methods\n\nMethods named `__like_this__` let your objects work with Python's built-in syntax.\n\n```python\nclass Vector:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __repr__(self):                  # for developers; shown in the REPL and debugging\n        return f\"Vector({self.x}, {self.y})\"\n\n    def __str__(self):                   # for users; used by print()\n        return f\"({self.x}, {self.y})\"\n\n    def __eq__(self, other):\n        if not isinstance(other, Vector):\n            return NotImplemented\n        return (self.x, self.y) == (other.x, other.y)\n\n    def __add__(self, other):\n        return Vector(self.x + other.x, self.y + other.y)\n\n    def __len__(self):\n        return 2\n\na = Vector(1, 2)\nb = Vector(3, 4)\nprint(a + b)\nprint(repr(a + b))\nprint(a == Vector(1, 2), len(a))\n# Output:\n# (4, 6)\n# Vector(4, 6)\n# True 2\n```\n\nAlways write a `__repr__`. Debugging an object that prints as `<__main__.Vector object at 0x10a...>` is miserable.\n\n### Inheritance\n\nA **child class** reuses and customizes a **parent class**. Use `super()` to call the parent's version.\n\n```python\nclass Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n    def intro(self):\n        return f\"{self.name}: {self.speak()}\"\n\nclass Cat(Animal):\n    def speak(self):                 # override\n        return \"meow\"\n\nclass Puppy(Animal):\n    def __init__(self, name, trick):\n        super().__init__(name)       # let Animal set up self.name\n        self.trick = trick\n\n    def speak(self):\n        return f\"yip! (knows {self.trick})\"\n\nfor pet in [Animal(\"Thing\"), Cat(\"Tom\"), Puppy(\"Bo\", \"roll over\")]:\n    print(pet.intro())\n# Output:\n# Thing: ...\n# Tom: meow\n# Bo: yip! (knows roll over)\n```\n\nThe loop calls `.intro()` on three different types and each does the right thing. That is **polymorphism**. `isinstance(pet, Animal)` is `True` for all three.\n\n**Prefer composition when it fits.** \"A Car *has an* Engine\" is composition (Car stores an Engine object). \"A Cat *is an* Animal\" is inheritance. Deep inheritance trees become hard to follow; keep them shallow.\n\n### Properties, class methods, static methods\n\n```python\nclass Temperature:\n    def __init__(self, celsius):\n        self.celsius = celsius\n\n    @property\n    def fahrenheit(self):            # used like an attribute: t.fahrenheit\n        return self.celsius * 9 / 5 + 32\n\n    @classmethod\n    def from_fahrenheit(cls, f):     # alternative constructor\n        return cls((f - 32) * 5 / 9)\n\n    @staticmethod\n    def is_freezing(celsius):        # no self/cls; just lives here for organization\n        return celsius <= 0\n\nt = Temperature(100)\nprint(t.fahrenheit)\nprint(Temperature.from_fahrenheit(32).celsius)\nprint(Temperature.is_freezing(-3))\n# Output:\n# 212.0\n# 0.0\n# True\n```\n\nA `@property` lets you start with a plain attribute and later add validation or computation without changing how callers use it.\n\n### Dataclasses: classes without the boilerplate\n\nFor classes that mostly hold data, `@dataclass` writes `__init__`, `__repr__`, and `__eq__` for you.\n\n```python\nfrom dataclasses import dataclass, field\n\n@dataclass\nclass Player:\n    name: str\n    score: int = 0\n    items: list[str] = field(default_factory=list)   # NOT `= []`, see below\n\n    def add_item(self, item):\n        self.items.append(item)\n\np = Player(\"Ada\")\np.add_item(\"sword\")\nprint(p)\nprint(p == Player(\"Ada\", 0, [\"sword\"]))\n# Output:\n# Player(name='Ada', score=0, items=['sword'])\n# True\n```\n\nUseful options:\n\n```python\nfrom dataclasses import dataclass\n\n@dataclass(frozen=True, order=True)     # frozen: immutable. order: adds <, >, sorting\nclass Version:\n    major: int\n    minor: int = 0\n\nprint(Version(1, 2) < Version(1, 10))\nprint(sorted([Version(2), Version(1, 5), Version(1)]))\n# Output:\n# True\n# [Version(major=1, minor=0), Version(major=1, minor=5), Version(major=2, minor=0)]\n```\n\nPython 3.10+ also lets you write `@dataclass(slots=True)` (less memory, faster attribute access) and `kw_only=True` (callers must name every field). `__post_init__` runs right after `__init__`, perfect for validation (the capstone does this).\n\n### Common mistakes\n- Forgetting `self` as the first parameter of a method, or forgetting `self.` before an attribute (`name = name` does nothing useful).\n- Mutable default arguments: `def __init__(self, items=[])` shares **one list across every instance**. In dataclasses, Python refuses `= []` and makes you use `field(default_factory=list)`. In plain classes, use `items=None` and then write `if items is None: items = []` inside `__init__`.\n- Overriding `__init__` in a child and forgetting `super().__init__(...)`.\n- Defining `__eq__` without realizing it makes objects unhashable by default (they can't be dict keys or set members unless you also define `__hash__`, or use `frozen=True` dataclasses).\n- Reaching for inheritance when composition is simpler.\n- Confusing class attributes (shared) with instance attributes (per object).\n\n### Practice\n1. Write a `BankAccount` class with `deposit`, `withdraw` (raise `ValueError` if overdrawn), and a `balance` property. Add `__repr__`.\n2. Create `Shape` with an `area()` method returning 0, then `Rectangle` and `Circle` subclasses that override it. Loop over a mixed list and print each area rounded to 2 decimals.\n3. Make a frozen dataclass `Point(x, y)` with a method `distance_to(other)`. Prove it's frozen by catching the error when you try to change `x`.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nclass BankAccount:\n    def __init__(self, owner, balance=0):\n        self.owner = owner\n        self._balance = balance      # leading underscore: \"internal, please don't touch\"\n\n    @property\n    def balance(self):\n        return self._balance\n\n    def deposit(self, amount):\n        if amount <= 0:\n            raise ValueError(\"deposit must be positive\")\n        self._balance += amount\n\n    def withdraw(self, amount):\n        if amount > self._balance:\n            raise ValueError(\"insufficient funds\")\n        self._balance -= amount\n\n    def __repr__(self):\n        return f\"BankAccount({self.owner!r}, balance={self._balance})\"\n\nacct = BankAccount(\"Ada\", 100)\nacct.deposit(50)\nacct.withdraw(30)\nprint(acct)  # BankAccount('Ada', balance=120)\n\n# 2\nimport math\n\nclass Shape:\n    def area(self):\n        return 0\n\nclass Rectangle(Shape):\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n    def area(self):\n        return self.w * self.h\n\nclass Circle(Shape):\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        return math.pi * self.r ** 2\n\nfor s in [Rectangle(2, 3), Circle(1), Shape()]:\n    print(round(s.area(), 2))   # 6, 3.14, 0\n\n# 3\nimport math\nfrom dataclasses import dataclass, FrozenInstanceError\n\n@dataclass(frozen=True)\nclass Point:\n    x: float\n    y: float\n\n    def distance_to(self, other):\n        return math.hypot(self.x - other.x, self.y - other.y)\n\np = Point(0, 0)\nprint(p.distance_to(Point(3, 4)))   # 5.0\ntry:\n    p.x = 10\nexcept FrozenInstanceError:\n    print(\"frozen!\")\n```\n\n<\/details>\n\n## Module 6: JSON and APIs with `requests`\n**Goal:** Convert data to and from JSON and fetch live data from web APIs safely.\n\nAn **API** (application programming interface) is a way for programs to talk to each other, usually over HTTP. A web API takes a request (a URL plus some options) and returns data, almost always in **JSON**.\n\n### JSON in Python\n\nJSON looks like Python dicts and lists but is plain text. The `json` module converts between the two.\n\n```python\nimport json\n\nperson = {\"name\": \"Ada\", \"langs\": [\"python\", \"c\"], \"active\": True, \"boss\": None}\n\ntext = json.dumps(person, indent=2)     # Python -> JSON string (\"dump string\")\nprint(text)\n# Output:\n# {\n#   \"name\": \"Ada\",\n#   \"langs\": [\n#     \"python\",\n#     \"c\"\n#   ],\n#   \"active\": true,\n#   \"boss\": null\n# }\n\nback = json.loads(text)                 # JSON string -> Python (\"load string\")\nprint(back[\"langs\"][0], back[\"active\"], back[\"boss\"])\n# Output: python True None\n```\n\n| Python | JSON |\n|--------|------|\n| `dict` | object `{}` |\n| `list`, `tuple` | array `[]` |\n| `str` | string |\n| `int`, `float` | number |\n| `True` / `False` / `None` | `true` / `false` / `null` |\n\nTo work with files, use `dump` and `load` (no \"s\"):\n\n```python\nimport json\n\nwith open(\"person.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump({\"name\": \"Ada\"}, f, indent=2)\n\nwith open(\"person.json\", encoding=\"utf-8\") as f:\n    print(json.load(f))\n# Output: {'name': 'Ada'}\n```\n\nJSON cannot store `set`, `datetime`, or your own objects directly; convert them to simple types first (strings, lists, dicts). That is why the capstone has `to_dict()`.\n\n### Installing `requests`\n\n`requests` is the friendliest HTTP library in Python. Install it **inside your virtual environment**:\n\n```bash\npython -m pip install requests\n```\n\n### Your first GET request\n\nThis uses JSONPlaceholder, a free fake API made for practice.\n\n```python\nimport requests\n\nresponse = requests.get(\"https://jsonplaceholder.typicode.com/todos/1\", timeout=10)\n\nprint(response.status_code)\nprint(response.json())\n# Output:\n# 200\n# {'userId': 1, 'id': 1, 'title': 'delectus aut autem', 'completed': False}\n```\n\n- `status_code`: `200` means OK, `404` not found, `401/403` not allowed, `429` too many requests, `5xx` the server broke.\n- `.json()` parses the body for you.\n- **Always set `timeout=`.** Without it, `requests` can wait forever on a stuck server.\n\n### Query parameters\n\nDon't build URLs by hand; pass `params`:\n\n```python\nimport requests\n\nresponse = requests.get(\n    \"https://jsonplaceholder.typicode.com/todos\",\n    params={\"userId\": 1, \"completed\": \"true\"},\n    timeout=10,\n)\nprint(response.url)\nprint(len(response.json()), \"completed todos for user 1\")\n# Output:\n# https://jsonplaceholder.typicode.com/todos?userId=1&completed=true\n# 11 completed todos for user 1\n```\n\n(The count comes from live data and could change; the idea is what matters.)\n\n### Sending data with POST\n\n```python\nimport requests\n\nresponse = requests.post(\n    \"https://jsonplaceholder.typicode.com/posts\",\n    json={\"title\": \"hello\", \"body\": \"first post\", \"userId\": 1},   # json= encodes for you\n    timeout=10,\n)\nprint(response.status_code)\nprint(response.json()[\"id\"])\n# Output:\n# 201\n# 101\n```\n\n`201 Created` is the \"success, I made a new thing\" code. (This practice API pretends to save; nothing really persists.)\n\n### Handling failure properly\n\nNetworks fail. Handle it.\n\n```python\nimport requests\n\ndef fetch_todo(todo_id):\n    url = f\"https://jsonplaceholder.typicode.com/todos/{todo_id}\"\n    try:\n        response = requests.get(url, timeout=10)\n        response.raise_for_status()      # turns 4xx/5xx into an exception\n    except requests.exceptions.Timeout:\n        raise RuntimeError(\"the server took too long\") from None\n    except requests.exceptions.HTTPError as exc:\n        raise RuntimeError(f\"server said {exc.response.status_code}\") from exc\n    except requests.exceptions.RequestException as exc:   # base class: DNS, offline, etc.\n        raise RuntimeError(f\"network problem: {exc}\") from exc\n    return response.json()\n\nprint(fetch_todo(1)[\"title\"])\n# Output: delectus aut autem\n\ntry:\n    fetch_todo(99999)\nexcept RuntimeError as exc:\n    print(exc)\n# Output: server said 404\n```\n\nOrder matters: catch the specific exceptions first, the base class `RequestException` last.\n\n### Headers, API keys, and sessions\n\nMany APIs need a key. **Never write secrets in your code** (it ends up on GitHub). Read them from an environment variable.\n\n```python\nimport os\nimport requests\n\ntoken = os.environ.get(\"GITHUB_TOKEN\")          # set in your terminal, never in the file\nheaders = {\"Accept\": \"application/vnd.github+json\"}\nif token:\n    headers[\"Authorization\"] = f\"Bearer {token}\"\n\nwith requests.Session() as session:             # reuses the connection; shares headers\n    session.headers.update(headers)\n    repo = session.get(\"https://api.github.com/repos/python/cpython\", timeout=10).json()\n    print(repo[\"full_name\"], repo[\"language\"])\n# Output: python/cpython Python\n```\n\nBe polite: read the API's docs, respect rate limits (a `429` response means slow down), and cache results you've already fetched. Websites' terms of service apply to scraping too.\n\n### Common mistakes\n- Forgetting `timeout=`, so a program hangs forever.\n- Not checking the status code (`raise_for_status()`), then trying to `.json()` an error page.\n- Using `json.loads` on a dict (it wants a string) or `response.json` without the parentheses.\n- Hard-coding API keys in source code.\n- Building query strings with f-strings instead of `params=`, so special characters break.\n- Assuming a key exists in the response. Use `data.get(\"key\")` or handle `KeyError`.\n- Hammering an API in a tight loop and getting rate-limited or banned.\n\n### Practice\n1. Convert a list of dicts (students with name and grade) to JSON, save it to `students.json`, then load it back and print the highest grade.\n2. Fetch `https://jsonplaceholder.typicode.com/users/1` and print the user's name and the city of their address (dig through the nested dicts).\n3. Write `get_user_name(user_id)` that returns the user's name or `None` when the API returns a 404. Test it with ids `1` and `9999`.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nimport json\n\nstudents = [{\"name\": \"Ada\", \"grade\": 95}, {\"name\": \"Linus\", \"grade\": 88}]\nwith open(\"students.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(students, f, indent=2)\n\nwith open(\"students.json\", encoding=\"utf-8\") as f:\n    loaded = json.load(f)\nprint(max(s[\"grade\"] for s in loaded))  # 95\n\n# 2\nimport requests\n\nuser = requests.get(\"https://jsonplaceholder.typicode.com/users/1\", timeout=10).json()\nprint(user[\"name\"], \"lives in\", user[\"address\"][\"city\"])\n# Leanne Graham lives in Gwenborough\n\n# 3\nimport requests\n\ndef get_user_name(user_id):\n    response = requests.get(\n        f\"https://jsonplaceholder.typicode.com/users/{user_id}\", timeout=10\n    )\n    if response.status_code == 404:\n        return None\n    response.raise_for_status()\n    return response.json()[\"name\"]\n\nprint(get_user_name(1))     # Leanne Graham\nprint(get_user_name(9999))  # None\n```\n\n<\/details>\n\n## Module 7: Testing with pytest\n**Goal:** Write automated tests that catch bugs before your users do.\n\nA **test** is a small function that runs your code and checks the result. Once you have tests, you can change code fearlessly: if something breaks, a red test tells you immediately. Professionals write tests because manually re-checking everything after each change does not scale.\n\n### Setup\n\n```bash\npython -m pip install pytest\n```\n\nSuppose this is `calculator.py`:\n\n```python\ndef add(a, b):\n    return a + b\n\ndef divide(a, b):\n    if b == 0:\n        raise ZeroDivisionError(\"cannot divide by zero\")\n    return a / b\n\ndef is_palindrome(text):\n    cleaned = \"\".join(ch.lower() for ch in text if ch.isalnum())\n    return cleaned == cleaned[::-1]\n```\n\nAnd `test_calculator.py` next to it:\n\n```python\nimport pytest\nfrom calculator import add, divide, is_palindrome\n\ndef test_add():\n    assert add(2, 3) == 5\n\ndef test_divide():\n    assert divide(10, 4) == 2.5\n\ndef test_divide_by_zero_raises():\n    with pytest.raises(ZeroDivisionError):\n        divide(1, 0)\n\ndef test_palindrome_ignores_case_and_punctuation():\n    assert is_palindrome(\"A man, a plan, a canal: Panama\")\n    assert not is_palindrome(\"hello\")\n```\n\nRules pytest follows automatically: files named `test_*.py`, functions named `test_*`. A test **passes** if it finishes without an exception. `assert` is the whole API: if the condition is false, the test fails.\n\nRun it:\n\n```bash\npytest -v\n```\n\n```text\ntest_calculator.py::test_add PASSED\ntest_calculator.py::test_divide PASSED\ntest_calculator.py::test_divide_by_zero_raises PASSED\ntest_calculator.py::test_palindrome_ignores_case_and_punctuation PASSED\n\n4 passed in 0.01s\n```\n\nWhen a test fails, pytest shows exactly what the two sides were:\n\n```text\n    def test_add():\n>       assert add(2, 3) == 6\nE       assert 5 == 6\nE        +  where 5 = add(2, 3)\n```\n\n### Parametrize: many cases, one test\n\n```python\n@pytest.mark.parametrize(\n    \"text, expected\",\n    [\n        (\"racecar\", True),\n        (\"Racecar\", True),\n        (\"python\", False),\n        (\"\", True),\n    ],\n)\ndef test_is_palindrome(text, expected):\n    assert is_palindrome(text) == expected\n```\n\nEach row runs as its own test, with its own pass/fail line. Edge cases (empty input, zero, negatives, very large values) are where bugs hide, so add rows for them.\n\n### Fixtures: shared setup\n\nA **fixture** is a function that prepares something a test needs. Tests ask for it by naming it as a parameter.\n\n```python\nimport pytest\n\nclass Cart:\n    def __init__(self):\n        self.items = []\n    def add(self, name, price):\n        self.items.append((name, price))\n    def total(self):\n        return sum(price for _, price in self.items)\n\n@pytest.fixture\ndef cart():\n    c = Cart()\n    c.add(\"pen\", 2)\n    c.add(\"book\", 10)\n    return c                      # each test gets a brand-new cart\n\ndef test_total(cart):\n    assert cart.total() == 12\n\ndef test_add_changes_total(cart):\n    cart.add(\"bag\", 30)\n    assert cart.total() == 42\n```\n\nBuilt-in fixtures you will use constantly:\n\n- `tmp_path`: a fresh temporary folder (a `Path`) per test, so your tests never touch real files.\n- `capsys`: captures what the code `print`s.\n- `monkeypatch`: temporarily replaces things (functions, env vars) for one test.\n\n```python\ndef test_writes_file(tmp_path):\n    target = tmp_path / \"out.txt\"\n    target.write_text(\"hi\", encoding=\"utf-8\")\n    assert target.read_text(encoding=\"utf-8\") == \"hi\"\n\ndef test_prints_greeting(capsys):\n    print(\"hello\")\n    assert capsys.readouterr().out == \"hello\\n\"\n```\n\n### Testing code that uses the network\n\nTests should be **fast, repeatable, and offline**. Replace the network call with a fake using `monkeypatch`.\n\n```python\n# todos.py\nimport requests\n\ndef todo_title(todo_id):\n    response = requests.get(f\"https://example.test/todos/{todo_id}\", timeout=10)\n    response.raise_for_status()\n    return response.json()[\"title\"]\n```\n\n```python\n# test_todos.py\nimport todos\n\nclass FakeResponse:\n    def raise_for_status(self):\n        pass\n    def json(self):\n        return {\"title\": \"write tests\"}\n\ndef test_todo_title(monkeypatch):\n    def fake_get(url, timeout):\n        assert url == \"https://example.test/todos/7\"\n        return FakeResponse()\n\n    monkeypatch.setattr(todos.requests, \"get\", fake_get)\n    assert todos.todo_title(7) == \"write tests\"\n```\n\nNo internet needed, and the test checks *your* logic, not someone else's server.\n\n### Running just what you need\n\n```bash\npytest tests/test_calculator.py            # one file\npytest tests/test_calculator.py::test_add  # one test\npytest -k palindrome                       # tests whose name contains \"palindrome\"\npytest -x                                  # stop at the first failure\npytest -q                                  # quiet output\n```\n\nWhile developing, run the single test you're working on; run everything before you finish.\n\n### The test-first habit (TDD)\n\n1. Write a small test for behavior that doesn't exist yet. Watch it **fail** (red).\n2. Write the least code that makes it pass (green).\n3. Tidy the code, rerun tests (refactor).\n\nEven if you don't do this every time, writing a test the moment you find a bug (\"reproduce it, then fix it\") is a superpower.\n\n### What makes a good test\n- Tests one behavior, with a name that says what (`test_withdraw_more_than_balance_raises`).\n- Independent: no test depends on another running first.\n- Uses `tmp_path`, never your real files; no real network or real clock.\n- Checks results, not implementation details.\n\n### Common mistakes\n- Naming the file or function without the `test` prefix, so pytest silently skips it.\n- Tests that depend on order or on leftover files from a previous run.\n- Asserting floats with `==` (`0.1 + 0.2 == 0.3` is `False`); use `pytest.approx(0.3)`.\n- Hitting the real internet in tests, which makes them slow and flaky.\n- A test with no `assert` at all; it can never fail, so it proves nothing.\n- Naming your own file `test.py` or `pytest.py`, which can confuse imports.\n\n### Practice\n1. Write a function `clamp(value, low, high)` and three tests, including one where `value` is below `low`.\n2. Use `@pytest.mark.parametrize` to test a `fizzbuzz(n)` function for `1, 3, 5, 15`.\n3. Write `save_note(path, text)` that writes a file, and test it with `tmp_path`. Add a second test that checks a missing parent folder raises `FileNotFoundError`.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# test_practice.py\nimport pytest\n\n# 1\ndef clamp(value, low, high):\n    return max(low, min(value, high))\n\ndef test_clamp_inside():\n    assert clamp(5, 0, 10) == 5\n\ndef test_clamp_below():\n    assert clamp(-3, 0, 10) == 0\n\ndef test_clamp_above():\n    assert clamp(99, 0, 10) == 10\n\n# 2\ndef fizzbuzz(n):\n    if n % 15 == 0:\n        return \"FizzBuzz\"\n    if n % 3 == 0:\n        return \"Fizz\"\n    if n % 5 == 0:\n        return \"Buzz\"\n    return str(n)\n\n@pytest.mark.parametrize(\n    \"n, expected\",\n    [(1, \"1\"), (3, \"Fizz\"), (5, \"Buzz\"), (15, \"FizzBuzz\")],\n)\ndef test_fizzbuzz(n, expected):\n    assert fizzbuzz(n) == expected\n\n# 3\ndef save_note(path, text):\n    path.write_text(text, encoding=\"utf-8\")\n\ndef test_save_note(tmp_path):\n    note = tmp_path / \"note.txt\"\n    save_note(note, \"remember\")\n    assert note.read_text(encoding=\"utf-8\") == \"remember\"\n\ndef test_save_note_missing_folder(tmp_path):\n    with pytest.raises(FileNotFoundError):\n        save_note(tmp_path / \"nope\" / \"note.txt\", \"x\")\n```\n\n<\/details>\n\n## Module 8: Capstone Project — Expense Tracker CLI\n**Goal:** Combine files, exceptions, packages, dataclasses, JSON, and pytest into one real command-line app.\n\nYou will build `tracker`, a command-line expense tracker:\n\n```text\npython -m tracker add 4.50 coffee -d \"latte\"\npython -m tracker list\npython -m tracker summary\n```\n\nIt stores data in a JSON file, rejects bad input with custom exceptions, and ships with tests. (The `requests` skills from Module 6 are an easy stretch goal: see the end.)\n\n### Step 1: Project layout and venv\n\n```bash\nmkdir expense-tracker && cd expense-tracker\npython -m venv .venv\nsource .venv/bin/activate          # Windows: .venv\\Scripts\\activate\npython -m pip install pytest\nmkdir tracker tests\ntouch tracker/__init__.py\n```\n\nYour final tree:\n\n```text\nexpense-tracker/\n    .venv/                (never commit this)\n    tracker/\n        __init__.py\n        __main__.py\n        models.py\n        storage.py\n        cli.py\n    tests/\n        test_tracker.py\n```\n\n### Step 2: The model (`tracker/models.py`)\n\nA dataclass holds one expense; `__post_init__` validates it; our own exception types give callers something precise to catch. Money is kept as a `float` rounded to cents to keep this project simple. Real accounting software uses `decimal.Decimal` or integer cents, a great upgrade later.\n\n```python\n# tracker/models.py\nfrom dataclasses import asdict, dataclass, field\nfrom datetime import date\n\n\nclass TrackerError(Exception):\n    \"\"\"Base class for every error this app raises on purpose.\"\"\"\n\n\nclass InvalidExpenseError(TrackerError):\n    \"\"\"The expense data makes no sense (negative amount, empty category...).\"\"\"\n\n\nclass StorageError(TrackerError):\n    \"\"\"The data file could not be read or written.\"\"\"\n\n\n@dataclass\nclass Expense:\n    amount: float\n    category: str\n    description: str = \"\"\n    day: str = field(default_factory=lambda: date.today().isoformat())\n\n    def __post_init__(self):\n        if self.amount <= 0:\n            raise InvalidExpenseError(f\"amount must be positive, got {self.amount}\")\n        self.category = self.category.strip().lower()\n        if not self.category:\n            raise InvalidExpenseError(\"category cannot be empty\")\n        self.amount = round(self.amount, 2)\n\n    def to_dict(self) -> dict:\n        return asdict(self)\n\n    @classmethod\n    def from_dict(cls, data: dict) -> \"Expense\":\n        try:\n            return cls(**data)\n        except TypeError as exc:  # missing or unexpected keys\n            raise InvalidExpenseError(f\"bad expense record {data!r}: {exc}\") from exc\n```\n\n### Step 3: Storage (`tracker/storage.py`)\n\nTwo functions: `load` and `save`. A missing file is normal on first run (no expenses yet), but a *corrupt* file is an error worth reporting. `save` writes to a temporary file and then swaps it into place, so a crash mid-write cannot destroy your existing data.\n\n```python\n# tracker/storage.py\nimport json\nfrom pathlib import Path\n\nfrom .models import Expense, StorageError\n\n\ndef load(path: Path) -> list[Expense]:\n    \"\"\"Read all expenses from `path`. A missing file just means 'no expenses yet'.\"\"\"\n    if not path.exists():\n        return []\n    try:\n        with path.open(encoding=\"utf-8\") as f:\n            raw = json.load(f)\n    except json.JSONDecodeError as exc:\n        raise StorageError(f\"{path} is not valid JSON: {exc}\") from exc\n    return [Expense.from_dict(item) for item in raw]\n\n\ndef save(path: Path, expenses: list[Expense]) -> None:\n    \"\"\"Write to a temp file first, then swap it in, so a crash can't corrupt data.\"\"\"\n    tmp = path.with_suffix(\".tmp\")\n    with tmp.open(\"w\", encoding=\"utf-8\") as f:\n        json.dump([e.to_dict() for e in expenses], f, indent=2)\n    tmp.replace(path)\n```\n\n### Step 4: The command-line interface (`tracker/cli.py`)\n\n`argparse` (standard library) turns `add 4.50 coffee -d latte` into Python values and writes `--help` for you. `main` takes an optional list of arguments, which makes it **testable**: tests call `main([...])` directly instead of launching a process. It returns an exit code (`0` = success, `1` = error), the standard convention for command-line tools. The type hint `list[str] | None` requires Python 3.10+, which is fine for this course.\n\n```python\n# tracker/cli.py\nimport argparse\nfrom collections import defaultdict\nfrom pathlib import Path\n\nfrom . import storage\nfrom .models import Expense, TrackerError\n\nDEFAULT_FILE = Path(\"expenses.json\")\n\n\ndef build_parser() -> argparse.ArgumentParser:\n    parser = argparse.ArgumentParser(prog=\"tracker\", description=\"Track your spending.\")\n    parser.add_argument(\"--file\", type=Path, default=DEFAULT_FILE, help=\"data file\")\n    sub = parser.add_subparsers(dest=\"command\", required=True)\n\n    add = sub.add_parser(\"add\", help=\"record an expense\")\n    add.add_argument(\"amount\", type=float)\n    add.add_argument(\"category\")\n    add.add_argument(\"-d\", \"--description\", default=\"\")\n\n    sub.add_parser(\"list\", help=\"show all expenses\")\n    sub.add_parser(\"summary\", help=\"totals per category\")\n    return parser\n\n\ndef summarize(expenses: list[Expense]) -> dict[str, float]:\n    totals: dict[str, float] = defaultdict(float)\n    for e in expenses:\n        totals[e.category] += e.amount\n    return dict(sorted(totals.items(), key=lambda item: item[1], reverse=True))\n\n\ndef main(argv: list[str] | None = None) -> int:\n    args = build_parser().parse_args(argv)\n    try:\n        expenses = storage.load(args.file)\n\n        if args.command == \"add\":\n            expense = Expense(args.amount, args.category, args.description)\n            expenses.append(expense)\n            storage.save(args.file, expenses)\n            print(f\"Added {expense.amount:.2f} to {expense.category}\")\n        elif args.command == \"list\":\n            for e in expenses:\n                print(f\"{e.day}  {e.amount:>8.2f}  {e.category:<10} {e.description}\")\n        elif args.command == \"summary\":\n            for category, total in summarize(expenses).items():\n                print(f\"{category:<10} {total:>8.2f}\")\n            print(f\"{'TOTAL':<10} {sum(e.amount for e in expenses):>8.2f}\")\n    except TrackerError as exc:\n        print(f\"Error: {exc}\")\n        return 1\n    return 0\n```\n\nAnd the tiny entry point that makes `python -m tracker` work:\n\n```python\n# tracker/__main__.py\nimport sys\n\nfrom .cli import main\n\nsys.exit(main())\n```\n\n### Step 5: Try it\n\n```bash\npython -m tracker add 4.50 Coffee -d \"latte\"\npython -m tracker add 30 food\npython -m tracker list\npython -m tracker summary\n```\n\n```text\nAdded 4.50 to coffee\nAdded 30.00 to food\n2026-10-31      4.50  coffee     latte\n2026-10-31     30.00  food       \nfood          30.00\ncoffee         4.50\nTOTAL         34.50\n```\n\n(Your dates will differ.) Try `python -m tracker add -5 food`. You should get `Error: amount must be positive, got -5.0` and no traceback.\n\n### Step 6: Tests (`tests/test_tracker.py`)\n\nWe test the model, the storage, the summary maths, and the whole CLI end to end, all using `tmp_path` so your real data is never touched.\n\n```python\n# tests/test_tracker.py\nimport json\n\nimport pytest\n\nfrom tracker import storage\nfrom tracker.cli import main, summarize\nfrom tracker.models import Expense, InvalidExpenseError, StorageError\n\n\ndef test_expense_normalizes_category():\n    e = Expense(5, \"  Food \")\n    assert e.category == \"food\"\n\n\n@pytest.mark.parametrize(\"amount\", [0, -1, -0.01])\ndef test_expense_rejects_non_positive_amounts(amount):\n    with pytest.raises(InvalidExpenseError):\n        Expense(amount, \"food\")\n\n\ndef test_round_trip(tmp_path):\n    path = tmp_path / \"data.json\"\n    original = [Expense(3.5, \"coffee\", \"latte\", \"2026-01-02\")]\n    storage.save(path, original)\n    assert storage.load(path) == original\n\n\ndef test_load_missing_file_is_empty(tmp_path):\n    assert storage.load(tmp_path / \"nope.json\") == []\n\n\ndef test_load_corrupt_file_raises(tmp_path):\n    path = tmp_path / \"bad.json\"\n    path.write_text(\"{not json\")\n    with pytest.raises(StorageError):\n        storage.load(path)\n\n\ndef test_summarize_sorts_biggest_first():\n    expenses = [Expense(5, \"food\"), Expense(20, \"rent\"), Expense(7, \"food\")]\n    assert summarize(expenses) == {\"rent\": 20, \"food\": 12}\n\n\ndef test_cli_add_then_summary(tmp_path, capsys):\n    data = str(tmp_path / \"e.json\")\n    assert main([\"--file\", data, \"add\", \"12.5\", \"Food\", \"-d\", \"lunch\"]) == 0\n    assert main([\"--file\", data, \"summary\"]) == 0\n    out = capsys.readouterr().out\n    assert \"Added 12.50 to food\" in out\n    assert \"TOTAL\" in out and \"12.50\" in out\n    assert json.loads((tmp_path / \"e.json\").read_text())[0][\"category\"] == \"food\"\n\n\ndef test_cli_reports_bad_amount(tmp_path, capsys):\n    assert main([\"--file\", str(tmp_path / \"e.json\"), \"add\", \"-5\", \"food\"]) == 1\n    assert \"Error\" in capsys.readouterr().out\n```\n\nRun from the project root:\n\n```bash\npytest -q\n```\n\n```text\n..........                                                               [100%]\n10 passed in 0.02s\n```\n\n(`tests/` has no `__init__.py`; running `python -m pytest` from the project root puts the root on the import path so `from tracker import ...` works. Plain `pytest` may need that too.)\n\n### Step 7: Stretch goals\n1. Add a `delete <index>` command and tests for it.\n2. Add `--category` filtering to `list`.\n3. Add `export-json` / `export-csv` commands (Module 1 + 6 skills).\n4. Use `requests` to fetch a currency exchange rate from a free API (for example Frankfurter, `https://api.frankfurter.dev`; check its docs first) and add a `summary --in EUR` option. Write a test that fakes the network with `monkeypatch`.\n5. Replace `float` with `decimal.Decimal` or integer cents.\n\n### Common mistakes\n- Running `pytest` from the wrong folder so `tracker` can't be imported. Use `python -m pytest` from the project root.\n- Running `python tracker/cli.py` instead of `python -m tracker` (breaks the relative imports).\n- Catching `Exception` in `main` instead of your base `TrackerError`, hiding genuine bugs.\n- Letting tests write to the real `expenses.json` instead of `tmp_path`.\n- Forgetting `encoding=\"utf-8\"` when opening files.\n\n### Practice\n1. Add the `delete` command from the stretch goals: write the test first, watch it fail, then make it pass.\n2. Add a `total` command that prints just the grand total, and a test that checks its output with `capsys`.\n3. Make `Expense` reject future-dated `day` values by raising `InvalidExpenseError`, with a parametrized test covering valid and invalid dates.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1 -- in cli.py build_parser():\n#     delete = sub.add_parser(\"delete\", help=\"remove an expense by its list position\")\n#     delete.add_argument(\"index\", type=int)\n#\n# in main(), add this branch:\n#     elif args.command == \"delete\":\n#         if not 1 <= args.index <= len(expenses):\n#             raise InvalidExpenseError(f\"no expense number {args.index}\")\n#         removed = expenses.pop(args.index - 1)\n#         storage.save(args.file, expenses)\n#         print(f\"Deleted {removed.amount:.2f} {removed.category}\")\n# (import InvalidExpenseError from .models)\n\n# test:\ndef test_cli_delete(tmp_path, capsys):\n    data = str(tmp_path / \"e.json\")\n    main([\"--file\", data, \"add\", \"5\", \"food\"])\n    main([\"--file\", data, \"add\", \"9\", \"rent\"])\n    assert main([\"--file\", data, \"delete\", \"1\"]) == 0\n    capsys.readouterr()\n    main([\"--file\", data, \"list\"])\n    out = capsys.readouterr().out\n    assert \"rent\" in out and \"food\" not in out\n    assert main([\"--file\", data, \"delete\", \"5\"]) == 1\n\n# 2 -- in build_parser(): sub.add_parser(\"total\", help=\"grand total only\")\n# in main():\n#     elif args.command == \"total\":\n#         print(f\"{sum(e.amount for e in expenses):.2f}\")\ndef test_cli_total(tmp_path, capsys):\n    data = str(tmp_path / \"e.json\")\n    main([\"--file\", data, \"add\", \"5\", \"food\"])\n    main([\"--file\", data, \"add\", \"2.5\", \"food\"])\n    capsys.readouterr()\n    main([\"--file\", data, \"total\"])\n    assert capsys.readouterr().out.strip() == \"7.50\"\n\n# 3 -- in Expense.__post_init__ (after the category check):\n#     if date.fromisoformat(self.day) > date.today():\n#         raise InvalidExpenseError(f\"date {self.day} is in the future\")\nimport pytest\nfrom tracker.models import Expense, InvalidExpenseError\n\n@pytest.mark.parametrize(\"day, ok\", [(\"2020-01-01\", True), (\"2999-01-01\", False)])\ndef test_future_dates_rejected(day, ok):\n    if ok:\n        assert Expense(1, \"food\", day=day).day == day\n    else:\n        with pytest.raises(InvalidExpenseError):\n            Expense(1, \"food\", day=day)\n```\n\n<\/details>\n", "python-expert": "# Python — Expert\n\nThis level is about writing Python the way experienced engineers do: code that is typed, fast enough, safe under concurrency, easy to test, and easy for other people (and future you) to install and maintain. You will learn the machinery *behind* the syntax you already use: how decorators really work, what a `with` block calls under the hood, and why one kind of concurrency helps some programs and does nothing for others. You will also learn to measure before you optimize and to package a project the modern way with `pyproject.toml` and `uv`. Everything targets **Python 3.12 or newer**, and where something is brand new (3.13 and 3.14) it is labeled. Expect to slow down and experiment here: change the examples, break them, and predict what will happen before you run them.\n\n## Module 1: Type Hints and mypy\n**Goal:** Annotate code with types and use mypy to catch whole categories of bugs before the program ever runs.\n\n### What type hints are (and are not)\n\nA **type hint** says what kind of value a variable, parameter, or return value is supposed to be.\n\n```python\ndef greet(name: str, times: int = 1) -> str:\n    return \", \".join([f\"hi {name}\"] * times)\n\nprint(greet(\"Ada\", 2))\n# Output: hi Ada, hi Ada\n```\n\nThe crucial thing to understand: **Python ignores type hints at runtime.** `greet(\"Ada\", \"3\")` would still run (and fail in a confusing way). The hints are for two audiences:\n\n1. **Humans.** Signatures become documentation that cannot go out of date as easily as comments.\n2. **Tools.** Editors use them for autocomplete and refactoring. A **type checker** such as `mypy` reads them and finds mistakes *without running your code*.\n\nOn a small script they feel like extra typing. On a 20,000-line project with five people, they are one of the best bug-prevention tools you have.\n\n### The everyday vocabulary\n\n```python\nfrom collections.abc import Callable, Iterable, Mapping, Sequence\n\ncount: int = 0\nratio: float = 0.5\nnames: list[str] = [\"ada\", \"linus\"]\nscores: dict[str, int] = {\"ada\": 95}\npoint: tuple[float, float] = (1.0, 2.0)          # exactly two floats\nnumbers: tuple[int, ...] = (1, 2, 3)             # any number of ints\nnickname: str | None = None                      # a str, or None  (3.10+; was Optional[str])\n\ndef total(values: Iterable[float]) -> float:     # accepts a list, tuple, set, generator...\n    return sum(values)\n\ndef apply(func: Callable[[int], int], value: int) -> int:   # a function taking int, returning int\n    return func(value)\n\ndef lookup(table: Mapping[str, int], key: str) -> int | None:\n    return table.get(key)\n\nprint(total([1, 2.5]), apply(lambda n: n * 2, 4), lookup(scores, \"ada\"))\n# Output: 3.5 8 95\n```\n\nA design rule worth memorizing: **accept the most general type you need, return the most specific.** A function that only loops over its input should take `Iterable[...]`, not `list[...]`. That way callers can pass a list, a set, or a generator. (`collections.abc` is where these abstract types live; the old `typing.List`, `typing.Dict` spellings are deprecated style.)\n\n### Richer types\n\n```python\nfrom typing import Final, Literal, NamedTuple, TypedDict\n\nMAX_USERS: Final = 100                       # a constant; the checker flags reassignment\n\nMode = Literal[\"r\", \"w\", \"a\"]                # only these exact values are allowed\n\ndef open_log(mode: Mode) -> str:\n    return f\"opened in {mode} mode\"\n\nclass Movie(TypedDict):                      # a dict with known string keys\n    title: str\n    year: int\n\nclass Coordinate(NamedTuple):                # a tuple with named, typed fields\n    lat: float\n    lon: float\n\nfilm: Movie = {\"title\": \"Alien\", \"year\": 1979}\nspot = Coordinate(40.7, -74.0)\nprint(open_log(\"w\"), film[\"title\"], spot.lat)\n# Output: opened in w mode Alien 40.7\n```\n\n### Generics, the Python 3.12 way\n\nA **generic** function or class works with *any* type but remembers which one. Before 3.12 this needed awkward `TypeVar` boilerplate. Python 3.12 added clean syntax (PEP 695):\n\n```python\nimport math\nfrom collections.abc import Sequence\n\ndef first[T](items: Sequence[T]) -> T:       # [T] declares a type variable\n    return items[0]\n\nclass Stack[T]:\n    def __init__(self) -> None:\n        self._items: list[T] = []\n\n    def push(self, item: T) -> None:\n        self._items.append(item)\n\n    def pop(self) -> T:\n        return self._items.pop()\n\ntype Point = tuple[float, float]             # a type alias, also new in 3.12\n\ndef distance(p: Point) -> float:\n    return math.hypot(p[0], p[1])\n\nstack = Stack[int]()\nstack.push(1)\nstack.push(2)\nprint(first([10, 20]), first(\"abc\"), stack.pop(), distance((3, 4)))\n# Output: 10 a 2 5.0\n```\n\n`first([10, 20])` is known to return an `int`, and `first(\"abc\")` a `str`. The type variable links input to output. You can also bound a type variable: `def biggest[T: (int, float)](a: T, b: T) -> T` restricts `T` to certain types.\n\nPython 3.12 also added `@override` (from `typing`), which marks a method as intentionally replacing a parent's. If you misspell the name, the checker tells you.\n\n### Protocols: duck typing with a safety net\n\nPython is built on *duck typing* (\"if it quacks like a duck...\"). A `Protocol` lets you describe the required behavior without forcing inheritance.\n\n```python\nfrom typing import Protocol\n\nclass SupportsClose(Protocol):\n    def close(self) -> None: ...\n\nclass Resource:\n    def close(self) -> None:          # note: does NOT inherit from SupportsClose\n        print(\"closed\")\n\ndef shutdown(thing: SupportsClose) -> None:\n    thing.close()\n\nshutdown(Resource())\n# Output: closed\n```\n\nAnything with a matching `close()` method is accepted. This is **structural typing**, and it keeps code decoupled.\n\n### Running mypy\n\n```bash\nuv add --dev mypy          # or: python -m pip install mypy\nmypy script.py\nmypy --strict src/         # the \"everything on\" mode\n```\n\nHere is a file with several deliberate mistakes:\n\n```python\nfrom typing import TypedDict, override\n\ndef greet(name: str, times: int = 1) -> str:\n    return \", \".join([f\"hi {name}\"] * times)\n\ngreet(\"Ada\", \"3\")            # wrong argument type\nx: int = greet(\"Bob\")        # str assigned to an int variable\n\ndef first_word(text: str | None) -> str:\n    return text.split()[0]   # text might be None!\n\nclass Movie(TypedDict):\n    title: str\n    year: int\n\nm: Movie = {\"title\": \"Alien\", \"year\": \"1979\"}\n\nclass Animal:\n    def speak(self) -> str:\n        return \"...\"\n\nclass Dog(Animal):\n    @override\n    def speek(self) -> str:   # typo\n        return \"woof\"\n```\n\nmypy's actual report (it never ran the code!):\n\n```text\nt1.py:6: error: Argument 2 to \"greet\" has incompatible type \"str\"; expected \"int\"  [arg-type]\nt1.py:7: error: Incompatible types in assignment (expression has type \"str\", variable has type \"int\")  [assignment]\nt1.py:10: error: Item \"None\" of \"str | None\" has no attribute \"split\"  [union-attr]\nt1.py:16: error: Incompatible types (expression has type \"str\", TypedDict item \"year\" has type \"int\")  [typeddict-item]\nt1.py:24: error: Method \"speek\" is marked as an override, but no base method was found with this name  [misc]\nFound 5 errors in 1 file (checked 1 source file)\n```\n\nThe `None` bug (line 10) is the classic one: it would crash only when someone passes `None`, perhaps months after you wrote it. mypy finds it immediately.\n\n`reveal_type(expr)` is a debugging aid: mypy prints the type it inferred (remove it afterwards; it only exists for the checker).\n\n### Adopting types gradually\n\nConfigure mypy in `pyproject.toml`:\n\n```toml\n[tool.mypy]\npython_version = \"3.12\"\nstrict = true            # start strict on new projects; relax per-module on old ones\n```\n\nPractical tips:\n- Annotate **function signatures** first. Local variables are usually inferred.\n- Use `# type: ignore[error-code]` as a last resort and always include the code and a reason.\n- `Any` turns checking off for that value. Prefer `object` (\"anything, but I can't use it until I check\") or a proper type.\n- Never needed at runtime: put imports used only for annotations under `if TYPE_CHECKING:` to avoid circular imports.\n- Forward references (a class mentioning itself) used to need quotes (`\"Node\"`). Python 3.14 evaluates annotations lazily (PEP 649), so quotes are no longer needed there; on 3.12/3.13 keep them, or add `from __future__ import annotations`.\n- Other checkers exist (pyright, which powers many editors, and newer tools like Astral's `ty`). The hints are the same; only the checker changes.\n\n### Common mistakes\n- Believing hints are enforced at runtime. They are not; only a checker (or a library like pydantic) acts on them.\n- Using `list[Any]` or bare `dict` everywhere, which defeats the point.\n- Annotating a parameter as `list[str]` when `Sequence[str]` or `Iterable[str]` would do.\n- Forgetting `-> None` on functions that return nothing (strict mode flags it).\n- Mutable defaults like `def f(x: list[int] = [])`: the type is fine but the bug is still there.\n- Silencing errors with blanket `# type: ignore` instead of fixing them.\n- Typing the return as `str` when it can also be `None`.\n\n### Practice\n1. Annotate this function fully, then explain why `Iterable` beats `list` for the parameter: `def average(numbers): return sum(numbers) / len(numbers)`. (Hint: what does `len()` need?)\n2. Write a generic function `last[T](items: Sequence[T]) -> T`. Then use `reveal_type` and run mypy to confirm `last([1, 2])` is an `int`.\n3. Define a `Protocol` called `Speaker` with `speak() -> str`, two unrelated classes that satisfy it, and a function `announce(s: Speaker)`. Add a third class missing `speak` and confirm mypy rejects it.\n\n<details><summary>Solutions<\/summary>\n\n```python\n# 1\nfrom collections.abc import Sequence\n\ndef average(numbers: Sequence[float]) -> float:\n    return sum(numbers) / len(numbers)\n\n# Iterable would NOT work here: generators have no len(). Sequence is the most\n# general type that supports both sum() and len(). If you rewrote it to count while\n# looping, Iterable[float] would be the better choice.\n\n# 2\nfrom collections.abc import Sequence\n\ndef last[T](items: Sequence[T]) -> T:\n    return items[-1]\n\nreveal_type(last([1, 2]))   # mypy: Revealed type is \"int\"\nprint(last([1, 2]))         # 2\n\n# 3\nfrom typing import Protocol\n\nclass Speaker(Protocol):\n    def speak(self) -> str: ...\n\nclass Robot:\n    def speak(self) -> str:\n        return \"beep\"\n\nclass Parrot:\n    def speak(self) -> str:\n        return \"squawk\"\n\nclass Rock:\n    pass\n\ndef announce(s: Speaker) -> None:\n    print(s.speak())\n\nannounce(Robot())\nannounce(Parrot())\nannounce(Rock())   # mypy: Argument 1 to \"announce\" has incompatible type \"Rock\"; expected \"Speaker\"\n```\n\n<\/details>\n\n## Module 2: Decorators and Closures\n**Goal:** Understand closures well enough to write your own decorators, with and without arguments.\n\n### Functions are objects\n\nIn Python a function is a value, like a number. You can store it, pass it around, and return it from other functions.\n\n```python\ndef shout(text):\n    return text.upper() + \"!\"\n\naction = shout                  # no parentheses: we are NOT calling it\nprint(action(\"hello\"))\nprint([f.__name__ for f in (shout, len, str.lower)])\n# Output:\n# HELLO!\n# ['shout', 'len', 'lower']\n```\n\n### Closures\n\nA **closure** is an inner function that remembers variables from the function that created it, even after that outer function has finished.\n\n```python\ndef make_multiplier(factor):\n    def multiply(x):\n        return x * factor        # `factor` lives on in the closure\n    return multiply\n\ndouble = make_multiplier(2)\ntriple = make_multiplier(3)\nprint(double(5), triple(5))\nprint(double.__closure__[0].cell_contents)\n# Output:\n# 10 15\n# 2\n```\n\nEach call to `make_multiplier` creates a fresh `factor`, so `double` and `triple` do not interfere. Closures are how you carry *state without a class*.\n\nTo **rebind** (not just read) an outer variable, declare it `nonlocal`:\n\n```python\ndef make_counter():\n    count = 0\n    def increment():\n        nonlocal count           # without this: UnboundLocalError\n        count += 1\n        return count\n    return increment\n\ncounter = make_counter()\nprint(counter(), counter(), counter())\n# Output: 1 2 3\n```\n\n**The famous gotcha: late binding.** A closure remembers the *variable*, not its value at that moment.\n\n```python\nfuncs = [lambda: i for i in range(3)]\nprint([f() for f in funcs])        # all see the final value of i\n\nfuncs = [lambda i=i: i for i in range(3)]   # default argument captures the value now\nprint([f() for f in funcs])\n# Output:\n# [2, 2, 2]\n# [0, 1, 2]\n```\n\n### Your first decorator\n\nA **decorator** is a function that takes a function and returns a (usually wrapped) function. This:\n\n```python\n@my_decorator\ndef f(): ...\n```\n\nis *exactly* the same as writing `f = my_decorator(f)` after the definition. That is all the `@` is.\n\n```python\nimport functools\nimport time\n\ndef timed(func):\n    @functools.wraps(func)                    # copies name/docstring onto the wrapper\n    def wrapper(*args, **kwargs):             # accept whatever the original accepts\n        start = time.perf_counter()\n        try:\n            return func(*args, **kwargs)      # call the original, pass the result along\n        finally:\n            elapsed = (time.perf_counter() - start) * 1000\n            print(f\"{func.__name__} took {elapsed:.1f} ms\")\n    return wrapper\n\n@timed\ndef slow_add(a, b):\n    \"\"\"Add after a short nap.\"\"\"\n    time.sleep(0.05)\n    return a + b\n\nprint(slow_add(2, 3))\nprint(slow_add.__name__, \"-\", slow_add.__doc__)\n# Output (the time varies):\n# slow_add took 50.3 ms\n# 5\n# slow_add - Add after a short nap.\n```\n\n**Always use `functools.wraps`.** Without it, `slow_add.__name__` would say `wrapper`, and debuggers, documentation tools, and error messages all become confusing.\n\nThe `try/finally` ensures the time is reported even if the function raises.
