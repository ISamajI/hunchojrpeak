    if (ST().approval){ put('shifts/' + d.sid, {...s, claimBy:S.who, updatedAt:Date.now()}); toast('Requested — your manager will approve it'); }
    else { put('shifts/' + d.sid, {...s, worker:S.who, claimBy:null, status:'assigned', updatedAt:Date.now()}); toast("It's yours! It's on your schedule."); } },
  unclaim: d => { const s = S.shifts[d.sid]; put('shifts/' + d.sid, {...s, claimBy:null, updatedAt:Date.now()}); },
  // manager
  range: d => { S.boardRange = d.v === 'month' ? 'month' : +d.v; render(); },
  boardNav: d => { const n = +d.d; if (!n) S.boardStart = weekStartOf(TODAY); else if (S.boardRange === 'month'){ const x = pd(S.boardStart); S.boardStart = ds(new Date(x.getFullYear(), x.getMonth() + n, 1, 12)); } else S.boardStart = addDays(S.boardStart, n * 7 * S.boardRange); render(); },
  roleF: d => { S.roleFilter = d.r; render(); },
  buildNav: d => { S.buildStart = +d.d ? addDays(S.buildStart, 7 * d.d) : weekStartOf(TODAY); render(); },
  gotoBuild: d => { S.buildStart = weekStartOf(d.date); S.tab = 'build'; S.modal = null; render(); scrollTo(0,0); },
  toggleAvail: (d, el) => { S.showAvail = el.checked; render(); },
  day: d => { S.modal = {type:'day', date:d.date}; render(); },
  cellAdd: d => openNewShift(d.id, d.date),
  newShift: d => openNewShift(d.id || null, d.date),
  editShift: d => { const s = S.shifts[d.sid]; if (!s) return; S.modal = {type:'shift', sid:d.sid, date:s.date, start:s.start, end:s.end, worker:s.worker||'', roleId:s.roleId, note:s.note||''}; render(); },
  mset: d => { S.modal[d.k] = d.k === 'n' ? +d.v : d.v; if (d.k === 'worker' && d.v && S.team[d.v] && !S.modal.sid) S.modal.roleId = S.team[d.v].roleId; render(); },
  useTpl: d => { S.modal.start = +d.s; S.modal.end = +d.e; render(); },
  also: d => { const a = S.modal.also = S.modal.also || []; const i = a.indexOf(d.date); i < 0 ? a.push(d.date) : a.splice(i,1); render(); },
  saveShift: () => { const M = S.modal; const base = {date:M.date, start:+M.start, end:+M.end, worker:M.worker||null, roleId:M.roleId, note:(M.note||'').trim()};
    S.modal = null;
    if (M.sid){ const old = S.shifts[M.sid]; const changed = old.worker !== base.worker; put('shifts/' + M.sid, {...old, ...base, status: changed ? 'assigned' : old.status, claimBy: changed ? null : old.claimBy || null, updatedAt:Date.now()}); }
    else putMany([M.date, ...(M.also||[])].map(dt => ['shifts/' + uid(), {...base, date:dt, published:false, status:'assigned', claimBy:null, updatedAt:Date.now()}]));
    toast(M.sid ? 'Shift updated' : 'Added as a draft — publish when the week looks good'); },
  delShift: () => { const id = S.modal.sid; S.modal = null; put('shifts/' + id, null); toast('Shift deleted'); },
  openPublish: () => { const wk = weekStartOf(TODAY); S.modal = {type:'publish', from: S.tab === 'build' ? S.buildStart : (inRange(wk).some(s => !s.published) ? wk : addDays(wk, 7)), n:1}; render(); },
  pubNav: d => { S.modal.from = addDays(S.modal.from, 7 * d.d); render(); },
  doPublish: () => { const M = S.modal; const to = addDays(M.from, 7*M.n - 1);
    const list = shiftList().filter(s => s.date >= M.from && s.date <= to);
    const writes = list.filter(s => !s.published).map(s => { const {id, ...r} = s; return ['shifts/' + id, {...r, published:true, updatedAt:Date.now()}]; });
    writes.push(['notices/' + uid(), {from:M.from, to, count:list.length, createdAt:Date.now()}]);
    S.modal = null; putMany(writes); toast(`Published ${fmtMD(M.from)} – ${fmtMD(to)}. Your crew gets the alert.`); },
  copyPubMsg: () => copyText($('#copysrc').value, 'Copied — paste it in your group chat'),
  copyInvite: () => copyText(inviteText(), 'Invite copied — paste it in your group chat'),
  clearDrafts: () => { putMany(inRange(S.buildStart).filter(s => !s.published).map(s => ['shifts/' + s.id, null])); toast('Drafts cleared'); },
  smartFill: () => smartFill(),
  copyPrev: () => { const n = copyWeek(addDays(S.buildStart, -7), S.buildStart); toast(n ? `Copied ${n} shifts from last week as drafts` : 'Nothing new to copy from last week'); },
  copyFwd: () => { S.modal = {type:'copyFwd', n:2}; render(); },
  doCopyFwd: () => { const w = +S.modal.n; S.modal = null; let n = 0; for (let i = 1; i <= w; i++) n += copyWeek(S.buildStart, addDays(S.buildStart, 7*i)); toast(`Copied ${n} shifts into the next ${w} week${w>1?'s':''} as drafts`); },
  approve: d => { const s = S.shifts[d.sid]; put('shifts/' + d.sid, {...s, worker:s.claimBy, claimBy:null, status:'assigned', updatedAt:Date.now()}); toast(`${firstName(s.claimBy)} has the shift now`); },
  decline: d => { const s = S.shifts[d.sid]; put('shifts/' + d.sid, {...s, claimBy:null, updatedAt:Date.now()}); toast('Pickup declined'); },
  denyDrop: d => { const s = S.shifts[d.sid]; put('shifts/' + d.sid, {...s, status:'assigned', claimBy:null, updatedAt:Date.now()}); toast('Kept on their schedule'); },
  editMember: d => { S.modal = {type:'member', id:d.id}; render(); },
  editAvailFor: d => { S.draft = null; S.draftDirty = false; ensureDraft(d.id); S.modal = null; S.tab = 'editAvail'; render(); scrollTo(0,0); },
  resetPin: d => { const n = {...S.team[d.id]}; delete n.pinHash; put('team/' + d.id, n); toast(`PIN reset — ${firstName(d.id)} makes a new one at next sign-in`); },
  color: d => put('team/' + d.id, {...S.team[d.id], color:d.c}),
  doRemove: d => { const id = d.id; S.modal = null; const list = [['team/' + id, null], ['avail/' + id, null]];
    shiftList().filter(s => s.worker === id && s.date >= TODAY).forEach(s => { const {id:sid, ...r} = s; list.push(['shifts/' + sid, {...r, worker:null, status:'assigned', claimBy:null}]); });
    putMany(list); toast('Removed from the crew'); },
  addMember: () => { const name = $('#newName').value.trim(); if (!name) return toast('Type a name first'); put('team/m-' + uid(), {name, roleId:$('#newRole').value, maxHours:40, seenAt:Date.now()}); toast(`${name} added`); },
  roleColor: d => { const s = clone(ST()); s.roles.find(r => r.id === d.r).color = d.c; put('settings/main', s); },
  addRole: () => { const s = clone(ST()); s.roles.push({id:'r' + uid(), name:'New role', color:PALETTE[s.roles.length % 6]}); put('settings/main', s); },
  delRole: d => { const s = clone(ST()); s.roles = s.roles.filter(r => r.id !== d.r); put('settings/main', s); },
  addTpl: () => { const s = clone(ST()); s.templates = s.templates || []; s.templates.push({id:'t' + uid(), label:'New preset', start:s.open, end:Math.min(s.close, s.open + 8)}); put('settings/main', s); },
  delTpl: d => { const s = clone(ST()); s.templates = (s.templates||[]).filter(t => t.id !== d.t); put('settings/main', s); },
  close: () => { S.modal = null; render(); },
  scrim: (d, el, e) => { if (e.target === el){ S.modal = null; render(); } }
};
function finishSignIn(who){
  S.who = who; S.phase = 'app'; S.tab = 'home'; S.gate = 'pick'; S.pinBuf = ''; S.pinErr = ''; S.draft = null; S.draftDirty = false; S.customOpen = {};
  if (who !== 'mgr') ensureDraft(who);
  saveSession(); render(); scrollTo(0,0);
}
async function pinDone(){
  const pin = S.pinBuf; const salt = ST().salt || '';
  if (S.pinMode === 'create'){ S.pinFirst = pin; S.pinBuf = ''; S.pinMode = 'confirm'; return render(); }
  if (S.pinMode === 'confirm'){
    if (pin !== S.pinFirst){ S.pinErr = "Those didn't match. Start again."; S.pinMode = 'create'; S.pinBuf = ''; S.pinFirst = ''; return render(); }
    const h = await sha(salt + ':' + pin); put('team/' + S.pinFor, {...S.team[S.pinFor], pinHash:h}); return finishSignIn(S.pinFor);
  }
  const h = await sha(salt + ':' + pin);
  const target = S.pinFor === 'mgr' ? ST().mgrPin : (S.team[S.pinFor] || {}).pinHash;
  if (h === target) return finishSignIn(S.pinFor);
  S.pinErr = 'Wrong PIN. Try again.'; S.pinBuf = ''; render();
}
function openNewShift(wid, date){
  const {open:o, close:c} = ST(); const t = (ST().templates||[])[0]; let start = t ? t.start : o, end = t ? t.end : Math.min(c, o + 8);
  if (wid){ const a = availFor(wid, date); const r = runs(a.s, 'A')[0]; if (r && !a.off){ start = r[0]; end = Math.min(r[1], r[0] + 8); } }
  const roleId = wid && S.team[wid] ? S.team[wid].roleId : ST().roles[0].id;
  S.modal = {type:'shift', sid:null, date, start, end, worker:wid||'', roleId, note:'', also:[]}; render();
}
function copyWeek(from, to){
  const diff = Math.round((pd(to) - pd(from)) / 86400000); const existing = inRange(to);
  const list = inRange(from).filter(s => !existing.some(e => e.date === addDays(s.date, diff) && e.start === s.start && e.end === s.end && e.worker === s.worker && e.roleId === s.roleId))
    .map(s => ['shifts/' + uid(), {date:addDays(s.date, diff), start:s.start, end:s.end, worker:s.worker||null, roleId:s.roleId, note:s.note||'', published:false, status:'assigned', claimBy:null, updatedAt:Date.now()}]);
  if (list.length) putMany(list); return list.length;
}
function smartFill(){
  const start = S.buildStart; const open = inRange(start).filter(s => !s.worker).sort(sortSh);
  const temp = clone(S.shifts); const hours = {}; members().forEach(m => hours[m.id] = hoursFor(m.id, start));
  const busy = (id, sh) => Object.entries(temp).some(([k,s]) => k !== sh.id && s.worker === id && s.date === sh.date && s.start < sh.end && sh.start < s.end);
  const list = [];
  open.forEach(sh => { const c = members().filter(m => fit(m.id, sh.date, sh.start, sh.end).level === 'ok' && !busy(m.id, sh) && hours[m.id] + hrs(sh) <= (+m.maxHours || 40))
      .sort((a,b) => (b.roleId === sh.roleId) - (a.roleId === sh.roleId) || hours[a.id] - hours[b.id])[0];
    if (c){ const {id, ...rest} = sh; temp[id] = {...rest, worker:c.id}; hours[c.id] += hrs(sh); list.push(['shifts/' + id, {...rest, worker:c.id, status:'assigned', published:false, updatedAt:Date.now()}]); } });
  if (list.length) putMany(list);
  toast(list.length ? `Filled ${list.length} of ${open.length} open shifts with people who are free` : 'No one free fits the open shifts — try different times');
}

/* ============ EVENTS ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'scrim' && e.target !== t) return;
  if (t.tagName === 'INPUT') return;
  const fn = A[t.dataset.act]; if (fn) fn(t.dataset, t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'codeIn'){ e.preventDefault(); A.enterCode(); return; }
  if (e.key === 'Escape' && S.modal){ S.modal = null; render(); return; }
  if (S.phase === 'gate' && S.gate === 'pin' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){ if (/^\d$/.test(e.key)) A.key({k:e.key}); else if (e.key === 'Backspace') A.key({k:'del'}); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.act === 'toggleAvail') return A.toggleAvail(el.dataset, el);
  if (el.dataset.bind && S.modal){ S.modal[el.dataset.bind] = el.value; if (el.dataset.live) render(); return; }
  if (el.dataset.cust){ const k = el.dataset.cust; const s = +$('#cf-' + k).value, en = +$('#ct-' + k).value; if (en <= s) return toast('"Until" has to be after "From"');
    const {open:o, close:c} = ST(); setRange(k, o, c, 'N'); setRange(k, s, en, 'A'); S.customOpen[k] = true; render(); return; }
  if (el.dataset.team){ const m = S.team[el.dataset.team]; if (!m) return; let v = el.value; if (el.dataset.f === 'maxHours') v = Math.max(0, Math.min(80, +v || 0)); if (el.dataset.f === 'name'){ v = v.trim(); if (!v) return render(); } put('team/' + el.dataset.team, {...m, [el.dataset.f]: v}); return; }
  if (el.dataset.role){ const s = clone(ST()); const r = s.roles.find(x => x.id === el.dataset.role); if (r && el.value.trim()){ r.name = el.value.trim(); put('settings/main', s); } return; }
  if (el.dataset.tpl){ const s = clone(ST()); const t = (s.templates||[]).find(x => x.id === el.dataset.tpl); if (!t) return; t[el.dataset.tf] = el.dataset.tf === 'label' ? (el.value.trim() || t.label) : +el.value; if (t.end <= t.start){ toast('A preset has to end after it starts'); return render(); } put('settings/main', s); return; }
  if (el.dataset.set){ const s = clone(ST()); const k = el.dataset.set; let v = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'mgrPin'){ if (!/^\d{4}$/.test(v)) return toast('The manager PIN has to be 4 digits'); s.mgrPin = await sha(s.salt + ':' + v); el.value = ''; put('settings/main', s); return toast('Manager PIN changed'); }
    if (['open','close','weekStart'].includes(k)) v = +v;
    if (k === 'bizName' || k === 'code'){ v = String(v).trim(); if (k === 'code' && !v){ toast("The company code can't be empty"); return render(); } }
    const nx = {...s, [k]: v}; if (nx.close <= nx.open){ toast('Closing time has to be after opening time'); return render(); }
    put('settings/main', nx); if (k === 'code') saveSession();
    if (k === 'weekStart'){ S.boardStart = weekStartOf(S.boardStart); S.buildStart = weekStartOf(S.buildStart); S.schedWeek = weekStartOf(S.schedWeek); render(); } }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && S.modal && !el.dataset.live) S.modal[el.dataset.bind] = el.value;
  if (el.dataset.avnote && S.draft){ S.draft.note = el.value; if (!S.draftDirty){ S.draftDirty = true; const sb = $('.sendbar'); if (sb){ sb.querySelector('button').disabled = false; sb.querySelector('b').textContent = 'Ready to send'; } } }
  if (el.id === 'codeIn') S.codeDraft = el.value;
});

/* ============ DATA ============ */
let unsubs = [];
function decide(){
  if (S.demo) return;
  if (!S.got.settings || !S.got.team){ if (S.phase !== 'app') S.phase = 'loading'; return; }
  if (!S.settings){ S.phase = S.isOwner ? 'setup' : 'notready'; return; }
  const ses = readSession(); const code = (S.settings.code || '').toLowerCase();
  if (!S.restored){
    S.restored = true;
    if (ses && ses.code === code){
      if (ses.who && (ses.who === 'mgr' || S.team[ses.who])){ S.who = ses.who; S.phase = 'app'; if (S.who !== 'mgr') ensureDraft(S.who); return; }
      S.gate = 'pick';
    } else S.gate = 'code';
    if (S.phase !== 'app') S.phase = 'gate';
    return;
  }
  if (S.phase === 'setup' || S.phase === 'notready' || S.phase === 'loading') S.phase = S.who ? 'app' : 'gate';
  if (S.phase === 'app'){
    const gone = S.who && S.who !== 'mgr' && !S.team[S.who];
    const codeChanged = ses && ses.code && ses.code !== code && !(S.isOwner && S.who === 'mgr');
    if (gone || codeChanged){ S.who = null; S.phase = 'gate'; S.gate = 'code'; clearSession(); }
  }
}
function subscribe(){
  unsubs.forEach(u => { try { u(); } catch(e){} }); unsubs = []; S.restored = false;
  if (!S.db){ S.phase = 'gate'; S.gate = 'code'; render(); return; }
  S.got = {}; S.phase = 'loading';
  const err = e => { if (e && e.code === 'revoked') toast('Access to this page changed. Reload to continue.'); };
  unsubs.push(S.db.doc('settings/main').onSnapshot(snap => { if (S.demo) return; const first = !S.got.settings; S.settings = snap.exists ? snap.data() : null; S.got.settings = true;
    if (first && S.settings){ S.boardStart = weekStartOf(TODAY); S.buildStart = S.boardStart; S.schedWeek = S.boardStart; } decide(); render(); }, err));
  ['team','avail','shifts','notices'].forEach(c => unsubs.push(S.db.collection(c).onSnapshot(snap => {
    if (S.demo) return; const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S[c] = o; S.got[c] = true; decide(); render(); }, err)));
}

    ['marcus','Marcus Lee','r2',40,{1:[[10,23,'A']],2:[[10,23,'A']],3:[[10,23,'A']],4:[[10,23,'A']],5:[[10,23,'A']],6:[],0:[[12,20,'M']]}],
    ['dre','Dre Wilson','r2',28,{0:[[9,16,'A']],6:[[9,16,'A']],5:[[16,23,'A']],4:[[16,23,'A']],3:[[9,12,'A']],1:[],2:[[16,23,'M']]}],

    [1,9,17,'sofia','r3'],[1,15,23,'ana','r1'],[1,9,15,'jay','r1'],[1,11,19,'marcus','r2'],[1,17,23,'dre','r2'],
    [2,9,17,'sofia','r3'],[2,9,15,'jay','r1'],[2,17,23,'kim','r1'],[2,12,20,'marcus','r2'],[2,9,12,'dre','r2'],
    [3,9,17,'sofia','r3'],[3,15,23,'ana','r1'],[3,10,18,'marcus','r2'],[3,17,23,'dre','r2'],[3,9,15,null,'r1'],
    [4,9,17,'sofia','r3'],[4,15,23,'ana','r1'],[4,17,23,'kim','r1'],[4,10,18,'marcus','r2'],[4,16,23,'dre','r2'],
    [5,9,16,'kim','r1'],[5,15,23,'ana','r1'],[5,9,16,'dre','r2'],[5,16,23,null,'r2'],

  plan.forEach(([o,s,e,w,r], i) => { if (i % 3) S.shifts['n' + i] = {date:addDays(ws,o+7), start:s, end:e, worker:w, roleId:r, note:'', published:false, status:'assigned', claimBy:null}; });

async function init(){
  S.boardStart = weekStartOf(TODAY); S.buildStart = S.boardStart; S.schedWeek = S.boardStart;
  render();
  let db = null, user = null;
  try { if (window.claude && window.claude.use){ [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } } catch(e){}
  S.db = db;
  if (user){ try { S.isOwner = !!(await user.isOwner()); } catch(e){} }
  const ses = readSession();
  if (ses && ses.code === 'demo'){ startDemo(); if (ses.who && (ses.who === 'mgr' || S.team[ses.who])) finishSignIn(ses.who); return; }
  subscribe();
}
init();
