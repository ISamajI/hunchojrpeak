<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Capicúa Dominó</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c1530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chivo+Mono:wght@400;600;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Capicúa — UI overlay styles. Single dark theme by design. */
:root {
  color-scheme: dark;
  --night: #0c1530;
  --night-2: #070d1f;
  --blue: #002d62;
  --blue-hi: #2f6fd6;
  --us: #4f8cff;
  --red: #ce1126;
  --them: #ff4d5e;
  --amber: #ffb547;
  --amber-2: #ff9a1f;
  --bone: #f3ead8;
  --bone-2: #ddd0b4;
  --zinc: #9aa3ad;
  --ink: #17120c;
  --muted: rgba(243, 234, 216, 0.62);
  --line: rgba(243, 234, 216, 0.12);
  --glass-a: rgba(18, 29, 64, 0.74);
  --glass-b: rgba(8, 13, 32, 0.78);
  --f-display: 'Bungee', 'Inter Display', 'Arial Black', Impact, system-ui, sans-serif;
  --f-body: 'Figtree', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Chivo Mono', 'DejaVu Sans Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(14px, env(safe-area-inset-top, 0px));
  --gb: max(14px, env(safe-area-inset-bottom, 0px));
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}

html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--bone);
  overflow: hidden;
  font-family: var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }

/* ------------------------------------------------------------------ base */
.cx-root { font-family: var(--f-body); color: var(--bone); font-size: 15px; line-height: 1.45; }
.cx-root *, .cx-root *::before, .cx-root *::after { box-sizing: border-box; }
.cx-layer { position: absolute; inset: 0; pointer-events: none; }
.cx-screens > *, .cx-modals > * { pointer-events: auto; }
.cx-root button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; }
.cx-root button:disabled, .cx-root [aria-disabled="true"] { cursor: not-allowed; }
.cx-root :focus { outline: none; }
.cx-root :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 10px; }
.cx-num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.cx-ic { width: 20px; height: 20px; flex: none; }
.cx-en { margin: 0; font-size: 12.5px; color: var(--muted); letter-spacing: .01em; }
.cx-small { font-size: 12px; }
.cx-muted { color: var(--muted); }
.cx-body { margin: 10px 0 0; font-size: 15px; color: rgba(243, 234, 216, .92); }
.cx-body strong, .cx-body b { color: var(--bone); font-weight: 700; }
.t-us { color: #8db4ff; } .t-them { color: #ff7d89; }
.cx-tag {
  display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; padding: 2px 7px 1px;
  font: 400 10px/1.4 var(--f-display); letter-spacing: .04em; font-style: normal;
  color: #fff; background: var(--red); border-radius: 6px; vertical-align: middle;
}
.cx-tag .cx-ic { width: 11px; height: 11px; }
.cx-tag.is-gold { background: var(--amber); color: var(--ink); }

.cx-glass {
  background: linear-gradient(180deg, var(--glass-a), var(--glass-b));
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--line);
  box-shadow: 0 24px 70px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
  border-radius: 22px;
}

/* screens */
.cx-screen {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding: var(--gt) var(--gr) var(--gb) var(--gl);
  opacity: 0; transition: opacity .42s var(--ease), transform .42s var(--ease), filter .42s var(--ease);
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
.cx-screen.is-in { opacity: 1; }
.cx-screen.is-out { opacity: 0; pointer-events: none; }
.cx-center { display: grid; place-items: center; }
.cx-dim { background: radial-gradient(ellipse at 50% 40%, rgba(8, 13, 32, .45), rgba(4, 7, 18, .82)); }
.cx-card { width: min(100%, 520px); padding: 28px 28px 24px; margin: auto; position: relative; }
.cx-screen .cx-card { transform: translateY(18px) scale(.98); transition: transform .5s var(--spring); }
.cx-screen.is-in .cx-card { transform: none; }
.cx-h2 { margin: 0; font: 400 clamp(24px, 4.2vw, 34px)/1.05 var(--f-display); letter-spacing: .01em; text-transform: uppercase; }
.cx-title { min-width: 0; }
.cx-title .cx-en { margin-top: 4px; }

/* buttons */
.cx-btn {
  display: inline-grid; justify-items: center; align-content: center; gap: 1px;
  min-height: 52px; padding: 9px 22px; border-radius: 14px; border: 1px solid transparent;
  transition: transform .18s var(--ease), background .2s, box-shadow .2s, border-color .2s, opacity .2s;
  text-align: center;
}
.cx-btn > span { font: 400 15px/1.15 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
.cx-btn > small { font: 600 11px/1.2 var(--f-body); opacity: .72; letter-spacing: .02em; }
.cx-btn:hover:not(:disabled) { transform: translateY(-1px); }
.cx-btn:active:not(:disabled) { transform: translateY(1px) scale(.99); }
.cx-btn:disabled { opacity: .45; }
.cx-btn-primary {
  background: linear-gradient(180deg, #ffc66d, #ffa62a); color: #1b1206;
  box-shadow: 0 10px 28px rgba(255, 166, 42, .28), inset 0 -3px 0 rgba(120, 60, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .5);
}
.cx-btn-primary:hover:not(:disabled) { box-shadow: 0 14px 34px rgba(255, 166, 42, .4), inset 0 -3px 0 rgba(120, 60, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .5); }
.cx-btn-ghost { background: rgba(243, 234, 216, .06); border-color: rgba(243, 234, 216, .18); }
.cx-btn-ghost:hover:not(:disabled) { background: rgba(243, 234, 216, .11); border-color: rgba(243, 234, 216, .3); }
.cx-btn-danger { background: linear-gradient(180deg, #e8243a, #b20d1f); color: #fff; box-shadow: 0 10px 26px rgba(206, 17, 38, .35), inset 0 -3px 0 rgba(0, 0, 0, .2); }
.cx-btn-danger-ghost { color: #ff9aa4; }
.cx-btn-amber { background: rgba(255, 181, 71, .12); border-color: rgba(255, 181, 71, .55); color: var(--amber); }
.cx-btn-amber:hover:not(:disabled) { background: rgba(255, 181, 71, .2); }
.cx-btn-wide { width: 100%; }
.cx-btn-sm { min-height: 40px; padding: 6px 14px; }
.cx-btn:has(> .cx-ic) { grid-template-columns: auto auto; column-gap: 10px; justify-content: center; }
.cx-btn:has(> .cx-ic) > .cx-ic { grid-row: span 2; }
.cx-btn:has(> .cx-ic) > small { grid-column: 2; }
.cx-btn-wide:has(> .cx-ic) { grid-template-columns: 26px 1fr; justify-items: start; text-align: left; padding-left: 20px; }
.cx-btn-icon > span { font-size: 13px; }
.cx-link { background: none; border: 0; margin-top: 14px; padding: 8px 4px; color: var(--bone); text-decoration: underline; text-decoration-color: rgba(243, 234, 216, .35); text-underline-offset: 4px; font-weight: 600; }
.cx-link small { font-weight: 400; color: var(--muted); }
.cx-link:hover { text-decoration-color: var(--amber); }
.cx-iconbtn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 8px;
  background: rgba(243, 234, 216, .06); border: 1px solid var(--line); border-radius: 12px;
  font: 700 13px var(--f-body); letter-spacing: .02em;
  transition: background .2s, transform .2s var(--ease);
}
.cx-iconbtn:hover { background: rgba(243, 234, 216, .12); transform: translateX(-2px); }

/* inputs */
.cx-field { display: grid; gap: 6px; min-width: 0; }
.cx-field > span { font: 700 11px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cx-field > span small { letter-spacing: .04em; text-transform: none; font-weight: 500; opacity: .8; }
.cx-input {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid rgba(243, 234, 216, .2); background: rgba(4, 8, 20, .55); color: var(--bone);
  font: 600 17px var(--f-body); transition: border-color .2s, box-shadow .2s;
}
.cx-input::placeholder { color: rgba(243, 234, 216, .32); }
.cx-input:focus-visible, .cx-input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(255, 181, 71, .2); }
.cx-select { appearance: none; -webkit-appearance: none; padding-right: 32px;
  background-image: linear-gradient(45deg, transparent 50%, var(--bone) 50%), linear-gradient(135deg, var(--bone) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.cx-select option { background: #0c1530; color: var(--bone); }
.cx-err { min-height: 1.4em; margin: 10px 0 0; color: #ff8d98; font-weight: 600; font-size: 13.5px; }
.cx-err:empty { min-height: 0; margin: 0; }

.cx-range {
  --p: 50%; -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; cursor: pointer;
}
.cx-range::-webkit-slider-runnable-track {
  height: 8px; border-radius: 99px;
  background: linear-gradient(90deg, var(--amber) 0 var(--p), rgba(243, 234, 216, .14) var(--p) 100%);
}
.cx-range::-moz-range-track { height: 8px; border-radius: 99px; background: rgba(243, 234, 216, .14); }
.cx-range::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--amber); }
.cx-range::-webkit-slider-thumb {
  -webkit-appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 7px;
  background: var(--bone); border: 0; box-shadow: 0 3px 10px rgba(0, 0, 0, .45), inset 0 -2px 0 rgba(0, 0, 0, .15);
  background-image: radial-gradient(circle at 50% 50%, #1b1712 2.6px, transparent 3.2px);
  transition: transform .15s;
}
.cx-range::-moz-range-thumb { width: 26px; height: 26px; border-radius: 7px; background: var(--bone); border: 0; }
.cx-range:active::-webkit-slider-thumb { transform: scale(1.12); }
.cx-range:focus-visible { outline: none; }
.cx-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--amber); }
.cx-range:disabled { opacity: .4; }

.cx-seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 13px; background: rgba(4, 8, 20, .5); border: 1px solid var(--line); max-width: 100%; flex-wrap: wrap; }
.cx-seg-b {
  display: grid; justify-items: center; flex: 1 1 auto; min-height: 42px; min-width: 64px; padding: 5px 12px;
  background: transparent; border: 0; border-radius: 10px; transition: background .2s, color .2s;
}
.cx-seg-b span { font: 400 13px/1.15 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.cx-seg-b small { font-size: 10.5px; opacity: .65; }
.cx-seg-b[aria-checked="true"] { background: var(--bone); color: var(--ink); box-shadow: 0 3px 10px rgba(0, 0, 0, .3); }
.cx-seg-b:hover:not([aria-checked="true"]) { background: rgba(243, 234, 216, .08); }

.cx-switch {
  position: relative; width: 58px; height: 32px; border-radius: 99px; border: 1px solid rgba(243, 234, 216, .2);
  background: rgba(4, 8, 20, .6); transition: background .25s, border-color .25s; flex: none;
}
.cx-switch-k {
  position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 7px; background: var(--zinc);
  transition: transform .3s var(--spring), background .25s;
  background-image: radial-gradient(circle, #1b1712 2.4px, transparent 3px);
}
.cx-switch[aria-checked="true"] { background: rgba(255, 181, 71, .25); border-color: var(--amber); }
.cx-switch[aria-checked="true"] .cx-switch-k { transform: translateX(26px); background-color: var(--bone); }

/* tiles */
.cx-tile { display: inline-block; vertical-align: middle; overflow: visible; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .35)); }
.cx-tbody { fill: var(--bone); stroke: #b9aa88; stroke-width: 1.2; }
.cx-tbody.is-back { fill: #e9dec6; }
.cx-tshine { fill: none; stroke: rgba(255, 255, 255, .6); stroke-width: 1.2; }
.cx-tdiv { stroke: rgba(40, 30, 20, .45); stroke-width: 1.6; stroke-linecap: round; }
.cx-tpin { fill: #c9a24a; stroke: #8d6c25; stroke-width: .6; }
.cx-tring { fill: none; stroke: rgba(160, 130, 80, .5); stroke-width: 1.4; }
.cx-pip { fill: #1b1712; stroke: rgba(0, 0, 0, .25); stroke-width: .5; }
.cx-tile.is-glow { filter: drop-shadow(0 0 10px rgba(255, 181, 71, .85)); }
.cx-tile.is-dim { opacity: .55; }

/* kicker */
.cx-kicker {
  display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0;
  font: 600 11px var(--f-mono); letter-spacing: .26em; text-transform: uppercase; color: var(--amber);
}
.cx-kicker-left { justify-content: flex-start; }
.cx-kick-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); }

/* ================================================================== SPLASH */
.cx-splash {
  overflow: hidden; display: grid; place-items: center; cursor: pointer;
  background: radial-gradient(ellipse 80% 60% at 50% 38%, #1a2a5e 0%, #0c1530 50%, #04070f 100%);
}
.cx-sky { position: absolute; inset: 0; }
.cx-stars i { position: absolute; border-radius: 50%; background: #fff; opacity: .5; animation: cx-twinkle 4s ease-in-out infinite; }
.cx-moon {
  position: absolute; right: 9%; top: 19%; width: clamp(46px, 7vw, 86px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 38% 36%, #fffbe9, #eadfbf 55%, #c9bc96);
  box-shadow: 0 0 60px rgba(255, 245, 210, .35), 0 0 160px rgba(255, 245, 210, .15);
  opacity: 0; animation: cx-fade .2s 1.2s both;
}
.cx-moon::after { content: ''; position: absolute; width: 18%; height: 18%; left: 52%; top: 48%; border-radius: 50%; background: rgba(150, 135, 100, .25); box-shadow: -14px -12px 0 -2px rgba(150, 135, 100, .2); }
.cx-bulbs { position: absolute; top: 0; left: 0; right: 0; height: clamp(90px, 17vh, 170px); pointer-events: none; }
.cx-bulbs svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cx-wire { fill: none; stroke: #050505; stroke-width: 2; vector-effect: non-scaling-stroke; opacity: .9; }
.cx-bulb { position: absolute; width: 0; height: 0; }
.cx-bulb i { position: absolute; display: block; }
.cx-bulb-cord { left: -0.75px; top: 0; width: 1.5px; height: 14px; background: #0a0a0a; }
.cx-bulb-cap { left: -5px; top: 12px; width: 10px; height: 8px; border-radius: 2px; background: linear-gradient(90deg, #3a3a3a, #8a8a8a, #3a3a3a); }
.cx-bulb-glass {
  left: -9px; top: 19px; width: 18px; height: 22px; border-radius: 50% 50% 48% 48% / 42% 42% 58% 58%;
  background: radial-gradient(circle at 50% 60%, #fff6dc 0 18%, #ffd27a 40%, #e99a2a 80%);
  box-shadow: 0 0 16px 4px rgba(255, 181, 71, .8);
  animation: cx-flicker 1.6s var(--d) both, cx-hum 3.4s calc(var(--d) + 1.6s + var(--j)) ease-in-out infinite;
}
.cx-bulb-halo {
  left: -80px; top: -50px; width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 190, 90, .42), rgba(255, 160, 50, .12) 40%, transparent 68%);
  animation: cx-flicker 1.6s var(--d) both;
  mix-blend-mode: screen;
}
.cx-splash-glow {
  position: absolute; left: 50%; top: 56%; width: min(1100px, 140vw); height: 60vh; transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at 50% 50%, rgba(255, 170, 70, .22), transparent 62%);
  opacity: 0; animation: cx-fade 1.4s .7s both; pointer-events: none;
}
.cx-splash-center { position: relative; display: grid; justify-items: center; gap: clamp(14px, 2.6vh, 26px); padding-top: 6vh; width: 100%; }
.cx-splash-center > .cx-kicker { opacity: 0; animation: cx-up .8s 2.2s var(--ease) both; flex-wrap: wrap; text-align: center; }
.cx-wordmark { display: flex; gap: clamp(5px, 1.1vw, 14px); margin: 0; perspective: 900px; font-weight: 400; }
.cx-st { width: clamp(40px, 10.6vw, 116px); aspect-ratio: 1 / 2; animation: cx-st-rise .7s calc(.25s + var(--i) * 75ms) var(--spring) both; transform-origin: 50% 100%; }
.cx-st-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: cx-st-flip 1s calc(1.35s + var(--i) * 120ms) cubic-bezier(.5, 0, .25, 1.15) both; }
.cx-st-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.cx-st-front .cx-tile { width: 100%; height: 100%; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .5)); }
.cx-st-back {
  transform: rotateY(180deg); display: grid; place-items: center; border-radius: 16% / 8%;
  background: linear-gradient(160deg, #fffaf0, var(--bone) 45%, #d9cba9);
  box-shadow: inset 0 0 0 1.5px #b9aa88, inset 0 3px 0 rgba(255, 255, 255, .7), inset 0 -6px 0 rgba(120, 96, 50, .25), 0 18px 30px rgba(0, 0, 0, .55), 0 0 40px rgba(255, 181, 71, .18);
}
.cx-st-letter { font: 400 calc(clamp(40px, 10.6vw, 116px) * .74)/1 var(--f-display); color: var(--blue); transform: translateY(-4%); text-shadow: 0 2px 0 rgba(255, 255, 255, .6); }
.cx-st-letter.is-accent { color: var(--red); }
.cx-st-pin { position: absolute; left: 50%; bottom: 13%; width: 9%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: #c9a24a; box-shadow: inset 0 -1px 1px rgba(0, 0, 0, .35); }
.cx-st-back::before { content: ''; position: absolute; left: 18%; right: 18%; top: 50%; height: 0; }
.cx-table-line { width: min(820px, 86vw); height: 2px; background: linear-gradient(90deg, transparent, rgba(255, 181, 71, .6), transparent); opacity: 0; animation: cx-line 1s 2.1s var(--ease) both; }
.cx-tagline { margin: 0; text-align: center; font: 600 clamp(15px, 2vw, 19px) var(--f-body); opacity: 0; animation: cx-up .8s 2.35s var(--ease) both; padding: 0 12px; }
.cx-tagline .cx-en { display: block; margin-top: 4px; font-weight: 400; }
.cx-enter {
  position: absolute; left: 50%; bottom: calc(var(--gb) + clamp(48px, 9vh, 90px)); transform: translateX(-50%);
  display: grid; justify-items: center; gap: 4px; padding: 14px 30px; background: none; border: 0; border-radius: 16px;
  opacity: 0; animation: cx-up .8s 2.7s var(--ease) both;
}
.cx-enter-es { font: 400 clamp(16px, 2.2vw, 20px) var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--amber); animation: cx-breathe 2.2s 3.4s ease-in-out infinite; text-shadow: 0 0 22px rgba(255, 181, 71, .55); }
.cx-enter-en { font: 500 11px var(--f-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.cx-splash-legal { position: absolute; left: 0; right: 0; bottom: var(--gb); margin: 0; text-align: center; font: 500 10.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: rgba(243, 234, 216, .42); padding: 0 var(--gr) 0 var(--gl); opacity: 0; animation: cx-fade .8s 2.9s both; }
.cx-splash.is-leaving .cx-st { animation: cx-st-out .6s calc(var(--i) * 40ms) cubic-bezier(.6, 0, .8, .3) both; }
.cx-splash.is-leaving .cx-st-in { animation: none; transform: rotateY(180deg); }
.cx-splash.is-leaving .cx-enter, .cx-splash.is-leaving .cx-tagline, .cx-splash.is-leaving .cx-kicker, .cx-splash.is-leaving .cx-splash-legal, .cx-splash.is-leaving .cx-table-line { animation: none; opacity: 0; transition: opacity .3s; }
.cx-splash.is-out { filter: blur(10px); transform: scale(1.04); }

@keyframes cx-st-rise { from { opacity: 0; transform: translateY(60px) rotateX(-65deg); } to { opacity: 1; transform: none; } }
@keyframes cx-st-flip {
  0% { transform: translateY(0) rotateZ(0) rotateY(0); }
  18% { transform: translateY(2px) rotateZ(-7deg) rotateY(0); }
  55% { transform: translateY(-22px) rotateZ(3deg) rotateY(-120deg); }
  100% { transform: translateY(0) rotateZ(0) rotateY(-180deg); }
}
@keyframes cx-st-out { to { opacity: 0; transform: translateY(-30px) scale(1.15) rotateX(30deg); filter: blur(4px); } }
@keyframes cx-flicker {
  0% { opacity: 0; } 10% { opacity: .9; } 14% { opacity: .05; } 26% { opacity: 1; } 30% { opacity: .2; } 38% { opacity: 1; } 100% { opacity: 1; }
}
@keyframes cx-hum { 0%, 100% { opacity: 1; } 47% { opacity: .9; } 50% { opacity: .72; } 53% { opacity: .95; } }
@keyframes cx-twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .7; } }
@keyframes cx-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes cx-up { from { opacity: 0; transform: translate(var(--tx, 0), 14px); } to { opacity: 1; transform: translate(var(--tx, 0), 0); } }
@keyframes cx-line { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
@keyframes cx-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.cx-enter { --tx: -50%; }

/* ================================================================== AGE GATE */
.cx-age { text-align: center; }
.cx-age-badge { position: relative; display: inline-block; margin: -2px auto 14px; animation: cx-badge-in .8s .2s var(--spring) both; }
.cx-age-badge .cx-tile { filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .5)); }
.cx-age-plus { position: absolute; right: -16px; top: -10px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--red); color: #fff; font: 400 18px var(--f-display); box-shadow: 0 4px 12px rgba(206, 17, 38, .5); }
.cx-age-plus .cx-ic { width: 16px; height: 16px; }
.cx-age .cx-body, .cx-age .cx-en.cx-small { text-align: left; }
.cx-age .cx-en.cx-small { margin-top: 6px; }
.cx-dob { margin-top: 20px; text-align: left; }
.cx-dob-row { display: grid; grid-template-columns: 1fr 1.7fr 1.3fr; gap: 10px; margin-bottom: 4px; }
.cx-dob .cx-btn { margin-top: 16px; }
@keyframes cx-badge-in { from { opacity: 0; transform: rotate(-30deg) scale(.6); } to { opacity: 1; transform: rotate(-6deg); } }

/* ================================================================== MAIN MENU */
.cx-menu-screen { display: grid; grid-template-rows: auto 1fr auto; gap: 16px; background: linear-gradient(90deg, rgba(5, 9, 22, .78) 0%, rgba(5, 9, 22, .25) 55%, rgba(5, 9, 22, .6) 100%); }
.cx-menu-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.cx-mw { display: flex; gap: 4px; }
.cx-mw-t { display: grid; place-items: center; width: 24px; height: 40px; border-radius: 5px; background: linear-gradient(160deg, #fffaf0, var(--bone) 50%, #d6c8a6); box-shadow: inset 0 0 0 1px #b9aa88, 0 4px 10px rgba(0, 0, 0, .4); animation: cx-mw-in .6s calc(var(--i) * 60ms) var(--spring) both; }
.cx-mw-t b { font: 400 17px var(--f-display); color: var(--blue); }
.cx-mw-t b.is-accent { color: var(--red); }
@keyframes cx-mw-in { from { opacity: 0; transform: translateY(-14px) rotateY(90deg); } to { opacity: 1; transform: none; } }
.cx-menu-wallet { display: grid; justify-items: end; gap: 8px; }
.cx-wallet {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 99px;
  background: rgba(8, 13, 32, .7); border: 1px solid rgba(255, 181, 71, .35); box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.cx-wallet-ic { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffd07a, #e08a12); color: #4a2a00; }
.cx-wallet-ic .cx-ic { width: 20px; height: 20px; }
.cx-wallet-n { font-size: 18px; font-weight: 700; color: var(--bone); }
.cx-wallet-l { font: 600 10px var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.cx-wallet.is-bump { animation: cx-bump .5s var(--spring); }
@keyframes cx-bump { 40% { transform: scale(1.1); } }
.cx-refill { min-height: 46px; padding: 6px 14px; }
.cx-refill.cx-btn:has(> .cx-ic) { grid-template-columns: auto auto; }
.cx-refill > span { font-size: 12.5px; }
.cx-refill-done { margin: 0; font-size: 12px; color: var(--muted); text-align: right; }
.cx-menu-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 460px); gap: clamp(20px, 5vw, 80px); align-items: end; align-self: center; width: min(1180px, 100%); margin: 0 auto; }
.cx-menu-hero { padding-bottom: 6px; animation: cx-up .7s .1s var(--ease) both; }
.cx-hero-h { margin: 12px 0 10px; font: 400 clamp(38px, 6.4vw, 84px)/.95 var(--f-display); text-transform: uppercase; letter-spacing: -.01em; text-shadow: 0 6px 30px rgba(0, 0, 0, .5); }
.cx-hero-sub { margin: 0 0 22px; max-width: 36ch; font-size: clamp(15px, 1.5vw, 17px); color: rgba(243, 234, 216, .85); }
.cx-profile {
  display: inline-flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: 99px;
  background: rgba(8, 13, 32, .62); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: border-color .2s, transform .2s var(--ease);
}
.cx-profile:hover { border-color: rgba(255, 181, 71, .5); transform: translateY(-1px); }
.cx-profile-txt { display: grid; text-align: left; }
.cx-profile-k { font: 600 10px var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.cx-profile-n { font: 400 16px var(--f-display); text-transform: uppercase; }
.cx-profile-e { color: var(--amber); margin-left: 4px; }
.cx-avatar { display: block; flex: none; border-radius: 50%; }
.cx-menu-panel { padding: 10px; overflow: hidden; }
.cx-menu { display: grid; }
.cx-menu-item {
  position: relative; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px;
  padding: 14px 14px; border: 0; border-radius: 14px; background: transparent; text-align: left;
  transition: background .25s, transform .25s var(--ease);
  animation: cx-slide-in .6s calc(.15s + var(--i) * 70ms) var(--ease) both;
}
.cx-menu-item + .cx-menu-item::before { content: ''; position: absolute; left: 60px; right: 14px; top: 0; height: 1px; background: var(--line); }
.cx-menu-item:hover:not(.is-locked), .cx-menu-item:focus-visible { background: rgba(255, 181, 71, .09); }
.cx-menu-item:hover:not(.is-locked) .cx-mi-go, .cx-menu-item:focus-visible .cx-mi-go { transform: translateX(4px) rotate(-8deg); }
.cx-mi-n { font-size: 12px; color: var(--muted); }
.cx-mi-txt { display: grid; min-width: 0; }
.cx-mi-es { font: 400 clamp(18px, 2vw, 22px)/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
.cx-mi-en { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.cx-mi-go { display: grid; place-items: center; transition: transform .35s var(--spring); color: var(--muted); }
.cx-menu-item.is-pote { background: linear-gradient(90deg, rgba(206, 17, 38, .22), rgba(206, 17, 38, 0) 70%); }
.cx-menu-item.is-pote::after { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--red); box-shadow: 0 0 12px var(--red); }
.cx-menu-item.is-pote .cx-mi-n { color: #ff8b96; }
.cx-menu-item.is-locked { opacity: .55; }
.cx-menu-item.is-shake { animation: cx-shake .45s; }
@keyframes cx-shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes cx-slide-in { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
.cx-menu-msg { margin: 6px 14px 4px; min-height: 0; font-size: 12.5px; color: #ff9aa4; }
.cx-menu-msg:empty { margin: 0; }
.cx-nocash { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; font: 500 11px var(--f-mono); letter-spacing: .08em; color: rgba(243, 234, 216, .55); text-align: center; flex-wrap: wrap; }

.cx-nocash small { font-size: inherit; opacity: .8; }
.cx-nocash-in { margin-top: 12px; }

/* ================================================================== CREATOR */
.cx-creator {
  display: grid; grid-template-columns: minmax(0, 1fr) min(460px, 42vw); grid-template-rows: auto 1fr; gap: 16px 24px;
  background: radial-gradient(ellipse at 30% 50%, rgba(255, 170, 70, .12), transparent 55%), linear-gradient(180deg, rgba(5, 9, 22, .82), rgba(5, 9, 22, .92));
  overflow: hidden;
}
.cx-cr-head { grid-column: 1; display: flex; align-items: center; gap: 16px; }
.cx-pv { grid-column: 1; grid-row: 2; position: relative; min-height: 0; border-radius: 26px; overflow: hidden; }
.cx-pv-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cx-pv-floor { position: absolute; left: 50%; bottom: 6%; width: 60%; height: 14%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(255, 181, 71, .25), transparent 70%); }
.cx-pv.is-pop { animation: cx-bump .5s var(--spring); }
.cx-pv-ph { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; }
.cx-pv-ph p { margin: 0; font-size: 12px; color: var(--muted); }
.cx-cr-panel { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; min-height: 0; padding: 18px; gap: 14px; }
.cx-sheet-grip { display: none; }
.cx-cr-names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cx-tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(4, 8, 20, .5); overflow-x: auto; scrollbar-width: none; flex: none; }
.cx-tabs::-webkit-scrollbar { display: none; }
.cx-tab { flex: 1 0 auto; display: grid; justify-items: center; padding: 7px 10px; border: 0; border-radius: 10px; background: transparent; transition: background .2s, color .2s; }
.cx-tab span { font: 400 12px var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.cx-tab small { font-size: 10px; opacity: .6; }
.cx-tab[aria-selected="true"] { background: var(--bone); color: var(--ink); }
.cx-tab:hover:not([aria-selected="true"]) { background: rgba(243, 234, 216, .08); }
.cx-panes { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px 6px; scrollbar-width: thin; scrollbar-color: rgba(243, 234, 216, .2) transparent; }
.cx-pane { display: grid; gap: 18px; animation: cx-fade .3s both; }
.cx-pane[hidden] { display: none; }
.cx-opt { display: grid; gap: 9px; }
.cx-opt-h { display: flex; align-items: baseline; gap: 8px; }
.cx-opt-es { font: 700 12px var(--f-body); letter-spacing: .14em; text-transform: uppercase; }
.cx-opt-en { font-size: 11.5px; color: var(--muted); }
.cx-opt-val { margin-left: auto; font-size: 12.5px; color: var(--amber); }
.cx-swatches { display: flex; flex-wrap: wrap; gap: 9px; }
.cx-swatch {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--c);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18), inset 0 -4px 6px rgba(0, 0, 0, .25), 0 2px 6px rgba(0, 0, 0, .4);
  transition: transform .2s var(--spring), box-shadow .2s;
}
.cx-swatch:hover { transform: scale(1.1); }
.cx-swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--amber), inset 0 -4px 6px rgba(0, 0, 0, .25); transform: scale(1.06); }
.cx-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.cx-chip {
  min-height: 38px; padding: 6px 13px; border-radius: 99px; border: 1px solid rgba(243, 234, 216, .18);
  background: rgba(243, 234, 216, .05); font: 600 13px var(--f-body); transition: background .2s, color .2s, border-color .2s, transform .2s var(--spring);
}
.cx-chip:hover { border-color: rgba(243, 234, 216, .38); }
.cx-chip[aria-checked="true"] { background: var(--bone); color: var(--ink); border-color: var(--bone); }
.cx-chip:active { transform: scale(.96); }
.cx-cr-actions { display: grid; grid-template-columns: 1fr auto 1.2fr; gap: 10px; flex: none; }
.cx-cr-actions .cx-btn { padding-left: 12px; padding-right: 12px; }

/* ================================================================== LOBBY */
.cx-lobby { background: linear-gradient(180deg, rgba(5, 9, 22, .8), rgba(5, 9, 22, .9)); }
.cx-lobby.is-suspended { opacity: 0 !important; pointer-events: none; }
.cx-lobby-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; width: min(1240px, 100%); margin: 0 auto 16px; }
.cx-mode-pill { padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); font: 600 11px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.cx-lobby-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 20px; width: min(1240px, 100%); margin: 0 auto; align-items: start; }
.cx-lobby-left { padding: 18px; display: grid; gap: 14px; }
.cx-lobby-right { display: grid; gap: 16px; position: sticky; top: 0; }
.cx-ltable { position: relative; height: 250px; border-radius: 18px; background: radial-gradient(ellipse at 50% 50%, rgba(255, 181, 71, .1), transparent 65%); }
.cx-ltable-top { position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; transform: translate(-50%, -50%); border-radius: 12px;
  background: linear-gradient(135deg, #7a4a26, #5b3317); box-shadow: inset 0 0 0 5px #3d220f, inset 0 0 0 7px #8b5a31, 0 14px 30px rgba(0, 0, 0, .5); display: grid; place-items: center; }
.cx-ltable-lbl { font: 600 9px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: rgba(243, 234, 216, .7); text-align: center; width: 70px; }
.cx-ltable-arrows { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); pointer-events: none; }
.cx-ltable-arrows path { fill: none; stroke: rgba(255, 181, 71, .35); stroke-width: 1.2; stroke-dasharray: 2 3; }
.cx-lseat {
  position: absolute; display: grid; justify-items: center; gap: 2px; width: 130px; padding: 6px; border-radius: 14px;
  background: transparent; border: 1px solid transparent; transition: background .2s, border-color .2s, transform .3s var(--spring);
}
button.cx-lseat:hover { background: rgba(243, 234, 216, .06); }
.cx-lseat.is-active { background: rgba(255, 181, 71, .12); border-color: rgba(255, 181, 71, .6); box-shadow: 0 0 24px rgba(255, 181, 71, .18); }
.cx-lseat.is-pop { animation: cx-bump .45s var(--spring); }
.cx-lseat-n { font: 400 13px/1.1 var(--f-display); text-transform: uppercase; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cx-lseat-r { font-size: 10.5px; color: var(--muted); }
.cx-lseat.is-us .cx-lseat-r, .cx-lseat.is-you .cx-lseat-r { color: #8db4ff; }
.cx-lseat.is-them .cx-lseat-r { color: #ff8b96; }
.cx-lseat-0 { left: 50%; bottom: 0; transform: translateX(-50%); }
.cx-lseat-2 { left: 50%; top: 0; transform: translateX(-50%); }
.cx-lseat-1 { right: 2%; top: 50%; transform: translateY(-50%); }
.cx-lseat-3 { left: 2%; top: 50%; transform: translateY(-50%); }
.cx-lobby-pickhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.cx-lobby-active { margin: 0; font-size: 14px; }
.cx-lobby-active b { font: 400 14px var(--f-display); text-transform: uppercase; color: var(--amber); }
.cx-lobby-active small { color: var(--muted); }
.cx-pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.cx-pcard-main {
  position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 10px 12px 10px 10px;
  text-align: left; border-radius: 16px; border: 1px solid var(--line); background: rgba(243, 234, 216, .04);
  transition: background .2s, border-color .2s, transform .25s var(--spring);
}
.cx-pcard-main:hover { background: rgba(243, 234, 216, .08); transform: translateY(-2px); }
.cx-pcard.is-on .cx-pcard-main { border-color: var(--amber); background: rgba(255, 181, 71, .1); }
.cx-pcard.is-used .cx-pcard-main { opacity: .62; }
.cx-pcard-txt { display: grid; min-width: 0; }
.cx-pcard-n { font: 400 14px/1.15 var(--f-display); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 48px; }
.cx-pcard-real { font-size: 12px; color: var(--amber); font-weight: 600; }
.cx-pcard-real:empty { display: none; }
.cx-pcard-bio { font-size: 12px; color: var(--muted); line-height: 1.3; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cx-pcard-seat { position: absolute; top: 8px; right: 8px; padding: 2px 7px; border-radius: 6px; font: 600 9.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; background: rgba(243, 234, 216, .12); }
.cx-lopts-wrap { padding: 16px 18px; }
.cx-lopts { display: grid; gap: 14px; }
.cx-lopt { display: grid; gap: 8px; }
.cx-lopt .cx-seg { width: 100%; }
.cx-stake { padding: 18px; display: grid; gap: 12px; }
.cx-stake-q { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.cx-stake-title { margin: 0; font: 400 17px/1.15 var(--f-display); text-transform: uppercase; }
.cx-stake-you { font-size: clamp(26px, 3vw, 34px); font-weight: 700; color: var(--amber); line-height: 1; }
.cx-quick { display: flex; flex-wrap: wrap; gap: 8px; }
.cx-qchip {
  flex: 1 0 auto; min-height: 40px; min-width: 52px; padding: 4px 10px; border-radius: 99px;
  border: 1px dashed rgba(255, 181, 71, .5); background: rgba(255, 181, 71, .06); font: 700 13px var(--f-mono); color: var(--amber);
  transition: background .2s, transform .2s var(--spring);
}
.cx-qchip:hover:not(:disabled) { background: rgba(255, 181, 71, .16); transform: translateY(-1px); }
.cx-qchip[aria-pressed="true"] { background: var(--amber); color: var(--ink); border-style: solid; }
.cx-qchip.is-all { border-color: rgba(206, 17, 38, .8); color: #ff9aa4; background: rgba(206, 17, 38, .1); }

.cx-qchip:disabled { opacity: .3; }
.cx-stake-note { margin: 0; font-size: 12px; color: var(--muted); }
.cx-stake4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cx-s4 { display: grid; justify-items: center; gap: 1px; padding: 8px 4px; border-radius: 12px; background: rgba(4, 8, 20, .45); border-top: 2px solid var(--us); min-width: 0; }
.cx-s4.is-them { border-top-color: var(--them); }
.cx-s4-chip { color: var(--amber); }
.cx-s4-chip .cx-ic { width: 18px; height: 18px; }
.cx-s4-n { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cx-s4-v { font-size: 13px; font-weight: 700; }
.cx-pot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 12px; border-radius: 14px; background: linear-gradient(90deg, rgba(255, 181, 71, .14), rgba(255, 181, 71, .04)); border: 1px solid rgba(255, 181, 71, .3); }
.cx-pot-total, .cx-pot-each { display: grid; gap: 1px; }
.cx-pot-each { text-align: right; }
.cx-pot-k { font: 600 10px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.cx-pot-v { font: 700 22px var(--f-mono); color: var(--amber); }
.cx-pot-v.is-bump { animation: cx-bump .45s var(--spring); }
.cx-pot-each small { font-size: 10.5px; color: var(--muted); }
.cx-pot-split svg { width: 56px; height: 28px; fill: none; stroke: var(--amber); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.cx-btn-start { width: 100%; min-height: 64px; }
.cx-btn-start > span { font-size: 19px; }
.cx-btn-start b { font-family: var(--f-mono); font-weight: 700; }

/* ================================================================== RULES */
.cx-rules { background: linear-gradient(180deg, rgba(5, 9, 22, .86), rgba(5, 9, 22, .94)); }
.cx-rules-head { display: flex; align-items: center; gap: 16px; width: min(1240px, 100%); margin: 0 auto 18px; }
.cx-rules-scroll { width: min(1240px, 100%); margin: 0 auto; }
.cx-rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.cx-rcard { display: grid; grid-template-rows: 190px auto; overflow: hidden; animation: cx-up .6s calc(var(--i) * 50ms) var(--ease) both; }
.cx-rcard-vis { position: relative; display: grid; place-items: center; padding: 14px; background: radial-gradient(ellipse at 50% 60%, rgba(122, 74, 38, .55), rgba(60, 34, 15, .35) 60%, transparent 85%), linear-gradient(180deg, rgba(255, 181, 71, .06), transparent); border-bottom: 1px solid var(--line); overflow: hidden; }
.cx-rcard-txt { padding: 16px 18px 18px; }
.cx-rcard-h { display: flex; gap: 12px; align-items: flex-start; }
.cx-rcard-n { font-size: 24px; font-weight: 700; color: var(--amber); line-height: 1; padding-top: 2px; }
.cx-rcard h3 { margin: 0; font: 400 19px/1.1 var(--f-display); text-transform: uppercase; }
.cx-rcard .cx-body { font-size: 14.5px; }
.cx-rcard .cx-en.cx-small { margin-top: 8px; }
.cx-arrow { width: 40px; height: 16px; fill: none; stroke: var(--amber); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.cx-arrow.sm { width: 22px; height: 12px; }
/* visuals */
.cx-v-deal { display: flex; align-items: center; gap: 12px; }
.cx-v-pile { position: relative; display: grid; grid-template-columns: repeat(2, auto); gap: 3px; transform: rotate(-8deg); }
.cx-v-big { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 700; color: var(--ink); text-shadow: 0 0 6px var(--bone), 0 0 2px var(--bone); }
.cx-v-hands { display: grid; gap: 4px; }
.cx-v-hand { display: flex; align-items: center; gap: 2px; }
.cx-v-hand .cx-num { margin-left: 6px; font-size: 13px; color: var(--amber); font-weight: 700; }
.cx-mt { position: relative; width: 170px; height: 170px; }
.cx-mt-board { position: absolute; inset: 42px; border-radius: 10px; background: linear-gradient(135deg, #7a4a26, #5b3317); box-shadow: inset 0 0 0 4px #3d220f, 0 10px 20px rgba(0, 0, 0, .45); }
.cx-mt-seat { position: absolute; width: 50px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: rgba(243, 234, 216, .1); border: 1.5px solid var(--zinc); font-size: 11px; }
.cx-mt-seat b { font: 400 10px var(--f-display); text-transform: uppercase; }
.cx-mt-seat.is-us { border-color: var(--us); background: rgba(79, 140, 255, .18); }
.cx-mt-seat.is-them { border-color: var(--them); background: rgba(255, 77, 94, .16); }
.cx-mt-seat.s0 { left: 60px; bottom: 0; } .cx-mt-seat.s2 { left: 60px; top: 0; }
.cx-mt-seat.s1 { right: 0; top: 68px; } .cx-mt-seat.s3 { left: 0; top: 68px; }
.cx-mt-arrows { position: absolute; inset: 0; width: 100%; height: 100%; }
.cx-mt-arrows path { fill: none; stroke: var(--amber); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.cx-v-center { display: grid; justify-items: center; gap: 8px; }
.cx-v-glow { animation: cx-glowpulse 2.4s ease-in-out infinite; transform: rotate(-8deg); }
@keyframes cx-glowpulse { 0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 181, 71, .4)); } 50% { filter: drop-shadow(0 0 22px rgba(255, 181, 71, .9)); } }
.cx-v-cap { font: 400 14px var(--f-display); text-transform: uppercase; color: var(--amber); }
.cx-v-chain { display: flex; align-items: center; gap: 2px; margin-top: -30px; }
.cx-v-end { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--zinc); font: 700 13px var(--f-mono); color: var(--zinc); margin: 0 4px; }
.cx-v-end.is-hot { border-color: var(--amber); color: var(--ink); background: var(--amber); border-style: solid; box-shadow: 0 0 14px rgba(255, 181, 71, .7); }
.cx-v-play { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 0; }
.cx-curve { width: 120px; height: 40px; fill: none; stroke: var(--amber); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 4; order: 2; margin-left: -6px; margin-bottom: 18px; }
.cx-v-handtile { order: 1; animation: cx-nudge 2s ease-in-out infinite; }
@keyframes cx-nudge { 0%, 100% { transform: none; } 50% { transform: translate(6px, -6px) rotate(-4deg); } }
.cx-v-knock { display: grid; justify-items: center; gap: 10px; }
.cx-v-ends { display: flex; align-items: center; gap: 6px; }
.cx-v-dots { color: var(--zinc); letter-spacing: .3em; }
.cx-v-row { display: flex; gap: 8px; }
.cx-v-toc { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 99px; background: var(--amber); color: var(--ink); font: 400 14px var(--f-display); }
.cx-v-toc .cx-ic { animation: cx-tap .9s ease-in-out infinite; transform-origin: 70% 90%; }
@keyframes cx-tap { 0%, 100% { transform: rotate(0); } 20%, 60% { transform: rotate(-18deg); } 40%, 80% { transform: rotate(4deg); } }
.cx-v-count { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 12px; align-items: end; justify-items: center; }
.cx-v-hl { display: grid; justify-items: center; gap: 3px; }
.cx-v-hl span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.cx-v-hl div { display: flex; gap: 3px; }
.cx-v-hl b { font-size: 14px; color: var(--amber); }
.cx-v-sum { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px; margin-top: 8px; padding: 6px 14px; border-radius: 12px; background: rgba(4, 8, 20, .5); }
.cx-v-sum span { font-size: 14px; color: var(--muted); }
.cx-v-sum b { font-size: 26px; color: var(--amber); }
.cx-v-sum small { color: #8db4ff; font-weight: 600; }
.cx-v-skip { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
.cx-v-sk { display: grid; justify-items: center; gap: 4px; min-width: 40px; }
.cx-v-sk span { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.cx-v-sk i { display: grid; place-items: center; height: 40px; font: 400 11px var(--f-display); color: var(--amber); font-style: normal; text-transform: uppercase; }
.cx-v-bonus { display: grid; place-items: center; min-width: 52px; height: 52px; padding: 0 8px; border-radius: 50%; background: var(--blue); border: 2px solid #4f8cff; font: 700 16px var(--f-mono); box-shadow: 0 0 20px rgba(79, 140, 255, .5); animation: cx-bump 1.8s ease-in-out infinite; }
.cx-v-bonus.sm { min-width: 0; height: 30px; border-radius: 99px; font-size: 13px; animation: none; }
.cx-v-tranque { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.cx-v-tq { padding: 10px; border-radius: 12px; background: rgba(4, 8, 20, .5); border: 1px solid var(--line); }
.cx-v-tq.is-win { border-color: rgba(79, 140, 255, .6); }
.cx-v-tq.is-lose { border-color: rgba(255, 77, 94, .6); }
.cx-v-tq-h { margin: 0 0 6px; font: 400 11px var(--f-display); text-transform: uppercase; }
.cx-v-tq.is-win .cx-v-tq-h { color: #8db4ff; } .cx-v-tq.is-lose .cx-v-tq-h { color: #ff8b96; }
.cx-v-tq-row { display: flex; justify-content: space-between; font-size: 12px; }
.cx-v-tq-row b { font-size: 14px; }
.cx-v-tq-r { margin: 6px 0 0; font-size: 11.5px; color: var(--muted); }
.cx-v-tq-r b { color: var(--amber); font-family: var(--f-mono); }
.cx-rcard-vis > .cx-v-cap { display: grid; gap: 12px; width: 100%; text-transform: none; font-family: var(--f-body); color: inherit; font-size: inherit; }
.cx-v-bar { position: relative; height: 12px; border-radius: 99px; background: rgba(243, 234, 216, .1); margin-top: 18px; }
.cx-v-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--us)); }
.cx-v-mark { position: absolute; top: -22px; transform: translateX(-100%); font: 700 13px var(--f-mono); color: var(--bone); }
.cx-v-bar::after { content: '200'; position: absolute; right: 0; top: 16px; font: 600 11px var(--f-mono); color: var(--muted); }
.cx-v-capline { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
.cx-v-lock { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; background: rgba(255, 181, 71, .15); border: 1px solid var(--amber); color: var(--amber); }
.cx-v-lock b { font-size: 16px; }
.cx-v-lock .cx-ic { width: 16px; height: 16px; }
.cx-v-no { font: 600 12px var(--f-mono); color: #ff8b96; text-decoration: line-through; }
.cx-v-capnote { margin: 0; text-align: center; font-size: 12.5px; color: var(--muted); }
.cx-v-target { display: flex; gap: 14px; }
.cx-v-tgt { display: grid; justify-items: center; padding: 14px 22px; border-radius: 16px; background: var(--bone); color: var(--ink); box-shadow: 0 10px 20px rgba(0, 0, 0, .4); transform: rotate(-4deg); }
.cx-v-tgt.is-alt { background: transparent; color: var(--bone); border: 2px dashed rgba(243, 234, 216, .4); box-shadow: none; transform: rotate(3deg); }
.cx-v-tgt b { font-size: 38px; line-height: 1; }
.cx-v-tgt small { font: 400 11px var(--f-display); text-transform: uppercase; opacity: .7; }
.cx-v-pot { display: grid; justify-items: center; gap: 0; width: 100%; }
.cx-v-stakes { display: flex; justify-content: space-around; width: 100%; }
.cx-v-chipstack { display: grid; justify-items: center; color: var(--amber); }
.cx-v-chipstack .cx-ic { width: 20px; height: 20px; }
.cx-v-chipstack b { font-size: 11px; color: var(--bone); }
.cx-v-potlines { width: 100%; height: 22px; fill: none; stroke: rgba(255, 181, 71, .55); stroke-width: 1.4; }
.cx-v-potc { display: flex; align-items: baseline; gap: 6px; padding: 4px 14px; border-radius: 99px; background: var(--amber); color: var(--ink); }
.cx-v-potc span { font: 400 11px var(--f-display); text-transform: uppercase; }
.cx-v-potc b { font-size: 16px; }
.cx-v-split { display: flex; justify-content: space-around; width: 100%; font-size: 12px; }
.cx-v-split b { font-size: 14px; }
.cx-summary { margin-top: 16px; padding: 4px 18px; }
.cx-summary summary { cursor: pointer; padding: 14px 0; font: 400 15px var(--f-display); text-transform: uppercase; list-style: none; }
.cx-summary summary::-webkit-details-marker { display: none; }
.cx-summary summary::before { content: '+'; display: inline-block; width: 22px; color: var(--amber); font-family: var(--f-mono); }
.cx-summary[open] summary::before { content: '–'; }
.cx-summary summary small { font: 500 12px var(--f-body); text-transform: none; color: var(--muted); }
.cx-summary ol { margin: 0 0 16px; padding-left: 22px; display: grid; gap: 6px; font-size: 14px; color: rgba(243, 234, 216, .88); }
.cx-rules-foot { display: flex; justify-content: center; padding: 24px 0 8px; }

/* ================================================================== SETTINGS */
.cx-settings { width: min(100%, 620px); padding: 22px; display: grid; gap: 8px; max-height: calc(100dvh - 32px); grid-template-rows: auto 1fr auto; }
.cx-set-head { display: flex; align-items: center; gap: 14px; }
.cx-set-body { overflow-y: auto; margin: 0 -8px; padding: 0 8px; }
.cx-set-sec { padding: 12px 0 4px; }
.cx-set-sec + .cx-set-sec { border-top: 1px solid var(--line); }
.cx-set-h { margin: 6px 0 6px; font: 600 11px var(--f-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--amber); }
.cx-set-h small { margin-left: 8px; letter-spacing: .1em; color: var(--muted); }
.cx-set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 9px 0; min-height: 56px; }
.cx-set-l { display: grid; min-width: 0; }
.cx-set-l span { font-weight: 700; font-size: 15px; }
.cx-set-l small { font-size: 12px; color: var(--muted); }
.cx-set-c { display: flex; align-items: center; justify-content: flex-end; min-width: 0; }
.cx-set-slider { width: min(260px, 46vw); gap: 10px; }
.cx-set-slider .cx-opt-val { width: 30px; text-align: right; margin: 0; }
.cx-set-actions { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }

/* ================================================================== HUD */
.cx-hud { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s var(--ease); }
.cx-hud.is-in { opacity: 1; }
.cx-hud button { pointer-events: auto; }
.cx-hud-top { position: absolute; top: var(--gt); left: var(--gl); right: var(--gr); display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px; }
.cx-hud-l { justify-self: start; display: flex; gap: 8px; }
.cx-hud-r { justify-self: end; display: flex; gap: 8px; }
.cx-hbtn {
  display: inline-flex; align-items: center; gap: 8px; min-width: 46px; height: 46px; padding: 0 12px; justify-content: center; border-radius: 14px;
  background: rgba(8, 13, 32, .66); border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  transition: background .2s, transform .2s var(--ease), border-color .2s;
}
.cx-hbtn:hover { background: rgba(20, 32, 70, .85); border-color: rgba(243, 234, 216, .3); }
.cx-hbtn:active { transform: scale(.95); }
.cx-hbtn-radio { padding-right: 14px; }
.cx-radio-name { display: grid; text-align: left; max-width: 150px; }
.cx-radio-k { font: 600 9px var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.cx-radio-s { font: 700 12.5px/1.2 var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-hbtn-radio.is-flip .cx-radio-s { animation: cx-up .4s var(--ease); }
.cx-eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.cx-eq i { width: 3px; height: 30%; border-radius: 2px; background: var(--amber); opacity: .4; }
.cx-hbtn-radio.is-on .cx-eq i { opacity: 1; animation: cx-eq .9s ease-in-out infinite; }
.cx-hbtn-radio.is-on .cx-eq i:nth-child(2) { animation-delay: -.3s; }
.cx-hbtn-radio.is-on .cx-eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes cx-eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }

.cx-scoreboard { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; padding: 10px 16px; border-radius: 18px; width: min(620px, 52vw); pointer-events: auto; }
.cx-sb-team { display: grid; gap: 3px; min-width: 0; }
.cx-sb-t1 { text-align: right; }
.cx-sb-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cx-sb-t1 .cx-sb-row { flex-direction: row-reverse; }
.cx-sb-lbl { font: 400 13px var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.cx-sb-t0 .cx-sb-lbl { color: #8db4ff; } .cx-sb-t1 .cx-sb-lbl { color: #ff8b96; }
.cx-sb-score { font-size: 26px; font-weight: 700; line-height: 1; }
.cx-sb-names { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-sb-bar { position: relative; height: 5px; border-radius: 99px; background: rgba(243, 234, 216, .1); overflow: hidden; }
.cx-sb-bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--us)); transition: width .9s var(--ease); }
.cx-sb-t1 .cx-sb-bar i { left: auto; right: 0; background: linear-gradient(270deg, #8a0a1a, var(--them)); }
.cx-hs-sc.is-them .cx-sb-bar i { background: linear-gradient(90deg, #8a0a1a, var(--them)); }
.cx-sb-team.is-close .cx-sb-bar { box-shadow: 0 0 10px rgba(255, 181, 71, .45); }
.cx-sb-team.is-bump .cx-sb-score { animation: cx-bump .6s var(--spring); color: var(--amber); }
.cx-sb-mid { display: grid; justify-items: center; gap: 3px; padding: 0 4px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0 14px; }
.cx-sb-hand { font: 600 10px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.cx-sb-hand .cx-num { color: var(--bone); font-size: 12px; }
.cx-sb-target { font-size: 11px; color: var(--muted); }
.cx-sb-target b { color: var(--bone); }
.cx-sb-pot { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 5px; border-radius: 99px; background: linear-gradient(180deg, #ffc66d, #ffa62a); color: var(--ink); }
.cx-sb-pot .cx-ic { width: 15px; height: 15px; }
.cx-sb-pot b { font-size: 13px; }
.cx-sb-pot small { font: 600 9px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; }
.cx-sb-pot.is-practice { background: rgba(243, 234, 216, .1); color: var(--muted); padding: 3px 9px; }
.cx-sb-pot.is-practice b { font: 600 9.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; }

.cx-badge {
  position: absolute; display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; border-radius: 99px; max-width: 46vw;
  background: rgba(8, 13, 32, .7); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: box-shadow .35s, border-color .35s, transform .35s var(--spring);
}
.cx-badge-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--us); flex: none; box-shadow: 0 0 0 3px rgba(79, 140, 255, .22); }
.cx-badge.is-them .cx-badge-dot { background: var(--them); box-shadow: 0 0 0 3px rgba(255, 77, 94, .22); }
.cx-badge-n { font: 400 12.5px/1.1 var(--f-display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cx-badge-c { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 5px; border-radius: 99px; background: rgba(243, 234, 216, .1); flex: none; }
.cx-badge-c b { font-size: 13px; min-width: 1ch; }
.cx-badge-tile .cx-tile { display: block; filter: none; }
.cx-badge.is-tick .cx-badge-c { animation: cx-bump .4s var(--spring); }
.cx-badge.is-last .cx-badge-c { background: var(--red); color: #fff; animation: cx-breathe 1s ease-in-out infinite; }
.cx-badge.is-turn { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(255, 181, 71, .2), 0 0 26px rgba(255, 181, 71, .45); }
.cx-badge.is-turn .cx-badge-dot { background: var(--amber); animation: cx-breathe 1.1s ease-in-out infinite; box-shadow: 0 0 10px var(--amber); }
.cx-badge-turn { display: none; font: 400 10px var(--f-display); text-transform: uppercase; color: var(--ink); background: var(--amber); padding: 3px 8px; border-radius: 99px; }
.cx-badge.is-myturn .cx-badge-turn { display: inline-block; animation: cx-up .35s var(--ease); }
.cx-badge-0 { left: var(--gl); bottom: var(--gb); }
.cx-badge-1 { right: var(--gr); top: 50%; transform: translateY(-50%); }
.cx-badge-2 { left: 50%; top: calc(var(--gt) + 100px); transform: translateX(-50%); }
.cx-badge-3 { left: var(--gl); top: 50%; transform: translateY(-50%); }

.cx-knock {
  position: absolute; right: var(--gr); bottom: var(--gb); display: grid; grid-template-columns: auto auto; align-items: center; column-gap: 12px;
  padding: 12px 22px 12px 14px; border-radius: 22px; border: 1px solid var(--line); background: rgba(8, 13, 32, .6); color: var(--muted);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  opacity: .5; transform: scale(.9); transform-origin: 100% 100%; transition: all .4s var(--spring);
}
.cx-knock-ic { grid-row: span 2; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: rgba(243, 234, 216, .08); }
.cx-knock-ic .cx-ic { width: 26px; height: 26px; }
.cx-knock-t { display: flex; align-items: baseline; gap: 6px; font: 400 18px var(--f-display); text-transform: uppercase; white-space: nowrap; }
.cx-knock-t span { font-size: 13px; }
.cx-knock small { font-size: 11px; text-align: left; }
.cx-knock.is-ready {
  opacity: 1; transform: scale(1); color: var(--ink); border-color: transparent;
  background: linear-gradient(180deg, #ffc66d, #ffa62a); box-shadow: 0 16px 40px rgba(255, 166, 42, .45);
  animation: cx-knockpulse 1.3s ease-in-out infinite;
}
.cx-knock.is-ready .cx-knock-ic { background: rgba(0, 0, 0, .12); }
.cx-knock.is-ready .cx-knock-ic .cx-ic { animation: cx-tap .9s ease-in-out infinite; transform-origin: 70% 90%; }
.cx-knock.is-ready:hover { transform: scale(1.03); }
@keyframes cx-knockpulse { 0%, 100% { box-shadow: 0 16px 40px rgba(255, 166, 42, .4), 0 0 0 0 rgba(255, 181, 71, .55); } 50% { box-shadow: 0 16px 40px rgba(255, 166, 42, .5), 0 0 0 14px rgba(255, 181, 71, 0); } }
.cx-hud-hint { display: none; }

/* toasts */
.cx-toasts { display: grid; place-items: center; }
.cx-toast {
  position: absolute; top: 36%; left: 50%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 10px;
  text-align: center; pointer-events: none; max-width: calc(100vw - 32px);
}
.cx-toast-t { font: 400 clamp(40px, 9.5vw, 120px)/.95 var(--f-display); text-transform: uppercase; letter-spacing: -.01em; }
.cx-tw { display: inline-block; opacity: 0; transform: translateY(30px) scale(.6) rotate(-6deg); transition: opacity .35s, transform .55s var(--spring); transition-delay: calc(var(--i) * 70ms); }
.cx-toast.is-in .cx-tw { opacity: 1; transform: none; }
.cx-toast.is-out { opacity: 0; transform: translate(-50%, -60%) scale(1.06); filter: blur(6px); transition: all .35s var(--ease); }
.cx-toast-domino .cx-toast-t { color: var(--bone); text-shadow: 0 2px 0 #d6c8a6, 0 5px 0 #a8987a, 0 9px 0 #6d5f45, 0 18px 40px rgba(0, 0, 0, .65); }
.cx-toast-tiles { display: flex; gap: 6px; }
.cx-toast-tiles .cx-tile { transform: translateY(-30px) rotate(-30deg); opacity: 0; transition: all .6s var(--spring); }
.cx-toast-tiles .cx-tile + .cx-tile { transform: translateY(-30px) rotate(30deg); transition-delay: .08s; }
.cx-toast.is-in .cx-toast-tiles .cx-tile { transform: rotate(-12deg); opacity: 1; }
.cx-toast.is-in .cx-toast-tiles .cx-tile + .cx-tile { transform: rotate(12deg); }
.cx-toast-tranque .cx-toast-t { color: #fff; padding: 6px 26px 10px; background: repeating-linear-gradient(-45deg, var(--red) 0 22px, #a50d1e 22px 44px); border-radius: 14px; box-shadow: 0 20px 50px rgba(206, 17, 38, .45), inset 0 0 0 3px rgba(255, 255, 255, .15); }
