<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Veronica's Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
:root{
  --accent:#5CCFC2;
  --accent-strong:color-mix(in oklab,var(--accent) 42%,#0c2a27);
  --accent-soft:color-mix(in oklab,var(--accent) 16%,#fff);
  --accent-ink:#0B2F2C;
  --bg:#FFFFFF; --card:#FFFFFF; --soft:#FAF6F1; --soft-2:#F3EDE6;
  --ink:#2A2522; --muted:#6F6660; --line:#ECE4DB;
  --warm:#F4A98A; --warm-soft:#FDEEE6;
  --high:#E5484D; --medium:#E8A600; --low:#2FA85A;
  --high-soft:#FDECEC; --medium-soft:#FDF4DC; --low-soft:#E7F6EC;
  --done:#00A6C8; --todo:#FF4F7B;
  --danger:#C4312F; --ok:#1F8A4C;
  --radius:20px; --radius-sm:14px; --bw:1.5px;
  --tap:56px; --nav-h:76px;
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px rgba(60,40,20,.07);
  --shadow-lg:0 20px 60px rgba(40,25,10,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body.theme-device{
    --bg:#161311; --card:#1F1B18; --soft:#26211D; --soft-2:#2E2823; --ink:#F4EEE8; --muted:#B5AAA1; --line:#3A332D;
    --accent-strong:color-mix(in oklab,var(--accent) 78%,#fff); --accent-soft:color-mix(in oklab,var(--accent) 18%,#1F1B18);
    --warm-soft:#3A2A22; --high-soft:#3B2222; --medium-soft:#3A3120; --low-soft:#1F3326; --done:#0099BA; --todo:#E6456E;
    --danger:#FF8A80; --ok:#7DD8A0; --shadow:none; --shadow-lg:0 20px 60px rgba(0,0,0,.5); color-scheme:dark;
  }
}
body.theme-dark{
  --bg:#161311; --card:#1F1B18; --soft:#26211D; --soft-2:#2E2823; --ink:#F4EEE8; --muted:#B5AAA1; --line:#3A332D;
  --accent-strong:color-mix(in oklab,var(--accent) 78%,#fff); --accent-soft:color-mix(in oklab,var(--accent) 18%,#1F1B18);
  --warm-soft:#3A2A22; --high-soft:#3B2222; --medium-soft:#3A3120; --low-soft:#1F3326; --done:#0099BA; --todo:#E6456E;
  --danger:#FF8A80; --ok:#7DD8A0; --shadow:none; --shadow-lg:0 20px 60px rgba(0,0,0,.5); color-scheme:dark;
}
body.hc{ --muted:var(--ink); --line:var(--ink); --bw:2.5px; }
body.no-motion *,body.no-motion *::before,body.no-motion *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important} }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;font-weight:500;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-strong);outline-offset:3px;border-radius:10px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:800}
p{margin:0}
.icon{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout ---------- */
.app{min-height:100vh;padding:0 16px calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px))}
.page{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.page.wide{max-width:1100px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.topbar h1{font-size:1.75rem;letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:.95rem;font-weight:600}
.topbar .tb-actions{display:flex;gap:10px}
.round{width:var(--tap);height:var(--tap);border-radius:50%;border:var(--bw) solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;color:var(--ink);transition:background .15s,transform .1s}
.round:hover{background:var(--soft)}
.round:active{transform:scale(.95)}
.round .icon{width:26px;height:26px}
.badge{position:absolute;top:-3px;right:-3px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--high);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center}
.badge[hidden]{display:none}

.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:1.25rem}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}

.btn{min-height:var(--tap);padding:0 22px;border-radius:999px;border:var(--bw) solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:1rem;color:var(--ink);transition:background .15s,transform .1s,box-shadow .2s;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in oklab,var(--accent) 88%,#000);box-shadow:0 8px 20px color-mix(in oklab,var(--accent) 40%,transparent)}
.btn.warm{background:var(--warm);border-color:var(--warm);color:#3A1A0C}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 40%,var(--line))}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 16px;font-size:.92rem}
.btn .icon{width:24px;height:24px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in oklab,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:var(--bw) solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav ul{list-style:none;margin:0 auto;padding:0;max-width:760px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{width:100%;min-height:64px;border:0;background:transparent;border-radius:18px;display:grid;justify-items:center;align-content:center;gap:2px;color:var(--muted);font-weight:800;font-size:.8rem;transition:background .15s,color .15s}
.nav button .icon{width:28px;height:28px}
.nav button[aria-current="page"]{color:var(--accent-strong);background:var(--accent-soft)}
.fab{position:fixed;z-index:41;right:max(16px,calc(50% - 380px + 16px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));min-height:64px;padding:0 26px 0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:1.1rem;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px color-mix(in oklab,var(--accent) 55%,transparent),0 2px 6px rgba(0,0,0,.1);transition:transform .15s}
.fab:active{transform:scale(.96)}
.fab .icon{width:30px;height:30px;stroke-width:2.8}

/* ---------- today ---------- */
.hello{display:grid;gap:4px}
.hello h1{font-size:clamp(1.9rem,6vw,2.5rem);letter-spacing:-.02em}
.hello h1 span{color:var(--accent-strong)}
.hello .date{font-weight:700;color:var(--muted)}
.progress-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--card) 70%)}
.ring{width:108px;height:108px}
.ring .track{stroke:color-mix(in oklab,var(--accent) 22%,var(--line))}
.ring .val{stroke:var(--accent-strong);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring text{font-family:var(--font);font-weight:900;fill:var(--ink)}
.progress-card h2{font-size:1.35rem}
.progress-card p{color:var(--muted);font-weight:600;margin-top:4px}
.verse{background:linear-gradient(160deg,var(--warm-soft),var(--card) 75%);border-color:color-mix(in oklab,var(--warm) 35%,var(--line));position:relative;overflow:hidden}
.verse .lead{font-weight:800;color:var(--ink)}
.verse blockquote{margin:8px 0 6px;font-size:1.12rem;line-height:1.5;font-weight:600;text-wrap:pretty}
.verse .ref{color:var(--muted);font-size:.9rem;font-weight:700}
.verse .close{margin-top:6px;font-weight:700}
.verse-nav{display:flex;gap:8px}
.verse-nav .round{width:46px;height:46px}
.verse-nav .round .icon{width:22px;height:22px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px -4px}
.section-title h2{font-size:1.2rem;display:flex;align-items:center;gap:8px}
.section-title .count{color:var(--muted);font-weight:700;font-size:.95rem}
.empty{padding:22px;text-align:center;color:var(--muted);font-weight:600;border:var(--bw) dashed var(--line);border-radius:var(--radius)}

/* ---------- task rows ---------- */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:12px 14px 12px 12px;box-shadow:var(--shadow);overflow:hidden;transition:transform .2s,opacity .35s,background .3s,max-height .45s}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pc)}
.task.p-high{--pc:var(--high)} .task.p-medium{--pc:var(--medium)} .task.p-low{--pc:var(--low)}
.task .body{border:0;background:none;padding:4px 0;text-align:left;display:grid;gap:5px;min-width:0;color:inherit}
.task .title{font-size:1.08rem;font-weight:800;overflow-wrap:break-word;position:relative;justify-self:start;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 55%;background-size:0 2px;transition:background-size .35s ease}
.task .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.86rem;color:var(--muted);font-weight:700}
.task .meta > span{display:inline-flex;align-items:center;gap:5px}
.task .meta .icon{width:17px;height:17px}
.task .chev{color:var(--muted)}
.task .chev .icon{width:22px;height:22px}
.task.is-done{background:var(--soft)}
.task.is-done .title{color:var(--muted);background-size:100% 2px}
.task.is-late{border-color:color-mix(in oklab,var(--high) 35%,var(--line))}
.cat-chip{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.cat-chip .dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:color-mix(in oklab,var(--cc) 18%,var(--card));color:color-mix(in oklab,var(--cc) 70%,var(--ink))}
.cat-chip .dot .icon{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-weight:800;font-size:.8rem;color:var(--ink);background:var(--ps);border:1.5px solid color-mix(in oklab,var(--pc) 45%,transparent)}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc)}
.pill.p-high{--pc:var(--high);--ps:var(--high-soft)} .pill.p-medium{--pc:var(--medium);--ps:var(--medium-soft)} .pill.p-low{--pc:var(--low);--ps:var(--low-soft)}
.countdown{color:var(--accent-strong)!important}
.late{color:var(--danger)!important}

/* check button + completion animation */
.check{width:48px;height:48px;border-radius:50%;border:0;background:transparent;padding:0;display:grid;place-items:center;flex:none}
.check svg{width:44px;height:44px;overflow:visible}
.check .ring-o{fill:var(--card);stroke:color-mix(in oklab,var(--pc,var(--accent)) 70%,var(--line));stroke-width:2.5;transition:fill .25s,stroke .25s}
.check .tick{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s ease .08s}
.check:hover .ring-o{fill:color-mix(in oklab,var(--pc,var(--accent)) 12%,var(--card))}
.is-done .check .ring-o{fill:var(--ok);stroke:var(--ok)}
.is-done .check .tick{stroke-dashoffset:0}
.task.completing{animation:rowGlow .9s ease}
.task.completing .check svg{animation:checkPop .5s cubic-bezier(.3,1.6,.5,1)}
.task.completing .check::after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;border:3px solid var(--ok);animation:ripple .6s ease-out forwards}
.check{position:relative}
.task.leaving{opacity:0;transform:translateX(24px)}
@keyframes checkPop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes ripple{from{transform:scale(.8);opacity:.8}to{transform:scale(2);opacity:0}}
@keyframes rowGlow{0%{background:var(--card)}35%{background:var(--low-soft)}100%{background:var(--soft)}}
.task .cl{font-size:.86rem}

.coming{display:grid;gap:10px}
.notice{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--radius-sm);background:var(--soft);border:var(--bw) solid var(--line);text-align:left;width:100%;color:inherit}
.notice .big{font-size:1.5rem;font-weight:900;line-height:1;color:var(--accent-strong);min-width:3.2rem;text-align:center}
.notice .big small{display:block;font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.notice strong{font-weight:800}
.quick{display:flex;gap:8px;align-items:center;background:var(--card);border:var(--bw) solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:var(--shadow)}
.quick:focus-within{border-color:var(--accent-strong);box-shadow:0 0 0 4px var(--accent-soft)}
.quick input{flex:1;min-width:0;border:0;background:transparent;min-height:48px;font-size:1.05rem;font-weight:600;outline:none}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--radius);background:var(--accent-soft);border:var(--bw) solid color-mix(in oklab,var(--accent) 45%,var(--line));font-weight:600}
.banner.warmb{background:var(--warm-soft);border-color:color-mix(in oklab,var(--warm) 45%,var(--line))}
.banner .bb{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-head h2{font-size:1.4rem;text-align:center;flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{text-align:center;font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.cal-day{aspect-ratio:1/1.05;min-height:52px;border:var(--bw) solid transparent;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px;gap:4px;color:var(--ink);font-weight:800;font-size:1.02rem;transition:background .15s,border-color .15s}
.cal-day:hover{border-color:var(--accent)}
.cal-day.out{background:transparent;color:var(--muted);opacity:.55}
.cal-day.today .n{background:var(--accent);color:var(--accent-ink)}
.cal-day.sel{border-color:var(--accent-strong);background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent-strong)}
.cal-day .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cal-day .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:40px}
.cal-day .dots i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.cal-day .dots i.d{opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;font-weight:700;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--pc)}

/* ---------- tasks page ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:48px;padding:0 16px 0 10px;border-radius:999px;border:var(--bw) solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--ink);white-space:nowrap}
.chip .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in oklab,var(--cc,var(--accent)) 18%,var(--card));color:color-mix(in oklab,var(--cc,var(--accent)) 70%,var(--ink))}
.chip .dot .icon{width:18px;height:18px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .dot{background:color-mix(in oklab,var(--cc,var(--accent)) 40%,var(--ink));color:#fff}
.chip small{font-weight:700;opacity:.7}
.pri-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--ps);border-left:6px solid var(--pc)}
.pri-head.p-high{--pc:var(--high);--ps:var(--high-soft)} .pri-head.p-medium{--pc:var(--medium);--ps:var(--medium-soft)} .pri-head.p-low{--pc:var(--low);--ps:var(--low-soft)}
.pri-head h2{font-size:1.2rem;flex:1}
.pri-head .n{font-weight:900;font-size:1.3rem}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{min-height:46px;padding:0 18px;border:0;border-radius:999px;background:transparent;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:10px;border:var(--bw) solid var(--line);border-radius:999px;padding:0 16px;background:var(--card)}
.search input{flex:1;border:0;background:transparent;min-height:52px;outline:none;font-size:1rem;font-weight:600;min-width:0}

/* ---------- notes ---------- */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.note{border:var(--bw) solid color-mix(in oklab,var(--nc) 40%,var(--line));background:color-mix(in oklab,var(--nc) 16%,var(--card));border-radius:var(--radius);padding:16px;text-align:left;display:grid;gap:8px;align-content:start;min-height:150px;color:inherit;box-shadow:var(--shadow);transition:transform .15s}
.note:hover{transform:translateY(-2px)}
.note h3{font-size:1.1rem;overflow-wrap:break-word}
.note p{color:var(--ink);opacity:.85;font-weight:600;font-size:.95rem;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.note .when{font-size:.8rem;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}

/* ---------- progress ---------- */
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border-radius:var(--radius-sm);padding:14px;text-align:center}
.stat b{display:block;font-size:1.8rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted);font-weight:700}
.best{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--warm-soft);margin-bottom:12px}
.best .icon{width:36px;height:36px;color:#C2622F;flex:none}
.best strong{font-size:1.35rem;font-weight:900;display:block}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--font);font-weight:700;fill:var(--muted)}
.chart .v{fill:var(--ink);font-weight:900}
.chart .grid line{stroke:var(--line)}
.chart .bar{transition:opacity .2s}
.chart .col:hover .bar{opacity:.85}
.catbars{display:grid;gap:10px}
.catbar{display:grid;grid-template-columns:9.5rem 1fr 2.5rem;gap:10px;align-items:center;font-weight:700}
.catbar .track{height:14px;border-radius:99px;background:var(--soft-2);overflow:hidden}

/* ---------- sheets (dialogs) ---------- */

.switch{appearance:none;-webkit-appearance:none;width:58px;height:34px;border-radius:99px;background:var(--soft-2);border:var(--bw) solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;font-weight:800;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);text-align:center;animation:toastIn .35s cubic-bezier(.2,1.4,.4,1)}

<script type="module">
const S = (() => {
// Shared by the app (browser) and the server (Cloudflare Worker). No DOM here.

const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const PRIORITIES = {
  high:   { label: "High",   color: "#E5484D" },
  medium: { label: "Medium", color: "#E8A600" },
  low:    { label: "Low",    color: "#2FA85A" },
};
const PRI_ORDER = ["high", "medium", "low"];

const DEFAULT_CATEGORIES = [
  { id: "home",         name: "Home",         icon: "home",     color: "#4FB9AD" },
  { id: "work",         name: "Work",         icon: "work",     color: "#5B8DEF" },
  { id: "shopping",     name: "Shopping",     icon: "cart",     color: "#E88B3A" },
  { id: "bills",        name: "Bills",        icon: "receipt",  color: "#8A6FD6" },
  { id: "family",       name: "Family",       icon: "heart",    color: "#E0628A" },
  { id: "cleaning",     name: "Cleaning",     icon: "sparkle",  color: "#3AA7D9" },
  { id: "appointments", name: "Appointments", icon: "calclock", color: "#D9544D" },
  { id: "personal",     name: "Personal",     icon: "person",   color: "#4E9F5B" },
];

// Reminder choices (code -> label). "d" codes are days before; times use the task's time (or 9:00 AM).
const REMINDER_OPTIONS = [
  ["at", "At the time"], ["15m", "15 minutes before"], ["30m", "30 minutes before"], ["1h", "1 hour before"], ["2h", "2 hours before"],
  ["morning", "Morning of"], ["1d", "1 day before"], ["2d", "2 days before"], ["3d", "3 days before"],
  ["1w", "1 week before"], ["10d", "10 days before"], ["2w", "2 weeks before"],
];
function smartReminderDefaults(cat, hasTime) {
  switch (cat) {
    case "appointments": return hasTime ? ["10d", "3d", "1d", "1h"] : ["10d", "3d", "1d", "morning"];
    case "bills":        return ["3d", "1d", "morning"];
    case "shopping":     return ["morning"];
    case "family":       return hasTime ? ["1d", "1h"] : ["1d", "morning"];
    default:             return hasTime ? ["at"] : ["morning"];
  }
}

// ---------- dates (all "YYYY-MM-DD" strings, calendar math in UTC to dodge DST) ----------
const pad = n => String(n).padStart(2, "0");
const dayNum = iso => { const [y, m, d] = iso.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const isoFromDayNum = n => new Date(n * 864e5).toISOString().slice(0, 10);
const addDaysISO = (iso, n) => isoFromDayNum(dayNum(iso) + n);
const weekdayOf = iso => new Date(dayNum(iso) * 864e5).getUTCDay();
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate(); // m is 1-12
function isoOfDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function prettyDate(iso, { weekday = true, short = false } = {}) {
  const [y, m, d] = iso.split("-").map(Number);
  const wd = DAYS[weekdayOf(iso)], mo = MONTHS[m - 1];
  return `${weekday ? (short ? wd.slice(0, 3) : wd) + ", " : ""}${short ? mo.slice(0, 3) : mo} ${d}`;
}
function fmtTime(time, h24) {
  if (!time) return "";
  const [h, m] = time.split(":").map(Number);
  return h24 ? `${pad(h)}:${pad(m)}` : `${(h % 12) || 12}:${pad(m)} ${h >= 12 ? "PM" : "AM"}`;
}
function ordinal(n) { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

// ---------- repeating ----------
// repeat = { freq: "none"|"daily"|"weekly"|"monthly"|"yearly", interval: 1, days: [0..6], until: "" }
function normRepeat(r, date) {
  if (typeof r === "string") {
    const map = { daily: { freq: "daily" }, weekly: { freq: "weekly" }, monthly: { freq: "monthly" } };
    r = map[r] || { freq: "none" };
  }
  r = Object.assign({ freq: "none", interval: 1, days: [], until: "" }, r || {});
  r.interval = Math.max(1, Math.min(99, parseInt(r.interval, 10) || 1));
  if (r.freq === "weekly" && (!r.days || !r.days.length) && date) r.days = [weekdayOf(date)];
  return r;
}
const weekIndex = n => Math.floor((n + 4) / 7); // Sunday-based weeks since 1970

function occursOn(task, iso) {
  if (!task || !task.date) return false;
  const r = task.repeat || { freq: "none" };
  if (!r.freq || r.freq === "none") return task.date === iso;
  if (iso < task.date || (r.until && iso > r.until)) return false;
  if (task.skip && task.skip.includes(iso)) return false;
  const n = Math.max(1, r.interval || 1), a = dayNum(task.date), b = dayNum(iso);
  const [y1, m1, d1] = task.date.split("-").map(Number), [y2, m2, d2] = iso.split("-").map(Number);
  switch (r.freq) {
    case "daily": return (b - a) % n === 0;
    case "weekly": {
      const days = r.days && r.days.length ? r.days : [weekdayOf(task.date)];
      return days.includes(weekdayOf(iso)) && (weekIndex(b) - weekIndex(a)) % n === 0;
    }
    case "monthly": {
      const months = (y2 * 12 + m2) - (y1 * 12 + m1);
      return months % n === 0 && d2 === Math.min(d1, daysInMonth(y2, m2));
    }
    case "yearly":
      return (y2 - y1) % n === 0 && m2 === m1 && d2 === Math.min(d1, daysInMonth(y2, m2));
  }
  return false;
}
function occurrencesBetween(task, from, to) {
  if (!task.date) return [];
  const out = [], start = Math.max(dayNum(from), dayNum(task.date)), end = Math.min(dayNum(to), start + 800);
  if (!task.repeat || task.repeat.freq === "none") return task.date >= from && task.date <= to ? [task.date] : [];
  for (let n = start; n <= end; n++) { const iso = isoFromDayNum(n); if (occursOn(task, iso)) out.push(iso); }
  return out;
}
const isRepeating = t => !!(t.repeat && t.repeat.freq && t.repeat.freq !== "none");
const isDoneOn = (t, iso) => isRepeating(t) ? !!(t.completions && t.completions[iso]) : !!t.done;
/** Next date this task still needs doing, starting from `today` (repeating), or its own date. */
function nextOpenDate(t, today) {
  if (!t.date) return "";
  if (!isRepeating(t)) return t.date;
  for (let n = dayNum(today), i = 0; i < 400; i++, n++) {
    const iso = isoFromDayNum(n);
    if (occursOn(t, iso) && !isDoneOn(t, iso)) return iso;
  }
  return "";
}
function repeatText(r, date) {
  r = normRepeat(r, date);
  if (r.freq === "none") return "Doesn't repeat";
  const every = (unit, plural) => r.interval === 1 ? `Every ${unit}` : `Every ${r.interval} ${plural}`;
  let s;
  if (r.freq === "daily") s = r.interval === 1 ? "Every day" : `Every ${r.interval} days`;
  else if (r.freq === "weekly") {
    const days = (r.days.length ? r.days : [weekdayOf(date)]).slice().sort();
    const names = days.length === 7 ? "day" : days.length === 5 && !days.includes(0) && !days.includes(6) ? "weekday" : days.map(d => DAYS[d]).join(", ");
    s = r.interval === 1 ? `Every ${names}` : `Every ${r.interval} weeks on ${names}`;
  } else if (r.freq === "monthly") s = `${every("month", "months")} on the ${ordinal(Number(date.slice(8)))}`;
  else s = `${every("year", "years")} on ${prettyDate(date, { weekday: false })}`;
  if (r.until) s += `, until ${prettyDate(r.until, { weekday: false, short: true })}`;
  return s;
}

// ---------- time zones ----------
function zoneParts(epoch, tz) {
  const f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const p = Object.fromEntries(f.formatToParts(new Date(epoch)).map(x => [x.type, x.value]));
  return { y: +p.year, m: +p.month, d: +p.day, h: +p.hour % 24, mi: +p.minute, s: +p.second };
}
function zonedEpoch(iso, time, tz) {
  const [y, m, d] = iso.split("-").map(Number), [h, mi] = (time || "09:00").split(":").map(Number);
  const guess = Date.UTC(y, m - 1, d, h, mi);
  const offsetAt = e => { const p = zoneParts(e, tz); return Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi, p.s) - e; };
  let e = guess - offsetAt(guess);
  return guess - offsetAt(e);
}
function localNow(epoch, tz) {
  const p = zoneParts(epoch, tz);
  return { iso: `${p.y}-${pad(p.m)}-${pad(p.d)}`, minutes: p.h * 60 + p.mi, weekday: weekdayOf(`${p.y}-${pad(p.m)}-${pad(p.d)}`) };
}

// ---------- reminders ----------
function reminderEpoch(task, occ, code, settings, tz) {
  const time = task.time || "09:00";
  const mins = { at: 0, "15m": 15, "30m": 30, "1h": 60, "2h": 120 }[code];
  if (mins != null) return zonedEpoch(occ, time, tz) - mins * 60000;
  if (code === "morning") return zonedEpoch(occ, settings.morningTime || "08:00", tz);
  const days = { "1d": 1, "2d": 2, "3d": 3, "1w": 7, "10d": 10, "2w": 14 }[code];
  if (days != null) return zonedEpoch(addDaysISO(occ, -days), time, tz);
  return null;
}

const firstName = s => (s && s.name) || "friend";
function countdownPhrase(daysAway, occ, time, h24) {
  const t = time ? ` at ${fmtTime(time, h24)}` : "";
  if (daysAway <= 0) return `today${t}`;
  if (daysAway === 1) return `tomorrow${t}`;
  return `in ${daysAway} days (${prettyDate(occ, { short: true })}${t})`;
}
function checklistNote(t) {
  const list = t.checklist || [];
  if (!list.length) return "";
  const done = list.filter(i => i.done).length;
  return ` ${done} of ${list.length} checklist items done.`;
}

/** The words for one reminder. Creative, warm, specific to the category. */
function reminderMessage(task, occ, code, settings, todayIso) {
  const name = firstName(settings), h24 = settings.clock24;
  const away = dayNum(occ) - dayNum(todayIso);
  const when = countdownPhrase(away, occ, task.time, h24);
  const soon = ["at", "15m", "30m", "1h", "2h"].includes(code);

      break;

      b = `Put on some music and knock it out, ${name}.`;
      break;

      const lead = { "15m": "15 minutes", "30m": "30 minutes", "1h": "1 hour", "2h": "2 hours" }[code];
      const tm = task.time ? fmtTime(task.time, h24) : "";

      tag: `weekly-${today.iso}`, url: "/?view=calendar",

}

/* ---------------- state ---------------- */
function defaultSettings() {

    weekStart: 0, clock24: false, welcomeOnOpen: true, showVerse: true, favVerses: [],

}
function freshState() {

}
function normalize(raw) {

  const st = { v: 4 };

  const catMap = { health: "personal", me: "personal", errands: "shopping" };
  let cats = Array.isArray(raw.categories) ? raw.categories : [];
  if (!raw.v || raw.v < 4) cats = S.DEFAULT_CATEGORIES.map(c => ({ ...c })); // new category set
  st.categories = cats.length ? cats.map(c => ({ icon: "tag", ...c })) : S.DEFAULT_CATEGORIES.map(c => ({ ...c }));
  const catIds = new Set(st.categories.map(c => c.id));
  const priMap = { urgent: "high", high: "high", medium: "medium", normal: "medium", easy: "low", low: "low" };
  const remMap = { at: ["at"], "10": ["15m"], "30": ["30m"], "60": ["1h"], morning: ["morning"], daybefore: ["1d"], none: [] };
  st.tasks = raw.tasks.filter(t => !t.sample).map(t => {
    const n = Object.assign({ notes: "", checklist: [], time: "", duration: 60, onCalendar: false, completions: {}, done: false }, t);
    n.priority = priMap[t.priority] || "medium";
    n.cat = catIds.has(t.cat) ? t.cat : catIds.has(catMap[t.cat]) ? catMap[t.cat] : st.categories[0].id;
    n.repeat = S.normRepeat(t.repeat, t.date);

}

/* ---------------- storage ---------------- */
let mode = "local"; // "server" | "artifact" | "local"
let lastSaved = "", dirty = false, saving = false, saveTimer = null, dbRef = null;
const getPass = () => ls.get("vw-passcode", "") || window.__vwPass || "";

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Passcode": getPass(), ...(opts.headers || {}) } });
  if (r.status === 401) { showGate(!!getPass()); throw new Error("auth"); }
  if (!r.ok) throw new Error("http " + r.status);

}
function save() {
  try { state.settings.tz = Intl.DateTimeFormat().resolvedOptions().timeZone || state.settings.tz; } catch {}
  ls.set("vw-state", state);
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600);
}
async function flush() {
  saveTimer = null;

  if (mode === "local") { dirty = false; return; }
  saving = true; dirty = false;
  const json = JSON.stringify(state);
  try {
    if (json !== lastSaved) {
      if (mode === "server") await api("/api/state", { method: "PUT", body: JSON.stringify({ state }) });
      else if (mode === "artifact" && dbRef) await dbRef.set(JSON.parse(json));
      lastSaved = json;
    }

  } catch (e) {
    if (e.message !== "auth") { dirty = true; setSync("Offline. Your changes will save when you're connected."); saveTimer = setTimeout(flush, 10000); }
  }

}

  state = JSON.parse(incoming); lastSaved = incoming; ls.set("vw-state", state);

}
let syncMsg = "";
function setSync(m) { syncMsg = m; const el = $("#sync"); if (el) el.textContent = m; }

async function pull() {

  try {
    const r = await api("/api/state");
    if (r.state) applyIncoming(r.state); else { dirty = true; await flush(); }

}
async function detectMode() {
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 3500);
    const r = await fetch("/api/config", { cache: "no-store", signal: ctl.signal }); clearTimeout(tm);
    const j = await r.json();

  } catch {}

/* ---------------- progress ---------------- */
function renderProgress() {
  const t = today(), s = state.settings, nm = esc(name());
  const { total: tTotal, done: tDone } = S.dayProgress(state, t);
  const ws = S.addDaysISO(t, -((S.weekdayOf(t) - s.weekStart + 7) % 7));

  let streak = 0; { const days = new Set(state.log.map(e => e.d)); let d = days.has(t) ? t : S.addDaysISO(t, -1); while (days.has(d)) { streak++; d = S.addDaysISO(d, -1); } }
  const recent = state.log.filter(e => e.d >= S.addDaysISO(t, -55) && e.d <= t);
  const byWd = [0, 0, 0, 0, 0, 0, 0]; recent.forEach(e => byWd[S.weekdayOf(e.d)]++);
  const best = byWd.indexOf(Math.max(...byWd));
  const catCount = {}; recent.forEach(e => catCount[e.cat] = (catCount[e.cat] || 0) + 1);
  const topCat = Object.entries(catCount).sort((a, b) => b[1] - a[1])[0];

  const headline = weekDone === 0 ? `Let's get your week going, ${nm}!` : weekDone < 5 ? `Good start this week, ${nm}!` : weekDone < 15 ? `You're doing great this week, ${nm}!` : `What a week, ${nm}!`;

  const days = [...Array(7)].map((_, i) => {

    const isToday = iso === t, future = iso > t;

    else if (doneHere || p.done) { cls = "some"; mark = String(Math.max(doneHere, p.done)); label = `${Math.max(doneHere, p.done)} done${p.total ? ` of ${p.total}` : ""}`; }
    else if (p.total) { cls = future ? "planned" : "open"; mark = String(p.total); label = `${p.total} planned`; }
    return `<li class="pday ${cls} ${isToday ? "is-today" : ""}"><span class="pd-name">${S.DAYS[S.weekdayOf(iso)].slice(0, 3)}</span>
      <span class="pd-dot" aria-hidden="true">${mark}</span><span class="sr">${S.DAYS[S.weekdayOf(iso)]}: ${label}</span></li>`;
  }).join("");

  return `<div class="page">
    ${topbar("My progress", "")}
    <section class="card phero">
      <div class="phero-num" aria-hidden="true">${weekDone}</div>
      <div><h2>${headline}</h2><p>${sub}</p></div>
    </section>

    <section class="card">
      <h2 style="font-size:1.25rem;margin-bottom:12px">This week</h2>
      <ul class="pweek">${days}</ul>
      <div class="pkey"><span><i class="k all">${icon("check")}</i>All done</span><span><i class="k some">2</i>Some done</span><span><i class="k open">3</i>Still to do</span></div>
    </section>

    <div class="ptiles">
      <div class="ptile"><span class="pt-icon" style="--tc:#E0823D">${icon("today")}</span><b>${tDone} of ${tTotal}</b><span>done today</span></div>
      <div class="ptile"><span class="pt-icon" style="--tc:#E5484D">${icon("flame")}</span><b>${streak} day${streak === 1 ? "" : "s"}</b><span>in a row</span></div>
    </div>

      ${recent.length >= 5
        ? `<div><h2>Your best day is ${S.DAYS[best]}</h2><p>You get the most done on ${S.DAYS[best]}s. Save the big things for then!</p>${topCat ? `<p style="margin-top:6px">You finish the most <strong>${esc(cat(topCat[0]).name)}</strong> tasks.</p>` : ""}</div>`

/* ---------------- completing ---------------- */
const PRAISE = ["Nice work, {n}!", "One down!", "Look at you go, {n}!", "Done and done.", "That's the way, {n}!", "Checked off!", "Proud of you, {n}!", "Keep it rolling!"];

  $("#infoDlg").innerHTML = `<div class="sheet-h"><h2>Put the app on your Home Screen</h2><button class="round" data-close aria-label="Close">${icon("x")}</button></div>
    <div class="sheet-b"><ol class="steps">
      <li><div>Tap the <strong>Share</strong> button at the bottom of Safari. It looks like a square with an arrow ${icon("share")}.</div></li>
      <li><div>Scroll down and tap <strong>Add to Home Screen</strong>, then tap <strong>Add</strong>.</div></li>
      <li><div>Close Safari and open <strong>Veronica's Week</strong> from your Home Screen.</div></li>
      <li><div>Tap <strong>Turn on</strong> notifications and choose <strong>Allow</strong>.</div></li>
    </ol><p class="muted">Needs iPhone software (iOS) 16.4 or newer.</p>
    <button class="btn primary block" data-close>Got it</button></div>`;
  const d = $("#infoDlg"); d._return = document.activeElement; d.showModal();
}

/* ---------------- iPhone calendar ---------------- */
async function calSubscribe(reset) {
  try {
    const c = await api("/api/calendar", { method: reset ? "POST" : "GET" });
    $("#infoDlg").innerHTML = `<div class="sheet-h"><h2>Connect to iPhone Calendar</h2><button class="round" data-close aria-label="Close">${icon("x")}</button></div>
      <div class="sheet-b">
        <a class="btn primary block" href="${esc(c.webcal)}" data-act="calOpened">${icon("calendar")}Open in Calendar</a>
        <p class="muted">Tap the button, then tap <strong>Subscribe</strong> and <strong>Done</strong>. Anything marked “Show on my iPhone Calendar” will show up in the Calendar app.</p>
        <details><summary style="font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center">If the button doesn't work</summary>
          <ol class="steps" style="margin-top:10px"><li><div>Copy this private link:</div></li></ol>
          <div class="copyrow" style="margin:8px 0 12px"><input readonly value="${esc(c.https)}" id="calLink" aria-label="Private calendar link"><button class="btn sm" data-act="copyCal">${icon("copy")}Copy</button></div>
          <ol class="steps" start="2" style="counter-reset:s 1"><li><div>Open the iPhone <strong>Settings</strong> app → <strong>Apps</strong> → <strong>Calendar</strong> → <strong>Calendar Accounts</strong> → <strong>Add Account</strong> → <strong>Other</strong> → <strong>Add Subscribed Calendar</strong>.</div></li>
          <li><div>Paste the link, tap <strong>Next</strong>, then <strong>Save</strong>.</div></li></ol>
        </details>
        <p class="muted" style="font-size:.88rem">Changes show up on the iPhone Calendar within about 15 minutes to an hour. Keep this link private.</p>
      </div>`;
    const d = $("#infoDlg"); if (!d.open) { d._return = document.activeElement; d.showModal(); }
    if (reset) toast("New private link made. The old one stopped working.");
  } catch (e) { if (e.message !== "auth") toast("Couldn't reach the calendar right now"); }
}
async function addOneToCal(id) {
  try { const c = await api("/api/calendar"); location.href = `${c.taskBase}${encodeURIComponent(id)}.ics`; }
  catch (e) { if (e.message !== "auth") toast("Couldn't reach the calendar right now"); }
}

/* ---------------- passcode gate ---------------- */
function showGate(wrong) {
  const g = $("#gate"); g.hidden = false;
  $("#gateErr").textContent = wrong ? "That passcode didn't work. Please try again." : "";
  setTimeout(() => $("#gatePass").focus(), 50);
}

/* ---------------- events ---------------- */
function go(v) { view = v; render(); window.scrollTo({ top: 0, behavior: motionOK() ? "smooth" : "auto" }); $("#main").focus({ preventScroll: true }); }

document.addEventListener("click", async e => {
  const el = e.target.closest("button, a, [data-close]");
  const dlg = e.target.closest("dialog");
  if (e.target.tagName === "DIALOG") { closeDialog(e.target); return; } // backdrop tap
  if (!el) return;
  const ds = el.dataset;

  if (ds.close !== undefined && dlg) { closeDialog(dlg); return; }
  if (ds.view) { go(ds.view); return; }
  if (ds.viewGo) { go(ds.viewGo); return; }
  if (el.id === "fab") { view === "notes" ? openNote() : openEditor(null, { date: view === "calendar" ? selDay : today() }); return; }
  if (ds.complete) { toggleComplete(ds.complete, ds.occ, el); return; }
  if (ds.edit) { if (dlg) closeDialog(dlg); openEditor(ds.edit, { occ: ds.occ }); return; }
  if (ds.newDate !== undefined) { openEditor(null, { date: ds.newDate }); return; }
  if (ds.newPri) { openEditor(null, { priority: ds.newPri }); return; }
  if (ds.day) { selDay = ds.day; const [y, m] = selDay.split("-").map(Number); if (y !== calCursor.getFullYear() || m - 1 !== calCursor.getMonth()) calCursor = new Date(y, m - 1, 1); render(); $(`[data-day="${selDay}"]`)?.focus(); return; }
  if (ds.tcat) { tf.cat = ds.tcat; render(); $(`[data-tcat="${ds.tcat}"]`)?.focus(); return; }
  if (ds.tgroup) { tf.group = ds.tgroup; render(); return; }
  if (ds.note) { openNote(ds.note); return; }
  if (ds.remclose !== undefined) { el.closest(".remcard")?.remove(); return; }
  if (ds.remopen) { el.closest(".remcard")?.remove(); openFromUrl(new URL(ds.remopen, location.href)); return; }

  // editor controls
  if (ed && dlg && dlg.id === "editor") {
    if (ds.ecat) { ed.cat = ds.ecat; edSmartRefresh(); edRerender(`[data-ecat="${ds.ecat}"]`); return; }
    if (ds.epri) { ed.priority = ds.epri; edRerender(`[data-epri="${ds.epri}"]`); return; }
    if (ds.edate !== undefined) { const wasPreset = currentPreset(); ed.date = ds.edate; if (["weekly", "biweekly"].includes(wasPreset) && ed.date) ed.repeat.days = [S.weekdayOf(ed.date)]; edRerender(`[data-edate="${ds.edate}"]`); return; }
    if (ds.ewd) { const d = Number(ds.ewd), days = new Set(ed.repeat.days); days.has(d) ? days.delete(d) : days.add(d); if (!days.size) days.add(d); ed.repeat.days = [...days].sort(); edRerender(`[data-ewd="${d}"]`); return; }
    if (ds.erem) { const set = new Set(ed.remind); set.has(ds.erem) ? set.delete(ds.erem) : set.add(ds.erem); ed.remind = S.REMINDER_OPTIONS.map(o => o[0]).filter(k => set.has(k)); ed._remTouched = true; edRerender(`[data-erem="${ds.erem}"]`); return; }
    if (ds.cldel) { ed.checklist = ed.checklist.filter(i => i.id !== ds.cldel); edRerender("#e-cladd"); return; }
  }
  if (ds.ncolor && ned) { ned.title = $("#n-title").value; ned.body = $("#n-body").value; ned.pinned = $("#n-pin").checked; ned.color = ds.ncolor; renderNoteEditor(); $(`[data-ncolor="${ds.ncolor}"]`)?.focus(); return; }
  if (ds.accent) { state.settings.accent = ds.accent; applySettings(); save(); renderSettings(); $(`[data-accent="${ds.accent}"]`)?.focus(); return; }
  if (ds.catdel) {
    const id = ds.catdel; if (state.categories.length < 2) return;
    const fallback = state.categories.find(c => c.id !== id).id, nm = cat(id).name;
    state.categories = state.categories.filter(c => c.id !== id);
    state.tasks.forEach(t => { if (t.cat === id) t.cat = fallback; });
    state.log.forEach(l => { if (l.cat === id) l.cat = fallback; });
    save(); renderSettings(); render(); toast(`Removed ${nm}. Its tasks moved to ${cat(fallback).name}.`); return;
  }

  switch (ds.act) {
    case "versePrev": verseOffset--; render(); $("[data-act=versePrev]")?.focus(); break;
    case "verseNext": verseOffset++; render(); $("[data-act=verseNext]")?.focus(); break;
    case "upcoming": openUpcoming(); break;
    case "settings": openSettings(); break;
    case "openNotifSettings": closeDialog($("#infoDlg")); openSettings("#setNotif"); break;
    case "moveOverdue": { const t = today(), n = overdueTasks().length; overdueTasks().forEach(x => { x.date = t; delete x.sample; }); save(); render(); toast(`Moved ${n} to today`); break; }
    case "clearSamples": state.tasks = state.tasks.filter(t => !t.sample); state.notes = state.notes.filter(n => !n.sample); state.log = state.log.filter(l => !l.sample); save(); render(); if ($("#settings").open) renderSettings(); toast("Examples cleared. It's all yours!"); break;
    case "clearFinished": { const n = state.tasks.filter(t => !S.isRepeating(t) && t.done).length; state.tasks = state.tasks.filter(t => S.isRepeating(t) || !t.done); save(); render(); toast(`Removed ${n} finished task${n === 1 ? "" : "s"}`); break; }
    case "resetAll":
      if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Tap again to erase everything"; setTimeout(() => { if (document.contains(el)) { el.dataset.confirm = ""; el.textContent = "Start completely fresh"; } }, 4000); break; }
      state = { v: 4, settings: { ...state.settings }, categories: S.DEFAULT_CATEGORIES.map(c => ({ ...c })), tasks: [], notes: [], log: [] };
      save(); renderSettings(); render(); toast("Fresh start!"); break;
    case "dismissSetup": ls.set("vw-setup-dismissed", true); render(); break;
    case "enablePush": enablePush(); break;
    case "disablePush": disablePush(); break;
    case "testPush": api("/api/test", { method: "POST", body: JSON.stringify({ endpoint: pushSub?.endpoint }) }).then(() => toast("Test sent")).catch(() => toast("Couldn't send a test right now")); break;
    case "testRem": { const x = state.tasks.find(t => t.cat === "appointments" && t.date) || state.tasks[0]; closeDialog($("#settings")); if (!x) showRemCard({ title: "Your appointment is in 10 days", body: `This is what a reminder looks like, ${name()}.` }); if (x) { showRemCard(S.reminderMessage(x, S.nextOpenDate(x, today()) || x.date || today(), "10d", state.settings, S.addDaysISO(x.date || today(), -10))); } break; }
    case "installHelp": openInstallHelp(); break;
    case "calPrev": calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1); render(); $("[data-act=calPrev]")?.focus(); break;
    case "calNext": calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1); render(); $("[data-act=calNext]")?.focus(); break;
    case "calToday": { const d = new Date(); calCursor = new Date(d.getFullYear(), d.getMonth(), 1); selDay = today(); render(); break; }
    case "calSubscribe": closeDialog($("#settings")); calSubscribe(false); break;
    case "calReset": calSubscribe(true); break;
    case "calOpened": ls.set("vw-cal-subscribed", true); break;
    case "copyCal": { const inp = $("#calLink"); inp.select(); try { await navigator.clipboard.writeText(inp.value); } catch { document.execCommand && document.execCommand("copy"); } toast("Link copied"); break; }
    case "closeCelebrate": el.closest(".celebrate")?.remove(); break;
    case "closeWelcome": { const w = $("#welcome"); if (w) { w.style.transition = "opacity .3s"; w.style.opacity = "0"; setTimeout(() => w.remove(), motionOK() ? 300 : 0); } go("today"); break; }
    case "showWelcome": closeDialog($("#settings")); showWelcome(); break;
    case "catAdd": state.categories.push({ id: uid(), name: "New category", icon: "tag", color: "#9A8FD6" }); save(); renderSettings(); { const ins = $$("[data-catname]"); ins[ins.length - 1]?.select(); } break;
    case "firstTask": openEditor(null, { date: today() }); break;
    case "edSave": edSave(); break;
    case "edDelete": {
      if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.innerHTML = "Tap again to delete"; el.style.flex = "1"; break; }
      const t = task(ed.id); state.tasks = state.tasks.filter(x => x.id !== ed.id); save(); closeDialog($("#editor")); render(); toast(`Deleted “${t ? t.title : "task"}”`); break;
    }
    case "useSmart": ed.remind = S.smartReminderDefaults(ed.cat, !!ed.time); ed._remTouched = false; edRerender(); break;
    case "clAdd": { const inp = $("#e-cladd"), v = inp.value.trim(); if (v) { ed.checklist.push({ id: uid(), text: v, done: false }); edRerender("#e-cladd"); } else inp.focus(); break; }
    case "addOneToCal": if (ed?.id) addOneToCal(ed.id); break;
    case "noteSave": noteSave(); break;
    case "noteDelete": {
      if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.innerHTML = "Tap again to delete"; el.style.flex = "1"; break; }
      state.notes = state.notes.filter(n => n.id !== ned.id); save(); closeDialog($("#noteDlg")); render(); toast("Note deleted"); break;
    }
  }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (ed && el.closest("#editor")) {
    if (el.id === "e-title") ed.title = el.value;
    else if (el.id === "e-notes") ed.notes = el.value;
    else if (el.dataset.cltext) { const i = ed.checklist.find(x => x.id === el.dataset.cltext); if (i) i.text = el.value; }
    else if (el.id === "e-int") ed.repeat.interval = Math.max(1, Math.min(99, parseInt(el.value, 10) || 1));
    return;
  }
  if (el.id === "tq") { tf.q = el.value; const pos = el.selectionStart; render(); const n = $("#tq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.id === "nq") { noteQ = el.value; const pos = el.selectionStart; render(); const n = $("#nq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.closest("#settings")) {
    if (el.dataset.set && (el.type === "text" || el.type === "range")) { setSetting(el.dataset.set, el); if (el.type === "text") render(); }
    if (el.dataset.catname) { const c = state.categories.find(x => x.id === el.dataset.catname); if (c) { c.name = el.value || "Untitled"; save(); render(); } }
    if (el.dataset.catcolor) { const c = state.categories.find(x => x.id === el.dataset.catcolor); if (c) { c.color = el.value; save(); render(); } }
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (ed && el.closest("#editor")) {
    switch (el.id) {
      case "e-date": { const was = currentPreset(); ed.date = el.value; if (["weekly", "biweekly"].includes(was) && ed.date) ed.repeat.days = [S.weekdayOf(ed.date)]; edRerender("#e-date"); return; }
      case "e-time": ed.time = el.value; edSmartRefresh(); edRerender("#e-time"); return;
      case "e-dur": ed.duration = Number(el.value); return;
      case "e-rep": {
        const p = repeatPresets(ed.date || today()).find(x => x[0] === el.value);
        if (el.value === "custom") { ed._custom = true; if (ed.repeat.freq === "none") ed.repeat = { freq: "weekly", interval: 1, days: [S.weekdayOf(ed.date || today())], until: "" }; }
        else { ed._custom = false; ed.repeat = { ...p[2], until: "" }; if (ed.repeat.freq !== "none" && !ed.date) ed.date = today(); }
        edRerender("#e-rep"); return;
      }
      case "e-freq": ed.repeat.freq = el.value; if (el.value === "weekly" && !ed.repeat.days.length) ed.repeat.days = [S.weekdayOf(ed.date || today())]; ed._custom = true; edRerender("#e-freq"); return;
      case "e-int": ed._custom = true; edRerender("#e-int"); return;
      case "e-endmode": ed.repeat.until = el.value === "on" ? S.addDaysISO(ed.date || today(), 90) : ""; ed._custom = true; edRerender("#e-endmode"); return;
      case "e-until": ed.repeat.until = el.value; return;
      case "e-cal": ed.onCalendar = el.checked; ed._calTouched = true; return;
    }
    if (el.dataset.clcheck) { const i = ed.checklist.find(x => x.id === el.dataset.clcheck); if (i) { i.done = el.checked; el.closest("li").classList.toggle("done", el.checked); if (el.checked) chime(); } return; }
  }
  if (el.id === "tShowDone") { tf.showDone = el.checked; render(); $("#tShowDone")?.focus(); return; }
  if (el.closest("#settings") && el.dataset.set && el.type !== "text" && el.type !== "range") {
    setSetting(el.dataset.set, el);
    if (el.type === "checkbox" && /On$/.test(el.dataset.set)) { renderSettings(); $(`#s-${el.dataset.set}`)?.focus(); }
    render();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "e-cladd") { e.preventDefault(); const v = e.target.value.trim(); if (v) { ed.checklist.push({ id: uid(), text: v, done: false }); edRerender("#e-cladd"); } }
  if (e.key === "Enter" && e.target.id === "e-title") { e.preventDefault(); }
  if (e.key === "Escape" && $("#welcome")) $("[data-act=closeWelcome]")?.click();
  if (e.key === "Escape" && $(".celebrate")) $(".celebrate").remove();
});
document.addEventListener("submit", async e => {
  if (e.target.id === "quickForm") {
    e.preventDefault(); const inp = $("#quickInput"), title = inp.value.trim(); if (!title) return;
    state.tasks.push({ id: uid(), title, notes: "", cat: "personal", priority: "medium", date: today(), time: "", duration: 60, repeat: { freq: "none", interval: 1, days: [], until: "" }, checklist: [], remind: [], onCalendar: false, completions: {}, done: false, createdAt: Date.now() });
    save(); render(); $("#quickInput").focus(); toast(`Added “${title}” to today`);
  }
  if (e.target.id === "gateForm") {
    e.preventDefault(); const v = $("#gatePass").value.trim(); if (!v) return;
    setPass(v); $("#gateErr").textContent = "Checking…";
    try { await api("/api/state"); $("#gate").hidden = true; $("#gatePass").value = ""; await pull(); initPush(); maybeWelcome(); }
    catch (err) { if (err.message !== "auth") $("#gateErr").textContent = "Can't reach the app right now. Check your internet and try again."; }
  }
  if (e.target.id === "edForm") e.preventDefault();
});
document.addEventListener("close", e => { if (e.target.tagName === "DIALOG") { const r = e.target._return; if (r && document.contains(r)) r.focus({ preventScroll: true }); if (e.target.id === "editor") ed = null; if (e.target.id === "noteDlg") ned = null; } }, true);

function openFromUrl(u) {
  const p = u.searchParams;
  if (p.get("view") && VIEWS.some(v => v[0] === p.get("view"))) go(p.get("view"));
  if (p.get("task") && task(p.get("task"))) openEditor(p.get("task"), { occ: p.get("day") || "" });
  if (p.get("welcome")) showWelcome();
}

/* ---------------- boot ---------------- */
async function boot() {
  applySettings(); render();
  await detectMode();
  applySettings(); render();
  const params = new URL(location.href);
  if (params.search && mode === "server") history.replaceState(null, "", "/");
  if (mode === "server") {
    if (!getPass()) { showGate(false); }
    else { await pull(); initPush(); }
    setInterval(() => { if (!document.hidden) pull(); }, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { pull(); if (!$("#gate").hidden) return; maybeWelcome(); } });
    addEventListener("online", () => { pull(); flush(); });
  }
  if (mode !== "server" || getPass()) {
    if (params.searchParams.get("task") || params.searchParams.get("view")) openFromUrl(params); else maybeWelcome(!!params.searchParams.get("welcome"));
  }
  setTimeout(checkInApp, 5000); setInterval(checkInApp, 30000);
  let lastDay = today(); setInterval(() => { if (today() !== lastDay) { lastDay = today(); selDay = lastDay; render(); } }, 60000);
}
boot();

</script>

</body></html>
