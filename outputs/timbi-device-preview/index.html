<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Timbí Device Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
:root{color-scheme:dark;--night:#070c24;--ink:#0f1737;--line:rgba(155,184,255,.18);--brick:#f6f1e8;--muted:#a4aed6;--crackle:#ffb53d;
  --grad:linear-gradient(100deg,#ffd27a 0%,#ffb53d 35%,#ff6a2b 70%,#e2402f 100%)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(60% 50% at 15% 10%,rgba(77,125,255,.22),transparent 60%),radial-gradient(60% 50% at 90% 95%,rgba(255,106,43,.16),transparent 60%),var(--night);color:var(--brick);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid #9bb8ff;outline-offset:3px;border-radius:10px}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(7,12,36,.7);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand .blogo{height:40px;width:auto;display:block;filter:drop-shadow(0 0 8px rgba(155,184,255,.7)) drop-shadow(0 0 18px rgba(77,125,255,.45))}
.brand b{font-family:"Unbounded",system-ui,sans-serif;font-weight:900;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{background:none;border:0;border-radius:999px;padding:9px 18px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--brick);color:var(--night)}
.seg svg{width:16px;height:16px}
.tool{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none}
.tool:hover{background:rgba(255,255,255,.12)}
.hot{background:var(--grad);color:#1d0f02;border:0}
.hot:hover{background:var(--grad);filter:brightness(1.06)}
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:24px}
.fit{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
/* phone */
.phone{width:430px;height:884px;border-radius:64px;background:#0a0d1f;padding:20px;box-shadow:0 0 0 2px #2b345f,0 0 0 9px #11162f,0 0 0 11px #2b345f,0 60px 120px -30px rgba(0,0,0,.9),0 0 120px rgba(77,125,255,.25)}
.phone .scr{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:#000}
.phone .island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:3;pointer-events:none}
.phone .home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(255,255,255,.6);z-index:3;pointer-events:none}
.phone iframe{width:390px;height:844px;border:0;display:block}
/* desktop */
.desk{width:1440px;height:946px;border-radius:18px;overflow:hidden;background:#0a0d1f;box-shadow:0 0 0 2px #2b345f,0 60px 120px -30px rgba(0,0,0,.9),0 0 140px rgba(77,125,255,.2)}
.desk .chrome{height:46px;background:#141a3c;display:flex;align-items:center;gap:10px;padding:0 18px}
.desk .chrome i{width:13px;height:13px;border-radius:50%;background:#e2402f;display:block}
.desk .chrome i:nth-child(2){background:#ffb53d}.desk .chrome i:nth-child(3){background:#4ade80}
.desk .url{margin-left:18px;flex:1;max-width:560px;height:28px;border-radius:14px;background:#0a0d1f;display:flex;align-items:center;padding:0 14px;font-size:13px;color:var(--muted)}
.desk iframe{width:1440px;height:900px;border:0;display:block}
.note{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.06em}
@media (max-width:700px){.brand span{display:none}.top{padding:12px 16px}.tool.hide-sm{display:none}}
</style>

<div class="top">
  <div class="brand"><img class="blogo" src="img/logo-light.png" alt="Timbí Latin Experience"><span>Website preview · by LTGPEAK</span></div>
  <div class="seg" role="group" aria-label="Device">
    <button id="b-phone" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>Phone</button>
    <button id="b-desk" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Desktop</button>
  </div>
  <button class="tool" id="replay">Replay intro</button>
  <a class="tool hot hide-sm" href="site.html" target="_blank" rel="noopener">Open full site ↗</a>
</div>

<div class="stage" id="stage">
  <div class="fit" id="fit">
    <div class="phone" id="phone"><div class="scr"><iframe id="f-phone" src="site.html" title="Timbí site on a phone"></iframe><div class="home"></div></div></div>
    <div class="desk" id="desk" hidden><div class="chrome"><i></i><i></i><i></i><div class="url">timbi · order online</div></div><iframe id="f-desk" title="Timbí site on a desktop"></iframe></div>
  </div>
  <div class="note" id="note">Scroll and tap inside the phone like it's the real thing.</div>
</div>

<script>
let mode="phone";
const fit=document.getElementById("fit"),stage=document.getElementById("stage");
const phone=document.getElementById("phone"),desk=document.getElementById("desk");
const fP=document.getElementById("f-phone"),fD=document.getElementById("f-desk");
function size(){const el=mode==="phone"?phone:desk;const w=el.offsetWidth,h=el.offsetHeight;
  const r=stage.getBoundingClientRect();const s=Math.min((r.width-32)/w,(r.height-48)/h,1);
  fit.style.width=w+"px";fit.style.height=h+"px";fit.style.transform=`translate(-50%,-52%) scale(${s})`}
function setMode(m){mode=m;phone.hidden=m!=="phone";desk.hidden=m!=="desk";
  document.getElementById("b-phone").setAttribute("aria-pressed",m==="phone");document.getElementById("b-desk").setAttribute("aria-pressed",m==="desk");
  if(m==="desk"&&!fD.getAttribute("src"))fD.setAttribute("src","site.html");
  document.getElementById("note").textContent=m==="phone"?"Scroll and tap inside the phone like it's the real thing.":"Full desktop layout at 1440px, scaled to fit your screen.";
  size();try{localStorage.setItem("timbi-preview-mode",m)}catch(e){}}
document.getElementById("b-phone").onclick=()=>setMode("phone");
document.getElementById("b-desk").onclick=()=>setMode("desk");
document.getElementById("replay").onclick=()=>{const f=mode==="phone"?fP:fD;try{f.contentWindow.location.reload()}catch(e){f.src=f.src}};
addEventListener("resize",size);
let m0="phone";try{m0=localStorage.getItem("timbi-preview-mode")||"phone"}catch(e){}
setMode(m0);
</script>

</body></html>
