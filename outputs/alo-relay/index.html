/* ===== module: insights ===== */
/* ===== Insights: the store manager's live dashboard of floor-to-stockroom traffic ===== */
(function () {
'use strict';
const { esc, h, $ } = ALO.util;
const U = ALO.util;
const GOAL = 3 * 60000, HOUR = 3600000;
const BUCKETS = [
  { label: '<1m', lo: 0, hi: 60000 },
  { label: '1–2m', lo: 60000, hi: 120000 },
  { label: '2–3m', lo: 120000, hi: 180000 },
  { label: '3–5m', lo: 180000, hi: 300000 },
  { label: '5m+', lo: 300000, hi: Infinity }
];
// in-memory reorder list (lives for the page session, survives view switches)
const reorder = [];

/* ---------- helpers ---------- */
const first = id => { const s = ALO.staff(id); return s ? s.name.split(' ')[0] : 'Someone'; };
const hourLabel = hh => (hh % 12 || 12) + ' ' + (hh >= 12 ? 'PM' : 'AM');
const vkey = (pid, color, size) => pid + '|' + color + '|' + size;
const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const px = v => Math.round(v) + 0.5; // crisp hairlines
function pickStep(raw, steps) { for (const s of steps) if (s >= raw) return s; return steps[steps.length - 1] * Math.ceil(raw / steps[steps.length - 1]); }
function median(a) { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function quant(a, q) { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(q * s.length))]; }
function durHTML(ms) { return esc(U.fmtDur(ms)).replace(/(\d+)([hms])/g, '$1<span class="in-u">$2</span>'); }
const variantText = q => q.kind === 'item' ? esc(ALO.reqTitle(q)) + ' · ' + esc(q.color) + ' · ' + esc(q.size) : esc(ALO.reqTitle(q));
function transferFor(g) { const t = ALO.data.transfers; for (let i = t.length - 1; i >= 0; i--) if (t[i].pid === g.pid && t[i].color === g.color && t[i].size === g.size) return t[i]; return null; }
function storeName(t) {
  if (!t) return '';
  if (t.store && typeof t.store === 'object') return t.store.name || 'nearby store';
  const s = ALO.data.NEARBY.find(x => x.id === t.store);
  return s ? s.name : (t.storeName || String(t.store || 'nearby store'));
}

function spark(vals, cls) {
  const W = 84, H = 26, P = 3;
  const pts = vals.map((v, i) => v == null ? null : [i, v]).filter(Boolean);
  if (pts.length < 2) return '';
  const max = Math.max.apply(null, pts.map(p => p[1])), min = Math.min.apply(null, pts.map(p => p[1]));
  const span = max - min || 1;
  const x = i => P + i / Math.max(1, vals.length - 1) * (W - 2 * P);
  const y = v => H - P - (v - min) / span * (H - 2 * P);
  const line = pts.map(p => x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return '<svg class="in-spark' + (cls ? ' ' + cls : '') + '" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><polyline points="' + line + '"/><circle cx="' + x(last[0]).toFixed(1) + '" cy="' + y(last[1]).toFixed(1) + '" r="2.4"/></svg>';
}

/* ---------- metrics (all derived from ALO.requestsToday()) ---------- */
function compute() {
  const now = ALO.now();
  const S = ALO.data.STORE;
  const all = ALO.requestsToday().filter(q => q.createdAt <= now + 5000);
  const curH = new Date(now).getHours();
  const startH = S.opens;
  const endH = Math.max(startH, Math.min(curH, S.closes - 1));
  const hours = [];
  for (let hh = startH; hh <= endH; hh++) hours.push({ hh, label: hourLabel(hh), n: 0, del: [], under: 0, miss: 0, current: hh === curH });
  const hourOf = ts => hours[new Date(ts).getHours() - startH];
  const delivered = [], misses = [], lastHourDel = [];
  const buckets = BUCKETS.map(b => Object.assign({ n: 0 }, b));
  let lastHour = 0;

  all.forEach(q => {
    const b = hourOf(q.createdAt);
    if (b) b.n++;
    if (q.createdAt > now - HOUR) lastHour++;
    if (q.status === 'delivered' && q.deliveredAt) {
      const d = Math.max(0, q.deliveredAt - q.createdAt);
      delivered.push(d);
      if (q.deliveredAt > now - HOUR) lastHourDel.push(d);
      if (b) { b.del.push(d); if (d < GOAL) b.under++; }
      const k = buckets.find(x => d >= x.lo && d < x.hi); if (k) k.n++;
    }
    if (q.status === 'unavailable' && q.kind === 'item') { misses.push(q); if (b) b.miss++; }
  });

  const waiting = all.filter(q => ALO.isOpen(q) && q.waiting).sort((a, b) => a.createdAt - b.createdAt);

  // demand signals: unavailable asks grouped by exact variant
  const gm = new Map();
  misses.forEach(q => {
    const p = ALO.product(q.pid); if (!p) return;
    const k = vkey(q.pid, q.color, q.size);
    let g = gm.get(k);
    if (!g) { g = { key: k, pid: q.pid, color: q.color, size: q.size, p, count: 0, risk: 0, last: 0 }; gm.set(k, g); }
    g.count++; g.risk += p.price * (q.qty || 1); g.last = Math.max(g.last, q.createdAt);
  });
  const groups = Array.from(gm.values()).sort((a, b) => b.count - a.count || b.risk - a.risk || b.last - a.last);
  groups.forEach(g => { g.back = ALO.stockOf(g.pid, g.color, g.size).back; });
  const atRisk = groups.reduce((s, g) => s + g.risk, 0);

  // most requested styles
  const sm = new Map();
  all.forEach(q => {
    if (q.kind !== 'item') return;
    let s = sm.get(q.pid);
    if (!s) { s = { pid: q.pid, p: ALO.product(q.pid), n: 0, sizes: {}, colors: {} }; sm.set(q.pid, s); }
    s.n++; s.sizes[q.size] = (s.sizes[q.size] || 0) + 1; s.colors[q.color] = (s.colors[q.color] || 0) + 1;
  });
  const styles = Array.from(sm.values()).filter(s => s.p).sort((a, b) => b.n - a.n).slice(0, 8);
  styles.forEach(s => {
    s.top = Object.entries(s.sizes).sort((a, b) => b[1] - a[1]).slice(0, 3);
    s.topColor = Object.entries(s.colors).sort((a, b) => b[1] - a[1])[0][0];
  });

  // team
  const runners = ALO.data.STAFF.filter(s => s.role === 'stockroom').map(s => {
    const mine = all.filter(q => q.claimedBy === s.id);
    const pulled = mine.filter(q => q.sentAt && q.claimedAt);
    const del = mine.filter(q => q.status === 'delivered' && q.deliveredAt);
    return {
      s, pulls: pulled.length,
      pull: avg(pulled.map(q => q.sentAt - q.claimedAt)),
      total: avg(del.map(q => q.deliveredAt - q.createdAt)),
      cur: mine.filter(q => ALO.isOpen(q)).sort((a, b) => b.claimedAt - a.claimedAt)[0] || null
    };
  }).sort((a, b) => b.pulls - a.pulls);
  const assoc = ALO.data.STAFF.filter(s => s.role === 'floor')
    .map(s => ({ s, n: all.filter(q => q.requestedBy === s.id).length }))
    .sort((a, b) => b.n - a.n);

  // zones
  const zones = ALO.data.ZONES.map(z => ({ z, n: 0, open: 0 }));
  all.forEach(q => { const zz = zones.find(x => x.z === q.zone); if (zz) { zz.n++; if (ALO.isOpen(q)) zz.open++; } });

  // activity feed
  const ev = [];
  all.forEach(q => {
    const what = variantText(q), zone = esc(q.zone);
    const run = q.claimedBy ? '<b>' + esc(first(q.claimedBy)) + '</b>' : 'Stockroom';
    ev.push({ t: q.createdAt, k: 'new', id: q.id + 'n', html: '<b>' + esc(first(q.requestedBy)) + '</b> ' + (q.kind === 'supply' ? 'asked for ' + what + ' at ' : 'requested ' + what + ' for ') + zone });
    if (q.claimedAt && q.claimedBy) ev.push({ t: q.claimedAt, k: 'picking', id: q.id + 'c', html: run + ' started pulling ' + what });
    if (q.sentAt) ev.push({ t: q.sentAt, k: 'sent', id: q.id + 's', html: run + ' picked ' + what + ' for ' + zone });
    if (q.status === 'delivered' && q.deliveredAt) ev.push({ t: q.deliveredAt, k: 'delivered', id: q.id + 'd', html: what + ' delivered to ' + zone + ' <span class="faint">· ' + esc(U.fmtDur(q.deliveredAt - q.createdAt)) + '</span>' });
    if (q.status === 'unavailable' && q.closedAt) ev.push({ t: q.closedAt, k: 'unavailable', id: q.id + 'u', html: run + ' couldn’t find ' + what + ' <span class="in-risk">· not in the back</span>' });
    if (q.status === 'cancelled' && q.closedAt) ev.push({ t: q.closedAt, k: 'cancelled', id: q.id + 'x', html: what + ' cancelled' + (q.reason ? ' <span class="faint">· ' + esc(q.reason.toLowerCase()) + '</span>' : '') });
  });
  const feed = ev.filter(e => e.t <= now).sort((a, b) => b.t - a.t).slice(0, 10);

  const under = delivered.filter(d => d < GOAL).length;
  return {
    now, all, hours, delivered, under, buckets, lastHour, lastHourDel, waiting, misses, groups, atRisk,
    styles, runners, assoc, zones, feed,
    avgDel: avg(delivered), medDel: median(delivered), p90: quant(delivered, 0.9)
  };
}

/* ---------- section renderers ---------- */

function sigRow(g, maxCount) {

function paintDemand(el, D, expanded) {

function hourlySVG(D, W) {
  const hrs = D.hours;
  const H = W < 520 ? 236 : 268;
  const m = { l: 36, r: 40, t: 30, b: 48 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const K = 5;
  const maxN = Math.max(1, Math.max.apply(null, hrs.map(b => b.n)));
  const stepL = pickStep(maxN / K, [1, 2, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50, 60, 80, 100]);
  const avgs = hrs.map(b => b.del.length ? avg(b.del) / 60000 : null);
  const maxM = Math.max(3.4, Math.max.apply(null, avgs.map(v => v || 0)));
  const stepR = pickStep(maxM / K, [0.5, 1, 1.5, 2, 3, 4, 5, 10]);
  const topL = stepL * K, topR = stepR * K;
  const base = m.t + ph;
  const yL = v => base - v / topL * ph, yR = v => base - v / topR * ph;
  const band = pw / hrs.length, bw = Math.min(60, band * 0.54);
  const fmtR = v => (Math.round(v * 10) / 10) + 'm';
  let s = '<svg class="in-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Requests by hour with average delivery minutes">';
  s += '<text class="in-axis-t" x="' + (m.l - 8) + '" y="13" text-anchor="end">Req</text>';
  s += '<text class="in-axis-t" x="' + (W - m.r + 8) + '" y="13">Avg</text>';
  for (let i = 0; i <= K; i++) {
    const y = base - i / K * ph;
    s += '<line class="in-grid' + (i === 0 ? ' is-base' : '') + '" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + px(y) + '" y2="' + px(y) + '"/>';
    s += '<text class="in-tick" x="' + (m.l - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + (stepL * i) + '</text>';
    s += '<text class="in-tick" x="' + (W - m.r + 8) + '" y="' + (y + 4).toFixed(1) + '">' + fmtR(stepR * i) + '</text>';
  }
  hrs.forEach((b, i) => {
    const cx = m.l + band * (i + 0.5), y = yL(b.n);
    const a = b.del.length ? U.fmtDur(avg(b.del)) : 'no deliveries yet';
    s += '<rect class="in-bar' + (b.current ? ' is-now' : '') + '" x="' + (cx - bw / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0, base - y).toFixed(1) + '" rx="2"><title>' + esc(b.label + (b.current ? ' (so far)' : '') + ': ' + b.n + ' requests · avg ' + a) + '</title></rect>';
    s += '<text class="in-bar-n" x="' + cx.toFixed(1) + '" y="' + (base - 7).toFixed(1) + '" text-anchor="middle">' + b.n + '</text>';
    s += '<text class="in-xl" x="' + cx.toFixed(1) + '" y="' + (base + 19) + '" text-anchor="middle">' + esc(b.label) + '</text>';
    if (b.current) s += '<text class="in-xs" x="' + cx.toFixed(1) + '" y="' + (base + 34) + '" text-anchor="middle">So far</text>';
  });
  const gy = yR(3);
  s += '<line class="in-goal" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + px(gy) + '" y2="' + px(gy) + '"/>';
  s += '<text class="in-goal-t" x="' + (m.l + 6) + '" y="' + (gy - 6).toFixed(1) + '">3 min goal</text>';
  const pts = [];
  avgs.forEach((v, i) => { if (v != null) pts.push([m.l + band * (i + 0.5), yR(v), v, hrs[i]]); });
  if (pts.length > 1) s += '<path class="in-line" d="M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + '"/>';
  pts.forEach(p => {
    s += '<circle class="in-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.6"><title>' + esc(p[3].label + ': avg ' + U.fmtDur(p[2] * 60000) + ' to fill') + '</title></circle>';
    s += '<text class="in-dot-t" x="' + p[0].toFixed(1) + '" y="' + (p[1] - 10).toFixed(1) + '" text-anchor="middle">' + p[2].toFixed(1) + '</text>';
  });
  return s + '</svg>';
}

function speedSVG(D, W) {
  const B = D.buckets;
  const H = 232;
  const m = { l: 4, r: 4, t: 34, b: 30 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const base = m.t + ph;
  const max = Math.max(1, Math.max.apply(null, B.map(b => b.n)));
  const total = B.reduce((s, b) => s + b.n, 0);
  const band = pw / B.length, bw = Math.min(70, band * 0.62);
  const room = 22; // space above the tallest bar for its label
  let s = '<svg class="in-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Delivery speed distribution">';
  s += '<line class="in-grid is-base" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + px(base) + '" y2="' + px(base) + '"/>';
  B.forEach((b, i) => {
    const cx = m.l + band * (i + 0.5);
    const hgt = b.n / max * (ph - room);
    const y = base - hgt;
    const met = b.hi <= GOAL;
    s += '<rect class="in-hbin' + (met ? ' is-met' : '') + '" x="' + (cx - bw / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hgt.toFixed(1) + '" rx="2"><title>' + esc(b.label + ': ' + b.n + ' deliveries') + '</title></rect>';
    s += '<text class="in-hval" x="' + cx.toFixed(1) + '" y="' + (y - 8).toFixed(1) + '" text-anchor="middle">' + b.n + '<tspan class="in-hpct" dx="4">' + pct(b.n, total) + '%</tspan></text>';
    s += '<text class="in-xl" x="' + cx.toFixed(1) + '" y="' + (base + 19) + '" text-anchor="middle">' + esc(b.label) + '</text>';
  });
  const gx = px(m.l + band * 3);
  s += '<line class="in-goal" x1="' + gx + '" x2="' + gx + '" y1="' + (m.t - 12) + '" y2="' + base + '"/>';
  s += '<text class="in-goal-t" x="' + (gx - 6) + '" y="' + (m.t - 16) + '" text-anchor="end">3 min goal</text>';
  return s + '</svg>';
}

function paintStyles(el, D) {
  const max = D.styles.length ? D.styles[0].n : 1;
  el.innerHTML = D.styles.length ? '<ol class="in-styles">' + D.styles.map((s, i) =>
    '<li class="in-style"><span class="in-rank mono">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<div class="in-style-main"><div class="in-style-top"><span class="in-style-name">' + esc(s.p.name) + '</span><span class="in-style-n tnum">' + s.n + '</span></div>' +
      '<div class="in-hbar" aria-hidden="true"><i style="width:' + Math.max(3, Math.round(s.n / max * 100)) + '%"></i></div>' +
      '<div class="in-sizes"><span class="swatch in-sw-sm" style="background:' + ALO.colorHex(s.topColor) + '" title="Most asked color: ' + esc(s.topColor) + '"></span>' +
        s.top.map(t => '<span class="in-size">' + esc(t[0]) + ' <b class="tnum">' + t[1] + '</b></span>').join('') + '</div></div></li>').join('') + '</ol>'
    : '<div class="empty"><p>No item requests yet today.</p></div>';
}

function paintTeam(el, D) {
  const maxA = Math.max(1, D.assoc.length ? D.assoc[0].n : 1);
  const curText = r => {
    const q = r.cur;
    if (!q) return 'Free';
    return q.status === 'sent' ? 'Walking to ' + esc(q.zone) : 'Pulling ' + variantText(q);
  };
  el.innerHTML =
    '<div class="in-lb" role="table" aria-label="Runner leaderboard">' +
      '<div class="in-lb-r in-lb-h" role="row"><span role="columnheader">Runner</span><span role="columnheader">Pulls</span><span role="columnheader">Avg pull</span><span role="columnheader">Avg total</span></div>' +
      D.runners.map((r, i) =>
        '<div class="in-lb-r" role="row"><span class="in-lb-who" role="cell"><span class="in-lb-rank mono">' + (i + 1) + '</span>' + ALO.ui.avatar(r.s.id, 34) +
          '<span class="in-lb-name"><b>' + esc(r.s.name.split(' ')[0]) + '</b><small class="' + (r.cur ? 'is-busy' : '') + '">' + curText(r) + '</small></span></span>' +
          '<span class="in-lb-big tnum" role="cell">' + r.pulls + '</span>' +
          '<span class="mono" role="cell">' + (r.pulls ? esc(U.fmtDur(r.pull)) : '—') + '</span>' +
          '<span class="mono" role="cell">' + (r.total ? esc(U.fmtDur(r.total)) : '—') + '</span></div>').join('') +
    '</div>' +
    '<p class="eyebrow in-assoc-h">Team · requests sent</p>' +
    '<ul class="in-assoc">' + D.assoc.map(a =>
      '<li>' + ALO.ui.avatar(a.s.id, 26) + '<span class="in-assoc-name">' + esc(a.s.name.split(' ')[0]) + '</span>' +
        '<span class="in-hbar is-thin" aria-hidden="true"><i style="width:' + Math.max(3, Math.round(a.n / maxA * 100)) + '%"></i></span>' +
        '<span class="tnum in-assoc-n">' + a.n + '</span></li>').join('') + '</ul>';
}

function paintHeat(el, D) {
  const max = Math.max(1, Math.max.apply(null, D.zones.map(z => z.n)));
  const tile = (z, name) => {
    const a = Math.round(5 + z.n / max * 75);
    return '<div class="in-tile' + (a >= 46 ? ' is-strong' : '') + '" style="--in-a:' + a + '%" title="' + esc(z.z + ': ' + z.n + ' requests today') + '">' +
      '<span class="in-tile-name">' + esc(name) + '</span><b class="in-tile-n tnum">' + z.n + '</b>' +
      '<span class="in-tile-w">' + (z.open ? '<i></i>' + z.open + ' open' : '&nbsp;') + '</span></div>';
  };
  const rooms = D.zones.filter(z => /Wall|Table|Bar|Window/.test(z.z));
  const floor = D.zones.filter(z => !/Wall|Table|Bar|Window/.test(z.z));
  el.innerHTML =
    '<p class="in-heat-g">Store floor</p><div class="in-tiles is-floor">' + rooms.map(z => tile(z, z.z)).join('') + '</div>' +
    '<p class="in-heat-g">Register and back of house</p><div class="in-tiles is-floor">' + floor.map(z => tile(z, z.z)).join('') + '</div>' +
    '<div class="in-heat-key"><span>Fewer</span><i></i><span>More requests</span></div>';
}

function paintFeed(el, D, seen) {
  el.innerHTML = D.feed.length ? '<ol class="in-feed">' + D.feed.map(e =>
    '<li class="in-ev' + (seen && !seen.has(e.id) ? ' is-fresh' : '') + '" data-k="' + e.k + '"><time>' + U.fmtTime(e.t) + '</time><span class="in-ev-dot"></span><span class="in-ev-t">' + e.html + '</span></li>').join('') + '</ol>'
    : '<div class="empty"><p>No activity yet.</p></div>';
}

/* ---------- reorder tray ---------- */
function openTray(onChange) {
  if (!reorder.length) { ALO.ui.toast('Reorder list is empty. Add sizes from Shortages.', 'info', { icon: 'list' }); return; }
  const body = h('<div class="in-rl"></div>');
  const foot = h('<div class="in-rl-foot"><button class="btn btn-ghost" type="button" data-clear>Clear list</button><button class="btn btn-primary" type="button" data-submit>Submit to replenishment</button></div>');
  const draw = () => {
    const units = reorder.reduce((s, r) => s + r.qty, 0);
    body.innerHTML = reorder.length
      ? '<p class="in-rl-lede">Suggested quantities cover today’s asks plus a size-run buffer. Adjust before you submit.</p><ul class="in-rl-list">' + reorder.map(r => {
          const p = ALO.product(r.pid);
          return '<li class="in-rl-item" data-key="' + esc(r.key) + '"><div class="thumb in-rl-thumb">' + ALO.ui.garment(p, r.color) + '</div>' +
            '<div class="in-rl-main"><b>' + esc(p.name) + '</b><span>' + esc(r.color) + ' · ' + esc(r.size) + ' · asked ' + r.asked + '× today</span><span class="mono faint">' + esc(p.sku) + ' · ' + U.fmtMoney(p.price) + '</span></div>' +
            '<div class="in-rl-qty"><button class="icon-btn" type="button" data-q="-1" aria-label="Less">' + ALO.ui.icon('minus', 16) + '</button><b class="tnum">' + r.qty + '</b><button class="icon-btn" type="button" data-q="1" aria-label="More">' + ALO.ui.icon('plus', 16) + '</button></div>' +
            '<button class="icon-btn" type="button" data-rm aria-label="Remove">' + ALO.ui.icon('x', 16) + '</button></li>';
        }).join('') + '</ul><p class="in-rl-total"><span>Total</span><b class="tnum">' + units + ' units · ' + reorder.length + (reorder.length === 1 ? ' size' : ' sizes') + '</b></p>'
      : '<div class="empty"><p>List cleared.</p></div>';
    $('[data-submit]', foot).disabled = !reorder.length;
  };
  draw();
  body.addEventListener('click', e => {
    const li = e.target.closest('[data-key]'); if (!li) return;
    const i = reorder.findIndex(r => r.key === li.dataset.key); if (i < 0) return;
    const q = e.target.closest('[data-q]');
    if (q) reorder[i].qty = Math.max(1, reorder[i].qty + Number(q.dataset.q));
    else if (e.target.closest('[data-rm]')) reorder.splice(i, 1);
    else return;
    draw(); onChange();
  });
  const d = ALO.ui.drawer({ title: 'Reorder list', content: body, foot, width: 480 });
  $('[data-clear]', foot).onclick = () => { reorder.length = 0; draw(); onChange(); d.close(); };
  $('[data-submit]', foot).onclick = () => {
    const n = reorder.length, units = reorder.reduce((s, r) => s + r.qty, 0);
    reorder.length = 0; onChange(); d.close();
    ALO.ui.toast('Reorder submitted: <b>' + units + ' units</b> across ' + n + (n === 1 ? ' size' : ' sizes') + ' sent to replenishment', 'success');
  };
}

/* ---------- view ---------- */
ALO.registerView('insights', {
  title: 'Insights',
  mount(sec) {
    const root = h(
      '<div class="in-root">' +
        '<header class="in-head">' +
          '<div><p class="eyebrow">Floor to stockroom · live</p><h2 class="in-title">Today at ' + esc(ALO.data.STORE.name) + ' · Saturday</h2>' +
          '<p class="in-lede">Every request since open at ' + hourLabel(ALO.data.STORE.opens) + ': sent, pulled, timed and written down. No radio calls.</p></div>' +
          '<p class="in-updated"><span class="live-dot"></span><span data-updated>Updated just now</span></p>' +
        '</header>' +
        '<div class="in-kpis" data-slot="kpis"></div>' +
        '<section class="in-demand" data-slot="demand" aria-label="Shortages"></section>' +
        '<div class="in-row is-charts">' +
          '<section class="in-sec"><div class="in-sec-head"><div><h3 class="in-h">Requests by hour</h3><p class="in-sub">Bars: requests sent. Line: average minutes to fill.</p></div>' +
            '<div class="in-legend"><span class="in-lg"><i class="in-lg-bar"></i>Requests</span><span class="in-lg"><i class="in-lg-line"></i>Avg min</span><span class="in-lg"><i class="in-lg-goal"></i>Goal</span></div></div>' +
            '<div class="in-chart" data-slot="hourly"></div></section>' +
          '<section class="in-sec"><div class="in-sec-head"><div><h3 class="in-h">Delivery speed</h3><p class="in-sub">Request to delivered, today.</p></div>' +
            '<div class="in-legend"><span class="in-lg"><i class="in-lg-met"></i>Met goal</span><span class="in-lg"><i class="in-lg-bar"></i>Over</span></div></div>' +
            '<div class="in-chart" data-slot="speed"></div><div class="in-speed-stats" data-slot="speedstats"></div></section>' +
        '</div>' +
        '<div class="in-row">' +
          '<section class="in-sec"><div class="in-sec-head"><div><h3 class="in-h">Most requested styles</h3><p class="in-sub">Top sizes asked for, with the most requested color.</p></div></div><div data-slot="styles"></div></section>' +
          '<section class="in-sec"><div class="in-sec-head"><div><h3 class="in-h">Team today</h3><p class="in-sub">Pull time is claim to sent. Avg total is request to delivered.</p></div></div><div data-slot="team"></div></section>' +
        '</div>' +
        '<div class="in-row">' +
          '<section class="in-sec"><div class="in-sec-head"><div><h3 class="in-h">Where requests come from</h3><p class="in-sub">Requests today by store area.</p></div></div><div data-slot="heat"></div></section>' +
          '<section class="in-sec"><div class="in-sec-head"><div><h3 class="in-h">Live activity</h3><p class="in-sub">The last ten moves through the stockroom.</p></div></div><div data-slot="feed" aria-live="polite"></div></section>' +
        '</div>' +
      '</div>');
    sec.appendChild(root);
    const slot = n => $('[data-slot="' + n + '"]', root);
    const S = { kpis: slot('kpis'), demand: slot('demand'), hourly: slot('hourly'), speed: slot('speed'), speedstats: slot('speedstats'), styles: slot('styles'), team: slot('team'), heat: slot('heat'), feed: slot('feed') };
    const updatedEl = $('[data-updated]', root);
    let D = null, expanded = false, lastUpdate = Date.now(), timer = null, ticks = 0, seen = null;
    const widths = { hourly: 0, speed: 0 };

    function paintCharts(force) {
      if (!D) return;
      const wh = S.hourly.clientWidth, ws = S.speed.clientWidth;
      if (wh && (force || Math.abs(wh - widths.hourly) > 1)) { widths.hourly = wh; S.hourly.innerHTML = hourlySVG(D, wh); }
      if (ws && (force || Math.abs(ws - widths.speed) > 1)) { widths.speed = ws; S.speed.innerHTML = speedSVG(D, ws); }
    }
    function paintDemandKeepFocus() {
      const a = document.activeElement;
      const act = a && S.demand.contains(a) ? a.dataset.act : null;
      const key = act && a.closest('[data-key]') ? a.closest('[data-key]').dataset.key : null;
      paintDemand(S.demand, D, expanded);
      if (act) {
        const sel = key ? '[data-key="' + key.replace(/"/g, '\\"') + '"] [data-act="' + act + '"]' : '[data-act="' + act + '"]';
        const b = $(sel, S.demand) || $('[data-key="' + (key || '').replace(/"/g, '\\"') + '"] .in-act', S.demand);
        if (b) b.focus({ preventScroll: true });
      }
    }
    function render() {
      timer = null;
      D = compute();
      paintKpis(S.kpis, D);
      paintDemandKeepFocus();
      paintCharts(true);
      S.speedstats.innerHTML = D.delivered.length
        ? '<span>Median <b class="mono">' + esc(U.fmtDur(D.medDel)) + '</b></span><span>90th percentile <b class="mono">' + esc(U.fmtDur(D.p90)) + '</b></span><span>Under goal <b class="mono in-done-t">' + pct(D.under, D.delivered.length) + '%</b></span>'
        : '';
      paintStyles(S.styles, D);
      paintTeam(S.team, D);
      paintHeat(S.heat, D);
      paintFeed(S.feed, D, seen);
      seen = new Set(D.feed.map(e => e.id));
      lastUpdate = Date.now();
      updateLive();
    }
    function schedule(ms) { clearTimeout(timer); timer = setTimeout(render, ms); }
    function updateLive() {
      const s = Math.round((Date.now() - lastUpdate) / 1000);
      updatedEl.textContent = s < 5 ? 'Updated just now' : 'Updated ' + s + 's ago';
      const el = $('[data-longest]', S.kpis);
      if (el && D && D.waiting[0]) el.textContent = U.fmtClock(ALO.now() - D.waiting[0].createdAt);
    }

    function doTransfer(key) {
      const g = D && D.groups.find(x => x.key === key); if (!g) return;
      const near = ALO.nearby(g.pid, g.color, g.size)[0];
      if (!near) { ALO.ui.toast('No nearby store has ' + esc(g.p.name) + ' · ' + esc(g.color) + ' · ' + esc(g.size), 'alert'); return; }
      const qty = Math.max(1, Math.min(near.qty, g.count));
      ALO.requestTransfer({ pid: g.pid, color: g.color, size: g.size, qty, store: near.store.id, storeName: near.store.name, reason: 'Demand signal' });
      ALO.ui.toast('Transfer requested from <b>' + esc(near.store.name) + '</b>: ' + qty + ' × ' + esc(g.p.name) + ' · ' + esc(g.color) + ' · ' + esc(g.size), 'success', { icon: 'truck' });
      paintDemandKeepFocus();
    }
    function toggleReorder(key) {
      const g = D && D.groups.find(x => x.key === key); if (!g) return;
      const i = reorder.findIndex(r => r.key === key);
      if (i >= 0) {
        reorder.splice(i, 1);
        ALO.ui.toast('Removed from reorder list: ' + esc(g.p.name) + ' · ' + esc(g.color) + ' · ' + esc(g.size));
      } else {
        reorder.push({ key, pid: g.pid, color: g.color, size: g.size, asked: g.count, qty: Math.max(6, g.count * 3) });
        ALO.ui.toast('Added to reorder list: <b>' + esc(g.p.name) + '</b> · ' + esc(g.color) + ' · ' + esc(g.size) + ' <span style="opacity:.7">(' + reorder.length + ')</span>', 'success', { icon: 'list' });
      }
      paintDemandKeepFocus();
    }

    root.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b || !root.contains(b) || b.disabled) return;
      const row = b.closest('[data-key]');
      const key = row ? row.dataset.key : null;
      const act = b.dataset.act;
      if (act === 'transfer') doTransfer(key);
      else if (act === 'reorder') toggleReorder(key);
      else if (act === 'tray') openTray(() => { if (D) paintDemandKeepFocus(); });
      else if (act === 'more') { expanded = !expanded; paintDemandKeepFocus(); }
    });

    let ro = null, raf = 0;
    if ('ResizeObserver' in window) {
      ro = new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => paintCharts(false)); });
      ro.observe(S.hourly); ro.observe(S.speed);
    }
    render();

    const offs = [
      ALO.on('change', () => schedule(300)),
      ALO.on('reset', () => { reorder.length = 0; schedule(0); }),
      ALO.on('tick', () => { ticks++; if (ticks % 30 === 0) schedule(0); else updateLive(); })
    ];
    return () => {
      offs.forEach(f => f());
      clearTimeout(timer);
      cancelAnimationFrame(raf);
      if (ro) ro.disconnect();
    };
  }
});
})();

ALO._boot();
</script>

</body></html>
