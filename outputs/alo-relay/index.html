  .sr-stat-c{font-size:11px}
  .sr-stat[data-k="open"] .sr-stat-c,.sr-stat[data-k="avg"] .sr-stat-c{display:none}
  .view-stockroom .sr-seg{display:flex}
  .sr-board{grid-template-columns:minmax(0,1fr)}
  .sr-board[data-show="new"] .sr-col:not([data-col="new"]),
  .sr-board[data-show="picking"] .sr-col:not([data-col="picking"]),
  .sr-board[data-show="sent"] .sr-col:not([data-col="sent"]){display:none}
  .sr-col{background:none;border:0;padding:0;min-height:0}
  .sr-col-h{display:none}
  .sr-empty{background:var(--sr-lane);border:1px solid var(--line);border-radius:var(--r-3)}
  .sr-done-row{grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:9px 14px}
  .sr-done-run{display:none}
  .sr-done-end{flex-direction:column;align-items:flex-end;gap:3px}
  .sr-done-tm{min-width:0}
  .sr-done-h{padding:13px 14px}
}
@container sr (max-width:380px){
  .sr-me-sub{display:none}
  .view-stockroom .sr-size b{font-size:22px}
}
@media (max-width:720px){
  .sr-dr-count{grid-template-columns:1fr 1fr}
  .sr-dr-count > div:last-child{grid-column:1 / -1}
  .sr-rt-stop{grid-template-columns:24px 36px minmax(0,1fr) 28px;gap:10px;padding:10px}
}

/* ===== module: inventory ===== */
/* Inventory view — gallery white, hairline rules, colorways carry the color. Prefix: iv- */
.view-inventory .iv-wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px;container:iv / inline-size}
.view-inventory .iv-lab{font-family:var(--f-display);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.view-inventory .iv-r{text-align:right;justify-content:flex-end}
.view-inventory .iv-h3{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.01em;margin:2px 0 4px}

/* ---------- KPI strip ---------- */
.view-inventory .iv-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.view-inventory .iv-kpi{position:relative;text-align:left;padding:16px 18px 15px;gap:6px;border-left:1px solid var(--line);transition:background .15s;min-width:0}
.view-inventory .iv-kpi:first-child{border-left:0}
.view-inventory .iv-kpi:hover{background:var(--surface)}
.view-inventory .iv-kpi[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.view-inventory .iv-kpi .k-label{font-family:var(--f-display);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-inventory .iv-kpi .k-val{font-size:32px}
.view-inventory .iv-k-sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-inventory .iv-dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.view-inventory .iv-dot-low{background:var(--s-pick)}
.view-inventory .iv-dot-out{background:var(--s-new)}
.view-inventory .iv-dot-gap{background:transparent;box-shadow:inset 0 0 0 1.5px var(--s-sent)}
.view-inventory .iv-kflash{animation:iv-kflash 1.4s var(--ease)}
@keyframes iv-kflash{0%{color:var(--s-done)}100%{color:inherit}}

/* ---------- floor-gap callout ---------- */
.view-inventory .iv-callout{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 16px;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--s-sent);border-radius:var(--r-2)}
.view-inventory .iv-callout p{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2)}
.view-inventory .iv-callout p b{color:var(--ink);font-weight:600}
.view-inventory .iv-callout-ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--s-sent-bg);color:var(--s-sent)}

/* ---------- toolbar ---------- */
.view-inventory .iv-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.view-inventory .iv-search{flex:1 1 260px;min-width:0;max-width:440px}
.view-inventory .iv-search .input{height:42px;font-size:14.5px}
.view-inventory .iv-seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.view-inventory .iv-seg button{white-space:nowrap}
.view-inventory .iv-seg-mode button{padding:0 11px;display:inline-grid;place-items:center}
.view-inventory .iv-cats{margin-top:-4px}
.view-inventory .iv-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink-2);padding-top:2px}
.view-inventory .iv-count b{color:var(--ink);font-weight:600}
.view-inventory .iv-exall{height:28px;padding:0 10px;font-size:12.5px;margin-right:auto}
.view-inventory .iv-meta .iv-legend{margin-left:auto}
.view-inventory .iv-legend{display:inline-flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3)}
.view-inventory .iv-legend > span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.view-inventory .iv-lg{width:14px;height:10px;border-radius:3px;display:inline-block}

/* level fills (shared by strip, matrix, legend) */
.view-inventory .iv-l-out{background:var(--s-new-bg);color:var(--s-new)}
.view-inventory .iv-l-low{background:var(--s-pick-bg);color:var(--s-pick)}
.view-inventory .iv-l-ok{background:var(--surface-2);color:var(--ink-2)}
.view-inventory .iv-gap{box-shadow:inset 0 0 0 1.5px var(--s-sent)}

/* ---------- list ---------- */
.view-inventory .iv-list{--iv-cols:52px minmax(150px,1.6fr) 84px 60px minmax(80px,.8fr) 50px 50px 176px 68px;border-top:1px solid var(--ink)}
.view-inventory .iv-thead,.view-inventory .iv-row{display:grid;grid-template-columns:var(--iv-cols);gap:14px;align-items:center}
.view-inventory .iv-thead{padding:10px 8px;border-bottom:1px solid var(--line)}
.view-inventory .iv-thead > span{font-family:var(--f-display);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;display:flex}
.view-inventory .iv-item{border-bottom:1px solid var(--line)}
.view-inventory .iv-row{padding:10px 8px;cursor:pointer;transition:background .15s;border-radius:var(--r-1)}
.view-inventory .iv-row:hover{background:var(--surface)}
.view-inventory .iv-item.is-open > .iv-row{background:var(--surface)}
.view-inventory .iv-thumb{width:52px;height:60px}
.view-inventory .iv-name{display:flex;flex-direction:column;gap:3px;min-width:0}
.view-inventory .iv-name > b{font-weight:500;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.view-inventory .iv-sub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--ink-3)}
.view-inventory .iv-sub-n{display:none}
.view-inventory .iv-hit{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:var(--r-pill);font-size:11px;font-weight:600;white-space:nowrap}
.view-inventory .iv-hit-low{background:var(--s-pick-bg);color:var(--s-pick)}
.view-inventory .iv-hit-out{background:var(--s-new-bg);color:var(--s-new)}
.view-inventory .iv-hit-gaps{background:var(--s-sent-bg);color:var(--s-sent)}
.view-inventory .iv-sku{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.view-inventory .iv-price{font-size:13.5px;color:var(--ink-2)}
.view-inventory .iv-sws{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.view-inventory .iv-sw{width:16px;height:16px}
.view-inventory .iv-n b{font-size:15px;font-weight:500}
.view-inventory .iv-n{display:flex}
.view-inventory .iv-strip{display:flex;gap:3px;min-width:0}
.view-inventory .iv-sc{position:relative;flex:0 1 26px;min-width:0;height:22px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-size:10px;font-weight:500;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.view-inventory .iv-part::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:var(--s-new)}
.view-inventory .iv-act{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.view-inventory .iv-chev{display:grid;place-items:center;width:24px;color:var(--ink-3);transition:transform .2s var(--ease)}
.view-inventory .iv-item.is-open .iv-chev{transform:rotate(180deg);color:var(--ink)}
.view-inventory .iv-open{width:36px;height:36px}
.view-inventory .iv-flash{animation:iv-rowflash 1.6s var(--ease)}
@keyframes iv-rowflash{0%{background:color-mix(in srgb,var(--s-done) 16%,transparent)}100%{background:transparent}}
.view-inventory .iv-cflash{animation:iv-cflash 1.8s var(--ease)}
@keyframes iv-cflash{0%,35%{box-shadow:0 0 0 2px var(--s-done)}100%{box-shadow:0 0 0 2px transparent}}

/* inline matrix */
.view-inventory .iv-mx{padding:4px 8px 18px 74px;animation:iv-in .25s var(--ease)}
@keyframes iv-in{from{opacity:0;transform:translateY(-4px)}}
.view-inventory .iv-mx-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-2);background:var(--surface)}
.view-inventory .iv-mx-t{border-collapse:separate;border-spacing:0;width:100%}
.view-inventory .iv-mx-t th,.view-inventory .iv-mx-t td{padding:5px 3px;text-align:center;font-weight:400}
.view-inventory .iv-mx-t thead th{padding:10px 3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.view-inventory .iv-mx-t tbody tr + tr th,.view-inventory .iv-mx-t tbody tr + tr td{border-top:1px solid var(--line)}
.view-inventory .iv-mx-c{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left!important;padding-left:12px!important;min-width:168px}
.view-inventory .iv-mx-key{display:block;letter-spacing:.08em;text-transform:none;font-family:var(--f-body);font-size:11px;color:var(--ink-3);margin-top:2px}
.view-inventory .iv-mx-color{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:2px 0}
.view-inventory .iv-mx-cn{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.view-inventory .iv-mx-cn b{font-weight:500;font-size:13px;white-space:nowrap}
.view-inventory .iv-mx-cn .mono{font-size:11px;color:var(--ink-3);white-space:nowrap}
.view-inventory .iv-cell{width:100%;min-width:52px;height:40px;border-radius:var(--r-1);display:flex;align-items:center;justify-content:center;gap:3px;line-height:1;font-variant-numeric:tabular-nums;transition:opacity .15s,transform .12s}
.view-inventory .iv-cell:hover{transform:scale(1.05)}
.view-inventory .iv-cell b{font-weight:600;font-size:14px}
.view-inventory .iv-cell i{font-style:normal;font-size:11.5px;opacity:.75}
.view-inventory .iv-cell.iv-dim{opacity:.3}
.view-inventory .iv-mx-tot{padding-right:12px!important;padding-left:10px!important;color:var(--ink-2);font-size:13px}
.view-inventory .iv-mx-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;padding-top:10px}

/* grid */
.view-inventory .iv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:30px 20px;border-top:1px solid var(--ink);padding-top:20px}
.view-inventory .iv-card{display:flex;flex-direction:column;gap:7px;text-align:left;min-width:0}
.view-inventory .iv-card-art{position:relative;aspect-ratio:4/5;background:var(--surface-2);border-radius:var(--r-2);display:grid;place-items:center;overflow:hidden;transition:background .2s}
.view-inventory .iv-card:hover .iv-card-art{background:var(--surface-3)}
.view-inventory .iv-card-art svg{width:60%;height:auto;transition:transform .35s var(--ease)}
.view-inventory .iv-card:hover .iv-card-art svg{transform:scale(1.04)}
.view-inventory .iv-card-badges{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:4px}
.view-inventory .iv-card-name{font-weight:500;font-size:14px;line-height:1.3;margin-top:4px}
.view-inventory .iv-card-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2)}
.view-inventory .iv-card-tot{display:flex;gap:18px;padding-top:6px;border-top:1px solid var(--line);margin-top:2px}
.view-inventory .iv-card-tot > span{display:flex;align-items:baseline;gap:6px}
.view-inventory .iv-card-tot b{font-weight:500;font-size:15px}
.view-inventory .iv-card .iv-sc{flex:1 1 0}

/* ---------- floor gaps panel ---------- */
.view-inventory .iv-gp{border-top:1px solid var(--ink);padding-top:16px}
.view-inventory .iv-gp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.view-inventory .iv-gp-head p{font-size:13px;max-width:560px}
.view-inventory .iv-gp-count{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;color:var(--ink-2);white-space:nowrap}
.view-inventory .iv-gp-row{display:grid;grid-template-columns:44px minmax(0,1.6fr) 56px 56px 112px 88px 168px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.view-inventory .iv-gp-thumb{width:44px;height:52px}
.view-inventory .iv-gp-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.view-inventory .iv-gp-name{font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-inventory .iv-gp-name:hover{text-decoration:underline;text-underline-offset:3px}
.view-inventory .iv-gp-var{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.view-inventory .iv-gp-var b{color:var(--ink);font-weight:600}
.view-inventory .iv-gp-nums{display:contents}
.view-inventory .iv-gp-n{display:flex;flex-direction:column;gap:2px;min-width:0}
.view-inventory .iv-gp-n b{font-size:15px;font-weight:500}
.view-inventory .iv-gp-n .mono{font-size:12px;white-space:nowrap}
.view-inventory .iv-gp-act{display:flex;justify-content:flex-end}
.view-inventory .iv-queued{display:inline-flex;align-items:center;gap:8px;font-size:12px}
.view-inventory .iv-gp-more{margin-top:10px}

/* ---------- container: medium (iPad portrait / rail open on small laptops) ---------- */
@container iv (max-width:919px){
  .view-inventory .iv-list{--iv-cols:52px minmax(150px,1.6fr) minmax(64px,.6fr) 46px 46px 164px 64px}
  .view-inventory .iv-list .iv-sku,.view-inventory .iv-list .iv-price{display:none}
  .view-inventory .iv-sub-w{display:none}
  .view-inventory .iv-sub-n{display:inline}
  .view-inventory .iv-kpi{padding:14px 12px}
  .view-inventory .iv-kpi .k-val{font-size:28px}
  .view-inventory .iv-kpi .k-label{letter-spacing:.1em}
  .view-inventory .iv-gp-row{grid-template-columns:44px minmax(0,1fr) 48px 48px 96px 64px 150px;gap:10px}
}
/* ---------- container: phone ---------- */
@container iv (max-width:699px){
  .view-inventory .iv-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .view-inventory .iv-kpi{border-left:0;padding:13px 4px 12px}
  .view-inventory .iv-kpi:first-child{grid-column:1 / -1}
  .view-inventory .iv-kpi:nth-child(n+2){border-top:1px solid var(--line)}
  .view-inventory .iv-kpi:nth-child(odd):not(:first-child){border-left:1px solid var(--line);padding-left:14px}
  .view-inventory .iv-kpi .k-val{font-size:26px}
  .view-inventory .iv-search{flex-basis:100%;max-width:none}
  .view-inventory .iv-seg button{padding:0 11px}
  .view-inventory .iv-meta .iv-legend{margin-left:0}
  .view-inventory .iv-callout{gap:10px;padding:10px 10px 10px 12px}
  .view-inventory .iv-callout p{font-size:13px}
  .view-inventory .iv-callout-long,.view-inventory .iv-callout-ico{display:none}
  .view-inventory .iv-kpi:not(:first-child) .iv-k-sub{display:none}
  .view-inventory .iv-thead{display:none}
  .view-inventory .iv-row{grid-template-columns:52px minmax(0,1fr) auto auto;grid-template-areas:"t n n a" "t w o b" "s s s s";gap:6px 12px;padding:12px 2px}
  .view-inventory .iv-row .iv-thumb{grid-area:t;align-self:start}
  .view-inventory .iv-row .iv-name{grid-area:n}
  .view-inventory .iv-row .iv-sws{grid-area:w}
  .view-inventory .iv-row .iv-act{grid-area:a;align-self:start}
  .view-inventory .iv-row .iv-n{grid-area:o;display:inline-flex;align-items:baseline;gap:4px}
  .view-inventory .iv-row .iv-n + .iv-n{grid-area:b}
  .view-inventory .iv-row .iv-n::before{content:attr(data-lab);font-family:var(--f-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .view-inventory .iv-row .iv-strip{grid-area:s}
  .view-inventory .iv-row .iv-strip .iv-sc{flex:1 1 0}
  .view-inventory .iv-mx{padding:2px 0 14px}
  .view-inventory .iv-mx-c{min-width:128px}
  .view-inventory .iv-mx-cn .mono{font-size:10.5px}
  .view-inventory .iv-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px;padding-top:16px}
  .view-inventory .iv-card-name{font-size:13.5px}
  .view-inventory .iv-card-tot{gap:12px}
  .view-inventory .iv-card .iv-sc{font-size:9px}
  .view-inventory .iv-gp-head{flex-direction:column;align-items:flex-start;gap:6px}
  .view-inventory .iv-gp-row{grid-template-columns:44px minmax(0,1fr);grid-template-areas:"t m" "t n" "t a";gap:8px 12px;padding:12px 0}
  .view-inventory .iv-gp-thumb{grid-area:t;align-self:start}
  .view-inventory .iv-gp-main{grid-area:m}
  .view-inventory .iv-gp-nums{grid-area:n;display:flex;flex-wrap:wrap;gap:6px 18px}
  .view-inventory .iv-gp-act{grid-area:a;justify-content:flex-start}
}

/* ---------- style drawer ---------- */
.iv-drawer .iv-dr-hero{display:grid;grid-template-columns:168px minmax(0,1fr);gap:20px;align-items:start}
.iv-drawer .iv-dr-art{aspect-ratio:4/5;background:var(--surface-2);border-radius:var(--r-2);display:grid;place-items:center}
.iv-drawer .iv-dr-art svg{width:66%;height:auto}
.iv-drawer .iv-dr-info{display:flex;flex-direction:column;gap:10px;min-width:0}
.iv-drawer .iv-dr-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13.5px;color:var(--ink-2)}
.iv-drawer .iv-dr-colors{display:flex;flex-wrap:wrap;gap:2px;margin:0 -6px}
.iv-drawer .iv-dr-colors .swatch{width:24px;height:24px}
.iv-drawer .iv-dr-cname{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:14px}
.iv-drawer .iv-dr-cname b{font-weight:500}
.iv-drawer .iv-dr-cname .mono{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.iv-drawer .iv-dr-tot{display:flex;gap:22px;padding-top:10px;border-top:1px solid var(--line)}
.iv-drawer .iv-dr-tot > span{display:flex;flex-direction:column;gap:2px}
.iv-drawer .iv-dr-tot b{font-family:var(--f-display);font-weight:300;font-size:26px;line-height:1}
.iv-drawer .iv-lab{font-family:var(--f-display);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.iv-drawer .iv-r{text-align:right}
.iv-drawer .iv-sw{width:16px;height:16px}
.iv-drawer .iv-dr-sec{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.iv-drawer .iv-dr-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px;font-size:12px}
.iv-drawer .iv-dr-note{font-size:13px;padding:6px 0}
.iv-drawer .iv-dt-wrap{overflow-x:auto;margin:0 -6px}
.iv-drawer .iv-dt{width:100%;border-collapse:collapse}
.iv-drawer .iv-dt th{text-align:left;padding:6px;border-bottom:1px solid var(--line);font-weight:500}
.iv-drawer .iv-dt td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.iv-drawer .iv-dt tr[aria-selected="true"] td{background:var(--surface-2)}
.iv-drawer .iv-dt tr[aria-selected="true"] td:first-child{box-shadow:inset 2px 0 0 var(--ink)}
.iv-drawer .iv-dt-size{min-width:44px;height:32px;padding:0 6px;border-radius:var(--r-1);font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.04em;text-align:left}
.iv-drawer .iv-dt-gap .iv-dt-size::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:2px;box-shadow:inset 0 0 0 1.5px var(--s-sent)}
.iv-drawer .iv-dt-bin{font-size:12px;color:var(--ink-2)}
.iv-drawer .iv-step{display:inline-flex;align-items:center;height:32px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface)}
.iv-drawer .iv-step button{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2)}
.iv-drawer .iv-step button:hover{background:var(--surface-2);color:var(--ink)}
.iv-drawer .iv-step button[disabled]{opacity:.3;pointer-events:none}
.iv-drawer .iv-step b{min-width:26px;text-align:center;font-weight:600;font-size:14px}
.iv-drawer .iv-move{height:30px;padding:0 11px;font-size:12.5px;gap:6px}
.iv-drawer .iv-today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.iv-drawer .iv-today .k-val{font-size:30px}
.iv-drawer .iv-miss{list-style:none;margin:12px 0 0;padding:0}
.iv-drawer .iv-miss button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 2px;border-top:1px solid var(--line);font-size:13px;text-align:left}
.iv-drawer .iv-miss button:hover{background:var(--surface-2)}
.iv-drawer .iv-miss button > span:nth-child(2){flex:1}
.iv-drawer .iv-miss b{font-weight:600}
.iv-drawer .iv-near-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.iv-drawer .iv-near-ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.iv-drawer .iv-near-name{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.iv-drawer .iv-near-name b{font-weight:500}
.iv-drawer .iv-near-name .faint{font-size:12px}
.iv-drawer .iv-near-q{font-size:13px;color:var(--ink-2);white-space:nowrap}
.iv-drawer .iv-near-q b{color:var(--ink);font-weight:600}
.iv-drawer .iv-near-done{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--s-done-bg);color:var(--s-done);font-size:12.5px;font-weight:600;white-space:nowrap}
.iv-drawer .iv-dr-foot{display:flex;flex:1;min-width:0}
.iv-drawer .iv-dr-foot .btn{white-space:normal;text-align:center;line-height:1.2}
@media (max-width:720px){
  .iv-drawer .iv-dr-hero{grid-template-columns:112px minmax(0,1fr);gap:14px}
  .iv-drawer .iv-dr-tot{gap:16px}
  .iv-drawer .iv-dr-tot b{font-size:22px}
  .iv-drawer .iv-dt-bin,.iv-drawer .iv-move-x,.iv-drawer .iv-dr-hint{display:none}
  .iv-drawer .iv-dt td,.iv-drawer .iv-dt th{padding:6px 4px}
  .iv-drawer .iv-today{gap:10px}
  .iv-drawer .iv-today .k-val{font-size:26px}
  .iv-drawer .iv-near-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n q" "b b";gap:8px 12px}
  .iv-drawer .iv-near-ico{display:none}
  .iv-drawer .iv-near-name{grid-area:n}
  .iv-drawer .iv-near-q{grid-area:q}
  .iv-drawer .iv-near-row > .btn,.iv-drawer .iv-near-done{grid-column:1 / -1;justify-self:start}
}

/* ===== module: insights ===== */
/* ===== Insights (prefix in-) — calm luxury manager dashboard: rules over boxes, one hero panel ===== */
.view-insights .in-root{container:in / inline-size;display:flex;flex-direction:column;gap:40px;max-width:1360px;margin:0 auto}
.view-insights .in-u{font-size:.48em;font-weight:400;letter-spacing:.02em;margin-left:2px;margin-right:4px;color:var(--ink-2)}
.view-insights .in-u:last-child{margin-right:0}
.view-insights .in-risk{color:var(--s-new)}
.view-insights .in-done-t{color:var(--s-done)}

/* header */
.view-insights .in-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 28px;flex-wrap:wrap}
.view-insights .in-title{font-family:var(--f-display);font-weight:300;font-size:32px;line-height:1.1;letter-spacing:-.01em;margin-top:10px}
.view-insights .in-lede{margin-top:8px;color:var(--ink-2);font-size:14px;max-width:64ch}
.view-insights .in-updated{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap;padding-bottom:3px}

/* KPI row: strong ink rule on top, hairline separators, no boxes */
.view-insights .in-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.view-insights .in-kpi{padding:18px 20px 20px;border-left:1px solid var(--line);gap:12px;min-width:0}
.view-insights .in-kpi:first-child{border-left:0;padding-left:0}
.view-insights .in-kpi .k-label{font-family:var(--f-display);font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);line-height:1.55}
.view-insights .in-kpi .k-val{font-size:46px;font-weight:300;white-space:nowrap}
.view-insights .in-kpi.is-risk .k-val{color:var(--s-new)}
.view-insights .in-kpi-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;min-height:26px;margin-top:auto}
.view-insights .in-kpi-sub{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:0}
.view-insights .in-kpi-sub b{font-weight:600;color:var(--ink)}
.view-insights .in-kpi-sub b.in-risk{color:var(--s-new)}
.view-insights .in-kpi-sub .mono{color:var(--ink)}
.view-insights .in-spark{display:block;flex:none}
.view-insights .in-spark polyline{fill:none;stroke:var(--ink-3);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.view-insights .in-spark circle{fill:var(--ink)}
.view-insights .in-spark.is-done polyline{stroke:color-mix(in srgb,var(--s-done) 70%,transparent)}
.view-insights .in-spark.is-done circle{fill:var(--s-done)}
.view-insights .in-spark.is-risk polyline{stroke:color-mix(in srgb,var(--s-new) 60%,transparent)}
.view-insights .in-spark.is-risk circle{fill:var(--s-new)}

/* DEMAND SIGNALS hero — the only boxed surface on the page */
.view-insights .in-demand{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);padding:26px 30px 8px;box-shadow:var(--shadow-1)}
.view-insights .in-demand-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 40px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line)}
.view-insights .in-eyebrow-risk{color:var(--s-new);display:inline-flex;align-items:center;gap:8px}
.view-insights .in-eyebrow-risk::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.view-insights .in-demand h3{font-family:var(--f-display);font-weight:300;font-size:28px;line-height:1.15;letter-spacing:-.01em;margin:10px 0 8px}
.view-insights .in-demand-why{color:var(--ink-2);font-size:14px;max-width:60ch}
.view-insights .in-demand-side{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.view-insights .in-demand-sum{display:flex;gap:30px}
.view-insights .in-sum{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.view-insights .in-sum b{font-family:var(--f-display);font-weight:300;font-size:32px;line-height:1;letter-spacing:-.02em}
.view-insights .in-sum span{font-family:var(--f-display);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.view-insights .in-tray{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 14px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-size:13px;font-weight:500;color:var(--ink);transition:border-color .15s}
.view-insights .in-tray:hover{border-color:var(--ink-3)}
.view-insights .in-tray-n{min-width:24px;height:24px;padding:0 7px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:600;display:grid;place-items:center}
.view-insights .in-tray-n.has{background:var(--ink);color:var(--ink-inv)}

.view-insights .in-sigs{list-style:none;margin:0;padding:0}
.view-insights .in-sig{display:grid;grid-template-columns:60px minmax(0,1.5fr) minmax(150px,1fr) 70px 92px;grid-template-areas:"thumb main count back risk" "thumb acts count back risk";column-gap:28px;row-gap:12px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.view-insights .in-sig:last-child{border-bottom:0}
.view-insights .in-sig-thumb{grid-area:thumb;width:60px;height:72px;align-self:start}
.view-insights .in-sig-main{grid-area:main;min-width:0;align-self:end}
.view-insights .in-sig-name{font-size:15.5px;font-weight:500;line-height:1.3}
.view-insights .in-sig-var{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:13.5px;color:var(--ink-2)}
.view-insights .in-sig-var b{color:var(--ink);font-weight:600}
.view-insights .in-sig-var .swatch{width:14px;height:14px}
.view-insights .in-sig-var .mono{font-size:11.5px}
.view-insights .in-sig-count{grid-area:count;min-width:0}
.view-insights .in-sig-asked{font-size:13px;color:var(--ink-2)}
.view-insights .in-sig-asked b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink);margin-right:4px;letter-spacing:-.01em}
.view-insights .in-meter{height:5px;border-radius:3px;background:var(--surface-2);margin:8px 0 7px;overflow:hidden}
.view-insights .in-meter i{display:block;height:100%;border-radius:3px;background:var(--s-new)}
.view-insights .in-sig-last{font-size:11.5px;color:var(--ink-3)}
.view-insights .in-sig-stat{display:flex;flex-direction:column;gap:4px;align-items:flex-end;text-align:right}
.view-insights .in-sig-stat.is-back{grid-area:back}
.view-insights .in-sig-stat.is-risk{grid-area:risk}
.view-insights .in-sig-stat b{font-family:var(--f-display);font-weight:300;font-size:26px;line-height:1;letter-spacing:-.01em}
.view-insights .in-sig-stat span{font-family:var(--f-display);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.view-insights .in-sig-acts{grid-area:acts;display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;align-self:start}
.view-insights .in-act{gap:6px}
.view-insights .in-act[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.view-insights .in-sig-hint{flex-basis:100%;font-size:12px;color:var(--ink-3)}
.view-insights .in-done{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--s-done-bg);color:var(--s-done);font-size:12.5px;font-weight:600}
.view-insights .in-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px 0 18px;border-top:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink-2)}
.view-insights .in-more:hover{color:var(--ink)}

/* section rows: hairline on top, no boxes */
.view-insights .in-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 52px}
.view-insights .in-row.is-charts{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.view-insights .in-sec{border-top:1px solid var(--line);padding-top:18px;min-width:0}
.view-insights .in-sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 20px;flex-wrap:wrap;margin-bottom:18px}
.view-insights .in-h{font-family:var(--f-display);font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.view-insights .in-sub{font-size:13px;color:var(--ink-3);margin-top:5px}
.view-insights .in-legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding-top:1px}
.view-insights .in-lg{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.view-insights .in-lg i{display:inline-block;flex:none}
.view-insights .in-lg-bar{width:10px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--ink-3) 42%,transparent)}
.view-insights .in-lg-met{width:10px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--s-done) 72%,transparent)}
.view-insights .in-lg-line{width:18px;height:2px;background:var(--ink);position:relative}
.view-insights .in-lg-line::after{content:"";position:absolute;left:5px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink);box-sizing:border-box}
.view-insights .in-lg-goal{width:18px;height:0;border-top:1.5px dashed var(--s-done)}

/* charts (hand-built SVG, sized to real pixels) */
.view-insights .in-chart{width:100%;min-width:0;overflow:hidden}
.view-insights .in-svg{display:block;overflow:visible}
.view-insights .in-svg text{paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.view-insights .in-grid{stroke:var(--line);stroke-width:1}
.view-insights .in-grid.is-base{stroke:var(--line-strong)}
.view-insights .in-tick{font:400 11px var(--f-mono);fill:var(--ink-3)}
.view-insights .in-axis-t{font:500 9.5px var(--f-display);letter-spacing:.16em;text-transform:uppercase;fill:var(--ink-3)}
.view-insights .in-xl{font:500 12px var(--f-body);fill:var(--ink-2)}
.view-insights .in-xs{font:500 9.5px var(--f-display);letter-spacing:.16em;text-transform:uppercase;fill:var(--ink-3)}
.view-insights .in-bar{fill:var(--ink-3);fill-opacity:.4}
.view-insights .in-bar.is-now{fill-opacity:.16;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.view-insights .in-bar-n{font:500 11px var(--f-mono);fill:var(--ink);stroke:none}
.view-insights .in-line{fill:none;stroke:var(--ink);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.view-insights .in-dot{fill:var(--bg);stroke:var(--ink);stroke-width:1.75}
.view-insights .in-dot-t{font:500 11px var(--f-mono);fill:var(--ink)}
.view-insights .in-goal{stroke:var(--s-done);stroke-width:1.25;stroke-dasharray:4 4}
.view-insights .in-goal-t{font:500 9.5px var(--f-display);letter-spacing:.16em;text-transform:uppercase;fill:var(--s-done)}
.view-insights .in-hbin{fill:var(--ink-3);fill-opacity:.4}
.view-insights .in-hbin.is-met{fill:var(--s-done);fill-opacity:.72}
.view-insights .in-hval{font:400 15px var(--f-display);fill:var(--ink)}
.view-insights .in-hpct{font:400 10.5px var(--f-mono);fill:var(--ink-3)}
.view-insights .in-speed-stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.view-insights .in-speed-stats b{color:var(--ink);font-weight:500;margin-left:4px}
.view-insights .in-speed-stats b.in-done-t{color:var(--s-done)}

/* most requested styles */
.view-insights .in-styles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.view-insights .in-style{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.view-insights .in-style:last-child{border-bottom:0}
.view-insights .in-rank{font-size:11px;color:var(--ink-3);padding-top:2px}
.view-insights .in-style-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.view-insights .in-style-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.view-insights .in-style-n{font-family:var(--f-display);font-weight:300;font-size:20px;line-height:1}
.view-insights .in-hbar{display:block;height:4px;border-radius:2px;background:var(--surface-3);margin:8px 0;overflow:hidden}
.view-insights .in-hbar i{display:block;height:100%;border-radius:2px;background:var(--ink)}
.view-insights .in-hbar.is-thin{height:3px;margin:0}
.view-insights .in-hbar.is-thin i{background:var(--ink-3)}
.view-insights .in-sizes{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.view-insights .in-sw-sm{width:12px;height:12px;margin-right:2px}
.view-insights .in-size{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--r-pill);border:1px solid var(--line);font-size:11.5px;color:var(--ink-2)}
.view-insights .in-size b{font-weight:600;color:var(--ink)}

/* team */
.view-insights .in-lb{display:flex;flex-direction:column}

        let floor = Math.round(r() * 3) + (core ? 1 : 0) - (r() < .1 ? 2 : 0);

        stock[p.id + '|' + c + '|' + s] = { floor, back, bin };

function isLeader() {
  try {

  } catch (e) { return true; }
}

function simTick() {
  if (!state.settings.sim || !isLeader()) return;
  const now = ALO.now();
  const runners = STAFF.filter(s => s.role === 'stockroom').map(s => s.id);
  const humanSR = humanStockroomActive();
  ALO.openRequests().forEach(q => {
    const d = hash(q.id) % 1000 / 1000;
    if (q.status === 'new' && !humanSR && now - q.createdAt > 9000 + d * 9000) {
      const v = q.kind === 'item' ? ALO.stockOf(q.pid, q.color, q.size) : { back: 9 };
      ALO.claim(q.id, runners[hash(q.id) % runners.length], false);
      if (v.back <= 0) setTimeout(() => { const cur = state.requests.find(x => x.id === q.id); if (cur && cur.status === 'picking' && !cur.human) { const alts = ALO.alternatives(q.pid, q.color, q.size); ALO.markUnavailable(q.id, 'Not in stockroom', alts[0] ? { pid: alts[0].pid, color: alts[0].color, size: alts[0].size } : null); } }, 6000);
    } else if (q.status === 'picking' && !(humanSR && q.claimedBy === ROLES.stockroom.staff) && q.claimedAt && now - q.claimedAt > 16000 + d * 10000) {
      ALO.markSent(q.id);
    } else if (q.status === 'sent' && !(humanSR && q.claimedBy === ROLES.stockroom.staff) && q.sentAt && now - q.sentAt > 12000 + d * 8000) {
      ALO.deliver(q.id);
    }
  });
  if (Date.now() > nextSpawn) {
    nextSpawn = Date.now() + 26000 + simR() * 26000;
    const floorStaff = STAFF.filter(s => s.role === 'floor' && !(me.role === 'floor' && s.id === me.staffId));
    const who = floorStaff[Math.floor(simR() * floorStaff.length)];
    if (simR() < .12) {
      const sup = SUPPLIES[Math.floor(simR() * SUPPLIES.length)];
      upsertReq(makeReq({ id: 'R-' + (state.seq++), kind: 'supply', supply: sup.id, zone: 'Register', requestedBy: who.id, waiting: simR() < .3, createdAt: now }));
    } else {
      const p = pickW(PRODUCTS, PRODUCTS.map(x => x.tags.includes('best') ? 3 : 1), simR);
      const c = pickW(p.colors, p.colors.map(x => x === 'Black' ? 2.5 : 1), simR);
      const s = pickW(p.sizes, p.sizes.map(x => ['XS', 'S', 'M'].includes(x) ? 2 : 1), simR);

  }

    root.focus({ preventScroll: true });
    raf = requestAnimationFrame(loop);
  }

    function renderZone() {
      zoneLabel.textContent = zoneNow();
      if (sheet) renderFoot();
    }
    function openZones(anchor, align) {
      if (zpop) { zpop.close(); zpop = null; }
      const cur = zoneNow();
      const isArea = z => /Wall|Table|Bar|Window/.test(z); const fr = D.ZONES.filter(isArea), rest = D.ZONES.filter(z => !isArea(z));
      const wrap = h(`<div class="fl-zpop">
        <p class="eyebrow">Store floor</p>
        <div class="fl-zother">${fr.map(z => `<button type="button" class="chip" role="menuitemradio" aria-checked="${z === cur}" aria-pressed="${z === cur}" data-zone="${esc(z)}">${esc(z)}</button>`).join('')}</div>
        <p class="eyebrow">Register and back of house</p>
        <div class="fl-zother">${rest.map(z => `<button type="button" class="chip" role="menuitemradio" aria-checked="${z === cur}" aria-pressed="${z === cur}" data-zone="${esc(z)}">${esc(z)}</button>`).join('')}</div>

      });
      zpop = ui.popover(anchor, wrap, { align: align || 'right' });
    }
    destBtn.addEventListener('click', () => openZones(destBtn, 'right'));

    /* ---------- strip ---------- */
    function renderStrip() {
      const today = ALO.requestsToday();
      const del = today.filter(q => q.status === 'delivered' && q.deliveredAt);
      const base = del;
      const avg = base.length ? base.reduce((s, q) => s + (q.deliveredAt - q.createdAt), 0) / base.length : 0;
      setHTML(strip, `<span class="fl-strip-ico">${ui.icon('radio', 16)}</span><span class="eyebrow fl-strip-k">Radio-free today</span><span class="fl-strip-v"><b class="tnum">${today.length}</b> requests · avg <b class="mono">${base.length ? fmtDur(avg) : '—'}</b> to fill a request</span>`);
    }

    /* ---------- catalog ---------- */
    function colorFor(p) {
      const hero = p.colors[hash(p.id) % Math.min(3, p.colors.length)];
      const q = f.q.trim().toLowerCase(); if (!q) return hero;
      const words = q.split(/\s+/).filter(w => w.length > 2);
      return p.colors.find(c => q.includes(c.toLowerCase())) ||
        p.colors.find(c => words.some(w => c.toLowerCase().split(' ').some(cw => cw.startsWith(w)))) || hero;
    }
    function backHTML(pid) {
      const t = ALO.totals(pid);
      const out = ALO.variants(pid).filter(v => v.back <= 0).length;
      return `<span class="eyebrow">In back</span><span class="mono tnum">${t.back}</span>` +
        (out ? `<span class="fl-out-n" title="${out} color/size combos are out in the back">· ${out} out</span>` : '');
    }
    function cardHTML(p) {
      const c = colorFor(p);
      const dots = p.colors.map(x => `<span class="swatch${x === c ? ' is-on' : ''}" style="background:${ALO.colorHex(x)}" title="${esc(x)}"></span>`).join('');
      return `<button type="button" class="fl-card" data-pid="${esc(p.id)}" data-color="${esc(c)}" aria-label="Request ${esc(p.name)}, ${esc(c)}">
        <span class="thumb fl-thumb">${ui.garment(p, c)}<span class="fl-badges">${badges(p)}</span></span>
        <span class="fl-card-b">
          <span class="fl-name">${esc(p.name)}</span>
          <span class="fl-row"><span class="fl-price tnum">${fmtMoney(p.price)}</span><span class="fl-dots">${dots}</span></span>
          <span class="fl-back" data-back="${esc(p.id)}">${backHTML(p.id)}</span>
        </span>
      </button>`;
    }
    function renderGrid() {
      const opts = {};
      if (f.gender) opts.gender = f.gender;
      if (f.filter === 'best' || f.filter === 'new') opts.tag = f.filter;
      else if (f.filter !== 'all') opts.cat = f.filter;
      const list = ALO.search(f.q, opts);
      countEl.textContent = list.length + (list.length === 1 ? ' style' : ' styles');
      grid.innerHTML = list.length ? list.map(cardHTML).join('') :
        `<div class="empty fl-noresults">${ui.icon('search', 26, 1.4)}<p>No styles match${f.q ? ' “' + esc(f.q) + '”' : ' this filter'}.</p><button type="button" class="btn btn-sm" data-clear>Clear search and filters</button></div>`;
    }
    function patchBack(pid) {
      const el = grid.querySelector(attrSel('back', pid));
      if (el) el.innerHTML = backHTML(pid);
    }
    const qInput = q$('[data-q]');
    qInput.addEventListener('input', () => { f.q = qInput.value; renderGrid(); });
    q$('.fl-gender').addEventListener('click', e => {
      const b = e.target.closest('[data-g]'); if (!b) return;
      f.gender = b.dataset.g;
      root.querySelectorAll('.fl-gender [data-g]').forEach(x => x.setAttribute('aria-pressed', x === b));
      renderGrid();
    });
    q$('.fl-chips').addEventListener('click', e => {
      const b = e.target.closest('[data-filter]'); if (!b) return;
      f.filter = b.dataset.filter;
      root.querySelectorAll('.fl-chips [data-filter]').forEach(x => x.setAttribute('aria-pressed', x === b));
      renderGrid();
    });
    grid.addEventListener('click', e => {
      if (e.target.closest('[data-clear]')) {
        f.q = ''; f.filter = 'all'; f.gender = ''; qInput.value = '';
        root.querySelectorAll('.fl-chips [data-filter]').forEach(x => x.setAttribute('aria-pressed', x.dataset.filter === 'all'));
        root.querySelectorAll('.fl-gender [data-g]').forEach(x => x.setAttribute('aria-pressed', x.dataset.g === ''));
        renderGrid(); return;
      }
      const card = e.target.closest('.fl-card'); if (card) openSheet(card.dataset.pid, card.dataset.color);
    });

    /* ---------- quick supplies ---------- */
    q$('.fl-sup-row').addEventListener('click', e => {
      const b = e.target.closest('[data-sup]'); if (!b) return;
      const s = ALO.supply(b.dataset.sup); if (!s) return;
      const zone = zoneNow();
      const req = ALO.createRequest({ kind: 'supply', supply: s.id, qty: 1, zone });
      ui.toast(`<span class="fl-toast-msg">${esc(s.name)} requested to <b>${esc(zone)}</b></span><button type="button" class="fl-undo" data-undo="${esc(req.id)}">Undo</button>`, 'success', { ms: 5200 });
      const u = document.querySelector('#toasts ' + attrSel('undo', req.id));
      if (u) u.addEventListener('click', () => {
        const cur = D.requests.find(x => x.id === req.id);
        if (cur && ALO.isOpen(cur)) { ALO.cancel(req.id, 'Undone'); u.textContent = 'Undone'; }
        else u.textContent = 'Already moving';
        u.disabled = true;
      });
      const ico = b.querySelector('.fl-sup-ico');
      b.classList.add('is-sent'); ico.innerHTML = ui.icon('check', 20, 2);
      clearTimeout(b._t);
      b._t = setTimeout(() => { b.classList.remove('is-sent'); ico.innerHTML = ui.icon(s.icon, 20); }, 1600);
    });

    /* ---------- my requests tracker ---------- */
    function whoHTML(q) {
      const nm = q.claimedBy ? '<b>' + esc(firstName(q.claimedBy)) + '</b>' : '';
      const av = q.claimedBy ? ui.avatar(q.claimedBy, 22) : '';
      switch (q.status) {
        case 'new': return `<span class="fl-pulse" aria-hidden="true"></span><span class="fl-who-t">Waiting for a runner</span><button type="button" class="fl-cancel" data-cancel="${esc(q.id)}">Cancel</button>`;
        case 'picking': return av + `<span class="fl-who-t">${nm} is pulling it${q.kind === 'item' ? ' · <span class="mono">' + esc(ALO.stockOf(q.pid, q.color, q.size).bin) + '</span>' : ''}</span>`;
        case 'sent': return av + `<span class="fl-who-t">${nm} is on the way</span>`;
        case 'delivered': return av + `<span class="fl-who-t">Delivered${nm ? ' by ' + nm : ''} in <span class="mono">${fmtDur(q.deliveredAt - q.createdAt)}</span></span>`;
        case 'unavailable': return av + `<span class="fl-who-t">${nm ? nm + ' checked the bin' : 'Stockroom checked the bin'}</span>`;
        default: return `<span class="fl-who-t faint">${esc(q.reason || 'Cancelled')}</span>`;
      }
    }
    function extraHTML(q) {
      if (q.status !== 'unavailable') return '';
      const a = q.alt, used = usedAlt.has(q.id);
      let s = '<div class="fl-unav"><p><b>' + esc(q.reason || 'Not available') + '</b>';
      if (a) {
        const ap = ALO.product(a.pid);
        s += ' · ' + esc(firstName(q.claimedBy) || 'Stockroom') + ' suggests ' + (a.pid !== q.pid && ap ? esc(ap.name) + ', ' : '') + esc(a.color) + ' · ' + esc(a.size);
      }
      s += '</p>';
      if (used) s += '<span class="fl-unav-done">' + ui.icon('check', 14, 2) + 'Alternative sent</span>';
      else if (a) s += `<button type="button" class="btn btn-primary btn-sm" data-alt-req="${esc(q.id)}">${ui.icon('swap', 15)}Request this instead</button>`;
      else s += `<button type="button" class="btn btn-sm" data-options="${esc(q.id)}">See options</button>`;
      return s + '</div>';
    }
    function buildCard(q) {
      const el = h(`<article class="fl-req" data-id="${esc(q.id)}">
        <div class="fl-req-top">
          <span class="thumb fl-req-thumb">${reqArt(q)}</span>
          <div class="fl-req-main">
            <div class="fl-req-r1"><b class="fl-req-title">${esc(ALO.reqTitle(q))}</b><span class="mono tnum fl-timer"></span></div>
            <div class="fl-req-sub"></div>
            <div class="fl-req-who"></div>
          </div>
        </div>
        <div class="fl-prog-wrap"><div class="fl-prog" aria-hidden="true">
          <div class="fl-segs"><i></i><i></i><i></i><i></i></div>
          <div class="fl-steps">${STEPS.map(s => '<span>' + s + '</span>').join('')}</div>
        </div></div>
        <div class="fl-req-x"></div>
      </article>`);
      el._timer = $('.fl-timer', el); el._sub = $('.fl-req-sub', el); el._who = $('.fl-req-who', el); el._x = $('.fl-req-x', el);
      el._segs = Array.from(el.querySelectorAll('.fl-segs i')); el._labs = Array.from(el.querySelectorAll('.fl-steps span'));
      el.addEventListener('animationend', e => { if (e.target === el) el.classList.remove('fl-enter', 'fl-bump'); });
      return el;
    }
    function applySteps(el, q) {
      const step = STEP_OF[q.status] || 0, open = ALO.isOpen(q);
      el._segs.forEach((s, i) => { s.classList.toggle('is-on', i < step); s.classList.toggle('is-next', open && i === step); });
      el._labs.forEach((s, i) => { s.classList.toggle('is-on', i < step); s.classList.toggle('is-cur', i === step - 1); });
    }
    function updateCard(el, q, fresh) {
      const now = ALO.now(), open = ALO.isOpen(q);
      if (el.dataset.status !== q.status) {
        const prev = el.dataset.status;
        el.dataset.status = q.status;
        if (fresh) {
          el.classList.add('fl-enter');
          requestAnimationFrame(() => requestAnimationFrame(() => applySteps(el, q)));
        } else applySteps(el, q);
        if (prev) { el.classList.remove('fl-bump'); void el.offsetWidth; el.classList.add('fl-bump'); }
      }
      setText(el._timer, open ? fmtClock(now - q.createdAt) : fmtTime(q.closedAt || q.createdAt));
      const detail = q.kind === 'item' ? esc(q.color) + ' · ' + esc(q.size) + (q.qty > 1 ? ' · ×' + q.qty : '') : 'Supplies' + (q.qty > 1 ? ' · ×' + q.qty : '');
      setHTML(el._sub, detail + ' <span class="fl-dotsep">·</span> ' + esc(q.zone) + (open && q.waiting ? ' <span class="badge badge-wait">Urgent</span>' : ''));
      setHTML(el._who, whoHTML(q));
      setHTML(el._x, extraHTML(q));
      el.classList.toggle('is-compact', !open && q.status !== 'unavailable' && now - (q.closedAt || 0) > RECENT_MS);
    }
    function place(container, list) {
      list.forEach((q, i) => {
        let el = cards.get(q.id), fresh = false;
        if (!el) { el = buildCard(q); cards.set(q.id, el); fresh = !firstSync; }
        updateCard(el, q, fresh);
        const at = container.children[i];
        if (at !== el) container.insertBefore(el, at || null);
      });
      while (container.children.length > list.length) container.lastElementChild.remove();
    }
    function syncTracker() {
      const now = ALO.now(), meId = ALO.me().staffId;
      const active = [], earlier = [];
      ALO.requestsToday().forEach(q => {
        if (q.requestedBy !== meId) return;
        if (ALO.isOpen(q)) { active.push(q); return; }
        const win = q.status === 'unavailable' && !usedAlt.has(q.id) ? UNAV_MS : RECENT_MS;
        (now - (q.closedAt || q.createdAt) < win ? active : earlier).push(q);
      });
      active.sort((a, b) => b.createdAt - a.createdAt);
      earlier.sort((a, b) => (b.closedAt || b.createdAt) - (a.closedAt || a.createdAt));
      const shown = showEarlier ? earlier.slice(0, Math.max(3, MAX_CARDS - active.length)) : [];
      place(activeEl, active);
      place(earlierEl, shown);
      const keep = new Set(active.concat(shown).map(q => q.id));
      cards.forEach((el, id) => { if (!keep.has(id)) cards.delete(id); });

      const nOpen = active.filter(ALO.isOpen).length;
      emptyEl.hidden = active.length > 0;
      if (!active.length) {
        setHTML(emptyEl, earlier.length
          ? `<p class="fl-empty-d">Nothing open right now. Tap a style to send the next one.</p>`
          : `<span class="fl-empty-art">${ui.icon('radio', 24, 1.4)}</span><p class="fl-empty-t">No requests yet</p><p class="fl-empty-d">Tap a style <span class="fl-wide-only">on the left</span><span class="fl-narrow-only">below</span>, choose a size and send. Your runner's progress shows up here, live.</p>`);
      }
      earlierBtn.hidden = !earlier.length;
      earlierBtn.setAttribute('aria-expanded', showEarlier);
      setHTML(earlierBtn, `<span>Earlier today</span><span class="mono tnum">${earlier.length}</span>${ui.icon('chev-down', 15)}`);
      earlierEl.hidden = !showEarlier || !shown.length;
      setText(openNEl, nOpen ? nOpen + ' open' : '');
      setText(helloSub, nOpen
        ? (nOpen === 1 ? '1 request in motion. We will ping you when it lands.' : nOpen + ' requests in motion. We will ping you as they land.')
        : 'Tap a style, pick a size, send. No radio needed.');
      firstSync = false;
    }
    track.addEventListener('click', async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-earlier-btn')) { showEarlier = !showEarlier; syncTracker(); return; }
      const id = b.dataset.cancel || b.dataset.altReq || b.dataset.options;
      const q = id && D.requests.find(x => x.id === id); if (!q) return;
      if (b.dataset.cancel) {
        const ok = await ui.confirm({ title: 'Cancel this request?', body: esc(ALO.reqTitle(q)) + ' · ' + esc(ALO.reqDetail(q)) + ' comes off the stockroom queue.', confirm: 'Cancel request', cancel: 'Keep it', danger: true });
        const cur = D.requests.find(x => x.id === id);
        if (ok && cur && ALO.isOpen(cur)) { ALO.cancel(id); ui.toast('Request cancelled'); }
      } else if (b.dataset.altReq && q.alt) {
        const a = q.alt;
        usedAlt.add(q.id);
        ALO.createRequest({ kind: 'item', pid: a.pid, color: a.color, size: a.size, qty: q.qty, zone: q.zone, waiting: q.waiting, note: 'Instead of ' + q.color + ' · ' + q.size });
        ui.toast('Sent to stockroom · bin <span class="mono">' + esc(ALO.stockOf(a.pid, a.color, a.size).bin) + '</span>', 'success');
      } else if (b.dataset.options && q.pid) openSheet(q.pid, q.color, q.size);
    });

    /* ---------- request sheet ---------- */
    function openSheet(pid, color, size) {
      const p = ALO.product(pid); if (!p) return;
      const st = { pid, color: color && p.colors.includes(color) ? color : p.colors[0], size: size || (p.sizes.length === 1 ? p.sizes[0] : null), qty: 1, waiting: false, notes: new Set(), text: '', heroKey: '', wasOut: false };
      const body = h(`<div class="fl-sheet">
        <div class="fl-hero" data-s="hero"></div>
        <section class="fl-sec" data-s="colors"></section>
        <section class="fl-sec" data-s="sizes"></section>
        <div class="fl-out-slot" data-s="out"></div>
        <section class="fl-sec fl-opts">
          <div class="fl-qty"><span class="eyebrow">Quantity</span>
            <div class="fl-step"><button type="button" class="icon-btn" data-qty="-1" aria-label="Fewer">${ui.icon('minus', 16)}</button><span class="fl-qty-v tnum" aria-live="polite" data-qty-v>1</span><button type="button" class="icon-btn" data-qty="1" aria-label="More">${ui.icon('plus', 16)}</button></div>
          </div>
          <button type="button" class="fl-waitsw" role="switch" aria-checked="false" data-wait><span class="fl-waitsw-t"><b>Urgent</b><span>Runner pulls it first</span></span><span class="switch" aria-checked="false"></span></button>
        </section>
        <section class="fl-sec">
          <div class="fl-sec-h"><span class="eyebrow">Note for the runner</span><span class="faint fl-hint">Optional</span></div>
          <div class="fl-notes">${NOTE_CHIPS.map(n => `<button type="button" class="chip" data-note="${esc(n)}" aria-pressed="false">${esc(n)}</button>`).join('')}</div>
          <input class="input fl-note" type="text" maxlength="120" placeholder="Anything else for the runner" aria-label="Note for the runner">
        </section>
      </div>`);
      const foot = h(`<div class="fl-foot"><button type="button" class="fl-to" data-to aria-haspopup="menu"></button><button type="button" class="btn btn-primary btn-lg btn-block fl-send" data-send></button></div>`);
      const d = ui.drawer({
        title: esc(p.name), content: body, foot, width: 540,
        onClose() { if (sheet && sheet.d === d) sheet = null; if (zpop) { zpop.close(); zpop = null; } }
      });
      d.el.classList.add('fl-drawer');
      sheet = { d, st, body, foot, alts: [] };

      body.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b || !sheet || sheet.body !== body) return;
        const ds = b.dataset;
        if (ds.color != null) { st.color = ds.color; renderSheet(); }
        else if (ds.size != null) { st.size = ds.size; renderSheet(); }
        else if (ds.alt != null) {
          const a = sheet.alts[+ds.alt]; if (!a) return;
          const samePid = a.pid === st.pid;
          Object.assign(st, { pid: a.pid, color: a.color, size: a.size });
          renderSheet();
          body.closest('.drawer-body') && body.closest('.drawer-body').scrollTo({ top: 0, behavior: 'smooth' });
          ui.toast('Switched to ' + (samePid ? '' : esc(ALO.product(a.pid).name) + ', ') + esc(a.color) + ' · ' + esc(a.size), 'info', { icon: 'swap', ms: 2200 });
        } else if (ds.transfer) {
          const n = ALO.nearby(st.pid, st.color, st.size).find(x => x.store.id === ds.transfer); if (!n) return;
          ALO.requestTransfer({ pid: st.pid, color: st.color, size: st.size, qty: st.qty, store: n.store });
          ui.toast('Transfer requested from <b>' + esc(n.store.name) + '</b> · ' + esc(st.color) + ' · ' + esc(st.size), 'success', { icon: 'truck' });
        } else if (ds.qty) { st.qty = Math.max(1, Math.min(12, st.qty + Number(ds.qty))); renderSheet(); }
        else if (b.hasAttribute('data-wait')) { st.waiting = !st.waiting; renderSheet(); }
        else if (ds.note != null) {
          if (st.notes.has(ds.note)) st.notes.delete(ds.note); else st.notes.add(ds.note);
          b.setAttribute('aria-pressed', st.notes.has(ds.note));
        }
      });
      body.addEventListener('input', e => { if (e.target.classList.contains('fl-note')) st.text = e.target.value; });
      body.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('fl-note')) { e.preventDefault(); send(); } });
      foot.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-to')) openZones(b, 'left');
        else if (b.hasAttribute('data-send')) send();
      });
      renderSheet();
    }

    function renderSheet() {
      if (!sheet) return;
      const { st, body, d } = sheet;
      const p = ALO.product(st.pid);
      const S = k => body.querySelector('[data-s="' + k + '"]');
      const v = st.size ? ALO.stockOf(st.pid, st.color, st.size) : null;
      const out = !!(v && v.back <= 0);
      const hk = st.pid + '|' + st.color;
      if (hk !== st.heroKey) {
        st.heroKey = hk;
        const ttl = $('.drawer-head h2', d.el); if (ttl) ttl.textContent = p.name;
        S('hero').innerHTML = `
          <div class="thumb fl-hero-img">${ui.garment(p, st.color)}</div>
          <div class="fl-hero-meta">
            <p class="eyebrow">${esc(p.cat)}</p>
            <p class="fl-hero-price tnum">${fmtMoney(p.price)}</p>
            ${p.tags.length ? '<div class="fl-hero-badges">' + badges(p) + '</div>' : ''}
            <dl class="fl-dl">
              <div><dt>Color</dt><dd>${esc(st.color)}</dd></div>
              <div><dt>Bin</dt><dd class="mono">${esc(binOf(st.pid, st.color))}</dd></div>
              <div><dt>SKU</dt><dd class="mono">${esc(p.sku)}</dd></div>
            </dl>
          </div>`;
        keepFocus(S('colors'), () => {
          S('colors').innerHTML = `<div class="fl-sec-h"><span class="eyebrow">Color</span><span class="muted">${esc(st.color)}</span></div>
            <div class="fl-swatches">${p.colors.map(c => `<button type="button" class="swatch-btn" data-color="${esc(c)}" aria-pressed="${c === st.color}" aria-label="${esc(c)}" title="${esc(c)}"><span class="swatch" style="background:${ALO.colorHex(c)}"></span></button>`).join('')}</div>`;
        });
      }
      keepFocus(S('sizes'), () => {
        S('sizes').innerHTML = `<div class="fl-sec-h"><span class="eyebrow">Size</span><span class="fl-legend"><i class="fl-dot" data-lvl="ok"></i>In back<i class="fl-dot" data-lvl="low"></i>Low<i class="fl-dot" data-lvl="out"></i>Out</span></div>
          <div class="fl-sizes">${p.sizes.map(s => {
            const sv = ALO.stockOf(st.pid, st.color, s), lv = ALO.level(sv.back);
            return `<button type="button" class="fl-size" data-size="${esc(s)}" data-lvl="${lv}" aria-pressed="${s === st.size}" aria-label="Size ${esc(s)}: ${sv.back} in back, ${sv.floor} on the floor">

    '<span class="iv-card-tot"><span><span class="iv-lab">Floor</span><b class="tnum">' + ps.floor + '</b></span><span><span class="iv-lab">Back</span><b class="tnum">' + ps.back + '</b></span></span>' +
    stripHTML(p, ps) + '</button>';
}

function legendHTML() {
  return '<span class="iv-legend"><span><i class="iv-lg iv-l-out"></i>Out in back</span><span><i class="iv-lg iv-l-low"></i>Low (1–2)</span><span><i class="iv-lg iv-l-ok"></i>In stock</span><span><i class="iv-lg iv-l-ok iv-gap"></i>Floor gap</span></span>';
}

/* ---------- floor gaps (variant level) ---------- */
function gapActionHTML(g, snap) {
  const q = snap.open[g.k];
  if (q) return '<span class="iv-queued">' + ui.pill(q.status) + '<span class="faint">' + (q.note === REPL ? 'Replenish' : 'Requested') + '</span></span>';
  return '<button type="button" class="btn btn-sm btn-primary iv-send" data-send="' + esc(g.k) + '">' + ui.icon('arrow', 15) + 'Send to floor</button>';
}
function gapsPanelHTML(snap, list) {
  const ids = {}; list.forEach(p => { ids[p.id] = 1; });
  const all = snap.gaps.filter(g => ids[g.p.id]);
  if (!all.length) return '<div class="iv-gp"><div class="iv-gp-head"><div><div class="eyebrow">Floor gaps</div><h3 class="iv-h3">Floor is fully set</h3><p class="muted">Every size with stock in the back also has at least one on the floor.</p></div></div></div>';
  const shown = S.gapsAll ? all : all.slice(0, 8);
  const rows = shown.map(g => '<div class="iv-gp-row">' +
    '<span class="thumb iv-gp-thumb">' + ui.garment(g.p, g.c) + '</span>' +
    '<span class="iv-gp-main"><button type="button" class="iv-gp-name" data-open="' + g.p.id + '" data-color="' + esc(g.c) + '" data-size="' + esc(g.s) + '">' + esc(g.p.name) + '</button><span class="iv-gp-var">' + swatch(g.c, 'iv-sw') + esc(g.c) + ' · <b>' + esc(g.s) + '</b></span></span>' +
    '<span class="iv-gp-nums">' +
      '<span class="iv-gp-n"><span class="iv-lab">Floor</span><b class="tnum lvl-out">0</b></span>' +
      '<span class="iv-gp-n"><span class="iv-lab">Back</span><b class="tnum">' + g.back + '</b></span>' +
      '<span class="iv-gp-n iv-gp-bin"><span class="iv-lab">Bin</span><span class="mono">' + esc(g.bin) + '</span></span>' +
      '<span class="iv-gp-n"><span class="iv-lab">Asked today</span><b class="tnum' + (g.ask ? '' : ' faint') + '">' + g.ask + '</b></span>' +
    '</span>' +
    '<span class="iv-gp-act">' + gapActionHTML(g, snap) + '</span></div>').join('');
  const more = all.length > 8 ? '<button type="button" class="btn btn-sm btn-ghost iv-gp-more" data-gaps-more>' + (S.gapsAll ? 'Show top 8' : 'Show all ' + all.length) + '</button>' : '';
  return '<div class="iv-gp"><div class="iv-gp-head"><div><div class="eyebrow">Floor gaps</div><h3 class="iv-h3">Ready to replenish</h3><p class="muted">Empty on the floor, sitting in the stockroom. Sorted by how often it was asked for today.</p></div><span class="iv-gp-count tnum">' + all.length + ' variant' + (all.length === 1 ? '' : 's') + '</span></div>' +
    '<div class="iv-gp-list">' + rows + '</div>' + more + '</div>';
}

/* ---------- the view ---------- */
let DR = null;
function mount(sec) {
  if (!S.mode) S.mode = window.innerWidth >= 900 ? 'list' : 'grid';
  sec.innerHTML =
    '<div class="iv-wrap">' +
      '<div class="iv-kpis" role="group" aria-label="Inventory summary"></div>' +
      '<div class="iv-callout-host"></div>' +
      '<div class="iv-toolbar">' +
        '<label class="search iv-search">' + ui.icon('search', 18) + '<input class="input" type="search" placeholder="Search style, color or SKU" aria-label="Search inventory" autocomplete="off"></label>' +
        '<div class="seg iv-seg" role="group" aria-label="Department">' + GENDER_OPTS.map(o => '<button type="button" data-gender="' + o[0] + '">' + o[1] + '</button>').join('') + '</div>' +
        '<div class="seg iv-seg" role="group" aria-label="Stock level">' + STOCK_OPTS.map(o => '<button type="button" data-stock="' + o[0] + '">' + o[1] + '</button>').join('') + '</div>' +
        '<div class="seg iv-seg iv-seg-mode" role="group" aria-label="Layout"><button type="button" data-mode="list" aria-label="List" title="List">' + ui.icon('list', 17) + '</button><button type="button" data-mode="grid" aria-label="Grid" title="Grid">' + ui.icon('grid', 17) + '</button></div>' +
      '</div>' +
      '<div class="chips iv-cats" role="group" aria-label="Category"><button type="button" class="chip" data-cat="">All styles</button>' + D.CATEGORIES.map(c => '<button type="button" class="chip" data-cat="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>' +
      '<div class="iv-gaps-host"></div>' +
      '<div class="iv-meta"></div>' +
      '<div class="iv-body"></div>' +
    '</div>';
  const kpis = $('.iv-kpis', sec), callout = $('.iv-callout-host', sec), gapsHost = $('.iv-gaps-host', sec), meta = $('.iv-meta', sec), body = $('.iv-body', sec);
  const input = $('.iv-search input', sec);
  input.value = S.q;
  let alive = true, lastVis = '', lastSig = {}, prevK = {};
  const pending = new Set();

  function syncControls() {
    $$('[data-gender]', sec).forEach(b => b.setAttribute('aria-pressed', b.dataset.gender === S.gender));
    $$('[data-stock]', sec).forEach(b => { if (b.closest('.iv-seg')) b.setAttribute('aria-pressed', b.dataset.stock === S.stock); });
    $$('[data-mode]', sec).forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.mode));
    $$('[data-cat]', sec).forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === S.cat));
  }

  function renderKpis(T) {
    const tiles = [
      ['units', fmtN(T.floor + T.back), 'Units in store', fmtN(T.floor) + ' floor · ' + fmtN(T.back) + ' back', '', S.stock === 'all'],
      ['variants', fmtN(T.variants), 'Variants tracked', D.PRODUCTS.length + ' styles · color × size', '', false],
      ['low', fmtN(T.low), 'Low in back', '1–2 units left', 'low', S.stock === 'low'],
      ['out', fmtN(T.out), 'Out in back', 'Stockroom is empty', 'out', S.stock === 'out'],
      ['gaps', fmtN(T.gaps), 'Floor gaps', 'Ready to replenish', 'gap', S.stock === 'gaps']
    ];
    if (kpis.children.length === tiles.length) {
      tiles.forEach((t, i) => {
        const el = kpis.children[i], v = $('.k-val', el);
        el.setAttribute('aria-pressed', t[5]);
        $('.iv-k-sub', el).textContent = t[3];
        if (v.textContent !== t[1]) { v.textContent = t[1]; v.classList.remove('iv-kflash'); void v.offsetWidth; v.classList.add('iv-kflash'); }
      });
      return;
    }
    kpis.innerHTML = tiles.map(t => '<button type="button" class="kpi iv-kpi" data-kpi="' + t[0] + '" aria-pressed="' + t[5] + '">' +
      '<span class="k-label">' + (t[4] ? '<i class="iv-dot iv-dot-' + t[4] + '"></i>' : '') + t[2] + '</span>' +
      '<span class="k-val' + (prevK[t[0]] != null && prevK[t[0]] !== t[1] ? ' iv-kflash' : '') + '">' + t[1] + '</span>' +
      '<span class="iv-k-sub">' + t[3] + '</span></button>').join('');
    tiles.forEach(t => { prevK[t[0]] = t[1]; });
  }

  function renderCallout(snap) {
    if (S.stock === 'gaps' || !snap.T.gaps) { callout.innerHTML = ''; return; }
    const top = snap.gaps[0];
    callout.innerHTML = '<div class="iv-callout"><span class="iv-callout-ico">' + ui.icon('route', 18) + '</span>' +
      '<p><b>' + snap.T.gaps + ' floor gaps.</b><span class="iv-callout-long"> Sizes empty on the floor with stock in the back.</span>' +
      (top && top.ask ? ' Most asked: <b>' + esc(top.p.name) + '</b> · ' + esc(top.c) + ' · ' + esc(top.s) + ' <span class="faint">(' + top.ask + ' today)</span>' : '') + '</p>' +
      '<button type="button" class="btn btn-sm" data-stock="gaps">Review</button></div>';
  }

  function renderMeta(list) {
    const vars = list.reduce((n, p) => n + p.colors.length * p.sizes.length, 0);
    const sorted = S.stock !== 'all' ? ' <span class="faint">· sorted by most ' + (S.stock === 'gaps' ? 'floor gaps' : S.stock === 'low' ? 'low sizes' : 'empty sizes') + '</span>' : '';
    const ex = S.mode === 'list' && list.length ? '<button type="button" class="btn btn-sm btn-ghost iv-exall" data-kpi="variants">' + (list.every(p => S.expanded.has(p.id)) ? 'Collapse all' : 'Expand all') + '</button>' : '';
    meta.innerHTML = '<span class="iv-count"><b class="tnum">' + list.length + '</b> style' + (list.length === 1 ? '' : 's') + ' · <b class="tnum">' + fmtN(vars) + '</b> variants' + sorted + '</span>' + ex + legendHTML();
  }

  function renderBody(snap) {
    snap = snap || scan();
    const list = visible(snap);
    lastVis = list.map(p => p.id).join(',') + '|' + S.mode + '|' + S.stock;
    gapsHost.innerHTML = S.stock === 'gaps' ? gapsPanelHTML(snap, list) : '';
    renderMeta(list);
    if (!list.length) body.innerHTML = '<div class="empty">' + ui.icon('search', 28) + '<p>No styles match these filters.</p><button type="button" class="btn btn-sm" data-clear>Clear filters</button></div>';
    else if (S.mode === 'list') body.innerHTML = '<div class="iv-list"><div class="iv-thead" aria-hidden="true"><span></span><span>Style</span><span class="iv-sku">SKU</span><span class="iv-price iv-r">Price</span><span class="iv-sws">Colors</span><span class="iv-r">Floor</span><span class="iv-r">Back</span><span>Size run · back</span><span></span></div>' + list.map(p => rowHTML(p, snap)).join('') + '</div>';
    else body.innerHTML = '<div class="iv-grid">' + list.map(p => cardHTML(p, snap)).join('') + '</div>';
    lastSig = {}; list.forEach(p => { lastSig[p.id] = snap.P[p.id].sig + (S.expanded.has(p.id) ? '+' : ''); });
  }

  function renderAll() { syncControls(); const snap = scan(); renderKpis(snap.T); renderCallout(snap); renderBody(snap); }

  function patchItem(pid, snap, flash) {
    const old = body.querySelector('[data-item="' + pid + '"]'); if (!old) return;
    const p = ALO.product(pid);
    const el = h(S.mode === 'list' ? rowHTML(p, snap) : cardHTML(p, snap));
    old.replaceWith(el);
    lastSig[pid] = snap.P[pid].sig + (S.expanded.has(pid) ? '+' : '');
    if (!flash) return;
    const row = el.querySelector('.iv-row') || el;
    row.classList.add('iv-flash');
    pending.forEach(k => {
      if (k.split('|')[0] !== pid) return;
      const sz = k.split('|')[2];
      const c = el.querySelector('.iv-cell[data-k="' + k.replace(/"/g, '') + '"]'); if (c) c.classList.add('iv-cflash');
      const sc = el.querySelector('.iv-sc[data-sz="' + sz.replace(/"/g, '') + '"]'); if (sc) sc.classList.add('iv-cflash');
    });
  }

  function refresh() {
    if (!alive) return;
    const snap = scan();
    renderKpis(snap.T); renderCallout(snap);
    const list = visible(snap);
    const key = list.map(p => p.id).join(',') + '|' + S.mode + '|' + S.stock;
    if (key !== lastVis) renderBody(snap);
    else {
      if (S.stock === 'gaps') gapsHost.innerHTML = gapsPanelHTML(snap, list);
      list.forEach(p => { if (lastSig[p.id] !== snap.P[p.id].sig + (S.expanded.has(p.id) ? '+' : '')) patchItem(p.id, snap, true); });
    }
    pending.clear();
  }
  const schedule = debounce(refresh, 150);

  function setStock(f) { S.stock = f; S.gapsAll = false; renderAll(); }
  function toggleExpand(pid) {
    if (S.expanded.has(pid)) S.expanded.delete(pid); else S.expanded.add(pid);
    patchItem(pid, scan(), false);
    renderMeta(visible(scan()));
  }

  sec.addEventListener('click', e => {
    const t = e.target;
    const k = t.closest('[data-kpi]');
    if (k) {
      const id = k.dataset.kpi;
      if (id === 'units') { S.q = ''; S.cat = ''; S.gender = 'all'; input.value = ''; setStock('all'); }
      else if (id === 'variants') {
        const snap = scan(); const list = visible(snap);
        if (S.mode !== 'list') S.mode = 'list';
        const allOpen = list.length && list.every(p => S.expanded.has(p.id));
        list.forEach(p => { if (allOpen) S.expanded.delete(p.id); else S.expanded.add(p.id); });
        renderAll();
      } else setStock(S.stock === id && k.classList.contains('iv-kpi') ? 'all' : id);
      return;
    }
    const st = t.closest('[data-stock]'); if (st) { setStock(st.dataset.stock); return; }
    const g = t.closest('[data-gender]'); if (g) { S.gender = g.dataset.gender; renderAll(); return; }
    const m = t.closest('[data-mode]'); if (m) { S.mode = m.dataset.mode; renderAll(); return; }
    const c = t.closest('[data-cat]'); if (c) { S.cat = c.dataset.cat; renderAll(); c.scrollIntoView({ block: 'nearest', inline: 'nearest' }); return; }
    if (t.closest('[data-clear]')) { S.q = ''; S.cat = ''; S.gender = 'all'; input.value = ''; setStock('all'); return; }
    if (t.closest('[data-gaps-more]')) { S.gapsAll = !S.gapsAll; gapsHost.innerHTML = gapsPanelHTML(scan(), visible(scan())); return; }
    const snd = t.closest('[data-send]');
    if (snd) { const parts = snd.dataset.send.split('|'); snd.disabled = true; sendToFloor(parts[0], parts[1], parts[2]); return; }
    const o = t.closest('[data-open]'); if (o) { openStyle(o.dataset.open, o.dataset.color, o.dataset.size); return; }
    const r = t.closest('.iv-row'); if (r) toggleExpand(r.dataset.row);
  });
  sec.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('iv-row')) {
      e.preventDefault(); const pid = e.target.dataset.row; toggleExpand(pid);
      const r = body.querySelector('[data-row="' + pid + '"]'); if (r) r.focus({ preventScroll: true });
    }
  });
  input.addEventListener('input', debounce(() => { if (!alive) return; S.q = input.value; const snap = scan(); renderBody(snap); }, 110));

  const offs = [
    ALO.on('change', ev => { if (ev && ev.type === 'stock' && ev.key) pending.add(ev.key); schedule(); }),
    ALO.on('reset', schedule)
  ];
  renderAll();
  return () => {
    alive = false;
    offs.forEach(f => f());
    if (DR && DR.api) DR.api.close(true);
  };
}

/* ---------- actions ---------- */
function sendToFloor(pid, color, size) {
  const p = ALO.product(pid); if (!p) return;
  ALO.createRequest({ kind: 'item', pid, color, size, qty: 2, zone: zoneFor(p), waiting: false, note: REPL });
  ui.toast('Replenish sent to the stockroom: <b>' + esc(p.name) + '</b> · ' + esc(color) + ' · ' + esc(size) + ' to ' + esc(zoneFor(p)), 'success');
}

/* ---------- style drawer ---------- */
function defaultSize(p, color) {
  const v = s => ALO.stockOf(p.id, color, s);
  return p.sizes.find(s => isGap(v(s))) || p.sizes.find(s => v(s).back <= 0) || p.sizes[Math.min(1, p.sizes.length - 1)];
}
function openStyle(pid, color, size) {
  const p = ALO.product(pid); if (!p) return;
  if (!color || p.colors.indexOf(color) < 0) color = p.colors[0];
  if (!size || p.sizes.indexOf(size) < 0) size = defaultSize(p, color);
  const st = { pid, color, size };
  const content = h('<div class="iv-dr"></div>');
  const foot = h('<div class="iv-dr-foot"></div>');
  const live = debounce(() => { if (DR === st) renderDrawer(); }, 120);
  const off = ALO.on('change', live);
  st.api = ui.drawer({ title: esc(p.name), content, foot, width: 600, onClose() { off(); if (DR === st) DR = null; } });
  st.el = content; st.foot = foot;
  st.api.el.classList.add('iv-drawer');
  DR = st;
  st.api.el.addEventListener('click', onDrawerClick);
  renderDrawer();
}

function stepper(field, size, val, lvl) {
  const sz = esc(size);
  return '<span class="iv-step"><button type="button" data-step="' + field + '" data-d="-1" data-size="' + sz + '" data-fk="' + field + '-|' + sz + '" aria-label="' + field + ' ' + sz + ' minus one"' + (val <= 0 ? ' disabled' : '') + '>' + ui.icon('minus', 14, 2) + '</button>' +
    '<b class="tnum lvl-' + lvl + '">' + val + '</b>' +
    '<button type="button" data-step="' + field + '" data-d="1" data-size="' + sz + '" data-fk="' + field + '+|' + sz + '" aria-label="' + field + ' ' + sz + ' plus one">' + ui.icon('plus', 14, 2) + '</button></span>';
}

function renderDrawer() {
  const st = DR; if (!st) return;
  const p = ALO.product(st.pid), c = st.color;

  const tot = ALO.totals(p.id);

    '</div></div>';

  const rows = p.sizes.map(s => {
    const v = ALO.stockOf(p.id, c, s), sel = s === st.size, sz = esc(s);

  }).join('');
  const table = '<div class="iv-dr-sec"><div class="iv-dr-h"><span class="eyebrow">Size run · ' + esc(c) + '</span><span class="faint iv-dr-hint">Use − / + to record a cycle count</span></div>' +
    '<div class="iv-dt-wrap"><table class="iv-dt"><thead><tr><th class="iv-lab">Size</th><th class="iv-lab">Floor</th><th class="iv-lab">Back</th><th class="iv-lab iv-dt-bin">Bin</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';

  const reqs = ALO.requestsToday().filter(q => q.kind === 'item' && q.pid === p.id && q.note !== REPL);

  const missList = Object.keys(byV).sort((a, b) => byV[b] - byV[a]).slice(0, 4);

function onDrawerClick(e) {
  const st = DR; if (!st) return;
  const t = e.target, p = ALO.product(st.pid);
  const dc = t.closest('[data-dc]');
  if (dc) { st.color = dc.dataset.dc; st.size = dc.dataset.ds2 || (p.sizes.indexOf(st.size) >= 0 ? st.size : defaultSize(p, st.color)); renderDrawer(); return; }
  const ds = t.closest('[data-ds]'); if (ds) { st.size = ds.dataset.ds; renderDrawer(); return; }
  const sp = t.closest('[data-step]');
  if (sp) {
    const s = sp.dataset.size, f = sp.dataset.step, v = ALO.stockOf(p.id, st.color, s);
    const o = {}; o[f] = Math.max(0, v[f] + Number(sp.dataset.d));
    ALO.setCount(p.id, st.color, s, o); st.size = s; renderDrawer(); return;
  }
  const mv = t.closest('[data-move]');
  if (mv) {
    const s = mv.dataset.move;
    if (ALO.stockOf(p.id, st.color, s).back <= 0) return;
    ALO.adjustStock(p.id, st.color, s, { floor: +1, back: -1 }); st.size = s; renderDrawer();
    ui.toast('Moved 1 to the floor: ' + esc(st.color) + ' · ' + esc(s), 'success');
    return;
  }
  const xf = t.closest('[data-xfer]');
  if (xf) {
    const n = ALO.nearby(p.id, st.color, st.size).find(x => x.store.id === xf.dataset.xfer); if (!n) return;
    const qty = Math.min(2, n.qty);
    ALO.requestTransfer({ pid: p.id, color: st.color, size: st.size, qty, store: n.store.id, storeName: n.store.name });
    ui.toast('Transfer requested from <b>' + esc(n.store.name) + '</b>: ' + qty + ' × ' + esc(st.color) + ' · ' + esc(st.size), 'success', { icon: 'truck' });

  }

}
