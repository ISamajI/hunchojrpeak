<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Alo Relay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Alo Relay — live stockroom requests and store inventory. Concept demo by LTGPEAK.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: quiet studio shell — left rail (desktop/iPad) or bottom tab bar (phone), one working canvas.
   Alo world: gallery white, true black ink, warm stone neutrals, colorway swatches carry the color. */
:root{
  --bg:#FAF9F7; --surface:#FFFFFF; --surface-2:#F1EFEB; --surface-3:#E8E5DF;
  --line:#E3E0DA; --line-strong:#CFCBC3;
  --ink:#0F0F0E; --ink-2:#4F4C47; --ink-3:#8A867E; --ink-inv:#FFFFFF;
  --accent:#0F0F0E; --accent-ink:#FFFFFF; --focus:#6D7F64; --garment-edge:rgba(0,0,0,.26);
  --s-new:#B3472F; --s-new-bg:#F6E6E1;
  --s-pick:#A86E14; --s-pick-bg:#F5EBD8;
  --s-sent:#3D5A75; --s-sent-bg:#E2E9F0;
  --s-done:#4D6A48; --s-done-bg:#E3EBE0;
  --s-out:#7E7973; --s-out-bg:#ECEAE6;
  --shadow-1:0 1px 2px rgba(20,18,14,.06),0 2px 8px rgba(20,18,14,.05);
  --shadow-2:0 10px 40px rgba(20,18,14,.14),0 2px 8px rgba(20,18,14,.06);
  --f-display:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --f-body:"DM Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"DM Mono","SFMono-Regular",ui-monospace,Menlo,monospace;
  --r-1:6px; --r-2:10px; --r-3:16px; --r-pill:999px;
  --rail-w:236px; --top-h:64px; --tab-h:64px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0D0C; --surface:#161513; --surface-2:#1E1C1A; --surface-3:#282623;
  --line:#2B2926; --line-strong:#3B3834;
  --ink:#F3F1EC; --ink-2:#B9B4AB; --ink-3:#827D74; --ink-inv:#0E0D0C;
  --accent:#F3F1EC; --accent-ink:#0E0D0C; --focus:#9DB290; --garment-edge:rgba(255,255,255,.34);
  --s-new:#E2805F; --s-new-bg:#3A221B;
  --s-pick:#E0A54A; --s-pick-bg:#3A2D17;
  --s-sent:#86A8C8; --s-sent-bg:#1C2A37;
  --s-done:#93B68C; --s-done-bg:#1F2D1D;
  --s-out:#9C968E; --s-out-bg:#262421;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0D0C; --surface:#161513; --surface-2:#1E1C1A; --surface-3:#282623;
  --line:#2B2926; --line-strong:#3B3834;
  --ink:#F3F1EC; --ink-2:#B9B4AB; --ink-3:#827D74; --ink-inv:#0E0D0C;
  --accent:#F3F1EC; --accent-ink:#0E0D0C; --focus:#9DB290; --garment-edge:rgba(255,255,255,.34);
  --s-new:#E2805F; --s-new-bg:#3A221B;
  --s-pick:#E0A54A; --s-pick-bg:#3A2D17;
  --s-sent:#86A8C8; --s-sent-bg:#1C2A37;
  --s-done:#93B68C; --s-done-bg:#1F2D1D;
  --s-out:#9C968E; --s-out-bg:#262421;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.01em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.display{font-family:var(--f-display);font-weight:300;letter-spacing:-.01em}
.wordmark{font-family:var(--f-display);font-weight:500;letter-spacing:-.04em;text-transform:lowercase;line-height:1}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}
.rail{display:flex;flex-direction:column;gap:6px;padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface);min-height:0}
.rail-brand{display:flex;align-items:baseline;gap:10px;padding:2px 10px 22px}
.rail-brand .wordmark{font-size:34px}
.rail-brand .prod{font-family:var(--f-display);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2)}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-2);color:var(--ink-2);font-weight:500;text-align:left;position:relative;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--ink);color:var(--ink-inv)}
.nav-btn .nav-badge{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--s-new);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.nav-btn[aria-current="page"] .nav-badge{background:var(--ink-inv);color:var(--ink)}
.nav-btn .nav-badge:empty{display:none}
.rail-sep{flex:1}
.rail-foot{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.rail-foot .nav-btn{font-size:13px;padding:9px 12px}
.credit{padding:10px 12px 0;font-size:11px;color:var(--ink-3);line-height:1.4}
.credit b{font-weight:600;color:var(--ink-2);letter-spacing:.06em}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:var(--top-h);flex:none;display:flex;align-items:center;gap:14px;padding:0 max(22px,env(safe-area-inset-right,0px)) 0 26px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.topbar .t-title{display:flex;flex-direction:column;min-width:0}
.topbar .t-title h1{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t-title .t-sub{font-size:12px;color:var(--ink-3);white-space:nowrap}
.topbar .t-spacer{flex:1}
.live-pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--s-done);box-shadow:0 0 0 0 color-mix(in srgb,var(--s-done) 60%,transparent);animation:livepulse 2s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s-done) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.clock{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.role-btn{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 5px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);white-space:nowrap}
.role-btn:hover{border-color:var(--line-strong)}
.role-btn .r-text{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.role-btn .r-text b{font-size:13px;font-weight:600}
.role-btn .r-text span{font-size:11px;color:var(--ink-3)}
.view{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding-block:24px 40px;padding-left:max(26px,env(safe-area-inset-left,0px));padding-right:max(26px,env(safe-area-inset-right,0px))}
.view > section{animation:viewin .35s var(--ease)}
@keyframes viewin{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabbar{display:none}
.demo-flag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-2);font-size:11px;font-weight:500;letter-spacing:.04em;white-space:nowrap}

@media (max-width:1100px){ .live-pill .lp-text{display:none} }
@media (max-width:980px){
  :root{--rail-w:76px}
  .rail{padding-inline:12px;align-items:center}
  .rail-brand{padding:2px 0 18px;justify-content:center}
  .rail-brand .prod,.nav-btn .nav-label,.credit,.rail-foot .nav-label{display:none}
  .nav-btn{justify-content:center;width:52px;height:48px;padding:0}
  .nav-btn .nav-badge{position:absolute;top:4px;right:2px;margin:0;min-width:18px;height:18px;font-size:10px}
  .rail-foot .nav-btn{width:52px;padding:0}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .topbar{padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));gap:10px;height:58px}
  .topbar .t-title h1{font-size:18px}
  .topbar .t-sub,.clock,.demo-flag{display:none}
  .role-btn .r-text{display:none}
  .role-btn{padding:0 4px;height:40px}
  .view{padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar .nav-btn{flex-direction:column;gap:3px;justify-content:center;padding:6px 0;font-size:10.5px;letter-spacing:.04em}
  .tabbar .nav-btn[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
  .tabbar .nav-btn .nav-badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:18px;height:18px;font-size:10px}
  .tabbar .nav-btn[aria-current="page"] .nav-badge{background:var(--s-new);color:#fff}
}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-pill);font-weight:500;font-size:14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);white-space:nowrap;transition:transform .12s,background .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{opacity:.9;border-color:var(--accent)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-danger{color:var(--s-new);border-color:color-mix(in srgb,var(--s-new) 40%,transparent)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-lg{height:52px;padding:0 24px;font-size:15.5px}
.btn-block{width:100%}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:var(--r-pill);color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.is-active,.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-inv)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:var(--surface-2);gap:2px}
.seg button{height:32px;padding:0 14px;border-radius:var(--r-pill);font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.input{height:44px;width:100%;padding:0 14px;border-radius:var(--r-2);border:1px solid var(--line);background:var(--surface);transition:border-color .15s}
.input:focus{outline:none;border-color:var(--ink-3)}
textarea.input{height:auto;padding:12px 14px;resize:vertical}
.search{position:relative}
.search .input{padding-left:42px;height:48px;border-radius:var(--r-pill);font-size:15px}
.search > svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3)}
.divider{height:1px;background:var(--line);border:0;margin:0}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:var(--r-pill);font-size:11px;font-weight:600;letter-spacing:.03em;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge-new{background:var(--ink);color:var(--ink-inv)}
.badge-best{background:var(--surface-3);color:var(--ink)}
.badge-wait{background:var(--s-new-bg);color:var(--s-new)}

/* status pill: <span class="pill" data-status="new|picking|sent|delivered|unavailable|cancelled"> */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;background:var(--s-out-bg);color:var(--s-out)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill[data-status="new"]{background:var(--s-new-bg);color:var(--s-new)}
.pill[data-status="picking"]{background:var(--s-pick-bg);color:var(--s-pick)}
.pill[data-status="sent"]{background:var(--s-sent-bg);color:var(--s-sent)}
.pill[data-status="delivered"]{background:var(--s-done-bg);color:var(--s-done)}
.pill[data-status="new"]::before{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

.swatch{width:22px;height:22px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);flex:none;display:inline-block}
.swatch-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid transparent;transition:border-color .15s}
.swatch-btn[aria-pressed="true"]{border-color:var(--ink)}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;letter-spacing:.02em;color:#fff;flex:none}
.thumb{background:var(--surface-2);border-radius:var(--r-2);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb svg{width:78%;height:78%}
.empty{display:grid;place-items:center;gap:8px;text-align:center;padding:40px 16px;color:var(--ink-3)}
.empty svg{color:var(--ink-3)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .k-val{font-family:var(--f-display);font-weight:300;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k-label{font-size:12px;color:var(--ink-3)}
.lvl-out{color:var(--s-new)} .lvl-low{color:var(--s-pick)} .lvl-ok{color:var(--ink)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.38);backdrop-filter:blur(2px);z-index:60;opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:61;box-shadow:var(--shadow-2);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .34s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;gap:12px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-family:var(--f-display);font-weight:400;font-size:20px;flex:1;min-width:0}
.drawer-body{flex:1;overflow:auto;padding:22px 24px calc(28px + env(safe-area-inset-bottom,0px))}
.drawer-foot{padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}
@media (max-width:720px){
  .drawer{top:auto;left:0;width:100%;max-height:92%;border-radius:20px 20px 0 0;transform:translateY(102%);padding-right:0}
  .drawer::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line-strong);margin:8px auto 0}
  .drawer-head{padding:10px 16px 12px 20px}
  .drawer-body{padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px))}
  .drawer-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;z-index:71;width:min(420px,calc(100% - 32px));background:var(--surface);border-radius:var(--r-3);box-shadow:var(--shadow-2);padding:24px;transition:all .22s var(--ease)}
.modal.open{opacity:1;transform:translate(-50%,-50%)}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin-bottom:8px}
.modal .m-body{color:var(--ink-2);margin-bottom:20px}
.modal .m-actions{display:flex;gap:10px;justify-content:flex-end}
.toasts{position:fixed;z-index:90;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:8px;align-items:center;pointer-events:none;width:min(460px,calc(100% - 32px))}
@media (max-width:720px){.toasts{bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px))}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--ink-inv);box-shadow:var(--shadow-2);font-size:13.5px;animation:toastin .32s var(--ease);max-width:100%}
.toast .t-ico{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ink-inv) 14%,transparent)}
.toast[data-kind="success"] .t-ico{background:var(--s-done);color:#fff}
.toast[data-kind="alert"] .t-ico{background:var(--s-new);color:#fff}
.toast.out{animation:toastout .25s forwards}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes toastout{to{opacity:0;transform:translateY(8px)}}
.popover{position:fixed;z-index:80;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--shadow-2);padding:8px;animation:toastin .2s var(--ease)}
.popover .po-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:var(--r-2);text-align:left}
.popover .po-item:hover{background:var(--surface-2)}
.popover .po-item[aria-checked="true"]{background:var(--surface-2)}
.popover .po-item .po-text{display:flex;flex-direction:column;line-height:1.2;flex:1}
.popover .po-item .po-text span{font-size:12px;color:var(--ink-3)}
.popover .po-label{padding:8px 10px 4px}
.switch{width:38px;height:22px;border-radius:22px;background:var(--line-strong);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch[aria-checked="true"]{background:var(--s-done)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* real product photos (fall back to drawn art if a photo can't load) */
img.alo-photo{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 35%;border-radius:inherit;background:var(--surface-2);transition:transform .45s var(--ease)}
.fl-card:hover .alo-photo{transform:scale(1.03)}

/* ===== module: pitch ===== */
/* Alo Relay pitch: a single-theme cinematic overlay. Local palette below is the allowed pitch exception. */
.pt-root{--pt-bg:#0B0B0A;--pt-card:#131311;--pt-card-2:#1A1917;--pt-ink:#EFEAE0;--pt-ink-2:#B3ADA2;--pt-ink-3:#7A756D;--pt-line:#252421;--pt-line-2:#3A3833;
  --pt-paper:#E8E3D9;--pt-new:#D58C6F;--pt-sent:#A2B6C8;--pt-ok:#AFC4A2;--pt-ease:cubic-bezier(.2,.7,.2,1);
  position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;background:var(--pt-bg);color:var(--pt-ink);
  font-family:var(--f-body);overflow:hidden;outline:none;color-scheme:dark;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.pt-root :focus-visible{outline:1.5px solid var(--pt-ink);outline-offset:3px}
.pt-root .sr-only{position:absolute}
.pt-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pt-fx i{position:absolute;left:54%;top:-34vmax;width:80vmax;height:80vmax;border:1px solid var(--pt-line);border-radius:50%;animation:pt-drift 48s ease-in-out infinite alternate}
.pt-fx i+i{left:-40vmax;top:48%;width:64vmax;height:64vmax;animation-duration:60s;animation-direction:alternate-reverse}
@keyframes pt-drift{to{transform:translate(-6vmax,5vmax)}}
.pt-top,.pt-stage,.pt-foot{position:relative}

/* chrome */
.pt-top{padding:12px clamp(16px,4vw,40px) 0}
.pt-prog{display:flex;gap:6px}
.pt-seg{flex:1;height:18px;display:flex;align-items:center}
.pt-seg span{display:block;width:100%;height:2px;border-radius:2px;background:var(--pt-line-2);overflow:hidden;transition:background .2s}
.pt-seg i{display:block;height:100%;background:var(--pt-ink);transform:scaleX(0);transform-origin:left;transition:opacity .3s}
.pt-seg:hover span{background:var(--pt-ink-3)}
.pt-root.is-held .pt-seg.is-on i,.pt-root.is-paused .pt-seg.is-on i{opacity:.5}
.pt-bar{display:flex;align-items:center;gap:12px;height:50px}
.pt-mark{display:flex;align-items:baseline;gap:10px;transition:opacity .6s var(--pt-ease)}
.pt-mark .wordmark{font-size:26px}
.pt-mark span+span{font-family:var(--f-display);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--pt-ink-2)}
.pt-root[data-i="0"] .pt-mark{opacity:0}
.pt-count{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--pt-ink-3)}
.pt-sp{flex:1}
.pt-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--pt-line-2);color:var(--pt-ink);font-family:var(--f-display);font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;transition:border-color .2s,opacity .2s,transform .12s}
.pt-btn:hover{border-color:var(--pt-ink-2)}
.pt-btn:active{transform:scale(.97)}
.pt-btn[disabled]{opacity:.28;pointer-events:none}
.pt-btn-solid{background:var(--pt-ink);border-color:var(--pt-ink);color:var(--pt-bg)}
.pt-btn-solid:hover{opacity:.88;border-color:var(--pt-ink)}
.pt-icon{width:38px;padding:0}
.pt-foot{padding:0 clamp(16px,4vw,40px) 12px}
.pt-nav{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--pt-line)}
.pt-name{flex:1;min-width:0;text-align:center;font-family:var(--f-display);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--pt-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-note{text-align:center;font-size:11px;color:var(--pt-ink-3);letter-spacing:.02em;text-wrap:balance}

/* scenes */
.pt-stage{min-height:0}
.pt-scene{position:absolute;inset:0;display:flex;overflow-y:auto;overscroll-behavior:contain;padding:clamp(16px,3vh,40px) clamp(20px,5vw,64px);opacity:0;visibility:hidden;transition:opacity .45s var(--pt-ease),visibility 0s linear .45s}
.pt-scene.is-on{opacity:1;visibility:visible;transition:opacity .7s var(--pt-ease) .1s,visibility 0s}
.pt-inner{margin:auto;width:100%;max-width:1120px}
.pt-eb{font-family:var(--f-display);font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--pt-ink-3);margin-bottom:18px}
.pt-k{font-family:var(--f-display);font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--pt-ink-3)}
.pt-h{font-family:var(--f-display);font-weight:300;font-size:clamp(30px,4.6vw,58px);line-height:1.06;letter-spacing:-.015em;max-width:15em;margin-bottom:18px}
.pt-w{display:inline-block;white-space:nowrap}
.pt-l{display:inline-block}
.pt-sub{color:var(--pt-ink-2);font-size:clamp(15px,1.3vw,17px);line-height:1.55;max-width:32em}
.pt-lede{font-family:var(--f-display);font-weight:300;font-size:clamp(20px,2.3vw,28px);line-height:1.3;max-width:22em;text-wrap:balance}
.pt-nw{white-space:nowrap}
.pt-scene.is-scroll{-webkit-mask-image:linear-gradient(#000 84%,transparent);mask-image:linear-gradient(#000 84%,transparent)}
.pt-hr{display:block;height:1px;background:var(--pt-line-2);transform-origin:left}
.pt-ico{display:inline-grid;color:var(--pt-ink)}
.pt-ico svg *{stroke-dasharray:100}

/* 1 opening */
.pt-open{display:flex;flex-direction:column;align-items:center;text-align:center}
.pt-wm{font-size:clamp(120px,21vw,228px);font-weight:400;letter-spacing:-.05em;line-height:.9;padding-bottom:.05em}
.pt-wm span{display:inline-block}
.pt-rule{display:block;width:min(420px,64vw);height:1px;background:var(--pt-ink-3);margin:26px 0 24px;transform-origin:center}
.pt-relay{font-family:var(--f-display);font-weight:300;font-size:clamp(15px,1.7vw,20px);letter-spacing:.7em;padding-left:.7em;text-transform:uppercase}
.pt-open .pt-lede{margin-top:42px}
.pt-by{margin-top:16px;font-family:var(--f-display);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--pt-ink-3)}
.pt-by b{font-weight:500;color:var(--pt-ink-2)}

/* 2 problem */
.pt-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(28px,6vw,96px);align-items:center}
.pt-radio{position:relative;padding:14px 18px 16px;border:1px solid var(--pt-line);border-radius:18px;background:var(--pt-card);overflow:hidden}
.pt-noise{position:absolute;inset:0;width:100%;height:100%;opacity:.6;pointer-events:none}
.pt-rh{position:relative;display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--pt-line);font-family:var(--f-mono);font-size:11.5px;color:var(--pt-ink-3)}
.pt-eq{margin-left:auto;display:flex;align-items:flex-end;gap:2px;height:14px}
.pt-eq i{width:2px;height:100%;background:var(--pt-ink-3);transform-origin:bottom;animation:pt-eq .8s ease-in-out infinite alternate}
.pt-eq i:nth-child(2n){animation-delay:-.35s}.pt-eq i:nth-child(3n){animation-delay:-.6s}
@keyframes pt-eq{from{transform:scaleY(.2)}}
.pt-chat{position:relative;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.pt-b{align-self:flex-start;max-width:86%;padding:9px 14px 10px;border:1px solid var(--pt-line);border-radius:14px 14px 14px 4px;background:var(--pt-card-2)}
.pt-b.is-stock{align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--pt-bg)}
.pt-bm{display:flex;justify-content:space-between;gap:18px;margin-bottom:3px;font-family:var(--f-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--pt-ink-3)}
.pt-b p{font-size:14.5px;line-height:1.4}
.pt-cap{position:relative;margin-top:12px;font-size:11px;color:var(--pt-ink-3)}

/* 3 costs */
.pt-costs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.pt-cost{padding:26px 28px 6px 0}
.pt-cost+.pt-cost{padding-left:28px;border-left:1px solid var(--pt-line)}
.pt-num{display:block;font-family:var(--f-mono);font-size:11px;color:var(--pt-ink-3)}
.pt-cost .pt-ico{margin:22px 0 18px}
.pt-cost h3,.pt-tile h3{font-family:var(--f-display);font-weight:400;font-size:clamp(19px,1.8vw,23px);line-height:1.2;margin-bottom:10px}
.pt-cost p{font-size:14.5px;line-height:1.55;color:var(--pt-ink-2)}
.pt-scene .pt-hr{margin-top:clamp(20px,4vh,44px)}

/* 4 flow */
.pt-flow{display:flex;align-items:center;margin-top:clamp(20px,4vh,44px)}
.pt-node{flex:1 1 0;min-width:0}
.pt-step{display:flex;gap:10px;align-items:baseline;min-height:2.8em;margin-bottom:10px;font-size:13px;line-height:1.35;color:var(--pt-ink-2)}
.pt-step .mono{font-size:11px;color:var(--pt-ink-3)}
.pt-link{flex:0 0 46px;height:1px;margin-top:46px;background:var(--pt-line-2);position:relative}
.pt-link::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid var(--pt-ink-3);border-right:1px solid var(--pt-ink-3);transform:rotate(45deg)}
.pt-link i{position:absolute;left:0;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--pt-ink);box-shadow:0 0 10px color-mix(in srgb,var(--pt-ink) 60%,transparent);opacity:0}
.pt-card{display:flex;flex-direction:column;gap:12px;min-height:190px;padding:14px;border:1px solid var(--pt-line);border-radius:16px;background:var(--pt-card)}
.pt-ch{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-display);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--pt-ink-3)}
.pt-item{display:flex;align-items:center;gap:12px}
.pt-thumb{width:46px;height:54px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--pt-paper)}
.pt-thumb svg{width:80%;height:80%}
.pt-it{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.pt-it b{font-size:13.5px;font-weight:500;text-wrap:balance}
.pt-it span{font-size:12px;color:var(--pt-ink-2);text-wrap:balance}
.pt-dest{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--pt-ink-2)}
.pt-send{margin-top:auto;height:34px;display:grid;place-items:center;border-radius:999px;background:var(--pt-ink);color:var(--pt-bg);font-size:12.5px;font-weight:500}
.pt-pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-family:var(--f-body);font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:none;color:var(--pt-new);background:color-mix(in srgb,var(--pt-new) 15%,transparent)}
.pt-pill.is-sent{color:var(--pt-sent);background:color-mix(in srgb,var(--pt-sent) 15%,transparent)}
.pt-row{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:12px;border-top:1px solid var(--pt-line)}
.pt-row b{font-size:15px;font-weight:500}
.pt-row .pt-bin{font-size:20px;letter-spacing:.02em}
.pt-route{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--pt-ink-3)}
.pt-route i{flex:1;position:relative;border-top:1px dashed var(--pt-line-2)}
.pt-route i::after{content:"";position:absolute;left:0;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--pt-ink)}
.pt-okc{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--pt-ok);color:var(--pt-bg)}

/* 5 tiles */
.pt-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:clamp(20px,4vh,44px)}
.pt-tile{padding:22px 20px 20px;border:1px solid var(--pt-line);border-radius:18px;background:var(--pt-card)}
.pt-tile .pt-ico{margin-bottom:26px}
.pt-tile ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.pt-tile li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.4;color:var(--pt-ink-2)}
.pt-tile li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:1px;background:var(--pt-ink-3)}

/* 6 goals */
.pt-goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,4vw,56px);margin-top:clamp(24px,5vh,56px)}
.pt-big{display:flex;align-items:baseline;gap:.14em;margin:12px 0 16px;font-family:var(--f-display);font-weight:300;font-size:clamp(64px,8vw,112px);line-height:1;letter-spacing:-.03em}
.pt-big small{font-size:.22em;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--pt-ink-2)}
.pt-goal .pt-hr{margin:0}
.pt-goal p{margin-top:14px;font-size:15px;line-height:1.45;color:var(--pt-ink-2)}
.pt-fine{margin-top:clamp(24px,5vh,48px);font-size:12px;color:var(--pt-ink-3)}

/* 7 investment */
.pt-invest{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(32px,7vw,110px);align-items:end}
.pt-price{margin:8px 0 24px;font-family:var(--f-display);font-weight:300;font-size:clamp(68px,10vw,148px);line-height:.95;letter-spacing:-.035em}
.pt-invest .pt-hr{margin:0 0 22px}
.pt-incl ul{list-style:none;margin:0;padding:0}
.pt-incl li{display:flex;align-items:flex-start;gap:14px;padding:15px 0;border-top:1px solid var(--pt-line);font-size:15.5px;line-height:1.4}
.pt-incl li:last-child{border-bottom:1px solid var(--pt-line)}
.pt-incl .pt-ico{color:var(--pt-ink-2);margin-top:1px}

/* 8 enter */
.pt-roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:clamp(22px,4vh,40px)}
.pt-role{display:flex;align-items:center;gap:14px;padding:18px;text-align:left;border:1px solid var(--pt-line-2);border-radius:18px;background:var(--pt-card);transition:border-color .2s,background .2s,transform .2s var(--pt-ease)}
.pt-role:hover{border-color:var(--pt-ink-2);background:var(--pt-card-2);transform:translateY(-2px)}
.pt-role .avatar{box-shadow:0 0 0 1px var(--pt-line-2)}
.pt-role-t{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.pt-role-t b{font-family:var(--f-display);font-weight:400;font-size:19px}
.pt-role-t span:last-child{font-size:12.5px;color:var(--pt-ink-2)}
.pt-role>svg{flex:none;color:var(--pt-ink-3);transition:transform .2s,color .2s}
.pt-role:hover>svg{transform:translateX(3px);color:var(--pt-ink)}
.pt-tip{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:13px;color:var(--pt-ink-3)}

/* motion language: soft fades, letter reveals, drawn lines (keyframes are "from" only, so rest state is fully visible) */
@keyframes pt-up{from{opacity:0;transform:translateY(16px)}}
@keyframes pt-l{from{opacity:0;transform:translateY(.42em)}}
@keyframes pt-c{from{opacity:0}}
@keyframes pt-draw{from{transform:scaleX(0)}}
@keyframes pt-stroke{from{stroke-dashoffset:100}}
@keyframes pt-wm{from{opacity:.18;filter:blur(12px);transform:translateY(.06em)}}
@keyframes pt-track{from{opacity:0;letter-spacing:.22em}}
@keyframes pt-glow{0%{border-color:var(--pt-line)}6%{border-color:var(--pt-ink-2)}30%,100%{border-color:var(--pt-line)}}
@keyframes pt-tx{0%{left:0;opacity:0}4%{opacity:1}20%{left:calc(100% - 7px);opacity:1}24%,100%{left:calc(100% - 7px);opacity:0}}
@keyframes pt-ty{0%{top:0;opacity:0}4%{opacity:1}20%{top:calc(100% - 7px);opacity:1}24%,100%{top:calc(100% - 7px);opacity:0}}
@keyframes pt-run{0%,52%{left:0}70%,100%{left:calc(100% - 7px)}}
.is-on .pt-r{animation:pt-up .9s var(--pt-ease) var(--d,0ms) backwards}
.is-on .pt-l{animation:pt-l .7s var(--pt-ease) var(--d,0ms) backwards}
.is-on .pt-c{animation:pt-c .02s linear var(--d,0ms) backwards}
.is-on .pt-draw{animation:pt-draw 1.2s var(--pt-ease) var(--d,0ms) backwards}
.is-on .pt-ico svg *{animation:pt-stroke 1.6s var(--pt-ease) var(--d,0ms) backwards}
.is-on .pt-wm span{animation:pt-wm 1.3s var(--pt-ease) var(--d,0ms) backwards}
.is-on .pt-relay{animation:pt-track 1.4s var(--pt-ease) var(--d,0ms) backwards}
.is-on .pt-card{animation:pt-glow 6s ease-out calc(var(--k)*1.6s + .5s) infinite}
.is-on .pt-link i{animation:pt-tx 6s var(--pt-ease) calc(var(--k)*1.6s + .9s) infinite}
.is-on .pt-route i::after{animation:pt-run 6s var(--pt-ease) infinite}
.pt-root.is-leaving{animation:pt-out .9s var(--pt-ease) forwards;pointer-events:none}
.pt-root.is-leaving>*{animation:pt-lift .5s var(--pt-ease) forwards}
@keyframes pt-out{0%,30%{opacity:1}100%{opacity:0}}
@keyframes pt-lift{to{opacity:0;transform:translateY(-14px)}}

@media (max-width:980px){.pt-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .pt-flow{flex-direction:column;align-items:stretch;max-width:360px;margin-inline:auto}
  .pt-step{min-height:0;margin-bottom:8px}
  .pt-card{min-height:0}
  .pt-link{flex:0 0 34px;width:1px;height:auto;margin:8px auto}
  .pt-link::after{right:auto;top:auto;left:-3px;bottom:0;transform:rotate(135deg)}
  .pt-link i{left:-3px;top:0}
  .is-on .pt-link i{animation-name:pt-ty}
}
@media (max-width:720px){
  .pt-bar{height:46px;gap:10px}
  .pt-btn{height:36px;padding:0 14px;letter-spacing:.16em}
  .pt-icon{width:36px;padding:0}
  .pt-h{margin-bottom:12px}
  .pt-eb{margin-bottom:12px}
  .pt-two,.pt-invest,.pt-costs,.pt-goals,.pt-roles{grid-template-columns:minmax(0,1fr)}
  .pt-two{gap:18px}
  .pt-two .pt-sub{font-size:14px}
  .pt-radio{padding:12px 14px 12px}
  .pt-rh{padding-bottom:10px;margin-bottom:10px}
  .pt-chat{gap:7px}
  .pt-b{padding:7px 12px 8px}
  .pt-b p{font-size:13.5px}
  .pt-cap{margin-top:8px}
  .pt-card{padding:12px;gap:10px}
  .pt-thumb{width:40px;height:46px}
  .pt-send{height:30px}
  .pt-link{flex-basis:28px;margin:6px auto}
  .pt-cost,.pt-cost+.pt-cost{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 14px;padding:18px 0;border-left:0}
  .pt-cost+.pt-cost{border-top:1px solid var(--pt-line)}
  .pt-cost .pt-num{display:none}
  .pt-cost .pt-ico{grid-row:span 2;margin:2px 0 0}
  .pt-cost h3{font-size:18px;margin-bottom:4px}
  .pt-tiles{gap:10px}
  .pt-tile{padding:16px 14px}
  .pt-tile .pt-ico{margin-bottom:12px}
  .pt-tile h3{font-size:18px}
  .pt-tile li{font-size:12.5px}
  .pt-goals{gap:22px}
  .pt-goal{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;gap:0 18px}
  .pt-goal .pt-k,.pt-goal .pt-hr{grid-column:1/-1}
  .pt-big{font-size:58px;margin:6px 0 12px}
  .pt-goal p{grid-column:2;grid-row:2;margin:0 0 14px}
  .pt-invest{gap:28px}
  .pt-role{padding:14px 16px}
  .pt-note{font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){.pt-root,.pt-root *,.pt-root *::after{animation:none!important;transition:none!important}}

/* investment: one-time + flat monthly + terms */
.pt-mo{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;margin:0 0 14px}
.pt-mo b{font-family:var(--f-display);font-weight:300;font-size:clamp(30px,3.4vw,46px);letter-spacing:-.02em;color:var(--pt-ink)}
.pt-mo span{font-size:15px;color:var(--pt-ink-2)}
.pt-mo em{flex-basis:100%;font-style:normal;font-size:13.5px;color:var(--pt-ink-3)}
.pt-terms{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--pt-ink-3);max-width:520px}
.pt-terms li{position:relative;padding-left:10px}
.pt-terms li::before{content:"";position:absolute;left:0;top:.55em;width:4px;height:4px;border-radius:50%;background:var(--pt-ink-3)}
.pt-incl .pt-eb2{margin-top:22px}
.pt-incl li{padding:11px 0}
.pt-invest .pt-price{font-size:clamp(60px,8.6vw,128px);margin-bottom:18px}

/* ===== module: floor ===== */
/* ============================================================
   Floor view — associate's phone. Prefix: fl-
   Sheet, popover and toast parts live outside .view-floor (overlay roots),
   so those rules are prefix-scoped only.
   ============================================================ */
.fl{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.fl-hint{font-size:12px}
.fl-sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.fl-wide-only{display:none}
@media (min-width:1000px){.fl-wide-only{display:inline}.fl-narrow-only{display:none}}

/* ---------- greeting + destination ---------- */
.view-floor .fl-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.view-floor .fl-hello{min-width:0}
.view-floor .fl-hi{font-size:40px;line-height:1.05;margin-top:8px}
.view-floor .fl-hello-sub{margin-top:8px;color:var(--ink-2);font-size:14px;max-width:60ch}
.fl-dest{display:inline-flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px 8px 9px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);text-align:left;transition:border-color .15s,box-shadow .2s}
.fl-dest:hover{border-color:var(--line-strong);box-shadow:var(--shadow-1)}
.fl-dest:active{transform:scale(.99)}
.fl-dest-ico{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--ink-inv);display:grid;place-items:center;flex:none}
.fl-dest-t{display:flex;flex-direction:column;gap:2px;line-height:1.15;min-width:0}
.fl-dest-t .eyebrow{font-size:10px}
.fl-dest-t b{font-size:15.5px;font-weight:600;white-space:nowrap}
.fl-dest-chev{color:var(--ink-3);margin-left:6px;display:grid}
@media (max-width:719px){
  .view-floor .fl-hi{font-size:32px}
  .view-floor .fl-head{gap:14px}
  .fl-dest{width:100%}
  .fl-dest-chev{margin-left:auto}
}

/* ---------- radio-free strip ---------- */
.view-floor .fl-strip{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:10px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.view-floor .fl-strip-ico{display:grid;color:var(--ink-3)}
.view-floor .fl-strip-k{color:var(--ink-2)}
.view-floor .fl-strip b{color:var(--ink);font-weight:600}
.view-floor .fl-strip .mono{font-weight:500}

/* ---------- columns ---------- */
.view-floor .fl-cols{display:flex;flex-direction:column;gap:28px}
.view-floor .fl-main{display:flex;flex-direction:column;gap:28px;min-width:0}
@media (min-width:1000px){
  .view-floor .fl-cols{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,30vw,384px);gap:36px;align-items:start}
  .view-floor .fl-main{order:1}
  .view-floor .fl-side{order:2;position:sticky;top:0;max-height:calc(100vh - var(--top-h) - 40px);display:flex;flex-direction:column}
  .view-floor .fl-track{overflow:auto;min-height:0;scrollbar-width:thin}
  .view-floor .fl-chips{flex-wrap:wrap}
}

/* ---------- my requests ---------- */
.view-floor .fl-track{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);padding:16px}
.view-floor .fl-track-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.view-floor .fl-open-n{font-size:12px;font-weight:600;color:var(--ink);background:var(--surface-2);padding:2px 9px;border-radius:var(--r-pill)}
.view-floor .fl-open-n:empty{display:none}
.view-floor .fl-list{display:flex;flex-direction:column;gap:10px}
.view-floor .fl-list[hidden]{display:none}
.view-floor .fl-list-earlier{margin-top:10px}
.view-floor .fl-earlier-btn{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:10px 4px 2px;border-top:1px solid var(--line);color:var(--ink-2);font-size:12.5px;font-weight:500}
.view-floor .fl-earlier-btn .mono{color:var(--ink-3)}
.view-floor .fl-earlier-btn svg{margin-left:auto;transition:transform .25s var(--ease)}
.view-floor .fl-earlier-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.view-floor .fl-earlier-btn[hidden]{display:none}
.view-floor .fl-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 8px 10px}
.view-floor .fl-empty[hidden]{display:none}
.view-floor .fl-empty-art{width:52px;height:52px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;margin-bottom:4px}
.view-floor .fl-empty-t{font-family:var(--f-display);font-size:17px;font-weight:400}
.view-floor .fl-empty-d{font-size:13px;color:var(--ink-3);max-width:32ch}

.fl-req{position:relative;border:1px solid var(--line);border-radius:var(--r-2);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px;transition:border-color .4s,background-color .4s,padding .3s var(--ease)}
.fl-req-top{display:flex;gap:12px;align-items:flex-start}
.fl-req-thumb{width:46px;height:56px;color:var(--ink-2);transition:width .3s var(--ease),height .3s var(--ease)}
.fl-req-thumb svg{width:80%;height:80%}
.fl-req[data-status] .fl-req-thumb:has(> svg[width="20"]) svg{width:20px;height:20px}
.fl-req-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fl-req-r1{display:flex;align-items:baseline;gap:10px}
.fl-req-title{flex:1;min-width:0;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-timer{font-size:12.5px;color:var(--ink-2);flex:none}
.fl-req-sub{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;flex-wrap:wrap;gap:0 5px}
.fl-req-sub .badge{height:18px;font-size:10.5px;margin-left:2px}
.fl-dotsep{color:var(--ink-3)}
.fl-req-who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);min-height:26px;margin-top:3px}
.fl-req-who .avatar{animation:fl-pop .4s var(--ease)}
.fl-who-t{min-width:0}
.fl-who-t b{color:var(--ink);font-weight:600}
.fl-who-t .mono{color:var(--ink)}
.fl-pulse{width:8px;height:8px;border-radius:50%;background:var(--s-new);flex:none;margin:0 7px;animation:fl-ping 1.6s infinite}
.fl-cancel{margin-left:auto;height:26px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:500;color:var(--ink-3);border:1px solid var(--line)}
.fl-cancel:hover{color:var(--s-new);border-color:color-mix(in srgb,var(--s-new) 40%,transparent)}

/* progress: 4 segments that fill as the runner moves */
.fl-prog-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ease),opacity .3s}
.fl-prog{overflow:hidden;min-height:0}
.fl-segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.fl-segs i{position:relative;height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.fl-segs i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--ink);transform:scaleX(0);transform-origin:left center;transition:transform .8s var(--ease),background-color .5s}
.fl-segs i.is-on::after{transform:scaleX(1)}
.fl-segs i.is-next::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 30%,transparent),transparent);transform:translateX(-100%);animation:fl-shimmer 1.8s var(--ease) infinite}
.fl-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:7px;font-family:var(--f-display);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
@media (max-width:719px){.fl-steps{letter-spacing:.04em;font-size:9.5px}}
.fl-steps span{transition:color .4s;overflow:hidden;text-overflow:ellipsis}
.fl-steps span.is-on{color:var(--ink-2)}
.fl-steps span.is-cur{color:var(--ink)}
.fl-req[data-status="delivered"] .fl-segs i::after{background:var(--s-done)}
.fl-req[data-status="delivered"] .fl-steps span.is-cur{color:var(--s-done)}
.fl-req[data-status="delivered"]:not(.is-compact){border-color:color-mix(in srgb,var(--s-done) 45%,var(--line))}
.fl-req[data-status="unavailable"] .fl-prog-wrap,.fl-req[data-status="cancelled"] .fl-prog-wrap{display:none}
.fl-req[data-status="cancelled"]{opacity:.7}
.fl-req.is-compact{padding:9px 12px;gap:0}
.fl-req.is-compact .fl-prog-wrap{grid-template-rows:0fr;opacity:0}
.fl-req.is-compact .fl-req-thumb{width:36px;height:44px}
.fl-req.is-compact .fl-req-who{min-height:22px;margin-top:1px}
.fl-req.is-compact .fl-req-who .avatar{width:18px!important;height:18px!important;font-size:8px!important}
.fl-req-x:empty{display:none}
.fl-unav{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r-2);background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.fl-unav b{color:var(--ink);font-weight:600}
.fl-unav-done{display:inline-flex;align-items:center;gap:6px;color:var(--s-done);font-weight:500}

.fl-req.fl-enter{animation:fl-enter .5s var(--ease)}
.fl-req.fl-bump{animation:fl-bump 1s var(--ease)}
.fl-req[data-status="delivered"].fl-bump{animation-name:fl-bump-done}
@keyframes fl-enter{from{opacity:0;transform:translateY(-8px) scale(.985)}}
@keyframes fl-bump{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ink) 22%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes fl-bump-done{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s-done) 45%,transparent);background-color:var(--s-done-bg)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes fl-shimmer{to{transform:translateX(100%)}}
@keyframes fl-ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s-new) 50%,transparent)}75%,100%{box-shadow:0 0 0 7px transparent}}
@keyframes fl-pop{from{transform:scale(.4);opacity:0}}

/* ---------- quick supplies ---------- */
.view-floor .fl-sup-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(92px,1fr);gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.view-floor .fl-sup-row::-webkit-scrollbar{display:none}
@media (min-width:1000px){.view-floor .fl-sup-row{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));overflow:visible}}
.fl-sup{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:78px;padding:10px 8px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:500;line-height:1.2;text-align:center;transition:border-color .15s,color .15s,background-color .25s,transform .12s}
.fl-sup:hover{border-color:var(--line-strong);color:var(--ink)}
.fl-sup:active{transform:scale(.96)}
.fl-sup-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--ink);transition:background-color .25s,color .25s}
.fl-sup.is-sent{border-color:color-mix(in srgb,var(--s-done) 50%,var(--line));color:var(--s-done)}
.fl-sup.is-sent .fl-sup-ico{background:var(--s-done);color:var(--surface);animation:fl-pop .35s var(--ease)}

/* ---------- search + filters ---------- */
.view-floor .fl-catalog{display:flex;flex-direction:column;gap:14px;min-width:0}
.view-floor .fl-tools{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.view-floor .fl-search{display:block;flex:1 1 260px;min-width:0}
.view-floor .fl-search input::-webkit-search-cancel-button{cursor:pointer}
.view-floor .fl-gender{flex:none}
@media (max-width:719px){
  .view-floor .fl-gender{flex:1 1 100%;display:flex}
  .view-floor .fl-gender button{flex:1}
}
.view-floor .fl-chips{min-width:0}
.view-floor .fl-results-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}

/* ---------- product grid ---------- */
.view-floor .fl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px}
.fl-card{display:flex;flex-direction:column;gap:10px;text-align:left;border-radius:var(--r-2);min-width:0}
.fl-thumb,.fl-hero-img,.fl-req-thumb,.fl-alt .thumb{background:radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--ink) 7%,transparent),transparent 68%),var(--surface-2)}
.fl-card .fl-thumb{position:relative;width:100%;aspect-ratio:4/5;transition:background-color .2s}
.fl-card .fl-thumb svg{width:68%;height:68%;transition:transform .45s var(--ease)}
.fl-card:hover .fl-thumb svg{transform:translateY(-4px) scale(1.02)}
.fl-card:active .fl-thumb{transform:scale(.985)}
.fl-badges{position:absolute;top:8px;left:8px;display:flex;flex-wrap:wrap;gap:4px}
.fl-card-b{display:flex;flex-direction:column;gap:5px;padding:0 2px}
.fl-name{font-size:13.5px;font-weight:500;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.fl-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fl-price{font-size:13px;color:var(--ink-2)}
.fl-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.fl-dots .swatch{width:11px;height:11px}
.fl-dots .swatch.is-on{box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--ink-3)}
.fl-back{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.fl-back .eyebrow{font-size:9.5px;letter-spacing:.16em}
.fl-back .mono{color:var(--ink)}
.fl-out-n{color:var(--s-pick)}
.view-floor .fl-noresults{grid-column:1/-1}

/* ---------- request sheet (drawer lives in #overlay-root) ---------- */
.fl-sheet{display:flex;flex-direction:column;gap:24px}
.fl-hero{display:grid;grid-template-columns:136px minmax(0,1fr);gap:18px;align-items:center}
.fl-hero-img{width:100%;aspect-ratio:5/6}
.fl-hero-img svg{width:82%;height:82%;animation:fl-fade .35s var(--ease)}
@keyframes fl-fade{from{opacity:0;transform:scale(.97)}}
.fl-hero-meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl-hero-price{font-family:var(--f-display);font-size:24px;font-weight:300;line-height:1.1}
.fl-hero-badges{display:flex;gap:4px}
.fl-dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.fl-dl div{display:contents}
.fl-dl dt{font-family:var(--f-display);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);align-self:center}
.fl-dl dd{margin:0;color:var(--ink);min-width:0}
@media (min-width:721px){.fl-hero{grid-template-columns:176px minmax(0,1fr);gap:22px}}

.fl-swatches{display:flex;flex-wrap:wrap;gap:6px}
.fl-swatches .swatch-btn{width:42px;height:42px}
.fl-swatches .swatch{width:30px;height:30px}

.fl-legend{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3)}
.fl-legend .fl-dot + .fl-dot,.fl-legend .fl-dot:not(:first-child){margin-left:6px}
.fl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--s-done);flex:none}
.fl-dot[data-lvl="low"]{background:var(--s-pick)}
.fl-dot[data-lvl="out"]{background:var(--s-new)}
.fl-sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fl-size{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-height:92px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--surface);text-align:left;transition:border-color .15s,box-shadow .15s,background-color .15s,transform .12s}
.fl-size:hover{border-color:var(--line-strong)}
.fl-size:active{transform:scale(.97)}
.fl-size-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.fl-size-l{font-family:var(--f-display);font-size:23px;font-weight:400;line-height:1}
.fl-size-n{display:flex;align-items:baseline;gap:5px;font-size:11.5px;color:var(--ink-3)}
.fl-size-n .mono{font-size:13px;font-weight:500}
.fl-size-f .mono{color:var(--ink-2)}
.fl-size[data-lvl="out"]{background:var(--surface-2);border-color:transparent}
.fl-size[data-lvl="out"] .fl-size-l{color:var(--ink-3)}
.fl-size[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.fl-size[aria-pressed="true"][data-lvl="out"]{border-color:var(--s-new);box-shadow:inset 0 0 0 1px var(--s-new)}

/* not in the back */
.fl-out{display:flex;flex-direction:column;gap:16px;padding:16px;border-radius:var(--r-3);background:var(--surface-2)}
.fl-out-in{animation:fl-enter .4s var(--ease)}
.fl-out-h{display:flex;gap:12px;align-items:flex-start}
.fl-out-h b{font-family:var(--f-display);font-size:17px;font-weight:400}
.fl-out-h p{font-size:13px;color:var(--ink-2);margin-top:2px}
.fl-out-ico{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;flex:none}
.fl-out-sec{display:flex;flex-direction:column;gap:8px}
.fl-out-none{font-size:13px;color:var(--ink-3)}
.fl-alts{display:flex;flex-direction:column;gap:6px}
.fl-alt{display:flex;align-items:center;gap:12px;width:100%;padding:7px 12px 7px 7px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--surface);text-align:left;color:var(--ink-3);transition:border-color .15s,transform .12s}
.fl-alt:hover{border-color:var(--ink-3)}
.fl-alt:active{transform:scale(.99)}
.fl-alt .thumb{width:40px;height:48px}
.fl-alt-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.fl-alt-t b{font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-alt-t span{font-size:12px;color:var(--ink-3)}
.fl-alt-n{font-size:12px;color:var(--ink-2);white-space:nowrap}
.fl-alt-n .mono{color:var(--s-done);font-weight:500}
.fl-near{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.fl-near:first-of-type{border-top:0}
.fl-near-ico{width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;flex:none}
.fl-near-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.fl-near-t b{font-size:13.5px;font-weight:500}
.fl-near-t span{font-size:12px;color:var(--ink-3)}
.fl-near-done{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--s-done);white-space:nowrap}

/* qty + waiting + notes */
.fl-opts{display:flex;flex-wrap:wrap;gap:12px}
.fl-qty{display:flex;flex-direction:column;gap:8px}
.fl-step{display:inline-flex;align-items:center;height:48px;padding:0 4px;border:1px solid var(--line);border-radius:var(--r-pill)}
.fl-step .icon-btn{width:40px;height:40px;color:var(--ink)}
.fl-step .icon-btn[disabled]{opacity:.3;pointer-events:none}
.fl-qty-v{min-width:32px;text-align:center;font-family:var(--f-display);font-size:19px}
.fl-waitsw{flex:1 1 220px;display:flex;align-items:center;justify-content:space-between;gap:12px;align-self:flex-end;min-height:48px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-2);text-align:left;transition:border-color .15s}
.fl-waitsw:hover{border-color:var(--line-strong)}
.fl-waitsw-t{display:flex;flex-direction:column;line-height:1.25}
.fl-waitsw-t b{font-size:13.5px;font-weight:600}
.fl-waitsw-t span{font-size:12px;color:var(--ink-3)}
.fl-notes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fl-notes .chip{height:32px;font-size:12.5px}

/* sticky footer */
.fl-foot{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.fl-to{align-self:center;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:12.5px;color:var(--ink-2)}
.fl-to:hover{background:var(--surface-2)}
.fl-to b{color:var(--ink);font-weight:600}
.fl-to-change{text-decoration:underline;text-underline-offset:3px;color:var(--ink-3);margin-left:2px}
.fl-send{height:56px;font-size:15.5px;letter-spacing:.01em}

/* ---------- zone popover (lives on <body>) ---------- */
.fl-zpop{width:min(300px,calc(100vw - 40px));padding:4px 6px 6px;display:flex;flex-direction:column;gap:10px}
.fl-zpop .eyebrow{padding:4px 2px 0}
.fl-zfr{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.fl-zfr button{height:56px;border:1px solid var(--line);border-radius:var(--r-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:border-color .15s,background-color .15s}
.fl-zfr button:hover{border-color:var(--line-strong)}
.fl-zfr button span{font-family:var(--f-display);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.fl-zfr button b{font-family:var(--f-display);font-size:19px;font-weight:400;line-height:1}
.fl-zfr button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-inv)}
.fl-zfr button[aria-checked="true"] span{color:var(--ink-inv);opacity:.7}
.fl-zother{display:flex;flex-wrap:wrap;gap:6px}
.fl-zother .chip{height:32px;font-size:12.5px;padding:0 12px}

/* ---------- toast undo ---------- */
.fl-toast-msg{margin-right:4px}
.fl-undo{margin-left:6px;height:28px;padding:0 12px;border-radius:var(--r-pill);border:1px solid color-mix(in srgb,var(--ink-inv) 35%,transparent);color:var(--ink-inv);font-size:12.5px;font-weight:600;vertical-align:middle}
.fl-undo:hover{background:color-mix(in srgb,var(--ink-inv) 14%,transparent)}
.fl-undo[disabled]{opacity:.6;cursor:default}

/* ===== module: stockroom ===== */
/* ============================================================
   Stockroom view — live pick queue (prefix sr-)
   iPad landscape first; segmented board under ~700px container width.
   ============================================================ */
.view-stockroom,.sr-dr{
  --sr-lane:color-mix(in srgb,var(--surface-2) 62%,var(--bg));
  --sr-card:var(--surface);
  --sr-well:var(--surface-2);
  --sr-thumb:var(--surface-2);
  --sr-track:color-mix(in srgb,var(--ink) 7%,transparent);
}
:root[data-theme="dark"] .view-stockroom,:root[data-theme="dark"] .sr-dr{
  --sr-lane:color-mix(in srgb,var(--surface) 40%,var(--bg));
  --sr-card:var(--surface-2);
  --sr-well:color-mix(in srgb,var(--bg) 72%,var(--surface));
  --sr-thumb:color-mix(in srgb,var(--ink) 17%,var(--surface-2));
  --sr-track:color-mix(in srgb,var(--ink) 10%,transparent);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .view-stockroom,:root:not([data-theme="light"]) .sr-dr{
    --sr-lane:color-mix(in srgb,var(--surface) 40%,var(--bg));
    --sr-card:var(--surface-2);
    --sr-well:color-mix(in srgb,var(--bg) 72%,var(--surface));
    --sr-thumb:color-mix(in srgb,var(--ink) 17%,var(--surface-2));
    --sr-track:color-mix(in srgb,var(--ink) 10%,transparent);
  }
}
.view-stockroom{container:sr / inline-size}
.view-stockroom [hidden],.sr-dr [hidden]{display:none!important}
.sr-wrap{display:flex;flex-direction:column;gap:18px;max-width:1440px;margin:0 auto;min-width:0}

/* ---------- banner + head ---------- */
.sr-banner{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;color:var(--ink-2);font-size:13.5px}
.sr-banner p{flex:1;min-width:0}
.sr-banner svg{flex:none;color:var(--ink-3)}
.sr-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sr-me{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.sr-me-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.sr-me-t b{font-size:17px;font-weight:600;letter-spacing:-.005em}
.sr-me-sub{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-me-t .eyebrow{font-size:10.5px;margin-bottom:2px}
.view-stockroom .sr-route{height:auto;min-height:58px;padding:8px 9px 8px 18px;gap:12px;text-align:left;white-space:normal}
.sr-route-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.sr-route-t b{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.sr-route-t small{font-size:12px;opacity:.72;font-weight:400}
.sr-route-n{min-width:40px;height:40px;padding:0 8px;border-radius:var(--r-pill);display:grid;place-items:center;background:color-mix(in srgb,var(--accent-ink) 16%,transparent);font-size:15px;margin-left:4px}

/* ---------- stats strip ---------- */
.sr-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);overflow:hidden}
.sr-stat{display:flex;flex-direction:column;gap:7px;padding:16px 18px 15px;background:var(--surface);min-width:0}
.sr-stat-l{font-family:var(--f-display);font-size:10.5px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-stockroom .sr-stat-v{font-family:var(--f-display);font-weight:300;font-size:36px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);transition:color .3s}
.view-stockroom .sr-stat-v.mono{font-family:var(--f-mono);font-weight:400;font-size:30px;letter-spacing:-.03em;padding-top:3px}
.sr-stat-c{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-stat[data-urg="warn"] .sr-stat-v,.sr-stat[data-urg="warn"] .sr-stat-c{color:var(--s-pick)}
.sr-stat[data-urg="late"] .sr-stat-v,.sr-stat[data-urg="late"] .sr-stat-c{color:var(--s-new)}

/* ---------- phone segmented control ---------- */
.view-stockroom .sr-seg{display:none;width:100%}
.view-stockroom .sr-seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 6px;font-size:13.5px;white-space:nowrap;min-width:0}
.sr-seg-n{min-width:22px;height:20px;padding:0 6px;border-radius:var(--r-pill);display:inline-grid;place-items:center;font-size:11.5px;background:var(--surface-3);color:var(--ink-2)}
.sr-seg button[aria-pressed="true"] .sr-seg-n{background:var(--ink);color:var(--ink-inv)}

/* ---------- board ---------- */
.sr-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.sr-col{background:var(--sr-lane);border:1px solid var(--line);border-radius:var(--r-3);padding:10px;min-width:0;min-height:240px}
.sr-col-h{display:flex;align-items:center;gap:10px;padding:6px 6px 12px;min-width:0}
.sr-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.sr-dot[data-s="new"]{background:var(--s-new)}
.sr-dot[data-s="picking"]{background:var(--s-pick)}
.sr-dot[data-s="sent"]{background:var(--s-sent)}
.sr-col-t{font-family:var(--f-display);font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.sr-col-n{min-width:28px;height:24px;padding:0 8px;border-radius:var(--r-pill);display:inline-grid;place-items:center;font-size:13px;background:var(--sr-card);border:1px solid var(--line);color:var(--ink)}
.sr-col-sub{margin-left:auto;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sr-bump{animation:sr-bump .7s var(--ease)}
@keyframes sr-bump{0%{transform:scale(1)}30%{transform:scale(1.32);background:var(--ink);color:var(--ink-inv);border-color:var(--ink)}100%{transform:scale(1)}}
.sr-col-body{display:flex;flex-direction:column;gap:10px}
.sr-empty{display:grid;justify-items:center;gap:10px;padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.45}
.sr-empty svg{width:22px;height:22px}

/* ---------- request card ---------- */
.sr-card{position:relative;display:flex;flex-direction:column;gap:12px;padding:17px 14px 14px;background:var(--sr-card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-1);overflow:hidden;min-width:0}
.sr-card[data-mine="1"]{border-color:var(--line-strong)}
.sr-urg{position:absolute;left:0;right:0;top:0;height:4px;background:var(--sr-track)}
.sr-urg i{display:block;height:100%;width:0;background:var(--ink-3);border-radius:0 4px 4px 0;transition:width 1s linear,background-color .4s}
.sr-card[data-urg="warn"] .sr-urg i{background:var(--s-pick)}
.sr-card[data-urg="late"] .sr-urg i{background:var(--s-new)}

.sr-c-top{display:flex;align-items:center;gap:8px;min-height:22px;min-width:0}
.sr-rid{font-size:12px;color:var(--ink-3);white-space:nowrap;flex:none}
.sr-wait{gap:5px;height:22px;padding:0 8px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sr-wait svg{flex:none}
.sr-yours{font-family:var(--f-display);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);padding:3px 7px;border:1px solid var(--line-strong);border-radius:var(--r-pill)}
.sr-age-w{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--ink-3);white-space:nowrap}
.sr-age{font-size:17px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr-card[data-urg="warn"] .sr-age,.sr-card[data-urg="warn"] .sr-age-w{color:var(--s-pick)}
.sr-card[data-urg="late"] .sr-age,.sr-card[data-urg="late"] .sr-age-w{color:var(--s-new)}

.sr-c-main{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center}
.view-stockroom .sr-thumb,.sr-dr .sr-thumb{width:62px;height:74px;background:var(--sr-thumb);border-radius:10px}
.view-stockroom .sr-sup svg,.sr-dr .sr-sup svg{width:30px;height:30px;color:var(--ink-2)}
.sr-what{min-width:0}
.sr-name{font-size:13px;font-weight:500;color:var(--ink-2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr-color{display:flex;align-items:center;gap:8px;margin-top:5px;font-family:var(--f-display);font-size:18px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;line-height:1.12;color:var(--ink)}
.sr-color .swatch{width:15px;height:15px;flex:none}
.sr-qty{margin-top:5px;font-size:12px;color:var(--ink-3)}
.sr-qty b{font-weight:600;color:var(--ink-2)}
.sr-qty.is-multi b{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--ink);color:var(--ink-inv);font-size:12px}
.sr-size{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:56px;height:64px;padding:0 8px;border:1.5px solid var(--ink);border-radius:12px;color:var(--ink)}
.sr-size span{font-family:var(--f-display);font-size:9.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.sr-size b{font-family:var(--f-display);font-size:25px;font-weight:500;line-height:1;letter-spacing:.01em;white-space:nowrap}

.sr-bin{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:2px 10px;padding:10px 14px 11px;border-radius:10px;background:var(--sr-well)}
.sr-bin-l{font-family:var(--f-display);font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
.sr-bin-n{justify-self:end;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.sr-bin-n[data-lvl="low"]{color:var(--s-pick);font-weight:600}
.sr-bin-n[data-lvl="out"]{color:var(--s-new);font-weight:600}
.sr-bin-v{grid-column:1 / -1;font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.1;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.sr-bin-sup .sr-bin-v{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}

.sr-dest{display:flex;align-items:center;gap:7px;font-size:14px;min-width:0;color:var(--ink)}
.sr-dest > svg{flex:none;color:var(--ink-3)}
.sr-dest b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sr-dest-sup{font-size:13px}
.sr-by{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12.5px;white-space:nowrap;flex:none}
.sr-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--ink-2);padding:9px 11px;border-radius:10px;border:1px dashed var(--line-strong)}
.sr-note svg{flex:none;margin-top:2px;color:var(--ink-3)}

.sr-acts{display:flex;gap:8px}
.sr-grow{flex:1;min-width:0}
.view-stockroom .sr-btn{height:50px;font-size:15px;font-weight:600;letter-spacing:.01em}
.view-stockroom .sr-cant{padding:0 14px;background:transparent}
.sr-owner{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);min-width:0}
.sr-owner-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-owner-t b{color:var(--ink);font-weight:600}
.sr-owner-s{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.sr-card[data-status="sent"] .sr-thumb{height:62px}
.sr-card[data-status="sent"] .sr-bin-v{font-size:21px}
/* narrow cards (iPad landscape three-up) */
.sr-card{container:srcard / inline-size}
@container srcard (max-width:290px){
  .sr-c-main{grid-template-columns:52px minmax(0,1fr) auto;gap:10px}
  .view-stockroom .sr-thumb{width:52px;height:64px}
  .sr-card[data-status="sent"] .sr-thumb{height:56px}
  .sr-color{font-size:15.5px;letter-spacing:.045em;gap:6px}
  .sr-color .swatch{width:13px;height:13px}
  .sr-size{min-width:48px;height:58px;padding:0 6px}
  .sr-size b{font-size:22px}
  .sr-bin{padding:9px 12px 10px}
  .sr-bin-v{font-size:24px}
  .sr-wait{padding:0 7px;font-size:10.5px}
  .sr-age{font-size:16px}
}

/* arrival + action feedback */
.sr-arrive{animation:sr-in .6s var(--ease) both,sr-ring 2.8s ease-out .15s both}
@keyframes sr-in{from{opacity:0;transform:translateY(-16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sr-ring{
  0%{box-shadow:0 0 0 0 transparent,var(--shadow-1)}
  10%{box-shadow:0 0 0 2px var(--ink),0 0 0 10px color-mix(in srgb,var(--ink) 12%,transparent)}
  65%{box-shadow:0 0 0 2px var(--ink),0 0 0 4px color-mix(in srgb,var(--ink) 6%,transparent)}
  100%{box-shadow:0 0 0 0 transparent,var(--shadow-1)}
}
.sr-landed{animation:sr-land 1.1s var(--ease)}
@keyframes sr-land{0%{box-shadow:0 0 0 2px var(--focus);transform:scale(.985)}25%{transform:none}100%{box-shadow:0 0 0 0 transparent,var(--shadow-1)}}

/* ---------- completed today ---------- */
.sr-done{overflow:hidden}
.sr-done-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;text-align:left}
.sr-done-h:hover{background:var(--surface-2)}
.sr-done-ttl{font-family:var(--f-display);font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.sr-done-n{font-size:12.5px}
.sr-done-h svg{margin-left:auto;color:var(--ink-3);transition:transform .2s var(--ease)}
.sr-done-h[aria-expanded="false"] svg{transform:rotate(-90deg)}
.sr-done-list{list-style:none;margin:0;padding:0}
.sr-done-row{display:grid;grid-template-columns:34px minmax(0,1.3fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 18px;border-top:1px solid var(--line);min-width:0}
.view-stockroom .sr-done-th{width:34px;height:40px;border-radius:8px;background:var(--sr-thumb)}
.view-stockroom .sr-done-th.sr-sup svg{width:18px;height:18px}
.sr-done-t{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.sr-done-t b,.sr-done-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-done-t b{font-size:13.5px;font-weight:500}
.sr-done-t span{font-size:12px;color:var(--ink-3)}
.sr-done-run{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;color:var(--ink-2)}
.sr-done-run span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-done-end{display:flex;align-items:center;gap:12px;justify-content:flex-end}
.sr-done-tm{font-size:12px;color:var(--ink-3);min-width:62px;text-align:right}
.sr-done-none{padding:16px 18px;border-top:1px solid var(--line);font-size:13px}

/* ---------- drawers (rendered in #overlay-root) ---------- */
.sr-dr{display:flex;flex-direction:column;gap:22px}
.sr-dr-foot{display:flex;gap:10px;width:100%}
.sr-dr-foot .btn{height:48px}
.sr-dr-item{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:center}
.sr-dr-meta{font-size:12.5px;margin-top:4px}
.sr-dr-count{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sr-dr-count > div,.sr-rt-sum > div{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:var(--surface);min-width:0}
.sr-k-l{font-family:var(--f-display);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.sr-k-v{font-family:var(--f-mono);font-size:26px;line-height:1.1;color:var(--ink);white-space:nowrap}
.sr-k-bin{font-size:19px;padding-top:5px}
.sr-k-c{font-size:12px;color:var(--ink-3)}
.sr-dr-sec{display:flex;flex-direction:column;gap:10px}
.sr-dr-h{font-family:var(--f-display);font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.sr-dr-p{font-size:13px;margin-top:-4px}
.sr-opts{display:flex;flex-direction:column;gap:8px}
.sr-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;transition:border-color .15s,box-shadow .15s}
.sr-opt:hover{border-color:var(--line-strong)}
.sr-opt[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sr-radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center}
.sr-radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .15s var(--ease)}
.sr-opt[aria-checked="true"] .sr-radio{border-color:var(--ink)}
.sr-opt[aria-checked="true"] .sr-radio::after{transform:scale(1)}
.sr-opt-t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.sr-opt-t b{font-size:14px;font-weight:600}
.sr-opt-t span{font-size:12.5px;color:var(--ink-3)}
.sr-dr .sr-opt-th{width:38px;height:46px;border-radius:8px;background:var(--sr-thumb)}
.sr-opt-bin{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.sr-opt-bin .mono{font-size:14px;color:var(--ink)}

/* pick route */
.sr-rt-lede{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.sr-rt-lede b{color:var(--ink);font-weight:600}
.sr-rt-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sr-rt-sum .sr-k-l{white-space:normal;line-height:1.3}
.sr-rt-claimed{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--s-pick-bg);color:var(--s-pick);font-size:13px;font-weight:500}
.sr-rt-claimed svg{flex:none}
.sr-rt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;position:relative}
.sr-rt-list::before{content:"";position:absolute;left:23px;top:14px;bottom:14px;width:2px;background:var(--line)}
.sr-rt-mark,.sr-rt-zone{position:relative;display:flex;align-items:center;gap:12px;padding:4px 0 4px 12px;font-size:12.5px;color:var(--ink-3)}
.sr-rt-mark svg{flex:none;width:24px;height:24px;padding:4px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.sr-rt-zone{padding-top:10px;font-family:var(--f-display);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.sr-rt-zl{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--ink);color:var(--ink-inv);font-size:12.5px;letter-spacing:0;flex:none}
.sr-rt-li{position:relative}
.sr-rt-stop{display:grid;grid-template-columns:24px 40px minmax(0,1fr) 30px;gap:12px;align-items:center;padding:12px 12px 12px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s,opacity .15s}
.sr-rt-stop:hover{border-color:var(--line-strong)}
.sr-rt-stop:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.sr-rt-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);position:relative}
.sr-dr .sr-rt-th{width:40px;height:48px;border-radius:8px;background:var(--sr-thumb)}
.sr-rt-info{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.sr-rt-bin{font-size:20px;font-weight:500;color:var(--ink);line-height:1.15}
.sr-rt-what{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-rt-cs{font-family:var(--f-display);font-size:13.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.sr-rt-to{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.sr-rt-wait{margin-left:4px;padding:1px 7px;border-radius:var(--r-pill);background:var(--s-new-bg);color:var(--s-new);font-size:11px;font-weight:600}
.sr-rt-box{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s,color .15s}
.sr-rt-stop.is-done{background:var(--surface-2);border-color:var(--line)}
.sr-rt-stop.is-done .sr-rt-box{background:var(--ink);border-color:var(--ink);color:var(--ink-inv)}
.sr-rt-stop.is-done .sr-rt-n{background:var(--ink);color:var(--ink-inv)}
.sr-rt-stop.is-done .sr-rt-bin{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}

/* ---------- responsive (container = the view section) ---------- */
@container sr (max-width:940px){
  .sr-stat{padding:14px 14px 13px}
  .view-stockroom .sr-stat-v{font-size:31px}
  .view-stockroom .sr-stat-v.mono{font-size:26px}
  .sr-col-sub{display:none}
}
@container sr (max-width:700px){
  .sr-wrap{gap:14px}
  .sr-head{gap:12px}
  .view-stockroom .sr-route{width:100%;justify-content:flex-start}
  .sr-route-n{margin-left:auto}
  .sr-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sr-stat{padding:12px 12px 11px;gap:5px}
  .sr-stat:last-child{grid-column:span 2}
  .sr-stat-l{font-size:9.5px;letter-spacing:.1em;white-space:normal;line-height:1.25;min-height:2.5em}
  .view-stockroom .sr-stat-v{font-size:26px}
  .view-stockroom .sr-stat-v.mono{font-size:22px}
