name: Upscale & optimize photos

# Downloads every photo the site uses, AI-upscales the small ones (Real-ESRGAN, CPU), writes WebP
# variants to assets/photos/ and commits them back to the branch. Work is split across 6 runners.
on:
  push:
    branches: [claude/brave-euler-d31dm2]
    paths: [scripts/photos.py, .github/workflows/photos.yml]

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: true

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch + Real-ESRGAN loader
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install spandrel pillow numpy
      - name: Download, upscale and convert
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 6
        run: python scripts/photos.py
      - uses: actions/upload-artifact@v4
        with:
          name: photos-${{ matrix.shard }}
          path: assets/photos/

  commit:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: photos-*
          path: assets/photos/
          merge-multiple: true
      - name: Merge manifests
        run: |
          pip install pillow numpy
          python scripts/photos.py merge
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add upscaled, optimized site photos (Real-ESRGAN)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
