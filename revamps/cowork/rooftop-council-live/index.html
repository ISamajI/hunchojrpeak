<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rooftop Council Live</title>
<meta name="theme-color" content="#0d0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rooftop Council">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0d0a14; --panel:rgba(16,12,24,.72); --solid:#171120; --line:rgba(242,166,90,.18);
  --text:#f4ead8; --dim:#a79cb4; --amber:#f2a65a; --gold:#ffcf6b; --busy:#6fc3ff; --warn:#ffcf6b; --hot:#ff6b7d;
  --disp:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --lft:env(safe-area-inset-left,0px); --rgt:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2;contain:strict}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;
  font:500 10.5px/1 var(--mono);color:var(--text);background:rgba(13,10,20,.66);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);
  border-left:3px solid var(--c);padding:4px 7px 4px 6px;border-radius:3px;display:flex;gap:6px;
  align-items:center;transition:opacity .25s,background .2s;will-change:transform}
.tag.branch{font:400 11.5px/1 var(--disp);letter-spacing:.04em;padding:5px 9px}
.tag .dot,.dotc{width:6px;height:6px;border-radius:50%;background:#675d75;flex:none}
.dot.on,.dotc.on{background:var(--busy);box-shadow:0 0 8px var(--busy);animation:pulse 1.6s infinite}
.dot.wait,.dotc.wait{background:var(--warn);box-shadow:0 0 7px var(--warn)}
@keyframes pulse{50%{opacity:.45}}
.tag.sel{background:var(--c);color:#120d1a;border-color:var(--c)}
.tag.sel .dot{background:#120d1a!important;box-shadow:none}

.hud{position:fixed;z-index:5;transition:opacity .45s ease}
body.clean .hud:not(.keep),body.clean #tags{opacity:0;pointer-events:none}
.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;font:500 11.5px/1 var(--mono);cursor:pointer;-webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--amber);color:var(--gold)}
.btn.on{background:var(--amber);color:#17100a;border-color:var(--amber);font-weight:600}
.btn:focus-visible,.tag:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button,select,input{font:inherit}

.plaque{top:calc(14px + var(--top));left:calc(14px + var(--lft));background:var(--panel);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:9px;padding:12px 15px;max-width:min(340px,calc(100vw - 28px))}
.plaque h1{margin:0;font:400 20px/1 var(--disp);letter-spacing:.07em;color:var(--gold)}
.plaque .sub{margin-top:7px;font:11px/1.45 var(--mono);color:var(--dim)}
.stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.chip{font:500 10.5px/1 var(--mono);padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);font-variant-numeric:tabular-nums}
.chip b{color:var(--gold);font-weight:600}

.views{top:calc(14px + var(--top));right:calc(14px + var(--rgt));display:flex;gap:6px;flex-wrap:wrap;
  justify-content:flex-end;max-width:min(330px,calc(100vw - 28px))}

.feed{right:calc(14px + var(--rgt));top:calc(104px + var(--top));width:296px;background:var(--panel);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:9px;display:flex;flex-direction:column;max-height:38vh;overflow:hidden}
.feed header{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.feed h2{margin:0;font:400 12px/1 var(--disp);letter-spacing:.09em;color:var(--amber)}
.feed ol{list-style:none;margin:0;padding:6px 0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.feed li{display:grid;grid-template-columns:38px 1fr;gap:6px;padding:5px 12px;font-size:12.5px;
  line-height:1.38;animation:slide .4s ease}
.feed li time{font:10px/1.7 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.feed li b{color:var(--c);font-weight:700}
.feed li.done{background:linear-gradient(90deg,rgba(255,207,107,.1),transparent)}
.feed.closed ol{display:none}
@keyframes slide{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

.send{left:calc(14px + var(--lft));bottom:calc(14px + var(--bot));background:var(--panel);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:9px;padding:11px;display:flex;gap:6px;flex-wrap:wrap;width:min(430px,calc(100vw - 28px))}
.send label{width:100%;font:400 11px/1 var(--disp);letter-spacing:.09em;color:var(--amber)}
.send select,.send input{background:var(--solid);color:var(--text);border:1px solid rgba(255,255,255,.13);
  border-radius:5px;padding:9px;font-size:13px;min-width:0}
.send select{flex:0 0 122px}.send input{flex:1 1 150px}

.card{right:calc(14px + var(--rgt));bottom:calc(14px + var(--bot));width:296px;background:var(--solid);
  border:1px solid var(--line);border-top:3px solid var(--c);border-radius:9px;padding:15px;
  box-shadow:0 18px 50px rgba(0,0,0,.5)}
.card h3{margin:0;font:400 19px/1.12 var(--disp);letter-spacing:.03em}
.card .role{font:11px/1.45 var(--mono);color:var(--dim);margin-top:5px}
.card .status{display:inline-flex;margin-top:11px;gap:7px;align-items:center;font:500 11.5px/1 var(--mono);
  padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06)}
.card .task{margin:11px 0 0;font-size:14px;line-height:1.45}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.card .x{position:absolute;top:9px;right:10px;background:none;border:0;color:var(--dim);font-size:21px;
  cursor:pointer;line-height:1;padding:2px 6px}
.note{font:10px/1.45 var(--mono);color:var(--dim);margin-top:9px}

.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:4;pointer-events:none;
  transition:height .7s cubic-bezier(.22,.7,.2,1)}
.bar.t{top:0}.bar.b{bottom:0}
body.director .bar{height:6vh}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4;transition:opacity .3s}
.lower{left:50%;transform:translateX(-50%);bottom:calc(7.4vh + var(--bot));text-align:center;
  pointer-events:none;opacity:0;width:min(600px,calc(100vw - 28px));transition:opacity .4s}
body.director .lower{opacity:1}
.lower .eye{font:600 10px/1 var(--mono);letter-spacing:.2em;color:var(--gold);text-transform:uppercase;
  display:inline-flex;gap:8px;align-items:center}
.lower .eye i{width:7px;height:7px;border-radius:50%;background:#ff4457;box-shadow:0 0 10px #ff4457;animation:rec 1.5s infinite}
@keyframes rec{50%{opacity:.2}}
.lower .who{font:400 clamp(19px,3.1vw,30px)/1.1 var(--disp);letter-spacing:.04em;margin-top:7px;
  text-shadow:0 3px 22px rgba(0,0,0,.75)}
.lower .what{font:500 13.5px/1.42 var(--body);color:#e9ddc9;margin-top:5px;text-shadow:0 2px 12px rgba(0,0,0,.85)}
body.director .send{opacity:0;pointer-events:none}
body.director .card,body.director .feed{opacity:0;pointer-events:none}

#loader{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 62%,#2b1c36 0%,#0a0810 72%);
  display:grid;place-items:center;transition:opacity 1s ease}
#loader .in{text-align:center;padding:0 24px}
#loader h2{margin:0;font:400 clamp(22px,5vw,30px)/1 var(--disp);letter-spacing:.14em;color:var(--gold)}
#loader .tag2{font:500 10px/1 var(--mono);letter-spacing:.3em;color:var(--dim);margin-top:10px;text-transform:uppercase}
#loader p{font:12px/1.5 var(--mono);color:var(--dim);margin:20px 0 0;min-height:18px}
#loader .track{width:min(240px,70vw);height:2px;background:rgba(255,255,255,.1);margin:14px auto 0;border-radius:2px;overflow:hidden}
#loader .track span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--gold));transition:width .35s ease}
#err{position:fixed;left:14px;right:14px;top:calc(12px + var(--top));z-index:30;background:#54141f;color:#fff;
  font:11.5px/1.45 var(--mono);padding:10px 12px;border-radius:6px}
#toast{position:fixed;left:50%;top:calc(16px + var(--top));transform:translateX(-50%);z-index:9;
  background:var(--solid);border:1px solid var(--line);padding:9px 13px;border-radius:6px;
  font:11.5px/1.3 var(--mono);opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100vw - 28px)}
#install{left:50%;transform:translateX(-50%);bottom:calc(14px + var(--bot));display:none}

@media (max-width:820px){
  .plaque{padding:9px 12px;border-radius:8px}
  .plaque h1{font-size:15px}.plaque .sub{font-size:10px}.plaque .note{display:none}
  .plaque .stats{gap:4px}.chip{font-size:9.5px;padding:5px 7px}
  .views{top:auto;bottom:calc(118px + var(--bot));left:calc(14px + var(--lft));right:calc(14px + var(--rgt));
    max-width:none;justify-content:flex-start}
  .feed{top:auto;bottom:calc(164px + var(--bot));left:calc(14px + var(--lft));right:calc(14px + var(--rgt));
    width:auto;max-height:24vh}
  .card{left:calc(14px + var(--lft));right:calc(14px + var(--rgt));width:auto;z-index:7}
  .send{width:auto;right:calc(14px + var(--rgt))}
  .tag.sub{display:none}
  body.director .views{bottom:calc(7.4vh + 10px + var(--bot))}
  body.director .lower{bottom:calc(7.4vh + 54px + var(--bot))}
}
@media (prefers-reduced-motion:reduce){
  .feed li{animation:none}.bar{transition:none}.dot.on,.dotc.on{animation:none}.lower .eye i{animation:none}
}
</style>

<div id="stage"></div>
<div id="tags"></div>
<div class="bar t"></div><div class="bar b"></div>
<div id="fade"></div>
<div id="toast" role="status"></div>
<div id="err" hidden></div>

<div id="loader"><div class="in">
  <h2>ROOFTOP COUNCIL</h2>
  <div class="tag2">Akamaru Field HQ</div>
  <p id="loadMsg">Waking the village…</p>
  <div class="track"><span id="loadBar"></span></div>
</div></div>

<section class="hud plaque" aria-label="Headquarters status">
  <h1>ROOFTOP COUNCIL</h1>
  <div class="sub"><span id="clock">--:--</span> · 8 branches · 24 subagents · <span id="skyLabel">live sky</span></div>
  <div class="stats">
    <span class="chip">working <b id="sWork">0</b></span>
    <span class="chip">in flight <b id="sFly">0</b></span>
    <span class="chip">shipped <b id="sShip">0</b></span>
  </div>
  <div class="note">Simulated shifts for your Akamaru roster. Tap any agent.</div>
</section>

<nav class="hud views keep" aria-label="Camera and scene controls">
  <button class="btn on" id="dirBtn">Director</button>
  <button class="btn" data-view="village">Village</button>
  <button class="btn" data-view="roof">Roof</button>
  <button class="btn" data-view="cliff">Cliff</button>
  <button class="btn" id="skyBtn">Sky: Live</button>
  <button class="btn" id="qualBtn">Quality</button>
  <button class="btn" id="cleanBtn">Hide UI</button>
</nav>

<aside class="hud feed" id="feed">
  <header><h2>MISSION LOG</h2><button class="btn" id="feedBtn" style="padding:5px 9px">Hide</button></header>
  <ol id="log"></ol>
</aside>

<form class="hud send" id="sendForm" autocomplete="off">
  <label for="taskText">SEND A MISSION</label>
  <select id="taskBranch" aria-label="Which branch"></select>
  <input id="taskText" placeholder="e.g. Draft a pitch for Redline Auto" maxlength="80">
  <button class="btn on" type="submit">Send</button>
</form>

<button class="hud btn on keep" id="install">Install app</button>
<div class="hud card" id="card" hidden></div>
<div class="hud lower" id="lower">
  <div class="eye"><i></i><span id="lEye">LIVE</span></div>
  <div class="who" id="lWho"></div>
  <div class="what" id="lWhat"></div>
</div>

   Three.js r128, global THREE, no modules, no external images.
   Public surface: buildTextures(THREE)  +  helpers prefixed TEX_
   ========================================================================== */

/* ---------------------------------------------------------------- utilities */

function TEX_canvas(w, h) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function TEX_clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

function TEX_ss(e0, e1, x) {            // smoothstep
  var t = (x - e0) / (e1 - e0);
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  return t * t * (3 - 2 * t);
}

/* deterministic 0..1 stream, xorshift32 */
function TEX_rng(seed) {
  var s = (seed | 0) || 0x9e3779b9;
  return function () {
    s ^= s << 13; s |= 0;
    s ^= s >>> 17;
    s ^= s << 5; s |= 0;
    return (s >>> 8) / 16777216;
  };
}

/* integer lattice hash (imul keeps everything in int32 range) */
function TEX_hashi(ix, iy, seed) {
  var h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(seed | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return h >>> 0;
}
function TEX_hash2(ix, iy, seed) { return TEX_hashi(ix, iy, seed) * 2.3283064365386963e-10; }

/* PERIODIC value noise. x,y are lattice coords; the lattice wraps at exactly
   (px,py), so calling pnoise(u*px, v*py, px, py) over u,v in [0,1) is seamless. */
function TEX_pnoise(x, y, px, py, seed) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var x0 = xi % px; if (x0 < 0) x0 += px;
  var y0 = yi % py; if (y0 < 0) y0 += py;
  var x1 = x0 + 1; if (x1 >= px) x1 = 0;
  var y1 = y0 + 1; if (y1 >= py) y1 = 0;
  var u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
  var v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  var a = TEX_hash2(x0, y0, seed), b = TEX_hash2(x1, y0, seed);
  var c = TEX_hash2(x0, y1, seed), e = TEX_hash2(x1, y1, seed);
  var ab = a + (b - a) * u, ce = c + (e - c) * u;
  return ab + (ce - ab) * v;
}

/* anisotropic periodic fbm: every octave doubles BOTH frequency and period,
   so the whole stack still wraps at u,v = 1. Integer freqs only. */
function TEX_pfbm2(u, v, fx, fy, oct, seed, gain) {
  var amp = 1, sum = 0, nrm = 0, ax = fx, ay = fy;
  for (var o = 0; o < oct; o++) {
    sum += amp * TEX_pnoise(u * ax, v * ay, ax, ay, seed + o * 1013);
    nrm += amp; amp *= gain; ax *= 2; ay *= 2;

  return sum / nrm;

function TEX_pfbm(u, v, f, oct, seed) { return TEX_pfbm2(u, v, f, f, oct, seed, 0.5); }

/* Low-frequency fbm layers are cached on a coarse NxN grid and resampled with
   a wrapped, smoothstepped bilinear fetch: visually identical for base freq
   <= 8 while costing a fraction of a full per-pixel fbm. C1 continuous, so it
   leaves no grid creases in height fields derived from it. */
function TEX_fbmGrid(N, f, oct, seed) {
  var g = new Float32Array(N * N), inv = 1 / N;
  for (var j = 0; j < N; j++) {
    for (var i = 0; i < N; i++) g[j * N + i] = TEX_pfbm(i * inv, j * inv, f, oct, seed);

}
function TEX_grid(g, N, u, v) {
  var x = u * N, y = v * N;
  var xi = x | 0, yi = y | 0;
  var fx = x - xi, fy = y - yi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  var x1 = xi + 1; if (x1 >= N) x1 = 0;
  var y1 = yi + 1; if (y1 >= N) y1 = 0;
  var r0 = yi * N, r1 = y1 * N;
  var a = g[r0 + xi], b = g[r0 + x1], c = g[r1 + xi], e = g[r1 + x1];

  return t + (w - t) * fy;
}

/* PERIODIC worley. x,y in cell units [0,cells); out = [F1,F2,cellId,fx,fy]. */
var TEX_WOUT = [0, 0, 0, 0, 0];
function TEX_worley(x, y, cells, seed, out) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var f1 = 1e9, f2 = 1e9, id = 0, bx = 0, by = 0;
  for (var j = -1; j <= 1; j++) {
    for (var i = -1; i <= 1; i++) {
      var gx = xi + i, gy = yi + j;
      var wx = gx % cells; if (wx < 0) wx += cells;
      var wy = gy % cells; if (wy < 0) wy += cells;

      var fxp = gx + 0.13 + 0.74 * ((hh & 0xffff) * 1.52587890625e-5);
      var fyp = gy + 0.13 + 0.74 * ((hh >>> 16) * 1.52587890625e-5);
      var dx = fxp - x, dy = fyp - y;
      var dd = Math.sqrt(dx * dx + dy * dy);
      if (dd < f1) { f2 = f1; f1 = dd; id = wy * cells + wx; bx = fxp; by = fyp; }
      else if (dd < f2) { f2 = dd; }

  out[0] = f1; out[1] = f2; out[2] = id; out[3] = bx; out[4] = by;
}

/* interleaved-gradient dither in [-0.5,0.5], added to 8-bit values to kill banding */
function TEX_dither(i, j) {
  var t = i * 0.06711056 + j * 0.00583715;
  t = 52.9829189 * (t - Math.floor(t));
  return (t - Math.floor(t)) - 0.5;
}

/* height field (0..1) -> greyscale bump canvas, real-world range, never 0/255 */
function TEX_bumpCanvas(h, W, H) {
  var cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  for (var j = 0; j < H; j++) {
    for (var i = 0; i < W; i++) {
      var idx = j * W + i, p = idx * 4;
      var v = h[idx]; v = v < 0 ? 0 : (v > 1 ? 1 : v);
      var g = 13 + v * 229 + TEX_dither(i, j) * 1.2;
      d[p] = g; d[p + 1] = g; d[p + 2] = g; d[p + 3] = 255;

  ctx.putImageData(img, 0, 0);
  return cv;
}

/* height field -> tangent-space normal map canvas (GL green-up).
   Image row j grows downward while V grows upward, so ny = +dh/dj. Wrapped
   central differences keep the normal map as seamless as the height. */
function TEX_normalCanvas(h, W, H, strength) {
  var cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  for (var j = 0; j < H; j++) {
    var jm = (j - 1 + H) % H, jp = (j + 1) % H;
    var row = j * W, rm = jm * W, rp = jp * W;
    for (var i = 0; i < W; i++) {
      var im = (i - 1 + W) % W, ip = (i + 1) % W;
      var dx = (h[row + ip] - h[row + im]) * strength;
      var dy = (h[rp + i] - h[rm + i]) * strength;
      var nx = -dx, ny = dy;
      var inv = 1 / Math.sqrt(nx * nx + ny * ny + 1);
      var p = (row + i) * 4;
      d[p] = (nx * inv * 0.5 + 0.5) * 255 + TEX_dither(i, j);
      d[p + 1] = (ny * inv * 0.5 + 0.5) * 255 + TEX_dither(i, j);
      d[p + 2] = (inv * 0.5 + 0.5) * 255;
      d[p + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/* canvas -> configured THREE.Texture. srgb only for colour data. */
function TEX_mkTex(THREE, canvas, srgb) {
  var t = new THREE.CanvasTexture(canvas);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.anisotropy = 8;
  if (srgb && THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  if (!t.userData) t.userData = {};
  t.userData.size = (canvas.width === canvas.height) ? canvas.width : (canvas.width + 'x' + canvas.height);
  t.needsUpdate = true;
  return t;
}

/* ------------------------------------------------------------- 1. plaster */
/* Shikkui lime wall: warm off-white, trowel mottling, downward rain staining
   that strengthens toward the bottom, hairline cracks, dirt at the base. */
function TEX_buildPlaster(THREE) {
  var W = 512, H = 512, cv = TEX_canvas(W, H), ctx = cv.getContext('2d');

  /* hairline cracks drawn into a mask, kept well inside the tile so the
     texture still wraps; sampled per-pixel below for both colour and height */
  var mk = TEX_canvas(W, H), mc = mk.getContext('2d');
  mc.fillStyle = '#000'; mc.fillRect(0, 0, W, H);
  mc.strokeStyle = '#fff'; mc.lineCap = 'round';
  var rnd = TEX_rng(9173);
  for (var k = 0; k < 5; k++) {
    var x = 70 + rnd() * (W - 140), y = 70 + rnd() * (H - 140);
    var ang = (k & 1) ? 1.35 + (rnd() - 0.5) * 0.8 : -0.25 + (rnd() - 0.5) * 0.8;
    mc.lineWidth = 0.7 + rnd() * 0.8;
    mc.beginPath(); mc.moveTo(x, y);
    var segs = 12 + (rnd() * 12 | 0);
    for (var s = 0; s < segs; s++) {
      ang += (rnd() - 0.5) * 0.85;
      var nx2 = x + Math.cos(ang) * (5 + rnd() * 9);
      var ny2 = y + Math.sin(ang) * (5 + rnd() * 9);
      if (nx2 < 26 || nx2 > W - 26 || ny2 < 26 || ny2 > H - 26) break;
      x = nx2; y = ny2; mc.lineTo(x, y);
    }
    mc.stroke();
  }
  var md = mc.getImageData(0, 0, W, H).data;

  var img = ctx.createImageData(W, H), d = img.data;
  var hgt = new Float32Array(W * H);
  var gTrowel = TEX_fbmGrid(128, 5, 3, 311);
  for (var j = 0; j < H; j++) {
    var v = j / H;
    var vb = v * v;                                   // rain bias toward the bottom
    var baseDirt = TEX_ss(0.87, 1.0, v);
    for (var i = 0; i < W; i++) {
      var u = i / W, idx = j * W + i, p = idx * 4;
      var trowel = TEX_grid(gTrowel, 128, u, v) - 0.5; // broad trowel sweeps
      var swirl = TEX_pnoise(u * 13, v * 13, 13, 13, 313) - 0.5;
      var fine = TEX_pnoise(u * 96, v * 96, 96, 96, 733) - 0.5;
      var smask = TEX_pnoise(u * 22, v * 2, 22, 2, 979);
      var onset = TEX_clamp01((v - 0.10 - 0.55 * smask) * 2.2) * vb * 1.6;
      var st = TEX_pnoise(u * 56, v * 4, 56, 4, 977);
      var streak = TEX_clamp01(st * 1.35 - 0.26);
      streak = streak * streak * onset * (0.45 + 0.9 * smask);   // vertical rain stains
      var crack = md[p] * (1 / 255);
      var dirt = baseDirt * (0.5 + 0.5 * TEX_pnoise(u * 18, v * 9, 18, 9, 41));
      var sh = 1 + trowel * 0.10 + swirl * 0.055 + fine * 0.05 - streak * 0.15 - dirt * 0.17 - crack * 0.26;
      var dth = TEX_dither(i, j);
      d[p] = 231 * sh - streak * 12 - dirt * 10 + dth;
      d[p + 1] = 224 * sh - streak * 7 - dirt * 8 + dth;
      d[p + 2] = 207 * sh - streak * 1 - dirt * 1 + dth;
      d[p + 3] = 255;
      hgt[idx] = 0.56 + trowel * 0.30 + swirl * 0.18 + fine * 0.13 - crack * 0.52 - dirt * 0.06;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { map: TEX_mkTex(THREE, cv, true), bumpMap: TEX_mkTex(THREE, TEX_bumpCanvas(hgt, W, H), false) };
}

/* ----------------------------------------------------------- 2. kawara tile */
/* Pantile courses: pan + barrel cross-section, half-barrel row offset, baked
   barrel highlight, overlap shadow under each course, per-tile colour jitter,
   moss settled in the valleys of some tiles, lichen speckle. Hero texture. */
function TEX_buildKawara(THREE, P, seed) {
  var W = 512, H = 512, cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  var hgt = new Float32Array(W * H);
  var ROWS = 6, COLS = 6, PI = Math.PI;
  var loR = P.lo[0], loG = P.lo[1], loB = P.lo[2];
  var dR = P.hi[0] - loR, dG = P.hi[1] - loG, dB = P.hi[2] - loB;
  var kPan = -0.09 * PI / 0.62, kBar = -0.80 * (2 / 0.38);
  var gSoil = TEX_fbmGrid(128, 3, 3, seed + 77);

  for (var j = 0; j < H; j++) {
    var v = j / H;
    var fv = v * ROWS, row = fv | 0, ry = fv - row;
    var off = (row & 1) * 0.5;
    var lap = TEX_ss(0.0, 0.13, ry);                  // 0 = tucked under the course above
    var ao = 0.22 + 0.78 * lap;
    var bq = (ry - 0.955); var butt = Math.exp(-bq * bq * 900) * 0.16;  // lit butt edge
    for (var i = 0; i < W; i++) {
      var u = i / W, idx = j * W + i, p = idx * 4;
      var fu = u * COLS + off, cf = Math.floor(fu), fx = fu - cf;
      var col = cf % COLS; if (col < 0) col += COLS;
      var tid = row * COLS + col;

      var hc, nx;                                     // cross-section + its slope d/dfx
      if (fx < 0.62) {                                // shallow dished pan
        var a = fx * (1 / 0.62);
        hc = 0.22 - 0.09 * Math.sin(PI * a); nx = kPan * Math.cos(PI * a);
      } else {                                        // semicircular barrel
        var cb = (fx - 0.62) * (2 / 0.38) - 1;
        var rt = Math.sqrt(1.0001 - cb * cb);
        hc = 0.22 + 0.80 * rt; nx = kBar * cb / rt;
      }
      var gn = 1 / Math.sqrt(nx * nx + 1);            // Lambert, key light from upper left
      var ndl = (0.62 * nx + 0.78) * gn; if (ndl < 0) ndl = 0;
      var s2 = ndl * ndl, s4 = s2 * s2;
      var spec = s4 * s4 * 0.34;                      // tight sheen along the barrel
      var hao = 0.52 + 0.48 * TEX_clamp01(hc * 1.2);  // valleys sit in their own shadow
      var cq = fx - 0.62; if (cq < 0) cq = -cq;
      var crev = 1 - TEX_ss(0.0, 0.055, cq);          // crevice where pan meets barrel
      var sd = (fx < 0.5 ? fx : 1 - fx) * 22.0;       // lap line between adjacent pantiles
      var seam = sd < 1 ? (1 - sd) * (1 - sd) : 0;

      var jv = TEX_hash2(tid, 11, seed) - 0.5;
      var jh = TEX_hash2(tid, 29, seed) - 0.5;
      var grain = TEX_pnoise(u * 160, v * 160, 160, 160, seed + 3) - 0.5;
      var weath = TEX_pnoise(u * 120, v * 9, 120, 9, seed + 9) - 0.5;
      var soil = TEX_grid(gSoil, 128, u, v) - 0.5;    // large-scale soiling across the roof
      var grime = (1 - TEX_clamp01(hc * 1.3)) * (0.42 + 0.58 * TEX_clamp01(soil * 2 + 0.5));

      var lum = (0.10 + 0.80 * ndl) * hao * (1 + jv * 0.13) * ao
              * (1 - 0.34 * seam) * (1 - 0.26 * crev) * (1 - 0.17 * grime) * (1 + soil * 0.17)
              + spec + butt + weath * 0.06 + grain * 0.05;
      if (lum < 0) lum = 0; else if (lum > 1.15) lum = 1.15;

      var r = loR + dR * lum + jh * 11;
      var g = loG + dG * lum + jh * 4;
      var bl = loB + dB * lum - jh * 10;

      var mt = TEX_hash2(tid, 57, seed), moss = 0;
      if (mt > 0.50) {                                 // moss only on some tiles
        var valley = 1 - TEX_ss(0.30, 0.64, fx);
        var mf = TEX_pfbm(u, v, 20, 2, seed + 21);
        moss = TEX_clamp01((mf - 0.45) * 3.4) * valley * TEX_ss(0.12, 0.70, ry) * ((mt - 0.50) * 2);
        if (moss > 0) {
          var mv = 0.78 + 0.55 * grain;
          r += (74 * mv - r) * moss; g += (94 * mv - g) * moss; bl += (48 * mv - bl) * moss;
        }
      }
      var li = TEX_pnoise(u * 205, v * 205, 205, 205, seed + 33);
      if (li > 0.875) {                                // sparse pale lichen specks
        var lk = (li - 0.875) * 5.2 * TEX_clamp01((TEX_pnoise(u * 7, v * 7, 7, 7, seed + 44) - 0.35) * 2.2);
        r += (164 - r) * lk; g += (168 - g) * lk; bl += (150 - bl) * lk;
      }
      var dth = TEX_dither(i, j);
      d[p] = r + dth; d[p + 1] = g + dth; d[p + 2] = bl + dth; d[p + 3] = 255;
      hgt[idx] = 0.11 + hc * 0.78 * (0.42 + 0.58 * lap) + 0.05 * ry - 0.11 * seam + moss * 0.05 + grain * 0.05;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { map: TEX_mkTex(THREE, cv, true), bumpMap: TEX_mkTex(THREE, TEX_bumpCanvas(hgt, W, H), false) };
}

/* ------------------------------------------------------------- 3. cobble */
/* Plaza paving: periodic worley cells with rounded tops, deep mortar gaps,
   worn pale centres, damp dark patches, gravel grit down in the joints. */
function TEX_buildCobble(THREE) {
  var W = 512, H = 512, cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  var hgt = new Float32Array(W * H);
  var CELLS = 10, o = TEX_WOUT;
  var gWet = TEX_fbmGrid(128, 3, 3, 619), gTraf = TEX_fbmGrid(128, 2, 2, 733);

  for (var j = 0; j < H; j++) {
    var v = j / H;
    for (var i = 0; i < W; i++) {
      var u = i / W, idx = j * W + i, p = idx * 4;
      TEX_worley(u * CELLS, v * CELLS, CELLS, 5501, o);
      var e = o[1] - o[0], id = o[2];
      var m = e < 0.115 ? e * 8.6957 : 1;
      var dome = Math.sqrt(m);                       // rounded stone top
      var gap = 1 - TEX_ss(0.0, 0.045, e);           // 1 deep in the mortar joint
      var wear = m * m * m;                          // worn centre
      var ao = 0.30 + 0.70 * dome;

      var cj = TEX_hash2(id | 0, 3, 5501) - 0.5;
      var cw = TEX_hash2(id | 0, 13, 5501) - 0.5;
      var base = 124 + cj * 36;
      var wet = TEX_clamp01((TEX_grid(gWet, 128, u, v) - 0.46) * 2.6) * 0.26;
      var traffic = TEX_clamp01((TEX_grid(gTraf, 128, u, v) - 0.40) * 2.4);
      var grain = TEX_pnoise(u * 150, v * 150, 150, 150, 811) - 0.5;
      var grit = 0;
      if (gap > 0.25) {
        var gv = TEX_pnoise(u * 270, v * 270, 270, 270, 877);
        if (gv > 0.66) grit = (gv - 0.66) * 2.6 * gap;
      }
      var lit = ao * (1 - wet) + wear * traffic * 0.17 + grain * 0.035 + grit * 0.45;
      var dth = TEX_dither(i, j);
      d[p] = (base + cw * 16) * lit + dth;
      d[p + 1] = (base + cw * 5) * lit + dth;
      d[p + 2] = (base - cw * 11) * lit * 0.98 + dth;
      d[p + 3] = 255;
      hgt[idx] = 0.10 + dome * 0.72 - gap * 0.17 + (TEX_hash2(id | 0, 41, 5501) - 0.5) * 0.07
               + grain * 0.04 + grit * 0.08;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { map: TEX_mkTex(THREE, cv, true), bumpMap: TEX_mkTex(THREE, TEX_bumpCanvas(hgt, W, H), false) };
}

/* ------------------------------------------------- 4/5. wood (dark + light) */
/* Tangential grain: ring coordinate = across-plank position warped by low
   frequency periodic noise, which gives wandering cathedral arches. Plank
   seams every 1/6, optional knots that deflect the surrounding rings. */
function TEX_buildWood(THREE, O) {
  var W = 512, H = 512, cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  var hgt = new Float32Array(W * H);
  var PLANKS = 6, rings = O.rings, sd = O.seed, TAU = Math.PI * 2;
  var eR = O.early[0], eG = O.early[1], eB = O.early[2];
  var lR = O.late[0] - eR, lG = O.late[1] - eG, lB = O.late[2] - eB;
  var knots = O.knots;                                // array of [u,v,amp] or empty

  for (var j = 0; j < H; j++) {
    var v = j / H;
    var pf = v * PLANKS, pi = pf | 0, pv = pf - pi;
    var ps = pi * 0.3713;                             // per-plank grain phase
    var prings = rings * (0.82 + 0.40 * TEX_hash2(pi, 5, sd));   // boards differ in cut
    var sd2 = Math.min(pv, 1 - pv);
    var seam = 1 - TEX_ss(0.0, 0.030, sd2);           // plank joint
    for (var i = 0; i < W; i++) {
      var u = i / W, idx = j * W + i, p = idx * 4;
      var pu = u + ps;
      var big = TEX_pnoise(pu * 3, pv * 2, 3, 2, sd + 1) - 0.5;
      var mid = TEX_pnoise(pu * 9, pv * 4, 9, 4, sd + 2) - 0.5;
      var sml = TEX_pnoise(pu * 28, pv * 9, 28, 9, sd + 3) - 0.5;
      var rc = pv * prings + big * 3.4 + mid * 1.15 + sml * 0.32;

      var knotDark = 0, knotH = 0;
      for (var k = 0; k < knots.length; k++) {
        var kx = u - knots[k][0]; kx -= Math.round(kx);
        var ky = v - knots[k][1]; ky -= Math.round(ky);
        var rr = kx * kx * 2.4 + ky * ky;
        var infl = 0.010 / (0.010 + rr * 1.2);        // rings bulge around the knot
        rc += knots[k][2] * infl;
        if (rr < 0.0042) {                            // knot core, own tight rings
          var rd = Math.sqrt(rr);
          var core = 1 - TEX_ss(0.040, 0.065, rd);
          var cr = rd * 95; cr -= Math.floor(cr);
          knotDark = Math.max(knotDark, core * (0.62 + 0.30 * (0.5 - 0.5 * Math.cos(TAU * cr))));
          knotH = Math.max(knotH, core * 0.35);
        }
      }

      var fr = rc - Math.floor(rc);
      var soft = 0.5 - 0.5 * Math.cos(TAU * fr);
      var late = TEX_ss(0.50, 0.70, fr) * (1 - TEX_ss(0.78, 0.95, fr));
      var grain = TEX_clamp01(late * 0.74 + soft * 0.26) * O.contrast;
      var ends = 0.5 + 0.5 * Math.cos(TAU * (u + pi * 0.17));
      var endDark = ends * ends * ends * 0.07;        // faint end-grain darkening
      var fibre = (TEX_pnoise(u * 230, pv * 26, 230, 26, sd + 5) - 0.5) * 0.06;

      var streak = (TEX_pnoise(u * 40, pv * 6, 40, 6, sd + 7) - 0.5) * 0.09;
      var sh = 1 - endDark - seam * 0.56 + fibre + streak;
      var r = (eR + lR * grain) * sh;
      var g = (eG + lG * grain) * sh;
      var b = (eB + lB * grain) * sh;
      if (knotDark > 0) { r += (34 - r) * knotDark; g += (22 - g) * knotDark; b += (14 - b) * knotDark; }
      var dth = TEX_dither(i, j);
      d[p] = r + dth; d[p + 1] = g + dth; d[p + 2] = b + dth; d[p + 3] = 255;
      hgt[idx] = 0.62 - grain * 0.22 - seam * 0.55 + fibre * 1.6 - knotH;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { map: TEX_mkTex(THREE, cv, true), bumpMap: TEX_mkTex(THREE, TEX_bumpCanvas(hgt, W, H), false) };
}

/* --------------------------------------------------------------- 6. rock */
/* Granite cliff: tilted stratification with hard bedding lines, two scales of
   fracture network, quartz/biotite speckle, lichen on the ledges, run-off. */
function TEX_buildRock(THREE) {
  var W = 512, H = 512, cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  var hgt = new Float32Array(W * H);
  var o = TEX_WOUT, TAU = Math.PI * 2;
  var gBig = TEX_fbmGrid(128, 2, 3, 121), gWarp = TEX_fbmGrid(128, 4, 3, 101),
      gLich = TEX_fbmGrid(128, 6, 3, 77);

  for (var j = 0; j < H; j++) {
    var v = j / H;
    for (var i = 0; i < W; i++) {
      var u = i / W, idx = j * W + i, p = idx * 4;
      var big = TEX_grid(gBig, 128, u, v) - 0.5;      // large light/dark masses
      var warp = TEX_grid(gWarp, 128, u, v) - 0.5;
      var s = v * 13 + u * 5 + warp * 1.25;           // strata, ~21 deg; integer coeffs tile
      var sf = s - Math.floor(s);
      var band = 0.5 - 0.5 * Math.cos(TAU * sf);
      var sm = (sf < 0.5 ? sf : 1 - sf) * 11.0;
      var bed = sm < 1 ? (1 - sm) * (1 - sm) : 0;     // thin bedding-plane line

      /* fractures: a worley edge net gated by a coarse mask so only parts of
         the face are broken, with the crack width varying along the net */
      var cm = TEX_pnoise(u * 5, v * 5, 5, 5, 909);
      var cg = TEX_clamp01((cm - 0.34) * 2.6);
      TEX_worley(u * 6, v * 6, 6, 303, o);
      var frac = (1 - TEX_ss(0.0, 0.012 + 0.030 * cm, o[1] - o[0])) * (0.25 + 0.75 * cg);
      TEX_worley(u * 14, v * 14, 14, 404, o);
      var frac2 = (1 - TEX_ss(0.0, 0.030, o[1] - o[0])) * 0.34 * (0.3 + 0.7 * (1 - cg));

      var qz = TEX_pnoise(u * 190, v * 190, 190, 190, 55);        // quartz / biotite flecks
      var spark = (qz > 0.78 ? (qz - 0.78) * 3.2 : 0) - (qz < 0.20 ? (0.20 - qz) * 3.4 : 0);

      var ws = TEX_clamp01((TEX_pnoise(u * 34, v * 3, 34, 3, 99) - 0.52) * 3.0);
      ws *= 0.45 + 0.55 * (1 - sf);                    // staining runs below ledges

      var lum = 0.97 + big * 0.38 + (band - 0.5) * 0.26 - bed * 0.30
              - frac * 0.40 - frac2 * 0.26 - ws * 0.16 + spark * 0.55;
      if (lum < 0.20) lum = 0.20;                       // shadowed granite, never black
      var r = 138 * lum, g = 132 * lum, b = 126 * lum;
      r -= ws * 5; b += ws * 4;                         // stains go cool and dark

      var lf = TEX_grid(gLich, 128, u, v);
      var lic = TEX_clamp01((lf - 0.60) * 4.2) * (0.30 + 0.70 * band) * (1 - frac)
              * (0.45 + 0.55 * TEX_pnoise(u * 26, v * 26, 26, 26, 143));
      if (lic > 0) {
        var sel = TEX_pnoise(u * 3, v * 3, 3, 3, 88);
        var lr = sel > 0.5 ? 172 : 104, lg = sel > 0.5 ? 172 : 120, lb = sel > 0.5 ? 112 : 74;
        var lv = 0.80 + 0.45 * (qz - 0.5);
        r += (lr * lv - r) * lic; g += (lg * lv - g) * lic; b += (lb * lv - b) * lic;
      }
      var dth = TEX_dither(i, j);
      d[p] = r + dth; d[p + 1] = g + dth; d[p + 2] = b + dth; d[p + 3] = 255;
      hgt[idx] = 0.50 + big * 0.42 + (band - 0.5) * 0.26 - bed * 0.32
               - frac * 0.52 - frac2 * 0.28 + (qz - 0.5) * 0.09;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { map: TEX_mkTex(THREE, cv, true), bumpMap: TEX_mkTex(THREE, TEX_bumpCanvas(hgt, W, H), false) };
}

/* --------------------------------------------------------------- 7. grass */
/* Top-down ground cover: noise base of lush/dry/bare-dirt regions, then a few
   thousand short blade strokes whose direction follows a clump field, plus
   small flower clusters. Blades near an edge are redrawn wrapped. */
function TEX_buildGrass(THREE) {
  var W = 512, H = 512, cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  var hgt = new Float32Array(W * H);
  var gDirt = TEX_fbmGrid(128, 4, 3, 201), gDry = TEX_fbmGrid(128, 7, 3, 202),
      gClump = TEX_fbmGrid(128, 13, 2, 203);

  for (var j = 0; j < H; j++) {
    var v = j / H;
    for (var i = 0; i < W; i++) {
      var u = i / W, idx = j * W + i, p = idx * 4;
      var edge = TEX_pnoise(u * 46, v * 46, 46, 46, 207) - 0.5;   // ragged patch borders
      var dirt = TEX_clamp01((TEX_grid(gDirt, 128, u, v) + edge * 0.17 - 0.52) * 4.2);
      var dry = TEX_clamp01((TEX_grid(gDry, 128, u, v) + edge * 0.14 - 0.48) * 3.0) * (1 - dirt);
      var clump = TEX_grid(gClump, 128, u, v);

/* ---------- small math helpers (shared) ---------- */
function ATM_clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function ATM_ss(e0, e1, x) { var t = ATM_clamp((x - e0) / (e1 - e0 || 1e-6), 0, 1); return t * t * (3 - 2 * t); }

var ATM_SKY_VERT = `
varying vec3 vDir;
void main(){

var ATM_SKY_FRAG = `
uniform vec3 uZen, uHor, uHaze, uOpp, uGnd;
uniform vec3 uSunDir, uMoonDir, uSunCol, uMoonCol;
uniform vec3 uCDark, uCLit, uRim;
uniform float uTime, uGain, uNight, uDay, uStorm, uFlash;
uniform float uCov, uCAmt, uPhase, uStars, uWarp, uFn;
varying vec3 vDir;

float h21(vec2 p){
  vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
float h31(vec3 p){
  vec3 q = fract(p * vec3(0.1031, 0.1030, 0.0973));
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
float vn2(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = h21(i);
  float b = h21(i + vec2(1.0, 0.0));
  float c = h21(i + vec2(0.0, 1.0));
  float d = h21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p){
  float s = 0.0;
  float a = 0.5;
  for (int i = 0; i < OCT; i++) {
    s += a * vn2(p);
    p = p * 2.03 + vec2(11.3, 7.7);
    a *= 0.5;
  }
  return s * uFn;
}
/* x = coverage shaped density, y = sun facing lift */
vec2 cloudLayer(vec2 p, vec2 sd, float cov, float sharp){
#if DETAIL > 0
  vec2 q = vec2(fbm(p), fbm(p + vec2(4.7, 1.3)));
  vec2 pw = p + uWarp * q;
#else
  vec2 pw = p;
#endif
  float n = fbm(pw);
  float n2 = fbm(pw + sd * 0.30);
  float d = smoothstep(cov, cov + sharp, n);
  float lit = clamp((n - n2) * 2.6 + 0.45, 0.0, 1.0);

  vec3 dir = normalize(vDir + vec3(0.0, 1e-5, 0.0));

  vec3 col = mix(uZen, uHor, t);
  float az = clamp(dot(dir.xz, uSunDir.xz) / max(length(dir.xz) * length(uSunDir.xz), 1e-4), -1.0, 1.0);
  float lowSun = 1.0 - clamp(abs(uSunDir.y) * 2.2, 0.0, 1.0);
  float band = exp(-max(up, -0.05) * 7.0) * smoothstep(-0.30, 0.04, up);
  col = mix(col, uHaze, clamp(band * (0.30 + 0.70 * max(az, 0.0)) * (0.50 + 0.50 * lowSun), 0.0, 1.0));
  col = mix(col, uOpp, clamp(band * max(-az, 0.0) * 0.40, 0.0, 1.0));

    float r4 = h31(cell - vec3(3.7, 9.1, 1.3));
    vec3 off = (vec3(r2, r4, r1) - 0.5) * 0.66;
    float sd2 = length(fr - off);

    float core = exp(-sd2 * sd2 * 34.0) + 0.55 * exp(-sd2 * sd2 * 210.0);

    vec3 ax = normalize(vec3(0.42, 0.38, -0.82));
    vec3 mu0 = normalize(cross(ax, vec3(0.0, 1.0, 0.0)));

    vec3 mv = cross(uMoonDir, mu);
    vec2 mp = vec2(dot(dir - uMoonDir, mu), dot(dir - uMoonDir, mv)) / 0.0135;
    float rr = min(length(mp), 1.0);

    float m2 = vn2(mp * 9.0 - vec2(2.0, 7.0));

    float maria = smoothstep(0.50, 0.72, m1);

    float sl = length(sdv);
    sdv = sl > 0.0001 ? sdv / sl : vec2(1.0, 0.0);
    float yy = max(up, 0.02);
    float hz = smoothstep(0.012, 0.17, up);
    vec2 wnd = vec2(uTime * 0.0042, uTime * 0.0019);

                          [0.086*bw,0.050],[0.068*bw,0.078],[0.026,0.084]]), cPant, { w: 14, s: [1, 1, 0.80] });
    put(hips, MATS.cloth, pelG);

    /* ---------------- CLOTHING ------------------------------------------- */
    var open = (outfit === 'vest' || outfit === 'haori');
    var gk = outfit === 'hoodie' ? 1.075 : outfit === 'bomber' ? 1.085 : outfit === 'haori' ? 1.10 : 1.05;
    var gTop = outfit === 'shirt' ? 0.122 : 0.126;
    var garmProf = toH([[0.030*bw,-0.165],[0.090*bw*gk,-0.160],[0.095*bw*gk,-0.110],[0.092*bw*gk,-0.058],
                        [0.100*bw*gk,-0.008],[0.112*bw*gk,0.040],[0.116*bw*gk,0.082],[0.108*bw*gk,0.110],
                        [0.074*bw,gTop]]);
    if (outfit === 'haori') garmProf.unshift([0.096*bw*gk*H, -0.235*H]);

    if (open){
      /* open front: single lathe sector leaves a gap at phi ~ 0 (front, +Z) */
      var innerProf = toH([[0.030*bw,-0.150],[0.088*bw*1.02,-0.146],[0.093*bw*1.02,-0.100],
                           [0.091*bw*1.02,-0.050],[0.100*bw*1.02,0.000],[0.112*bw*1.02,0.048],
                           [0.115*bw*1.02,0.086],[0.106*bw*1.02,0.110],[0.070*bw,0.126]]);
      var teeG = lathe(innerProf, c3, { w: 14, s: [1, 1, 0.76] }); warp(teeG, spineCurve);
      put(torso, MATS.cloth, teeG);
      var jg = lathe(garmProf, c1, { w: 16, p0: 0.34, pl: TAU - 0.68, s: [1, 1, 0.78] });
      warp(jg, spineCurve); put(torso, MATS.cloth, jg);
      /* lapels: two angled slabs down the open front edges */
      for (i = 0; i < 2; i++){
        s = i ? -1 : 1;
        put(torso, MATS.cloth, box(0.030 * H, (outfit === 'haori' ? 0.34 : 0.24) * H, 0.012 * H, c2,
          { p: [s * 0.040 * H, (outfit === 'haori' ? -0.030 : 0.005) * H, 0.080 * H * bw],
            r: [0.10, s * 0.30, s * 0.10] }));
      }
      if (outfit === 'haori'){
        put(torso, MATS.cloth, tor(0.098 * H * bw, 0.016 * H, c2,
          { p: [0, -0.060 * H, 0], r: [HALFPI, 0, 0], s: [1, 0.78, 1], w: 16, h: 6 }));
      }
    } else {
      var bg = lathe(garmProf, c1, { w: 16, s: [1, 1, 0.76] });
      warp(bg, spineCurve); put(torso, MATS.cloth, bg);
    }

    /* collars / hems / closures per outfit */
    var neckR = 0.052 * H;
    if (outfit === 'crew'){
      put(torso, MATS.cloth, tor(neckR, 0.011 * H, c2, { p: [0, 0.128 * H, 0.004 * H], r: [HALFPI, 0, 0], s: [1, 0.80, 1] }));
      put(torso, MATS.cloth, cyl(0.097 * H * bw * gk, 0.092 * H * bw * gk, 0.026 * H, c2,
        { p: [0, -0.158 * H, 0], s: [1, 1, 0.78], open: true, w: 16 }));
    } else if (outfit === 'hoodie'){
      /* hood volume behind the neck + rim + drawstrings + kangaroo pocket */
      put(torso, MATS.cloth, sph(0.064 * H, c1, { p: [0, 0.108 * H, -0.052 * H], s: [1.3, 1.05, 1.0], w: 12, h: 9 }));
      put(torso, MATS.cloth, tor(0.060 * H, 0.016 * H, shade(c1, 0.9),
        { p: [0, 0.126 * H, -0.030 * H], r: [1.15, 0, 0], s: [1.25, 1, 1], w: 16, h: 6 }));
      for (i = 0; i < 2; i++){
        s = i ? -1 : 1;
        put(torso, MATS.cloth, cyl(0.0035 * H, 0.0035 * H, 0.085 * H, cWhite,
          { p: [s * 0.020 * H, 0.080 * H, 0.078 * H * bw], r: [0.14, 0, s * 0.05], w: 5 }));
        put(torso, MATS.cloth, sph(0.006 * H, cWhite, { p: [s * 0.022 * H, 0.037 * H, 0.085 * H * bw], w: 6, h: 5 }));
      }
      put(torso, MATS.cloth, lathe(toH([[0.100*bw*gk,-0.108],[0.104*bw*gk,-0.070],[0.102*bw*gk,-0.028]]),
        shade(c1, 0.92), { w: 12, p0: -0.85, pl: 1.70, s: [1, 1, 0.80] }));
      put(torso, MATS.cloth, cyl(0.097 * H * bw * gk, 0.094 * H * bw * gk, 0.024 * H, c2,
        { p: [0, -0.158 * H, 0], s: [1, 1, 0.78], open: true, w: 16 }));
    } else if (outfit === 'bomber'){
      put(torso, MATS.cloth, tor(neckR * 1.04, 0.015 * H, c2, { p: [0, 0.126 * H, 0.002 * H], r: [HALFPI, 0, 0], s: [1, 0.85, 1] }));
      put(torso, MATS.cloth, cyl(0.100 * H * bw * gk, 0.090 * H * bw * gk, 0.038 * H, c2,
        { p: [0, -0.150 * H, 0], s: [1, 1, 0.78], open: true, w: 16 }));
      put(torso, MATS.cloth, box(0.010 * H, 0.270 * H, 0.010 * H, cDark,
        { p: [0, -0.018 * H, 0.090 * H * bw], r: [-0.05, 0, 0] }));          /* zip line */
      put(torso, MATS.cloth, box(0.004 * H, 0.016 * H, 0.006 * H, cMet, { p: [0, -0.140 * H, 0.094 * H * bw] }));
    } else if (outfit === 'shirt'){
      /* placket + collar flaps + buttons */
      put(torso, MATS.cloth, lathe(toH([[0.100*bw*gk,-0.150],[0.103*bw*gk,0.000],[0.100*bw*gk,0.110]]),
        shade(c1, 1.06), { w: 10, p0: -0.26, pl: 0.52, s: [1, 1, 0.78] }));
      for (i = 0; i < 2; i++){
        s = i ? -1 : 1;
        put(torso, MATS.cloth, box(0.048 * H, 0.010 * H, 0.052 * H, shade(c1, 0.94),
          { p: [s * 0.036 * H, 0.112 * H, 0.052 * H * bw], r: [0.55, s * 0.42, s * 0.22] }));
      }
      for (i = 0; i < 4; i++){
        put(torso, MATS.cloth, cyl(0.005 * H, 0.005 * H, 0.004 * H, cWhite,
          { p: [0, (0.060 - i * 0.050) * H, 0.099 * H * bw], r: [HALFPI, 0, 0], w: 6 }));
      }
      put(torso, MATS.cloth, box(0.040 * H, 0.034 * H, 0.008 * H, shade(c1, 0.93),
        { p: [-0.045 * H, 0.030 * H, 0.090 * H * bw], r: [0, 0.25, 0] }));
    } else if (outfit === 'vest' || outfit === 'tee'){
      put(torso, MATS.cloth, tor(neckR, 0.009 * H, shade(c3, 0.9), { p: [0, 0.126 * H, 0.004 * H], r: [HALFPI, 0, 0], s: [1, 0.80, 1] }));
    }
    /* lanyard: two straps + badge, merged into the chest cloth mesh */
    if (has('lanyard')){
      for (i = 0; i < 2; i++){
        s = i ? -1 : 1;
        put(torso, MATS.cloth, box(0.009 * H, 0.150 * H, 0.006 * H, c2,
          { p: [s * 0.044 * H, 0.050 * H, 0.072 * H * bw], r: [0.10, 0, s * 0.26] }));
      }
      put(torso, MATS.cloth, box(0.034 * H, 0.046 * H, 0.005 * H, cWhite, { p: [0, -0.030 * H, 0.092 * H * bw], r: [0.06, 0, 0] }));
    }
    if (has('chain')){
      var nR = 0.050 * H;
      for (i = 0; i < 16; i++){
        var a = -1.25 + i / 15 * 2.5;
        put(torso, MATS.shiny, sph(0.0045 * H, cMet,
          { p: [Math.sin(a) * nR, 0.112 * H - Math.cos(a) * 0.012 * H, Math.cos(a) * nR * 0.80], w: 5, h: 4 }));
      }
      put(torso, MATS.shiny, sph(0.009 * H, cMet, { p: [0, 0.074 * H, 0.080 * H], s: [1, 1.3, 0.5], w: 6, h: 5 }));
    }

    /* ---------------- NECK ----------------------------------------------- */
    put(neck, MATS.skin, limb(0.041 * H, 0.037 * H, 0.082 * H, cSkin, { w: 10, p: [0, 0.082 * H, 0] }));
    put(neck, MATS.skin, sph(0.030 * H, cSkD, { p: [0, 0.010 * H, -0.010 * H], s: [1.3, 0.8, 1.0], w: 8, h: 6 }));

    /* ---------------- HEAD ------------------------------------------------ */
    var hg = [];
    hg.push(sph(1, cSkin, { p: [CCx, CCy, CCz], s: [CRx, CRy, CRz], w: 16, h: 12 }));
    hg.push(sph(0.040 * H, cSkin, { p: [0, -0.012 * H, 0.034 * H], s: [1.02 * hw, 1.00, 0.95], w: 12, h: 9 }));  /* mid-face */
    for (i = 0; i < 2; i++){
      s = i ? -1 : 1;
      hg.push(sph(0.029 * H, cSkL, { p: [s * 0.030 * H, -0.009 * H, 0.040 * H], s: [1.0, 0.82, 0.88], w: 9, h: 7 }));  /* cheekbone */
      /* ears: flattened sphere + inner fold */
      hg.push(sph(0.016 * H, cSkin, { p: [s * earX, earY, earZ], s: [0.34, 1.26, 0.82], r: [0, 0, -s * 0.12], w: 8, h: 7 }));
      hg.push(sph(0.010 * H, cSkD,  { p: [s * (earX - 0.0018 * H), earY - 0.001 * H, earZ + 0.003 * H], s: [0.30, 1.0, 0.70], w: 7, h: 6 }));
      if (has('earrings')) put(head, MATS.shiny, sph(0.0055 * H, cMet, { p: [s * earX, earY - 0.019 * H, earZ], w: 6, h: 5 }));
    }
    hg.push(caps(0.0092 * H, 0.052 * H, cSkin, { p: [0, browY - 0.004 * H, 0.053 * H], r: [0, 0, HALFPI], s: [1, 1, 1.35], w: 7 })); /* brow ridge */
    /* nose: angled bridge capsule + tip + wings */
    hg.push(caps(0.0082 * H, 0.040 * H, cSkin, { p: [0, 0.021 * H, 0.063 * H], r: [-0.38, 0, 0], s: [0.85, 1, 1], w: 7 }));
    hg.push(sph(0.0105 * H, cSkin, { p: [0, 0.0035 * H, 0.0700 * H], s: [1.0, 0.9, 1.0], w: 8, h: 7 }));
    for (i = 0; i < 2; i++){ s = i ? -1 : 1;
      hg.push(sph(0.0078 * H, cSkin, { p: [s * 0.0112 * H, 0.0008 * H, 0.0630 * H], s: [0.9, 0.85, 1.0], w: 7, h: 6 })); }
    hg.push(caps(0.0062 * H, 0.026 * H, cLip, { p: [0, mouthY + 0.0035 * H, mouthZ + 0.0090 * H], r: [0, 0, HALFPI], s: [1, 1, 0.9], w: 6 })); /* upper lip */
    hg.push(sph(0.032 * H, cSkin, { p: [0, -0.022 * H, -0.012 * H], s: [1.05, 0.85, 1.0], w: 9, h: 7 }));  /* under-skull fill */
    put(head, MATS.skin, mg(hg));

    /* jaw: chin mass, jawline, lower lip */
    var jy = -earY, jz = 0.022 * H;    /* head-local -> jaw-local offset */
    var jg2 = [];
    jg2.push(sph(0.030 * H, cSkin, { p: [0, -0.050 * H, 0.055 * H], s: [1.22, 0.86, 1.00], w: 10, h: 8 }));
    for (i = 0; i < 2; i++){ s = i ? -1 : 1;
      jg2.push(sph(0.026 * H, cSkin, { p: [s * 0.033 * H, -0.036 * H, 0.030 * H], s: [0.92, 0.95, 1.0], w: 8, h: 7 }));
      jg2.push(sph(0.023 * H, cSkin, { p: [s * 0.039 * H, -0.014 * H, 0.000 * H], s: [0.90, 1.0, 1.0], w: 8, h: 6 })); }
    jg2.push(caps(0.0068 * H, 0.028 * H, cLip, { p: [0, mouthY + jy - 0.0085 * H, mouthZ + jz + 0.0085 * H], r: [0, 0, HALFPI], w: 6 }));
    if (lod >= 2) put(head, MATS.skin, xform(mg(jg2), [0, earY, -0.022 * H], null, null));
    else put(jaw, MATS.skin, mg(jg2));

    /* ---------------- EYES ------------------------------------------------ */
    function eyeGeo(){
      var e = [];
      e.push(sph(rEye, cWhite, { s: [1, 1, 0.96], w: 10, h: 8 }));
      e.push(sph(rEye * 1.006, cEye,  { r: [HALFPI, 0, 0], tl: 0.55, w: 10, h: 4 }));
      e.push(sph(rEye * 1.014, cDark, { r: [HALFPI, 0, 0], tl: 0.26, w: 8, h: 3 }));
      e.push(sph(rEye * 0.16, cWhite, { p: [rEye * 0.30, rEye * 0.34, rEye * 0.93], w: 5, h: 4 }));
      return mg(e);
    }
    if (lod >= 1){   /* both eyeballs in one group: the shared X axis still blinks/pitches true */
      put(eyes, MATS.eye, mg([xform(eyeGeo(), [-eyeX, 0, 0], null, null), xform(eyeGeo(), [eyeX, 0, 0], null, null)]));
    } else { put(eyeR, MATS.eye, eyeGeo()); put(eyeL, MATS.eye, eyeGeo()); }

    /* eyelids: spherical caps concentric with each eyeball, rotated to blink */
    var luG = [], ldG = [];
    for (i = 0; i < 2; i++){
      s = i ? -1 : 1;
      luG.push(sph(rEye * 1.07, cSkD, { p: [s * eyeX, 0, 0], tl: 0.98, w: 10, h: 5 }));
      ldG.push(sph(rEye * 1.06, cSkD, { p: [s * eyeX, 0, 0], t0: PI - 0.68, tl: 0.68, w: 10, h: 4 }));
    }
    put(lidU, MATS.skin, mg(luG));
    if (lod < 1) put(lidD, MATS.skin, mg(ldG));
    else put(head, MATS.skin, xform(mg(ldG), [0, eyeY, eyeZ], null, null));

    /* eyebrows (single merged mesh, group translates/pitches for the raise) */
    var bg2 = [];
    for (i = 0; i < 2; i++){
      s = i ? -1 : 1;
      bg2.push(caps(0.0062 * H, 0.030 * H, cHairD,
        { p: [s * eyeX, 0.0005 * H, 0.060 * H], r: [0, 0, HALFPI - s * 0.18], s: [1, 1, 0.75], w: 6 }));
      bg2.push(sph(0.0062 * H, cHairD, { p: [s * (eyeX + 0.014 * H), -0.0025 * H, 0.056 * H], s: [1, 0.8, 0.7], w: 6, h: 5 }));
    }
    if (lod >= 2) put(head, MHAIR, xform(mg(bg2), [0, browY, 0], null, null));
    else put(brows, MATS.hair, mg(bg2));

    /* ---------------- HAIR ------------------------------------------------ */
    var hairTilt = 0.35, capTheta = 1.78;
    var axY = Math.cos(hairTilt), axZ = -Math.sin(hairTilt);
    function inZone(d, theta){ return (d[1] * axY + d[2] * axZ) > Math.cos(theta || capTheta); }
    function sp(d, grow, out){
      out[0] = CCx + d[0] * CRx * grow; out[1] = CCy + d[1] * CRy * grow; out[2] = CCz + d[2] * CRz * grow;
      return out;
    }
    function shell(grow, theta, tilt, col){
      return sph(1, col, { tl: theta, w: 18, h: 10, s: [CRx * grow, CRy * grow, CRz * grow],
                           r: [-(tilt == null ? hairTilt : tilt), 0, 0], p: [CCx, CCy, CCz] });
    }
    var hairG = [], hatG = [], tmp = [0, 0, 0], d, j, p3;

    function clusters(n, rad, grow, jit, theta, col, flat){
      var dirs = fibDirs(n, rnd, jit || 0), k;
      for (k = 0; k < dirs.length; k++){
        d = dirs[k];
        if (!inZone(d, theta)) continue;
        sp(d, grow + (rnd() - 0.5) * 0.06, tmp);
        hairG.push(sph(rad * (0.82 + rnd() * 0.42), col || cHair,
          { p: [tmp[0], tmp[1], tmp[2]], s: flat ? [1, 0.75, 1] : null, w: 6, h: 5 }));
      }
    }
    function strand(d, grow, len, rad, col, droop){
      sp(d, grow, tmp);
      var yaw = Math.atan2(d[0], d[2]), pit = Math.acos(CHR_clamp(d[1], -1, 1));
      var dr = droop == null ? 0.55 : droop;
      var ang = CHR_lerp(pit, PI * 0.5 + 0.55, dr);               /* bend outward strands downward */
      var dx = Math.sin(ang) * Math.sin(yaw), dy = Math.cos(ang), dz = Math.sin(ang) * Math.cos(yaw);
      hairG.push(caps(rad, len, col || cHair, {
        p: [tmp[0] + dx * len * 0.45, tmp[1] + dy * len * 0.45, tmp[2] + dz * len * 0.45],
        r: [Math.atan2(Math.sin(ang) * Math.cos(yaw), Math.cos(ang)), 0,
            -Math.atan2(Math.sin(ang) * Math.sin(yaw), Math.cos(ang))], w: 5 }));
    }
    function curtain(count, grow, len, wide, col){
      var k, a;
      for (k = 0; k < count; k++){
        a = -PI * 0.92 + k / (count - 1) * PI * 1.84;             /* around the back half */
        d = [Math.sin(a) * 0.93, 0.05, Math.cos(a) * 0.93];
        var L = Math.hypot(d[0], d[1], d[2]); d[0] /= L; d[1] /= L; d[2] /= L;
        sp(d, grow, tmp);
        hairG.push(box(wide, len, wide * 0.72, col || cHair,
          { p: [tmp[0] * 1.02, tmp[1] - len * 0.46, tmp[2] * 1.02], r: [0, a, Math.sin(a) * 0.10] }));
      }
    }

    switch (style){
      case 'bald': break;
      case 'buzz':
        hairG.push(shell(1.030, 1.84, 0.33, cHairD)); break;
      case 'crop':
        hairG.push(shell(1.075, 1.80, 0.36, cHair));
        hairG.push(sph(0.030 * H, cHair, { p: [0, CCy + CRy * 0.72, CCz + CRz * 0.62], s: [1.5, 0.6, 0.8], w: 10, h: 6 }));
        break;
      case 'undercut':
        hairG.push(shell(1.022, 2.05, 0.30, cHairD));                       /* buzzed sides */
        hairG.push(shell(1.095, 1.10, 0.46, cHair));                        /* long top     */
        hairG.push(sph(0.034 * H, cHair, { p: [0, CCy + CRy * 0.80, CCz + CRz * 0.50], s: [1.3, 0.75, 1.0], w: 10, h: 7 }));
        break;
      case 'hightop': case 'flattop':
        hairG.push(shell(1.025, 1.95, 0.30, cHairD));
        hairG.push(cyl(0.040 * H * hw, 0.044 * H * hw, 0.085 * H, cHair,
          { p: [0, CCy + CRy * 0.86, CCz + CRz * 0.12], s: [1.05, 1, 0.92], w: 14 }));
        hairG.push(box(0.080 * H * hw, 0.016 * H, 0.086 * H, cHair, { p: [0, CCy + CRy * 0.86 + 0.042 * H, CCz + CRz * 0.12] }));
        break;
      case 'afro':
        hairG.push(shell(1.06, 1.95, 0.30, cHairD));
        clusters(150, 0.0150 * H, 1.20, 0.10, 1.92, cHair);
        clusters(90, 0.0130 * H, 1.36, 0.14, 1.86, cHair);
        break;
      case 'coils': case 'twists':
        hairG.push(shell(1.05, 1.92, 0.32, cHairD));
        var cd = fibDirs(54, rnd, 0.06);
        for (j = 0; j < cd.length; j++) if (inZone(cd[j], 1.90)) strand(cd[j], 1.04, 0.040 * H, 0.0082 * H, cHair, 0.35);
        clusters(60, 0.0105 * H, 1.14, 0.10, 1.90, cHair);
        break;
      case 'cornrows': case 'braids':
        hairG.push(shell(1.030, 1.96, 0.30, cHairD));
        for (j = 0; j < 7; j++){
          var kx = -0.78 + j / 6 * 1.56, u;
          for (u = 0; u <= 13; u++){
            var aa = 0.60 - u / 13 * 3.05;
            d = [kx, Math.cos(aa), Math.sin(aa)];
            var LL = Math.hypot(d[0], d[1], d[2]); d[0] /= LL; d[1] /= LL; d[2] /= LL;
            if (!inZone(d, 2.05)) continue;
            sp(d, 1.075, tmp);
            hairG.push(sph(0.0088 * H * (u % 2 ? 1.0 : 0.82), cHair, { p: [tmp[0], tmp[1], tmp[2]], w: 6, h: 5 }));
          }
        }
        break;
      case 'locs':
        hairG.push(shell(1.055, 1.95, 0.32, cHairD));
        var ld = fibDirs(30, rnd, 0.05);
        for (j = 0; j < ld.length; j++) if (inZone(ld[j], 1.90)) strand(ld[j], 1.05, 0.090 * H + rnd() * 0.055 * H, 0.0092 * H, cHair, 0.80);
        break;
      case 'bun':
        hairG.push(shell(1.055, 1.90, 0.33, cHair));
        hairG.push(sph(0.042 * H, cHair, { p: [0, CCy + CRy * 0.72, CCz - CRz * 0.95], s: [1, 1, 0.9], w: 12, h: 9 }));
        hairG.push(tor(0.030 * H, 0.0075 * H, c2, { p: [0, CCy + CRy * 0.52, CCz - CRz * 0.86], r: [0.5, 0, 0], w: 12, h: 5 }));
        break;
      case 'ponytail':
        hairG.push(shell(1.055, 1.90, 0.33, cHair));
        hairG.push(tor(0.020 * H, 0.0070 * H, c2, { p: [0, CCy + CRy * 0.30, CCz - CRz * 1.02], r: [0.4, 0, 0], w: 12, h: 5 }));
        hairG.push(caps(0.019 * H, 0.130 * H, cHair,
          { p: [0, CCy + CRy * 0.02, CCz - CRz * 1.22], r: [-0.42, 0, 0], s: [0.85, 1, 1], w: 8 }));
        hairG.push(sph(0.014 * H, cHair, { p: [0, CCy - CRy * 1.25, CCz - CRz * 1.55], w: 7, h: 6 }));
        break;
      case 'long':
        hairG.push(shell(1.060, 2.00, 0.30, cHair));

      case 'waves':

        for (j = 0; j < 22; j++){
          var av = -PI * 0.85 + (j % 11) / 10 * PI * 1.70, lvl = Math.floor(j / 11);

        hatG.push(sph(1, c2, { tl: 2.10, w: 18, h: 10, s: [CRx * 1.10, CRy * 1.10, CRz * 1.10], r: [-0.22, 0, 0], p: [CCx, CCy, CCz] }));

    }

    if (hatG.length)  put(head, MHAT, mg(hatG));

    /* facial hair */
    if (facial !== 'none'){
      var fg2 = [], must = [];
      if (facial === 'mustache' || facial === 'beard' || facial === 'goatee'){
        must.push(caps(0.0070 * H, 0.030 * H, cHairD,

      if (facial === 'beard'){

        else put(jaw, MATS.hair, mg(fg2));
      }
    }

    /* glasses / headphones */
    if (has('glasses')){
      var fr = [], ln = [], rL = 0.0185 * H;
      for (i = 0; i < 2; i++){
        s = i ? -1 : 1;
        fr.push(tor(rL, 0.0022 * H, cDark, { p: [s * eyeX, eyeY, eyeZ + 0.0135 * H], s: [1.08, 0.92, 1], w: 14, h: 5 }));

        ln.push(cyl(rL * 0.98, rL * 0.98, 0.0012 * H, cGlass, { p: [s * eyeX, eyeY, eyeZ + 0.0135 * H], r: [HALFPI, 0, 0], s: [1.08, 1, 0.92], w: 14 }));

      var hp = [];
      hp.push(tor(CRx * 1.18, 0.0085 * H, cDark, { p: [CCx, CCy + 0.004 * H, CCz], r: [0, 0, 0], s: [1, CRy / CRx * 1.05, 1], w: 18, h: 6, arc: PI }));

    var longSl = sleeve === 'long', wide = outfit === 'haori';
    for (i = 0; i < 2; i++){
      var A = arms[i]; s = A.s; xs = A.xs;
      var r1 = 0.040 * H * lw, r2 = 0.033 * H * lw, r3 = 0.0335 * H * lw, r4 = 0.0245 * H * lw;

        fo.push(limb(r3 + 0.006 * H, r4 + 0.009 * H, L2 * 0.88, c1, { w: 10 }));
        fo.push(cyl(r4 + 0.011 * H, r4 + 0.010 * H, 0.022 * H, c2, { p: [0, -L2 * 0.88, 0], w: 10 }));
        if (wide) fo.push(cyl(r3 + 0.048 * H, r4 + 0.058 * H, L2 * 0.60, c1, { p: [0, -L2 * 0.45, 0], s: [1, 1, 0.9], w: 12, open: true }));
      } else {
        up.push(sph(0.047 * H * lw, c1, { p: [0, -0.006 * H, 0], s: [1.05, 1.1, 1.0], w: 10, h: 8 }));
        up.push(cyl(r1 + 0.008 * H, r2 + 0.010 * H, L1 * 0.48, c1, { p: [0, -L1 * 0.24, 0], w: 10 }));
        upS.push(limb(r1 * 0.98, r2, L1 * 0.99, cSkin, { w: 10, p: [0, -L1 * 0.02, 0] }));

      /* hand: wrist stub + palm (+ fingers baked in at lod>=1) */
      var hnd = [];
      hnd.push(limb(r4 * 1.02, 0.020 * H * lw, 0.040 * H, cSkin, { w: 8, p: [0, 0.030 * H, 0] }));
      hnd.push(box(0.050 * H * lw, 0.058 * H, 0.025 * H * lw, cSkin, { p: [0, -0.029 * H, 0] }));
      hnd.push(sph(0.025 * H * lw, cSkin, { p: [0, -0.016 * H, 0], s: [1.0, 1.1, 0.52], w: 8, h: 6 }));
      hnd.push(sph(0.025 * H * lw, cSkin, { p: [0, -0.055 * H, 0], s: [1.0, 0.7, 0.52], w: 8, h: 6 }));

      var fgG = [], k2;

      if (lod >= 1){
        /* bake fingers in a slightly curled pose to save two draw calls */
        hnd.push(xform(mg(fgG), [0, -0.058 * H, 0.001 * H], [0.45, 0, 0], null));

          cyl(0.014 * H, 0.014 * H, 0.012 * H, cMet,  { p: [xs * 0.012 * H, 0.026 * H, 0], r: [0, 0, HALFPI], s: [1, 1, 0.75], w: 10 })]));

    }

    /* ---------------- LEGS + SHOES ---------------------------------------- */
    function legGeo(sgnX){
      var thG = [], knG = [], anG = [];
      thG.push(sph(0.060 * H * lw, cPant, { p: [0, 0.006 * H, 0], s: [1.05, 1.0, 1.05], w: 10, h: 8 }));
      thG.push(limb(0.062 * H * lw, 0.049 * H * lw, LT * 0.99, cPant, { w: 11 }));
      knG.push(sph(0.048 * H * lw, cPant, { p: [0, 0.004 * H, 0.004 * H], w: 9, h: 7 }));
      knG.push(limb(0.049 * H * lw, 0.030 * H * lw, LC * 0.95, cPant, { w: 10 }));
      knG.push(sph(0.050 * H * lw, cPant, { p: [0, -0.060 * H, -0.008 * H], s: [0.95, 1.5, 1.1], w: 9, h: 7 }));
      knG.push(cyl(0.034 * H * lw, 0.032 * H * lw, 0.020 * H, shade(cPant, 0.9), { p: [0, -LC * 0.93, 0], w: 10 }));
      /* shoe: sole slab, contrast sole edge, upper, toe box */
      anG.push(box(0.072 * H, 0.016 * H, 0.168 * H, cSole, { p: [0, -0.058 * H, 0.030 * H] }));
      anG.push(box(0.076 * H, 0.009 * H, 0.172 * H, shade(cSole, 0.82), { p: [0, -0.064 * H, 0.030 * H] }));
      anG.push(box(0.068 * H, 0.046 * H, 0.120 * H, cShoe, { p: [0, -0.030 * H, 0.012 * H] }));
      anG.push(sph(0.034 * H, cShoe, { p: [0, -0.036 * H, 0.082 * H], s: [1.02, 0.72, 1.12], w: 10, h: 7 }));
      anG.push(sph(0.030 * H, cShoe, { p: [0, -0.008 * H, -0.016 * H], s: [1.05, 1.1, 0.95], w: 9, h: 7 }));
      anG.push(box(0.040 * H, 0.006 * H, 0.052 * H, shade(cShoe, 1.25), { p: [0, -0.008 * H, 0.030 * H], r: [-0.18, 0, 0] }));

      var Lg = legs[i], G = legGeo(Lg.xs);
      if (bakeLegs){

        var mt = new THREE.Matrix4(), mk = new THREE.Matrix4(), ma = new THREE.Matrix4(), tmpM = new THREE.Matrix4();
        mt.makeRotationX(-1.52); mt.setPosition(Lg.xs * legX, -0.005 * H, 0);

        G.th.applyMatrix4(mt); G.kn.applyMatrix4(tmpM);
        G.an.applyMatrix4(tmpM.multiply(ma));
        put(hips, MATS.cloth, mg([G.th, G.kn, G.an]));
      } else {
        put(Lg.th, MATS.cloth, G.th);
        put(Lg.kn, MATS.cloth, G.kn);
        put(Lg.an, MATS.cloth, G.an);
      }
    }

    /* ---------------- finalize: one Mesh per (bone, material) ------------- */
    var meshes = [], e, geo, m;
    for (i = 0; i < bagList.length; i++){
      e = bagList[i];
      geo = mg(e.g);
      geo.computeBoundingSphere();
      m = new THREE.Mesh(geo, e.mat);
      m.matrixAutoUpdate = false;
      m.castShadow = false; m.receiveShadow = false;

      meshes.push(m);
    }

    var K = {
      root: root, hips: hips, spine: spine, chest: chest, torso: torso,
      neck: neck, head: head, jaw: jaw,
      eyes: eyes, eyeR: eyeR, eyeL: eyeL,
      lids: { upper: lidU, lower: lidD }, lidU: lidU, lidD: lidD,
      brows: brows, browY: browY,
      arms: arms, legs: legs, meshes: meshes,
      L1: L1, L2: L2, legLen: LT + LC, height: H, shX: shX, lod: lod,
      seed: (seed % 997) / 997, rnd: CHR_rng(((seed + 7919) * 2246822519) >>> 0),
      t: rnd() * 40, eyeLead: 0, eyePitchLead: 0,
      headLocal: new THREE.Vector3(0, neck.position.y + head.position.y, head.position.z),
      face: { t: rnd() * 30, bt: 1 + rnd() * 3, bp: null, dbl: 0, blink: 0,
              st: rnd() * 1.2, sx: 0, sy: 0, ex: 0, ey: 0, br: 0, jw: 0 }
    };
    return K;
  }

  /* ===================================================================== */
  /*  state helpers                                                        */
  /* ===================================================================== */
  function newState(seed){
    var S = {
      stand: 1, lean: 0, yaw: 0, rootZ: 0, chestYaw: 0, tilt: 0, bob: 0,
      seed: (seed == null ? 0 : seed) % 1000 / 1000,
      hand: [new THREE.Vector3(), new THREE.Vector3()],
      back: [new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 1, 0)],
      pole: [new THREE.Vector3(-1, -1, -0.4), new THREE.Vector3(1, -1, -0.4)],
      curl: [0.25, 0.25], wrist: [0, 0], thumb: [0.2, 0.2],
      hy: 0, hp: 0, hyBias: 0, hpBias: 0, useIK: false, _ca: 0, H: 1.74
    };
    return S;
  }
  function ensureState(S){
    if (!S.hand){ S.hand = [new THREE.Vector3(), new THREE.Vector3()]; if (S.useIK == null) S.useIK = false; }
    if (!S.back) S.back = [new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 1, 0)];
    if (!S.pole) S.pole = [new THREE.Vector3(-1, -1, -0.4), new THREE.Vector3(1, -1, -0.4)];
    if (!S.curl) S.curl = [0.25, 0.25];
    if (!S.wrist) S.wrist = [0, 0];
    if (!S.thumb) S.thumb = [0.2, 0.2];
    if (S.hy == null) S.hy = 0;
    if (S.hp == null) S.hp = 0;
    if (S._ca == null) S._ca = 0;
    return S;
  }

  /* ===================================================================== */
  /*  two-bone analytic IK (law of cosines, explicit basis, no lookAt)      */
  /* ===================================================================== */
  function solveArm(K, S, i, mInv){
    var A = K.arms[i], L1 = K.L1, L2 = K.L2;
    /* goal: root-local -> chest-local -> shoulder-relative */
    var g = SC.v1.copy(S.hand[i]).applyMatrix4(mInv).sub(A.sh.position);
    var d = g.length(), dir = SC.v2;
    if (d < 1e-6){ dir.set(0, -1, 0); d = 1e-6; } else dir.copy(g).divideScalar(d);
    var reach = L1 + L2, dMax = reach * 0.995, dMin = Math.abs(L1 - L2) + reach * 0.07;
    d = CHR_clamp(d, dMin, dMax);
    /* interior elbow angle -> bend away from straight */
    var cosE = CHR_clamp((L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2), -1, 1);
    var bend = PI - Math.acos(cosE);
    var cosA = CHR_clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
    var al = Math.acos(cosA), ca = Math.cos(al), sa = Math.sin(al);
    /* pole hint -> hinge axis n, in-plane vector b pointing toward the pole */
    var pv = SC.v3.copy(S.pole[i]);
    if (pv.lengthSq() < 1e-10) pv.set(A.xs * 0.5, -1, -0.4);
    pv.transformDirection(mInv);
    var n = SC.v4.crossVectors(dir, pv);
    if (n.lengthSq() < 1e-10){ pv.set(0, -1, 0); n.crossVectors(dir, pv);
      if (n.lengthSq() < 1e-10){ pv.set(0, 0, -1); n.crossVectors(dir, pv); } }
    n.normalize();
    var b = SC.v5.crossVectors(n, dir).normalize();
    /* upper-arm dir = dir rotated toward the pole by alpha; basis: x=-n, y=-ua, z=cosA*b-sinA*dir */
    var ua = SC.v6.copy(dir).multiplyScalar(ca).addScaledVector(b, sa);
    var zb = SC.v7.copy(b).multiplyScalar(ca).addScaledVector(dir, -sa).normalize();
    n.negate(); ua.negate();
    SC.m2.makeBasis(n, ua, zb);
    A.sh.quaternion.setFromRotationMatrix(SC.m2);
    A.el.rotation.set(bend, 0, 0);
    /* wrist roll: desired back-of-hand direction expressed in the forearm frame */
    var bk = SC.v8.copy(S.back[i]);
    if (bk.lengthSq() < 1e-10) bk.set(0, 1, 0);
    bk.transformDirection(mInv);
    SC.q2.setFromAxisAngle(SC.ax, bend);
    SC.q3.copy(A.sh.quaternion).multiply(SC.q2).conjugate();
    bk.applyQuaternion(SC.q3);
    var roll = 0;
    if (bk.x * bk.x + bk.z * bk.z > 1e-8) roll = CHR_clamp(Math.atan2(bk.x, bk.z), -2.3, 2.3);
    A.wr.rotation.set(CHR_clamp(S.wrist[i] || 0, -1.1, 1.1), roll, 0);
  }

  /* ===================================================================== */
  /*  applyRig                                                             */
  /* ===================================================================== */
  function applyRig(K, S, dt, lookTarget, walk){
    ensureState(S);
    dt = dt > 0 ? (dt > 0.1 ? 0.1 : dt) : 1e-4;
    K.t += dt;
    var t = K.t, H = K.height, sd = (S.seed == null ? K.seed : S.seed);
    var st = CHR_clamp(S.stand == null ? 1 : S.stand, 0, 1);
    var i, A, Lg, s;

    /* --- breathing (~14 bpm) + slow weight shift, both desynced by seed --- */
    var br = Math.sin(t * 1.466 + sd * 6.283);
    var sw1 = Math.sin(t * 0.37 + sd * 4.1), sw2 = Math.sin(t * 0.28 + sd * 2.3);

    /* --- walk cycle parameters ------------------------------------------- */
    var wk = 0, ph = 0, amp = 0, kAmp = 1;
    if (walk && walk.speed > 0.01){
      var v = walk.speed;
      var step = 0.42 * H * (0.55 + 0.45 * Math.min(v / 1.5, 1.5));   /* stride from speed */
      var cyc = v / (2 * step);
      ph = (walk.ph || 0) + dt * cyc * TAU;
      if (ph > TAU) ph -= TAU * Math.floor(ph / TAU);
      walk.ph = ph;

    /* --- legs: resolve joint angles first, the support leg sets the hip height --- */

    for (i = 0; i < 2; i++){

      if (wk > 0.01){

        ankle = (-0.20 * Math.max(0, Math.sin(q)) + 0.45 * toe * toe) * kAmp;

    K.hips.position.set(
      sw1 * 0.004 * H * (1 - wk) + Math.sin(ph) * 0.010 * H * wk,
      hipY + (S.bob || 0),
      (S.rootZ || 0) - 0.10 * H * st);
    K.hips.rotation.set(
      hipPitch,
      (S.yaw || 0) + 0.10 * CHR_stride(ph) * wk,
      sw1 * 0.020 * (1 - wk) + 0.040 * Math.sin(ph) * wk);

    var chYaw = (S.chestYaw || 0) - 0.085 * CHR_stride(ph) * wk;

    /* --- head look (needs the chest matrix, so resolve the chest yaw now) -- */
    var yawT = 0, pitT = 0, assist = 0;
    K.hips.updateMatrix(); K.spine.updateMatrix();
    K.chest.rotation.set(lean * 0.50 - 0.008 * br, chYaw, tilt * 0.50 + sw2 * 0.014);
    K.chest.updateMatrix();
    SC.m3.multiplyMatrices(K.hips.matrix, K.spine.matrix).multiply(K.chest.matrix); /* root->chest */
    SC.m4.copy(SC.m3).invert();

    if (lookTarget){

      K.root.updateMatrix();
      if (K.root.parent) SC.m5.multiplyMatrices(K.root.parent.matrixWorld, K.root.matrix);
      else SC.m5.copy(K.root.matrix);
      SC.m6.copy(SC.m5).invert();
      var rel = SC.v9.copy(lookTarget).applyMatrix4(SC.m6).applyMatrix4(SC.m4).sub(K.headLocal);
      var hz = Math.sqrt(rel.x * rel.x + rel.z * rel.z);
      if (hz > 1e-5 || Math.abs(rel.y) > 1e-5){
        var raw = Math.atan2(rel.x, rel.z);

      }
    } else {

    S.hp = CHR_damp(S.hp, pitT, 6.0, dt);
    S._ca = CHR_damp(S._ca, assist, 2.6, dt);
    K.eyeLead = CHR_clamp(yawT - S.hy, -0.30, 0.30);
    K.eyePitchLead = CHR_clamp(pitT - S.hp, -0.18, 0.18);

    if (Math.abs(S._ca) > 1e-4){                                      /* re-apply with assist */
      K.chest.rotation.y = chYaw + S._ca;
      K.chest.updateMatrix();
      SC.m3.multiplyMatrices(K.hips.matrix, K.spine.matrix).multiply(K.chest.matrix);

      A = K.arms[i];

        var dirS = (i === 0 ? 1 : -1);

        A.el.rotation.set(0.28 + 0.45 * amp * Math.max(0, -dirS * CHR_stride(ph)), 0, 0);
        A.wr.rotation.set(0.05, 0, 0);
        S.curl[i] = 0.42;
      } else {
        A.sh.rotation.set(0.07 + 0.04 * br, 0, A.xs * 0.045 + A.xs * 0.015 * sw1);
        A.el.rotation.set(0.22 + 0.05 * Math.sin(t * 0.5 + sd * 3), 0, 0);
        A.wr.rotation.set(0.04, 0, 0);
        S.curl[i] = 0.25;

      A.fing.rotation.x = CHR_clamp(S.curl[i], 0, 1) * 1.45;
      A.thumb.rotation.set(CHR_clamp(S.thumb[i], 0, 1) * 0.55, 0, A.xs * CHR_clamp(S.thumb[i], 0, 1) * 0.75);

    for (i = 0; i < 2; i++){

      Lg.kn.rotation.set(SC.a2[i], 0, 0);
      Lg.an.rotation.set(SC.a3[i], 0, 0);
    }
  }

  /* ===================================================================== */
  /*  faceTick: blinks, saccades, brows, jaw                               */
  /* ===================================================================== */
  function faceTick(K, dt, mood){
    dt = dt > 0 ? (dt > 0.1 ? 0.1 : dt) : 1e-4;
    var F = K.face, DUR = 0.12;
    F.t += dt;
    /* spontaneous blinks, 2-6s apart, occasional double */
    if (F.bp === null){
      F.bt -= dt;
      if (F.bt <= 0){ F.bp = 0; F.dbl = K.rnd() < 0.18 ? 1 : 0; F.bt = 2 + K.rnd() * 4; }
    }
    var b = 0;
    if (F.bp !== null){
      F.bp += dt;
      if (F.bp < 0) b = 0;
      else if (F.bp < DUR) b = Math.sin(PI * F.bp / DUR);
      else if (F.dbl){ F.dbl = 0; F.bp = -0.055; }
      else F.bp = null;
    }
    F.blink = b;
    /* micro-saccades every 0.3-1.6s, fast damping */
    F.st -= dt;
    if (F.st <= 0){ F.sx = (K.rnd() * 2 - 1) * 0.13; F.sy = (K.rnd() * 2 - 1) * 0.07; F.st = 0.3 + K.rnd() * 1.3; }
    F.ex = CHR_damp(F.ex, F.sx + K.eyeLead, 26, dt);
    F.ey = CHR_damp(F.ey, F.sy + K.eyePitchLead, 26, dt);
    if (K.lod >= 1){ K.eyes.rotation.set(F.ey, F.ex, 0); }   /* must match the build's eye merge */
    else { K.eyeR.rotation.set(F.ey, F.ex, 0); K.eyeL.rotation.set(F.ey, F.ex, 0); }

    /* mood targets */
    var brT = 0, jwT = 0.012, sq = 0;
    if (mood === 'focused'){ brT = -0.30; sq = 0.14; }
    else if (mood === 'surprised'){ brT = 1.00; jwT = 0.17; }
    else if (mood === 'pleased'){ brT = 0.40; jwT = 0.03; }
    brT += 0.07 * Math.sin(F.t * 0.63 + K.seed * 7);
    F.br = CHR_damp(F.br, brT, 7, dt);
    F.jw = CHR_damp(F.jw, jwT + 0.006 * Math.sin(F.t * 0.9 + K.seed * 3), 8, dt);
    K.jaw.rotation.x = F.jw;
    if (K.lod < 2){
      K.brows.position.y = K.browY + F.br * 0.010 * K.height;
      K.brows.rotation.x = -F.br * 0.20;
    }
    /* lids: caps swing on the eyeball's own axis, so they track its curvature */
    var close = CHR_clamp(b + sq, 0, 1);
    K.lidU.rotation.x = -0.20 + close * 1.22 + F.ey * 0.55;
    if (K.lod < 1) K.lidD.rotation.x = 0.10 - close * 0.30 + F.ey * 0.22;
  }

  /* ===================================================================== */
  /*  poseLibrary — writes goals into S (root-local space)                  */

   concave slope profile, eaves that flip up, corners that sweep higher still. */

  var flip=o.flip, cl=o.corner, pw=o.pw, gable=o.gable;

    var s=mx(u,v);
    var y=o.h*pow(1-s,pw);                       // concave dish: steep at ridge, flat at eave
    var e=smooth(0.60,1.0,s); y+=flip*e*e;       // the eave lifts

/* closed roof shell: top sheet, soffit underneath, fascia band around the rim */
function roofShell(o){

  var pos=[],uv=[],idx=[],i,j,x,z,y,N=(sx+1)*(sz+1),k;

  for(j=0;j<sz;j++)for(i=0;i<sx;i++){ var a=j*(sx+1)+i,b=a+1,c=a+sx+1,e=c+1;
    idx.push(a,c,b, b,c,e);                                  // top, +Y
    idx.push(N+a,N+b,N+c, N+b,N+e,N+c); }                    // soffit, -Y
  var per=[],cum=0;
  for(i=0;i<sx;i++) per.push(i);                             // z = -hd edge, walking +x
  for(j=0;j<sz;j++) per.push(j*(sx+1)+sx);                   // x = +hw edge, walking +z
  for(i=sx;i>0;i--) per.push(sz*(sx+1)+i);                   // z = +hd edge, walking -x
  for(j=sz;j>0;j--) per.push(j*(sx+1));                      // x = -hw edge, walking -z

/* ---------- MACHIYA: the townhouse generator (5 archetypes share one frame) ---------- */
function machiya(p){
  var w=p.w, d=p.d, kura=(p.type==='kura'), two=p.storeys>1;
  var f1=kura?3.4:3.05, f2=2.45, H=two?f1+f2:f1, y0=0.52;
  var M0=T(p.x,0,p.z,0,p.rot,0);

  /* timber frame: corner posts, intermediate posts, nageshi rails */
  var ps=0.23, i,n,xx;
  for(var sx=-1;sx<=1;sx+=2)for(var sz=-1;sz<=1;sz+=2)
    add('wood', BX(ps,H,ps), mul(M0,T(sx*(w*0.5-0.02),y0+H*0.5,sz*(d*0.5-0.02))), wd,0);
  n=mx(1,Math.round(w/1.75));
  for(i=1;i<n;i++){ xx=(i/n-0.5)*w;
    for(var s2=-1;s2<=1;s2+=2) add('wood', BX(0.17,H,0.1), mul(M0,T(xx,y0+H*0.5,s2*(d*0.5+0.02))), wd,0); }
  n=mx(1,Math.round(d/1.75));
  for(i=1;i<n;i++){ var zz=(i/n-0.5)*d;
    for(var s3=-1;s3<=1;s3+=2) add('wood', BX(0.1,H,0.17), mul(M0,T(s3*(w*0.5+0.02),y0+H*0.5,zz)), wd,0); }
  var rails=two?[y0+f1,y0+H-0.12]:[y0+H-0.12];
  if(!two) rails.push(y0+1.05);
  for(var r=0;r<rails.length;r++){ var ry=rails[r];

  add('wood', BX(w+0.16,0.2,d+0.16,(w+d)*0.5,0.3), mul(M0,T(0,y0+H+0.06,0)), wd,0);   // head beam

  /* front elevation: doorway, noren, step, shoji; sides get shoji too */
  var fz=d*0.5, dw=mn(1.35,w*0.42), dh=2.15, xd=(w>3.6)? sr(-w*0.18,w*0.18):0;
  if(!kura){
    add('wood', BX(dw,dh,0.1,dw,dh), mul(M0,T(xd,y0+dh*0.5,fz-0.06)), C('#1f1711'),0);
    add('wood', BX(0.14,dh+0.2,0.22), mul(M0,T(xd-dw*0.5-0.07,y0+(dh+0.2)*0.5,fz+0.03)), C('#4a3827'),0);
    add('wood', BX(0.14,dh+0.2,0.22), mul(M0,T(xd+dw*0.5+0.07,y0+(dh+0.2)*0.5,fz+0.03)), C('#4a3827'),0);
    add('wood', BX(dw+0.34,0.2,0.26), mul(M0,T(xd,y0+dh+0.2,fz+0.04)), C('#4a3827'),0);
    noren(mul(M0,T(xd,y0+dh-0.05,fz+0.1)), dw-0.06, 0.95, spick(CLOTHS), 3);
    add('stone', BX(dw+0.55,0.19,0.72), mul(M0,T(xd,0.59,fz+0.42)), C('#8f8a80'),0);
    for(var ws=-1;ws<=1;ws+=2){ var wx=xd+ws*(dw*0.5+0.95);

  if(d>3.4&&!kura){ for(var sd=-1;sd<=1;sd+=2)
    shoji(mul(M0,T(sd*(w*0.5+0.05),y0+1.45,sr(-d*0.2,d*0.2),0,sd*PI*0.5,0)), mn(1.5,d*0.3),1.3,true); }

  /* second storey: shoji band and sometimes a slatted balcony */
  if(two){
    var bw=w*0.78;
    for(var q=-1;q<=1;q+=2){ var bx=q*w*0.21; if(bw>1.2)
      shoji(mul(M0,T(bx,y0+f1+1.25,fz+0.05)), mn(1.5,w*0.33),1.3,true); }
    if(p.balcony){
      add('wood', BX(bw,0.14,1.0), mul(M0,T(0,y0+f1+0.07,fz+0.44)), wd,0);
      for(var bi=0;bi<5;bi++) add('wood', beam(V3((bi/4-0.5)*bw,y0+f1-0.02,fz+0.9),V3((bi/4-0.5)*bw,y0+f1-0.7,fz+0.05),0.055,0.05,4), M0, wd,0);
      railingRun(mul(M0,T(0,y0+f1+0.14,fz+0.9)), bw, 0.85, 0.9);
      railingRun(mul(M0,T(-bw*0.5,y0+f1+0.14,fz+0.47,0,PI*0.5,0)), 0.92, 0.85, 0.9);
      railingRun(mul(M0,T( bw*0.5,y0+f1+0.14,fz+0.47,0,PI*0.5,0)), 0.92, 0.85, 0.9);
    }
  }

  /* roof, then eave lanterns */
  var rh=0.55+(w+d)*0.125, gab=(!kura)&&(p.gable);

  if(!kura){ for(var ls=-1;ls<=1;ls+=2){ if(sr(0,1)>0.45){

      chochin(mul(M0,T(lx,ly-0.3,fz+0.35)), 0.17,0.4, spick(['#ffcf8a','#ff9f6a','#ffe0a8']), 0.5);
      var cw=cos(p.rot), sw=sin(p.rot);
      ctx.lanternPositions.push(V3(p.x+lx*cw+(fz+0.35)*sw, ly-0.5, p.z-lx*sw+(fz+0.35)*cw));
  }}}

  /* archetype extras */
  if(p.type==='shopWide'){
    awning(mul(M0,T(0,y0+2.55,fz+0.04)), w*0.86, 1.25, spick(CLOTHS), 0.06);
    for(var ci=0;ci<3;ci++) crate(mul(M0,T(-w*0.35+ci*0.78, 0.82+(ci===1?0.6:0), fz+1.0,0,sr(-0.4,0.4),0)), 0.6, spick(['#8a6a48','#9c7a52','#6f563a']));
    barrel(mul(M0,T(w*0.36,0.52,fz+1.05)), 0.3,0.72);
    nobori(mul(M0,T(-w*0.5-0.45,0.5,fz+0.9)), 2.5, 0.42, spick(CLOTHS));
  } else if(p.type==='shopNarrow'){
    nobori(mul(M0,T(w*0.5+0.35,0.5,fz+0.5)), 2.3, 0.38, spick(CLOTHS));
    crate(mul(M0,T(-w*0.3,0.82,fz+0.75,0,sr(-0.5,0.5),0)), 0.55, '#8a6a48');

    var lz=fz-0.4, lw=mn(2.6,w*0.7);                                 // lean-to shed
    add('wood', BX(lw,2.1,0.12), mul(M0,T(-w*0.5-1.1,1.55,lz-1.0,0,PI*0.5,0)), wd,0);
    for(var lp=-1;lp<=1;lp+=2) add('wood', BX(0.16,2.2,0.16), mul(M0,T(-w*0.5-1.7,1.6,lz-1.0+lp*lw*0.5)), wd,0);
    add('roof', BX(1.9,0.12,lw+0.5,2,2), mul(M0,T(-w*0.5-1.0,2.72,lz-1.0,0,0,0.26)), C('#4a4035'),0);
    barrel(mul(M0,T(-w*0.5-1.5,0.5,lz-1.6)), 0.32,0.78);
    for(var wi=0;wi<5;wi++) add('bark', CY(0.11,0.12,1.5,6), mul(M0,T(-w*0.5-1.1,0.62+ (wi%3)*0.24, lz-0.3+Math.floor(wi/3)*0.26,0,0,PI*0.5)), C('#5c452f'),0);

    add('stone', BX(0.86,0.16,0.86), mul(M0,T(chx,y0+H+1.9,-d*0.5+0.4)), C('#696660'),0);
    var cc=cos(p.rot), cs=sin(p.rot);

  } else if(p.type==='residence'){

  ctx.occupied.push({x:p.x, z:p.z, r:mx(w,d)*0.62+1.0});
