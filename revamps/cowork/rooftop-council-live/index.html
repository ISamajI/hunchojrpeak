}

/* ---------- TERRAIN ---------- */
var POND=V3(44,0,-18), PONDR=8.5;
function streamX(z){ return 44+3.2*sin((z+18)*0.08)-(z+18)*0.12; }        // the outflow creek
function streamMask(x,z){
  if(z<-9.5||z>32) return 0;
  var dx=abs(x-streamX(z))/2.9; if(dx>1) return 0;
  return (1-dx*dx)*smooth(0,1,clamp((z+9.5)/3,0,1));
}
function roadMask(x,z){
  var dc=sq(x*x+z*z), m=1-smooth(12.6,15.6,dc);                           // plaza disc
  if(z>8) m=mx(m, 1-smooth(4.6,6.4,abs(x)));
  if(abs(x)>8) m=mx(m, 1-smooth(4.4,6.2,abs(z)));
  return clamp(m,0,1);
}
function groundH(x,z){
  var dc=sq(x*x+z*z);
  var y=(fbm(x*0.0125+3.1, z*0.0125+7.7, 4)-0.5)*30*smooth(44,130,dc);    // distant hills
  y+=(fbm(x*0.075+11.0, z*0.075+2.0, 2)-0.5)*0.75*smooth(12,38,dc)*(1-roadMask(x,z));
  y+=43*smooth(0,1,clamp((-z-25)/27,0,1));                                // mountain mass behind the cliff
  var dp=sq((x-44)*(x-44)+(z+18)*(z+18));                                 // pond bowl
  y-=2.9*pow(clamp(1-dp/(PONDR+1.2),0,1),0.75);
  y-=1.35*streamMask(x,z);                                                // creek channel
  return y;
}
/* ground sheet, plaza, roads, pond lip and creek bed */
function buildTerrain(){
  add('ground', gridXZ(340,340,128,128,groundH,0.22,0.22), null, C('#55602f'),0);
  var disc=new THREE.CircleBufferGeometry(13.6,72); disc.rotateX(-PI*0.5); uvScale(disc,15,15);
  add('cobble', disc, T(0,0.07,0), C('#9a948a'),0);

  add('stone', ring, T(0,0.085,0), C('#7d786f'),0);
  var road=function(w,l,m){ var g=PL(w,l,0.5,0.5); g.rotateX(-PI*0.5); add('cobble', g, m, C('#948e84'),0); };
  road(9.4,54, T(0,0.065,38));                                            // the main road, running +Z
  road(8.6,50, T(37,0.065,0));                                            // east road
  road(8.6,50, T(-37,0.065,0));                                           // west road
  road(6.2,16, T(0,0.065,-19.5));                                         // short lane toward the cliff stair
  for(var i=0;i<34;i++){                                                  // kerb stones along the main road
    var zz=12+i*1.55; for(var s=-1;s<=1;s+=2)
      add('stone', BX(0.42,0.26,1.3,0.5,0.4), T(s*4.9+sr(-0.05,0.05), 0.12, zz,0,sr(-0.1,0.1),0), C('#8b867d'),0);
  }
  var lip=new THREE.TorusBufferGeometry(PONDR+0.35,0.72,7,54); uvScale(lip,3,1);
  add('stone', lip, T(POND.x,-0.42,POND.z,PI*0.5,0,0), C('#7f7a72'),0);   // pond rim
  for(var b=0;b<26;b++){ var a=b/26*TAU+sr(-0.08,0.08), rr=PONDR+sr(0.5,2.4), s2=sr(0.5,1.5);
    add('stone', blob(s2*0.72,0.5,b*2.1), T(POND.x+cos(a)*rr, sr(-0.25,0.35), POND.z+sin(a)*rr, sr(0,1),sr(0,6),sr(0,1)), C('#817d76'),0); }
  for(var c=0;c<40;c++){ var zz2=-9+c*1.05, xx2=streamX(zz2);             // creek bank stones
    for(var sd=-1;sd<=1;sd+=2) add('stone', blob(sr(0.22,0.52),0.6,c+sd), T(xx2+sd*sr(1.5,2.2), groundH(xx2+sd*2,zz2)+0.1, zz2, sr(0,1),sr(0,6),sr(0,1)), C('#8a867e'),0); }
  ctx.occupied.push({x:POND.x,z:POND.z,r:PONDR+1.5});
}

/* ---------- VILLAGE ---------- */
function faceTo(x,z,tx,tz){ return Math.atan2(tx-x, tz-z); }              // local +Z looks at the target
function siteFree(x,z,r){
  var dc=sq(x*x+z*z); if(dc<14.5+r) return false;
  if(dc>70) return false;
  if(z>6 && abs(x)<5.4+r*0.55) return false;
  if(abs(x)>9 && abs(z)<5.2+r*0.55) return false;
  if(z<-18.5) return false;
  if(abs(x-streamX(z))<4.2 && z>-10 && z<32) return false;
  var px=x-POND.x, pz=z-POND.z; if(px*px+pz*pz<(13+r)*(13+r)) return false;
  for(var i=0;i<ctx.occupied.length;i++){ var o=ctx.occupied[i], dx=x-o.x, dz=z-o.z;
    if(dx*dx+dz*dz<(o.r+r)*(o.r+r)) return false; }
  return true;
}
var ARCH=['shopNarrow','shopNarrow','shopWide','residence','residence','workshop','workshop','kura'];
function houseSpec(type){
  var p={type:type, storeys:1, balcony:false, gable:sr(0,1)<0.3};
  if(type==='shopNarrow'){ p.w=sr(3.3,4.4); p.d=sr(4.2,6.0); p.storeys=sr(0,1)<0.6?2:1; }
  else if(type==='shopWide'){ p.w=sr(5.6,7.6); p.d=sr(4.6,6.4); p.storeys=sr(0,1)<0.45?2:1; }
  else if(type==='residence'){ p.w=sr(4.6,6.6); p.d=sr(5.0,7.0); p.storeys=2; p.balcony=sr(0,1)<0.7; }
  else if(type==='workshop'){ p.w=sr(4.8,6.4); p.d=sr(5.0,6.6); p.storeys=1; }
  else { p.w=sr(3.8,5.0); p.d=sr(4.2,5.4); p.storeys=1; p.gable=false; }
  if(p.storeys>1&&p.balcony===false&&sr(0,1)<0.35) p.balcony=true;
  return p;
}
/* a row of townhouses down one side of a street */
function street(axis,side,from,to,offset){
  var t=from, built=0;
  while(t<to&&built<14){
    var p=houseSpec(spick(ARCH));
    var half=p.w*0.5+sr(0.35,0.95);
    if(t+half>to) break;
    t+=half;
    if(axis==='z'){ p.x=side*(offset+p.d*0.5); p.z=t; p.rot=faceTo(p.x,p.z,0,p.z); }
    else          { p.z=side*(offset+p.d*0.5); p.x=t*(axis==='xneg'?-1:1); p.rot=faceTo(p.x,p.z,p.x,0); }
    p.rot+=sr(-0.05,0.05);
    machiya(p); built++;
    t+=half;
  }
  return built;
}
/* torii gate: two battered pillars, kasagi with a curved top, shimaki and nuki */

/* small arched bridge: curved deck planks, railings, stone abutments */
function bridge(M,span,wid){
  var N=14,i,wc=C('#6b4f36');
  for(i=0;i<N;i++){ var f0=i/N, f1=(i+1)/N, y0=sin(f0*PI)*0.95, y1=sin(f1*PI)*0.95;

var CLIFF_W=160, CLIFF_H=42;
function cliffFace(terr){
  return function(x,y){
    var z=-21.4;
    z-=3.6*fbm(x*0.028+5.0, y*0.045+1.3, 4);                                // broad bulges
    z-=0.55*sin(y*0.78+fbm(x*0.05,y*0.02,2)*3.4)*(0.5+0.5*fbm(x*0.02,y*0.01,2)); // strata
    z-=1.3*pow(abs(sin(x*0.21+fbm(x*0.01,y*0.04,2)*2.6)),8);                 // vertical fractures
    z-=0.35*fbm(x*0.22, y*0.26, 3);                                          // fine rubble
    z+=2.4*smooth(26,40,y);                                                  // the upper face leans out
    var dw=abs(x-44)/5.2;                                                    // carved waterfall chute
    if(dw<1) z-=(1-dw*dw)*(2.9*smooth(0,1,clamp(y/4,0,1))-1.1*smooth(27,33,y));
    z-=2.0*smooth(6,0,clamp(y,0,6));
    for(var i=0;i<terr.length;i++){ var t=terr[i];
      var kx=1-smooth(t.w*0.5-0.4, t.w*0.5+1.5, abs(x-t.x));
      var ky=(1-smooth(3.3,4.3,y-t.y))*smooth(-1.1,-0.1,y-t.y);
      var k=kx*ky; if(k>0.001) z=lerp(z, t.zBack-0.45, k);                   // alcove pushed into the face
      var kl=kx*(1-smooth(4.2,5.6,y-t.y))*smooth(3.1,3.9,y-t.y);
      if(kl>0.001) z=lerp(z, t.zFront+0.55, kl);                             // lintel brow above it
    }
    return z;
  };
}

  var LX=-25.5, RX=-19.5;                                                     // switchback stair up the face

    for(j=0;j<terr.length;j++) if(abs(terr[j].y-gy)<0.6){ row.push(terr[j]);

    if(lo>hi){ lo=-21.7; hi=21.7; }

/* ---------- NATURE ---------- */
var BARKS=['#4f3a28','#5c452f','#43321f','#6b513a'];

var AMBERS=['#a85f28','#c07a2e','#8f4a22','#b86a2c','#d08a3a'];

/* sway that is zero at the anchor and rises to amp at the free end */
function swayFn(y0,y1,amp,pw){ pw=pw||1.4; return function(x,y){ return pow(clamp((y-y0)/mx(y1-y0,0.001),0,1),pw)*amp; }; }
/* recursive limb: 3 levels, each child shorter, thinner and angled off its parent */
function branchOut(p0,dir,len,rad,depth,bc,leaf){
  var p1=p0.clone().addScaledVector(dir,len);
  add('bark', beam(p0,p1,rad,rad*0.66,depth>1?7:5), null, bc,0);
  if(depth<=0){ leaf(p1,rad); return; }
  var n=depth>=2?3:2, ax=V3(0,1,0).cross(dir);
  if(ax.lengthSq()<1e-5) ax=V3(1,0,0); ax.normalize();
  for(var i=0;i<n;i++){
    var d2=dir.clone().applyAxisAngle(ax, sr(0.38,0.78));
    d2.applyAxisAngle(dir, (i/n)*TAU+sr(-0.45,0.45));
    if(d2.y<0.1) d2.y=0.1+sr(0,0.2);
    d2.normalize();
    branchOut(p1,d2,len*sr(0.58,0.76),rad*0.64,depth-1,bc,leaf);
  }
}
/* five genuinely different species */
function makeTree(x,y,z,s,type){
  s=s||1; type=type||'pine';

    var th=sr(5.2,7.4)*s, lean=sr(-0.16,0.16), top=y+th;
    var prev=V3(x,y,z);

      add('bark', beam(prev,p,0.3*s*(1-f*0.6)+0.06, 0.3*s*(1-(f+0.25)*0.6)+0.05, 7), null, bc,0); prev=p; }
    var nc=4+Math.round(sr(0,1.4));
    for(i=0;i<nc;i++){ var cf=0.3+i/nc*0.68, cy=y+th*cf, cr=(2.3-1.6*cf)*s*sr(0.85,1.15), ch=(2.0-0.9*cf)*s;
      var cg=warp(CO(cr,ch,11), function(px,py,pz){ var n2=fbm(px*1.6+i, pz*1.6+i, 2)-0.5;
        return [px*(1+n2*0.45), py+n2*0.3, pz*(1+n2*0.45)]; });
      add('foliage', cg, T(x+lean*th*cf*cf+sr(-0.3,0.3)*s, cy+ch*0.3, z+lean*0.6*th*cf*cf+sr(-0.3,0.3)*s, sr(-0.1,0.1),sr(0,TAU),sr(-0.1,0.1)),
          C(spick(GREENS)), swayFn(y, top, 0.5)(0, cy+ch*0.3)); }
  } else if(type==='maple'||type==='blossom'){

    add('bark', beam(V3(x,y,z),V3(x,y+bh*0.42,z),0.36*s,0.3*s,8), null, bc,0);

    branchOut(V3(x,y+bh*0.42,z), V3(sr(-0.12,0.12),1,sr(-0.12,0.12)).normalize(), bh*0.72, 0.3*s, 2, bc,
      function(p,r){ var k=3; for(j=0;j<k;j++){ nb++;
        var bx=p.x+sr(-0.7,0.7)*s, by=p.y+sr(-0.2,0.6)*s, bz=p.z+sr(-0.7,0.7)*s;
        var col=(type==='blossom')? spick(PINKS) : (sr(0,1)<0.28? spick(AMBERS) : spick(GREENS));
        add('foliage', blob(sr(0.75,1.25)*s,0.5,nb*1.3), T(bx,by,bz,sr(0,1),sr(0,6),sr(0,1)), C(col), swayFn(y,top2,0.62)(0,by)); } });
    if(type==='blossom'){ for(i=0;i<14;i++) add('foliage', BX(0.15*s,0.02,0.15*s,1,1),
        T(x+sr(-2.2,2.2)*s, y+sr(1.2,3.6)*s, z+sr(-2.2,2.2)*s, sr(0,TAU),sr(0,TAU),sr(0,TAU)), C(spick(PINKS)), 0.8); }
  } else if(type==='bamboo'){

      var tilt=sr(-0.1,0.1), tp=y+ch2, sf=swayFn(y,tp,0.95,1.3);

      for(j=0;j<nseg;j++){ var sy0=y+ch2*j/nseg, sy1=y+ch2*(j+1)/nseg, tf=j/nseg;

                         cr2*(1-tf*0.35), cr2*(1-(tf+1/nseg)*0.35), 7), null, C(spick(['#7d9a4a','#8fa855','#6d8a40'])), sf(0,sy0));
        add('bark', TOR(cr2*1.22,cr2*0.3,4,8), T(cx+tilt*ch2*tf*tf, sy1, cz+tilt*0.5*ch2*tf*tf, PI*0.5,0,0), C('#9aa86a'), sf(0,sy1)); }
      for(j=0;j<7;j++){ var ly=y+ch2*sr(0.62,0.99), la=sr(0,TAU), lr=sr(0.3,0.95)*s;

            T(lx,ly,lz, sr(-0.4,0.4), la, -0.5+sr(-0.3,0.3)), C(spick(['#5d8a3a','#6f9a44','#4d7a32'])), sf(0,ly)); }
    }

    for(i=0;i<9;i++){ var ba=i/9*TAU+sr(-0.2,0.2), bl=sr(1.6,2.8)*s;

          prev2=cur2; } } }
  }

/* a mossy boulder with a flat-ish bedded look */

function bush(x,y,z,s){

function natureFree(x,z,r){
  var dc=sq(x*x+z*z); if(dc<14.6+r) return false;
  if(z>7&&abs(x)<5.6+r) return false;
  if(abs(x)>9&&abs(z)<5.4+r) return false;
  if(z<-19.5) return false;
  if(abs(x-streamX(z))<2.6+r&&z>-10&&z<32) return false;
  for(var i=0;i<ctx.occupied.length;i++){ var o=ctx.occupied[i], dx=x-o.x, dz=z-o.z;
    if(dx*dx+dz*dz<(o.r+r)*(o.r+r)) return false; }
  return true;
}
function buildNature(){

    rock(x, -0.9+sr(0,0.6), z, sr(0.5,1.6), i*3.1); }
  for(i=0;i<9;i++){ a=sr(0,TAU); r2=PONDR+sr(2.5,6.5);

    if(z>-19.5) makeTree(x,groundH(x,z),z,sr(0.9,1.3),'bamboo'); }
  for(i=0;i<4;i++){ var gx=spick([-34,34,-48,26,52]), gz=spick([14,-8,30,-14,40]); // bamboo groves
    for(var b=0;b<5;b++){ x=gx+sr(-4,4); z=gz+sr(-4,4);
      if(natureFree(x,z,2.2)) makeTree(x,groundH(x,z),z,sr(0.85,1.25),'bamboo'); } }
  for(i=0;i<170;i++){                                                          // the main tree scatter

async function runTask(b,text,manual){
  b.busy=true;

var PL=KIT.poseLibrary,_lk=V3(),_ml=V3();
var IDLE_B=['rest','sip','stretch','lean','phone','chat','rest'];
var IDLE_S=['rest','sip','stretch','lean','phone','type','rest','chat'];
function drivePose(a,t,dt){
  var S=a.S,b=a.branch,st=a.status;
  var look=null,stand=0,yaw=0,rootZ=0;
  a.poseT+=dt;
  a.holdMug=0;
  if(st==='building'||st==='fixing'){
    PL.type(S,t,st==='fixing'?1.35:1);
    if(Math.sin(t*.45+a.seed)>.6)PL.mouse(S,t,1);
    look=a.desk.grp.localToWorld(_lk.copy(SCREEN_LOCAL)).clone()}
  else if(st==='planning'){
    PL.type(S,t,.8);
    if(Math.sin(t*.5+a.seed)>.2&&a.holo){look=a.desk.grp.localToWorld(_lk.set(0,1.56,.12)).clone()}
    else look=a.desk.grp.localToWorld(_lk.copy(SCREEN_LOCAL)).clone()}
  else if(st==='reviewing'){
    PL.mouse(S,t,1);PL.lean(S,t);
    look=a.desk.grp.localToWorld(_lk.copy(SCREEN_LOCAL)).clone();
    look.x+=Math.sin(t*.33+a.seed)*.1;look.y+=Math.sin(t*.8)*.05}
  else if(st==='assigning'){
    stand=1;rootZ=-.38;if(b.targetYaw!==undefined)yaw=b.targetYaw;
    var th=t-a.throwT;
    if(th>=0&&th<1.1)PL.throw(S,t,clamp(th/1.1,0,1));
    else PL.point(S,t,_ml.set(0,1.3,1.4));
    look=b.targetPoint?b.targetPoint.clone():null}
  else if(st==='celebrate'){
    stand=1;rootZ=-.38;PL.celebrate(S,t);
    look=a.desk.grp.localToWorld(_lk.set(0,2.8,1.6)).clone()}
  else if(st==='waiting'){
    PL.rest(S,t);
    var o=null,i;for(i=0;i<ORBS.length;i++)if(ORBS[i].mission===b.mission){o=ORBS[i];break}
    look=o?o.pos.clone():(b.targetPoint?b.targetPoint.clone():null)}
  else{
    if(!a.idle||t>a.idle.until){
      var kinds=a.kind==='branch'?IDLE_B:IDLE_S;
      a.idle={kind:pick(kinds),start:t,until:t+rand(4,8)}}
    var k=a.idle.kind,pr=(t-a.idle.start)/(a.idle.until-a.idle.start);
    if(k==='rest'){PL.rest(S,t);
      look=a.desk.grp.localToWorld(_lk.copy(SCREEN_LOCAL)).clone();
      look.x+=Math.sin(t*.25+a.seed)*1.6;look.y+=.35}
    else if(k==='type'){PL.type(S,t,.65);look=a.desk.grp.localToWorld(_lk.copy(SCREEN_LOCAL)).clone()}
    else if(k==='stretch'){PL.stretch(S,t,pr);
      look=a.K.head.localToWorld(_lk.set(0,.9,.5)).clone()}
    else if(k==='lean'){PL.lean(S,t);yaw=Math.sin(t*.5+a.seed)*.22;
      look=a.desk.grp.localToWorld(_lk.set(0,1.9,1.2)).clone()}
    else if(k==='phone'){PL.phone(S,t);
      look=a.K.root.localToWorld(_lk.set(0,.98,.34)).clone()}
    else if(k==='chat'){
      yaw=(a.seed%2<1?1:-1)*.65;PL.point(S,t,_ml.set(yaw>0?.7:-.7,1.15,.55));
      look=a.K.root.localToWorld(_lk.set(yaw>0?1.6:-1.6,1.25,.7)).clone()}
    else if(k==='sip'){
      var mw=a.desk.grp.localToWorld(_lk.copy(a.desk.mugRest));mw.y+=.05;
      a.K.root.worldToLocal(mw);PL.sip(S,t,pr,mw);
      a.holdMug=(pr>.18&&pr<.82)?1:0;
      look=a.desk.grp.localToWorld(_ml.copy(SCREEN_LOCAL)).clone()}
  }
  /* catching an incoming orb overrides the hand */
  if(a.catchOrb){
    var cl=a.catchOrb.pos.clone();a.K.root.worldToLocal(cl);
    PL['catch'](S,t,clamp(a.catchOrb.t,0,1),cl);
    look=a.catchOrb.pos.clone();
    if(a.catchOrb.t>.55)a.mood='surprised'}
  S.stand=damp(S.stand===undefined?0:S.stand,stand,3.4,dt);
  S.yaw=damp(S.yaw||0,yaw,2.4,dt);
  S.rootZ=damp(S.rootZ||0,rootZ,3.4,dt);
  a.desk.yaw.rotation.y=damp(a.desk.yaw.rotation.y,S.yaw*.85,3,dt);
  return look}

  }
  if(Q.diag){
    var d=document.createElement('pre');
    d.style.cssText='position:fixed;left:14px;bottom:170px;z-index:40;background:rgba(0,0,0,.84);'+
      'color:#9fe8a0;font:10px/1.35 monospace;padding:9px 11px;border-radius:6px;max-width:62vw;'+
      'max-height:52vh;overflow:auto;white-space:pre-wrap;pointer-events:none';
    document.body.appendChild(d);
    setInterval(function(){
      var tris=0,meshes=0,lines=[];
      scene.traverse(function(o){
        if(o.isMesh&&o.geometry&&o.geometry.index){meshes++;tris+=o.geometry.index.count/3}
        else if(o.isMesh&&o.geometry&&o.geometry.attributes.position){meshes++;tris+=o.geometry.attributes.position.count/3}});
      var bn=Object.keys(MERGED),k;
      for(k=0;k<bn.length;k++){var mm=MERGED[bn[k]];
        lines.push(bn[k]+' '+((mm.geometry.index?mm.geometry.index.count/3:0)|0)+'t vis='+mm.visible)}
      var ri=renderer.info.render;
      d.textContent=
        'CALLS '+ri.calls+'  TRIS '+ri.triangles+'  frame '+ri.frame+'\n'+
        'canvas css '+renderer.domElement.clientWidth+'x'+renderer.domElement.clientHeight+
        '  buf '+renderer.domElement.width+'x'+renderer.domElement.height+'\n'+
        'stageKids '+$('#stage').children.length+'  dpr '+renderer.getPixelRatio()+'\n'+
        'sun.i '+ATM.sun.intensity.toFixed(2)+'  hemi.i '+ATM.hemi.intensity.toFixed(2)+'\n'+
        'sunPos '+ATM.sun.position.toArray().map(function(v){return v.toFixed(0)}).join(',')+'\n'+
        'exposure '+renderer.toneMappingExposure.toFixed(3)+'  tm '+renderer.toneMapping+'\n'+
        'composer '+(!!ATM.composer)+' stage '+RNAMES[RSTAGE]+' env '+(!!scene.environment)+'\n'+
        'fog '+(scene.fog?scene.fog.density.toFixed(4):'none')+'  bg '+(scene.background?'set':'null')+'\n'+
        'skyMesh vis '+(ATM.skyMesh?ATM.skyMesh.visible:'?')+' pos '+(ATM.skyMesh?ATM.skyMesh.position.toArray().map(function(v){return v.toFixed(0)}).join(','):'')+'\n'+
        'cam '+camera.position.toArray().map(function(v){return v.toFixed(1)}).join(',')+' fov '+camera.fov.toFixed(0)+'\n'+
        'paper.ei '+MATS.paper.emissiveIntensity.toFixed(2)+'  plasterMap '+(!!MATS.plaster.map)+'\n'+
        '--- scene ---\n'+
        'meshes '+meshes+'  tris '+(tris|0)+'\n'+
        'buckets '+bn.length+' of '+Object.keys(VALID_BUCKETS).length+'\n'+
        'hour '+ATM.state.hour.toFixed(2)+' night '+ATM.state.night.toFixed(2)+' day '+ATM.state.day.toFixed(2);
    },500)}
})();

window.__rc={AGENTS:AGENTS,BRANCHES:BRANCHES,DIR:DIR,ATM:ATM,camera:camera,scene:scene,MERGED:MERGED,MATS:MATS,
  renderer:renderer,newShot:newShot,setDirector:setDirector,runTask:runTask,KIT:KIT,
  snap:function(m){if(m)ATM.setMode(m)}};
var ld=$('#loader');ld.style.opacity='0';
setTimeout(function(){if(ld.parentNode)ld.parentNode.removeChild(ld)},1100);
})();
</script>

</body></html>
