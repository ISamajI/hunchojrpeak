<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HunchoStrat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">

<div class="app">
  <nav class="nav" id="nav" aria-label="Main">
    <button type="button" data-tab="home" aria-current="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      <i>Home</i>
    </button>
    <button type="button" data-tab="throw">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5h11a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 16v-6a1.5 1.5 0 0 1 1.5-1.5Z"/><path d="m15 12.5 5-3v7l-5-3Z"/><circle cx="8" cy="13" r="2.4"/></svg>
      <i>Film</i>
    </button>
    <button type="button" data-tab="mind">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a4 4 0 0 0-4 4 3.4 3.4 0 0 0-1.5 6.2V17a2.5 2.5 0 0 0 5 0"/><path d="M12 4.5a4 4 0 0 1 4 4 3.4 3.4 0 0 1 1.5 6.2V17a2.5 2.5 0 0 1-5 0"/><path d="M12 4.5V21"/></svg>
      <i>Mind</i>
    </button>
    <button type="button" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      <i>Stats</i>
    </button>
    <button type="button" data-tab="train">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6"/><path d="M7 6.5v11"/><path d="M17 6.5v11"/><path d="M20 9v6"/><path d="M7 12h10"/></svg>
      <i>Train</i>
    </button>
    <button type="button" data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5v-1a5.5 5.5 0 0 1 5.5-5.5h4a5.5 5.5 0 0 1 5.5 5.5v1"/></svg>
      <i>Me</i>
    </button>
  </nav>

  <div class="shell-col">
    <header class="topbar">
      <div class="wordmark">Huncho<span>Strat</span></div>
      <div class="topbar-id" id="topbarId"></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<script src="data.js"></script>
<script src="skills.js"></script>
<script src="app.js"></script>

</body></html>
