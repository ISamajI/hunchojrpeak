<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trap House Council</title>
<meta name="theme-color" content="#0d0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trap House">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&family=Permanent+Marker&family=Monoton&family=Bebas+Neue&display=swap">
<style>
:root{
  --ink:#0d0a14; --panel:rgba(16,12,24,.72); --solid:#171120; --line:rgba(255,79,163,.22);
  --text:#f4ead8; --dim:#a79cb4; --amber:#ff4fa3; --gold:#ffd25e; --busy:#6fc3ff; --warn:#ffcf6b; --hot:#ff6b7d;
  --disp:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --lft:env(safe-area-inset-left,0px); --rgt:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2;contain:strict}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;
  font:500 10.5px/1 var(--mono);color:var(--text);background:rgba(13,10,20,.66);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);
  border-left:3px solid var(--c);padding:4px 7px 4px 6px;border-radius:3px;display:flex;gap:6px;
  align-items:center;transition:opacity .25s,background .2s;will-change:transform}
.tag.branch{font:400 11.5px/1 var(--disp);letter-spacing:.04em;padding:5px 9px}
.tag .dot,.dotc{width:6px;height:6px;border-radius:50%;background:#675d75;flex:none}
.dot.on,.dotc.on{background:var(--busy);box-shadow:0 0 8px var(--busy);animation:pulse 1.6s infinite}
.dot.wait,.dotc.wait{background:var(--warn);box-shadow:0 0 7px var(--warn)}
@keyframes pulse{50%{opacity:.45}}
.tag.sel{background:var(--c);color:#120d1a;border-color:var(--c)}
.tag.sel .dot{background:#120d1a!important;box-shadow:none}

.hud{position:fixed;z-index:5;transition:opacity .45s ease}
body.clean .hud:not(.keep),body.clean #tags{opacity:0;pointer-events:none}
.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;font:500 11.5px/1 var(--mono);cursor:pointer;-webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--amber);color:var(--gold)}
.btn.on{background:var(--amber);color:#17100a;border-color:var(--amber);font-weight:600}
.btn:focus-visible,.tag:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button,select,input{font:inherit}

.plaque{top:calc(14px + var(--top));left:calc(14px + var(--lft));background:var(--panel);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:9px;padding:12px 15px;max-width:min(340px,calc(100vw - 28px))}
.plaque h1{margin:0;font:400 20px/1 var(--disp);letter-spacing:.07em;color:var(--gold)}
.plaque .sub{margin-top:7px;font:11px/1.45 var(--mono);color:var(--dim)}
.stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.chip{font:500 10.5px/1 var(--mono);padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);font-variant-numeric:tabular-nums}
.chip b{color:var(--gold);font-weight:600}

.views{top:calc(14px + var(--top));right:calc(14px + var(--rgt));display:flex;gap:6px;flex-wrap:wrap;
  justify-content:flex-end;max-width:min(330px,calc(100vw - 28px))}

.feed{right:calc(14px + var(--rgt));top:calc(104px + var(--top));width:296px;background:var(--panel);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:9px;display:flex;flex-direction:column;max-height:38vh;overflow:hidden}
.feed header{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.feed h2{margin:0;font:400 12px/1 var(--disp);letter-spacing:.09em;color:var(--amber)}
.feed ol{list-style:none;margin:0;padding:6px 0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.feed li{display:grid;grid-template-columns:38px 1fr;gap:6px;padding:5px 12px;font-size:12.5px;
  line-height:1.38;animation:slide .4s ease}
.feed li time{font:10px/1.7 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.feed li b{color:var(--c);font-weight:700}
.feed li.done{background:linear-gradient(90deg,rgba(255,207,107,.1),transparent)}
.feed.closed ol{display:none}
@keyframes slide{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

.send{left:calc(14px + var(--lft));bottom:calc(14px + var(--bot));background:var(--panel);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:9px;padding:11px;display:flex;gap:6px;flex-wrap:wrap;width:min(430px,calc(100vw - 28px))}
.send label{width:100%;font:400 11px/1 var(--disp);letter-spacing:.09em;color:var(--amber)}
.send select,.send input{background:var(--solid);color:var(--text);border:1px solid rgba(255,255,255,.13);
  border-radius:5px;padding:9px;font-size:13px;min-width:0}
.send select{flex:0 0 122px}.send input{flex:1 1 150px}

.card{right:calc(14px + var(--rgt));bottom:calc(14px + var(--bot));width:296px;background:var(--solid);
  border:1px solid var(--line);border-top:3px solid var(--c);border-radius:9px;padding:15px;
  box-shadow:0 18px 50px rgba(0,0,0,.5)}
.card h3{margin:0;font:400 19px/1.12 var(--disp);letter-spacing:.03em}
.card .role{font:11px/1.45 var(--mono);color:var(--dim);margin-top:5px}
.card .status{display:inline-flex;margin-top:11px;gap:7px;align-items:center;font:500 11.5px/1 var(--mono);
  padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06)}
.card .task{margin:11px 0 0;font-size:14px;line-height:1.45}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.card .x{position:absolute;top:9px;right:10px;background:none;border:0;color:var(--dim);font-size:21px;
  cursor:pointer;line-height:1;padding:2px 6px}
.note{font:10px/1.45 var(--mono);color:var(--dim);margin-top:9px}

.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:4;pointer-events:none;
  transition:height .7s cubic-bezier(.22,.7,.2,1)}
.bar.t{top:0}.bar.b{bottom:0}
body.director .bar{height:6vh}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4;transition:opacity .3s}
.lower{left:50%;transform:translateX(-50%);bottom:calc(7.4vh + var(--bot));text-align:center;
  pointer-events:none;opacity:0;width:min(600px,calc(100vw - 28px));transition:opacity .4s}
body.director .lower{opacity:1}
.lower .eye{font:600 10px/1 var(--mono);letter-spacing:.2em;color:var(--gold);text-transform:uppercase;
  display:inline-flex;gap:8px;align-items:center}
.lower .eye i{width:7px;height:7px;border-radius:50%;background:#ff4457;box-shadow:0 0 10px #ff4457;animation:rec 1.5s infinite}
@keyframes rec{50%{opacity:.2}}
.lower .who{font:400 clamp(19px,3.1vw,30px)/1.1 var(--disp);letter-spacing:.04em;margin-top:7px;
  text-shadow:0 3px 22px rgba(0,0,0,.75)}
.lower .what{font:500 13.5px/1.42 var(--body);color:#e9ddc9;margin-top:5px;text-shadow:0 2px 12px rgba(0,0,0,.85)}
body.director .send{opacity:0;pointer-events:none}
body.director .card,body.director .feed{opacity:0;pointer-events:none}

#loader{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 62%,#3a0d3e 0%,#08060c 72%);
  display:grid;place-items:center;transition:opacity 1s ease}
#loader .in{text-align:center;padding:0 24px}
#loader h2{margin:0;font:400 clamp(22px,5vw,30px)/1 var(--disp);letter-spacing:.14em;color:var(--gold)}
#loader .tag2{font:500 10px/1 var(--mono);letter-spacing:.3em;color:var(--dim);margin-top:10px;text-transform:uppercase}
#loader p{font:12px/1.5 var(--mono);color:var(--dim);margin:20px 0 0;min-height:18px}
#loader .track{width:min(240px,70vw);height:2px;background:rgba(255,255,255,.1);margin:14px auto 0;border-radius:2px;overflow:hidden}
#loader .track span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--gold));transition:width .35s ease}
#err{position:fixed;left:14px;right:14px;top:calc(12px + var(--top));z-index:30;background:#54141f;color:#fff;
  font:11.5px/1.45 var(--mono);padding:10px 12px;border-radius:6px}
#toast{position:fixed;left:50%;top:calc(16px + var(--top));transform:translateX(-50%);z-index:9;
  background:var(--solid);border:1px solid var(--line);padding:9px 13px;border-radius:6px;
  font:11.5px/1.3 var(--mono);opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100vw - 28px)}
#install{left:50%;transform:translateX(-50%);bottom:calc(14px + var(--bot));display:none}

@media (max-width:820px){
  .plaque{padding:9px 12px;border-radius:8px}
  .plaque h1{font-size:15px}.plaque .sub{font-size:10px}.plaque .note{display:none}
  .plaque .stats{gap:4px}.chip{font-size:9.5px;padding:5px 7px}
  .views{top:auto;bottom:calc(118px + var(--bot));left:calc(14px + var(--lft));right:calc(14px + var(--rgt));
    max-width:none;justify-content:flex-start}
  .feed{top:auto;bottom:calc(250px + var(--bot));left:calc(14px + var(--lft));right:calc(14px + var(--rgt));
    width:auto;max-height:22vh}
  .card{left:calc(14px + var(--lft));right:calc(14px + var(--rgt));width:auto;z-index:7}
  .send{width:auto;right:calc(14px + var(--rgt))}
  .tag.sub{display:none}
  body.director .views{bottom:calc(7.4vh + 10px + var(--bot))}
  body.director .lower{bottom:calc(7.4vh + 140px + var(--bot))}
}
@media (prefers-reduced-motion:reduce){
  .feed li{animation:none}.bar{transition:none}.dot.on,.dotc.on{animation:none}.lower .eye i{animation:none}
}
[hidden]{display:none!important}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.bub{position:absolute;left:0;top:0;opacity:0;white-space:nowrap;font:700 12.5px/1 var(--body);color:#17100a;
  background:#fff6e4;border-radius:12px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.45);will-change:transform}
.bub:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff6e4}
.bub.pop{animation:bubpop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes bubpop{from{scale:.4}to{scale:1}}
#game{left:calc(14px + var(--lft));top:150px;width:min(340px,calc(100vw - 28px));background:var(--panel);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
#game .gtop{display:flex;align-items:center;gap:10px}
#game .gcash{font:400 19px/1 var(--disp);color:var(--gold);letter-spacing:.02em;font-variant-numeric:tabular-nums}
#game .gcash small{font:600 10px/1 var(--mono);color:var(--dim);margin-right:3px}
#game .gvibe{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
#game .gvibe i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#002D62,#ff4fa3,#ffd25e);transition:width .4s}
#game .gvn{font:600 9.5px/1 var(--mono);color:var(--dim);letter-spacing:.08em;min-width:52px;text-align:right}
#game .gbtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
#game .gbtns .btn{padding:8px 10px;font-size:11px}
#gQpanel{margin-top:9px}
#gQlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#gQlist li{display:flex;justify-content:space-between;gap:8px;font:12px/1.3 var(--body);padding:5px 8px;border-radius:5px;background:rgba(255,255,255,.04)}
#gQlist li b{font:600 10.5px/1.3 var(--mono);color:var(--gold)}
#gQlist li.done{opacity:.55;text-decoration:line-through}
.gfloat{position:absolute;left:14px;top:4px;font:600 12px/1 var(--mono);color:#7dffb0;pointer-events:none;animation:gfl 1.4s ease-out forwards}
.gfloat.neg{color:var(--hot)}
@keyframes gfl{to{transform:translateY(-26px);opacity:0}}
#gEvent{left:50%;transform:translateX(-50%);top:calc(64px + var(--top));z-index:8;background:#2a0d1a;border:1px solid var(--hot);
  border-radius:9px;padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
  width:max-content;max-width:calc(100vw - 28px);box-shadow:0 12px 40px rgba(0,0,0,.6);animation:slide .4s ease}
#gEvent p{margin:0;font:700 13.5px/1.35 var(--body)}
.gmeter{display:flex;align-items:center;gap:8px;margin-top:10px;font:600 9.5px/1 var(--mono);color:var(--dim);letter-spacing:.08em}
.gmeter i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.gmeter b{display:block;height:100%;background:linear-gradient(90deg,#CE1126,#ffd25e,#7dffb0)}
.gacts .btn{padding:8px 9px;font-size:11px}
.btn:disabled{opacity:.42;cursor:default}
.btn.on:disabled{opacity:1}
#domo{position:fixed;inset:0;z-index:12;background:rgba(8,6,12,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:calc(12px + var(--top)) max(12px,var(--rgt)) calc(12px + var(--bot)) max(12px,var(--lft))}
.dpanel{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--solid);border:1px solid var(--line);border-top:3px solid var(--gold);
  border-radius:11px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dpanel header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dpanel h2{margin:0;font:400 20px/1 var(--disp);color:var(--gold);letter-spacing:.08em}
.dsc{display:flex;gap:10px;flex:1;font:600 12px/1 var(--mono);flex-wrap:wrap}.dsc b{color:var(--gold);font-size:15px}
.dim{color:var(--dim);font:11px/1.4 var(--mono);margin:0}
.dopp{display:flex;gap:6px;flex-wrap:wrap}
.dopp span{font:500 11px/1 var(--mono);padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.06)}
.dopp span.on{background:var(--amber);color:#17100a}
.dboard{background:radial-gradient(ellipse at 50% 40%,#8a5630,#6a3a1e);border:6px solid #3d220f;border-radius:10px;min-height:120px;
  padding:14px 10px;display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.dt{display:inline-flex;background:linear-gradient(160deg,#fffaf0,#e8dcc4);border-radius:4px;box-shadow:0 2px 0 #b8a888,0 3px 6px rgba(0,0,0,.4);flex:none}
.dt i{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:3px;gap:1px}
.dt b{border-radius:50%}.dt b.p{background:#1a1414}
.dt.h{width:44px;height:22px}.dt.h i{width:50%;height:100%}.dt.h i+i{border-left:1px solid #9a8a70}
.dt.v{flex-direction:column;width:30px;height:58px}.dt.v i{height:50%;width:100%}.dt.v i+i{border-top:1px solid #9a8a70}
.dt.v.sm{width:22px;height:44px}
.dt.end{outline:2px solid var(--gold);outline-offset:1px}
.dmsg{margin:0;text-align:center;font:700 14px/1.35 var(--body);min-height:19px;color:var(--gold)}
.dhand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dtb{background:none;border:0;padding:4px;border-radius:7px;cursor:pointer;transition:transform .15s}
.dtb:disabled{opacity:.45;cursor:default}
.dtb.ok{box-shadow:0 0 0 2px var(--amber)}.dtb.ok:hover{transform:translateY(-4px)}
.dtb.sel{transform:translateY(-6px);box-shadow:0 0 0 2px var(--gold)}
.dhint{text-align:center}
.dside{justify-content:center}
@media (max-width:820px){
  #game{padding:8px 10px}#game .gcash{font-size:16px}#game .gbtns .btn{padding:7px 8px;font-size:10.5px}
  .dt.v{width:26px;height:50px}.dt.h{width:36px;height:18px}.dt.v.sm{width:18px;height:36px}
}
</style>

<div id="stage"></div>
<div id="tags"></div>
<div class="bar t"></div><div class="bar b"></div>
<div id="fade"></div>
<div id="toast" role="status"></div>
<div id="err" hidden></div>

<div id="loader"><div class="in">
  <h2>TRAP HOUSE COUNCIL</h2>
  <div class="tag2">Sukynomi · Peak Ave</div>
  <p id="loadMsg">Pulling up to the block…</p>
  <div class="track"><span id="loadBar"></span></div>
</div></div>

<section class="hud plaque" aria-label="Headquarters status">
  <h1>THE TRAP</h1>
  <div class="sub"><span id="clock">--:--</span> · 8 crews · 24 members · <span id="skyLabel">live sky</span></div>
  <div class="stats">
    <span class="chip">working <b id="sWork">0</b></span>
    <span class="chip">in flight <b id="sFly">0</b></span>
    <span class="chip">shipped <b id="sShip">0</b></span>
  </div>
  <div class="note">Tap your crew to send missions. Tap the girls on the roof to give orders.</div>
</section>

<nav class="hud views keep" aria-label="Camera and scene controls">
  <button class="btn on" id="dirBtn">Director</button>
  <button class="btn" data-view="block">Block</button>
  <button class="btn" data-view="council">Council</button>
  <button class="btn" data-view="upstairs">Upstairs</button>
  <button class="btn" data-view="roof">Roof</button>
  <button class="btn" id="skyBtn">Sky: Live</button>
  <button class="btn" id="qualBtn">Quality</button>
  <button class="btn" id="cleanBtn">Hide UI</button>
</nav>

<aside class="hud feed" id="feed">
  <header><h2>MISSION LOG</h2><button class="btn" id="feedBtn" style="padding:5px 9px">Hide</button></header>
  <ol id="log"></ol>
</aside>

<form class="hud send" id="sendForm" autocomplete="off">
  <label for="taskText">SEND A MISSION</label>
  <select id="taskBranch" aria-label="Which branch"></select>
  <input id="taskText" placeholder="e.g. Build the Time Out On Pine menu page" maxlength="80">
  <button class="btn on" type="submit">Send</button>
</form>

<div class="hud card" id="card" hidden></div>
<div id="bubbles"></div>
<section class="hud" id="game" aria-label="Juego">
  <div class="gtop"><span class="gcash"><small>RD$</small><b id="gCash">0</b></span><span class="gvibe"><i id="gVibe"></i></span><span class="gvn" id="gVibeN">VIBE</span></div>
  <div class="gbtns">
    <button class="btn on" id="gDom">Dominó</button><button class="btn" id="gRonda">Ronda · RD$300</button>
    <button class="btn" id="gSub">Súbele</button><button class="btn" id="gQ">Objetivos</button><button class="btn" id="gSnd">Sonido</button>
  </div>
  <div id="gQpanel" hidden><ol id="gQlist"></ol></div>
</section>
<div class="hud" id="gEvent" hidden><p></p><button class="btn on"></button></div>
<div id="domo" hidden></div>

<div class="hud lower" id="lower">
  <div class="eye"><i></i><span id="lEye">LIVE</span></div>
  <div class="who" id="lWho"></div>
  <div class="what" id="lWhat"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =============================================================================
   mod_tex.js — procedural canvas texture library for a Japanese mountain village
   Three.js r128, global THREE, no modules, no external images.
   Public surface: buildTextures(THREE)  +  helpers prefixed TEX_
   ========================================================================== */

/* ---------------------------------------------------------------- utilities */

function TEX_canvas(w, h) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function TEX_clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

function TEX_ss(e0, e1, x) {            // smoothstep
  var t = (x - e0) / (e1 - e0);
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  return t * t * (3 - 2 * t);
}

/* deterministic 0..1 stream, xorshift32 */
function TEX_rng(seed) {
  var s = (seed | 0) || 0x9e3779b9;
  return function () {
    s ^= s << 13; s |= 0;
    s ^= s >>> 17;
    s ^= s << 5; s |= 0;
    return (s >>> 8) / 16777216;
  };
}

/* integer lattice hash (imul keeps everything in int32 range) */
function TEX_hashi(ix, iy, seed) {
  var h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(seed | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return h >>> 0;
}
function TEX_hash2(ix, iy, seed) { return TEX_hashi(ix, iy, seed) * 2.3283064365386963e-10; }

/* PERIODIC value noise. x,y are lattice coords; the lattice wraps at exactly
   (px,py), so calling pnoise(u*px, v*py, px, py) over u,v in [0,1) is seamless. */
function TEX_pnoise(x, y, px, py, seed) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var x0 = xi % px; if (x0 < 0) x0 += px;
  var y0 = yi % py; if (y0 < 0) y0 += py;
  var x1 = x0 + 1; if (x1 >= px) x1 = 0;
  var y1 = y0 + 1; if (y1 >= py) y1 = 0;
  var u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
  var v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  var a = TEX_hash2(x0, y0, seed), b = TEX_hash2(x1, y0, seed);
  var c = TEX_hash2(x0, y1, seed), e = TEX_hash2(x1, y1, seed);
  var ab = a + (b - a) * u, ce = c + (e - c) * u;
  return ab + (ce - ab) * v;
}

/* anisotropic periodic fbm: every octave doubles BOTH frequency and period,
   so the whole stack still wraps at u,v = 1. Integer freqs only. */
function TEX_pfbm2(u, v, fx, fy, oct, seed, gain) {
  var amp = 1, sum = 0, nrm = 0, ax = fx, ay = fy;
  for (var o = 0; o < oct; o++) {
    sum += amp * TEX_pnoise(u * ax, v * ay, ax, ay, seed + o * 1013);
    nrm += amp; amp *= gain; ax *= 2; ay *= 2;
  }
  return sum / nrm;
}
function TEX_pfbm(u, v, f, oct, seed) { return TEX_pfbm2(u, v, f, f, oct, seed, 0.5); }

/* Low-frequency fbm layers are cached on a coarse NxN grid and resampled with
   a wrapped, smoothstepped bilinear fetch: visually identical for base freq
   <= 8 while costing a fraction of a full per-pixel fbm. C1 continuous, so it
   leaves no grid creases in height fields derived from it. */
function TEX_fbmGrid(N, f, oct, seed) {
  var g = new Float32Array(N * N), inv = 1 / N;
  for (var j = 0; j < N; j++) {
    for (var i = 0; i < N; i++) g[j * N + i] = TEX_pfbm(i * inv, j * inv, f, oct, seed);
  }
  return g;
}
function TEX_grid(g, N, u, v) {
  var x = u * N, y = v * N;
  var xi = x | 0, yi = y | 0;
  var fx = x - xi, fy = y - yi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  var x1 = xi + 1; if (x1 >= N) x1 = 0;
  var y1 = yi + 1; if (y1 >= N) y1 = 0;
  var r0 = yi * N, r1 = y1 * N;
  var a = g[r0 + xi], b = g[r0 + x1], c = g[r1 + xi], e = g[r1 + x1];
  var t = a + (b - a) * fx, w = c + (e - c) * fx;
  return t + (w - t) * fy;
}

/* PERIODIC worley. x,y in cell units [0,cells); out = [F1,F2,cellId,fx,fy]. */
var TEX_WOUT = [0, 0, 0, 0, 0];
function TEX_worley(x, y, cells, seed, out) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var f1 = 1e9, f2 = 1e9, id = 0, bx = 0, by = 0;
  for (var j = -1; j <= 1; j++) {
    for (var i = -1; i <= 1; i++) {
      var gx = xi + i, gy = yi + j;
      var wx = gx % cells; if (wx < 0) wx += cells;
      var wy = gy % cells; if (wy < 0) wy += cells;
      var hh = TEX_hashi(wx, wy, seed);               // both offsets from one hash
      var fxp = gx + 0.13 + 0.74 * ((hh & 0xffff) * 1.52587890625e-5);
      var fyp = gy + 0.13 + 0.74 * ((hh >>> 16) * 1.52587890625e-5);
      var dx = fxp - x, dy = fyp - y;
      var dd = Math.sqrt(dx * dx + dy * dy);
      if (dd < f1) { f2 = f1; f1 = dd; id = wy * cells + wx; bx = fxp; by = fyp; }
      else if (dd < f2) { f2 = dd; }
    }
  }
  out[0] = f1; out[1] = f2; out[2] = id; out[3] = bx; out[4] = by;
}

/* interleaved-gradient dither in [-0.5,0.5], added to 8-bit values to kill banding */
function TEX_dither(i, j) {
  var t = i * 0.06711056 + j * 0.00583715;
  t = 52.9829189 * (t - Math.floor(t));
  return (t - Math.floor(t)) - 0.5;
}

/* height field (0..1) -> greyscale bump canvas, real-world range, never 0/255 */
function TEX_bumpCanvas(h, W, H) {
  var cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  for (var j = 0; j < H; j++) {
    for (var i = 0; i < W; i++) {
      var idx = j * W + i, p = idx * 4;
      var v = h[idx]; v = v < 0 ? 0 : (v > 1 ? 1 : v);
      var g = 13 + v * 229 + TEX_dither(i, j) * 1.2;
      d[p] = g; d[p + 1] = g; d[p + 2] = g; d[p + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/* height field -> tangent-space normal map canvas (GL green-up).
   Image row j grows downward while V grows upward, so ny = +dh/dj. Wrapped
   central differences keep the normal map as seamless as the height. */
function TEX_normalCanvas(h, W, H, strength) {
  var cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  for (var j = 0; j < H; j++) {
    var jm = (j - 1 + H) % H, jp = (j + 1) % H;
    var row = j * W, rm = jm * W, rp = jp * W;
    for (var i = 0; i < W; i++) {
      var im = (i - 1 + W) % W, ip = (i + 1) % W;
      var dx = (h[row + ip] - h[row + im]) * strength;
      var dy = (h[rp + i] - h[rm + i]) * strength;
      var nx = -dx, ny = dy;
      var inv = 1 / Math.sqrt(nx * nx + ny * ny + 1);
      var p = (row + i) * 4;
      d[p] = (nx * inv * 0.5 + 0.5) * 255 + TEX_dither(i, j);
      d[p + 1] = (ny * inv * 0.5 + 0.5) * 255 + TEX_dither(i, j);
      d[p + 2] = (inv * 0.5 + 0.5) * 255;
      d[p + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/* canvas -> configured THREE.Texture. srgb only for colour data. */
function TEX_mkTex(THREE, canvas, srgb) {
  var t = new THREE.CanvasTexture(canvas);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.anisotropy = 8;
  if (srgb && THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  if (!t.userData) t.userData = {};
  t.userData.size = (canvas.width === canvas.height) ? canvas.width : (canvas.width + 'x' + canvas.height);
  t.needsUpdate = true;
  return t;
}

/* ------------------------------------------------------------- 1. plaster */
/* Shikkui lime wall: warm off-white, trowel mottling, downward rain staining
   that strengthens toward the bottom, hairline cracks, dirt at the base. */
function TEX_buildPlaster(THREE) {
  var W = 512, H = 512, cv = TEX_canvas(W, H), ctx = cv.getContext('2d');

  /* hairline cracks drawn into a mask, kept well inside the tile so the
     texture still wraps; sampled per-pixel below for both colour and height */
  var mk = TEX_canvas(W, H), mc = mk.getContext('2d');
  mc.fillStyle = '#000'; mc.fillRect(0, 0, W, H);
  mc.strokeStyle = '#fff'; mc.lineCap = 'round';
  var rnd = TEX_rng(9173);
  for (var k = 0; k < 5; k++) {
    var x = 70 + rnd() * (W - 140), y = 70 + rnd() * (H - 140);
    var ang = (k & 1) ? 1.35 + (rnd() - 0.5) * 0.8 : -0.25 + (rnd() - 0.5) * 0.8;
    mc.lineWidth = 0.7 + rnd() * 0.8;
    mc.beginPath(); mc.moveTo(x, y);
    var segs = 12 + (rnd() * 12 | 0);
    for (var s = 0; s < segs; s++) {
      ang += (rnd() - 0.5) * 0.85;
      var nx2 = x + Math.cos(ang) * (5 + rnd() * 9);
      var ny2 = y + Math.sin(ang) * (5 + rnd() * 9);
      if (nx2 < 26 || nx2 > W - 26 || ny2 < 26 || ny2 > H - 26) break;
      x = nx2; y = ny2; mc.lineTo(x, y);
    }
    mc.stroke();
  }
  var md = mc.getImageData(0, 0, W, H).data;

  var img = ctx.createImageData(W, H), d = img.data;
  var hgt = new Float32Array(W * H);
  var gTrowel = TEX_fbmGrid(128, 5, 3, 311);
  for (var j = 0; j < H; j++) {
    var v = j / H;
    var vb = v * v;                                   // rain bias toward the bottom
    var baseDirt = TEX_ss(0.87, 1.0, v);
    for (var i = 0; i < W; i++) {
      var u = i / W, idx = j * W + i, p = idx * 4;
      var trowel = TEX_grid(gTrowel, 128, u, v) - 0.5; // broad trowel sweeps
      var swirl = TEX_pnoise(u * 13, v * 13, 13, 13, 313) - 0.5;
      var fine = TEX_pnoise(u * 96, v * 96, 96, 96, 733) - 0.5;
      var smask = TEX_pnoise(u * 22, v * 2, 22, 2, 979);
      var onset = TEX_clamp01((v - 0.10 - 0.55 * smask) * 2.2) * vb * 1.6;
      var st = TEX_pnoise(u * 56, v * 4, 56, 4, 977);
      var streak = TEX_clamp01(st * 1.35 - 0.26);
      streak = streak * streak * onset * (0.45 + 0.9 * smask);   // vertical rain stains
      var crack = md[p] * (1 / 255);
      var dirt = baseDirt * (0.5 + 0.5 * TEX_pnoise(u * 18, v * 9, 18, 9, 41));
      var sh = 1 + trowel * 0.10 + swirl * 0.055 + fine * 0.05 - streak * 0.15 - dirt * 0.17 - crack * 0.26;
      var dth = TEX_dither(i, j);
      d[p] = 231 * sh - streak * 12 - dirt * 10 + dth;
      d[p + 1] = 224 * sh - streak * 7 - dirt * 8 + dth;
      d[p + 2] = 207 * sh - streak * 1 - dirt * 1 + dth;
      d[p + 3] = 255;
      hgt[idx] = 0.56 + trowel * 0.30 + swirl * 0.18 + fine * 0.13 - crack * 0.52 - dirt * 0.06;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { map: TEX_mkTex(THREE, cv, true), bumpMap: TEX_mkTex(THREE, TEX_bumpCanvas(hgt, W, H), false) };
}

/* ----------------------------------------------------------- 2. kawara tile */
/* Pantile courses: pan + barrel cross-section, half-barrel row offset, baked
   barrel highlight, overlap shadow under each course, per-tile colour jitter,
   moss settled in the valleys of some tiles, lichen speckle. Hero texture. */
function TEX_buildKawara(THREE, P, seed) {
  var W = 512, H = 512, cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  var hgt = new Float32Array(W * H);
  var ROWS = 6, COLS = 6, PI = Math.PI;
  var loR = P.lo[0], loG = P.lo[1], loB = P.lo[2];
  var dR = P.hi[0] - loR, dG = P.hi[1] - loG, dB = P.hi[2] - loB;
  var kPan = -0.09 * PI / 0.62, kBar = -0.80 * (2 / 0.38);
  var gSoil = TEX_fbmGrid(128, 3, 3, seed + 77);

  for (var j = 0; j < H; j++) {
    var v = j / H;
    var fv = v * ROWS, row = fv | 0, ry = fv - row;
    var off = (row & 1) * 0.5;
    var lap = TEX_ss(0.0, 0.13, ry);                  // 0 = tucked under the course above
    var ao = 0.22 + 0.78 * lap;
    var bq = (ry - 0.955); var butt = Math.exp(-bq * bq * 900) * 0.16;  // lit butt edge
    for (var i = 0; i < W; i++) {
      var u = i / W, idx = j * W + i, p = idx * 4;
      var fu = u * COLS + off, cf = Math.floor(fu), fx = fu - cf;
      var col = cf % COLS; if (col < 0) col += COLS;
      var tid = row * COLS + col;

      var hc, nx;                                     // cross-section + its slope d/dfx
      if (fx < 0.62) {                                // shallow dished pan
        var a = fx * (1 / 0.62);
        hc = 0.22 - 0.09 * Math.sin(PI * a); nx = kPan * Math.cos(PI * a);
      } else {                                        // semicircular barrel
        var cb = (fx - 0.62) * (2 / 0.38) - 1;
        var rt = Math.sqrt(1.0001 - cb * cb);
        hc = 0.22 + 0.80 * rt; nx = kBar * cb / rt;
      }
      var gn = 1 / Math.sqrt(nx * nx + 1);            // Lambert, key light from upper left
      var ndl = (0.62 * nx + 0.78) * gn; if (ndl < 0) ndl = 0;
      var s2 = ndl * ndl, s4 = s2 * s2;
      var spec = s4 * s4 * 0.34;                      // tight sheen along the barrel
      var hao = 0.52 + 0.48 * TEX_clamp01(hc * 1.2);  // valleys sit in their own shadow
      var cq = fx - 0.62; if (cq < 0) cq = -cq;
      var crev = 1 - TEX_ss(0.0, 0.055, cq);          // crevice where pan meets barrel
      var sd = (fx < 0.5 ? fx : 1 - fx) * 22.0;       // lap line between adjacent pantiles
      var seam = sd < 1 ? (1 - sd) * (1 - sd) : 0;

      var jv = TEX_hash2(tid, 11, seed) - 0.5;
      var jh = TEX_hash2(tid, 29, seed) - 0.5;
      var grain = TEX_pnoise(u * 160, v * 160, 160, 160, seed + 3) - 0.5;
      var weath = TEX_pnoise(u * 120, v * 9, 120, 9, seed + 9) - 0.5;
      var soil = TEX_grid(gSoil, 128, u, v) - 0.5;    // large-scale soiling across the roof
      var grime = (1 - TEX_clamp01(hc * 1.3)) * (0.42 + 0.58 * TEX_clamp01(soil * 2 + 0.5));

      var lum = (0.10 + 0.80 * ndl) * hao * (1 + jv * 0.13) * ao
              * (1 - 0.34 * seam) * (1 - 0.26 * crev) * (1 - 0.17 * grime) * (1 + soil * 0.17)
              + spec + butt + weath * 0.06 + grain * 0.05;
      if (lum < 0) lum = 0; else if (lum > 1.15) lum = 1.15;

      var r = loR + dR * lum + jh * 11;
      var g = loG + dG * lum + jh * 4;
      var bl = loB + dB * lum - jh * 10;

      var mt = TEX_hash2(tid, 57, seed), moss = 0;
      if (mt > 0.50) {                                 // moss only on some tiles
        var valley = 1 - TEX_ss(0.30, 0.64, fx);
        var mf = TEX_pfbm(u, v, 20, 2, seed + 21);
        moss = TEX_clamp01((mf - 0.45) * 3.4) * valley * TEX_ss(0.12, 0.70, ry) * ((mt - 0.50) * 2);
        if (moss > 0) {
          var mv = 0.78 + 0.55 * grain;
          r += (74 * mv - r) * moss; g += (94 * mv - g) * moss; bl += (48 * mv - bl) * moss;
        }
      }
      var li = TEX_pnoise(u * 205, v * 205, 205, 205, seed + 33);
      if (li > 0.875) {                                // sparse pale lichen specks
        var lk = (li - 0.875) * 5.2 * TEX_clamp01((TEX_pnoise(u * 7, v * 7, 7, 7, seed + 44) - 0.35) * 2.2);
        r += (164 - r) * lk; g += (168 - g) * lk; bl += (150 - bl) * lk;
      }
      var dth = TEX_dither(i, j);
      d[p] = r + dth; d[p + 1] = g + dth; d[p + 2] = bl + dth; d[p + 3] = 255;
      hgt[idx] = 0.11 + hc * 0.78 * (0.42 + 0.58 * lap) + 0.05 * ry - 0.11 * seam + moss * 0.05 + grain * 0.05;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { map: TEX_mkTex(THREE, cv, true), bumpMap: TEX_mkTex(THREE, TEX_bumpCanvas(hgt, W, H), false) };
}

/* ------------------------------------------------------------- 3. cobble */
/* Plaza paving: periodic worley cells with rounded tops, deep mortar gaps,
   worn pale centres, damp dark patches, gravel grit down in the joints. */
function TEX_buildCobble(THREE) {
  var W = 512, H = 512, cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  var hgt = new Float32Array(W * H);
  var CELLS = 10, o = TEX_WOUT;
  var gWet = TEX_fbmGrid(128, 3, 3, 619), gTraf = TEX_fbmGrid(128, 2, 2, 733);

  for (var j = 0; j < H; j++) {
    var v = j / H;
    for (var i = 0; i < W; i++) {
      var u = i / W, idx = j * W + i, p = idx * 4;
      TEX_worley(u * CELLS, v * CELLS, CELLS, 5501, o);
      var e = o[1] - o[0], id = o[2];
      var m = e < 0.115 ? e * 8.6957 : 1;
      var dome = Math.sqrt(m);                       // rounded stone top
      var gap = 1 - TEX_ss(0.0, 0.045, e);           // 1 deep in the mortar joint
      var wear = m * m * m;                          // worn centre
      var ao = 0.30 + 0.70 * dome;

      var cj = TEX_hash2(id | 0, 3, 5501) - 0.5;
      var cw = TEX_hash2(id | 0, 13, 5501) - 0.5;
      var base = 124 + cj * 36;
      var wet = TEX_clamp01((TEX_grid(gWet, 128, u, v) - 0.46) * 2.6) * 0.26;
      var traffic = TEX_clamp01((TEX_grid(gTraf, 128, u, v) - 0.40) * 2.4);
      var grain = TEX_pnoise(u * 150, v * 150, 150, 150, 811) - 0.5;
      var grit = 0;
      if (gap > 0.25) {
        var gv = TEX_pnoise(u * 270, v * 270, 270, 270, 877);
        if (gv > 0.66) grit = (gv - 0.66) * 2.6 * gap;
      }
      var lit = ao * (1 - wet) + wear * traffic * 0.17 + grain * 0.035 + grit * 0.45;
      var dth = TEX_dither(i, j);
      d[p] = (base + cw * 16) * lit + dth;
      d[p + 1] = (base + cw * 5) * lit + dth;
      d[p + 2] = (base - cw * 11) * lit * 0.98 + dth;
      d[p + 3] = 255;
      hgt[idx] = 0.10 + dome * 0.72 - gap * 0.17 + (TEX_hash2(id | 0, 41, 5501) - 0.5) * 0.07
               + grain * 0.04 + grit * 0.08;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { map: TEX_mkTex(THREE, cv, true), bumpMap: TEX_mkTex(THREE, TEX_bumpCanvas(hgt, W, H), false) };
}

/* ------------------------------------------------- 4/5. wood (dark + light) */
/* Tangential grain: ring coordinate = across-plank position warped by low
   frequency periodic noise, which gives wandering cathedral arches. Plank
   seams every 1/6, optional knots that deflect the surrounding rings. */
function TEX_buildWood(THREE, O) {
  var W = 512, H = 512, cv = TEX_canvas(W, H), ctx = cv.getContext('2d');
  var img = ctx.createImageData(W, H), d = img.data;
  var hgt = new Float32Array(W * H);
  var PLANKS = 6, rings = O.rings, sd = O.seed, TAU = Math.PI * 2;
  var eR = O.early[0], eG = O.early[1], eB = O.early[2];
  var lR = O.late[0] - eR, lG = O.late[1] - eG, lB = O.late[2] - eB;
  var knots = O.knots;                                // array of [u,v,amp] or empty

  for (var j = 0; j < H; j++) {
    var v = j / H;
    var pf = v * PLANKS, pi = pf | 0, pv = pf - pi;
    var ps = pi * 0.3713;                             // per-plank grain phase
    var prings = rings * (0.82 + 0.40 * TEX_hash2(pi, 5, sd));   // boards differ in cut
    var sd2 = Math.min(pv, 1 - pv);
    var seam = 1 - TEX_ss(0.0, 0.030, sd2);           // plank joint
    for (var i = 0; i < W; i++) {
      var u = i / W, idx = j * W + i, p = idx * 4;
      var pu = u + ps;
      var big = TEX_pnoise(pu * 3, pv * 2, 3, 2, sd + 1) - 0.5;

        anG.push(box(0.040 * H * fw, 0.006 * H, 0.052 * H, shade(cShoe, 1.25), { p: [0, -0.008 * H, 0.030 * H], r: [-0.18, 0, 0] }));

    var K = {
      root: root, hips: hips, spine: spine, chest: chest, torso: torso,
      neck: neck, head: head, jaw: jaw,
      eyes: eyes, eyeR: eyeR, eyeL: eyeL,
      lids: { upper: lidU, lower: lidD }, lidU: lidU, lidD: lidD,

  /* ===================================================================== */
  /*  state helpers                                                        */
  /* ===================================================================== */
  function newState(seed){
    var S = {
      stand: 1, lean: 0, yaw: 0, rootZ: 0, chestYaw: 0, tilt: 0, bob: 0,
      seed: (seed == null ? 0 : seed) % 1000 / 1000,
      hand: [new THREE.Vector3(), new THREE.Vector3()],
      back: [new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 1, 0)],
      pole: [new THREE.Vector3(-1, -1, -0.4), new THREE.Vector3(1, -1, -0.4)],

  }
  function ensureState(S){
    if (!S.hand){ S.hand = [new THREE.Vector3(), new THREE.Vector3()]; if (S.useIK == null) S.useIK = false; }
    if (!S.back) S.back = [new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 1, 0)];
    if (!S.pole) S.pole = [new THREE.Vector3(-1, -1, -0.4), new THREE.Vector3(1, -1, -0.4)];
    if (!S.curl) S.curl = [0.25, 0.25];
    if (!S.wrist) S.wrist = [0, 0];
    if (!S.thumb) S.thumb = [0.2, 0.2];
    if (S.hy == null) S.hy = 0;

  /* ===================================================================== */
  /*  two-bone analytic IK (law of cosines, explicit basis, no lookAt)      */
  /* ===================================================================== */
  function solveArm(K, S, i, mInv){
    var A = K.arms[i], L1 = K.L1, L2 = K.L2;
    /* goal: root-local -> chest-local -> shoulder-relative */
    var g = SC.v1.copy(S.hand[i]).applyMatrix4(mInv).sub(A.sh.position);
    var d = g.length(), dir = SC.v2;
    if (d < 1e-6){ dir.set(0, -1, 0); d = 1e-6; } else dir.copy(g).divideScalar(d);
    var reach = L1 + L2, dMax = reach * 0.995, dMin = Math.abs(L1 - L2) + reach * 0.07;
    d = CHR_clamp(d, dMin, dMax);
    /* interior elbow angle -> bend away from straight */
    var cosE = CHR_clamp((L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2), -1, 1);
    var bend = PI - Math.acos(cosE);
    var cosA = CHR_clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
    var al = Math.acos(cosA), ca = Math.cos(al), sa = Math.sin(al);
    /* pole hint -> hinge axis n, in-plane vector b pointing toward the pole */
    var pv = SC.v3.copy(S.pole[i]);
    if (pv.lengthSq() < 1e-10) pv.set(A.xs * 0.5, -1, -0.4);
    pv.transformDirection(mInv);
    var n = SC.v4.crossVectors(dir, pv);
    if (n.lengthSq() < 1e-10){ pv.set(0, -1, 0); n.crossVectors(dir, pv);
      if (n.lengthSq() < 1e-10){ pv.set(0, 0, -1); n.crossVectors(dir, pv); } }
    n.normalize();
    var b = SC.v5.crossVectors(n, dir).normalize();
    /* upper-arm dir = dir rotated toward the pole by alpha; basis: x=-n, y=-ua, z=cosA*b-sinA*dir */
    var ua = SC.v6.copy(dir).multiplyScalar(ca).addScaledVector(b, sa);
    var zb = SC.v7.copy(b).multiplyScalar(ca).addScaledVector(dir, -sa).normalize();
    n.negate(); ua.negate();
    SC.m2.makeBasis(n, ua, zb);
    A.sh.quaternion.setFromRotationMatrix(SC.m2);
    A.el.rotation.set(bend, 0, 0);
    /* wrist roll: desired back-of-hand direction expressed in the forearm frame */
    var bk = SC.v8.copy(S.back[i]);
    if (bk.lengthSq() < 1e-10) bk.set(0, 1, 0);
    bk.transformDirection(mInv);
    SC.q2.setFromAxisAngle(SC.ax, bend);
    SC.q3.copy(A.sh.quaternion).multiply(SC.q2).conjugate();
    bk.applyQuaternion(SC.q3);
    var roll = 0;
    if (bk.x * bk.x + bk.z * bk.z > 1e-8) roll = CHR_clamp(Math.atan2(bk.x, bk.z), -2.3, 2.3);
    A.wr.rotation.set(CHR_clamp(S.wrist[i] || 0, -1.1, 1.1), roll, 0);
  }

  /* ===================================================================== */
  /*  applyRig                                                             */
  /* ===================================================================== */
  function applyRig(K, S, dt, lookTarget, walk){
    ensureState(S);
    dt = dt > 0 ? (dt > 0.1 ? 0.1 : dt) : 1e-4;
    K.t += dt;
    var t = K.t, H = K.height, sd = (S.seed == null ? K.seed : S.seed);
    var st = CHR_clamp(S.stand == null ? 1 : S.stand, 0, 1);
    var i, A, Lg, s;

    /* --- breathing (~14 bpm) + slow weight shift, both desynced by seed --- */
    var br = Math.sin(t * 1.466 + sd * 6.283);
    var sw1 = Math.sin(t * 0.37 + sd * 4.1), sw2 = Math.sin(t * 0.28 + sd * 2.3);

    /* --- walk cycle parameters ------------------------------------------- */
    var wk = 0, ph = 0, amp = 0, kAmp = 1;
    if (walk && walk.speed > 0.01){
      var v = walk.speed;
      var step = 0.42 * H * (0.55 + 0.45 * Math.min(v / 1.5, 1.5));   /* stride from speed */
      var cyc = v / (2 * step);
      ph = (walk.ph || 0) + dt * cyc * TAU;
      if (ph > TAU) ph -= TAU * Math.floor(ph / TAU);
      walk.ph = ph;
      wk = CHR_clamp(v / 0.5, 0, 1) * st;
      /* amp = asin(halfStep/legLen) exactly: foot travel per stance == body travel, so no skate */
      amp = Math.asin(CHR_clamp(step * 0.5 / K.legLen, -0.95, 0.95));
      kAmp = CHR_clamp(amp / 0.40, 0.4, 1.8);
    }

    /* --- legs: resolve joint angles first, the support leg sets the hip height --- */
    var hipPitch = CHR_lerp(0.13, -0.02, st);
    var LTm = 0.235 * H, LCm = 0.210 * H, support = 0;
    for (i = 0; i < 2; i++){
      var p = ph + (i === 0 ? 0 : PI), fwd = 0, kneeL = 0, ankle = 0;
      if (wk > 0.01){
        var q = CHR_wrapPh(p);                                    /* -pi/2 (toe-off) .. 1.5pi */
        fwd = CHR_stride(p);
        /* knee flexes only through swing (q in -pi/2..pi/2), fully extended at heel strike */
        var sw = q < HALFPI ? Math.max(0, Math.cos(q)) : 0;
        kneeL = (0.08 + 1.30 * Math.pow(sw, 1.2)) * kAmp;
        var toe = Math.max(0, -Math.sin(q + 0.30));               /* plantarflex at toe-off */
        ankle = (-0.20 * Math.max(0, Math.sin(q)) + 0.45 * toe * toe) * kAmp;
      }
      var tW = CHR_lerp(-1.52, -0.02, st) - amp * fwd * wk;       /* thigh angle in world */
      var kF = CHR_lerp(1.55, 0.05, st) + kneeL * wk;
      SC.a1[i] = tW; SC.a2[i] = kF; SC.a3[i] = CHR_lerp(-0.03, -0.02, st) + ankle * wk;
      var reachDown = LTm * Math.cos(tW) + LCm * Math.cos(tW + kF);

  /* ===================================================================== */
  /*  faceTick: blinks, saccades, brows, jaw                               */

    /* spontaneous blinks, 2-6s apart, occasional double */

      F.bt -= dt;

    }
    var b = 0;

    else if (mood === 'pleased'){ brT = 0.40; jwT = 0.035; smT = 1; loT = 0.55; sq = 0.04; }

    F.sm = CHR_damp(F.sm, smT, 6, dt);
    F.wd = CHR_damp(F.wd, wdT, 8, dt);
    F.kn = CHR_damp(F.kn, knT, 6, dt);
    F.lo = CHR_damp(F.lo, loT, 6, dt);
    F.jw = CHR_damp(F.jw, jwT + 0.004 * Math.sin(F.t * 0.9 + K.seed * 3), 8, dt);

      K.brows.position.y = K.browY + F.br * 0.0058 * K.height;
      K.brows.position.z = -Math.max(0, F.br) * 0.0012 * K.height;

      K.brows.scale.x = 1 - 0.07 * F.kn;

function TH_brick(seed,pal,mortar){

  D.msg=(D.turn===0?'Sales tú':D.names[D.turn]+' sale')+(D.force?' con el doble seis':'');
  DOM_render();DOM_next()}
function DOM_legal(p){var D=GAME.dom,h=D.hands[p],out=[];
  h.forEach(function(t,i){if(!D.chain.length){if(!D.force||(t[0]===6&&t[1]===6))out.push({i:i,sides:['R']});return}
    var s=[];if(t[0]===D.L||t[1]===D.L)s.push('L');if(t[0]===D.R||t[1]===D.R)s.push('R');if(s.length)out.push({i:i,sides:s})});return out}
function DOM_pips(h){return h.reduce(function(s,t){return s+t[0]+t[1]},0)}
function DOM_play(p,i,side){
  var D=GAME.dom,t=D.hands[p][i],cap=false;
  if(D.hands[p].length===1&&D.chain.length&&D.L!==D.R&&(t[0]===D.L||t[1]===D.L)&&(t[0]===D.R||t[1]===D.R))cap=true;
  D.hands[p].splice(i,1);
  if(!D.chain.length){D.chain.push([t[0],t[1]]);D.L=t[0];D.R=t[1]}
  else if(side==='L'){var o=t[1]===D.L?[t[0],t[1]]:[t[1],t[0]];D.chain.unshift(o);D.L=o[0]}
  else{var o2=t[0]===D.R?[t[0],t[1]]:[t[1],t[0]];D.chain.push(o2);D.R=o2[1]}
  D.force=false;D.passes=0;D.lastP=p;DOMTURN.who=p;DOMTURN.t=0;GAME.blip(180,.08);
  D.msg=(p===0?'Jugaste ':D.names[p]+' jugó ')+t[0]+'·'+t[1];
  if(!D.hands[p].length){DOM_end(p,cap,false);return}
  D.turn=(p+1)%4;DOM_render();DOM_next()}
function DOM_pass(p){var D=GAME.dom;D.passes++;D.msg=(p===0?'Tú':D.names[p])+': ¡Pase!';
  var g=CLUBBERS.filter(function(c){return c.kind==='domino'&&c.player===p})[0];if(g)GAME.say(g,'¡Pase!');
  if(D.passes>=4){var best=0,bv=99;for(var k=0;k<4;k++){var v=DOM_pips(D.hands[k]);if(v<bv||(v===bv&&k%2===0)){bv=v;best=k}}DOM_end(best,false,true);return}
  D.turn=(p+1)%4;DOM_render();DOM_next()}
function DOM_ai(p,moves){var D=GAME.dom,h=D.hands[p],best=null,bs=-1;
  moves.forEach(function(m){var t=h[m.i];m.sides.forEach(function(s){
    var end=!D.chain.length?t[1]:(s==='L'?(t[0]===D.L?t[1]:t[0]):(t[0]===D.R?t[1]:t[0]));
    var keep=h.filter(function(u,j){return j!==m.i&&(u[0]===end||u[1]===end)}).length;
    var sc=t[0]+t[1]+(t[0]===t[1]?5:0)+keep*2+Math.random();if(sc>bs){bs=sc;best={i:m.i,side:s}}})});return best}
function DOM_next(){
  var D=GAME.dom;if(D.result||D.paused)return;var p=D.turn,moves=DOM_legal(p);
  if(p===0){if(!moves.length){D.msg='No llevas. ¡Pase!';DOM_render();setTimeout(function(){if(!D.paused)DOM_pass(0)},1100)}else DOM_render();return}
  setTimeout(function(){if(D.paused||D.result||D.turn!==p)return;if(moves.length){var m=DOM_ai(p,moves);DOM_play(p,m.i,m.side)}else DOM_pass(p)},850+Math.random()*600)}
function DOM_end(p,cap,tranque){
  var D=GAME.dom,team=p%2,pts=0;for(var k=0;k<4;k++)pts+=DOM_pips(D.hands[k]);
  if(cap)pts+=30;D.score[team]+=pts;D.starter=p;D.first=false;
  var g=CLUBBERS.filter(function(c){return c.kind==='domino'&&c.player===p})[0];
  if(g){GAME.say(g,cap?'¡CAPICÚA!':tranque?'¡Tranque!':'¡Dominó!');g.cheer=2}
  var who=p===0?'Tú':D.names[p];
  D.result=(tranque?'Tranque · gana '+who+' con menos puntos':(cap?'¡CAPICÚA de '+who+'! (+30)':'Dominó de '+who))+' · '+(team===0?'Nosotros':'Ellos')+' +'+pts;
  if(team===0){GAME.quest('domino');GAME.cash(pts*5)}
  if(D.score[team]>=200){D.over=true;D.result+=team===0?' · ¡GANAMOS LA PARTIDA! +RD$1,000':' · Perdimos la partida';
    if(team===0){GAME.wins++;GAME.cash(1000)}}
  DOM_render()}
function DOM_render(){
  var D=GAME.dom,el=document.getElementById('domo'),moves=D.turn===0&&!D.result?DOM_legal(0):[],ok={};
  moves.forEach(function(m){ok[m.i]=m.sides});
  var h='<div class="dpanel"><header><h2>DOMINÓ</h2><div class="dsc"><span>Nosotros <b>'+D.score[0]+'</b></span><span>Ellos <b>'+D.score[1]+'</b></span><span class="dim">a 200</span></div><button class="btn" id="dClose">Cerrar</button></header>';
  h+='<div class="dopp">';[2,1,3].forEach(function(p){h+='<span class="'+(D.turn===p&&!D.result?'on':'')+'">'+(p===2?'Pareja ':'')+D.names[p]+' · '+D.hands[p].length+' fichas</span>'});h+='</div>';
  h+='<div class="dboard">';
  if(!D.chain.length)h+='<p class="dim">Mesa limpia</p>';
  D.chain.forEach(function(t,i){h+=DOM_tile(t[0],t[1],(t[0]===t[1]?'v sm':'h')+(i===0||i===D.chain.length-1?' end':''))});
  h+='</div><p class="dmsg">'+(D.result||D.msg||'')+'</p>';
  if(D.choose!=null)h+='<div class="row dside"><button class="btn on" data-s="L">◀ Izquierda ('+D.L+')</button><button class="btn on" data-s="R">Derecha ('+D.R+') ▶</button></div>';
  h+='<div class="dhand">';D.hands[0].forEach(function(t,i){h+='<button class="dtb'+(ok[i]?' ok':'')+(D.choose===i?' sel':'')+'" data-i="'+i+'"'+(ok[i]?'':' disabled')+' aria-label="ficha '+t[0]+' '+t[1]+'">'+DOM_tile(t[0],t[1],'v')+'</button>'});
  h+='</div>';
  if(D.result)h+='<div class="row" style="justify-content:center"><button class="btn on" id="dNext">'+(D.over?'Nueva partida':'Siguiente mano')+'</button></div>';
  else h+='<p class="dim dhint">'+(D.turn===0?'Te toca: toca una ficha que pegue':'Esperando a '+D.names[D.turn]+'…')+'</p>';
  el.innerHTML=h+'</div>';
  document.getElementById('dClose').onclick=DOM_close;
  var nx=document.getElementById('dNext');if(nx)nx.onclick=function(){if(D.over){GAME.dom=null;DOM_open()}else DOM_deal()};
  el.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){var i=+b.dataset.i,s=ok[i];if(!s)return;
    if(s.length===2&&D.L!==D.R){D.choose=i;DOM_render();return}D.choose=null;DOM_play(0,i,s[0])}});
  el.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){var i=D.choose;D.choose=null;DOM_play(0,i,b.dataset.s)}})}
document.getElementById('domo').addEventListener('click',function(e){if(e.target.id==='domo')DOM_close()});

/* ================= WARM-UP + LOOP ================= */
await stage('Reading the sky…',.9);
scene.updateMatrixWorld(true);
AGENTS.forEach(function(a){a.desk.screens.forEach(function(s){drawScreen(s,a,0)})});
try{renderer.compile(scene,camera)}catch(e){}
ATM.update(0,.016);
await stage('Unlocking the door…',1);

var last=performance.now(),rr=0;
var perf={n:0,sum:0,checked:0,start:performance.now()};
/* --- staged render fallback: step down until the frame is not blank --- */
var DBG_NOPOST=true;
var RSTAGE=0,RNAMES=['post','direct','no-overlays','plain-sky'];
var usePost=!!ATM.composer&&!DBG_NOPOST;
if(DBG_NOPOST)RSTAGE=1;
if(!usePost)renderer.outputEncoding=THREE.sRGBEncoding;
var _px=new Uint8Array(4*64),blackN=0,brightN=0,rsDone=false,_gradTex=null;
function gradientSky(){
  if(_gradTex)return _gradTex;
  var c=document.createElement('canvas');c.width=4;c.height=256;var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#2a5c9c');g.addColorStop(.45,'#7fb0da');g.addColorStop(.62,'#cfdcea');
  g.addColorStop(.75,'#8a8470');g.addColorStop(1,'#3b382e');
  x.fillStyle=g;x.fillRect(0,0,4,256);
  _gradTex=new THREE.CanvasTexture(c);_gradTex.encoding=THREE.sRGBEncoding;
  _gradTex.mapping=THREE.EquirectangularReflectionMapping;return _gradTex}
function stepDown(){
  RSTAGE++;blackN=0;
  if(RSTAGE===1){usePost=false;renderer.outputEncoding=THREE.sRGBEncoding}
  else if(RSTAGE===2){scene.traverse(function(o){if(o.isMesh&&o.renderOrder>=8000)o.visible=false})}
  else if(RSTAGE===3){if(ATM.skyMesh)ATM.skyMesh.visible=false;scene.background=gradientSky();
    var amb=new THREE.HemisphereLight(0xbcd4f0,0x4a3f33,.85);scene.add(amb);}
  else{rsDone=true;return}
  toast('Display fallback: '+RNAMES[RSTAGE]);
}
function sampleBright(){
  var gl=renderer.getContext(),w=gl.drawingBufferWidth,h=gl.drawingBufferHeight,mx=0,i,k;
  var pts=[[.5,.5],[.25,.4],[.75,.4],[.5,.25],[.5,.7]];
  for(k=0;k<pts.length;k++){
    var px=Math.max(0,Math.min(w-8,(w*pts[k][0])|0)),py=Math.max(0,Math.min(h-8,(h*pts[k][1])|0));
    gl.readPixels(px,py,8,8,gl.RGBA,gl.UNSIGNED_BYTE,_px);
    for(i=0;i<_px.length;i+=4){
      if(_px[i]>mx)mx=_px[i];if(_px[i+1]>mx)mx=_px[i+1];if(_px[i+2]>mx)mx=_px[i+2]}}
  return mx}
function checkBlack(){
  if(rsDone)return;
  if(renderer.info.render.frame<30)return;
  var thr=ATM.state.day>0.25?14:4,mx;
  try{mx=sampleBright()}catch(e){rsDone=true;return}
  if(mx<thr){blackN++;brightN=0;if(blackN>20)stepDown()}
  else{brightN++;if(brightN>6)rsDone=true}
}
function frame(){
  requestAnimationFrame(frame);
  var ms=performance.now(),dt=Math.min(.05,(ms-last)/1000),t=ms/1000;last=ms;
  WIND.t.value=t;WIND.w.value=.85+.35*Math.sin(t*.13)+.15*Math.sin(t*.71);
  if(TX.waterNormal)TX.waterNormal.offset.set(t*.012,t*.008);
  var i;
  /* agents */
  for(i=0;i<AGENTS.length;i++){
    var a=AGENTS[i];
    var look=drivePose(a,t,dt);
    KIT.applyRig(a.K,a.S,dt,look,null);
    KIT.faceTick(a.K,dt,a.mood);
    if(a.holdMug){
      var w2=a.K.arms[0].wr.localToWorld(_lk.set(-.045,-.075,.02));
      a.desk.grp.worldToLocal(w2);a.desk.mug.position.lerp(w2,1-Math.exp(-20*dt))}
    else a.desk.mug.position.lerp(a.desk.mugRest,1-Math.exp(-10*dt));
    a.phone.visible=(a.status==='idle'&&a.idle&&a.idle.kind==='phone');
    if(a.holo){
      var on=a.status==='planning';
      a.holo.scale.setScalar(damp(a.holo.scale.x,on?1:.01,4,dt));
      a.holo.visible=a.holo.scale.x>.03;a.holo.rotation.y+=dt*.9}}
  /* villagers */
  for(i=0;i<VILLAGERS.length;i++){
    var v=VILLAGERS[i],P=v.pts;
    var A=P[v.seg],Bp=P[(v.seg+1)%P.length];
    v.u+=v.speed*dt/Math.max(.01,A.distanceTo(Bp));
    while(v.u>=1){v.u-=1;v.seg=(v.seg+1)%P.length;A=P[v.seg];Bp=P[(v.seg+1)%P.length]}
    _lk.copy(A).lerp(Bp,v.u);v.K.root.position.set(_lk.x,_lk.y,_lk.z);
    var hd=Math.atan2(Bp.x-A.x,Bp.z-A.z),dh=hd-v.K.root.rotation.y;
    dh=Math.atan2(Math.sin(dh),Math.cos(dh));
    v.K.root.rotation.y+=dh*(1-Math.exp(-8*dt));
    v.walk.speed=v.speed;
    var lt=Math.sin(t*.2+v.seed)>.6?V3(14.6,6.6,3):null;
    KIT.applyRig(v.K,v.S,dt,lt,v.walk);
    KIT.faceTick(v.K,dt,'neutral')}
  ambientFrame(t,dt);
  /* screens: round-robin budget */
  var budget=6;
  for(i=0;i<AGENTS.length&&budget>0;i++){
    var ag=AGENTS[(rr+i)%AGENTS.length];
    var focus=DIR.shot&&DIR.shot.agent===ag;
    var act=ACTIVE.has(ag.status)||ag.status==='waiting'||ag.status==='celebrate'||focus;
    for(var si=0;si<ag.desk.screens.length;si++){
      var sc=ag.desk.screens[si];
      sc.acc2=(sc.acc2||0)+dt*AGENTS.length/6;
      if(act||sc.acc2>2.5){drawScreen(sc,ag,Math.min(sc.acc2||dt,1));sc.acc2=0;budget--}}}
  rr=(rr+6)%AGENTS.length;
  if(DIR.shot&&DIR.shot.agent)
    for(i=0;i<DIR.shot.agent.desk.screens.length;i++)drawScreen(DIR.shot.agent.desk.screens[i],DIR.shot.agent,dt);
  /* camera */
  if(DIR.on)directorFrame(dt);
  else{
    if(tween){tween.k=Math.min(1,tween.k+dt*.8);
      var e2=1-Math.pow(1-tween.k,3);
      camera.position.lerpVectors(tween.p0,tween.p1,e2);
      controls.target.lerpVectors(tween.t0,tween.t1,e2);
      if(tween.k>=1)tween=null}
    else if(follow&&selected)controls.target.lerp(selected.K.head.localToWorld(V3(0,.05,0)),.08);
    camera.fov=damp(camera.fov,42,3,dt);camera.updateProjectionMatrix();controls.update()}
  ATM.update(t,dt);GAME.post(t,dt);
  if(usePost)ATM.render();
  else{renderer.setRenderTarget(null);renderer.autoClear=true;
       renderer.clear(true,true,true);renderer.render(scene,camera);}
  checkBlack();
  updateTags();
  perf.n++;perf.sum+=dt;
  if(perf.n>=150){
    var avg=perf.sum/perf.n;perf.n=0;perf.sum=0;$('#sFly').textContent=ORBS.length;
    if(ms-perf.start>9000&&avg>1/32&&perf.checked<2){
      var o2=['lite','high','ultra'],ix=o2.indexOf(qName);
      if(ix>0){qName=o2[ix-1];applyQuality();toast('Switched to '+qName+' quality for smoother motion');perf.checked++}}}
}
frame();

/* ---- URL overrides + diagnostics (?sky=day&hour=14&diag=1&dir=0) ---- */
(function(){
  var Q={},qs=location.search.replace(/^\?/,'').split('&'),i,kv;
  for(i=0;i<qs.length;i++){if(!qs[i])continue;kv=qs[i].split('=');Q[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'')}
  var DEBUG=false;  /* DEBUG-FLAG */
  if(DEBUG){if(!Q.sky)Q.sky='day';if(!Q.diag)Q.diag='1';if(Q.dir===undefined)Q.dir='0';
    if(!Q.cam)Q.cam='14,8.5,15.4,0,5,-4';}
  if(Q.sky){ATM.setMode(Q.sky);$('#skyBtn').textContent='Sky: '+Q.sky}
  if(Q.hour!==undefined&&Q.hour!==''){ATM.setHour(parseFloat(Q.hour))}
  if(Q.q&&QUAL[Q.q]){qName=Q.q;applyQuality()}
  if(Q.dir==='0')setDirector(false);
  if(Q.cam){var c=Q.cam.split(',').map(parseFloat);
    if(c.length>=3){setDirector(false);camera.position.set(c[0],c[1],c[2]);
      controls.target.set(c[3]||0,c[4]||6,c[5]||0);controls.update()}}
  if(Q.marker||Q.diag){
    /* unlit red ball + white ground quad: if these show, the pipeline is fine and lighting is the fault */
    var mk=new THREE.Mesh(new THREE.SphereBufferGeometry(3,24,16),
      new THREE.MeshBasicMaterial({color:0xff0044}));
    mk.position.set(0,12,0);mk.renderOrder=999;scene.add(mk);
    var mk2=new THREE.Mesh(new THREE.PlaneBufferGeometry(30,30),
      new THREE.MeshBasicMaterial({color:0x00ff88,side:THREE.DoubleSide}));
    mk2.rotation.x=-PI/2;mk2.position.set(0,.5,20);scene.add(mk2);
    var mk3=new THREE.Mesh(new THREE.SphereBufferGeometry(3,24,16),
      new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6}));
    mk3.position.set(9,12,0);scene.add(mk3);
  }
  if(Q.diag){
    var d=document.createElement('pre');
    d.style.cssText='position:fixed;left:14px;bottom:170px;z-index:40;background:rgba(0,0,0,.84);'+
      'color:#9fe8a0;font:10px/1.35 monospace;padding:9px 11px;border-radius:6px;max-width:62vw;'+
      'max-height:52vh;overflow:auto;white-space:pre-wrap;pointer-events:none';
    document.body.appendChild(d);
    setInterval(function(){
      var tris=0,meshes=0,lines=[];
      scene.traverse(function(o){
        if(o.isMesh&&o.geometry&&o.geometry.index){meshes++;tris+=o.geometry.index.count/3}
        else if(o.isMesh&&o.geometry&&o.geometry.attributes.position){meshes++;tris+=o.geometry.attributes.position.count/3}});
      var bn=Object.keys(MERGED),k;
      for(k=0;k<bn.length;k++){var mm=MERGED[bn[k]];
        lines.push(bn[k]+' '+((mm.geometry.index?mm.geometry.index.count/3:0)|0)+'t vis='+mm.visible)}
      var ri=renderer.info.render;
      d.textContent=
        'CALLS '+ri.calls+'  TRIS '+ri.triangles+'  frame '+ri.frame+'\n'+
        'canvas css '+renderer.domElement.clientWidth+'x'+renderer.domElement.clientHeight+
        '  buf '+renderer.domElement.width+'x'+renderer.domElement.height+'\n'+
        'stageKids '+$('#stage').children.length+'  dpr '+renderer.getPixelRatio()+'\n'+
        'sun.i '+ATM.sun.intensity.toFixed(2)+'  hemi.i '+ATM.hemi.intensity.toFixed(2)+'\n'+
        'sunPos '+ATM.sun.position.toArray().map(function(v){return v.toFixed(0)}).join(',')+'\n'+
        'exposure '+renderer.toneMappingExposure.toFixed(3)+'  tm '+renderer.toneMapping+'\n'+
        'composer '+(!!ATM.composer)+' stage '+RNAMES[RSTAGE]+' env '+(!!scene.environment)+'\n'+
        'fog '+(scene.fog?scene.fog.density.toFixed(4):'none')+'  bg '+(scene.background?'set':'null')+'\n'+
        'skyMesh vis '+(ATM.skyMesh?ATM.skyMesh.visible:'?')+' pos '+(ATM.skyMesh?ATM.skyMesh.position.toArray().map(function(v){return v.toFixed(0)}).join(','):'')+'\n'+
        'cam '+camera.position.toArray().map(function(v){return v.toFixed(1)}).join(',')+' fov '+camera.fov.toFixed(0)+'\n'+
        'paper.ei '+MATS.paper.emissiveIntensity.toFixed(2)+'  plasterMap '+(!!MATS.plaster.map)+'\n'+
        '--- scene ---\n'+
        'meshes '+meshes+'  tris '+(tris|0)+'\n'+
        'buckets '+bn.length+' of '+Object.keys(VALID_BUCKETS).length+'\n'+
        'hour '+ATM.state.hour.toFixed(2)+' night '+ATM.state.night.toFixed(2)+' day '+ATM.state.day.toFixed(2);
    },500)}
})();

window.__th={GAME:GAME,CLUBBERS:CLUBBERS,AGENTS:AGENTS,BRANCHES:BRANCHES,DIR:DIR,ATM:ATM,camera:camera,scene:scene,MERGED:MERGED,MATS:MATS,
  renderer:renderer,newShot:newShot,setDirector:setDirector,runTask:runTask,KIT:KIT,
  snap:function(m){if(m)ATM.setMode(m)}};

})();
