name: Deploy preview to Cloudflare

on:
  push:
    branches: [main, claude/brave-euler-d31dm2]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build concept preview
        run: node src/build.mjs --demo --out dist
      - name: Deploy to seanslandscaping.hunchopeak.dev
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.157.0 deploy
      - name: Deploy temporary preview (no Cloudflare token configured yet)
        # Each temporary deploy creates a new throwaway account, so only do it when asked: put [deploy] in the commit message.
        if: env.CLOUDFLARE_API_TOKEN == '' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]'))
        run: npx --yes wrangler@4.157.0 deploy --temporary --config wrangler.temporary.jsonc
